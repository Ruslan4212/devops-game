,"ls -l  в домашней папке","cat /etc/hostname"],answer:0,explain:"top/htop — живая картина нагрузки. Дальше — df (диск), free (память), journalctl (логи)."}]),aa=Be(2,"Права доступа и процессы",[{d:1,text:"Что делает  chmod ?",options:["Меняет права доступа к файлу","Меняет владельца файла","Меняет имя файла"],answer:0,explain:"chmod — change mode (права). Владельца меняет chown."},{d:2,text:"В правах  rwxr-x---  — что может делать «группа» (средняя тройка  r-x )?",options:["Читать и выполнять, но не изменять","Всё","Ничего"],answer:0,explain:"r — читать, w — писать, x — выполнять. r-x = чтение + выполнение, без записи."},{d:3,text:"ps  показывает процесс со статусом  Z  (zombie). Что это?",options:["Процесс завершился, но родитель ещё не забрал его код возврата","Процесс завис и грузит CPU","Вредоносный процесс"],answer:0,explain:"Зомби не потребляет ресурсы; исчезает, когда родитель сделает wait(). Много зомби — баг в родителе."},{d:4,text:"Процесс с  PID 4210  завис. Как попросить его завершиться корректно?",options:["kill 4210","kill -9 4210 сразу","rm 4210"],answer:0,explain:"kill (сигнал TERM) — вежливая просьба завершиться. kill -9 (KILL) — крайняя мера, без уборки за собой."},{d:5,text:"Скрипт не запускается: «Permission denied», хотя файл на месте и путь верный. Права  rw-r--r-- . Что не так?",options:["Нет бита выполнения — нужен  chmod +x script.sh","Файл принадлежит root","Скрипт написан с ошибкой"],answer:0,explain:"Чтобы файл исполнялся, нужен бит x. chmod +x добавляет его."},{d:6,text:"Сервис  web  в состоянии  failed . Правильный порядок разбора?",options:["systemctl status web → journalctl -u web → починить конфиг → systemctl restart web","systemctl restart web несколько раз подряд","kill все процессы web и перезагрузить сервер"],answer:0,explain:"Сначала статус и журнал (там причина), потом точечная правка, потом рестарт."},{d:7,text:"Сервис с  Restart=always  и сломанным конфигом: перезапусков 900+, журнал распух, диск заполняется. Первое действие?",options:["Остановить сервис ( systemctl stop ), чтобы прекратить шторм, потом чинить конфиг","Добавить ещё места на диск","Увеличить RestartSec"],answer:0,explain:"Сначала останови шторм (stop), иначе диск кончится. Потом конфиг и ограничитель StartLimitBurst."}]),la=Be(3,"Bash-скрипты",[{d:1,text:"С чего принято начинать bash-скрипт?",options:["#!/bin/bash — шебанг, указывает интерпретатор","// bash","import bash"],answer:0,explain:"Шебанг в первой строке говорит системе, чем исполнять файл."},{d:2,text:"Как обратиться к первому аргументу скрипта?",options:["$1","$arg1","%1"],answer:0,explain:"$1, $2, ... — позиционные аргументы. $0 — имя самого скрипта, $# — их количество."},{d:3,text:"Скрипт вывел  exit code 1 . Что это значит?",options:["Скрипт завершился с ошибкой (0 — успех, не 0 — ошибка)","Выполнена 1 команда","Всё хорошо"],answer:0,explain:"Код возврата 0 — успех. Любое ненулевое — какая-то ошибка. Проверяется через $?."},{d:4,text:"Нужно, чтобы скрипт останавливался на первой же ошибке. Что добавить в начало?",options:["set -e","set +e","stop on error"],answer:0,explain:"set -e — выход при первой неуспешной команде. Часто добавляют set -euo pipefail."},{d:5,text:"В скрипте  rm -rf $DIR/  — почему это опасно?",options:["Если $DIR пустая, получится  rm -rf /  — сотрёт корень. Нужны кавычки и проверка","rm -rf вообще нельзя использовать","Надо писать RM большими буквами"],answer:0,explain:'Всегда: "${DIR:?переменная пуста}" и кавычки вокруг переменных. Пустая переменная — классическая катастрофа.'},{d:6,text:"Скрипт бэкапа должен: 1) создать архив, 2) проверить что архив создан, 3) удалить старые. Что важно между шагами?",options:["Проверять код возврата каждого шага и не удалять старьё, если архив не создался","Выполнять всё в одну строку через  ;","Запускать три раза для надёжности"],answer:0,explain:"Идемпотентность и проверки: удаление старых бэкапов только после успешного нового."},{d:7,text:"Ночной крон-скрипт «молча» перестал делать бэкапы неделю назад. Как расследовать в первую очередь?",options:["Посмотреть логи крона/скрипта и его exit code — скрипт наверняка падал, но никто не смотрел","Переписать скрипт с нуля","Отключить крон"],answer:0,explain:"«Тихий» сбой = нет мониторинга результата. Логи + код возврата + алерт на отсутствие свежего бэкапа."}]),ca=Be(4,"Сети",[{d:1,text:"Что делает DNS?",options:["Превращает доменное имя в IP-адрес","Шифрует трафик","Раздаёт пароли"],answer:0,explain:"DNS — телефонная книга интернета: example.com → 93.184.216.34."},{d:2,text:"Команда  curl -I https://site  — что запрашивает флаг  -I ?",options:["Только заголовки ответа, без тела","Игнорировать ошибки","Инкогнито-режим"],answer:0,explain:"-I (HEAD) — быстро посмотреть статус и заголовки, не качая страницу."},{d:3,text:"curl  вернул  HTTP/1.1 502 Bad Gateway . Кто, скорее всего, виноват?",options:["Прокси/балансировщик получил плохой ответ от приложения за ним (или оно лежит)","У тебя нет интернета","Неправильный пароль"],answer:0,explain:"502 — шлюз не смог получить валидный ответ от апстрима. Смотри бэкенд-сервис."},{d:4,text:"Хочешь проверить, слушает ли кто-то порт 8080 на этом сервере. Команда?",options:["ss -ltnp | grep 8080","ping 8080","curl 8080"],answer:0,explain:"ss (или netstat) показывает слушающие сокеты. l — listening, t — tcp, n — числа, p — процесс."},{d:5,text:"«Сайт не открывается». ping домена идёт, а  curl https://домен  висит и отваливается по таймауту. Где проблема?",options:["DNS и сеть до хоста живы; не отвечает сам сервис на 443 (или файрвол режет порт)","Проблема в DNS","Кабель не воткнут"],answer:0,explain:"ping (ICMP) прошёл → маршрут есть. Висит именно TCP на 443 → сервис/файрвол, а не имя."},{d:6,text:"Диагностика «не работает связь с API» по слоям — правильный порядок?",options:["DNS резолвится? → хост пингуется? → порт открыт (ss/telnet)? → приложение отвечает (curl)?","curl → перезагрузить сервер → написать в поддержку","Сразу менять код приложения"],answer:0,explain:"Снизу вверх по OSI: имя → маршрут → порт → приложение. Так находишь слой, где рвётся."},{d:7,text:"После деплоя половина запросов к сервису падает с таймаутом, половина — ок. Первая гипотеза?",options:["Один из подов/бэкендов за балансировщиком нездоров, а трафик всё равно на него идёт","Весь интернет сломался","DNS отдаёт неправильный адрес всем"],answer:0,explain:"«Ровно половина» пахнет одним из N бэкендов. Проверь health-check и выведи больной инстанс из ротации."}]),ha=Be(5,"Git",[{d:1,text:"Что такое коммит?",options:["Сохранённый снимок изменений с сообщением","Ветка","Удалённый сервер"],answer:0,explain:"Коммит фиксирует состояние файлов + автора + сообщение + ссылку на родителя."},{d:2,text:"Команда  git status  показывает…",options:["Что изменено, что в индексе, на какой ты ветке","Историю коммитов","Список веток на сервере"],answer:0,explain:"status — текущее состояние рабочей копии. История — git log."},{d:3,text:"git push  выдаёт  rejected (non-fast-forward) . Что это значит?",options:["На сервере есть коммиты, которых нет у тебя — сначала  git pull","У тебя нет прав","Ветка не существует"],answer:0,explain:"Твоя ветка отстала. Забери чужие изменения (pull/rebase), реши конфликты, потом push."},{d:4,text:"Начинаешь новую фичу. Правильное первое действие?",options:["git checkout -b feature/…  — отдельная ветка от main","Коммитить прямо в main","git reset --hard"],answer:0,explain:"Фича = своя ветка + PR. main остаётся стабильным и релизопригодным."},{d:5,text:"Ты закоммитил в main файл  .env  с паролём базы. Что действительно решает проблему?",options:["Считать пароль скомпрометированным и сменить его; убрать файл из истории и добавить в .gitignore","Просто  git rm .env  следующим коммитом","Сделать репозиторий приватным"],answer:0,explain:"Секрет в истории git = утёкший секрет. Ротация обязательна; удаление из истории — уже вторично."},{d:6,text:"В файле после  git merge  появились  <<<<<<< , =======, >>>>>>> . Что делать?",options:["Это конфликт: вручную выбрать нужный код, убрать маркеры, git add файл, завершить merge","Удалить файл целиком","git push --force"],answer:0,explain:"Маркеры конфликта разделяют твою и чужую версии. Редактируешь руками → add → commit."},{d:7,text:"Коллега сделал  git push --force  в общую ветку  main , и у всех сломалась история. Как команде выходить?",options:["Найти у кого-то целый локальный main, восстановить его на сервере; договориться запретить force-push в main","Каждому сделать reset --hard на текущий сломанный main","Удалить репозиторий и создать заново"],answer:0,explain:"force-push в общую ветку — почти всегда авария. Защита ветки в настройках репозитория предотвращает это."}]),da=Be(6,"Docker",[{d:1,text:"Чем образ (image) отличается от контейнера (container)?",options:["Образ — неизменный шаблон; контейнер — запущенный из него экземпляр","Это синонимы","Контейнер больше по размеру, чем образ"],answer:0,explain:"Образ как класс, контейнер как объект. Из одного образа — сколько угодно контейнеров."},{d:2,text:"Что делает  docker ps ?",options:["Показывает запущенные контейнеры","Скачивает образ","Собирает образ"],answer:0,explain:"docker ps — запущенные; docker ps -a — включая остановленные."},{d:3,text:"docker ps -a  показывает контейнер со статусом  Exited (137) . О чём говорит 137?",options:["Контейнер убит сигналом KILL (128+9) — часто из-за нехватки памяти (OOM)","Успешное завершение","Контейнер ещё работает"],answer:0,explain:"137 = 128 + 9 (SIGKILL). Проверь docker logs и лимиты памяти."},{d:4,text:"Нужно запустить nginx и пробросить порт 8080 хоста на 80 контейнера. Команда?",options:["docker run -p 8080:80 nginx","docker run -p 80:8080 nginx","docker run nginx --port 8080"],answer:0,explain:"-p ХОСТ:КОНТЕЙНЕР. Снаружи стучимся на 8080, внутри nginx слушает 80."},{d:5,text:"Образ приложения весит 1.2 ГБ. Главная причина и лечение?",options:["База типа  ubuntu  + сборочные инструменты в финальном образе; лечится slim/alpine и multi-stage build","Слишком длинное имя образа","Не хватает флага --compress"],answer:0,explain:"Multi-stage: собираем в одном слое, в финальный копируем только артефакт. Плюс .dockerignore."},{d:6,text:"Контейнер падает сразу после старта. Порядок разбора?",options:["docker logs КОНТЕЙНЕР → понять ошибку → поправить Dockerfile/переменные → пересобрать и перезапустить","docker restart в цикле","Удалить Docker и поставить заново"],answer:0,explain:"Логи контейнера — первое. Обычно не хватает переменной окружения или файла конфигурации."},{d:7,text:"Прод-инцидент: свежий образ  app:latest  на части серверов старый, на части новый — поведение плавает. Причина?",options:["Тег  latest  не версионирует; серверы скачали образ в разное время. Нужны неизменяемые теги (app:1.4.2)","Docker сломан","Надо чаще перезапускать контейнеры"],answer:0,explain:"latest — движущаяся цель. В проде только фиксированные теги/дайджесты, иначе воспроизводимости нет."}]),ua=Be(7,"CI/CD",[{d:1,text:"Что такое CI (continuous integration)?",options:["Автоматический прогон сборки и тестов на каждое изменение в репозитории","Ручной деплой раз в месяц","Система хранения секретов"],answer:0,explain:"CI ловит поломки рано: каждый push → сборка + тесты автоматически."},{d:2,text:"Где в CI-пайплайне хранят пароли и токены?",options:["В секретах CI (secrets), подставляются в переменные окружения на время job","Прямо в YAML пайплайна","В README"],answer:0,explain:"Секрет в коде = утёкший секрет. Только защищённое хранилище секретов CI."},{d:3,text:"Пайплайн красный, в логе:  npm test  →  1 failing . Что произошло?",options:["Упал тест — сборку дальше не пускают, надо чинить код или тест","Проблема с сетью","Кончилось место"],answer:0,explain:"Красный тест блокирует пайплайн намеренно — чтобы сломанный код не поехал дальше."},{d:4,text:"Хочешь, чтобы workflow запускался на каждый push. Что задаёт триггер?",options:["Секция  on: push  в файле workflow","Кнопка в интерфейсе каждый раз","cron раз в час"],answer:0,explain:"on: определяет события. on: push — на любой push; on: pull_request — на PR."},{d:5,text:"Тесты «иногда падают, иногда нет» без изменений кода. Как правильно?",options:["Это flaky-тест: найти причину нестабильности и починить/изолировать, не перезапускать вслепую","Ставить  retry: 5  на все тесты","Удалить эти тесты"],answer:0,explain:"Флэки-тесты убивают доверие к CI. Их чинят или карантинят с заведённой задачей, а не маскируют ретраями."},{d:6,text:"Правильный конвейер от коммита до прода:",options:["push → сборка → тесты → артефакт → деплой на staging → проверка → деплой на prod","push → сразу деплой на prod → потом тесты","тесты локально → архив по почте → ручная заливка на prod"],answer:0,explain:"Каждый шаг — ворота. На prod попадает только то, что прошло все предыдущие."},{d:7,text:"После автодеплоя на prod полезли ошибки. Пайплайн зелёный. Первое действие дежурного?",options:["Откатить релиз (rollback / предыдущий артефакт), убедиться что полегчало, потом разбираться почему тесты не поймали","Срочно писать hotfix прямо на проде","Ждать, вдруг само пройдёт"],answer:0,explain:"Сначала останови боль — откат. Зелёный пайплайн ≠ рабочий релиз; пробел в тестах закрывают потом."}]),fa=Be(8,"Terraform и инфраструктура как код",[{d:1,text:"Что такое «инфраструктура как код»?",options:["Серверы, сети, диски описаны файлами в git, а не настроены кликами в панели","Код приложения на сервере","Способ ускорить сайт"],answer:0,explain:"IaC делает инфраструктуру воспроизводимой и отслеживаемой, как обычный код."},{d:2,text:"Что делает  terraform plan ?",options:["Показывает, что изменится, ничего при этом не применяя (сухой прогон)","Создаёт всю инфраструктуру","Удаляет state"],answer:0,explain:"plan — предпросмотр. Реально меняет только apply."},{d:3,text:"В выводе plan строка  - aws_db_instance.main . Что означает знак минус?",options:["Ресурс будет УДАЛЁН","Ресурс будет создан","Ресурс не изменится"],answer:0,explain:"+ создать, ~ изменить, - удалить. Строки с минусом читай особенно внимательно."},{d:4,text:"Значение  prod  повторяется в конфиге 30 раз. Как правильно?",options:['Вынести в  variable "env"  и использовать  var.env',"Найти-заменить каждый раз вручную","Скопировать файл и держать две версии"],answer:0,explain:"Переменная — одно место правды. Плюс -var env=staging для другого окружения."},{d:5,text:"Коллега предлагает хранить  terraform.tfstate  просто в git рядом с кодом. Почему плохо?",options:["В state лежат секреты в открытом виде, и нет блокировки — двое сделают apply одновременно","git не умеет хранить .tfstate","Это слишком медленно"],answer:0,explain:"state → удалённый бэкенд (S3/GCS) с шифрованием и локом. В git — никогда."},{d:6,text:"Как команде безопасно применять изменения Terraform?",options:["plan автоматически в PR на ревью → после merge CI делает apply; на prod — ручной approval","Каждый делает apply со своего ноутбука","apply по расписанию раз в неделю без ревью"],answer:0,explain:"Инфраструктурные изменения проходят ревью как код. Человек видит plan до применения."},{d:7,text:"plan неожиданно хочет удалить  local_file.database , который нужен. Что делать?",options:["НЕ применять; понять, почему ресурс исчез из .tf (случайно убрали при merge?), вернуть блок, перепроверить plan","Применить — Terraform знает лучше","Удалить state и начать заново"],answer:0,explain:"«Нет в .tf» = «удалить». Строку с минусом всегда объясняешь до apply. Защита — lifecycle prevent_destroy."}]),pa=Be(9,"Kubernetes",[{d:1,text:"Что такое Pod?",options:["Минимальная единица Kubernetes — обёртка вокруг (обычно) одного контейнера","Физический сервер","Файл конфигурации"],answer:0,explain:"Kubernetes управляет подами, а не контейнерами напрямую. Под эфемерен."},{d:2,text:"За что отвечает Deployment?",options:["Держать заданное число подов, пересоздавать упавшие, катить и откатывать версии","Хранить секреты","Раздавать внешние IP"],answer:0,explain:"Deployment — про количество и обновление подов. Доступ по стабильному адресу — Service."},{d:3,text:"kubectl get pods  показывает под в статусе  CrashLoopBackOff , RESTARTS 8. Что это?",options:["Контейнер стартует и сразу падает; Kubernetes перезапускает с растущей паузой","Под успешно работает","Под ждёт свободного узла"],answer:0,explain:"Причина — в  kubectl logs . Часто: нет переменной окружения, битый образ, недоступна база."},{d:4,text:"Нагрузка выросла, нужно 6 копий вместо 3 прямо сейчас. Команда?",options:["kubectl scale deployment/api --replicas=6","kubectl restart api 6","kubectl get pods --all"],answer:0,explain:"scale меняет живой кластер. Но потом верни число и в манифест — иначе apply откатит к старому."},{d:5,text:"Ты сделал  kubectl scale ... --replicas=6 , затем  kubectl apply -f deploy.yaml  (там replicas: 3). Сколько подов останется?",options:["3 — apply привёл кластер к состоянию из файла","6 — scale приоритетнее","9 — суммируется"],answer:0,explain:"apply декларативен: файл — источник правды. Ручной scale он перетирает."},{d:6,text:"Выкатили новую версию образа, поды в CrashLoopBackOff. Диагностика по шагам?",options:["kubectl get pods → kubectl logs ПОД → kubectl describe pod ПОД → починить манифест → kubectl apply","kubectl delete deployment и создать заново","перезагрузить все узлы кластера"],answer:0,explain:"Статус → логи (там причина) → события (describe) → правка → apply. Или быстрый  rollout undo ."},{d:7,text:"3 часа ночи, весь Deployment в CrashLoopBackOff после релиза, сервис лежит. Первое действие?",options:["kubectl rollout undo deployment/api  — вернуться на рабочую версию, потом спокойно разбираться","Ночью переписать манифест и приложение","Ждать до утра"],answer:0,explain:"Сначала митигация: откат. Чинить манифест «форвардом» — работа на утро, не под давлением."}]),_a=Be(10,"Дежурство и надёжность",[{d:1,text:"Что такое дежурство (on-call)?",options:["Инженеры по очереди отвечают за прод: тебе приходит page, если что-то сломалось","Ночная смена в офисе","Собрание раз в неделю"],answer:0,explain:"В каждый момент есть один конкретный ответственный, нагрузка делится ротацией."},{d:2,text:"Чем  critical -алерт отличается от  warning ?",options:["critical будит немедленно (сервис лежит), warning — задача на рабочее время","Ничем, просто цвет","warning важнее critical"],answer:0,explain:"Severity задаёт срочность реакции. Warning без влияния на пользователя ждёт утра."},{d:3,text:"metrics  показывает  error_rate 32%, latency_p99 4200ms, pods_ready 0/4 . Что это значит?",options:["Сервис фактически лежит — три сигнала из четырёх в красной зоне","Всё в норме","Небольшая деградация"],answer:0,explain:"Золотые сигналы: latency, traffic, errors, saturation. Здесь — авария."},{d:4,text:"Что такое «бюджет ошибок» (error budget)?",options:["Допустимая доля сбоев из SLO; пока не исчерпан — можно катить фичи, исчерпан — стоп-релизы","Деньги на исправление багов","Лимит числа инцидентов на инженера"],answer:0,explain:"SLO 99.9% → 0.1% бюджет (~43 мин/мес). Общее число вместо спора «фичи против стабильности»."},{d:5,text:"Митигация не помогает уже 15 минут, инцидент растёт. Что делает зрелый дежурный?",options:["Эскалирует — поднимает следующего по цепочке, не геройствует молча","Продолжает в одиночку, чтобы никого не будить","Закрывает алерт и идёт спать"],answer:0,explain:"Своевременная эскалация — норма, а не слабость. Плюс статус-апдейты каждые 15–30 минут."},{d:6,text:"Полный цикл реакции на инцидент — по порядку:",options:["обнаружить (alerts) → оценить (metrics) → митигировать → проверить → разобрать (постмортем)","разобрать причину → написать код → задеплоить → закрыть алерт","перезагрузить сервер → подождать → эскалировать"],answer:0,explain:"Главное правило: сначала останови боль, потом ищи причину. Постмортем — blameless."},{d:7,text:"3:12 ночи, page  HighErrorRate . В логах пода  FATAL: DB_URL не задана , релиз был 2 минуты назад. Первое действие?",options:["Быстро зафиксировать симптом (logs) и откатить релиз ( rollout undo ); правку манифеста и постмортем — на утро","Сесть чинить манифест и выкатывать форвардом прямо сейчас","Написать в общий чат и ждать ответа"],answer:0,explain:"Причина уже ясна, но чинить под давлением рискованно. Откат — быстрая безопасная митигация."}]),ga=Be(11,"Prometheus и метрики",[{d:1,text:"Чем метрика отличается от лога?",options:["Метрика — число во времени («как система себя ведёт»), лог — запись о конкретном событии","Это одно и то же","Лог хранится в базе, метрика в файле"],answer:0,explain:"Метрика первой покажет, что стало плохо; лог потом объяснит, почему именно."},{d:2,text:"Что такое экспортёр (exporter)?",options:["Программа, которая отдаёт метрики по HTTP на /metrics — Prometheus сам за ними приходит","Программа, которая отправляет метрики в Prometheus","Хранилище метрик"],answer:0,explain:"Prometheus работает на pull: инициатор опроса всегда он. Экспортёр просто отдаёт текст на /metrics."},{d:3,text:"Метрика  node_memory_MemAvailable_bytes  помечена как  # TYPE ... gauge . Что это значит?",options:["Значение может и расти, и падать — смотрят текущее значение","Значение только растёт — нужен rate()","Это гистограмма, нужен histogram_quantile"],answer:0,explain:"gauge — измеряемая величина (память, нагрузка, число подов). counter только растёт."},{d:4,text:"Нужно выбрать только запросы со статусом 500. Какой запрос PromQL?",options:['http_requests_total{status="500"}',"http_requests_total.status.500",'http_requests_total where status = "500"'],answer:0,explain:"Фильтр по лейблам пишут в фигурных скобках. Есть также != и =~ (регулярное выражение)."},{d:5,text:"Коллега строит график по  http_requests_total  напрямую и удивляется скачку вниз. В чём ошибка?",options:["Это counter: он обнуляется при перезапуске; смотреть надо rate(http_requests_total[5m])","График построен за слишком большой период","Надо было использовать histogram_quantile"],answer:0,explain:"Само значение счётчика бессмысленно и не сравнимо между инстансами. rate() даёт «в секунду»."},{d:6,text:"Что делает поле  for: 5m  в правиле алерта?",options:["Алерт сработает, только если условие держится 5 минут подряд — отсекает секундные всплески","Правило будет проверяться раз в 5 минут","Алерт автоматически погаснет через 5 минут"],answer:0,explain:"Без for дежурного будят на каждый случайный выброс — это прямая дорога к alert fatigue."},{d:7,text:"С дашборда пропали графики по одному серверу. Первое действие?",options:["promql 'up == 0' — узнать, какая цель не опрашивается, потом curl по её адресу руками","Перезапустить Prometheus","Переписать все дашборды"],answer:0,explain:"Алгоритм «нет метрик»: up == 0 → какая цель → curl по адресу → это неверный порт/адрес или мёртвый экспортёр."}]),ma=Be(12,"Grafana и дашборды",[{d:1,text:"Как делят обязанности Prometheus и Grafana?",options:["Prometheus хранит и считает метрики, Grafana их показывает","Grafana хранит метрики, Prometheus рисует","Это две части одной программы"],answer:0,explain:"Grafana — витрина. Упал Prometheus — дашборды останутся, но данных на них не будет."},{d:2,text:"Что такое datasource (источник данных) в Grafana?",options:["Описание того, откуда Grafana берёт метрики: тип системы и её адрес","Файл с готовыми графиками","Учётная запись пользователя"],answer:0,explain:"Для нашего случая это Prometheus на localhost:9090. Задаётся файлом provisioning."},{d:3,text:"Что лежит в поле  targets[].expr  панели дашборда?",options:["Запрос PromQL — панель отправляет его в источник данных и рисует ответ","Готовое число, которое надо показать","Ссылка на другой дашборд"],answer:0,explain:"Панель — оболочка вокруг запроса. Все вычисления делает источник данных."},{d:4,text:"Нужно понять, в какой момент начался рост ошибок. Какой тип панели?",options:["Time series (график) — только он показывает поведение во времени","Stat — одно текущее число","Gauge — шкала"],answer:0,explain:"Stat отвечает «сколько сейчас», график — «как менялось». Для поиска момента нужен график."},{d:5,text:"Панель «p95 задержки» показывает «0.213» без единицы измерения. Что не так?",options:["Непонятно, чего 0.213 — с ие 20 строк.","Акт 2. Создать каталог ~/app, положить туда deploy.sh, выставить ему права 750 (chmod) и убедиться через ls -l. Посмотреть свои процессы: ps -ef | grep $USER.","Акт 3. Дописать deploy.sh: шебанг, set -euo pipefail, аргумент $1 (окружение), проверка что цель задана, вывод даты. Запустить: ./deploy.sh prod.","Акт 4. Проверить сеть: curl -I http://localhost (или другой доступный адрес), посмотреть слушающие порты (ss -ltnp). В комментарии объяснить полученный HTTP-код.",'Акт 5. В ~/app: git init, положить index.html, git add . && git commit -m "capstone: init". Создать ветку feature/banner, изменить файл, закоммитить, слить в main.',"Акт 6. Написать Dockerfile для статики (FROM nginx:alpine, COPY index.html). Собрать: docker build -t capstone:1.0 . Запустить контейнер с пробросом порта, проверить curl-ом.","Акт 7. Создать .github/workflows/ci.yml: триггер on: push, шаг с проверкой синтаксиса (bash -n deploy.sh). В комментарии — где хранить секреты и почему не в репозитории.","Акт 8. Написать main.tf с ресурсом local_file (filename ~/app/build.txt, content — дата сборки). Выполнить terraform init, terraform plan (разобрать знаки), terraform apply.","Акт 9. Написать deploy.yaml (kind: Deployment, replicas: 2, образ capstone:1.0, env). Есть kubectl — применить и kubectl get pods; нет — объяснить каждое поле манифеста.","Акт 10. Свести всё в ~/app/capstone.sh: скрипт выполняет шаги 3, 5 и 8 без ручного ввода и печатает отчёт (что сделано, сколько заняло) — это твой мини-runbook."];function Rd(t){const e=document.createElement("div");e.className="cap-ov",e.tabIndex=-1,e.innerHTML='<div class="cap-box"><div class="cap-brief"><div class="cap-head"><b>Капстоун — реальный сервер</b><button class="cap-x" id="capX">закрыть</button></div><p>Ниже — <b>настоящий изолированный Linux-контейнер</b>, не симулятор. Примени всё из курса. Сессия ограничена по времени; контейнер удаляется после закрытия.</p><ol class="cap-tasks">'+Ed.map(l=>`<li>${l}</li>`).join("")+'</ol><di осят ли"],answer:1,why:"Зрелость измеряется тем, что происходит после ошибки. Сокрытие инцидента — быстрый способ потерять доверие команды."},{q:"Тебе дают задачу с технологией, которой ты не знаешь. Срок — неделя.",options:["Отказаться","Оценить риск вслух, взять с планом обучения и ранними точками проверки","Согласиться молча и надеяться","Попросить другую задачу"],answer:1,why:"Ценят прозрачность оценки, а не героическое молчание. Ранняя проверка гипотезы снижает риск для всех."},{q:"Коллега написал код, который тебе не нравится стилистически, но он работает и покрыт тестами.",options:["Заблокировать PR","Оставить необязательный комментарий и одобрить","Переписать самому","Промолчать навсегда"],answer:1,why:"Разделяй блокирующие замечания и вкусовые. Ревью — не место для навязывания личного стиля."},{q:"Руководитель просит ускорить релизы, а ты видишь, что упадёт качество.",options:["Согласиться","Показать цифры: где узкое место, чем рискуем, и предложить план ускорения без потери качества","Отказаться","Ускорить и молчать про риск"],answer:1,why:"Разговор на языке данных, а не мнений. Предлагать решение, а не только возражать."},{q:"На дежурстве ночью приходит алерт, который ты не понимаешь.",options:["Игнорировать до утра","Открыть runbook, оценить влияние на пользователей, при необходимости эскалировать","Перезагрузить всё","Отключить алерт"],answer:1,why:"Эскалация — часть процесса, а не признак слабости. Отключить алерт можно только после разбора, а не вместо него."},{q:"Почему ты хочешь уйти с текущего места?",options:["Там ужасная команда","Хочу задач другого масштаба: оркестрация, надёжность, автоматизация — и называю конкретику","Больше денег","Скучно"],answer:1,why:"Критика прошлого работодателя читается против кандидата. Мотивация «к», а не «от»."},{q:"Тебе достался проект без документации и с ушедшим автором. С чего начнёшь?",options:["Всё переписать","Составить карту: что запущено, где код, как деплоится, где логи — и описать это по ходу","Ждать инст Ты в компьютерах не разбираешься. У тебя открыт ноутбук, чёрное окно терминала и мигающий курсор, который смотрит на тебя как на самозванца. Но кто-то же должен.`},{id:"s1",act:"Акт I",title:"Первые деньги за терминал",needLessons:10,body:`Марат перевёл деньги и написал: «Ты меня спас». Ты потратил на это сорок минут и одну команду, которую подсмотрел вчера.

Впервые появляется мысль: а если это работа?`},{id:"s2",act:"Акт II",title:"Ты больше не гость на сервере",needLessons:30,body:`Ты замечаешь, что перестал гуглить tar. Пальцы набирают journalctl -u раньше, чем ты успеваешь подумать.

На созвоне разработчик говорит «у нас 502» — и ты уже знаешь, что спросить первым.`},{id:"s3",act:"Акт III",title:"Ночь, которая тебя сделала",needLessons:60,body:`03:40. Алерт. Ты один. Двенадцать процентов запросов падают, и где-то там, за графиками, люди не могут оформить заказ.

Ты не паникуешь. Смотришь, что менялось, откатываешь релиз. Ошибки уходят. Записываешь таймлайн, пока помнишь. Утром тимлид говорит одно слово: «Спасибо». Этого достаточно.`},{id:"s4",act:"Акт IV",title:"Тебя начинают спрашивать",needLessons:90,body:`К тебе подходит стажёр: «А почему у нас образы такие большие?» И ты вдруг объясняешь про слои, кэш и multi-stage — своими словами, без запинки.

Момент, когда ты понимаешь, что перешёл черту: тебя больше не учат, у тебя спрашивают.`},{id:"s5",act:"Финал",title:"Оффер на middle",needLessons:118,body:`Письмо приходит днём, между двумя задачами. Ты читаешь его дважды.

Год назад ты не знал, что такое pwd. Сегодня тебе доверяют инфраструктуру, на которой живут чужие деньги и чужой сон. Дальше — senior, платформа, архитектура. Но это уже другая история, и её ты напишешь сам.`}],Ud={1:"linux",2:"linux",3:"linux",4:"net",5:"git",6:"docker",7:"cicd",8:"iac",9:"k8s",10:"obs",11:"obs",12:"obs"};function qd(t){const e=new Set;for(const s of t.reqActs){const r=Ud[s];r&&e.add(r)}return[...e]}function Fd(t,e=Math.random){const s=[...Nd];for(let r=s.length-1;r>0;r--){const i=Math.floor(e()*(r+1));[s[r],s[i]]=[s[i],s[r]]}return s.slice(0,Math.min(t,s.length))}const Yr=[{id:"linux",name:"Linux: права, процессы, ресурсы",questions:[{q:"Чем сигнал SIGKILL (kill -9) отличается от SIGTERM (kill), кроме «жёсткости»?",options:["SIGKILL нельзя перехватить или проигнорировать — процесс не успевает закрыть файлы и соединения","SIGKILL доставляется быстрее по сети","SIGTERM работает только от root","Разницы нет, это синонимы"],answer:0,why:"SIGTERM процесс может обработать (сбросить буферы, корректно закрыться). SIGKILL обрабатывает ядро, процессу управление не передаётся — отсюда риск битых данных."},{q:"Процесс в состоянии Z (zombie). Что это и как «убрать»?",options:["Процесс завершился, но родитель не вызвал wait() — убирается перезапуском/починкой родителя, kill зомби не поможет","Процесс завис в бесконечном цикле — помогает kill -9","Процесс ждёт диск — помогает освободить место","Это вредоносный процесс, нужно искать руткит"],answer:0,why:"Зомби не занимает ресурсы, только слот в таблице процессов. Он исчезнет, когда родитель заберёт код возврата; массово зомби — это баг родителя."},{q:"df показывает 100%, но du по каталогам столько не набирает. Вероятная причина?",options:["Удалённый файл держит открытым живой процесс — место освободится после его перезапуска (lsof | grep deleted)","df всегда врёт, надо доверять du","Диск физически сломан","Не хватает inode, а не места"],answer:0,why:"Пока дескриптор открыт, ядро не освобождает блоки, хотя имени у файла уже нет. Классика: приложение пишет в уже удалённый лог."},{q:"Что означает Load Average 8.0 на сервере с 4 ядрами?",options:["В среднем 8 задач боролись за 4 ядра — очередь примерно вдвое длиннее, чем система тянет","Загрузка CPU ровно 800%","8 ГБ памяти занято","8 процессов запущено"],answer:0,why:"Load average — среднее число процессов в состоянии runnable + uninterruptible sleep. Ориентир перегрузки — значение выше числа ядер."},{q:"Приложение внезапно убито, в dmesg — «Out of memory: Killed process». Кто и почему его убил?",options:["OOM killer ядра: памяти не хватило на всех, он выбрал жертву по oom_score (обычно самый прожорливый)","systemd по таймауту","Антивирус","Сам процесс через exit(137)"],answer:0,why:"При нехватке памяти ядро вместо полного зависания убивает процесс с наибольшим oom_score. Лечится лимитами, swap или устранением утечки."},{q:"Права на приватный SSH-ключ 0644. Что произойдёт при попытке подключиться?",options:["ssh откажется использовать ключ: «permissions are too open» — нужно chmod 600","Подключение пройдёт, но медленно","Ключ будет работать только для root","ssh молча проигнорирует ключ и спросит пароль"],answer:0,why:"Если приватный ключ доступен на чтение группе/остальным, ssh считает это компрометацией и не даёт им пользоваться. Правильно 600 (только владелец)."}]},{id:"net",name:"Сети и веб",questions:[{q:"Nginx отдаёт 502, а не 504. В чём разница и куда смотреть?",options:["502 — апстрим вернул мусор или разорвал соединение (процесс упал/не тот порт); 504 — апстрим не ответил за таймаут (медленный бэкенд)","502 — проблема у клиента, 504 — у сервера","Разницы нет, оба про DNS","502 — TLS, 504 — HTTP"],answer:0,why:"502 Bad Gateway: соединение с бэкендом было, но ответ невалидный. 504 Gateway Timeout: бэкенд жив, но не уложился в proxy_read_timeout. Разные причины — разный разбор."},{q:"ping до хоста идёт, но curl на 443 висит и отваливается по таймауту. Где проблема?",options:["Маршрут и имя в порядке; не отвечает сервис на 443 или файрвол дропает пакеты на этот порт","Проблема в DNS","У хоста нет интернета","Сертификат просрочен"],answer:0,why:"ICMP прошёл — L3 работает. Зависание именно TCP-хендшейка на конкретный порт = сервис не слушает, либо правило файрвола молча отбрасывает (DROP, а не REJECT)."},{q:"Когда UDP предпочтительнее TCP?",options:["Когда потеря отдельного пакета не критична, а задержка важна: DNS-запросы, метрики, видеозвонки, игры","Когда нужна гарантированная доставка и порядок","Для передачи больших файлов","Всегда, UDP быстрее во всём"],answer:0,why:"TCP даёт надёжность и порядок ценой хендшейка и повторов. UDP — минимум накладных расходов; ретрансмиты и порядок, если нужны, реализует приложение."},{q:"«Терминация TLS на балансировщике» — что это и какой минус?",options:["LB расшифровывает HTTPS, дальше внутри идёт HTTP; минус — трафик внутри сети не шифрован (лечится mTLS / service mesh)","LB блокирует TLS-соединения","Сертификат хранится на каждом бэкенде","Это ускоряет TLS за счёт кэша сессий и минусов не имеет"],answer:0,why:"Один сертификат на LB упрощает эксплуатацию, но между LB и приложениями трафик открытый. В zero-trust это закрывают взаимным TLS."},{q:"curl без флага -f получил ответ 500. Какой будет код возврата curl?",options:["0 — с точки зрения curl запрос УСПЕШЕН, HTTP-ошибка это не ошибка транспорта; нужен -f, чтобы получить ненулевой код","500","22 всегда при любой 5xx","1"],answer:0,why:"curl считает работу выполненной, если соединение и обмен прошли. Для healthcheck-скриптов обязательна связка -fsS: -f даёт ненулевой exit при 4xx/5xx."},{q:"В браузере «сайт не открывается». Правильный порядок диагностики?",options:["DNS резолвится? — хост доступен (ping/traceroute)? — порт открыт (ss/nc)? — приложение отвечает (curl)? — смотрим логи бэкенда","Перезагрузить роутер, потом сервер, потом позвонить провайдеру","Сразу смотреть код приложения","Очистить кэш браузера и подождать"],answer:0,why:"Снизу вверх по слоям: имя — маршрут — порт — приложение. На каждом шаге либо исключаешь слой, либо находишь, где рвётся."}]},{id:"git",name:"Git и командная работа",questions:[{q:"merge и rebase дают одинаковый код. Чем отличается результат для истории?",options:["merge сохраняет обе ветки и создаёт merge-коммит; rebase переписывает коммиты поверх base, история линейная, но хеши меняются","rebase быстрее и безопаснее во всех случаях","merge теряет часть коммитов","Никакой разницы, только название команды"],answer:0,why:"rebase нельзя делать на уже опубликованных общих ветках — переписанные хеши ломают историю у всех. merge безопаснее для общих веток, rebase — для своих локальных перед PR."},{q:"Разница между git reset --soft, --mixed и --hard?",options:["--soft двигает ветку, оставляя всё в индексе; --mixed (по умолчанию) сбрасывает индекс, но не рабочую копию; --hard стирает и рабочую копию","--soft для файлов, --hard для веток","Только --hard что-то реально меняет","--mixed удаляет коммиты навсегда, остальные нет"],answer:0,why:"Все три перемещают HEAD/ветку. Отличие — что делают с индексом и файлами. --hard необратим обычными средствами (спасает только reflog)."},{q:"Зачем git push --force-with-lease вместо --force?",options:["--force-with-lease откажется перезаписывать удалённую ветку, если на ней появились коммиты, которых ты не видел — защита от затирания чужой работы","Он быстрее","Он не требует прав на запись","Разницы нет, это алиас"],answer:0,why:"--force слепо перезаписывает. --force-with-lease сверяет, что твоё представление об удалённой ветке актуально; если кто-то запушил между твоим fetch и push — операция отменяется."},{q:"Ты закоммитил и запушил в main файл с боевым паролём. Что действительно решает проблему?",options:["Считать пароль скомпрометированным и немедленно его сменить; удаление из истории и .gitignore — уже вторично","Сделать git rm следующим коммитом","Перевести репозиторий в приватный","Просто удалить файл через веб-интерфейс"],answer:0,why:"Секрет, попавший в историю (и тем более на сервер), надо считать утёкшим. Ротация ключа — первый приоритет; чистка истории (filter-repo/BFG) — гигиена, но не защита."},{q:"Что делает git bisect?",options:["Бинарный поиск коммита, который внёс баг: помечаешь хороший и плохой коммиты, git делит диапазон пополам, ты проверяешь и говоришь good/bad","Разбивает большой коммит на несколько","Сравнивает две ветки построчно","Откатывает последние N коммитов"],answer:0,why:"За log2(N) проверок находит виновный коммит среди сотен. Можно автоматизировать: git bisect run <скрипт-тест>."},{q:"В команде решают: trunk-based или git-flow. Ключевой аргумент за trunk-based?",options:["Короткоживущие ветки и частые слияния в main уменьшают конфликты и ускоряют доставку; требует хорошего CI и feature-флагов","Он не требует code review","В нём нельзя делать релизы","Он проще, потому что там нет веток вообще"],answer:0,why:"git-flow с долгими release/develop ветками порождает большие болезненные слияния. Trunk-based опирается на CI, флаги и маленькие PR — стандарт для continuous delivery."}]},{id:"docker",name:"Docker и контейнеры",questions:[{q:"Ты поменял одну строку в коде, а пересборка образа скачивает все зависимости заново. Почему и как чинить?",options:["COPY всего проекта идёт до установки зависимостей — любое изменение инвалидирует кэш слоя. Сначала COPY манифеста, установка, потом COPY кода","Docker всегда пересобирает всё, кэша нет","Нужно добавить --no-cache","Проблема в базовом образе, смените на alpine"],answer:0,why:"Слой кэшируется, пока не изменились его входные данные. Порядок инструкций в Dockerfile — от редко меняющегося к часто меняющемуся."},{q:"ENTRYPOINT и CMD — в чём разница и как используются вместе?",options:["ENTRYPOINT — сама команда (её сложно переопределить), CMD — аргументы по умолчанию (легко переопределяются при docker run)","CMD выполняется при сборке, ENTRYPOINT при запуске","Можно только одно из двух","ENTRYPOINT для shell-формы, CMD для exec-формы"],answer:0,why:"Аргументы docker run <image> ARGS заменяют CMD, но добавляются к ENTRYPOINT. Поэтому ENTRYPOINT — фиксированная точка входа, CMD — переопределяемые параметры."},{q:"docker ps -a показывает Exited (137). Что это значит?",options:["128 + 9: контейнер получил SIGKILL. Частая причина — OOM (превышен лимит памяти) или docker stop не дождался graceful-остановки","Приложение штатно завершилось с кодом 137","Ошибка в Dockerfile на 137-й строке","Контейнер ещё работает"],answer:0,why:"Коды выхода 128+N означают «убит сигналом N». 137 = SIGKILL. Смотри docker inspect на OOMKilled и лимиты --memory."},{q:"Образ приложения на Go весит 900 МБ. Как довести до ~15 МБ?",options:["Multi-stage build: собираем бинарник в образе с компилятором, в финальный FROM scratch/alpine копируем только бинарник","Добавить docker build --compress","Удалить слои командой docker squash","Так и должно быть, Go образы большие"],answer:0,why:"Компилятор, кэш модулей и исходники не нужны в рантайме. Multi-stage оставляет в финальном образе только артефакт. Плюс .dockerignore."},{q:"Данные в контейнере пропали после docker rm. Как правильно хранить состояние?",options:["Именованный volume или bind-mount: контейнер эфемерен, всё, что должно пережить его удаление, монтируется снаружи","Коммитить контейнер в образ после каждого изменения","Не удалять контейнеры","Хранить в /tmp внутри контейнера"],answer:0,why:"Слой записи контейнера удаляется вместе с ним. БД, загрузки, логи — на volume. Это же делает контейнер по-настоящему заменяемым."},{q:"Прод «плавает»: на части серверов старое поведение, на части новое, образ один — app:latest. Причина?",options:["latest не версионирует: серверы скачали образ в разное время и получили разное содержимое. В проде — только неизменяемые теги или дайджесты","Docker daemon разных версий","Нужно чаще перезапускать контейнеры","Проблема в оркестраторе, а не в теге"],answer:0,why:"latest — движущаяся ссылка. Воспроизводимость даёт только фиксированный тег (app:1.4.2) или digest (app@sha256:...)."}]},{id:"cicd",name:"CI/CD",questions:[{q:"Blue-green и canary деплой — в чём разница?",options:["Blue-green: два полных окружения, трафик переключается целиком (быстрый откат); canary: новая версия сначала на малую долю трафика, наблюдаем метрики, потом раскатываем","Blue-green для фронта, canary для бэка","Это одно и то же с разными названиями","Canary требует Kubernetes, blue-green нет"],answer:0,why:"Blue-green даёт мгновенный откат ценой двойных ресурсов. Canary ловит проблему на малой аудитории и дешевле по ресурсам, но сложнее в маршрутизации и требует хороших метрик."},{q:"Тесты «иногда падают, иногда нет» без изменений кода. Правильная реакция?",options:["Это flaky-тест: найти причину (гонки, зависимость от времени/порядка, внешний сервис), починить или карантинить с заведённой задачей","Поставить retry: 3 на все тесты в пайплайне","Игнорировать красный статус этих тестов","Удалить нестабильные тесты"],answer:0,why:"Ретраи и игнор убивают доверие к CI — рано или поздно пропустишь настоящий баг. Флэки чинят как обычный дефект."},{q:"Зачем в пайплайне отдельный шаг «сборка артефакта», если можно собирать при деплое?",options:["Один и тот же неизменяемый артефакт проходит staging и prod — гарантия, что в прод едет ровно то, что протестировано (build once, deploy many)","Так пайплайн быстрее","Артефакт нужен только для отката","Это требование Docker"],answer:0,why:"Пересборка на каждом окружении может дать другой результат (другие версии зависимостей, время). Собранный один раз артефакт исключает «на стейдже работало»."},{q:"Где НЕ должны лежать секреты пайплайна?",options:["В YAML пайплайна, в коде, в переменных репозитория в открытом виде — только в защищённом хранилище секретов CI или Vault","В хранилище секретов CI","В зашифрованном виде через SOPS в репозитории","Во внешнем секрет-менеджере"],answer:0,why:"Секрет в истории git = утёкший секрет. Хранилище секретов CI подставляет их в переменные только на время job и маскирует в логах."},{q:"После автодеплоя на prod полезли ошибки, пайплайн зелёный. Первое действие дежурного?",options:["Откатить релиз (rollback на предыдущий артефакт), убедиться что полегчало, и только потом разбираться, почему тесты пропустили проблему","Срочно писать hotfix прямо на проде","Ждать, вдруг стабилизируется","Отключить мониторинг, чтобы не спамил"],answer:0,why:"Сначала останови боль. Зелёный CI не гарантирует рабочий релиз — пробел в тестах закрывают после митигации, спокойно."},{q:"Что означает «shift left» в контексте CI/CD и безопасности?",options:["Проверки (тесты, линтеры, сканеры уязвимостей, проверка IaC) переносят как можно раньше — в PR, а не после деплоя","Переход на левую панель интерфейса CI","Деплой только по будням","Ручное тестирование перед автоматическим"],answer:0,why:"Чем позже найден дефект, тем дороже он обходится. Ранние автоматические ворота в PR ловят проблемы до того, как они дойдут до прода."}]},{id:"iac",name:"Инфраструктура как код",questions:[{q:"Что такое terraform state и почему его нельзя держать локально в команде?",options:["Файл-«память» о созданных ресурсах; локально его легко потерять, в нём лежат секреты, и двое могут запустить apply одновременно. Нужен remote backend с блокировкой","Это лог всех apply, его можно удалять","Кэш провайдеров, восстанавливается при init","Копия .tf-файлов"],answer:0,why:"Потерянный state = Terraform «забыл» инфраструктуру и захочет создать всё заново. Remote backend (S3+DynamoDB, GCS, Terraform Cloud) решает потерю, секреты и лок."},{q:"Что такое configuration drift и как с ним борются?",options:["Реальная инфраструктура разошлась с кодом (кто-то поменял руками). Ловят через terraform plan / регулярный drift detection в CI, чинят повторным apply или импортом","Постепенное замедление Terraform","Устаревание версий провайдеров","Расхождение времени на серверах"],answer:0,why:"Ручные изменения в обход кода — главный враг IaC. plan показывает разницу; политика «меняем только через PR» + периодический drift-чек не дают инфраструктуре снова стать «снежинкой»."},{q:"terraform plan показывает «- aws_db_instance.main (destroy)», хотя ты менял только тег. Что делать?",options:["НЕ применять; понять, почему ресурс удаляется (изменился immutable-параметр — пересоздание, или блок пропал из кода). При необходимости — lifecycle prevent_destroy","Применить, Terraform знает лучше","Удалить state и начать заново","Игнорировать строку с минусом"],answer:0,why:"Строку destroy всегда объясняют до apply. Часто это «change requires replacement» из-за неизменяемого поля; иногда — случайно удалённый блок при merge."},{q:"Зачем выносить набор ресурсов в модуль?",options:["Переиспользовать типовой набор (vpc, кластер, сервис) с разными параметрами, не копируя код; модуль = вход (variables), тело (resources), выход (outputs)","Чтобы plan работал быстрее","Модули обязательны в Terraform","Чтобы спрятать секреты"],answer:0,why:"Модуль — функция для инфраструктуры. Правка в одном месте применяется ко всем вызовам. У модулей из реестра/git обязательно фиксируют версию."},{q:"Terraform или Ansible — в чём разница подхода?",options:["Terraform — про provisioning (создать/удалить ресурсы облака, декларативно, со state); Ansible — про configuration management (настроить существующие серверы, шаги по SSH)","Это конкуренты, делают одно и то же","Ansible для облака, Terraform для железа","Terraform императивен, Ansible декларативен"],answer:0,why:"Часто их комбинируют: Terraform поднимает виртуалки и сеть, Ansible ставит на них софт и конфиги. У Ansible нет state — он приводит систему к описанному состоянию при каждом запуске."},{q:"Как безопасно применять Terraform в команде?",options:["plan автоматически в PR (комментарием), ревью человеком, apply — только CI после merge; на prod — ручной approval gate, state в remote backend с локом","Каждый делает apply со своей машины, когда нужно","apply по расписанию раз в неделю","Только тимлид имеет доступ и применяет всё вручную"],answer:0,why:"Изменения инфраструктуры проходят ревью как код. Человек видит plan (особенно destroy) до применения; apply автоматизирован, чтобы исключить «забыл прогнать»."}]},{id:"k8s",name:"Kubernetes",questions:[{q:"liveness и readiness пробы — зачем нужны обе?",options:["liveness: под завис — рестартовать его; readiness: под ещё не прогрелся/потерял зависимость — временно убрать из Service, но НЕ рестартовать","Это синонимы, достаточно одной","liveness для Deployment, readiness для StatefulSet","readiness проверяет CPU, liveness — память"],answer:0,why:"Путаница опасна: слишком агрессивная liveness при медленном старте устроит рестарт-цикл. readiness просто перестаёт слать трафик, пока под не готов."},{q:"Поды в CrashLoopBackOff. Что означает BackOff и с чего начинать разбор?",options:["Kubernetes перезапускает упавший контейнер с растущей паузой (защита от шторма). Разбор: kubectl logs — kubectl describe pod — правка манифеста — apply","Под не может найти ноду — добавить ресурсы кластеру","Проблема сети между подами","Нужно удалить и пересоздать namespace"],answer:0,why:"BackOff = экспоненциальная задержка между попытками. Частые причины: нет переменной окружения, битый образ, недоступна БД, неверная команда."},{q:"requests и limits для контейнера — что за что отвечает?",options:["requests — гарантированный минимум (по нему планировщик размещает под); limits — жёсткий потолок (превышение памяти — OOMKill, превышение CPU — троттлинг)","requests — для CPU, limits — для памяти","limits можно не указывать, они ни на что не влияют","requests — это максимум, limits — минимум"],answer:0,why:"Без requests планировщик не знает, сколько зарезервировать. Слишком низкий memory limit убивает под под нагрузкой; слишком низкий CPU limit — душит троттлингом."},{q:"Чем ConfigMap отличается от Secret и почему это не просто «одно шифрованное, другое нет»?",options:["Оба выносят конфиг из образа; Secret хранится в base64 (это кодирование, не шифрование!), доступ ограничивают RBAC, а для реального шифрования нужны SOPS/Sealed Secrets/внешний vault или encryption at rest","Secret шифруется AES автоматически и безопасен из коробки","ConfigMap для staging, Secret для prod","Secret нельзя примонтировать файлом"],answer:0,why:"Распространённое заблуждение — что Secret «зашифрован». base64 это кодирование. Защиту дают RBAC, encryption at rest в etcd и внешние менеджеры секретов."},{q:"Часть подов в статусе Pending. Куда смотреть?",options:["kubectl describe pod — раздел Events: обычно недостаточно CPU/памяти на нодах, taint без toleration, или нет доступного PersistentVolume","kubectl logs пода","Перезапустить kubelet на всех нодах","Проверить Ingress-контроллер"],answer:0,why:"Pending — проблема ПЛАНИРОВАНИЯ, а не приложения (логов ещё нет — контейнер не стартовал). Events у пода прямо называют причину."},{q:"Ты сделал kubectl scale ... --replicas=6, потом kubectl apply -f deploy.yaml, где replicas: 3. Сколько подов останется?",options:["3 — apply привёл кластер к состоянию из файла; ручной scale он перетирает. Число реплик надо менять в манифесте (это же IaC)","6 — scale приоритетнее","9 — значения складываются","Ошибка конфликта, ничего не изменится"],answer:0,why:"apply декларативен: источник правды — файл. Для автоскейлинга есть HPA, который управляет числом реплик сам; тогда поле replicas из манифеста убирают."}]},{id:"obs",name:"Мониторинг и наблюдаемость",questions:[{q:"rate() и irate() в PromQL — когда что?",options:["rate() — усреднённая скорость по всему окну (для алертов и графиков, устойчива к выбросам); irate() — мгновенная скорость по последним двум точкам (для реалтайм-графиков, шумит на алертах)","irate точнее, всегда лучше","rate для counter, irate для gauge","Разницы нет"],answer:0,why:"irate реагирует резко и годится посмотреть «прямо сейчас», но в алертах даёт ложные срабатывания. Для правил алертов берут rate() с окном не меньше 4x scrape interval."},{q:"Что такое error budget и как он меняет работу команды?",options:["Допустимая доля сбоев из SLO (99.9% — 0.1% ~ 43 мин/мес). Бюджет цел — катим фичи смелее; бюджет проеден инцидентами — останавливаем релизы и занимаемся надёжностью","Деньги, заложенные на исправление багов","Лимит инцидентов на одного инженера","Количество алертов, которые можно проигнорировать"],answer:0,why:"Error budget превращает вечный спор «фичи против стабильности» в общее измеримое число и правило, что с ним делать."},{q:"Метрика http_requests_total на графике «падает вниз». Что не так и как правильно?",options:["Это counter — он обнуляется при рестарте приложения; смотреть надо rate(http_requests_total[5m]), а не само значение","Приложение обрабатывает отрицательное число запросов","Prometheus потерял данные","Так и должно быть, счётчики убывают ночью"],answer:0,why:"Значение counter само по себе бессмысленно (различается между инстансами, обнуляется). rate() даёт сравнимую величину «в секунду» и корректно обрабатывает сброс."},{q:"Что такое «усталость от алертов» (alert fatigue) и как её лечат?",options:["Слишком много алертов (часть ложные) — дежурный перестаёт реагировать и пропускает настоящий. Лечат: алерт только на симптом, влияющий на пользователя; поле for; удаление шумных правил","Дежурный устаёт физически от ночных смен — нужен график","Alertmanager перегружен и тормозит","Это когда алертов слишком мало"],answer:0,why:"Хороший алерт значит «человек, сделай что-то сейчас». Алерт на «CPU 80%», по которому ничего не делают, — это шум, который глушит сигнал."},{q:"RED и USE — для чего каждый набор метрик?",options:["RED (Rate, Errors, Duration) — для сервисов запрос-ответ; USE (Utilization, Saturation, Errors) — для ресурсов (CPU, диск, БД, очередь)","RED для прода, USE для стейджа","RED — красные графики, USE — зелёные","Это две несовместимые методологии, выбирают одну"],answer:0,why:"Оба дают ответ «плохо или нет» с одного взгляда. На дашборде сервиса — RED сверху; на дашборде инфраструктуры — USE по каждому ресурсу."},{q:"Почему постмортем делают blameless (без поиска виноватого)?",options:["Если за инциденты нак
