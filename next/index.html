  1) dig   — имя вообще превращается в адрес?
  2) ping  — до машины доходят пакеты?
  3) curl  — а сама программа на ней отвечает?

Так ты быстро понимаешь, на каком уровне обрыв, и не чинишь наугад.`},{kind:"quiz",text:"ping показал «100% потерь». Что это значит?",options:["Пакеты до машины не доходят","Сайт работает нормально","Пароль неверный"],answer:0,explain:"Нет откликов — связи с машиной нет, дальше проверять веб-сервер бессмысленно."}]},{id:"4.3",act:4,title:"Порты — номера квартир",xp:20,intro:"IP — это дом, порт — квартира в нём. Программы сидят по портам.",steps:[{kind:"say",text:`На одной машине работают десятки программ: веб-сервер, база, почта.

Главное правило: один порт на машине может занимать только одна программа.

Простой файрвол в Linux — программа  ufw . Управление требует  sudo .`},{kind:"watch",run:"sudo ufw status",note:`Список правил: какие порты разрешены (ALLOW).

  3) сервис   — программа отвечает?

Представь дерево. Есть главный ствол — его обычно называют  main .

а потом «прирастить» её обратно к стволу.`},{kind:"say",text:`Что это даёт:

  • твоя недоделка не ломает прод — она живёт в своей ветке
  • несколько человек работают параллельно и не мешают друг другу
  • готовую ветку можно проверить и только потом вливать

console.log('корзина готова');`},{kind:"do",text:"Шаг 2. Положи изменения в коробку.",check:t=>!!t.git&&(t.git.staged.length>0||t.git.commits.length>1),answer:"git add .",hint:"git add  и точка:  git add ."},{kind:"do",text:"Шаг 3. Сделай коммит с понятным описанием.",check:t=>!!t.git&&t.git.commits.length>1,answer:'git commit -m "добавил корзину"',hint:'git commit -m  и текст в кавычках:  git commit -m "добавил корзину"'},{kind:"say",text:`Работа сохранена — но только в ветке  feature-cart .

Это делается в два шага, и порядок важен:

  1) перейти В ТУ ветку, КУДА вливаем (обычно main)
  2) выполнить  git merge имя-ветки-откуда

Частая ошибка новичка — сделать merge, стоя не в той ветке. Запомни направление:
«прихожу туда, куда вливаю, и втягиваю к себе».`},{kind:"watch",run:"git switch main",note:"Вернулись в главную ветку. Обрати внимание: без  -c  — потому что main уже существует."},{kind:"watch",run:"git merge feature-cart",note:`«Fast-forward — ветка feature-cart влита в main».

Fast-forward («перемотка вперёд») означает, что в main ничего не менялось,
пока ты работал, — поэтому Git просто передвинул указатель вперёд. Самый простой случай.`},{kind:"say",text:`А если бы main тоже менялся, пока ты работал?

Тогда Git сам объединил бы обе линии изменений. А если бы вы с коллегой правили
ОДНУ И ТУ ЖЕ строку — Git остановился бы и сказал: «конфликт, разберись сам».

Конфликт — это не поломка. Это Git честно говорит: «я не знаю, чей вариант правильный».`},{kind:"type",text:"Вернись в главную ветку. Набери:  git switch main",cmd:"git switch main"},{kind:"do",text:"Задача: влей ветку  feature-cart  в main.",check:t=>!!t.git&&(t.git.merged||[]).includes("feature-cart"),answer:"git merge feature-cart",hint:"git merge  и имя ветки:  git merge feature-cart"},{kind:"quiz",text:"В какой ветке надо находиться, чтобы влить feature-cart в main?",options:["В main — вливают всегда «к себе»","В feature-cart","Без разницы"],answer:0,explain:"Сначала перейди туда, куда вливаешь, потом merge источника."}]},{id:"5.12",act:5,title:"Удалённый репозиторий",xp:20,intro:"Пока всё лежит только на твоём компьютере. Это опасно.",setup:it,steps:[{kind:"say",text:`Одна неприятная правда: всё, что мы делали, лежит только на твоём компьютере.

Сломался диск — пропало всё вместе с историей. И коллеги твой код не видят.`},{kind:"say",text:`Поэтому есть «удалённый репозиторий» (remote) — копия на сервере.
Сервисы, где их держат: GitHub, GitLab, Bitbucket.

Схема простая:

  твой компьютер  ←→  сервер  ←→  компьютер коллеги

Все синхронизируются через сервер посередине.`},{kind:"say",text:`Привязать свой репозиторий к серверу:

  git remote add origin АДРЕС

  remote add — «добавить удалённый»
  origin     — имя-псевдоним для этого адреса. Так его называют по традиции,
               чтобы потом писать короткое «origin» вместо длинной ссылки.`},{kind:"watch",run:"git remote add origin git@github.com:shop/api.git",note:"Молча привязали. Теперь Git знает, куда отправлять."},{kind:"watch",run:"git remote",note:"Проверка: показывает имя  origin  и адрес, который за ним стоит."},{kind:"type",text:"Привяжи сервер сам. Набери:  git remote add origin git@github.com:shop/api.git",cmd:"git remote add origin git@github.com:shop/api.git"},{kind:"quiz",text:"Что такое  origin  в Git?",options:["Имя-псевдоним для адреса удалённого репозитория","Название главной ветки","Команда для создания коммита"],answer:0,explain:"Это просто короткое имя вместо длинного адреса сервера. Традиционное, но не обязательное."}]},{id:"5.13",act:5,title:"Отправить на сервер: git push",xp:20,intro:"push отправляет твои коммиты в удалённый репозиторий.",setup:t=>{it(t),t.git.remote="git@github.com:shop/api.git"},steps:[{kind:"say",text:`Сервер привязан. Отправить туда свои коммиты — команда  git push  («толкнуть»).

Обратная команда —  git pull  («притянуть»): забрать с сервера то, что залили коллеги.
Пара push/pull и есть вся синхронизация.`},{kind:"watch",run:"git push",note:`Коммиты уехали на сервер. Теперь они есть не только у тебя:
диск можно сломать, код не пропадёт, и коллеги его увидят.`},{kind:"type",text:"Отправь свою работу. Набери:  git push",cmd:"git push"},{kind:"say",text:`Как это выглядит в реальной команде — цикл целиком:

  1) git switch -c feature-x   создал ветку под задачу
  2) поработал, git add, git commit
  3) git push                  отправил ветку на сервер
  4) на сайте открыл Pull Request — «прошу влить мою ветку»
  5) коллега посмотрел код, одобрил
  6) ветку влили в main

Шаг 4-5 называется «код-ревью». Именно поэтому в main не коммитят напрямую:
чужой взгляд ловит ошибки до того, как они попадут в прод.`},{kind:"say",text:`И самое главное для тебя как DevOps:

Именно момент  git push  запускает робота-сборщика — пайплайн.
Он соберёт проект, прогонит тесты и выкатит его. Этим займёмся в Акте 7.`},{kind:"quiz",text:"Чем отличаются  git push  и  git pull ?",options:["push отправляет твои изменения на сервер, pull забирает чужие оттуда","Это одно и то же","push сохраняет локально, pull удаляет"],answer:0,explain:"Толкнуть от себя — push. Притянуть к себе — pull."}]},{id:"5.14",act:5,title:"Проверка: полный цикл сам",xp:35,intro:"Пять шагов подряд, всё уже знакомо. Подсказки появятся сами.",setup:t=>{It(t),t.git=null},steps:[{kind:"say",text:`Финал Акта 5. Пройди полный цикл работы с Git самостоятельно.

Всё это ты уже делал по отдельности. Ошибёшься — появится подсказка,
ещё раз — готовый ответ. Провалить нельзя.`},{kind:"do",text:"Шаг 1. Преврати папку проекта в репозиторий.",check:t=>!!t.git,answer:"git init",hint:"Команда из урока 5.2:  git init"},{kind:"do",text:"Шаг 2. Положи все файлы в индекс (коробку).",check:t=>!!t.git&&(t.git.staged.length>0||t.git.commits.length>0),answer:"git add .",hint:"git add  и точка"},{kind:"do",text:"Шаг 3. Сделай коммит с понятным сообщением.",check:t=>!!t.git&&t.git.commits.length>0,answer:'git commit -m "начало проекта"',hint:"git commit -m  и текст в кавычках"},{kind:"do",text:"Шаг 4. Создай ветку  feature-search  и перейди в неё.",check:t=>t.git?.branch==="feature-search",answer:"git switch -c feature-search",hint:"git switch -c  и имя ветки"},{kind:"do",text:"Шаг 5. Посмотри историю коммитов.",check:oe(/^git\s+log/),answer:"git log",hint:"git log"},{kind:"say",text:`Акт 5 пройден. Что ты теперь умеешь:

  • создавать репозиторий и понимать три состояния файла
  • add → commit — основной цикл сохранения работы
  • читать историю и писать понятные сообщения
  • работать в ветках и вливать их обратно
  • держать секреты вне репозитория (.gitignore)
  • отправлять код на сервер

Дальше — Docker: как упаковать приложение так, чтобы оно одинаково работало
и у тебя, и на сервере.`}]}],kr=`FROM node:20-alpine
WORKDIR /app
COPY . .
CMD ["node","index.js"]

`),t.cwd="/home/devops/app"}function _n(t){Bs(t),le(t,"/home/devops/app/Dockerfile",kr)}function Bt(t){_n(t),t.docker.images.push({tag:"shop:1.0",layers:4})}function Es(t){Bt(t),t.docker.containers.push({name:"web",image:"shop:1.0",state:"running",hostPort:8080,cPort:80,logs:["Starting server on :80","listening"]})}const Jo=[{id:"6.1",act:6,title:"Проблема «у меня работает»",xp:15,intro:"Классическая беда: на твоём компьютере всё идёт, на сервере — нет.",steps:[{kind:"say",text:`Ситуация, которую видел каждый разработчик.

Ты написал программу. У тебя на компьютере она прекрасно работает.
Отправляешь на сервер — падает.

Ты говоришь: «Но у меня работает!». И ты не врёшь. Просто у вас разные компьютеры.`},{kind:"say",text:`Почему так выходит. Программе для работы нужно окружение:

  • нужная версия языка (у тебя Node 20, на сервере Node 16)
  • набор библиотек нужных версий
  • системные пакеты, шрифты, настройки

Ты переносишь только свой код. А всё окружение остаётся у тебя на компьютере.`},{kind:"say",text:`Раньше это решали инструкцией: «поставьте на сервер вот это, эту версию, эти пакеты».

Работало плохо. Инструкции устаревали, шаги пропускали, на разных серверах
получалось по-разному. Появился термин «снежинка» — сервер, настроенный вручную
и неповторимый. Такой сервер страшно трогать и невозможно воспроизвести.`},{kind:"say",text:`Решение: переносить не только код, а СРАЗУ ВСЁ окружение целиком.
Одной запечатанной коробкой, которая везде разворачивается одинаково.

Такая коробка называется КОНТЕЙНЕР. Инструмент для работы с ними —  Docker .`},{kind:"quiz",text:"В чём корень проблемы «у меня работает, а на сервере нет»?",options:["Переносят только код, а окружение на машинах разное","Сервер всегда медленнее ноутбука","Код написан с ошибками"],answer:0,explain:"Разные версии языка, библиотек и системных пакетов. Контейнер переносит окружение вместе с кодом."}]},{id:"6.2",act:6,title:"Что такое контейнер",xp:20,intro:"Контейнер — изолированная коробка с приложением и всем, что ему нужно.",steps:[{kind:"say",text:`Контейнер — это запущенная программа, упакованная вместе со всем своим окружением
и отделённая от остальной системы.

Аналогия из жизни: морской контейнер. Внутри может быть что угодно — бананы, станки, мебель.
Снаружи это одинаковая железная коробка стандартного размера.

Поэтому любой порт и любое судно умеют с ней работать, не разбираясь в содержимом.`},{kind:"say",text:`То же с программным контейнером. Внутри — Python, Java или Node, неважно.
Снаружи Docker работает со всеми одинаково: запустить, остановить, посмотреть логи.

Что даёт изоляция:

  • у контейнера своя файловая система — он не видит твои файлы
  • свои процессы — он не видит чужие программы
  • свои библиотеки — можно держать рядом Node 16 и Node 20, они не подерутся`},{kind:"say",text:`Частый вопрос: чем это отличается от виртуальной машины?

  Виртуальная машина: внутри целая вторая операционная система со своим ядром.
                      Весит гигабайты, стартует минуту.

  Контейнер:          использует ядро операционной системы хозяина.
                      Весит десятки мегабайт, стартует за секунду.

Грубо: ВМ — это отдельный дом со своим фундаментом. Контейнер — квартира
в общем доме: стены свои, а фундамент и коммуникации общие.`},{kind:"say",text:`Именно поэтому контейнеров на одной машине можно запустить сотни, а виртуалок — единицы.

И именно поэтому в Акте 9 (Kubernetes) мы будем гонять десятки копий приложения:
с контейнерами это дёшево.`},{kind:"quiz",text:"Чем контейнер принципиально отличается от виртуальной машины?",options:["Использует ядро операционной системы хозяина, поэтому лёгкий и быстрый","Внутри него полноценная вторая операционная система","Ничем, это разные названия одного и того же"],answer:0,explain:"ВМ тащит своё ядро и весит гигабайты. Контейнер переиспользует ядро хозяина — отсюда скорость и лёгкость."}]},{id:"6.3",act:6,title:"Образ и контейнер: рецепт и блюдо",xp:20,intro:"Образ — неизменяемый шаблон. Контейнер — его запущенный экземпляр.",steps:[{kind:"say",text:`Два слова, которые новички путают чаще всего: ОБРАЗ и КОНТЕЙНЕР.

Разница простая:

  Образ (image)         — рецепт в книге. Лежит, не меняется, сам ничего не делает.
  Контейнер (container) — блюдо, приготовленное по рецепту. Живёт, работает, потом исчезает.`},{kind:"say",text:`Из одного рецепта можно приготовить сколько угодно блюд.

Из одного образа можно запустить сколько угодно контейнеров — они будут одинаковые.
Именно так масштабируют нагрузку: нужно больше мощности — запускают ещё контейнеры
из того же образа.`},{kind:"say",text:`Ещё одно важное свойство образа: он состоит из СЛОЁВ.

Каждый шаг сборки добавляет свой слой поверх предыдущего:

  слой 1: базовая система (Node 20)
  слой 2: скопированные файлы проекта
  слой 3: установленные библиотеки

Слои не меняются. Если пересобрать образ и первый слой не поменялся —
Docker переиспользует его, а не скачивает заново. Поэтому вторая сборка быстрая.`},{kind:"say",text:`И последнее про образ: он неизменяем (immutable).

Нельзя «поправить образ». Можно только собрать новый.
Это не ограничение, а гарантия: если у тебя и на сервере один и тот же образ —
внутри у вас гарантированно одно и то же. Никаких сюрпризов.`},{kind:"quiz",text:"Ты запустил три контейнера из одного образа. Что верно?",options:["Все три одинаковые внутри, образ при этом не изменился","Образ разделился на три части","Так делать нельзя — из образа можно запустить только один контейнер"],answer:0,explain:"Образ — неизменяемый шаблон. Из него запускают сколько угодно одинаковых контейнеров."}]},{id:"6.4",act:6,title:"Dockerfile: строка FROM",xp:20,intro:"Dockerfile — рецепт образа. Первая строка говорит, с чего начать.",setup:Bs,steps:[{kind:"say",text:`Чтобы собрать свой образ, нужен рецепт. Рецепт пишут в файл с именем  Dockerfile
(именно так, с большой буквы и без расширения).

Внутри — список инструкций, по одной на строку. Docker выполняет их сверху вниз.`},{kind:"say",text:`Первая инструкция всегда  FROM  — «начать с».

  FROM node:20-alpine

Это значит: возьми готовый образ node версии 20 как основу, а дальше я допишу своё.

Ты почти никогда не собираешь образ с нуля. Всегда берёшь готовый базовый —
с нужным языком внутри — и добавляешь туда свой код.`},{kind:"say",text:`Разберём запись  node:20-alpine  по частям:

  node    — имя образа (в нём уже установлен Node.js)
  :20     — тег, то есть версия. Двоеточие отделяет имя от версии.
  -alpine — вариант на очень лёгкой системе Alpine Linux

Про alpine стоит запомнить: обычный образ node весит ~1 ГБ, alpine-вариант ~50 МБ.
Меньше образ — быстрее выкатка и меньше места, где может прятаться уязвимость.`},{kind:"say",text:`Важно про теги. Есть тег  latest  («последний») — так вот, его в проде не используют.

Сегодня latest это версия 20, завтра — 21, и твоя сборка внезапно ломается.
Всегда указывай конкретную версию:  node:20-alpine , а не  node:latest .`},{kind:"quiz",text:"Почему в проде не пишут  FROM node:latest ?",options:["latest со временем меняется и сборка может внезапно сломаться","latest весит слишком много","latest — платный образ"],answer:0,explain:"Нужна воспроизводимость: одна и та же строка должна давать один и тот же образ и через год."}]},{id:"6.5",act:6,title:"Dockerfile: WORKDIR и COPY",xp:20,intro:"Выбираем папку внутри образа и кладём туда свой код.",setup:Bs,steps:[{kind:"say",text:`Основа взята. Теперь надо положить внутрь свой код. Две инструкции:

  WORKDIR /app   — «перейди в папку /app внутри образа»
  COPY . .       — «скопируй файлы снаружи внутрь»`},{kind:"say",text:`WORKDIR — это как команда  cd , только внутри будущего образа.

Если папки  /app  не существует — Docker создаст её сам.
Все следующие инструкции будут выполняться уже из неё.

Зачем: чтобы код лежал в предсказуемом месте, а не был раскидан по корню.`},{kind:"say",text:`COPY принимает два аргумента: откуда и куда.

  COPY . .
       ↑ ↑
       │ └── куда: текущая папка ВНУТРИ образа (то есть /app из WORKDIR)
       └──── откуда: текущая папка СНАРУЖИ, где лежит Dockerfile

Две точки выглядят загадочно, но это просто «всё отсюда — вот туда».`},{kind:"say",text:`Кстати, помнишь  .gitignore  из Акта 5? У Docker есть такой же файл —  .dockerignore

Он нужен ровно за тем же: не тащить внутрь образа мусор и секреты.
Без него  COPY . .  затащит и папку node_modules, и файл .env с паролями.`},{kind:"quiz",text:"Что делает инструкция  WORKDIR /app ?",options:["Переходит в папку /app внутри образа, создавая её при необходимости","Копирует файлы в папку /app","Удаляет папку /app"],answer:0,explain:"WORKDIR — это cd внутри образа. Копирование — отдельная инструкция COPY."}]},{id:"6.6",act:6,title:"Dockerfile: CMD и пишем файл целиком",xp:25,intro:"CMD говорит, что запускать, когда контейнер стартует.",setup:t=>{Bs(t),t.templates={"/home/devops/app/Dockerfile":`# ЗАДАЧА: напиши рецепт образа. Нужны четыре строки.
# Сотри эти комментарии и впиши:
#
#   FROM node:20-alpine
#   WORKDIR /app
#   COPY . .
#   CMD ["node", "index.js"]
`}},steps:[{kind:"say",text:`Осталась последняя обязательная инструкция —  CMD .

Она отвечает на вопрос: «что запустить, когда контейнер включится?»

Без неё образ соберётся, но контейнер сразу завершится — ему нечего делать.`},{kind:"say",text:`Пишется так:

  CMD ["node", "index.js"]

Обрати внимание на форму записи: квадратные скобки, а внутри каждое слово
в отдельных двойных кавычках через запятую.

Читается: «запусти программу node и передай ей аргумент index.js».
То же самое, что набрать в терминале  node index.js .`},{kind:"say",text:`Соберём весь рецепт вместе. Четыре строки:

  FROM node:20-alpine       ← с чего начать
  WORKDIR /app              ← в какой папке работать
  COPY . .                  ← что положить внутрь
  CMD ["node", "index.js"]   ← что запускать

Этой структуры хватает для большинства простых приложений.`},{kind:"do",text:`Задача: напиши Dockerfile. Набери в терминале:
edit Dockerfile
В редакторе будет подсказка — сотри её и впиши четыре настоящие строки. Сохрани.`,check:t=>Q("/home/devops/app/Dockerfile",/^\s*FROM\s+\S+/im)(t)&&Q("/home/devops/app/Dockerfile",/^\s*CMD\s+/im)(t),answer:kr,editFile:"/home/devops/app/Dockerfile",hint:`Открой  edit Dockerfile  и впиши ровно это:
FROM node:20-alpine
WORKDIR /app
COPY . .
CMD ["node","index.js"]`},{kind:"quiz",text:"Что произойдёт, если в Dockerfile нет инструкции CMD?",options:["Контейнер не будет знать, что запускать, и сразу завершится","Образ вообще не соберётся никогда","Ничего, CMD не обязательна"],answer:0,explain:"Контейнер существует, пока внутри работает программа. Не задал программу — нечему работать."}]},{id:"6.7",act:6,title:"Собрать образ: docker build",xp:25,intro:"build читает рецепт и создаёт образ.",setup:_n,steps:[{kind:"say",text:`Рецепт написан. Готовим по нему образ — команда  docker build .

  docker build -t shop:1.0 .

Разберём по частям, тут есть неочевидное.`},{kind:"say",text:`  -t shop:1.0

  -t     — от tag, «дай имя». Без имени образ будет безымянным и неудобным.
  shop   — имя образа
  :1.0   — версия, через двоеточие. Та же логика, что у node:20-alpine.

Версию ставят всегда. Через месяц будет shop:1.1, shop:2.0 — и можно вернуться назад.`},{kind:"say",text:`  .   ← вот эта точка в самом конце

Это САМАЯ частая ошибка новичков — её забывают, и команда падает.

Точка означает «контекст сборки»: папка, откуда Docker берёт файлы и Dockerfile.
Точка = текущая папка, та же самая точка, что ты знаешь из Акта 1.`},{kind:"watch",run:"docker build -t shop:1.0 .",note:`Смотри на вывод — Docker честно рассказывает, что делает:

  Step 1/4 : FROM node:20-alpine   ← взял основу
  Step 2/4 : WORKDIR /app          ← перешёл в папку
  Step 3/4 : COPY . .              ← скопировал файлы
  Step 4/4 : CMD [...]             ← записал команду запуска

Каждый шаг — это один слой. В конце:  Successfully tagged shop:1.0 .`},{kind:"type",text:`Собери образ сам. Набери:  docker build -t shop:1.0 .
(не забудь точку в конце!)`,cmd:"docker build -t shop:1.0 ."},{kind:"quiz",text:"Что означает точка в конце команды  docker build -t shop:1.0 . ?",options:["Папку, откуда брать Dockerfile и файлы проекта","Это опечатка, точка не нужна","Конец команды, как в предложении"],answer:0,explain:"Точка — контекст сборки, текущая папка. Забыть её — самая частая ошибка при первой сборке."}]},{id:"6.8",act:6,title:"Что получилось: docker images",xp:15,intro:"Список собранных образов на машине.",setup:Bt,steps:[{kind:"say",text:"Образ собран и лежит на твоей машине. Посмотреть все образы — команда  docker images ."},{kind:"watch",run:"docker images",note:`Видим наш  shop:1.0  и количество слоёв.

В настоящем Docker тут ещё колонка с размером — на неё стоит поглядывать.
Образ на 1 ГБ будет качаться на каждый сервер при каждой выкатке.`},{kind:"type",text:"Посмотри список образов. Набери:  docker images",cmd:"docker images"},{kind:"say",text:`Практический совет про слои и скорость сборки.

Docker переиспользует слои, которые не изменились. Но если поменялся слой №2 —
все слои НИЖЕ него пересобираются заново.

Поэтому опытные инженеры кладут редко меняющееся вверх (установка библиотек),
а часто меняющееся вниз (свой код). Тогда обычная пересборка занимает секунды.`},{kind:"quiz",text:"Почему стоит следить за размером образа?",options:["Он качается на каждый сервер при каждой выкатке — большой образ замедляет всё","Docker берёт деньги за размер","Размер ни на что не влияет"],answer:0,explain:"Меньше образ — быстрее деплой и меньше поверхность для уязвимостей."}]},{id:"6.9",act:6,title:"Первый запуск: docker run",xp:20,intro:"run превращает образ в работающий контейнер.",setup:Bt,steps:[{kind:"say",text:`Рецепт готов — приготовим блюдо. Команда  docker run  берёт образ и запускает контейнер.

Самая простая форма:

  docker run shop:1.0`},{kind:"watch",run:"docker run shop:1.0",note:`Docker ответил длинной строкой из букв и цифр — это идентификатор нового контейнера.

Контейнер создан и запущен из нашего образа.`},{kind:"say",text:`Важно понимать, что произошло:

  образ  shop:1.0    остался на месте, неизменным
  контейнер          создался новый, из этого образа

Запусти команду ещё раз — получишь ВТОРОЙ контейнер, независимый от первого.
Образ при этом по-прежнему один.`},{kind:"type",text:"Запусти контейнер сам. Набери:  docker run shop:1.0",cmd:"docker run shop:1.0"},{kind:"quiz",text:"Ты дважды выполнил  docker run shop:1.0 . Что получилось?",options:["Два независимых контейнера из одного образа","Один контейнер, второй запуск ничего не сделал","Два образа"],answer:0,explain:"Каждый run создаёт новый контейнер. Образ остаётся один и не меняется."}]},{id:"6.10",act:6,title:"Фоновый режим и имя контейнера",xp:20,intro:"Флаги -d и --name делают контейнер удобным в работе.",setup:Bt,steps:[{kind:"say",text:`У команды run есть два флага, без которых на практике не обходятся.

Первый:  -d  (от detached, «отсоединённый»).

Без него терминал «залипает» на контейнере: ты видишь его вывод и не можешь
набирать команды, пока не остановишь. С  -d  контейнер уходит в фон,
а терминал сразу свободен.`},{kind:"say",text:`Второй флаг:  --name

Без него Docker придумает контейнеру случайное имя вроде  nervous_hawking .
Смешно ровно один раз. Потом ты будешь копировать эти имена, чтобы посмотреть логи.

  --name web

Дал понятное имя — и дальше работаешь с ним:  docker logs web ,  docker stop web .`},{kind:"watch",run:"docker run -d --name web shop:1.0",note:"Запустили в фоне под именем  web . Терминал сразу свободен для следующих команд."},{kind:"type",text:"Запусти с именем сам. Набери:  docker run -d --name web shop:1.0",cmd:"docker run -d --name web shop:1.0"},{kind:"quiz",text:"Зачем нужен флаг  -d  у  docker run ?",options:["Контейнер уходит в фон и не занимает твой терминал","Контейнер запускается быстрее","Контейнер удаляется после остановки"],answer:0,explain:"-d = detached. Без него терминал будет занят выводом контейнера."}]},{id:"6.11",act:6,title:"Порты: пробрасываем наружу",xp:25,intro:"Контейнер изолирован. Чтобы достучаться — нужен проброс порта.",setup:Bt,steps:[{kind:"say",text:`Помнишь, контейнер изолирован? Это касается и сети.

Внутри контейнера приложение слушает порт 80. Но снаружи, с твоей машины,
туда не достучаться — контейнер как закрытая коробка.

Нужно проделать в коробке «окошко». Это называется проброс порта.`},{kind:"say",text:`Делается флагом  -p  (от publish, «опубликовать»):

  8080  — порт на ТВОЕЙ машине (хост), снаружи
    80  — порт ВНУТРИ контейнера

Запомни направление: СНАРУЖИ:ВНУТРИ. Слева то, куда стучишься ты.`},{kind:"say",text:`Зачем вообще разные номера? Потому что снаружи порт может быть занят.

приложений на порту 80. А на твоей машине порт 80 один, и его может занимать nginx.

Разработчик у себя на машине собирал программу, копировал файлы на сервер по FTP,
перезапускал сервис руками. Каждый раз чуть по-разному. Забыл прогнать тесты —
узнал о баге от пользователей. Забыл один файл — сервер лежит.`},{kind:"say",text:`CI/CD — это робот, который делает всё это ВМЕСТО человека, одинаково каждый раз.

Две буквы CI = Continuous Integration («непрерывная интеграция»):
на каждый твой  git push  робот сам собирает проект и прогоняет тесты.

CD = Continuous Delivery/Deployment: если тесты зелёные — робот сам выкатывает
новую версию на сервер.`},{kind:"say",text:`Что это даёт на практике:

  • баг ловится через минуты после коммита, а не через неделю от пользователя
  • выкатка — это один  git push , а не 20 ручных шагов по памяти
  • любой в команде может выкатить — процесс записан, а не в голове у одного человека

Ты как DevOps будешь именно строить и чинить этих роботов.`},{kind:"quiz",text:"Что делает CI (Continuous Integration)?",options:["На каждый push сам собирает проект и прогоняет тесты","Хранит резервные копии базы данных","Ускоряет интернет на сервере"],answer:0,explain:"CI ловит поломки сразу после коммита. CD — следующий шаг: автоматическая выкатка зелёной версии."}]},{id:"7.2",act:7,title:"Пайплайн — это конвейер",xp:20,intro:"Робот делает работу по этапам: сборка → тесты → деплой.",steps:[{kind:"say",text:`Работа робота называется «пайплайн» (pipeline, «трубопровод», «конвейер»).

Это последовательность этапов. Классический набор:

  1) checkout  — забрать свежий код из репозитория
  2) install   — поставить зависимости (библиотеки)
  3) test      — прогнать тесты
  4) build     — собрать (например, Docker-образ из Акта 6)
  5) deploy    — выкатить на сервер`},{kind:"say",text:`Главное правило конвейера: этапы идут по порядку, и следующий начинается
только если предыдущий прошёл успешно.

Упали тесты на этапе 3 — этапы 4 и 5 НЕ выполняются. Сломанный код не уедет
на сервер физически. Это и есть страховка.`},{kind:"say",text:`Что запускает пайплайн — называется «триггер» (trigger, «спусковой крючок»).

Самый частый триггер:  push  — любой  git push  в репозиторий.
Бывают и другие: по расписанию (каждую ночь), по тегу (при релизе),

## Что произошло
Выкатили shop:3.0-beta. Поды не стартовали (CrashLoopBackOff), сервис начал отдавать 5xx.

## Влияние
18 минут, около 30% запросов завершались ошибкой. Затронуло оформление заказов.

## Причина
В новом манифесте не задали переменную окружения DB_URL — приложение падало при старте.

## Действия
1. Проверка обязательных переменных манифеста в CI.
2. Канареечный деплой вместо полного выката.
3. Алерт на pods_ready < replicas.
`,ea=`# Runbook: алерт HighErrorRate

## Когда срабатывает
error_rate выше 1% дольше 5 минут.

## Что проверить
1. alerts — какие ещё алерты горят рядом.
2. metrics — величина error_rate и latency_p99.
3. Был ли выкат за последние 30 минут (история деплоев).

## Как митигировать
Если ошибки начались сразу после выката — kubectl rollout undo deployment/api.
Дождаться kubectl rollout status, затем проверить metrics и alerts.

## Кого звать
Если откат не помог за 15 минут — эскалация на дежурного тимлида.
`;function ta(){return[{name:"HighErrorRate",sev:"critical",desc:"error_rate 32% за последние 5 минут (порог 1%). Началось через 2 минуты после выката shop:3.0-beta."},{name:"LatencyP99High",sev:"warning",desc:"p99 задержка 4200ms при норме 200ms."}]}function Rs(t){be(t,"/home/devops/k8s"),t.cwd="/home/devops/k8s",t.k8s={deploys:[{name:"api",replicas:4,image:"shop:3.0-beta",crash:!0}],pods:[],svcs:[]},De(t),t.alerts=ta()}const sa=[{id:"10.1",act:10,title:"Что такое дежурство",xp:15,intro:"On-call — это когда именно ты отвечаешь за прод в свою смену.",steps:[{kind:"say",text:`В любой команде, которая держит сервис 24/7, есть дежурство (on-call).
Инженеры по очереди берут «смену»: неделю ты — тот человек, которому
прилетит уведомление, если ночью что-то сломается.

Уведомление приходит на телефон (исторически — на «пейджер», отсюда
английское  page  — «дёрнуть дежурного»).`},{kind:"say",text:`Зачем это устроено именно так:

  • сервис должен работать всегда, а люди — нет
  • ответственность конкретная: в каждый момент есть ОДИН дежурный,
    а не «кто-нибудь посмотрит»
  • нагрузка честно делится по очереди, а не висит на одном человеке`},{kind:"say",text:`Дежурному нужно уметь три вещи, и мы их разберём в этом акте:

  1) быстро понять, что происходит — метрики и алерты
  2) остановить боль пользователей — митигация
  3) разобрать инцидент, чтобы он не повторился — постмортем

Писать сложный код ночью НЕ нужно — это почти всегда ошибка.`},{kind:"quiz",text:"Зачем в командах делают ротацию дежурства (on-call)?",options:["Чтобы в любой момент был один конкретный ответственный за прод, и нагрузка делилась по очереди","Чтобы новички быстрее увольнялись","Чтобы никто не спал по ночам"],answer:0,explain:"Дежурство — про конкретную ответственность и честное распределение, а не про героизм."}]},{id:"10.2",act:10,title:"Четыре золотых сигнала",xp:20,intro:"Чтобы понять здоровье сервиса, смотрят на четыре числа.",setup:t=>{Rs(t)},steps:[{kind:"say",text:`У любого сервиса есть сотни метрик, но у дежурного нет времени смотреть все.
Есть короткий список — «четыре золотых сигнала» (Google SRE):

  • Задержка (latency)      — за сколько отвечает сервис
  • Трафик (traffic)        — сколько запросов в секунду
  • Ошибки (errors)         — какая доля запросов падает
  • Насыщение (saturation)  — насколько загружены ресурсы (CPU, память, диск)`},{kind:"say",text:`Смотрят обычно не среднее, а «хвост» — например  p99 задержки : время, в которое
укладываются 99% запросов. Среднее может быть отличным, а каждый сотый
пользователь ждёт 10 секунд — вот это и ловит p99.

В симуляторе метрики показывает команда  metrics .`},{kind:"watch",run:"metrics",note:`Разбор строк:
  http_requests_total — всего запросов (трафик)
  error_rate 32.1%    — доля ошибок; норма здесь 0.01%, сейчас катастрофа
  latency_p99_ms 4200 — 99-й перцентиль задержки; норма 180
  pods_ready 0/4      — насыщение/здоровье: ни один под не готов

Три сигнала из четырёх в красной зоне — сервис лежит.`},{kind:"type",text:"Посмотри метрики сам. Набери:  metrics",cmd:"metrics"},{kind:"quiz",text:"Почему дежурные смотрят на  p99  задержки, а не на среднюю?",options:["Среднее прячет редкие очень медленные ответы, а p99 их показывает","p99 считается быстрее","Средняя задержка вообще не бывает полезной"],answer:0,explain:"p99 — «худшее, что видит почти каждый». Хвост задержек и есть боль пользователей."}]},{id:"10.3",act:10,title:"Алерты и пороги",xp:20,intro:"Алерт — это метрика, которая вышла за порог и разбудила человека.",setup:t=>{Rs(t)},steps:[{kind:"say",text:`Никто не сидит и не смотрит в графики круглосуточно. Вместо этого настраивают
алерты: правило вида «если error_rate выше 1% дольше 5 минут — разбуди дежурного».

У алерта есть важность (severity):
  critical — будит немедленно, даже в 4 утра (сервис лежит, деньги теряются)
  warning  — можно посмотреть в рабочее время (тревожный тренд, но не пожар)`},{kind:"watch",run:"alerts",note:`Сейчас горят два:
  🔴 HighErrorRate [critical] — вот из-за этого пришёл page
  🔴 LatencyP99High [warning] — следствие того же сбоя

В описании критичного уже есть зацепка: «началось через 2 минуты после выката
shop:3.0-beta». Часто первопричина видна прямо в тексте алерта.`},{kind:"type",text:"Посмотри активные алерты. Набери:  alerts",cmd:"alerts"},{kind:"say",text:`Обратная сторона — «усталость от алертов» (alert fatigue). Если алертов сотня
и половина ложные, дежурный перестаёт на них реагировать и пропустит настоящий.

Поэтому хороший алерт: срабатывает на боль ПОЛЬЗОВАТЕЛЯ (а не на «CPU 80%»),
редкий, и на него всегда есть что сделать. Шумные алерты чинят или удаляют.`},{kind:"quiz",text:"Чем плох сервис, где горит сто алертов в день?",options:["Дежурный перестаёт им доверять и пропустит настоящий инцидент","Сервер тратит слишком много трафика на уведомления","Ничем, чем больше алертов — тем лучше видно систему"],answer:0,explain:"Alert fatigue: шум глушит сигнал. Алерт должен значить «человек, сделай что-то сейчас»."}]},{id:"10.4",act:10,title:"SLI, SLO и бюджет ошибок",xp:20,intro:"Насколько надёжным сервис ДОЛЖЕН быть — это заранее согласованное число.",steps:[{kind:"say",text:`«Сервис должен работать хорошо» — не инженерная формулировка. Её превращают
в числа:

  SLI (индикатор) — что именно меряем. Например: доля успешных запросов.
  SLO (цель)      — какое значение SLI считаем достаточным. Например: 99.9%
                    успешных запросов за 30 дней.`},{kind:"say",text:`Из SLO вытекает «бюджет ошибок» (error budget).

Если цель 99.9% — значит 0.1% запросов можно провалить «легально». Это и есть
бюджет: за 30 дней примерно 43 минуты полной недоступности.

  • бюджет не исчерпан → можно смелее катить новые фичи
  • бюджет проеден инцидентами → останавливают релизы и занимаются надёжностью`},{kind:"say",text:`Зачем это нужно: убирает вечный спор «разработка хочет фичи, эксплуатация хочет
стабильность». Есть общее число. Пока бюджет цел — катим. Кончился — чиним.

100% надёжности как цель не ставят: это бесконечно дорого и всё равно недостижимо
(сеть, провайдеры, железо ломаются вне твоего контроля).`},{kind:"quiz",text:"Что такое «бюджет ошибок» (error budget)?",options:["Допустимая доля сбоев, вытекающая из SLO; пока не исчерпана — можно катить новое","Деньги, заложенные на устранение багов","Количество разработчиков, которых можно уволить за инциденты"],answer:0,explain:"SLO 99.9% → 0.1% бюджет на сбои. Кончился бюджет — приоритет смещается на надёжность."}]},{id:"10.5",act:10,title:"Цикл реакции на инцидент",xp:20,intro:"Пять шагов, одинаковых для любого инцидента. Главное правило — в начале.",steps:[{kind:"say",text:`Пришёл page. Что делать — по шагам, всегда одинаково:

  1) Обнаружить  — прочитать алерт: что горит, с какого времени
  2) Оценить     — metrics: насколько плохо, сколько пользователей задето
  3) Митигировать — остановить боль (откат, перезапуск, переключение трафика)
  4) Проверить   — метрики и алерты вернулись в норму?
  5) Разобрать   — постмортем: почему случилось и как не повторить`},{kind:"say",text:`ГЛАВНОЕ ПРАВИЛО ДЕЖУРНОГО:

  Сначала останови боль, потом ищи причину.

Если 5xx полезли сразу после выката — не надо ночью читать код и искать баг.
Откатись на прошлую рабочую версию (митигация за минуту), убедись, что полегчало,
и только утром на свежую голову разбирайся, что там сломалось.`},{kind:"say",text:`Почему именно так:

  • каждая минута инцидента — это потерянные пользователи и деньги
  • ночью, под стрессом, ты пишешь плохой код и делаешь только хуже
  • откат почти всегда безопаснее, чем «быстрый фикс» вслепую

Диагностику (логи, describe) делают ДО отката — чтобы сохранить улики, —
но она не должна задерживать митигацию больше чем на пару минут.`},{kind:"quiz",text:"Ночью после выката полезли 5xx. Что делать первым?",options:["Быстро снять симптомы (логи), откатить релиз, убедиться что полегчало — разбор потом","Открыть код новой версии и искать баг, пока не найдёшь","Подождать до утра — вдруг само пройдёт"],answer:0,explain:"Сначала боль, потом причина. Откат — быстрая и безопасная митигация; постмортем — уже спокойно."}]},{id:"10.6",act:10,title:"Инцидент: 5xx после релиза ⚡",xp:45,intro:"Полный прогон цикла: от алерта до подтверждённой митигации.",setup:t=>{Rs(t)},steps:[{kind:"say",text:`3:12 ночи, пришёл page  HighErrorRate . Идём по циклу: обнаружить → оценить →
снять симптом → митигировать → проверить.`},{kind:"do",text:"Шаг 1. Обнаружить: посмотри, какие алерты горят.",check:oe(/^alerts\b/),answer:"alerts",hint:"Команда  alerts"},{kind:"do",text:"Шаг 2. Оценить масштаб: посмотри метрики.",check:oe(/^metrics\b/),answer:"metrics",hint:"Команда  metrics"},{kind:"say",text:`error_rate 32%, p99 4200ms, pods_ready 0/4. Алерт связал это с выкатом
shop:3.0-beta две минуты назад. Прежде чем откатывать — быстро зафиксируем
симптом, чтобы утром было что разбирать.`},{kind:"do",text:"Шаг 3. Посмотри состояние подов.",check:oe(/^kubectl\s+get\s+pods?\b/),answer:"kubectl get pods",hint:"Команда  kubectl get pods"},{kind:"do",text:"Шаг 4. Сними симптом в лог: прочитай логи любого пода.",check:oe(/^kubectl\s+logs\b/),answer:"kubectl logs api-x",hint:"Команда  kubectl logs  и имя пода (подойдёт  api-x )"},{kind:"say",text:`В логах  FATAL: DB_URL не задана . Причина понятна, но чинить манифест ночью
мы НЕ будем — это работа на утро. Сейчас — откат на ту версию, что работала.`},{kind:"do",text:"Шаг 5. Митигируй: откатись на предыдущую версию.",check:t=>!!t.k8s&&t.k8s.deploys.every(e=>!e.crash),answer:"kubectl rollout undo deployment/api",hint:"Команда  kubectl rollout undo deployment/api"},{kind:"do",text:"Шаг 6. Дождись завершения выката отката.",check:oe(/^kubectl\s+rollout\s+status\b/),answer:"kubectl rollout status deployment/api",hint:"Команда  kubectl rollout status deployment/api"},{kind:"do",text:"Шаг 7. Проверь метрики — error_rate должен вернуться к норме.",check:oe(/^metrics\b/),answer:"metrics",hint:"Команда  metrics"},{kind:"do",text:"Шаг 8. Убедись, что алерты погасли.",check:t=>t.alerts.length===0,answer:"alerts",hint:"Команда  alerts  — активных алертов быть не должно"},{kind:"say",text:`Боль остановлена за минуты, никто не писал код ночью. Инцидент НЕ закрыт —
осталось написать постмортем. Это следующий урок.`}]},{id:"10.7",act:10,title:"Постмортем без обвинений",xp:30,intro:"Инцидент не закрыт, пока не написан разбор. Разбирают систему, а не людей.",setup:t=>{t.cwd="/home/devops",t.templates={"/home/devops/postmortem.md":`# Постмортем: рост 5xx после релиза

## Что произошло
(коротко: выкатили версию, пошли ошибки)

## Влияние
(сколько времени, кого задело)

## Причина
(что именно сломалось)

## Действия
(что сделать, чтобы не повторилось)
`}},steps:[{kind:"say",text:`Постмортем (postmortem) — письменный разбор инцидента. Он  blameless :
«без вины». Разбирают, почему СИСТЕМА позволила сбою случиться и почему его
не поймали раньше — а не «кто виноват».

Если за инциденты наказывают людей, инженеры начинают их скрывать —
и организация перестаёт учиться на сбоях.`},{kind:"say",text:`Обязательные разделы:

  Что произошло — факты и таймлайн: во сколько выкат, во сколько алерт, во сколько откат
  Влияние       — сколько минут, какая доля запросов, что почувствовал пользователь
  Причина       — техническая первопричина (здесь: не задали DB_URL в манифесте)
  Действия      — конкретные задачи с ответственными, чтобы это не повторилось`},{kind:"say",text:`Хорошие «Действия» — проверяемые и адресные:

  ✗ «быть внимательнее при выкате»
  ✓ «добавить в CI проверку, что все обязательные переменные окружения заданы»
  ✓ «включить канареечный деплой: сначала 1 под, потом остальные»`},{kind:"do",text:`Задача: напиши постмортем. Набери:
edit postmortem.md
Заполни все четыре раздела своими словами (замени текст в скобках). Сохрани.`,check:t=>Q("/home/devops/postmortem.md",/##\s*Что произошло\s*\n+(?!\()\S/)(t)&&Q("/home/devops/postmortem.md",/##\s*Влияние\s*\n+(?!\()\S/)(t)&&Q("/home/devops/postmortem.md",/##\s*Причина\s*\n+(?!\()\S/)(t)&&Q("/home/devops/postmortem.md",/##\s*Действия\s*\n+(?!\()\S/)(t),answer:fi,editFile:"/home/devops/postmortem.md",hint:`Открой  edit postmortem.md  и под каждым заголовком напиши по 1–2 предложения
вместо подсказки в скобках. Пример готового разбора есть в теории акта.`},{kind:"quiz",text:"Почему постмортем делают «без вины» (blameless)?",options:["Иначе люди будут скрывать инциденты, и команда перестанет на них учиться","Чтобы не тратить время на поиск виноватого — его и так все знают","Так требует трудовой кодекс"],answer:0,explain:"Цель — исправить систему, а не наказать человека. Наказание убивает честность отчётов."}]},{id:"10.8",act:10,title:"Runbook",xp:25,intro:"На известный алерт план действий пишут заранее, а не сочиняют в 4 утра.",setup:t=>{t.cwd="/home/devops",t.templates={"/home/devops/runbook.md":`# Runbook: алерт HighErrorRate

## Когда срабатывает
(условие алерта)

## Что проверить
(команды по шагам)

## Как митигировать
(конкретное действие)

## Кого звать
(когда эскалировать и на кого)
`}},steps:[{kind:"say",text:`Runbook («сборник процедур») — короткая инструкция на конкретный алерт:
что это значит, что проверить, как починить, когда звать помощь.

Идея: в момент инцидента дежурный не думает «а что вообще делать», он
открывает runbook по названию алерта и идёт по пунктам.`},{kind:"say",text:`Хороший runbook:

  • привязан к одному алерту (ссылка на runbook прямо в тексте алерта)
  • состоит из команд, которые можно выполнить не думая
  • говорит, когда СТОП и эскалация («если за 15 минут не помогло — звони X»)
  • обновляется после каждого инцидента, где чего-то не хватило`},{kind:"do",text:`Задача: напиши runbook для  HighErrorRate . Набери:
edit runbook.md
Заполни все четыре раздела (замени текст в скобках). Сохрани.`,check:t=>Q("/home/devops/runbook.md",/##\s*Когда срабатывает\s*\n+(?!\()\S/)(t)&&Q("/home/devops/runbook.md",/##\s*Что проверить\s*\n+(?!\()\S/)(t)&&Q("/home/devops/runbook.md",/##\s*Как митигировать\s*\n+(?!\()\S/)(t)&&Q("/home/devops/runbook.md",/##\s*Кого звать\s*\n+(?!\()\S/)(t),answer:ea,editFile:"/home/devops/runbook.md",hint:`Открой  edit runbook.md . В «Что проверить» перечисли  alerts ,  metrics ,
историю выката; в «Как митигировать» —  kubectl rollout undo . Образец — в теории.`},{kind:"quiz",text:"Зачем писать runbook заранее, если дежурный и так разберётся?",options:["В 4 утра под стрессом человек соображает хуже; готовый список шагов ускоряет и снижает ошибки","Runbook нужен только для отчётности перед начальством","Чтобы дежурному вообще не пришлось просыпаться"],answer:0,explain:"Runbook переносит мышление на спокойное время. В инцидент дежурный исполняет, а не изобретает."}]},{id:"10.9",act:10,title:"Эскалация и коммуникация",xp:20,intro:"Молча героически чинить в одиночку — плохо. Зови людей и говори статус.",steps:[{kind:"say",text:`Дежурный — не одиночка. Если за ~15 минут митигация не помогла, или масштаб
больше, чем ты можешь потянуть, — эскалируй: подними следующего по цепочке
(старшего дежурного, тимлида, дежурного соседней команды).

Разбудить человека в 4 утра — это нормально. Провалить SLO, потому что
постеснялся позвонить, — не нормально.`},{kind:"say",text:`В крупном инциденте роли разделяют:

  Incident Commander — координирует, принимает решения, НЕ лезет в консоль сам
  Operations         — тот, кто реально выполняет команды
  Communications     — пишет статус-апдейты наружу (поддержке, руководству)

Пока людей мало — все роли на дежурном, но как только пришли помощники,
их надо явно раздать: «ты командир, я руками, ты пишешь в канал».`},{kind:"say",text:`Статус-апдейты — каждые 15–30 минут, даже если новостей нет:

  • дежурный за 5 секунд видит состояние сервиса, а не пишет запросы руками
  • один экран смотрят все: разработчики, поддержка, руководитель
  • на графике видно ТРЕНД — «росло весь день» или «скакнуло 10 минут назад»
  • при инциденте видно, что менялось одновременно с поломкой`},{kind:"quiz",text:"Где физически хранятся метрики, которые ты видишь на дашборде Grafana?",options:["В источнике данных (в нашем случае в Prometheus) — Grafana только запрашивает и рисует","В самой Grafana","В браузере пользователя"],answer:0,explain:"Grafana — витрина, а не хранилище. Упал Prometheus — дашборды останутся, но данных на них не будет."}]},{id:"12.2",act:12,title:"Источник данных",xp:20,intro:"Первое, что настраивают в Grafana, — откуда брать цифры.",steps:[{kind:"say",text:`Источник данных (datasource) — это описание того, куда Grafana ходит
за метриками: какой тип системы и по какому адресу.

Для нашего случая это Prometheus на  http://localhost:9090 
(9090 — стандартный порт Prometheus, как 9100 у node_exporter).`},{kind:"say",text:`Источник можно добавить мышкой в веб-интерфейсе. Так делают на своём ноутбуке —
и почти никогда в реальной работе. Причина знакома тебе по Акту 8:

настроенное кликами невоспроизводимо. Через полгода никто не помнит, что нажимали,
а поднять вторую такую же Grafana можно только «на глаз».`},{kind:"say",text:`Поэтому Grafana умеет «provisioning» — настройку файлами, которые лежат в git.
Кладёшь YAML в специальную папку, Grafana при старте его читает и создаёт
источник сама.

Это ровно та же идея, что и инфраструктура как код, только про Grafana:
конфигурация — это код, который проходит ревью и хранится в репозитории.`},{kind:"quiz",text:"Почему источники данных и дашборды стараются задавать файлами, а не кликами?",options:["Файл лежит в git: воспроизводится, проходит ревью, переживает переезд Grafana","Через файлы Grafana работает быстрее","Кликами их вообще нельзя создать"],answer:0,explain:"Та же логика, что в Акте 8 про «снежинки»: настроенное руками нельзя повторить."}]},{id:"12.3",act:12,title:"datasources.yml",xp:25,intro:"Пишем описание источника данных и проверяем его.",setup:t=>{Cr(t),t.templates={"/home/devops/grafana/datasources.yml":`# ЗАДАЧА: опиши источник данных Prometheus.
# Нужны: apiVersion, секция datasources, name, type: prometheus и url.
# Сотри комментарий и впиши конфиг.
`}},steps:[{kind:"say",text:`Файл выглядит так:

  apiVersion: 1

  datasources:
    - name: Prometheus
      type: prometheus
      access: proxy
      url: http://localhost:9090
      isDefault: true
`},{kind:"say",text:`Разбор каждой строки:

  apiVersion: 1 — версия формата файла provisioning. Пишется всегда.
  name          — как источник будет называться в интерфейсе и в дашбордах.
  type          — какая это система: prometheus, loki, postgres и так далее.
  url           — адрес источника.
  access: proxy — за данными ходит СЕРВЕР Grafana, а не браузер игрока.
                  Это правильный режим: адрес Prometheus не светится наружу
                  и не должен быть доступен из интернета.
  isDefault     — этот источник подставляется в новых панелях по умолчанию.`},{kind:"do",text:`Задача: опиши источник данных. Набери:
edit datasources.yml
Впиши конфиг из теории урока: name Prometheus, type prometheus, url на порт 9090. Сохрани.`,check:t=>Q("/home/devops/grafana/datasources.yml",/datasources\s*:/)(t)&&Q("/home/devops/grafana/datasources.yml",/type\s*:\s*prometheus/)(t)&&Q("/home/devops/grafana/datasources.yml",/url\s*:/)(t),answer:xr,editFile:"/home/devops/grafana/datasources.yml",hint:"Открой  edit datasources.yml  и впиши конфиг из теории (apiVersion, datasources, name, type, access, url)."},{kind:"say",text:`Как и у Prometheus, конфиг лучше проверить до того, как его подхватит сервис.
В симуляторе это делает команда:

  grafana check datasources.yml`},{kind:"do",text:"Задача: проверь файл источника данных.",check:t=>!!t.grafana&&t.grafana.datasources.length>0,answer:"grafana check datasources.yml",hint:"Команда  grafana check datasources.yml"},{kind:"quiz",text:"Что означает  access: proxy  в описании источника данных?",options:["За данными ходит сервер Grafana, а не браузер — адрес Prometheus не нужно открывать наружу","Grafana работает через корпоративный прокси","Источник доступен только администраторам"],answer:0,explain:"Режим direct (браузерный) требует, чтобы Prometheus был доступен пользователю напрямую — обычно это дыра."}]},{id:"12.4",act:12,title:"Дашборд — это тоже файл",xp:20,intro:"За красивым экраном лежит обычный JSON с описанием панелей.",steps:[{kind:"say",text:`Дашборд в Grafana — это JSON-файл. Всё, что ты видишь на экране,
описано в нём текстом. Минимальная структура:

  {
    "title": "shop-api",          ← название дашборда
    "panels": [ ... ]             ← список панелей
  }`},{kind:"say",text:`Каждая панель описывается так:

  {
    "title": "Запросы в секунду",     ← подпись панели
    "unit": "reqps",                  ← единица измерения
    "targets": [                      ← что показывать
      { "expr": "rate(http_requests_total[5m])" }
    ]
  }

Главное поле — targets[].expr. Это тот самый PromQL из Акта 11.
Панель не считает ничего сама: она отправляет выражение в источник данных
и рисует то, что вернулось.`},{kind:"say",text:`Из этого следует важное: дашборд ровно настолько хорош, насколько хороши
запросы в нём. Красивая панель с неправильным PromQL — это красивое враньё.
Поэтому Акт 11 шёл раньше: сначала запросы, потом картинки.`},{kind:"quiz",text:"Что находится в поле  targets[].expr  панели?",options:["Запрос PromQL — панель отправляет его в источник данных и рисует ответ","Название метрики без всяких функций","Ссылка на дашборд"],answer:0,explain:"Панель — это оболочка вокруг запроса. Вся логика — в выражении PromQL."}]},{id:"12.5",act:12,title:"Первый дашборд",xp:25,intro:"Опишем четыре панели и посмотрим на результат.",setup:t=>{dr(t),t.templates={"/home/devops/grafana/dashboard.json":`{ "title": "shop-api", "panels": [] }

// ЗАДАЧА: добавь панели. Нужны как минимум:
//   запросы в секунду  — rate(http_requests_total[5m])
//   ошибки 5xx         — rate(http_requests_total{status="500"}[5m])
//   p95 задержки       — histogram_quantile(0.95, rate(http_request_duration_seconds_bucket[5m]))
//   цели опрашиваются  — up
// Комментарии удали: в JSON их быть не должно.
`}},steps:[{kind:"say",text:`Соберём дашборд для сервиса shop-api. Что на нём должно быть — мы уже знаем
из Акта 10: четыре золотых сигнала.

  запросы в секунду   — трафик
  ошибки 5xx          — ошибки
  p95 задержки        — задержка
  цели опрашиваются   — здоровье сбора метрик`},{kind:"do",text:`Задача: опиши дашборд. Набери:
edit dashboard.json
Добавь четыре панели с выражениями из подсказки в файле. Сохрани.`,check:t=>Q("/home/devops/grafana/dashboard.json",/"panels"/)(t)&&Q("/home/devops/grafana/dashboard.json",/rate\(/)(t)&&Q("/home/devops/grafana/dashboard.json",/histogram_quantile/)(t),answer:hr,editFile:"/home/devops/grafana/dashboard.json",hint:"Открой  edit dashboard.json  и впиши четыре панели: у каждой title, unit и targets с expr."},{kind:"do",text:"Задача: проверь дашборд — заодно он загрузится в Grafana.",check:t=>!!t.grafana&&t.grafana.dashboards.length>0,answer:"grafana check dashboard.json",hint:"Команда  grafana check dashboard.json"},{kind:"watch",run:"grafana render",note:`Вот как этот дашборд выглядит для дежурного: четыре числа, и по ним сразу
понятно состояние сервиса.

Значения пришли из Prometheus — те же самые, что ты получал в Акте 11
командой promql. Панель просто оформила их подписью и единицей измерения.`},{kind:"type",text:"Посмотри дашборд сам. Набери:  grafana render",cmd:"grafana render"},{kind:"quiz",text:"Откуда панель «p95 задержки» взяла своё число?",options:["Grafana отправила выражение histogram_quantile(...) в Prometheus и нарисовала ответ","Grafana посчитала перцентиль сама","Число записано прямо в JSON дашборда"],answer:0,explain:"Все вычисления делает источник данных. Дашборд — это набор запросов плюс оформление."}]},{id:"12.6",act:12,title:"Какую панель выбрать",xp:20,intro:"График, число, шкала или таблица — под каждую задачу своя.",steps:[{kind:"say",text:`Типов панелей много, но в 90% случаев хватает четырёх:

  Time series (график) — значение во времени. Основной тип.
     Берут, когда важен ТРЕНД: росло, падало, скакнуло в 14:20.

  Stat (одно число)    — текущее значение крупно.
     Берут для «сколько сейчас»: RPS, число подов, ошибок за час.`},{kind:"say",text:`  Gauge (шкала)        — значение относительно предела.
     Хорош там, где есть потолок: занятость диска, использование квоты.
     Плохо подходит для величин без естественного максимума.

  Table (таблица)      — список с разрезами по лейблам.
     Берут, когда нужно сравнить много сущностей: топ эндпоинтов по ошибкам,
     список подов с рестартами.`},{kind:"say",text:`Практическое правило: на дашборде дежурного сверху ставят несколько Stat
(чтобы одним взглядом понять «плохо или нет»), а под ними — графики,
чтобы понять «когда началось и как менялось».

Таблицы кладут ниже: они отвечают на вопрос «а кто именно виноват»,
и нужны уже на этапе разбора, а не первого взгляда.`},{kind:"quiz",text:"Нужно понять, в какой момент начался рост ошибок. Какая панель подходит?",options:["Time series — только график показывает поведение во времени","Stat — одно текущее число","Gauge — шкала"],answer:0,explain:"Stat отвечает «сколько сейчас», график — «как менялось». Для поиска момента нужен график."}]},{id:"12.7",act:12,title:"Дашборд, который не врёт",xp:25,intro:"Одна и та же цифра может успокоить или напугать — зависит от оформления.",setup:dr,steps:[{kind:"say",text:`Дашборд — инструмент принятия решений в стрессе. Поэтому у него есть
требование, которое важнее красоты: он не должен вводить в заблуждение.

Три способа соврать, не написав ни одной неправды:`},{kind:"say",text:`  1) Неверная единица измерения.
     Prometheus отдаёт задержку в СЕКУНДАХ (0.213). Если у панели
     не задан unit, на экране будет «0.213» — и человек прочитает это
     как 0.2 чего-то. С  unit: s  Grafana сама покажет «213 мс».

  2) Ось Y, начинающаяся не с нуля.
     График колебания 40.1 → 40.4 при обрезанной оси выглядит как обвал.
     Для величин «сколько чего-то» ось начинают с нуля.`},{kind:"say",text:`  3) Среднее вместо перцентиля.
     Помнишь Акт 10: средняя задержка 180 мс выглядит прекрасно,
     когда каждый двадцатый пользователь ждёт 4 секунды.
     На дашбордах показывают p95/p99, а не avg.

И общее правило: у каждой панели должна быть понятная подпись.
«Запросы в секунду» — понятно. «rate5m» — понятно только автору.`},{kind:"watch",run:"grafana render",note:`Обрати внимание на строку p95: значение пришло как 0.213 (секунды),
а показано как «213 мс» — сработала единица измерения  unit: s .

Именно поэтому unit заполняют всегда.`},{kind:"quiz",text:"Панель показывает «0.213» без единицы измерения. Чем это плохо?",options:["Непонятно, чего 0.213 — секунд, процентов, запросов; с unit: s было бы «213 мс»","Ничем, число же правильное","Grafana не умеет показывать дробные числа"],answer:0,explain:"Дашборд читают в стрессе. Любая неоднозначность стоит минут — а иногда неверного решения."}]},{id:"12.8",act:12,title:"Переменные: один дашборд на все сервисы",xp:20,intro:"Чтобы не плодить двадцать одинаковых дашбордов, в них подставляют переменную.",steps:[{kind:"say",text:`У компании двадцать сервисов. Делать двадцать одинаковых дашбордов,
отличающихся одним словом в запросе, — плохая идея: поправить придётся
все двадцать.

Вместо этого в Grafana есть переменные (их называют templating).`},{kind:"say",text:`Переменная объявляется в дашборде и появляется выпадающим списком сверху.
В запросах на неё ссылаются через знак доллара:

  rate(http_requests_total{job="$service"}[5m])
                                └───┬──┘
                              переменная

Игрок выбирает в списке  app  — и все панели дашборда мгновенно
перестраиваются на этот сервис.`},{kind:"say",text:`Откуда берётся список значений: чаще всего его тоже задают запросом —
например «все значения лейбла job, которые есть в Prometheus». Тогда
новый сервис появляется в списке сам, без правки дашборда.

Есть и режим повторения: одна описанная панель рисуется по разу
для каждого значения переменной. Так делают экраны вида «по одному
графику на каждый инстанс».`},{kind:"quiz",text:"Зачем в дашборде переменная  $service ?",options:["Один дашборд обслуживает все сервисы — значение выбирается списком сверху","Чтобы дашборд грузился быстрее","Переменные обязательны в каждом дашборде"],answer:0,explain:"Одно место правды вместо двадцати копий. Правка одного дашборда чинит его для всех сервисов."}]},{id:"12.9",act:12,title:"Дашборды как код",xp:20,intro:"JSON дашборда лежит в git и едет в Grafana автоматически.",steps:[{kind:"say",text:`Дашборд можно собрать мышкой и нажать «Сохранить». Он ляжет в базу Grafana —
и на этом история заканчивается: кто менял, что было раньше, как повторить
в другом окружении — неизвестно.

Поэтому дашборды тоже держат файлами в репозитории.`},{kind:"say",text:`Как это выглядит на практике:

  1) JSON дашборда лежит в git рядом с кодом сервиса
  2) изменение дашборда — это pull request, который кто-то смотрит
  3) после слияния CI кладёт файл в папку provisioning
  4) Grafana подхватывает его сама

Полезный побочный эффект: дашборд появляется вместе с сервисом,
а не «когда-нибудь потом руками».`},{kind:"say",text:`Удобный приём: рядом с dashboard.json держат файл-описание, где сказано,
из какой папки Grafana берёт дашборды и в какую папку интерфейса их класть.
Это тот же provisioning, что и для источников данных из урока 12.3.

Итого вся Grafana описывается двумя видами файлов: источники и дашборды.
Ни одного клика — и любая копия Grafana поднимается за минуты.`},{kind:"quiz",text:"Дашборд собрали мышкой и сохранили в Grafana. Чем это плохо?",options:["Нет истории и ревью, и его нельзя воспроизвести в другом окружении","Он будет медленно работать","Такой дашборд нельзя показать команде"],answer:0,explain:"Та же причина, что и в Акте 8: настроенное кликами не воспроизводится и не проходит ревью."}]},{id:"12.10",act:12,title:"Инцидент: панель врёт ⚡",xp:45,intro:"На дашборде «41 тысяча запросов в секунду». Разбираемся, почему это неправда.",setup:t=>{dr(t),le(t,"/home/devops/grafana/dashboard.json",ia),t.grafana.dashboards=[{title:"shop-api",panels:[{title:"Запросы в секунду",expr:"http_requests_total",unit:"reqps"},{title:"Цели опрашиваются",expr:"up",unit:""}]}]},steps:[{kind:"say",text:`Коллега прислал дашборд и спрашивает: «у нас правда 128 тысяч запросов
в секунду?». Сервис маленький, столько быть не может. Посмотрим.`},{kind:"do",text:"Шаг 1. Посмотри, что показывает дашборд.",check:oe(/^grafana\s+render/),answer:"grafana render",hint:"Команда  grafana render"},{kind:"say",text:`Панель «Запросы в секунду» показывает 128400 запросов/с.

Число не абсурдное само по себе — абсурдна его ЕДИНИЦА. 128400 это
всего запросов с момента запуска приложения, а подписано как «в секунду».
Значит в панели стоит сам счётчик, а не его скорость роста.`},{kind:"do",text:"Шаг 2. Посмотри, какое выражение стоит в дашборде.",check:oe(/^cat\s+dashboard\.json/),answer:"cat dashboard.json",hint:"Команда  cat dashboard.json"},{kind:"say",text:`В панели написано  "expr": "http_requests_total"  — счётчик напрямую.

Ровно та ошибка, о которой был урок 11.8: у counter смотрят не значение,
а скорость роста через  rate() . Здесь она особенно опасна, потому что
подпись панели уверенно говорит «в секунду» — и человек ей верит.`},{kind:"do",text:`Шаг 3. Почини панель. Набери:
edit dashboard.json
Оберни выражение в rate(...[5m]). Сохрани.`,check:Q("/home/devops/grafana/dashboard.json",/rate\(\s*http_requests_total/),answer:hr,editFile:"/home/devops/grafana/dashboard.json",hint:'Замени  "expr": "http_requests_total"  на  "expr": "rate(http_requests_total[5m])"'},{kind:"do",text:"Шаг 4. Перезагрузи дашборд проверкой.",check:t=>!!t.grafana&&t.grafana.dashboards.some(e=>e.panels.some(s=>/rate\(/.test(s.expr))),answer:"grafana check dashboard.json",hint:"Команда  grafana check dashboard.json"},{kind:"do",text:"Шаг 5. Убедись, что панель теперь показывает правдоподобное число.",check:t=>t.log.filter(e=>/^grafana\s+render/.test(e.cmd)).length>=2,answer:"grafana render",hint:"Команда  grafana render  — должно стать 41.3 запросов/с"},{kind:"say",text:`41.3 запроса в секунду — вот это похоже на правду.

Вывод на будущее: дашборд врал не из-за поломки, а из-за неверного запроса.
Поэтому дашборды и проходят ревью в pull request — вторая пара глаз ловит
именно такие вещи. И поэтому Акт 11 (PromQL) важнее Акта 12 (картинки).`}]},{id:"12.11",act:12,title:"Алерты: Grafana или Prometheus",xp:20,intro:"Правила можно завести в двух местах. Разбираемся, где и почему.",steps:[{kind:"say",text:`В Акте 11 мы заводили правила алертов в Prometheus — файлом alerts.yml.
Grafana тоже умеет алерты: правило создаётся прямо у панели.

Возникает вопрос, где их держать. Ответ зависит от того, что важнее.`},{kind:"say",text:`Алерты в Prometheus:

  + работают, даже если Grafana выключена — а это важно, потому что
