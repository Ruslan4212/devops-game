ие 20 строк.","Акт 2. Создать каталог ~/app, положить туда deploy.sh, выставить ему права 750 (chmod) и убедиться через ls -l. Посмотреть свои процессы: ps -ef | grep $USER.","Акт 3. Дописать deploy.sh: шебанг, set -euo pipefail, аргумент $1 (окружение), проверка что цель задана, вывод даты. Запустить: ./deploy.sh prod.","Акт 4. Проверить сеть: curl -I http://localhost (или другой доступный адрес), посмотреть слушающие порты (ss -ltnp). В комментарии объяснить полученный HTTP-код.",'Акт 5. В ~/app: git init, положить index.html, git add . && git commit -m "capstone: init". Создать ветку feature/banner, изменить файл, закоммитить, слить в main.',"Акт 6. Написать Dockerfile для статики (FROM nginx:alpine, COPY index.html). Собрать: docker build -t capstone:1.0 . Запустить контейнер с пробросом порта, проверить curl-ом.","Акт 7. Создать .github/workflows/ci.yml: триггер on: push, шаг с проверкой синтаксиса (bash -n deploy.sh). В комментарии — где хранить секреты и почему не в репозитории.","Акт 8. Написать main.tf с ресурсом local_file (filename ~/app/build.txt, content — дата сборки). Выполнить terraform init, terraform plan (разобрать знаки), terraform apply.","Акт 9. Написать deploy.yaml (kind: Deployment, replicas: 2, образ capstone:1.0, env). Есть kubectl — применить и kubectl get pods; нет — объяснить каждое поле манифеста.","Акт 10. Свести всё в ~/app/capstone.sh: скрипт выполняет шаги 3, 5 и 8 без ручного ввода и печатает отчёт (что сделано, сколько заняло) — это твой мини-runbook."];function ar(e){const l=document.createElement("div");l.className="cap-ov",l.tabIndex=-1,l.innerHTML='<div class="cap-box"><div class="cap-brief"><div class="cap-head"><b>Капстоун — реальный сервер</b><button class="cap-x" id="capX">закрыть</button></div><p>Ниже — <b>настоящий изолированный Linux-контейнер</b>, не симулятор. Примени всё из курса. Сессия ограничена по времени; контейнер удаляется после закрытия.</p><ol class="cap-tasks">'+or.map(w=>`<li>${w}</li>`).join("")+'</ol><di   <body>
    <div class="top">
      <div class="logo"><i></i>TERMINAL OPS ACADEMY</div>
      <div class="xpwrap">
        <div class="r"><span id="rankTxt">Стажёр</span><span id="xpTxt">0 XP</span></div>
        <div class="xpbar"><i id="xpFill"></i></div>
      </div>
      <div class="rankchip" id="progChip">0 / 23 заданий</div>
      <div class="sp">
        <button class="tbtn" id="glosBtn">📖 команды</button>
        <button class="tbtn" id="lifeBtn">🎒 жизнь</button>
        <button class="tbtn" id="careerBtn">💼 карьера</button>
        <button class="tbtn" id="certBtn">🏆 сертификат</button>
        <button class="tbtn" id="howBtn">как играть</button>
        <button class="tbtn" id="resetBtn">сброс</button>
      </div>
    </div>

    <div class="wrap">
      <div class="col rail-col"><div class="card scroll rail" id="rail"></div></div>
      <div class="col term-col">
        <div class="term">
          <div class="termbar">
            <span class="dots"><s></s><s></s><s></s></span><span>bash</span>
          </div>
          <div class="out" id="out"></div>
          <form class="inline" id="cmdForm" autocomplete="off">
            <span class="p" id="prompt">$</span>
            <input
              id="cmd"
              autocomplete="off"
              autocapitalize="off"
              spellcheck="false"
              placeholder="набери команду и нажми Enter (help — список команд)"
            />
          </form>
        </div>
      </div>
      <div class="col brief-col"><div class="card scroll brief" id="brief"></div></div>
    </div>

    <div class="ov hide" id="edOv">
      <div class="sheet">
        <header><span>редактор</span><span class="fn" id="edName">file</span></header>
        <div class="body"><textarea id="edText" spellcheck="false"></textarea></div>
        <footer>
          <span class="tip">Ctrl+S — сохранить</span>
          <button class="sec" id="edCancel">отмена</button>
          <button class="prim" id="edSave">Сохранить</button>
        </footer>
      </div>
    </div>

    <div class="ov hide" id="modOv"><div class="modal" id="modBody"></div></div>
    <div class="toast" id="toast"></div>

  </body>
