{id:"g1",t:"Три зоны и первый коммит",goal:"Понять, где физически лежат твои изменения",
 cards:[
 {h:"Три зоны — ключевая модель",b:"<pre>рабочий каталог  →  индекс (stage)  →  репозиторий\n      git add ─────────┘   git commit ────┘</pre><p><b>Рабочий каталог</b> — файлы, которые ты видишь. <b>Индекс</b> — черновик следующего коммита. <b>Репозиторий</b> — сохранённая история.</p><p><b>Зачем в жизни:</b> индекс позволяет собрать коммит осознанно, а не «всё, что накопилось» — из десяти изменённых файлов кладёшь только три, относящихся к одной задаче."},
 {h:"git status — где я и что изменено",b:"<pre>git status\ngit status -s   <span class='c'># короткий формат</span></pre><p>В конце вывода git сам подсказывает следующую команду — читай его, а не заучивай наизусть.</p><p><b>Зачем в жизни:</b> первая команда в любом репозитории перед любым действием — привычка, которая экономит массу времени на «а что я вообще менял».</p>",
  cheat:"git status — что изменено и что в индексе, всегда первая команда",
  t:{q:"Посмотри текущее состояние репозитория: что изменено и что в индексе.",ans:["git status","git status -s"],hint:"главная команда git",why:"Читай его вывод целиком — в конце git сам подсказывает следующий шаг."}},
 {h:"git add — положить в индекс",b:"<pre>git add file.txt\ngit add .              <span class='c'># всё изменённое</span>\ngit add -p             <span class='c'># добавлять по кускам, осознанно</span></pre><p><b>Зачем в жизни:</b> <code>git add -p</code> — способ закоммитить только относящееся к задаче, даже если в рабочем каталоге вперемешку лежат правки для двух разных вещей.</p>",
  cheat:"git add файл — в индекс · git add -p — по кускам, осознанно",
  t:{q:"Добавь файл app.js в индекс.",ans:["git add app.js"],hint:"git add имя_файла",why:"Файл попадает в индекс — черновик следующего коммита."}},
 {h:"git commit — зафиксировать",b:"<pre>git commit -m \"fix: таймаут прокси\"</pre><p>Формат conventional commits: <code>feat</code>, <code>fix</code>, <code>chore</code>, <code>docs</code>. Из них автоматически собирается changelog.</p><p><b>Зачем в жизни:</b> через полгода тебе будет важно только «почему», а не «что» — пиши сообщение для будущего себя, а не для текущего ревьюера.</p>",
  cheat:"git commit -m \"тип: суть\" — fix/feat/chore/docs, тип определяет changelog",
  t:{q:"Закоммить изменения из индекса с сообщением в формате conventional commits: исправлен таймаут прокси.",ans:["git commit -m \"fix: таймаут прокси\"","git commit -m 'fix: таймаут прокси'"],hint:"git commit -m \"fix: ...\"",why:"Префикс fix: явно говорит, что это исправление — попадёт в patch-версию changelog."}},
 {h:".gitignore — что не должно попасть в репозиторий",b:"<pre># .gitignore\nnode_modules/\n.env\n*.log</pre><p>Действует только на <b>неотслеживаемые</b> файлы. Если файл уже закоммичен, добавление в игнор ничего не изменит — нужен <code>git rm --cached файл</code>.</p><p><b>Зачем в жизни:</b> секреты, зависимости и артефакты сборки не место в git — но если секрет уже попал в историю, .gitignore его задним числом не уберёт.</p>",
  cheat:"git rm --cached файл — перестать отслеживать уже закоммиченный файл (после добавления в .gitignore)"}],
 ch:[
 {t:"c",d:1,q:"Разминка. Посмотри текущее состояние репозитория.",ans:["git status","git status -s"],hint:"git status",why:"Первая команда перед любым действием."},
 {t:"c",d:2,q:"Добавь все изменённые файлы в индекс одной командой.",ans:["git add .","git add -A"],hint:"git add .",why:"Точка добавляет все изменения в текущем каталоге и подкаталогах."},
 {t:"c",d:3,q:"Закоммить изменения из индекса с сообщением о новой функции: добавлена корзина покупок.",ans:["git commit -m \"feat: добавлена корзина покупок\"","git commit -m 'feat: добавлена корзина покупок'"],hint:"git commit -m \"feat: ...\"",why:"feat: обозначает новую функцию для conventional commits."},
 {t:"c",d:4,q:"Файл .env уже был закоммичен ранее, а теперь ты добавил его в .gitignore — но git всё равно показывает его как изменённый. Перестань отслеживать этот файл, не удаляя его с диска.",ans:["git rm --cached .env"],hint:"git rm --cached файл",why:"--cached убирает файл только из индекса git, физически он остаётся на диске."},
 {t:"c",d:5,q:"Инцидент. Ты неделю работал, делая коммиты «wip» и «ещё правки». На проде баг, вызванный одним из последних пяти коммитов, и ты хочешь посмотреть их список компактно, чтобы понять, какой из них подозрителен. Покажи последние 5 коммитов в одну строку каждый.",ans:["git log --oneline -5","git log -5 --oneline","git log --oneline -n 5"],hint:"git log --oneline -N",why:"Компактный список — первый шаг расследования. Дальше по каждому коммиту смотрят git show, но найти кандидатов быстро помогает именно --oneline."}]},

{id:"g2",t:"Ветки и слияние",goal:"Работать параллельно и соединять результаты",
 cards:[
 {h:"Ветка — это указатель",b:"<p>Ветка в git — не копия файлов, а <b>подвижный указатель на коммит</b>. Создание ветки — запись 40 байт, мгновенно и ничего не стоит.</p><p><b>Зачем в жизни:</b> раз ветки бесплатны, их создают под каждую задачу свободно — нет причины экономить и работать в одной общей ветке.</p>"},
 {h:"git switch -c — создать и перейти",b:"<pre>git switch -c feature/auth   <span class='c'># создать и перейти</span>\ngit switch main              <span class='c'># переключиться на существующую</span>\ngit branch                   <span class='c'># список локальных</span></pre><p><code>switch</code> — новая понятная команда вместо перегруженного <code>checkout</code>, который делал слишком много всего сразу.</p>",
  cheat:"git switch -c имя — создать ветку и сразу перейти в неё",
  t:{q:"Создай ветку feature/payments и сразу перейди в неё.",ans:["git switch -c feature/payments","git checkout -b feature/payments"],hint:"git switch -c имя",why:"switch отвечает именно за переключение веток."}},
 {h:"git merge — слияние",b:"<pre>git merge feature/auth            <span class='c'># fast-forward, если возможно</span>\ngit merge --no-ff feature/auth    <span class='c'># всегда merge-коммит</span></pre><p><b>Fast-forward:</b> если main не ушёл вперёд, git просто передвигает указатель. <b>3-way merge:</b> если ушёл — создаётся merge-коммит с двумя родителями.</p><p><b>Зачем в жизни:</b> <code>--no-ff</code> используют, чтобы в истории было видно факт существования фичи — удобно для отката целой ветки одним коммитом.</p>",
  cheat:"git merge ветка — слить в текущую · --no-ff всегда создаёт merge-коммит",
  t:{q:"Слей ветку feature/auth в текущую ветку, гарантированно создав merge-коммит (не fast-forward).",ans:["git merge --no-ff feature/auth"],hint:"git merge --no-ff ветка",why:"--no-ff всегда создаёт merge-коммит, даже когда fast-forward был бы возможен."}},
 {h:"Разрешение конфликтов",b:"<pre>&lt;&lt;&lt;&lt;&lt;&lt;&lt; HEAD\nproxy_read_timeout 30s;\n=======\nproxy_read_timeout 60s;\n&gt;&gt;&gt;&gt;&gt;&gt;&gt; feature/timeouts</pre><p>Оставь осмысленный результат, удали маркеры, затем <code>git add файл</code> и <code>git commit</code>.</p><pre>git merge --abort   <span class='c'># отменить слияние, вернуться как было</span></pre><p><b>Зачем в жизни:</b> главная профилактика конфликтов — короткие ветки. Ветка неделю жизни конфликтует почти гарантированно.</p>",
  cheat:"git merge --abort — отменить слияние и вернуться в состояние до него"}],
 ch:[
 {t:"c",d:1,q:"Разминка. Создай ветку feature/search и сразу перейди в неё.",ans:["git switch -c feature/search","git checkout -b feature/search"],hint:"git switch -c имя",why:"Современный синтаксис для создания и перехода одной командой."},
 {t:"c",d:2,q:"Переключись обратно на ветку main.",ans:["git switch main","git checkout main"],hint:"git switch main",why:"switch без -c переключается на существующую ветку."},
 {t:"c",d:3,q:"Слей ветку feature/search в текущую ветку так, чтобы гарантированно остался след в истории (merge-коммит), даже если возможен fast-forward.",ans:["git merge --no-ff feature/search"],hint:"git merge --no-ff ветка",why:"--no-ff сохраняет видимый след слияния — полезно, если позже понадобится откатить всю фичу одним коммитом."},
 {t:"c",d:4,q:"Слияние началось, и в файле nginx.conf возник конфликт. Ты решил, что проще отменить всю операцию и начать заново. Отмени слияние.",ans:["git merge --abort"],hint:"git merge --abort",why:"Возвращает состояние ровно к тому, что было до начала merge."},
 {t:"c",d:5,q:"Инцидент. Ветка фичи живёт три недели без единого обновления из main, и при попытке слияния — куча конфликтов в файлах, которые ты не трогал. Ты хочешь подтянуть свежий main в свою ветку feature/old, находясь в ней, чтобы разрешать конфликты постепенно, а не все разом при финальном merge. Какую команду выполнить (находясь в feature/old)?",ans:["git merge main"],hint:"git merge main, находясь в своей ветке",why:"Регулярное подтягивание main в рабочую ветку — практика, которая не даёт конфликтам накопиться до одного огромного слияния в конце."}]},

{id:"g3",t:"Отмена изменений",goal:"Вернуть как было, не потеряв чужую работу",
 cards:[
 {h:"git restore — отменить локальные правки",b:"<pre>git restore файл            <span class='c'># отменить правки, не добавленные в индекс</span>\ngit restore --staged файл   <span class='c'># убрать из индекса, оставив правки</span></pre><p><b>Зачем в жизни:</b> «я испортил файл и хочу вернуть его к последнему коммиту» — restore, а не reset, который действует на уровне коммитов целиком.</p>",
  cheat:"git restore файл — отменить локальные правки · --staged убрать из индекса",
  t:{q:"Отмени незакоммиченные правки в файле app.js, вернув его к состоянию последнего коммита.",ans:["git restore app.js"],hint:"git restore файл",why:"restore работает на уровне файла, в отличие от reset, который двигает весь коммит."}},
 {h:"git reset --soft — переделать коммит",b:"<pre>git reset --soft HEAD~1   <span class='c'># убрать коммit, изменения остаются в индексе</span></pre><p>Идеально, когда закоммитил рано или с плохим сообщением: поправил и закоммитил заново.</p><p><b>Зачем в жизни:</b> частый приём при подготовке PR — собрал несколько мелких коммитов обратно в индекс, чтобы закоммитить их одним осмысленным.</p>",
  cheat:"git reset --soft HEAD~1 — убрать последний коммит, изменения остаются в индексе",
  t:{q:"Убери последний коммит, но оставь его изменения в индексе, чтобы закоммитить заново с другим сообщением.",ans:["git reset --soft HEAD~1"],hint:"git reset --soft HEAD~1",why:"--soft — единственный режим, который не трогает ни индекс, ни рабочий каталог."}},
 {h:"git revert — безопасная отмена в общей ветке",b:"<pre>git revert a1b2c3d        <span class='c'># новый коммит, отменяющий указанный</span></pre><p><b>Ключевое правило:</b> в ветке, которую уже видели другие, отменяют только через revert. Он не меняет существующие коммиты, а добавляет новый.</p><p><b>Зачем в жизни:</b> reset --hard + force push в общей ветке = переписанная история у всей команды и потерянные чужие коммиты.</p>",
  cheat:"git revert коммит — безопасная отмена в общей ветке (новый коммит, история не переписывается)",
  t:{q:"Отмени коммит a1b2c3d в общей ветке main новым коммитом, не переписывая историю.",ans:["git revert a1b2c3d"],hint:"git revert коммит",why:"revert безопасен для общих веток — история остаётся одинаковой у всех."}},
 {h:"git reflog — сеть безопасности",b:"<pre>git reflog\nb8c9d0e HEAD@{0}: reset: moving to HEAD~3\nf2a3b4c HEAD@{1}: commit: feat: уведомления</pre><p>Хранит все перемещения HEAD около 90 дней, включая «удалённые» коммиты.</p><p><b>Зачем в жизни:</b> почти всё, что кажется потерянным в git, восстанавливается отсюда — паниковать почти никогда не нужно. Исключение — незакоммиченные изменения, их reflog не помнит.</p>",
  cheat:"git reflog — все положения HEAD за ~90 дней, спасает почти всегда"}],
 ch:[
 {t:"c",d:1,q:"Разминка. Отложи незакоммиченные изменения, чтобы срочно переключиться на другую ветку.",ans:["git stash","git stash push"],hint:"git stash",why:"git stash pop вернёт их обратно."},
 {t:"c",d:2,q:"Убери последний коммит, оставив его изменения в индексе для повторного коммита.",ans:["git reset --soft HEAD~1"],hint:"git reset --soft HEAD~1",why:"--soft не трогает ни индекс, ни рабочий каталог."},
 {t:"c",d:3,q:"Плохой коммит a1b2c3d уже в main, которым пользуется вся команда. Отмени его безопасным способом, не переписывая историю.",ans:["git revert a1b2c3d"],hint:"git revert коммит",why:"revert создаёт новый коммит-антидот вместо переписывания истории."},
 {t:"c",d:4,q:"Коллега случайно выполнил git reset --hard и потерял три незапушенных коммита. Помоги ему найти их: покажи журнал перемещений HEAD.",ans:["git reflog","git reflog show"],hint:"git reflog",why:"Reflog хранит положения HEAD около 90 дней — коммиты, скорее всего, ещё живы в объектной базе."},
 {t:"c",d:5,q:"Инцидент. Разработчик сделал force push в main и снёс дневную работу двух коллег. У одного из них локально сохранился reflog с нужными коммитами. Он нашёл в reflog хеш f2a3b4c — состояние до потери. Восстанови ветку main до этого состояния (жёстко, зная, что это осознанное восстановление).",ans:["git reset --hard f2a3b4c"],hint:"git reset --hard хеш_из_reflog",why:"reset --hard тут оправдан: восстанавливаем известное хорошее состояние. После этого потребуется force push с осторожностью и договорённостью со всей командой."}]},

{id:"g4",t:"Удалённые репозитории",goal:"Синхронизироваться с командой без сюрпризов",
 cards:[
 {h:"git fetch — безопасно всегда",b:"<pre>git fetch origin\ngit log --oneline HEAD..origin/main   <span class='c'># что прилетело нового</span></pre><p><code>fetch</code> скачивает изменения, ничего не сливая. <code>origin/main</code> — это <b>локальная копия</b> состояния сервера на момент последнего fetch, не текущее состояние сервера.</p><p><b>Зачем в жизни:</b> привычка «сначала fetch, посмотреть, потом решить» экономит нервы — видишь, что придёт, до того как оно смешается с твоей работой.</p>",
  cheat:"git fetch — скачать без слияния · origin/main — снимок сервера на момент последнего fetch",
  t:{q:"Скачай изменения с сервера, не сливая их с текущей веткой.",ans:["git fetch","git fetch origin"],hint:"git fetch",why:"fetch только обновляет твоё представление о сервере, ничего не меняя локально."}},
 {h:"git pull --rebase при отклонённом push",b:"<pre>! [rejected] main -&gt; main (non-fast-forward)\n\ngit pull --rebase\n<span class='c'># разрешить конфликты, если есть</span>\ngit push</pre><p>Значит, в удалённой ветке есть коммиты, которых нет у тебя — git защищает чужую работу.</p><p><b>Неправильно:</b> <code>git push --force</code> затрёт чужие коммиты.</p>",
  cheat:"push отклонён non-fast-forward → git pull --rebase, потом push снова",
  t:{q:"Твой push отклонён с сообщением non-fast-forward. Перенеси свои коммиты поверх свежих с сервера.",ans:["git pull --rebase"],hint:"git pull --rebase",why:"Переносит твои локальные коммиты поверх новых с сервера вместо создания merge-коммита."}},
 {h:"--force-with-lease вместо --force",b:"<pre>git push --force-with-lease</pre><p>Откажется затирать изменения, появившиеся на сервере после твоего последнего fetch — в отличие от обычного --force, который затирает молча.</p><p><b>Зачем в жизни:</b> единственная форма форса, допустимая в общем репозитории после rebase своей опубликованной ветки.</p>",
  cheat:"git push --force-with-lease — безопасный форс, проверяет актуальность перед перезаписью"}],
 ch:[
 {t:"c",d:1,q:"Разминка. Скачай изменения с сервера, не сливая их с текущей веткой.",ans:["git fetch","git fetch origin"],hint:"git fetch",why:"Безопасное обновление представления о сервере."},
 {t:"c",d:2,q:"Посмотри, какие коммиты появились в origin/main, которых ещё нет у тебя локально (компактно).",ans:["git log --oneline HEAD..origin/main"],hint:"git log --oneline HEAD..origin/main",why:"Диапазон HEAD..origin/main показывает коммиты, которые есть там, но не здесь."},
 {t:"c",d:3,q:"Твой push отклонён как non-fast-forward. Перенеси свои коммиты поверх свежих изменений с сервера.",ans:["git pull --rebase"],hint:"git pull --rebase",why:"Правильная реакция на отклонённый push — не force, а перенос своих коммитов поверх новых."},
 {t:"c",d:4,q:"Ты сделал rebase своей уже опубликованной ветки и теперь должен запушить с форсом. Сделай это безопасным способом.",ans:["git push --force-with-lease"],hint:"git push --force-with-lease",why:"Проверяет, что на сервере ничего не появилось после твоего последнего fetch."},
 {t:"c",d:5,q:"Инцидент. После git pull в рабочем каталоге куча конфликтов и незнакомые изменения — слияние пошло не так. Хочешь вернуться в понятное состояние до слияния, чтобы разобраться спокойно. Отмени текущее слияние.",ans:["git merge --abort"],hint:"git merge --abort",why:"Возвращает состояние ровно к тому, что было до pull/merge — дальше можно спокойно посмотреть git log HEAD..origin/main и решить, что делать."}]},

{id:"g5",t:"Переписывание истории",goal:"Привести ветку в вид, за который не стыдно в PR",
 cards:[
 {h:"git commit --amend — поправить последний коммит",b:"<pre>git add забытый_файл\ngit commit --amend --no-edit    <span class='c'># добавить в последний коммит без изменения сообщения</span></pre><p>Коммит не изменяется, а заменяется новым с другим хешем — безопасно только до публикации ветки.</p><p><b>Зачем в жизни:</b> забыл файл в последнем коммите — вместо коммита-заплатки «fix» просто дополняешь предыдущий.</p>",
  cheat:"git commit --amend --no-edit — дополнить последний коммит, сохранив сообщение",
  t:{q:"Ты забыл добавить файл config.js в последний коммит (ветка ещё не запушена). Добавь его в индекс и дополни последний коммит, не меняя сообщение.",ans:["git add config.js && git commit --amend --no-edit"],hint:"git add файл && git commit --amend --no-edit",why:"amend заменяет последний коммит новым, включающим добавленный файл."}},
 {h:"git rebase -i — причесать серию коммитов",b:"<pre>git rebase -i HEAD~5</pre><pre>pick   a1b2c3d feat: корзина\nsquash b2c3d4e fix: опечатка\nfixup  c3d4e5f ещё правка</pre><p><code>squash</code> склеивает с предыдущим, объединяя сообщения; <code>fixup</code> — то же, но отбрасывая сообщение.</p><p><b>Зачем в жизни:</b> двенадцать коммитов «wip» превращаются в два осмысленных перед код-ревью.</p>",
  cheat:"git rebase -i HEAD~N — интерактивно причесать последние N коммитов перед PR"},
 {h:"git cherry-pick — перенос одного коммита",b:"<pre>git cherry-pick a1b2c3d</pre><p>Берёт изменения одного коммита и накладывает на текущую ветку новым коммитом.</p><p><b>Зачем в жизни:</b> починили баг в main, нужно то же самое в release-ветке — не пересобирать вручную, а перенести готовый коммит.</p>",
  cheat:"git cherry-pick коммит — перенести один коммит в текущую ветку",
  t:{q:"Перенеси коммит a1b2c3d из другой ветки в текущую.",ans:["git cherry-pick a1b2c3d"],hint:"git cherry-pick коммит",why:"Типично для хотфиксов, переносимых между main и release-веткой."}}],
 ch:[
 {t:"c",d:1,q:"Разминка. Ты забыл добавить файл styles.css в последний коммит (ветка не запушена). Добавь его и дополни последний коммит, сохранив прежнее сообщение.",ans:["git add styles.css && git commit --amend --no-edit"],hint:"git add файл && git commit --amend --no-edit",why:"amend заменяет коммит новым, включающим добавленный файл."},
 {t:"c",d:2,q:"Перенеси коммит f6e5d4c из ветки main в текущую release-ветку.",ans:["git cherry-pick f6e5d4c"],hint:"git cherry-pick коммит",why:"Типовой сценарий переноса хотфикса между ветками."},
 {t:"c",d:3,q:"Открой интерактивный rebase для последних 4 коммитов, чтобы причесать их перед PR.",ans:["git rebase -i HEAD~4"],hint:"git rebase -i HEAD~4",why:"Открывает список коммитов для squash/fixup/reword/drop."},
 {t:"c",d:4,q:"После интерактивного rebase своей уже опубликованной ветки нужен push с форсом. Выполни безопасную форму.",ans:["git push --force-with-lease"],hint:"git push --force-with-lease",why:"Не --force: force-with-lease защищает от перезаписи чужих изменений, появившихся на сервере."},
 {t:"c",d:5,q:"Инцидент. Ты сделал rebase ветки, которую коллега уже взял себе, и запушил с force-with-lease (успешно). Коллега при следующем git pull получит десятки конфликтов. Ты хочешь предупредить его правильной командой — какую команду ЕМУ нужно выполнить, чтобы синхронизировать свою локальную ветку feature/x с изменившейся историей origin/feature/x (жёстко привести в соответствие)?",ans:["git reset --hard origin/feature/x"],hint:"git reset --hard origin/ветка",why:"После force push с изменённой историей единственный чистый способ синхронизации у остальных — жёстко сбросить локальную ветку на новое состояние сервера, предварительно сохранив свои несохранённые наработки отдельно."}]},

{id:"g6",t:"Расследование: reflog, bisect, blame",goal:"Найти виновный коммит и вернуть потерянное",
 cards:[
 {h:"git bisect — бинарный поиск по истории",b:"<pre>git bisect start\ngit bisect bad             <span class='c'># сейчас сломано</span>\ngit bisect good v1.4.0     <span class='c'># здесь работало</span>\n<span class='c'># git переключается на середину, ты проверяешь:</span>\ngit bisect good  |  git bisect bad\ngit bisect reset           <span class='c'># выйти из режима</span></pre><p>Из 1000 коммитов виновный находится за 10 проверок: log₂(1000) ≈ 10.</p><p><b>Зачем в жизни:</b> единственный способ расследовать «когда-то давно сломалось» за разумное время вместо чтения истории вручную.</p>",
  cheat:"git bisect start → good/bad по очереди → git bisect reset в конце"},
 {h:"git log -S — поиск по содержимому",b:"<pre>git log -S \"cache.get\"        <span class='c'># коммиты, где менялось число вхождений строки</span>\ngit blame -L 40,60 src/app.js <span class='c'># кто и когда менял строки</span></pre><p><code>-S</code> находит момент появления или исчезновения конкретной строки, даже если файл переименовывали.</p><p><b>Зачем в жизни:</b> «когда появилась эта странная строка кода» — вопрос, на который отвечает именно -S, а не обычный log.</p>",
  cheat:"git log -S \"текст\" — коммиты, где менялось число вхождений строки в код",
  t:{q:"Найди коммиты, в которых менялось число вхождений строки cache.get в коде.",ans:["git log -S \"cache.get\"","git log -S cache.get"],hint:"git log -S \"текст\"",why:"Поиск по содержимому изменений, не по тексту сообщения коммита."}},
 {h:"git reflog — восстановление потерянного",b:"<pre>git reflog\nb8c9d0e HEAD@{0}: reset: moving to HEAD~3\nf2a3b4c HEAD@{1}: commit: feat: уведомления</pre><p>Хранит все перемещения HEAD около 90 дней.</p><p><b>Зачем в жизни:</b> почти всё, что кажется потерянным в git, восстанавливается отсюда.</p>",
  cheat:"git reflog — восстановить потерянные коммиты, помнит ~90 дней"}],
 ch:[
 {t:"c",d:1,q:"Разминка. Посмотри, где HEAD находился раньше, чтобы восстановить потерянные коммиты.",ans:["git reflog","git reflog show"],hint:"git reflog",why:"Reflog помнит все положения HEAD, даже после reset."},
 {t:"c",d:2,q:"Найди коммиты, где менялось число вхождений строки timeout в код.",ans:["git log -S timeout","git log -S \"timeout\""],hint:"git log -S текст",why:"Поиск по содержимому изменений, не по сообщению коммита."},
 {t:"c",d:3,q:"Узнай, кто и когда менял строки с 40 по 60 в файле src/app.js.",ans:["git blame -L 40,60 src/app.js"],hint:"git blame -L 40,60 файл",why:"blame показывает автора и коммит для каждой строки в указанном диапазоне."},
 {t:"c",d:4,q:"Начни бинарный поиск сломавшего коммита: пометь текущее состояние как плохое, а тег v1.4.0 — как хорошее (две команды через &&, начиная со start).",ans:["git bisect start && git bisect bad && git bisect good v1.4.0","git bisect start\ngit bisect bad\ngit bisect good v1.4.0"],hint:"git bisect start && git bisect bad && git bisect good v1.4.0",why:"Именно эта последовательность запускает бинарный поиск между двумя известными точками."},
 {t:"c",d:5,q:"Инцидент. Корзина считает неверно, две недели назад всё работало, за это время 300 коммитов. Есть скрипт ./test.sh, возвращающий 0 при успехе и 1 при провале. Запусти автоматический bisect, который сам пройдёт всю историю между текущим состоянием (HEAD) и тегом v_two_weeks_ago, используя этот скрипт.",ans:["git bisect start HEAD v_two_weeks_ago && git bisect run ./test.sh","git bisect start HEAD v_two_weeks_ago\ngit bisect run ./test.sh"],hint:"git bisect start HEAD тег && git bisect run ./test.sh",why:"git bisect run автоматизирует весь процесс: сам проверяет коммиты скриптом и называет первый плохой без ручного good/bad на каждом шаге."}]},

{id:"g7",t:"Работа в команде: PR и процесс",goal:"Жить в общем репозитории по правилам",
 cards:[
 {h:"Стратегии ветвления",b:"<table class='tw'><tr><th></th><th>GitFlow</th><th>Trunk-based</th></tr><tr><td>ветки</td><td>main, develop, release/*</td><td>main + короткие ветки</td></tr><tr><td>срок жизни</td><td>недели</td><td>1-2 дня</td></tr><tr><td>подходит</td><td>релизы по расписанию</td><td>частые деплои, CI/CD</td></tr></table><p><b>Зачем в жизни:</b> на собеседовании называй обе и объясняй выбор — для частых деплоев trunk-based, потому что короткие ветки почти не конфликтуют."},
 {h:"Хороший pull request",b:"<ul><li>Маленький — до ~400 строк: после этого порога находимость дефектов резко падает</li><li>Одно логическое изменение</li><li>Описание «что и зачем», не пересказ диффа</li><li>Зелёный CI до запроса ревью</li></ul><p><b>Зачем в жизни:</b> большой PR формально одобряют, фактически не читая — маленький реально проверяют."},
 {h:"Защита веток",b:"<p>Правила должны быть в настройках репозитория, а не в договорённостях: запрет прямого push и force push в main, обязательный PR с апрувом, обязательный зелёный CI.</p><p><b>Зачем в жизни:</b> единственная надёжная защита от «случайно снёс чужую работу» — правила, которые нельзя нарушить по забывчивости."}],
 ch:[
 {t:"q",d:1,q:"Команда деплоит по пять раз в день. Какая стратегия ветвления уместнее?",a:["GitFlow с develop и release-ветками","Trunk-based: короткие ветки и PR в main","Одна ветка на разработчика навсегда","Работать без веток"],c:1,why:"Частые деплои требуют коротких веток: чем дольше живёт ветка, тем дороже слияние."},
 {t:"q",d:2,q:"Почему PR на 2000 строк — плохо?",a:["Долго грузится страница","Ревьюер физически не может вникнуть: качество проверки падает, а риск растёт","GitHub не выдержит","Нельзя откатить"],c:1,why:"После ~400 строк находимость дефектов резко снижается."},
 {t:"c",d:3,q:"Ты хочешь посмотреть, кто последним менял каждую строку файла deploy.sh, чтобы понять контекст перед правкой.",ans:["git blame deploy.sh"],hint:"git blame файл",why:"blame показывает автора и коммит для каждой строки — инструмент понимания контекста, не поиска виноватых."},
 {t:"c",d:4,q:"Перед отправкой PR ты хочешь убедиться, что твоя ветка feature/x не отстаёт от main, подтянув свежие изменения через rebase (находясь в feature/x).",ans:["git rebase main"],hint:"git rebase main, находясь в своей ветке",why:"Перенос своих коммитов поверх актуального main — стандартная подготовка ветки перед ревью в trunk-based разработке."},
 {t:"c",d:5,q:"Инцидент. Сканер безопасности нашёл в истории репозитория пароль от боевой БД, закоммиченный месяц назад в .env, файл уже удалён следующим коммитом. Пароль уже сменили в самой базе (первый шаг сделан). Теперь удали файл .env из индекса на будущее (если он вдруг опять отслеживается) командой, которая не удаляет его с диска.",ans:["git rm --cached .env"],hint:"git rm --cached файл",why:"Это лишь гигиена на будущее — важно помнить, что сама чистка истории (filter-repo/BFG) требует согласования со всей командой и отдельного шага, а первым и обязательным всегда идёт ротация пароля."}]},

{id:"g8",t:"Релизы, теги и большие репозитории",goal:"Связать код с тем, что работает на проде",
 cards:[
 {h:"Semver и теги",b:"<pre>v2.4.1\n│ │ └── patch: исправление\n│ └──── minor: новая функция\n└────── major: ломающее изменение</pre><pre>git tag -a v2.4.1 -m \"релиз\"\ngit push origin v2.4.1</pre><p>Аннотированный тег (-a) хранит автора, дату и сообщение. Теги не уезжают обычным git push — нужно отправлять явно.</p><p><b>Зачем в жизни:</b> тег — воспроизводимая точка релиза, по которой пайплайн часто и запускает прод-деплой.</p>",
  cheat:"git tag -a vX.Y.Z -m сообщение — аннотированный тег · git push origin тег — отправить явно",
  t:{q:"Создай аннотированный тег v1.3.0 с сообщением о релизе.",ans:["git tag -a v1.3.0 -m релиз","git tag -a v1.3.0 -m \"релиз\""],hint:"git tag -a имя -m сообщение",why:"Аннотированный тег хранит автора и дату, в отличие от лёгкого тега."}},
 {h:"git describe — где я по отношению к тегам",b:"<pre>git describe --tags\nv2.4.1-3-g9f8e7d6</pre><p>Ближайший тег, число коммитов после него, короткий хеш текущего коммита.</p><p><b>Зачем в жизни:</b> быстрый способ понять, насколько текущий код разошёлся с последним релизом.</p>",
  cheat:"git describe --tags — ближайший тег + смещение от него",
  t:{q:"Узнай ближайший тег к текущему коммиту и сколько коммитов прошло после него.",ans:["git describe --tags"],hint:"git describe --tags",why:"Выводит формат тег-число_коммитов-хеш."}},
 {h:"Отправка тега на сервер",b:"<pre>git push origin v1.3.0            <span class='c'># один тег</span>\ngit push origin --tags            <span class='c'># все локальные теги</span></pre><p><b>Зачем в жизни:</b> обычный <code>git push</code> теги не отправляет — их нужно посылать отдельно, иначе тег останется только у тебя локально."}],
 ch:[
 {t:"c",d:1,q:"Разминка. Создай аннотированный тег v1.0.0 с сообщением «первый релиз».",ans:["git tag -a v1.0.0 -m \"первый релиз\"","git tag -a v1.0.0 -m первый релиз"],hint:"git tag -a имя -m сообщение",why:"Аннотированный тег хранит автора и дату."},
 {t:"c",d:2,q:"Отправь тег v1.0.0 на сервер.",ans:["git push origin v1.0.0"],hint:"git push origin имя_тега",why:"Обычный push теги не отправляет."},
 {t:"c",d:3,q:"Узнай ближайший тег к текущему коммиту.",ans:["git describe --tags"],hint:"git describe --tags",why:"Показывает тег, смещение и текущий короткий хеш."},
 {t:"c",d:4,q:"Ты накопил три локальных тега для трёх релизов и хочешь отправить их все на сервер одной командой.",ans:["git push origin --tags"],hint:"git push origin --tags",why:"--tags отправляет все локальные теги разом, а не по одному."},
 {t:"c",d:5,q:"Инцидент. На проде баг, нужно срочно откатиться на предыдущий релиз v2.4.0. Тег в репозитории есть. Создай ветку hotfix-rollback прямо от этого тега, чтобы разобраться, что изменилось после него.",ans:["git switch -c hotfix-rollback v2.4.0","git checkout -b hotfix-rollback v2.4.0"],hint:"git switch -c имя_ветки тег",why:"Ветка от тега даёт рабочую копию именно того состояния, что было в релизе — с неё удобно сравнивать и при необходимости катить откат."}]}
);

{id:"d1",t:"Что такое контейнер на самом деле",goal:"Отличать образ от контейнера и объяснить разницу с ВМ",
 cards:[
 {h:"Образ и контейнер — как класс и объект",b:"<p><b>Образ</b> — неизменяемый шаблон файловой системы плюс метаданные. Только для чтения. <b>Контейнер</b> — запущенный экземпляр образа с тонким записываемым слоем сверху.</p><p>Отсюда следствие: удалил контейнер — записываемый слой исчез. Всё, что должно пережить пересоздание, выносится в тома.</p><p><b>Зачем в жизни:</b> из одного образа поднимают пятьдесят контейнеров одновременно — это ровно то, что позволяет масштабировать сервис."},
 {h:"Контейнер — не виртуалка",b:"<table class='tw'><tr><th></th><th>ВМ</th><th>контейнер</th></tr><tr><td>ядро</td><td>своё</td><td>общее с хостом</td></tr><tr><td>старт</td><td>десятки секунд</td><td>миллисекунды</td></tr></table><p>Контейнер — обычный процесс на хосте, которому ядро ограничило видимость (<b>namespaces</b>) и ресурсы (<b>cgroups</b>).</p><div class='analogy'><b>Аналогия:</b> ВМ — отдельная квартира со своими коммуникациями. Контейнер — комната в коммуналке со звукоизоляцией и счётчиком на электричество.</div><p><b>Зачем в жизни:</b> именно эта формулировка (namespaces + cgroups) — то, что хотят услышать на собеседовании, а не «контейнер легче ВМ»."},
 {h:"docker run — запуск контейнера",b:"<pre>docker run -d -p 8080:80 --name web nginx</pre><p><b>Порядок в -p всегда ХОСТ:КОНТЕЙНЕР.</b> Перепутал — снаружи ничего не отвечает.</p><p><b>Зачем в жизни:</b> это первая команда, с которой начинается работа с любым образом — от локального теста до продакшена.</p>",
  cheat:"docker run -d -p хост:контейнер --name имя образ — запуск в фоне",
  t:{q:"Запусти nginx в фоне: порт 8080 хоста на 80 контейнера, имя контейнера web.",ans:["docker run -d -p 8080:80 --name web nginx","docker run -d --name web -p 8080:80 nginx"],hint:"-d, -p хост:контейнер, --name",why:"Порядок в -p всегда ХОСТ:КОНТЕЙНЕР — перепутанные числа дают «порт не отвечает»."}},
 {h:"docker ps / logs / exec — три команды диагностики",b:"<pre>docker ps -a           <span class='c'># все, включая остановленные</span>\ndocker logs -f web\ndocker exec -it web sh <span class='c'># зайти внутрь работающего</span></pre><p><code>exec</code> запускает новый процесс в существующем контейнере — безопаснее <code>attach</code>, который цепляется к главному процессу.</p><p><b>Зачем в жизни:</b> первые три команды при любой проблеме с контейнером — состояние, логи, заглянуть внутрь.</p>",
  cheat:"docker ps -a все контейнеры · docker logs -f логи вживую · docker exec -it имя sh зайти внутрь",
  t:{q:"Покажи все контейнеры, включая остановленные.",ans:["docker ps -a","docker ps --all"],hint:"ps + флаг all",why:"Без -a не видны упавшие контейнеры — а именно они обычно и есть причина проблемы."}},
 {h:"Жизнь контейнера равна жизни PID 1",b:"<p>Контейнер живёт ровно столько, сколько работает его главный процесс. Завершился — контейнер остановлен.</p><p>Самая частая ошибка новичка: запустить сервис демоном в фоне внутри контейнера. Команда отработала, процесс ушёл в фон, PID 1 завершился — контейнер мгновенно остановился.</p><p><b>Зачем в жизни:</b> «контейнер сразу останавливается, в логах ничего» почти всегда означает именно эту ошибку — процесс запущен не на переднем плане.</p>"}],
 ch:[
 {t:"c",d:1,q:"Разминка. Покажи все контейнеры, включая остановленные.",ans:["docker ps -a","docker ps --all"],hint:"ps + флаг all",why:"Без -a упавшие контейнеры не видны."},
 {t:"c",d:2,q:"Запусти redis в фоне с именем cache, без проброса портов.",ans:["docker run -d --name cache redis"],hint:"docker run -d --name имя образ",why:"Проброс портов не обязателен, если обращение идёт из другого контейнера в той же сети."},
 {t:"c",d:3,q:"Зайди внутрь работающего контейнера web интерактивной оболочкой sh.",ans:["docker exec -it web sh"],hint:"docker exec -it имя sh",why:"exec запускает новый процесс в существующем контейнере, не трогая главный."},
 {t:"c",d:4,q:"Контейнер api остановился сразу после запуска. Посмотри его логи, чтобы понять причину.",ans:["docker logs api"],hint:"docker logs имя",why:"Логи покажут, что успело написать приложение перед завершением главного процесса."},
 {t:"c",d:5,q:"Инцидент. Приложение в контейнере отвечает на curl изнутри хоста по localhost:3000, но снаружи по http://сервер:8080 — нет. Контейнер запущен командой docker run -d -p 3000:8080 app (порты перепутаны местами). Останови и удали его, затем запусти заново с правильным порядком портов (хост 8080, контейнер 3000), тем же именем app.",ans:["docker stop app && docker rm app && docker run -d -p 8080:3000 --name app app","docker rm -f app && docker run -d -p 8080:3000 --name app app"],hint:"сначала остановить/удалить, потом run -p 8080:3000",why:"Порядок в -p всегда ХОСТ:КОНТЕЙНЕР. Приложение слушает 3000 внутри, значит контейнерный порт — 3000, а хостовый (наружу) — 8080."}]},

{id:"d2",t:"Dockerfile и слои",goal:"Собрать образ, который быстро собирается и мало весит",
 cards:[
 {h:"Анатомия Dockerfile",b:"<pre>FROM node:20-alpine\nWORKDIR /app\nCOPY package*.json ./\nRUN npm ci --omit=dev\nCOPY . .\nEXPOSE 3000\nUSER node\nCMD [\"node\", \"server.js\"]</pre><p>FROM — базовый образ, RUN — выполняется во время сборки, CMD — при запуске контейнера.</p><p><b>Зачем в жизни:</b> любое собственное приложение в контейнере начинается с этого скелета — дальше только детали."},
 {h:"docker build — собрать образ",b:"<pre>docker build -t app:1.0 .</pre><p>Точка — это контекст сборки: весь каталог отправляется демону. Без <code>.dockerignore</code> туда уедут .git, node_modules, .env.</p><p><b>Зачем в жизни:</b> первая команда после написания Dockerfile — проверить, что он вообще собирается.</p>",
  cheat:"docker build -t имя:тег . — точка это контекст, весь каталог уходит демону",
  t:{q:"Собери образ с тегом app:1.0 из текущего каталога.",ans:["docker build -t app:1.0 ."],hint:"build -t имя:тег контекст",why:"Точка в конце — контекст сборки, а не путь к Dockerfile."}},
 {h:"Кэш слоёв — главный приём ускорения",b:"<pre>COPY package*.json ./\nRUN npm ci        <span class='c'># этот слой переиспользуется</span>\nCOPY . .          <span class='c'># меняется часто, но он последний</span></pre><p>Docker кэширует каждый слой. При пересборке использует кэш, пока не встретит изменившуюся инструкцию — дальше пересобирает всё до конца.</p><p><b>Зачем в жизни:</b> правильный порядок инструкций превращает трёхминутную сборку в десятисекундную при каждом изменении кода."},
 {h:"Multi-stage build",b:"<pre>FROM golang:1.22 AS build\nWORKDIR /src\nCOPY . .\nRUN go build -o /app/server\n\nFROM alpine:3.20\nCOPY --from=build /app/server /server\nUSER 1000\nCMD [\"/server\"]</pre><p>В финальный образ не попадают компилятор и исходники: 900 МБ превращаются в 15 МБ.</p><p><b>Зачем в жизни:</b> классический ответ на собеседовании про размер образов — multi-stage плюс минимальная база плюс непривилегированный пользователь.</p>",
  cheat:"FROM ... AS build ... FROM alpine COPY --from=build — multi-stage, в финале нет компилятора",
  t:{q:"У тебя есть stage с именем build, где собран бинарник /app/server. Скопируй его из stage build в текущий (финальный) образ в путь /server.",ans:["COPY --from=build /app/server /server"],hint:"COPY --from=stage_name откуда куда",why:"--from=build указывает копировать не из контекста сборки, а из результата другого stage."}},
 {h:"CMD в exec-форме",b:"<pre>CMD [\"node\", \"server.js\"]     <span class='c'># exec-форма, правильно</span>\nCMD node server.js            <span class='c'># shell-форма, ломает сигналы</span></pre><p>В exec-форме процесс становится PID 1 и получает сигналы напрямую. В shell-форме PID 1 — это /bin/sh, который не передаёт SIGTERM дальше.</p><p><b>Зачем в жизни:</b> без exec-формы каждый docker stop висит 10 секунд и убивает контейнер жёстко, обрывая запросы пользователей.</p>",
  cheat:'CMD ["node","server.js"] — exec-форма (массив), не CMD node server.js'}],
 ch:[
 {t:"c",d:1,q:"Разминка. Собери образ с тегом myapp:latest из текущего каталога.",ans:["docker build -t myapp:latest ."],hint:"docker build -t имя:тег .",why:"Базовая команда сборки."},
 {t:"c",d:2,q:"Собери образ app:2.0, используя Dockerfile с именем Dockerfile.prod (не по умолчанию).",ans:["docker build -f Dockerfile.prod -t app:2.0 ."],hint:"флаг -f указывает конкретный файл",why:"-f нужен, когда файл называется не просто Dockerfile."},
 {t:"c",d:3,q:"Посмотри, из каких слоёв собран образ app:1.0 и сколько весит каждый.",ans:["docker history app:1.0"],hint:"docker history имя:тег",why:"history показывает, какая именно инструкция раздула образ."},
 {t:"c",d:4,q:"Пересобери образ app:1.0 полностью заново, игнорируя весь кэш слоёв (для проверки, что сборка воспроизводима с нуля).",ans:["docker build --no-cache -t app:1.0 ."],hint:"флаг --no-cache",why:"Полезно перед релизом — убедиться, что сборка не зависит от случайного состояния кэша."},
 {t:"c",d:5,q:"Инцидент. Сборка образа в CI занимает 9 минут при каждом коммите, хотя зависимости не менялись. В Dockerfile: FROM node:20, затем сразу COPY . ., затем RUN npm install — то есть весь код копируется до установки зависимостей. Перепиши эти три строки так, чтобы кэш зависимостей не сбрасывался при изменении кода (используй node:20-alpine и раздельные COPY).",ans:["FROM node:20-alpine\nCOPY package*.json ./\nRUN npm install\nCOPY . .","FROM node:20-alpine\nCOPY package*.json ./\nRUN npm ci\nCOPY . ."],hint:"сначала COPY package*.json и install, потом COPY . .",why:"Кэш инвалидируется с первой изменившейся инструкции. Разделение зависимостей и кода — основной приём ускорения сборки в CI."}]},

{id:"d3",t:"Данные: тома и bind mount",goal:"Разделить эфемерное и постоянное",
 cards:[
 {h:"volume — управляемое хранилище",b:"<pre>docker run -v pgdata:/var/lib/postgresql/data postgres:16</pre><p>Том управляется docker, не зависит от структуры каталогов хоста, легко бэкапится.</p><p><b>Зачем в жизни:</b> без тома данные лежат в записываемом слое контейнера и исчезают при его удалении — для базы данных это фатально.</p>",
  cheat:"docker run -v имя_тома:путь_в_контейнере — постоянное хранилище данных",
  t:{q:"Запусти postgres:16 с именованным томом pgdata под данные (путь внутри /var/lib/postgresql/data).",ans:["docker run -v pgdata:/var/lib/postgresql/data postgres:16"],hint:"-v имя_тома:путь_внутри",why:"Путь внутри берётся из документации образа — у каждого он свой."}},
 {h:"bind mount — конкретная папка хоста",b:"<pre>docker run -v $(pwd)/conf:/etc/app:ro app</pre><p>Суффикс <code>:ro</code> монтирует только для чтения. Bind mount незаменим в разработке — правишь код на хосте, он сразу в контейнере.</p><p><b>Зачем в жизни:</b> для конфигов и секретов :ro — простая защита от того, что контейнер сам их испортит.</p>",
  cheat:"docker run -v $(pwd)/путь:/путь:ro — bind mount только для чтения",
  t:{q:"Смонтируй локальный каталог ./conf в контейнер по пути /etc/app, только для чтения.",ans:["docker run -v $(pwd)/conf:/etc/app:ro app","docker run -v ./conf:/etc/app:ro app"],hint:"-v локальный_путь:путь_в_контейнере:ro",why:":ro не даёт контейнеру изменить примонтированные файлы."}},
 {h:"docker volume — управление томами",b:"<pre>docker volume ls\ndocker volume inspect pgdata</pre><p><b>Зачем в жизни:</b> перед бэкапом или переносом данных на другой сервер сначала смотришь, какие тома вообще существуют и где физически лежат данные.</p>",
  cheat:"docker volume ls — список томов · inspect имя — где физически лежат данные"},
 {h:"Опасная буква: docker compose down -v",b:"<pre>docker compose down       <span class='c'># без томов, данные целы</span>\ndocker compose down -v    <span class='c'># УДАЛЯЕТ ТОМА</span></pre><p>Флаг -v здесь означает «volumes», не «подробно». Самая дорогая опечатка новичка.</p><p><b>Зачем в жизни:</b> команда «перезапустить стек начисто» с забытым -v уносит базу без предупреждения."}],
 ch:[
 {t:"c",d:1,q:"Разминка. Посмотри список всех томов Docker.",ans:["docker volume ls"],hint:"docker volume ls",why:"Первый шаг перед любой операцией с данными контейнеров."},
 {t:"c",d:2,q:"Запусти mysql:8 с именованным томом mysqldata под данные (путь /var/lib/mysql).",ans:["docker run -v mysqldata:/var/lib/mysql mysql:8"],hint:"-v имя:путь",why:"Тот же принцип, что и с postgres — путь берётся из документации образа."},
 {t:"c",d:3,q:"Смонтируй локальный каталог ./nginx-conf в контейнер по пути /etc/nginx/conf.d, только для чтения.",ans:["docker run -v $(pwd)/nginx-conf:/etc/nginx/conf.d:ro nginx","docker run -v ./nginx-conf:/etc/nginx/conf.d:ro nginx"],hint:"-v путь:путь:ro",why:"Конфиги монтируют только для чтения — контейнер не должен их менять."},
 {t:"c",d:4,q:"Ты хочешь остановить стек docker compose, сохранив все данные в томах (без их удаления).",ans:["docker compose down"],hint:"docker compose down (без -v)",why:"Без флага -v тома остаются нетронутыми."},
 {t:"c",d:5,q:"Инцидент. Разработчик выполнил docker compose down -v на боевом сервере «чтобы перезапустить начисто» — база пропала, тома удалены. Резервная копия есть в /backup/pgdata.tar.gz. Подними временный контейнер alpine с примонтированным новым томом pgdata и каталогом /backup, чтобы распаковать архив внутрь тома (путь внутри тома /data).",ans:["docker run --rm -v pgdata:/data -v /backup:/backup alpine tar xzf /backup/pgdata.tar.gz -C /data"],hint:"docker run --rm -v pgdata:/data -v /backup:/backup alpine tar xzf ... -C /data",why:"Приём «одноразовый контейнер с двумя томами» — тот же, что и для бэкапа, только в обратную сторону: --rm удаляет вспомогательный контейнер сразу после распаковки."}]},

{id:"d4",t:"Сети контейнеров и docker compose",goal:"Поднять стек из нескольких сервисов",
 cards:[
 {h:"Пользовательская сеть и DNS по именам",b:"<pre>docker network create backend\ndocker run --network backend --name db postgres:16</pre><p>В дефолтной bridge-сети DNS по именам контейнеров не работает — только в пользовательской. compose создаёт её автоматически.</p><p><b>Зачем в жизни:</b> «контейнер не находит другой контейнер по имени» почти всегда означает, что оба в дефолтной сети без создания своей.</p>",
  cheat:"docker network create имя — своя сеть с DNS по именам контейнеров",
  t:{q:"Создай пользовательскую сеть backend и запусти в ней postgres:16 с именем db.",ans:["docker network create backend && docker run --network backend --name db postgres:16"],hint:"docker network create имя && docker run --network имя --name имя образ",why:"Только в пользовательской сети работает DNS по именам контейнеров."}},
 {h:"docker compose up -d — весь стек одной командой",b:"<pre>docker compose up -d\ndocker compose ps\ndocker compose logs -f web</pre><p><b>Зачем в жизни:</b> вместо ручного docker network create и нескольких docker run — один YAML-файл и одна команда для всего стека.</p>",
  cheat:"docker compose up -d — поднять весь стек в фоне",
  t:{q:"Подними весь стек из docker-compose.yml в фоне.",ans:["docker compose up -d"],hint:"compose up -d",why:"Без -d логи повиснут в терминале, а Ctrl+C остановит стек."}},
 {h:"Обращение по имени сервиса, не контейнера",b:"<pre>services:\n  web:\n    environment:\n      DB_HOST: db   <span class='c'># имя сервиса, не контейнера</span>\n  db:\n    image: postgres:16</pre><p>Имя сервиса — стабильный сетевой псевдоним. Имя контейнера содержит префикс проекта и номер реплики и меняется.</p><p><b>Зачем в жизни:</b> ошибка «getaddrinfo ENOTFOUND» после обновления стека почти всегда означает, что в конфиге приложения захардкожено имя контейнера вместо имени сервиса.</p>",
  cheat:"внутри compose обращайся по имени СЕРВИСА (db), не по имени контейнера (project_db_1)"}],
 ch:[
 {t:"c",d:1,q:"Разминка. Подними весь стек из docker-compose.yml в фоне.",ans:["docker compose up -d"],hint:"compose up -d",why:"Базовая команда запуска всего стека."},
 {t:"c",d:2,q:"Посмотри логи сервиса web из compose-стека в реальном времени.",ans:["docker compose logs -f web"],hint:"docker compose logs -f имя_сервиса",why:"-f держит поток открытым, показывая новые строки."},
 {t:"c",d:3,q:"Создай пользовательскую сеть shop-net и запусти в ней redis с именем cache.",ans:["docker network create shop-net && docker run --network shop-net --name cache redis"],hint:"docker network create имя && docker run --network имя --name имя образ",why:"Своя сеть даёт DNS-резолвинг по имени контейнера."},
 {t:"c",d:4,q:"Зайди в работающий сервис web из compose-стека интерактивной оболочкой sh.",ans:["docker compose exec web sh"],hint:"docker compose exec имя_сервиса sh",why:"compose exec — аналог docker exec, но по имени сервиса, а не контейнера."},
 {t:"c",d:5,q:"Инцидент. После обновления стека приложение не видит базу: в логах «getaddrinfo ENOTFOUND db-1». В docker-compose.yml сервис называется db, но в переменной окружения приложения (DB_HOST в файле .env) прописано db-1 — имя контейнера прошлой версии. Исправь строку в .env, заменив db-1 на правильное имя сервиса db (напиши итоговую строку).",ans:["DB_HOST=db"],hint:"DB_HOST=db",why:"Обращаться нужно по имени сервиса из compose-файла — оно стабильно, в отличие от имени контейнера, которое зависит от префикса проекта и номера реплики."}]},

{id:"d5",t:"Продакшен-качество образа",goal:"Сделать образ, который не стыдно выкатить",
 cards:[
 {h:"HEALTHCHECK",b:"<pre>HEALTHCHECK --interval=30s --timeout=3s --start-period=20s \\\n  CMD curl -fsS http://localhost:3000/health || exit 1</pre><p>Running ≠ healthy. Оркестратор использует статус, чтобы не слать трафик в неготовый контейнер.</p><p><b>Зачем в жизни:</b> без healthcheck пользователи получают ошибки в первые секунды после каждого деплоя, пока приложение прогревается.</p>",
  cheat:"HEALTHCHECK CMD curl -fsS URL || exit 1 — running не значит healthy",
  t:{q:"Добавь в Dockerfile проверку здоровья: раз в 30 секунд обращаться к http://localhost:3000/health, при неуспехе — код 1.",ans:["HEALTHCHECK --interval=30s CMD curl -fsS http://localhost:3000/health || exit 1"],hint:"HEALTHCHECK --interval=30s CMD curl -fsS URL || exit 1",why:"|| exit 1 превращает неуспешный curl в явный отказ проверки здоровья."}},
 {h:"Непривилегированный пользователь",b:"<pre>RUN addgroup -g 1000 app && adduser -u 1000 -G app -D app\nUSER app</pre><p>Процесс от root внутри контейнера — путь к компрометации хоста при уязвимости.</p><p><b>Зачем в жизни:</b> USER не root — первая строка любого чек-листа безопасности Dockerfile, и первое, что проверяют на ревью.</p>",
  cheat:"USER имя (не root) — последняя строка перед CMD в защищённом Dockerfile",
  t:{q:"Добавь в Dockerfile инструкцию, запускающую все последующие команды и сам процесс от пользователя app (не root).",ans:["USER app"],hint:"USER имя_пользователя",why:"Всё, что идёт после USER, включая сам процесс контейнера, выполняется от этого пользователя."}},
 {h:"Сигналы и graceful shutdown",b:"<p>При docker stop контейнер получает SIGTERM и 10 секунд на завершение, потом SIGKILL. Приложение должно успеть закрыть соединения.</p><p><b>Зачем в жизни:</b> без корректной обработки сигналов каждый деплой обрывает активные запросы пользователей — а это заметно на реальном трафике.</p>",
  cheat:"docker stop → SIGTERM, 10 сек, потом SIGKILL — приложение должно успеть завершиться само"}],
 ch:[
 {t:"c",d:1,q:"Разминка. Добавь в Dockerfile инструкцию, переключающую пользователя на app.",ans:["USER app"],hint:"USER имя",why:"Базовая защита — не работать от root."},
 {t:"c",d:2,q:"Добавь в Dockerfile healthcheck: обращаться к http://localhost:8080/healthz каждые 15 секунд, при неуспехе завершаться с кодом 1.",ans:["HEALTHCHECK --interval=15s CMD curl -fsS http://localhost:8080/healthz || exit 1"],hint:"HEALTHCHECK --interval=15s CMD curl -fsS URL || exit 1",why:"Интервал и путь эндпоинта настраиваются под конкретное приложение."},
 {t:"c",d:3,q:"Собери образ app:2.0 для двух архитектур сразу: linux/amd64 и linux/arm64.",ans:["docker buildx build --platform linux/amd64,linux/arm64 -t app:2.0 ."],hint:"docker buildx build --platform amd64,arm64 -t тег .",why:"Multi-arch сборка нужна, если ноутбук на ARM, а сервер на x86 (или наоборот)."},
 {t:"c",d:4,q:"Проверь образ registry/app:1.0 на известные уязвимости сканером trivy.",ans:["trivy image registry/app:1.0"],hint:"trivy image имя:тег",why:"Сканирование перед выкаткой — часть чек-листа продакшен-готовности образа."},
 {t:"c",d:5,q:"Инцидент. Тебе прислали на ревью Dockerfile: FROM node:20, COPY . . первой строкой (нет .dockerignore), нет USER (работает от root), CMD node server.js (shell-форма). Перепиши три проблемные строки: смени базу на node:20-alpine, добавь USER node перед CMD, и исправь CMD на exec-форму.",ans:["FROM node:20-alpine\nUSER node\nCMD [\"node\", \"server.js\"]","FROM node:20-alpine\nUSER node\nCMD [\"node\",\"server.js\"]"],hint:"node:20-alpine, USER node, CMD в виде массива",why:"Три независимых улучшения: меньше база и уязвимостей, не root, корректная обработка сигналов при остановке."}]},

{id:"d6",t:"Отладка контейнеров",goal:"Понять, почему не работает, не переустанавливая всё",
 cards:[
 {h:"Порядок диагностики",b:"<ol><li>docker ps -a — состояние и код выхода</li><li>docker logs имя — что писало приложение</li><li>docker inspect имя — конфигурация целиком</li></ol><p><b>Зачем в жизни:</b> пересоздавать контейнер до чтения логов — потерять улики. Порядок диагностики экономит часы.</p>"},
 {h:"docker inspect — вся конфигурация в JSON",b:"<pre>docker inspect app\ndocker inspect app --format '{{.State.OOMKilled}}'</pre><p>Образ, переменные окружения, лимиты, монтирования — всё за одну команду.</p><p><b>Зачем в жизни:</b> «почему контейнер упал» часто отвечается одним полем из inspect — OOMKilled, ExitCode, Error.</p>",
  cheat:"docker inspect имя --format '{{.State.OOMKilled}}' — точечный вопрос к конфигурации",
  t:{q:"Проверь, был ли контейнер app убит из-за превышения лимита памяти (OOM), выведя только это поле.",ans:["docker inspect app --format '{{.State.OOMKilled}}'"],hint:"docker inspect имя --format '{{.State.OOMKilled}}'",why:"--format сужает вывод inspect до одного нужного поля вместо всего JSON."}},
 {h:"Коды выхода 137 и 127",b:"<table class='tw'><tr><th>код</th><th>причина</th></tr><tr><td>137</td><td>SIGKILL, почти всегда OOM</td></tr><tr><td>127</td><td>команда не найдена</td></tr></table><p><b>Зачем в жизни:</b> эти два числа — самая быстрая диагностика без единой дополнительной команды, сразу после docker ps -a.</p>",
  cheat:"код 137 = OOM (SIGKILL) · код 127 = команда не найдена"},
 {h:"Отладка сети без shell в образе",b:"<pre>docker run --rm -it --network container:web nicolaka/netshoot</pre><p>Отладочный контейнер в сетевом пространстве целевого — внутри доступны curl, dig, tcpdump.</p><p><b>Зачем в жизни:</b> distroless-образы не содержат shell намеренно — это плюс для безопасности, но требует внешнего отладочного контейнера вместо exec внутрь.</p>",
  cheat:"docker run --rm -it --network container:имя nicolaka/netshoot — отладка сети без shell в целевом образе"}],
 ch:[
 {t:"c",d:1,q:"Разминка. Посмотри логи контейнера api в реальном времени.",ans:["docker logs -f api"],hint:"docker logs -f имя",why:"Живой поток логов — первый шаг диагностики."},
 {t:"c",d:2,q:"Проверь полную конфигурацию контейнера api (весь JSON).",ans:["docker inspect api"],hint:"docker inspect имя",why:"Показывает образ, переменные, лимиты, монтирования и состояние целиком."},
 {t:"c",d:3,q:"Проверь, был ли контейнер db убит по превышению памяти, выведя только поле OOMKilled.",ans:["docker inspect db --format '{{.State.OOMKilled}}'"],hint:"docker inspect имя --format '{{.State.OOMKilled}}'",why:"Точечный запрос к нужному полю вместо всего JSON."},
 {t:"c",d:4,q:"Образ api собран на базе distroless без shell. Запусти отладочный контейнер netshoot в сетевом пространстве контейнера api, чтобы проверить сеть снаружи.",ans:["docker run --rm -it --network container:api nicolaka/netshoot"],hint:"docker run --rm -it --network container:имя nicolaka/netshoot",why:"Отладочный контейнер видит сеть ровно так же, как целевой, не требуя shell внутри самого образа."},
 {t:"c",d:5,q:"Инцидент. Контейнер web в бесконечном цикле перезапусков, docker logs web показывает «connect ECONNREFUSED db:5432». Проверь, в каком состоянии контейнер db и с каким кодом выхода он завершился (используй docker ps -a и посмотри на конкретный контейнер db через grep).",ans:["docker ps -a | grep db"],hint:"docker ps -a | grep db",why:"Отфильтрованный вывод сразу покажет статус и код выхода db — например Exited (137), что укажет на OOM как первопричину, а web всего лишь честно сообщает о недоступности зависимости."}]}
);
