{id:"g1",t:"Три зоны и первый коммит",goal:"Понять, где физически лежат твои изменения",
 cards:[
 {h:"Настройка, без которой коммиты «ничьи»",b:"<pre>git config --global user.name \"Имя Фамилия\"\ngit config --global user.email \"me@company.ru\"\ngit config --global init.defaultBranch main\ngit config --global pull.rebase true\ngit config --global core.autocrlf input   <span class='c'># на Windows</span></pre><p>Без <code>user.email</code> коммиты не привяжутся к твоему профилю на GitHub. <code>pull.rebase true</code> избавляет от мусорных коммитов «Merge branch main into main».</p>"},
 {h:"Три зоны — ключевая модель",b:"<pre>рабочий каталог  →  индекс (stage)  →  репозиторий\n      git add ─────────┘   git commit ────┘\n\n      ←──────── git restore ────────\n      ←──── git restore --staged ───</pre><p><b>Рабочий каталог</b> — файлы, которые ты видишь. <b>Индекс</b> — черновик следующего коммита. <b>Репозиторий</b> — сохранённая история.</p><p>Зачем индекс: он позволяет собрать коммит осознанно, а не «всё, что накопилось». Из десяти изменённых файлов ты кладёшь три, относящихся к одной задаче.</p>"},
 {h:"Команды и что они показывают",b:"<pre>git status              <span class='c'># где я и что изменено</span>\ngit diff                <span class='c'># изменения, которых НЕТ в индексе</span>\ngit diff --staged       <span class='c'># то, что уже в индексе</span>\ngit add file.txt\ngit add -p              <span class='c'># добавлять по кускам, осознанно</span>\ngit commit -m \"fix: таймаут прокси\"\ngit log --oneline --graph --all</pre><p><code>git status</code> в конце вывода сам подсказывает следующую команду — читай его, а не заучивай наизусть.</p>"},
 {h:"Что попадает в репозиторий, а что нет",b:"<pre># .gitignore\nnode_modules/\n.env\n*.log\ndist/\n.terraform/\n*.tfstate*</pre><p>В git не место: секретам, артефактам сборки, зависимостям, локальным настройкам IDE.</p><p><b>Важно:</b> <code>.gitignore</code> действует только на <b>неотслеживаемые</b> файлы. Если файл уже закоммичен, добавление в игнор ничего не изменит — нужен <code>git rm --cached файл</code>.</p><p><code>.gitkeep</code> — соглашение: пустой файл, чтобы git сохранил пустой каталог, который сам по себе он не отслеживает.</p>"},
 {h:"Хорошее сообщение коммита",b:"<pre>fix: увеличен таймаут проксирования до 60s\n\nПри выгрузке отчётов nginx рвал соединение\nна 30 секундах. Причина — синхронный экспорт.\n</pre><p>Формат <b>conventional commits</b>: <code>feat</code>, <code>fix</code>, <code>chore</code>, <code>docs</code>, <code>refactor</code>, <code>test</code>. Из них автоматически собирается changelog и вычисляется версия.</p><p>Первая строка — до 72 символов, в повелительном наклонении, отвечает на «что». Тело — на «почему». Через полгода именно «почему» будет единственным, что тебе понадобится.</p>"}],
 ch:[
 {t:"c",d:1,q:"Посмотри текущее состояние репозитория: что изменено и что в индексе.",ans:["git status","git status -s","git status --short"],hint:"главная команда git",why:"Читай его вывод целиком: в конце git сам подсказывает, какой командой продолжить."},
 {t:"o",d:2,q:"Расставь путь изменения от твоего редактора до сервера.",items:["Изменил файл в рабочем каталоге","git add — положил в индекс","git commit — зафиксировал в истории","git push — отправил в удалённый репозиторий"],why:"Три зоны плюс удалёнка. Понимание этой цепочки снимает большую часть страха перед git."},
 {t:"q",d:2,q:"Чем <code>git diff</code> отличается от <code>git diff --staged</code>?",a:["Ничем","Первый показывает изменения, которых ещё нет в индексе; второй — то, что уже добавлено и войдёт в коммит","Первый только для новых файлов","--staged показывает историю"],c:1,why:"Перед коммитом полезно смотреть именно --staged: это буквально предпросмотр того, что ты фиксируешь."},
 {t:"q",d:3,q:"Ты добавил <code>.env</code> в <code>.gitignore</code>, но git продолжает показывать его как изменённый. Почему?",a:["Ошибка в синтаксисе .gitignore","Файл уже отслеживается: игнор действует только на неотслеживаемые — нужен <code>git rm --cached .env</code>","Нужно перезапустить git","Игнор работает только после коммита"],c:1,why:"И отдельно: если .env уже попал в историю, секрет считается скомпрометированным — сначала ротация, потом чистка."},
 {t:"q",d:4,q:"Зачем нужен индекс, если можно коммитить всё сразу?",a:["Исторический пережиток","Он позволяет собрать коммит осознанно: из десяти изменённых файлов зафиксировать только относящиеся к одной задаче","Ускоряет коммит","Требуется для push"],c:1,why:"Отсюда и git add -p — добавление отдельными кусками. Атомарные коммиты потом окупаются при revert, cherry-pick и bisect."},
 {t:"q",d:5,q:"<b>Инцидент.</b> Ты неделю работал, делая коммиты «wip», «ещё правки», «точно всё». Теперь на проде баг, и надо понять, какое из изменений его внесло. Что мешает и какой вывод на будущее?",a:["Ничего не мешает, посмотрим диффы","История нечитаема: коммиты не атомарны, revert и bisect укажут на огромный кусок изменений — нужны маленькие осмысленные коммиты и conventional commits","Надо было чаще пушить","Проблема в отсутствии тестов"],c:1,why:"Дисциплина коммитов — не эстетика. Она напрямую определяет, сможешь ли ты за минуты найти и откатить причину инцидента."}]},

{id:"g2",t:"Ветки и слияние",goal:"Работать параллельно и соединять результаты",
 cards:[
 {h:"Ветка — это указатель",b:"<p>Ветка в git — не копия файлов, а <b>подвижный указатель на коммит</b>. Создание ветки — запись 40 байт, поэтому оно мгновенно и ничего не стоит.</p><pre>git switch -c feature/auth   <span class='c'># создать и перейти</span>\ngit switch main\ngit branch                   <span class='c'># список локальных</span>\ngit branch -d feature/auth   <span class='c'># удалить слитую</span>\ngit branch -D feature/auth   <span class='c'># удалить принудительно</span></pre><p><code>switch</code> и <code>restore</code> — новые понятные команды вместо перегруженного <code>checkout</code>, который делал и то, и другое.</p>"},
 {h:"HEAD и detached HEAD",b:"<p><b>HEAD</b> — указатель на то, где ты сейчас. Обычно он указывает на ветку, а ветка — на коммит.</p><p>Если сделать <code>git checkout a1b2c3d</code> (на конкретный коммит), HEAD начинает указывать прямо на коммит — это <b>detached HEAD</b>. Коммиты здесь не принадлежат ни одной ветке и потеряются при переключении.</p><p>Выход: <code>git switch -c новая-ветка</code>, чтобы сохранить работу, или <code>git switch main</code>, чтобы просто выйти.</p>"},
 {h:"Fast-forward и трёхстороннее слияние",b:"<p><b>Fast-forward:</b> если в main не было новых коммитов, git просто передвигает указатель вперёд. Merge-коммита не появляется, история линейная.</p><p><b>3-way merge:</b> если main ушёл вперёд, git берёт три точки — общего предка и две вершины — и создаёт merge-коммит с двумя родителями.</p><pre>git merge feature/auth            <span class='c'># ff, если возможно</span>\ngit merge --no-ff feature/auth    <span class='c'># всегда merge-коммит</span></pre><p><code>--no-ff</code> используют, чтобы в истории было видно факт существования ветки: удобно для откатов целой фичи одним коммитом.</p>"},
 {h:"Конфликты: что это на самом деле",b:"<p>Конфликт возникает, когда <b>одни и те же строки</b> изменены в обеих ветках. Git не угадывает и передаёт решение тебе.</p><pre>&lt;&lt;&lt;&lt;&lt;&lt;&lt; HEAD\nproxy_read_timeout 30s;\n=======\nproxy_read_timeout 60s;\n&gt;&gt;&gt;&gt;&gt;&gt;&gt; feature/timeouts</pre><p>Сверху — твоя текущая версия, снизу — приходящая. Нужно оставить осмысленный результат, удалить маркеры, затем <code>git add файл</code> и <code>git commit</code>.</p><pre>git merge --abort   <span class='c'># отменить слияние и вернуться как было</span></pre><p>Главная профилактика конфликтов — короткие ветки. Ветка, живущая неделю, конфликтует почти гарантированно.</p>"}],
 ch:[
 {t:"c",d:1,q:"Создай ветку feature/auth и сразу перейди в неё (современный синтаксис).",ans:["git switch -c feature/auth","git checkout -b feature/auth"],hint:"switch -c или checkout -b",why:"switch отвечает за ветки, restore — за файлы. Раньше обе задачи делал перегруженный checkout."},
 {t:"q",d:2,q:"Почему создание ветки в git мгновенно даже в огромном репозитории?",a:["Git сжимает файлы","Ветка — это указатель на коммит, а не копия файлов","Работает кэш","Ветка создаётся в фоне"],c:1,why:"Отсюда практика: ветки создают свободно, под каждую задачу, и так же свободно удаляют."},
 {t:"q",d:3,q:"Git выполнил слияние без merge-коммита и просто передвинул указатель. Как это называется и когда возможно?",a:["Rebase, всегда","Fast-forward — возможно, когда в целевой ветке не было новых коммитов","Squash, при одном коммите","Cherry-pick"],c:1,why:"Если нужен явный след о существовании ветки — merge --no-ff: тогда всю фичу можно откатить одним коммитом."},
 {t:"q",d:3,q:"Ты выполнил <code>git checkout a1b2c3d</code>, поработал и сделал два коммита. Git предупреждает про detached HEAD. Чем это грозит?",a:["Ничем, обычный режим","Коммиты не принадлежат ветке и потеряются при переключении — нужно <code>git switch -c имя</code>, чтобы сохранить их","Репозиторий повреждён","Нельзя будет сделать push"],c:1,why:"Если уже переключился и потерял их — спасает git reflog: он помнит, где HEAD был раньше."},
 {t:"q",d:4,q:"В файле после слияния появились маркеры <code>&lt;&lt;&lt;&lt;&lt;&lt;&lt;</code>, <code>=======</code>, <code>&gt;&gt;&gt;&gt;&gt;&gt;&gt;</code>. Что нужно сделать?",a:["Удалить файл и слить заново","Выбрать или собрать правильный результат, удалить маркеры, затем git add файл и git commit","Выполнить git push --force","Игнорировать, git разберётся"],c:1,why:"Важная деталь: маркеры — обычный текст. Если оставить их и закоммитить, сломанный конфиг уедет в прод — поэтому после разрешения конфликта конфиги проверяют (nginx -t и подобное)."},
 {t:"q",d:5,q:"<b>Инцидент.</b> Ветка фичи живёт три недели, в ней 60 коммитов. При слиянии в main — 20 конфликтов в файлах, которых ты не касался. Что произошло и как избежать этого впредь?",a:["Git сломался, нужно пересоздать репозиторий","Ветка сильно разошлась с main; лечится регулярным подтягиванием main в ветку и короткими ветками на 1–2 дня","Нужно было использовать merge --no-ff","Виноваты коллеги"],c:1,why:"Стоимость слияния растёт нелинейно со временем жизни ветки. Trunk-based разработка существует именно поэтому: короткие ветки почти не конфликтуют."}]},

{id:"g3",t:"Отмена изменений",goal:"Вернуть как было, не потеряв чужую работу",
 cards:[
 {h:"Три уровня отмены",b:"<div class='tw'><table><tr><th>что отменяем</th><th>команда</th></tr><tr><td>правки в файле, не добавленные в индекс</td><td><code>git restore файл</code></td></tr><tr><td>файл из индекса (оставив правки)</td><td><code>git restore --staged файл</code></td></tr><tr><td>коммит</td><td><code>git reset</code> или <code>git revert</code></td></tr></table></div><p>Раньше всё это делал <code>git checkout</code> — отсюда путаница и случайно уничтоженная работа.</p>"},
 {h:"reset: три режима",b:"<pre>git reset --soft HEAD~1   <span class='c'># убрать коммит, изменения остаются в индексе</span>\ngit reset --mixed HEAD~1  <span class='c'># убрать коммит и индекс, файлы целы (по умолчанию)</span>\ngit reset --hard HEAD~1   <span class='c'># убрать всё: коммит, индекс и правки в файлах</span></pre><p><code>--soft</code> — идеально, когда закоммитил рано или с плохим сообщением: поправил и закоммитил заново.</p><p><code>--hard</code> уничтожает незакоммиченную работу <b>без возможности вернуть её через reflog</b> — reflog помнит коммиты, но не то, что не было зафиксировано.</p>"},
 {h:"revert: отмена без переписывания истории",b:"<pre>git revert a1b2c3d        <span class='c'># новый коммит, отменяющий указанный</span>\ngit revert -m 1 merge_sha <span class='c'># отменить merge-коммит</span></pre><p><b>Ключевое правило:</b> в ветке, которую уже видели другие, отменяют только через <code>revert</code>. Он не меняет существующие коммиты, а добавляет новый — «антидот». История остаётся честной и одинаковой у всех.</p><p><code>reset --hard</code> + force push в общей ветке = переписанная история у всей команды и потерянные чужие коммиты.</p>"},
 {h:"stash: отложить, не коммитя",b:"<pre>git stash                 <span class='c'># спрятать незакоммиченные изменения</span>\ngit stash -u              <span class='c'># включая неотслеживаемые файлы</span>\ngit stash list\ngit stash pop             <span class='c'># вернуть и удалить из стека</span>\ngit stash apply           <span class='c'># вернуть, оставив в стеке</span></pre><p>Нужен, когда срочный хотфикс застал посреди незаконченной работы. Альтернатива для долгих задач — <code>git worktree</code>: отдельный рабочий каталог той же истории.</p>"},
 {h:"reflog: сеть безопасности",b:"<pre>git reflog\nb8c9d0e HEAD@{0}: reset: moving to HEAD~3\nf2a3b4c HEAD@{1}: commit: feat: уведомления\n\ngit reset --hard f2a3b4c   <span class='c'># вернуть как было</span></pre><p>Reflog хранит все положения HEAD примерно 90 дней, включая «удалённые» коммиты. Практически всё, что кажется потерянным в git, восстанавливается отсюда — паниковать почти никогда не нужно.</p>"}],
 ch:[
 {t:"c",d:1,q:"Отложи незакоммиченные изменения, чтобы срочно переключиться на другую ветку.",ans:["git stash","git stash push","git stash save"],hint:"пять букв",why:"git stash pop вернёт их обратно. Для неотслеживаемых файлов нужен флаг -u."},
 {t:"q",d:2,q:"Что делает <code>git reset --soft HEAD~1</code>?",a:["Удаляет изменения навсегда","Убирает последний коммит, оставляя изменения в индексе","Создаёт новый коммит-антидот","Отправляет изменения на сервер"],c:1,why:"Идеально, когда закоммитил рано или с плохим сообщением: поправил и зафиксировал заново."},
 {t:"q",d:3,q:"Плохой коммит уже в main, которым пользуется команда. Как откатить правильно?",a:["git reset --hard и force push","git revert — новый коммит, отменяющий изменения","Удалить и создать репозиторий заново","git stash"],c:1,why:"revert не переписывает историю: у всех остаётся одна и та же последовательность коммитов. Force push в main — способ снести чужую работу."},
 {t:"q",d:4,q:"Чем опасен именно <code>git reset --hard</code> по сравнению с остальными режимами?",a:["Он медленный","Уничтожает незакоммиченные изменения, а их reflog не восстановит — он помнит только коммиты","Требует прав администратора","Ломает удалённый репозиторий"],c:1,why:"Правило: перед hard-reset сделай git stash. Потеря коммита обратима, потеря незафиксированной работы — нет."},
 {t:"q",d:4,q:"Коллега случайно сделал <code>reset --hard</code> и «потерял» три коммита, которые не были запушены. Что предложить?",a:["Работа потеряна, писать заново","<code>git reflog</code> — найти хеш и <code>git reset --hard хеш</code>","Восстановить из бэкапа диска","Попросить у другого разработчика"],c:1,why:"Коммиты живут в объектной базе, пока их не собрал сборщик мусора (около 90 дней). Reflog — карта к ним."},
 {t:"q",d:5,q:"<b>Инцидент.</b> Разработчик сделал force push в main и снёс дневную работу двух коллег. Как вернуть и как сделать так, чтобы это не повторилось?",a:["Восстанавливать нечего, писать заново","Найти утраченные коммиты через reflog у того, у кого они есть локально, и вернуть их; на будущее — branch protection: запрет force push, обязательный PR и зелёный CI","Откатить весь репозиторий из бэкапа","Запретить коллегам пушить"],c:1,why:"Организационное решение важнее уговоров: правила должны быть в настройках репозитория, а не в головах. Защита веток — стандартная практика в любой команде."}]},

{id:"g4",t:"Удалённые репозитории",goal:"Синхронизироваться с командой без сюрпризов",
 cards:[
 {h:"origin, upstream и отслеживание",b:"<pre>git clone git@github.com:team/app.git\ngit remote -v\ngit remote add upstream git@github.com:orig/app.git\ngit branch -vv         <span class='c'># какая локальная ветка какую удалённую отслеживает</span></pre><p><b>origin</b> — имя по умолчанию для репозитория, откуда клонировал. <b>upstream</b> — соглашение для оригинала при работе через форк.</p><p><code>origin/main</code> — это <b>локальная копия</b> состояния сервера на момент последнего fetch, а не текущее состояние сервера.</p>"},
 {h:"fetch, pull, push",b:"<div class='tw'><table><tr><th>команда</th><th>что делает</th></tr><tr><td><code>git fetch</code></td><td>скачивает изменения, ничего не сливая — безопасно всегда</td></tr><tr><td><code>git pull</code></td><td>fetch + merge (или rebase при pull.rebase true)</td></tr><tr><td><code>git push</code></td><td>отправляет твои коммиты в удалённую ветку</td></tr></table></div><pre>git fetch origin\ngit log --oneline HEAD..origin/main   <span class='c'># что прилетело нового</span>\ngit pull</pre><p>Привычка «сначала fetch, посмотреть, потом pull» экономит нервы: ты видишь, что придёт, до того как оно смешается с твоей работой.</p>"},
 {h:"Почему push отклоняется",b:"<pre>! [rejected] main -&gt; main (non-fast-forward)</pre><p>Значит, в удалённой ветке есть коммиты, которых нет у тебя. Git защищает чужую работу.</p><p>Правильно: <code>git pull --rebase</code> (перенести свои коммиты поверх свежих), разрешить конфликты, затем push.</p><p><b>Неправильно:</b> <code>git push --force</code> — он затрёт чужие коммиты. Если форс действительно нужен (после rebase своей ветки), используй <code>--force-with-lease</code>: он откажется, если на сервере появилось что-то, чего ты не видел.</p>"},
 {h:"Ветки на сервере",b:"<pre>git push -u origin feature/auth   <span class='c'># отправить и связать с удалённой</span>\ngit push origin --delete feature/auth\ngit fetch --prune                 <span class='c'># убрать локальные ссылки на удалённые ветки</span></pre><p>Со временем накапливаются десятки <code>origin/старая-ветка</code>, которых давно нет на сервере. <code>--prune</code> наводит порядок; можно включить всегда: <code>git config --global fetch.prune true</code>.</p>"}],
 ch:[
 {t:"c",d:1,q:"Скачай изменения с сервера, не сливая их с текущей веткой.",ans:["git fetch","git fetch origin","git fetch --all"],hint:"пять букв",why:"fetch безопасен всегда: он только обновляет твоё представление о сервере. Слияние остаётся отдельным осознанным шагом."},
 {t:"q",d:2,q:"В чём разница между <code>git fetch</code> и <code>git pull</code>?",a:["Ничего, синонимы","fetch только скачивает; pull скачивает и сразу сливает (merge или rebase)","pull работает только с main","fetch удаляет локальные ветки"],c:1,why:"pull = fetch + merge/rebase. Привычка делать fetch и смотреть diff перед слиянием избавляет от неожиданных конфликтов."},
 {t:"q",d:3,q:"Push отклонён с сообщением non-fast-forward. Что произошло и что делать?",a:["Нет прав на репозиторий","В удалённой ветке есть коммиты, которых нет у тебя — нужно <code>git pull --rebase</code>, разрешить конфликты и запушить снова","Ветка защищена","Кончилось место на сервере"],c:1,why:"Это защита чужой работы. Force push здесь затёр бы коммиты коллег — именно так и теряются рабочие дни."},
 {t:"q",d:3,q:"Что означает <code>origin/main</code> в твоём репозитории?",a:["Текущее состояние сервера прямо сейчас","Локальная копия состояния удалённой ветки на момент последнего fetch","Основная локальная ветка","Резервная копия main"],c:1,why:"Поэтому «у меня origin/main отстаёт» лечится fetch, а не спором с коллегами: твоя копия просто устарела."},
 {t:"q",d:4,q:"Ты сделал rebase своей ветки и нужен force push. Какую форму выбрать?",a:["<code>git push --force</code>","<code>git push --force-with-lease</code>","<code>git push -u</code>","Форс не нужен никогда"],c:1,why:"--force-with-lease проверяет, что на сервере ничего не появилось после твоего последнего fetch. Обычный --force такой проверки не делает и молча затирает."},
 {t:"q",d:5,q:"<b>Инцидент.</b> После <code>git pull</code> в твоей ветке появились чужие незнакомые изменения, а рабочий каталог в конфликтах. Что сделать, чтобы вернуться в понятное состояние?",a:["Удалить репозиторий и клонировать заново","<code>git merge --abort</code> (или <code>rebase --abort</code>), затем fetch и просмотр <code>git log HEAD..origin/main</code>, чтобы понять, что именно прилетело","Закоммитить всё как есть","git push --force"],c:1,why:"abort возвращает состояние до слияния — git специально это умеет. Дальше действуешь осознанно: сначала смотришь входящие коммиты, потом решаешь, сливать или ребейзить."}]},

{id:"g5",t:"Переписывание истории",goal:"Привести ветку в вид, за который не стыдно в PR",
 cards:[
 {h:"amend — поправить последний коммит",b:"<pre>git add забытый_файл\ngit commit --amend --no-edit    <span class='c'># добавить в последний коммит</span>\ngit commit --amend -m \"новое сообщение\"</pre><p>Коммит не изменяется, а <b>заменяется новым</b> с другим хешем. Поэтому amend безопасен только до публикации ветки.</p>"},
 {h:"Интерактивный rebase",b:"<pre>git rebase -i HEAD~5</pre><pre>pick   a1b2c3d feat: корзина\nsquash b2c3d4e fix: опечатка\nfixup  c3d4e5f ещё правка\nreword d4e5f6a chore: депсы\ndrop   e5f6a7b debug: временный лог</pre><div class='tw'><table><tr><th>команда</th><th>действие</th></tr><tr><td><code>pick</code></td><td>оставить как есть</td></tr><tr><td><code>squash</code></td><td>склеить с предыдущим, объединив сообщения</td></tr><tr><td><code>fixup</code></td><td>склеить, отбросив сообщение — для «ещё один фикс»</td></tr><tr><td><code>reword</code></td><td>изменить сообщение</td></tr><tr><td><code>drop</code></td><td>выбросить коммит</td></tr></table></div><p>Типичный сценарий: двенадцать коммитов «wip» превращаются в два осмысленных перед ревью.</p>"},
 {h:"merge против rebase",b:"<div class='tw'><table><tr><th></th><th>merge</th><th>rebase</th></tr><tr><td>история</td><td>ветвистая, честная</td><td>линейная, читаемая</td></tr><tr><td>хеши коммитов</td><td>сохраняются</td><td>меняются</td></tr><tr><td>безопасность</td><td>всегда</td><td>только для неопубликованных веток</td></tr></table></div><p>Распространённая командная договорённость: внутри своей ветки — rebase на свежий main, в main — merge через PR (часто squash-merge, чтобы фича попадала одним коммитом).</p>"},
 {h:"cherry-pick",b:"<pre>git cherry-pick a1b2c3d\ngit cherry-pick a1b2c3d..f6e5d4c   <span class='c'># диапазон</span></pre><p>Берёт изменения одного коммита и накладывает на текущую ветку новым коммитом. Типовой случай: починили в main, нужно то же самое в release-ветке.</p><p>Осторожно: частый cherry-pick одних и тех же изменений между ветками приводит к дублям и конфликтам при последующем слиянии.</p>"},
 {h:"Красная линия",b:"<p><b>Переписывать можно только то, что ещё не ушло к другим.</b> Своя ветка до PR — сколько угодно. Общая ветка — никогда.</p><p>После rebase опубликованной ветки push потребует форса — используй <code>--force-with-lease</code>. И предупреди тех, кто уже взял эту ветку: им придётся делать <code>git reset --hard origin/ветка</code>.</p>"}],
 ch:[
 {t:"q",d:1,q:"Забыл добавить файл в последний коммит, ветка ещё не запушена. Быстрое решение?",a:["Новый коммит «fix»","<code>git add файл</code> и <code>git commit --amend --no-edit</code>","git revert","git reset --hard"],c:1,why:"--no-edit сохраняет прежнее сообщение. История остаётся чистой, без коммитов-заплаток."},
 {t:"q",d:2,q:"Что делает <code>squash</code> в интерактивном rebase?",a:["Удаляет коммит","Склеивает коммит с предыдущим в один","Меняет автора","Создаёт ветку"],c:1,why:"fixup делает то же, но выбрасывает сообщение склеиваемого коммита — удобно для серии мелких правок."},
 {t:"c",d:2,q:"Перенеси коммит a1b2c3d из другой ветки в текущую.",ans:["git cherry-pick a1b2c3d"],hint:"cherry-pick",why:"Типично для хотфиксов: починил в main, перенёс в release-ветку одним коммитом."},
 {t:"q",d:3,q:"Когда rebase опасен?",a:["Всегда","На ветке, которая уже опубликована и которой пользуются другие","Только на main","Никогда"],c:1,why:"Rebase меняет хеши: для остальных это выглядит как подменённая история, и их локальные ветки расходятся с сервером."},
 {t:"q",d:4,q:"Почему <code>--force-with-lease</code> безопаснее обычного <code>--force</code>?",a:["Он быстрее","Откажется затирать изменения, появившиеся на сервере после твоего последнего fetch","Не требует прав","Разницы нет"],c:1,why:"Единственная форма форса, допустимая в общем репозитории: она защищает от гонки, когда коллега успел запушить в ту же ветку."},
 {t:"q",d:5,q:"<b>Инцидент.</b> Ты сделал rebase ветки, которую коллега уже взял себе, и запушил с форсом. У коллеги при следующем pull — десятки конфликтов и дублирующиеся коммиты. Как выйти из ситуации?",a:["Пусть разбирается сам","Сказать ему сделать <code>git fetch</code> и <code>git reset --hard origin/ветка</code> (предварительно сохранив свои новые коммиты через stash или отдельную ветку); на будущее — не ребейзить опубликованные ветки без договорённости","Откатить rebase через revert","Создать новую ветку и забыть старую"],c:1,why:"Техническое решение простое, но цена — потерянное время коллеги. Поэтому правило про красную линию важнее, чем знание команд."}]},

{id:"g6",t:"Расследование: reflog, bisect, blame",goal:"Найти виновный коммит и вернуть потерянное",
 cards:[
 {h:"bisect — бинарный поиск по истории",b:"<pre>git bisect start\ngit bisect bad             <span class='c'># сейчас сломано</span>\ngit bisect good v1.4.0     <span class='c'># здесь работало</span>\n<span class='c'># git переключается на середину, ты проверяешь и говоришь:</span>\ngit bisect good  |  git bisect bad\n<span class='c'># ...повторяешь, пока не найдётся первый плохой коммит</span>\ngit bisect reset           <span class='c'># выйти из режима</span></pre><p>Из 1000 коммитов виновный находится за <b>10</b> проверок: log₂(1000) ≈ 10. Это единственный способ расследовать «когда-то сломалось» за разумное время.</p>"},
 {h:"Автоматический bisect",b:"<pre>git bisect start HEAD v1.4.0\ngit bisect run ./test.sh</pre><p>Если есть скрипт, возвращающий 0 при успехе и не 0 при провале, git пройдёт весь поиск сам и назовёт коммит.</p><p><b>Что делает bisect возможным:</b> маленькие атомарные коммиты, каждый из которых собирается. В истории из огромных коммитов «всё сразу» поиск укажет на изменение в 3000 строк — и не поможет.</p>"},
 {h:"Поиск по содержимому",b:"<pre>git log -S \"cache.get\"        <span class='c'># коммиты, где менялось число вхождений строки</span>\ngit log -p путь/к/файлу       <span class='c'># история файла с диффами</span>\ngit log --author=\"Иван\" --since=\"2 weeks ago\"\ngit blame -L 40,60 src/app.js <span class='c'># кто и когда менял строки</span></pre><p><code>git log -S</code> («кирка») недооценён: находит момент появления или исчезновения конкретной строки, даже если файл переименовывали.</p><p><code>blame</code> — инструмент понимания контекста («почему так сделано»), а не поиска виноватых. В зрелой команде это именно так и используют.</p>"},
 {h:"reflog — восстановление потерянного",b:"<pre>git reflog\nb8c9d0e HEAD@{0}: reset: moving to HEAD~3\nf2a3b4c HEAD@{1}: commit: feat: уведомления\n\ngit switch -c спасение f2a3b4c</pre><p>Хранит все перемещения HEAD около 90 дней. Работает после reset, неудачного rebase, потерянного detached HEAD и удалённой ветки.</p><p>Единственное, чего reflog не вернёт, — изменения, которые никогда не были закоммичены.</p>"}],
 ch:[
 {t:"c",d:1,q:"Посмотри, где HEAD находился раньше, чтобы восстановить потерянные коммиты.",ans:["git reflog","git reflog show"],hint:"одно слово",why:"Reflog локален и не уезжает на сервер, но именно он спасает в девяти случаях из десяти."},
 {t:"q",d:2,q:"Баг появился где-то между релизами v1.4 и v1.9 — это 400 коммитов. Какой инструмент?",a:["Читать все диффы подряд","git bisect — бинарный поиск примерно за 9 проверок","git blame по всем файлам","Спросить у команды"],c:1,why:"log₂(400) ≈ 9. При наличии скрипта проверки git bisect run пройдёт всё сам."},
 {t:"q",d:3,q:"Что делает <code>git log -S \"cache.get\"</code>?",a:["Ищет по сообщениям коммитов","Находит коммиты, где изменилось число вхождений этой строки в код","Сортирует историю","Ищет по авторам"],c:1,why:"Поиск по содержимому изменений, а не по тексту коммита. Так находят момент появления злополучной строки."},
 {t:"q",d:3,q:"Зачем нужен <code>git bisect reset</code> в конце?",a:["Удаляет ветку","Возвращает рабочую копию на исходный коммит и завершает сессию поиска","Отменяет найденный коммит","Чистит reflog"],c:1,why:"Иначе останешься в detached HEAD посреди истории и будешь долго удивляться, почему код выглядит странно."},
 {t:"q",d:4,q:"Bisect указал на коммит, который меняет 3000 строк в двадцати файлах. Поиск не помог. В чём корень проблемы?",a:["Bisect работает неправильно","История состоит из огромных неатомарных коммитов — маленькие коммиты и есть условие, при котором bisect полезен","Нужно было использовать blame","Слишком старый релиз"],c:1,why:"Ещё один практический аргумент за короткие PR и атомарные коммиты: они окупаются именно в момент расследования инцидента."},
 {t:"q",d:5,q:"<b>Инцидент.</b> Корзина считает неверно, две недели назад всё работало, за это время 300 коммитов. Есть скрипт <code>./test.sh</code>, который проверяет расчёт и возвращает код 0 или 1. Оптимальный план?",a:["Читать все коммиты подряд","<code>git bisect start HEAD v_две_недели_назад</code> и <code>git bisect run ./test.sh</code>, затем <code>git show</code> найденного коммита и <code>git revert</code>","git blame файла корзины","Откатить всё на две недели назад"],c:1,why:"Автоматический bisect найдёт коммит за минуты. Откат всего на две недели убрал бы вместе с багом и весь полезный код — это не решение."}]},

{id:"g7",t:"Работа в команде: PR и процесс",goal:"Жить в общем репозитории по правилам",
 cards:[
 {h:"Стратегии ветвления",b:"<div class='tw'><table><tr><th></th><th>GitFlow</th><th>Trunk-based</th></tr><tr><td>ветки</td><td>main, develop, release/*, hotfix/*</td><td>main + короткие ветки</td></tr><tr><td>срок жизни ветки</td><td>недели</td><td>1–2 дня</td></tr><tr><td>подходит</td><td>релизы по расписанию, коробочные продукты</td><td>частые деплои, CI/CD</td></tr><tr><td>цена</td><td>сложные слияния</td><td>нужны feature flags и хорошие тесты</td></tr></table></div><p>На собеседовании называй обе и объясняй выбор: для частых деплоев — trunk-based, потому что короткие ветки почти не конфликтуют.</p>"},
 {h:"Хороший pull request",b:"<ul><li><b>Маленький.</b> До ~400 строк изменений: после этого порога находимость дефектов резко падает.</li><li><b>Одно логическое изменение.</b> Рефакторинг и новая функция — разными PR.</li><li><b>Описание «что и зачем»</b>, а не пересказ диффа.</li><li><b>Зелёный CI</b> до запроса ревью.</li><li>Скриншот, лог или пример вывода, если менялось поведение.</li></ul>"},
 {h:"Хорошее ревью",b:"<p>Ревьюер отвечает на вопрос «стало ли лучше», а не «сделал бы я так же».</p><ul><li>Разделяй <b>блокирующие</b> замечания (баг, безопасность, ломающее изменение) и <b>необязательные</b> предложения — помечай их явно.</li><li>Спрашивай, а не приказывай: «что будет, если сюда придёт пустой список?» полезнее, чем «перепиши».</li><li>Хвалить удачные решения — часть работы, а не вежливость.</li></ul><p>Стилистические споры решаются линтером и форматтером в CI, а не в комментариях.</p>"},
 {h:"Защита веток",b:"<p>Правила должны быть в настройках репозитория, а не в договорённостях:</p><ul><li>запрет прямого push в main</li><li>запрет force push и удаления ветки</li><li>обязательный PR с как минимум одним апрувом</li><li>обязательные зелёные проверки CI</li><li>требование актуальности ветки относительно main</li></ul><p>Это единственная надёжная защита от «случайно снёс чужую работу».</p>"},
 {h:"Хуки и автоматика",b:"<pre>.git/hooks/pre-commit   <span class='c'># локально, не версионируется</span>\n\n# pre-commit framework, конфиг в репозитории\nrepos:\n  - repo: https://github.com/gitleaks/gitleaks\n    hooks: [{id: gitleaks}]</pre><p>Хуки ловят проблему до коммита: секреты, форматирование, линтер. Но локальный хук можно обойти (<code>--no-verify</code>) и он есть не у всех — <b>те же проверки обязаны быть в CI</b>. Хук — удобство, CI — гарантия.</p>"}],
 ch:[
 {t:"q",d:1,q:"Команда деплоит по пять раз в день. Какая стратегия ветвления уместнее?",a:["GitFlow с develop и release-ветками","Trunk-based: короткие ветки и PR в main","Одна ветка на разработчика навсегда","Работать без веток"],c:1,why:"Частые деплои требуют коротких веток: чем дольше живёт ветка, тем дороже слияние."},
 {t:"q",d:2,q:"Почему PR на 2000 строк — плохо?",a:["Долго грузится страница","Ревьюер физически не может вникнуть: качество проверки падает, а риск растёт","GitHub не выдержит","Нельзя откатить"],c:1,why:"После ~400 строк находимость дефектов резко снижается. Большой PR формально одобряют, фактически не читая."},
 {t:"q",d:3,q:"Коллега прислал работающий код с тестами, но тебе не нравится стиль именования. Что делать на ревью?",a:["Заблокировать PR до исправления","Оставить необязательный комментарий, пометив как необязательный, и одобрить","Переписать самому и запушить в его ветку","Промолчать и одобрить"],c:1,why:"Блокирующими делают баги, безопасность и ломающие изменения. Стиль — задача линтера и форматтера в CI, а не предмет спора между людьми."},
 {t:"q",d:3,q:"Локальный pre-commit хук ловит секреты. Достаточно ли этого?",a:["Да, полностью","Нет: хук обходится флагом --no-verify и настроен не у всех — та же проверка нужна в CI","Да, если у всех настроен","Хуки вообще не нужны"],c:1,why:"Хук даёт быструю обратную связь разработчику, CI — обязательный барьер. Нужны оба уровня."},
 {t:"q",d:4,q:"Что технически предотвратит случайный force push в main?",a:["Договорённость команды","Branch protection в настройках репозитория: запрет force push и прямого push, обязательный PR и зелёный CI","Обучение новичков","Регулярные бэкапы"],c:1,why:"Правила, которые живут только в головах, нарушаются в первый же аврал. Настройки репозитория работают всегда."},
 {t:"q",d:5,q:"<b>Инцидент.</b> Сканер безопасности нашёл в истории репозитория рабочий пароль от боевой БД, закоммиченный месяц назад в <code>.env</code>. Файл уже удалён новым коммитом. Порядок действий?",a:["Ничего, файл же удалён","1) Немедленно ротировать пароль — секрет в истории считается скомпрометированным; 2) чистить историю (filter-repo/BFG) по согласованию с командой; 3) включить сканер секретов в CI и pre-commit","Сделать репозиторий приватным","Удалить репозиторий и создать новый"],c:1,why:"Удаление файла не удаляет его из истории: он доступен в любом клоне и форке. Поэтому первый шаг — всегда смена секрета, а не уборка."}]},

{id:"g8",t:"Релизы, теги и большие репозитории",goal:"Связать код с тем, что работает на проде",
 cards:[
 {h:"Semver и теги",b:"<pre>v2.4.1\n│ │ └── patch: исправление, обратно совместимо\n│ └──── minor: новая функция, совместимо\n└────── major: ломающее изменение</pre><pre>git tag -a v2.4.1 -m \"релиз корзины\"\ngit push origin v2.4.1\ngit tag -l \"v2.*\"\ngit describe --tags        <span class='c'># ближайший тег + смещение</span></pre><p>Аннотированный тег (<code>-a</code>) хранит автора, дату и сообщение. Теги не уезжают обычным <code>git push</code> — их нужно отправлять явно.</p>"},
 {h:"Тег как триггер деплоя",b:"<p>Типовая схема: push в main деплоит на staging, а тег <code>v*</code> запускает прод-деплой. Это даёт воспроизводимую точку релиза: по тегу всегда можно собрать ровно то, что уехало.</p><p>Образ при этом тегируется хешем коммита: <code>registry/app:1a2b3c4</code>. По работающему контейнеру ты за секунду находишь точный код — основа расследования инцидентов. <code>latest</code> такой связи не даёт.</p>"},
 {h:"Changelog автоматически",b:"<p>Из conventional commits инструменты собирают changelog и вычисляют версию:</p><ul><li><code>fix:</code> → patch</li><li><code>feat:</code> → minor</li><li><code>BREAKING CHANGE:</code> в теле → major</li></ul><p>Дисциплина сообщений перестаёт быть вкусовщиной: она напрямую превращается в версии и историю изменений для пользователей.</p>"},
 {h:"Подмодули, LFS, worktree",b:"<ul><li><b>Submodule</b> — вложенный репозиторий, зафиксированный на конкретном коммите. Клонировать нужно с <code>--recurse-submodules</code>, обновлять вручную. Сегодня чаще выбирают монорепо или пакеты.</li><li><b>Git LFS</b> — большие бинарники (макеты, видео, датасеты) хранятся отдельно, в репозитории лежат указатели. Без LFS репозиторий распухает <b>навсегда</b>: удаление файла новым коммитом не уменьшает историю.</li><li><b>Worktree</b> — несколько рабочих каталогов одной истории: <code>git worktree add ../hotfix main</code>. Срочный фикс без stash и переключения веток.</li></ul>"}],
 ch:[
 {t:"c",d:1,q:"Создай аннотированный тег v1.2.0 с сообщением.",ans:["git tag -a v1.2.0 -m релиз","git tag -a v1.2.0 -m \"релиз\"","git tag -a v1.2.0"],hint:"git tag -a имя -m сообщение",why:"Дальше нужен git push origin v1.2.0 — обычный push теги не отправляет."},
 {t:"q",d:2,q:"Вы изменили формат ответа API, старые клиенты сломаются. Какую часть версии поднимаем?",a:["patch","minor","major","никакую"],c:2,why:"Ломающее изменение — всегда major. Semver — это контракт с потребителями твоего API."},
 {t:"q",d:3,q:"Как быстро понять, какой именно код работает в контейнере на проде?",a:["Спросить разработчика","По тегу образа, равному хешу коммита","Открыть логи","Посмотреть дату сборки"],c:1,why:"Неизменяемые теги — основа воспроизводимости и откатов. Ещё лучше — отдавать версию и git-sha в /health эндпоинте."},
 {t:"q",d:3,q:"В репозиторий закоммитили 500 МБ видео и удалили следующим коммитом. Репозиторий всё ещё клонируется по 500 МБ. Почему?",a:["Кэш GitHub","Объект остался в истории: удаление новым коммитом не уменьшает репозиторий — нужны Git LFS и чистка истории","Не сделали git gc","Проблема с сетью"],c:1,why:"История иммутабельна by design. Поэтому крупные бинарники сразу заводят через LFS, а не «разберёмся потом»."},
 {t:"q",d:4,q:"Нужен срочный хотфикс, но в рабочем каталоге куча незаконченных правок. Самое аккуратное решение?",a:["Закоммитить всё как есть","<code>git worktree add ../hotfix main</code> — отдельный рабочий каталог той же истории","Удалить изменения","Работать прямо тут, переключив ветку"],c:1,why:"Альтернатива — git stash, она проще для коротких переключений. Worktree выигрывает, когда придётся ходить туда-обратно несколько раз."},
 {t:"q",d:5,q:"<b>Инцидент.</b> На проде баг, нужно срочно откатиться. В registry образы помечены только <code>latest</code>, в git нет тегов релизов. Что делать сейчас и что изменить в процессе?",a:["Собрать образ из main и выкатить","Сейчас: найти предыдущий образ по digest в registry и выкатить его; потом: тегировать образы хешем коммита, ставить git-теги на релизы и отдавать версию в /health","Откатить базу данных","Перезапустить поды"],c:1,why:"Без неизменяемых тегов откат превращается в археологию по digest и датам. Один раз настроенная схема тегирования экономит часы именно в такой момент."}]}
);

{id:"d1",t:"Что такое контейнер на самом деле",goal:"Отличать образ от контейнера и объяснить разницу с ВМ",
 cards:[
 {h:"Образ и контейнер — как класс и объект",b:"<p><b>Образ</b> — неизменяемый шаблон файловой системы плюс метаданные (какую команду запускать, от какого пользователя, какие порты). Только для чтения.</p><p><b>Контейнер</b> — запущенный экземпляр образа с тонким <b>записываемым слоем</b> сверху. Из одного образа поднимаются пятьдесят контейнеров, и каждый пишет в свой слой.</p><p>Отсюда следствие: удалил контейнер — записываемый слой исчез. Всё, что должно пережить пересоздание, выносится в тома.</p>"},
 {h:"Контейнер — не виртуалка",b:"<div class='tw'><table><tr><th></th><th>виртуальная машина</th><th>контейнер</th></tr><tr><td>ядро</td><td>своё</td><td>общее с хостом</td></tr><tr><td>размер</td><td>гигабайты</td><td>мегабайты</td></tr><tr><td>старт</td><td>десятки секунд</td><td>миллисекунды</td></tr><tr><td>изоляция</td><td>аппаратная, сильная</td><td>средствами ядра</td></tr></table></div><p>Контейнер — это <b>обычный процесс на хосте</b>, которому ядро ограничило видимость и ресурсы:</p><ul><li><b>namespaces</b> — что процесс видит: свои PID, сеть, точки монтирования, имя хоста</li><li><b>cgroups</b> — сколько ему можно: CPU, память, ввод-вывод</li></ul><p>Именно эту формулировку хотят услышать на собеседовании.</p><div class='analogy'><b>Аналогия:</b> ВМ — отдельная квартира со своими коммуникациями. Контейнер — комната в коммуналке со звукоизоляцией и счётчиком на электричество.</div>"},
 {h:"Слои и почему они экономят",b:"<p>Образ состоит из слоёв, каждый — результат одной инструкции Dockerfile. Слои <b>переиспользуются между образами</b>: если десять образов основаны на <code>node:20-alpine</code>, базовый слой на диске один.</p><pre>docker images        <span class='c'># локальные образы</span>\ndocker history app:1.0   <span class='c'># из каких слоёв собран и их размер</span></pre><p><code>docker history</code> — способ увидеть, какая инструкция раздула образ.</p>"},
 {h:"Команды первого дня",b:"<pre>docker run -d -p 8080:80 --name web nginx\ndocker ps              <span class='c'># запущенные</span>\ndocker ps -a           <span class='c'># включая остановленные</span>\ndocker logs -f web\ndocker exec -it web sh <span class='c'># зайти внутрь работающего</span>\ndocker stop web &amp;&amp; docker rm web\ndocker inspect web     <span class='c'># вся конфигурация в JSON</span></pre><p><b>Порядок в <code>-p</code> всегда ХОСТ:КОНТЕЙНЕР.</b> Перепутал — снаружи ничего не отвечает.</p><p><code>exec</code> запускает новый процесс в существующем контейнере. <code>attach</code> цепляется к главному процессу, и Ctrl+C может его убить — поэтому в отладке используют exec.</p>"},
 {h:"Жизнь контейнера равна жизни PID 1",b:"<p>Контейнер живёт ровно столько, сколько работает его <b>главный процесс</b>. Завершился — контейнер остановлен, каким бы важным он ни был.</p><p>Отсюда самая частая ошибка новичка: запустить сервис в фоне (демоном) внутри контейнера. Команда отработала, процесс ушёл в фон, PID 1 завершился — контейнер мгновенно остановился.</p><p>Правило: в контейнере процесс запускают <b>на переднем плане</b>: <code>nginx -g 'daemon off;'</code>, <code>node server.js</code>.</p>"}],
 ch:[
 {t:"c",d:1,q:"Покажи все контейнеры, включая остановленные.",ans:["docker ps -a","docker ps --all","docker container ls -a"],hint:"ps + флаг all",why:"Без -a ты не увидишь упавшие контейнеры — а именно они обычно и есть причина проблемы."},
 {t:"c",d:2,q:"Запусти nginx в фоне: порт 8080 хоста на 80 контейнера, имя контейнера web.",ans:["docker run -d -p 8080:80 --name web nginx","docker run -d --name web -p 8080:80 nginx","docker run --name web -d -p 8080:80 nginx"],hint:"-d, -p хост:контейнер, --name",why:"Порядок в -p всегда ХОСТ:КОНТЕЙНЕР. Перепутанные числа — самая частая причина «порт не отвечает»."},
 {t:"q",d:3,q:"Чем контейнер принципиально отличается от виртуальной машины?",a:["Ничем, это синонимы","Контейнер использует ядро хоста; изоляция достигается namespaces (что видно) и cgroups (сколько ресурсов)","Контейнер работает медленнее","Контейнеру нужен свой BIOS"],c:1,why:"Формулировка через namespaces и cgroups — то, что отличает понимание от заучивания. Из неё же следует, что контейнер не заменяет ВМ там, где нужна сильная изоляция."},
 {t:"q",d:3,q:"Контейнер остановился сразу после запуска, в логах ничего. Самая частая причина?",a:["Не хватило памяти","Главный процесс завершился: например, сервис запущен демоном в фоне вместо переднего плана","Не открыт порт","Нет сети"],c:1,why:"Контейнер живёт, пока жив PID 1. Проверять надо docker logs и команду запуска в образе."},
 {t:"q",d:4,q:"Почему при удалении контейнера с базой данных пропали все данные?",a:["Docker их сжал","Данные лежали в записываемом слое контейнера, который удаляется вместе с ним — нужен volume","База была повреждена","Не хватило места"],c:1,why:"Контейнер эфемерен by design. Всё состояние выносится в тома или во внешние сервисы — это фундаментальное свойство, а не недостаток."},
 {t:"q",d:5,q:"<b>Инцидент.</b> Приложение в контейнере отвечает на <code>curl</code> изнутри хоста по <code>localhost:3000</code>, но снаружи по <code>http://сервер:8080</code> — нет. Контейнер запущен как <code>docker run -d -p 3000:8080 app</code>. Что не так?",a:["Нужно открыть порт в фаерволе","Порты перепутаны местами: наружу опубликован 3000, а приложение внутри слушает 3000 — должно быть <code>-p 8080:3000</code>","Контейнер не запущен","Приложение слушает localhost внутри контейнера"],c:1,why:"Порядок ХОСТ:КОНТЕЙНЕР. И вторая частая причина этой же симптоматики — приложение внутри слушает 127.0.0.1 вместо 0.0.0.0, тогда проброс не поможет: снаружи контейнера до него не достучаться."}]},

{id:"d2",t:"Dockerfile и слои",goal:"Собрать образ, который быстро собирается и мало весит",
 cards:[
 {h:"Анатомия",b:"<pre>FROM node:20-alpine\nWORKDIR /app\nCOPY package*.json ./\nRUN npm ci --omit=dev\nCOPY . .\nEXPOSE 3000\nUSER node\nCMD [\"node\", \"server.js\"]</pre><div class='tw'><table><tr><th>инструкция</th><th>смысл</th></tr><tr><td><code>FROM</code></td><td>базовый образ</td></tr><tr><td><code>WORKDIR</code></td><td>рабочий каталог для следующих команд</td></tr><tr><td><code>COPY</code></td><td>копирует файлы из контекста сборки в образ</td></tr><tr><td><code>RUN</code></td><td>выполняет команду <b>во время сборки</b>, создавая слой</td></tr><tr><td><code>CMD</code></td><td>команда <b>при запуске</b> контейнера</td></tr><tr><td><code>EXPOSE</code></td><td>документирует порт (сам ничего не публикует!)</td></tr></table></div>"},
 {h:"Кэш слоёв — главный приём ускорения",b:"<p>Docker кэширует каждый слой. При пересборке он использует кэш, пока не встретит изменившуюся инструкцию, — а дальше пересобирает <b>всё до конца</b>.</p><p>Поэтому <code>package.json</code> копируется отдельно и <b>до</b> остального кода:</p><pre>COPY package*.json ./\nRUN npm ci        <span class='c'># этот слой переиспользуется</span>\nCOPY . .          <span class='c'># меняется часто, но он последний</span></pre><p>Изменил код — установка зависимостей берётся из кэша, сборка вместо трёх минут занимает десять секунд.</p><p><b>Правило:</b> редко меняющееся — выше, часто меняющееся — ниже.</p>"},
 {h:"Multi-stage: собрать в одном, запустить в другом",b:"<pre>FROM golang:1.22 AS build\nWORKDIR /src\nCOPY . .\nRUN go build -o /app/server\n\nFROM alpine:3.20\nCOPY --from=build /app/server /server\nUSER 1000\nCMD [\"/server\"]</pre><p>В финальный образ не попадают компилятор, исходники и кэш сборки: 900 МБ превращаются в 15 МБ.</p><p>Меньше размер — быстрее выкатка, меньше поверхность атаки и меньше уязвимостей в отчётах сканера.</p>"},
 {h:"CMD и ENTRYPOINT",b:"<div class='tw'><table><tr><th></th><th>CMD</th><th>ENTRYPOINT</th></tr><tr><td>смысл</td><td>команда по умолчанию</td><td>то, что выполняется всегда</td></tr><tr><td>аргументы docker run</td><td>заменяют CMD целиком</td><td>добавляются к ENTRYPOINT</td></tr></table></div><p>Частая связка: <code>ENTRYPOINT [\"/app/server\"]</code> и <code>CMD [\"--port=3000\"]</code> — бинарник фиксирован, флаги можно переопределить.</p><p><b>Обязательно exec-форма</b> (массив), а не shell-форма. В shell-форме процессом PID 1 становится <code>/bin/sh</code>, который не передаёт сигналы дальше, — и graceful shutdown ломается.</p>"},
 {h:"Контекст сборки и .dockerignore",b:"<p>Точка в <code>docker build -t app .</code> — это <b>контекст</b>: весь каталог отправляется демону. Без <code>.dockerignore</code> туда уедут <code>.git</code>, <code>node_modules</code>, локальный <code>.env</code>.</p><pre># .dockerignore\n.git\nnode_modules\n*.log\n.env\nDockerfile</pre><p>Это одновременно про скорость (меньше передавать) и про безопасность (секреты не попадут в образ через <code>COPY . .</code>).</p>"}],
 ch:[
 {t:"c",d:1,q:"Собери образ с тегом app:1.0 из текущего каталога.",ans:["docker build -t app:1.0 .","docker build -t app:1.0 ./"],hint:"build -t имя:тег контекст",why:"Точка в конце — контекст сборки, а не «текущий Dockerfile». Весь каталог уходит демону, поэтому нужен .dockerignore."},
 {t:"q",d:2,q:"Что делает инструкция <code>EXPOSE 3000</code>?",a:["Публикует порт наружу","Только документирует порт; публикация делается флагом -p при запуске","Открывает порт в фаерволе","Меняет порт приложения"],c:1,why:"Распространённое заблуждение. EXPOSE — метаданные для человека и для docker run -P; сам по себе он ничего не открывает."},
 {t:"q",d:3,q:"Почему <code>package.json</code> копируют отдельно и ДО остального кода?",a:["Так требует npm","Ради кэша слоёв: при изменении кода зависимости не переустанавливаются","Иначе не соберётся","Для безопасности"],c:1,why:"Кэш инвалидируется с первой изменившейся инструкции и до конца файла. Порядок инструкций напрямую определяет время сборки."},
 {t:"q",d:4,q:"Зачем нужен multi-stage build?",a:["Собирать несколько приложений сразу","Оставить в финальном образе только артефакт, без компилятора и исходников — меньше размер и меньше уязвимостей","Ускорить запуск контейнера","Он обязателен для Kubernetes"],c:1,why:"Классический ответ на собеседовании: минимальная база + бинарник + непривилегированный пользователь. Плюс исходный код не уезжает в реестр."},
 {t:"q",d:4,q:"Почему <code>CMD [\"node\",\"server.js\"]</code> лучше, чем <code>CMD node server.js</code>?",a:["Разницы нет","В exec-форме процесс становится PID 1 и получает сигналы; в shell-форме PID 1 — это sh, он не передаёт SIGTERM, и graceful shutdown ломается","Exec-форма быстрее","Shell-форма устарела синтаксически"],c:1,why:"Последствие видно при docker stop: контейнер висит 10 секунд и убивается жёстко, обрывая запросы. Для приложений, не умеющих в сигналы, есть --init/tini."},
 {t:"q",d:5,q:"<b>Инцидент.</b> Сборка образа в CI занимает 9 минут при каждом коммите, хотя зависимости не менялись. В Dockerfile: <code>FROM node:20</code>, затем <code>COPY . .</code>, затем <code>RUN npm install</code>. Что исправить, по убыванию эффекта?",a:["Купить более мощный раннер","1) разделить COPY: сначала package*.json + npm ci, потом COPY . .; 2) заменить базу на node:20-alpine; 3) добавить .dockerignore; 4) multi-stage","Уменьшить число тестов","Собирать образ реже"],c:1,why:"Первый пункт даёт основной выигрыш: кэш зависимостей перестаёт сбрасываться при каждом изменении кода. Остальное уменьшает размер и объём передаваемого контекста."}]},

{id:"d3",t:"Данные: тома и bind mount",goal:"Разделить эфемерное и постоянное",
 cards:[
 {h:"Три способа отдать контейнеру файлы",b:"<div class='tw'><table><tr><th>тип</th><th>синтаксис</th><th>для чего</th></tr><tr><td><b>volume</b></td><td><code>-v pgdata:/var/lib/postgresql/data</code></td><td>данные; управляется docker, переносим</td></tr><tr><td><b>bind mount</b></td><td><code>-v $(pwd)/conf:/etc/app:ro</code></td><td>конфиги и разработка; конкретная папка хоста</td></tr><tr><td><b>tmpfs</b></td><td><code>--tmpfs /tmp</code></td><td>только в памяти, исчезает с контейнером</td></tr></table></div><p>Суффикс <code>:ro</code> монтирует только для чтения — хорошая практика для конфигов и секретов.</p>"},
 {h:"Почему volume, а не bind mount на проде",b:"<ul><li>том не зависит от структуры каталогов конкретного сервера</li><li>docker управляет правами и владельцем</li><li>его легко забэкапить и перенести стандартным способом</li><li>драйверы позволяют хранить том не только локально</li></ul><p>Bind mount незаменим в разработке (правишь код на хосте — он сразу в контейнере) и для конфигов, но на проде для данных берут именованные тома или внешнее хранилище.</p>"},
 {h:"Бэкап и перенос тома",b:"<pre>docker run --rm \\\n  -v pgdata:/data \\\n  -v $(pwd):/backup \\\n  alpine tar czf /backup/pgdata.tar.gz -C /data .</pre><p>Приём «одноразовый контейнер с двумя томами» работает и для восстановления, и для миграции между хостами. <code>--rm</code> удаляет контейнер сразу после завершения.</p><pre>docker volume ls\ndocker volume inspect pgdata\ndocker volume prune       <span class='c'># удалить неиспользуемые — осторожно!</span></pre>"},
 {h:"Одна буква ценой в данные",b:"<pre>docker compose down       <span class='c'># остановить и удалить контейнеры</span>\ndocker compose down -v    <span class='c'># ...и УДАЛИТЬ ТОМА</span></pre><p>Флаг <code>-v</code> здесь означает не «подробно», а «volumes». Это самая дорогая опечатка новичка: команда отрабатывает молча и мгновенно уносит базу.</p><p>Та же осторожность с <code>docker system prune -a --volumes</code>: она чистит всё неиспользуемое, включая тома остановленных контейнеров.</p>"},
 {h:"Права внутри тома",b:"<p>Контейнер работает от пользователя с определённым UID. Если том создан с владельцем root, а приложение работает от <code>node</code> (UID 1000), получишь <code>Permission denied</code> на запись.</p><p>Решения: задать нужного пользователя в образе (<code>USER node</code>) и выставить владельца на каталог данных при инициализации, либо использовать <code>--user $(id -u):$(id -g)</code> при запуске.</p>"}],
 ch:[
 {t:"c",d:1,q:"Запусти postgres:16 с именованным томом pgdata под данные.",ans:["docker run -v pgdata:/var/lib/postgresql/data postgres:16","docker run -d -v pgdata:/var/lib/postgresql/data postgres:16"],hint:"-v имя_тома:путь_внутри",why:"Путь внутри контейнера берётся из документации образа — у каждого он свой."},
 {t:"q",d:2,q:"Чем bind mount отличается от именованного тома?",a:["Ничем","Bind — конкретный путь на хосте, зависит от машины; том управляется docker и переносим","Bind всегда быстрее","Том доступен только для чтения"],c:1,why:"На проде для данных предпочитают тома, bind оставляют для конфигов и локальной разработки."},
 {t:"q",d:3,q:"Зачем монтировать конфиг с суффиксом <code>:ro</code>?",a:["Ускоряет чтение","Контейнер не сможет изменить файл — защита от порчи конфига и лишних прав","Экономит место","Требуется для secrets"],c:1,why:"Принцип наименьших привилегий на уровне монтирования: приложению конфиг нужен только для чтения."},
 {t:"q",d:3,q:"Что делает флаг <code>-v</code> в команде <code>docker compose down -v</code>?",a:["Включает подробный вывод","Удаляет тома вместе с контейнерами — данные будут потеряны","Проверяет конфигурацию","Показывает версию"],c:1,why:"Для остановки без потери данных — просто docker compose down. Флаг -v используют только осознанно, при полном сбросе окружения."},
 {t:"q",d:4,q:"Контейнер приложения падает с <code>Permission denied</code> при записи в примонтированный том. В образе указан <code>USER node</code>. Причина?",a:["Том повреждён","Владелец каталога тома — root, а процесс работает от UID пользователя node: нужно выставить владельца или запускать с подходящим --user","Не хватает места","Том смонтирован как ro"],c:1,why:"Права внутри тома определяются числовыми UID/GID, а не именами: одно и то же имя в образе и на хосте может иметь разные идентификаторы."},
 {t:"q",d:5,q:"<b>Инцидент.</b> Разработчик выполнил <code>docker compose down -v</code> на боевом сервере, чтобы «перезапустить стек начисто». База пропала. Что делать сейчас и что должно было это предотвратить?",a:["Восстановить том из кэша docker","Восстанавливаться из внешнего бэкапа; предотвращают: регулярные проверенные бэкапы вне хоста, отсутствие прямого доступа к проду руками, деплой только через пайплайн","Перезапустить docker","Данные восстановятся автоматически при следующем запуске"],c:1,why:"Docker не хранит удалённые тома нигде. Два системных вывода: бэкап без тестового восстановления не считается бэкапом, а ручные команды на проде должны быть исключением, а не нормой."}]},

{id:"d4",t:"Сети контейнеров и docker compose",goal:"Поднять стек из нескольких сервисов",
 cards:[
 {h:"Типы сетей",b:"<div class='tw'><table><tr><th>сеть</th><th>что даёт</th></tr><tr><td><b>bridge</b> (по умолчанию)</td><td>контейнеры на одном хосте, NAT наружу</td></tr><tr><td><b>пользовательская bridge</b></td><td>то же плюс <b>DNS по именам контейнеров</b></td></tr><tr><td><b>host</b></td><td>сеть хоста напрямую, без изоляции портов</td></tr><tr><td><b>none</b></td><td>без сети</td></tr></table></div><p><b>Важная деталь:</b> в дефолтной bridge-сети разрешение имён между контейнерами <b>не работает</b>. Оно появляется только в пользовательской сети — а compose создаёт её автоматически.</p><pre>docker network create backend\ndocker run --network backend --name db postgres:16</pre>"},
 {h:"compose: стек одним файлом",b:"<pre>services:\n  web:\n    build: .\n    ports: [\"8080:3000\"]\n    environment:\n      DB_HOST: db\n    depends_on:\n      db:\n        condition: service_healthy\n  db:\n    image: postgres:16\n    environment:\n      POSTGRES_PASSWORD: ${DB_PASSWORD}\n    volumes:\n      - pgdata:/var/lib/postgresql/data\n    healthcheck:\n      test: [\"CMD-SHELL\", \"pg_isready -U postgres\"]\n      interval: 5s\n      retries: 5\n\nvolumes:\n  pgdata:</pre><p>Внутри сети compose сервисы обращаются друг к другу <b>по имени сервиса</b>: приложение ходит на хост <code>db</code>, а не на IP. IP-адреса меняются при пересоздании, имена — нет.</p>"},
 {h:"depends_on обманчив",b:"<p><code>depends_on</code> в простой форме ждёт только <b>запуска</b> контейнера, а не готовности сервиса принимать соединения. База стартует 5–10 секунд, приложение подключается сразу и падает.</p><p>Правильно: <code>healthcheck</code> у зависимости плюс <code>condition: service_healthy</code>. И <b>всё равно</b> — ретраи подключения в самом приложении: в Kubernetes порядок запуска вообще не гарантирован.</p>"},
 {h:"Команды compose",b:"<pre>docker compose up -d          <span class='c'># поднять в фоне</span>\ndocker compose ps\ndocker compose logs -f web\ndocker compose exec web sh\ndocker compose build --no-cache\ndocker compose down           <span class='c'># без -v, чтобы сохранить тома</span></pre><p>Переменные берутся из файла <code>.env</code> рядом с compose-файлом — так пароли не попадают в git вместе с конфигурацией.</p>"},
 {h:"Реестр образов",b:"<pre>docker login registry.company.ru\ndocker tag app:local registry.company.ru/team/app:1a2b3c4\ndocker push registry.company.ru/team/app:1a2b3c4</pre><p>Имя образа — это адрес: <code>[реестр]/[пространство]/[имя]:[тег]</code>. Без указания реестра подразумевается Docker Hub.</p><p>Тег по хешу коммита даёт однозначную связь «контейнер ↔ код». <code>latest</code> такой связи не даёт и делает откат гаданием.</p>"}],
 ch:[
 {t:"c",d:1,q:"Подними весь стек из docker-compose.yml в фоне.",ans:["docker compose up -d","docker-compose up -d","docker compose up --detach"],hint:"compose up + флаг фона",why:"Без -d логи повиснут в терминале, а Ctrl+C остановит стек."},
 {t:"q",d:2,q:"Как контейнер web обращается к базе в том же compose-файле?",a:["По IP-адресу контейнера","По имени сервиса: <code>db:5432</code>","Через localhost","Через IP хоста"],c:1,why:"Встроенный DNS пользовательской сети резолвит имена сервисов. IP меняются при пересоздании — хардкодить их нельзя."},
 {t:"q",d:3,q:"Два контейнера запущены через <code>docker run</code> без указания сети. Один не может обратиться к другому по имени. Почему?",a:["Нужно открыть порты","В дефолтной bridge-сети DNS по именам не работает — нужна пользовательская сеть (docker network create)","Контейнеры на разных хостах","Не хватает прав"],c:1,why:"Именно поэтому compose всегда создаёт свою сеть: в ней разрешение имён работает из коробки."},
 {t:"q",d:3,q:"Как правильно передать пароль БД в контейнер на проде?",a:["ENV в Dockerfile","Захардкодить в образ","Через секреты оркестратора или внешний менеджер, подставляя в рантайме","В имя контейнера"],c:2,why:"ENV в Dockerfile попадает в слои образа и виден через docker history любому, кто скачал образ. Секреты живут только в рантайме."},
 {t:"q",d:4,q:"Приложение падает при старте стека: «connection refused» к базе, хотя в compose есть <code>depends_on: [db]</code>. Что не так?",a:["Опечатка в имени сервиса","depends_on ждёт только запуска контейнера, а не готовности БД принимать соединения — нужен healthcheck с condition: service_healthy и ретраи в приложении","Не хватает памяти","Неверный порт"],c:1,why:"Ретраи в приложении обязательны в любом случае: в Kubernetes порядок запуска не гарантирован вовсе, и полагаться на него нельзя."},
 {t:"q",d:5,q:"<b>Инцидент.</b> После обновления стека приложение не видит базу: в логах «getaddrinfo ENOTFOUND db-1». В compose сервис называется <code>db</code>, но кто-то прописал в конфиге приложения имя контейнера <code>db-1</code>. Что происходит и как правильно?",a:["Нужно переименовать контейнер","Обращаться надо по имени сервиса (db), а не по имени контейнера: имена контейнеров содержат префикс проекта и номер реплики и меняются","Проблема с DNS хоста","Нужно указать IP-адрес"],c:1,why:"Имя сервиса — стабильный сетевой псевдоним, имя контейнера — производное от проекта и масштабирования. Тот же принцип в Kubernetes: обращаются к Service, а не к поду."}]},

{id:"d5",t:"Продакшен-качество образа",goal:"Сделать образ, который не стыдно выкатить",
 cards:[
 {h:"HEALTHCHECK",b:"<pre>HEALTHCHECK --interval=30s --timeout=3s --start-period=20s --retries=3 \\\n  CMD curl -fsS http://localhost:3000/health || exit 1</pre><p><b>Running ≠ healthy.</b> Процесс запущен — не значит, что приложение прогрелось, подключилось к БД и готово принимать трафик.</p><p><code>--start-period</code> даёт время на старт, не считая неудачи за отказ. Оркестратор использует статус, чтобы не слать трафик в неготовый контейнер и перезапускать зависшие.</p>"},
 {h:"Непривилегированный пользователь",b:"<pre>RUN addgroup -g 1000 app &amp;&amp; adduser -u 1000 -G app -D app\nUSER app</pre><p>Процесс от root внутри контейнера — это root в пространстве имён хоста при многих конфигурациях. Ошибка в приложении превращается в компрометацию узла.</p><p>Дополнительно на запуске: <code>--read-only</code> файловая система, <code>--cap-drop ALL</code>, <code>--security-opt no-new-privileges</code>. Для временных файлов монтируют tmpfs.</p>"},
 {h:"Сигналы и корректная остановка",b:"<p>При <code>docker stop</code> контейнер получает SIGTERM и 10 секунд на завершение, потом SIGKILL. Приложение должно за это время: перестать принимать новые запросы, доработать текущие, закрыть соединения с БД.</p><p>Если процесс не является PID 1 или не обрабатывает сигналы, каждый деплой обрывает запросы пользователей. Лечится exec-формой CMD, обработчиком SIGTERM в коде и флагом <code>--init</code> для процессов, не умеющих в сигналы.</p>"},
 {h:"Размер, кэш и сборка",b:"<pre>DOCKER_BUILDKIT=1 docker build \\\n  --cache-from registry/app:cache -t registry/app:$SHA .\n\ndocker buildx build --platform linux/amd64,linux/arm64 .</pre><ul><li><code>--cache-from</code> переиспользует слои из реестра — ускоряет сборку в CI, где кэша нет</li><li>multi-arch нужен, если ноутбук на ARM, а сервер на x86: иначе «exec format error»</li><li><code>trivy image registry/app:tag</code> — проверка на известные уязвимости</li></ul>"},
 {h:"Чек-лист образа для прода",b:"<ul><li>минимальная база (alpine, slim или distroless), зафиксированная версия — не <code>latest</code></li><li>multi-stage: в рантайме нет компилятора и исходников</li><li>кэш слоёв: зависимости отдельно от кода</li><li><code>.dockerignore</code> с <code>.git</code>, <code>node_modules</code>, <code>.env</code></li><li><code>USER</code> не root</li><li>exec-форма CMD и обработка SIGTERM</li><li>HEALTHCHECK</li><li>логи в stdout/stderr, не в файл</li><li>образ помечен хешем коммита</li></ul>"}],
 ch:[
 {t:"q",d:1,q:"Куда контейнеризованное приложение должно писать логи?",a:["В файл внутри контейнера","В stdout и stderr","В базу данных","В syslog хоста"],c:1,why:"Их подхватывает драйвер логов и отправляет в систему сбора. Файлы внутри контейнера теряются при пересоздании и раздувают слой."},
 {t:"q",d:2,q:"Контейнер в состоянии Up, но пользователи получают ошибки сразу после деплоя. Чего не хватает?",a:["Больше реплик","HEALTHCHECK и проверки готовности — трафик пошёл в ещё не прогретое приложение","Больше памяти","Тома для данных"],c:1,why:"Между «процесс стартовал» и «приложение готово» проходят секунды, а с прогревом кэша — минуты."},
 {t:"q",d:3,q:"Чем плохо, что процесс в контейнере работает от root?",a:["Ничем, контейнер изолирован","При неверной конфигурации или уязвимости это даёт путь к правам root на хосте — базовая практика требует USER не root","Работает медленнее","Образ становится больше"],c:1,why:"Дополняется read-only файловой системой, drop capabilities и no-new-privileges. В Kubernetes это же выражается через securityContext."},
 {t:"q",d:4,q:"Приложение не завершается корректно при <code>docker stop</code>: запросы обрываются. Причина?",a:["Мало памяти","Процесс не обрабатывает SIGTERM или запущен через shell-форму CMD и не является PID 1","Нет healthcheck","Не открыт порт"],c:1,why:"Exec-форма CMD плюс обработчик SIGTERM в коде дают graceful shutdown. Без этого каждый деплой стоит пользователям оборванных запросов."},
 {t:"q",d:4,q:"Образ собран на MacBook с процессором ARM, на сервере не запускается: «exec format error». Что сделать?",a:["Пересобрать на сервере","Собирать multi-arch через <code>docker buildx --platform linux/amd64,linux/arm64</code> или явно указать целевую платформу","Обновить docker","Сменить базовый образ"],c:1,why:"Архитектура образа должна совпадать с архитектурой хоста. В CI это обычно решается сборкой на amd64-раннере или buildx."},
 {t:"q",d:5,q:"<b>Инцидент.</b> Тебе прислали на ревью образ: 1.8 ГБ, <code>FROM node:20</code>, <code>COPY . .</code> первой строкой, запуск от root, <code>CMD npm start</code>, логи пишутся в <code>/app/logs/app.log</code>. Какие замечания дать по убыванию важности?",a:["Только размер образа","1) root и отсутствие USER — риск безопасности; 2) COPY . . без .dockerignore тянет .git и .env в образ; 3) сломан кэш слоёв; 4) shell-форма CMD ломает graceful shutdown; 5) логи в файл вместо stdout; 6) тяжёлая база вместо alpine/multi-stage","Заменить node:20 на node:18","Добавить EXPOSE"],c:1,why:"Порядок замечаний важен: сначала безопасность и утечка секретов, потом корректность работы, и только потом размер. Такой разбор и есть содержание ревью Dockerfile на собеседовании."}]},

{id:"d6",t:"Отладка контейнеров",goal:"Понять, почему не работает, не переустанавливая всё",
 cards:[
 {h:"Порядок диагностики",b:"<ol><li><code>docker ps -a</code> — какое состояние и код выхода</li><li><code>docker logs имя</code> — что сказало приложение перед смертью</li><li><code>docker inspect имя</code> — конфигурация: образ, переменные, лимиты, монтирования</li><li><code>docker exec -it имя sh</code> — заглянуть внутрь живого контейнера</li><li><code>docker stats</code> — потребление ресурсов</li></ol><p>Первые два шага закрывают большинство случаев. Пересоздавать контейнер до чтения логов — потерять улики.</p>"},
 {h:"Коды выхода",b:"<div class='tw'><table><tr><th>код</th><th>причина</th></tr><tr><td>0</td><td>штатное завершение (для сервиса — подозрительно)</td></tr><tr><td>1</td><td>приложение упало само</td></tr><tr><td>125</td><td>ошибка самого docker (неверный флаг)</td></tr><tr><td>126</td><td>команда найдена, но не исполняемая</td></tr><tr><td>127</td><td>команда не найдена (опечатка, нет бинарника в образе)</td></tr><tr><td>137</td><td>SIGKILL: чаще всего OOM — превышен лимит памяти</td></tr><tr><td>143</td><td>SIGTERM: штатная остановка</td></tr></table></div><p><b>137</b> и <b>127</b> — два кода, которые экономят больше всего времени.</p>"},
 {h:"Когда внутри нет ни shell, ни утилит",b:"<p>В distroless и scratch-образах нет <code>sh</code>, <code>curl</code> и <code>ps</code> — это плюс для безопасности и минус для отладки.</p><pre>docker run --rm -it --network container:web nicolaka/netshoot</pre><p>Запускается отладочный контейнер <b>в сетевом пространстве</b> целевого: внутри доступны curl, dig, tcpdump, ss — и они видят сеть ровно так, как её видит проблемный контейнер. Тот же приём в Kubernetes называется ephemeral containers (<code>kubectl debug</code>).</p>"},
 {h:"Ресурсы и лимиты",b:"<pre>docker run -m 512m --cpus 1.5 app\ndocker stats\ndocker inspect app --format '{{.State.OOMKilled}}'</pre><p>Превышение лимита <b>памяти</b> = мгновенное убийство (137). Превышение лимита <b>CPU</b> = троттлинг: приложение работает, но медленно.</p><p>Отсюда практическое правило: CPU-лимиты ставят щедро или не ставят вовсе, а лимит памяти — обязательно и с запасом, чтобы один контейнер не съел весь хост.</p>"}],
 ch:[
 {t:"c",d:1,q:"Посмотри логи контейнера api в реальном времени.",ans:["docker logs -f api","docker logs --follow api","docker logs -f --tail 100 api"],hint:"logs + follow",why:"--tail ограничивает начальный объём: docker logs -f --tail 100 удобнее на контейнере, работающем неделю."},
 {t:"q",d:2,q:"Контейнер завершился с кодом 137. Что это значит?",a:["Ошибка в команде запуска","Процесс убит SIGKILL — почти всегда превышен лимит памяти (OOM)","Нет такого файла","Штатная остановка"],c:1,why:"137 = 128 + 9. Проверяется через docker inspect: поле OOMKilled. Лечится увеличением лимита или устранением утечки."},
 {t:"q",d:3,q:"Контейнер падает с кодом 127. Куда смотреть?",a:["На лимиты памяти","Команда не найдена: опечатка в CMD/ENTRYPOINT или бинарника нет в финальном образе","На сеть","На тома"],c:1,why:"Частый случай при multi-stage: забыли скопировать бинарник в финальный stage. 126 рядом — файл есть, но не исполняемый."},
 {t:"q",d:3,q:"Нужно проверить, какие переменные окружения и монтирования у работающего контейнера. Чем?",a:["docker logs","docker inspect имя","docker stats","docker history"],c:1,why:"inspect отдаёт полную конфигурацию в JSON: образ, env, лимиты, mounts, состояние. Формат вывода можно сузить через --format."},
 {t:"q",d:4,q:"Образ собран на базе distroless: внутри нет shell, <code>docker exec -it sh</code> не работает. Как отлаживать сеть контейнера?",a:["Пересобрать образ с shell и выкатить на прод","Запустить отладочный контейнер в сетевом пространстве целевого: <code>docker run --rm -it --network container:web nicolaka/netshoot</code>","Отладить локально и надеяться","Добавить curl в образ навсегда"],c:1,why:"Класть отладочные утилиты в прод-образ — значит расширять поверхность атаки. В Kubernetes аналог — kubectl debug с ephemeral-контейнером."},
 {t:"q",d:5,q:"<b>Инцидент.</b> Контейнер <code>web</code> в бесконечном цикле перезапусков. <code>docker ps -a</code> показывает «Restarting (1)», <code>docker logs web</code> — «connect ECONNREFUSED db:5432». Контейнер <code>db</code> в состоянии «Exited (137)». Порядок действий?",a:["Перезапустить web ещё раз","Разбираться с db: код 137 — OOM, значит поднять лимит памяти или починить потребление; затем поднять db и только потом web; в приложении добавить ретраи подключения","Удалить оба контейнера и создать заново","Увеличить число реплик web"],c:1,why:"Симптом у web, причина у db. Правило: идти по цепочке зависимостей вниз и лечить корень. Ретраи в приложении превращают такую ситуацию из падения в задержку старта."}]}
);
