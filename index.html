function renderStats(){
  const l=LVL(S.xp),cur=lvlFloor(l),nxt=lvlFloor(l+1);
  document.getElementById("s-lvl").textContent=l;
  document.getElementById("s-xp").style.width=Math.min(100,(S.xp-cur)/(nxt-cur)*100)+"%";
  document.getElementById("s-xptxt").textContent=`${S.xp} / ${nxt} xp`;
  document.getElementById("s-streak").textContent=S.streak+"🔥";
}
const TABS=[["map","Карта"],["drill","Тренажёр"],["career","Карьера"],["hero","Персонаж"],["repair","Повторы"],["sand","Песочница"],["road","План 0→Middle"],["prof","Профиль"]];
function renderTabs(){
  document.getElementById("tabs").innerHTML=TABS.map(([k,n])=>{
    const d=k==="repair"?dueList().length:k==="hero"?storyAvailable().length:0;
    return `<button data-tab="${k}" aria-selected="${S.tab===k}">${n}${d?` <span style="color:var(--amber)">·${d}</span>`:""}</button>`}).join("");
}
function go(t){R=null;L=null;DRL=null;IV=null;S.tab=t;save();render();window.scrollTo({top:0,behavior:"smooth"});}
function render(){
  renderStats();renderTabs();
  const v=document.getElementById("view");
  if(S.tab==="map")v.innerHTML=viewMap();
  else if(S.tab==="repair")v.innerHTML=viewRepair();
  else if(S.tab==="road")v.innerHTML=viewRoad();
  else if(S.tab==="drill")v.innerHTML=viewDrill();
  else if(S.tab==="career")v.innerHTML=viewCareer();
  else if(S.tab==="hero")v.innerHTML=viewHero();
  else if(S.tab==="sand"){v.innerHTML=viewSandbox();initSandbox();}
  else v.innerHTML=viewProf();
}
function ring(pct,ic){
  const c=2*Math.PI*22,off=c*(1-pct/100);
  return `<div class="ring"><svg width="52" height="52"><circle cx="26" cy="26" r="22" stroke="var(--line)" stroke-width="3" fill="none"/>
  <circle cx="26" cy="26" r="22" stroke="${pct===100?'var(--ok)':'var(--amber)'}" stroke-width="3" fill="none"
  stroke-dasharray="${c}" stroke-dashoffset="${off}" stroke-linecap="round"/></svg><b>${ic}</b></div>`;
}
function totals(){
  const m=WORLDS.reduce((a,w)=>a+w.miss.length,0);
  const l=Object.keys(LABS).length;
  const ch=WORLDS.reduce((a,w)=>a+w.miss.reduce((x,mm)=>x+mm.ch.length,0)+w.boss.ch.length,0);
  const tk=Object.values(LABS).reduce((a,x)=>a+x.tasks.length,0);
  return {m,l,ch,tk,b:WORLDS.length};
}
function viewMap(){
  const nt=nextThing(),due=dueList().length,T=totals();
  const doneM=Object.keys(S.mis).length,doneL=Object.keys(S.labs).length;
  let hero=`<section class="hero">
   <div class="card"><div class="lbl">твой путь</div>
     <h1>От нуля до Middle DevOps</h1>
     <p class="muted" style="margin:0 0 14px">${T.b} миров · ${T.m} миссий · <b style="color:var(--amber-2)">${T.l} лабораторий с живым терминалом</b> · ${T.b} боссов · ${T.ch}&nbsp;заданий и ${T.tk} шагов отладки. Полный проход — примерно 25–35 часов, плюс повторы. Прогресс сохраняется автоматически.</p>
     <div class="row">${nt?`<button class="btn" data-act="${nt.boss?'boss':nt.lab?'lab':'mis'}" data-w="${nt.w.id}" ${nt.m?`data-m="${nt.m.id}"`:""} ${nt.lab?`data-l="${nt.lab.id}"`:""}>▶ ${nt.boss?"Босс: "+nt.w.boss.t:nt.lab?"Лаборатория: "+nt.lab.t:"Продолжить: "+nt.m.t}</button>`:`<span class="muted">Всё пройдено. Ты готов идти на собеседование.</span>`}
     ${due?`<button class="btn ghost" data-go="repair">⟳ Повторы: ${due}</button>`:""}
     <button class="btn ghost" data-go="sand">⌨ Песочница</button></div>
   </div>
   <div class="card pad next">
     <div><div class="lbl">персонаж</div>
     <b style="font-size:19px;font-family:var(--disp)">${rank().n}</b>
     <div class="lbl" style="margin-top:4px">${S.job?JOBS.find(x=>x.id===S.job.id).n:"без работы · загляни в «Карьеру»"}</div>
     <div style="margin-top:8px">${bar(overall())}</div></div>
     <div><div class="lbl">сегодня</div>
     <p style="margin:6px 0 0;font-size:14px">${S.last===today()?"Отметка дня получена. Стрик держится.":"Пройди одну миссию — стрик обновится."}</p></div>
     <div class="row" style="gap:22px">
       <div><div class="lbl">миссии</div><b class="mono" style="font-size:22px">${doneM}<span class="muted" style="font-size:13px">/${T.m}</span></b></div>
       <div><div class="lbl">лаборатории</div><b class="mono" style="font-size:22px;color:var(--amber-2)">${doneL}<span class="muted" style="font-size:13px">/${T.l}</span></b></div>
     </div>
   </div></section>`;
  let worlds="";
  WORLDS.forEach((w,i)=>{
    const p=wProgress(w),un=wUnlocked(i),open=S.openWorld===w.id,L2=labsOf(w.id);
    worlds+=`<div class="wnode ${un?"":"locked"}" ${un?`data-world="${w.id}"`:""}>
      ${ring(p.pct,w.ic)}
      <div><h3>${w.n}</h3><p>${w.tag}</p>
      <div class="chips"><span class="chip ${p.done===p.total?"done":""}">${p.done}/${p.total}</span>
      ${w.miss.map(m=>`<span class="chip ${S.mis[m.id]?"done":""}">${m.t}</span>`).join("")}
      ${L2.map(l=>`<span class="chip lab ${S.labs[l.id]?"done":""}">⌁ ${l.t.replace(/^(Инцидент|Ревью): /,"")}</span>`).join("")}
      <span class="chip boss">${S.boss[w.id]?"✓ ":"⚔ "}${w.boss.t}</span></div></div>
      <div class="mono muted" style="font-size:12px">${un?(open?"свернуть ▲":"открыть ▼"):"🔒"}</div></div>`;
    if(open&&un){
      worlds+=`<div class="card pad" style="margin-top:10px"><p class="muted" style="margin:0 0 12px">${w.desc}</p><div class="mlist">`;
      w.miss.forEach((m,j)=>{const d=!!S.mis[m.id];
        worlds+=`<button class="mrow" data-act="mis" data-w="${w.id}" data-m="${m.id}">
          <span class="dot ${d?"done":""}">${d?"✓":j+1}</span>
          <span><strong>${m.t}</strong><small>${m.goal}</small></span>
          <span class="mono muted" style="font-size:12px">${d?"пройдено":"+"+m.ch.length*12+"xp"}</span></button>`;});
      const misDone=w.miss.filter(m=>S.mis[m.id]).length;
      L2.forEach(l=>{const d=!!S.labs[l.id];const lock=misDone<Math.min(2,w.miss.length);
        worlds+=`<button class="mrow ${lock?"locked":""}" data-act="lab" data-w="${w.id}" data-l="${l.id}" style="border-color:${d?"rgba(63,191,143,.4)":"rgba(240,135,63,.35)"}">
          <span class="dot ${d?"done":""}" style="color:var(--amber-2)">${d?"✓":"⌁"}</span>
          <span><strong>Лаборатория · ${l.t}</strong><small>${lock?"Пройди хотя бы 2 миссии мира":l.tasks.length+" шагов в настоящем терминале · "+(d?"можно перепройти":"диагностика и починка")}</small></span>
          <span class="mono muted" style="font-size:12px">+${l.xp}xp</span></button>`;});
      const bl=misDone<w.miss.length;
      worlds+=`<button class="mrow ${bl?"locked":""}" data-act="boss" data-w="${w.id}" style="border-color:rgba(124,107,242,.4)">
        <span class="dot ${S.boss[w.id]?"done":""}" style="color:var(--violet)">${S.boss[w.id]?"✓":"⚔"}</span>
        <span><strong>Босс · ${w.boss.t}</strong><small>${bl?"Пройди все миссии мира, чтобы открыть":"3 жизни. Ошибёшься трижды — заново."}</small></span>
        <span class="mono muted" style="font-size:12px">+120xp</span></button></div></div>`;
    }
  });
  return hero+`<div class="lbl" style="margin:6px 0 12px">миры</div>`+worlds;
}
function viewRepair(){
  const d=dueList(),all=Object.keys(S.srs).length;
  return `<section class="card pad" style="margin-bottom:18px">
    <div class="lbl">интервальные повторы</div><h1 style="font-size:26px;margin:4px 0 8px">Ремонт памяти</h1>
    <p class="muted" style="max-width:62ch;margin:0 0 14px">Знание держится не с первого раза, а с пятого. Игра сама возвращает задания через 1, 3, 7, 16 и 35 дней. Ответил верно — интервал растёт. Ошибся — вернётся завтра.</p>
    <div class="row"><b class="mono" style="font-size:24px">${d.length}</b><span class="muted">к повтору сегодня · всего в памяти ${all} · закрыто повторов ${S.repairs}</span></div>
    ${d.length?`<div class="row" style="margin-top:14px"><button class="btn" data-act="repair">⟳ Начать повтор</button></div>`
    :`<p style="margin-top:14px;color:var(--ok)">Всё повторено. Возвращайся завтра.</p>`}</section>`;
}
function viewRoad(){
  return `<section class="card pad" style="margin-bottom:20px">
    <div class="lbl">дорожная карта</div><h1 style="font-size:28px;margin:4px 0 8px">План: 0 → Middle DevOps</h1>
    <p class="muted" style="max-width:66ch;margin:0">Реалистичный срок при 30–60 минутах в день — 7–9 месяцев до уверенного junior+/middle. Каждый мир на карте соответствует блоку ниже.</p></section>
  <div>${ROADMAP.map((r,i)=>`<div class="stage"><div class="rail"><b>${r.n}</b>${i<ROADMAP.length-1?"<s></s>":""}</div>
    <div class="body"><h3>${r.t}</h3><div class="when">${r.when}</div><div class="muted">${r.b}</div></div></div>`).join("")}</div>
  ${mappingHTML()}
  <section class="card pad" style="margin-top:16px">
    <h3 style="margin-bottom:10px">Как учиться, если не получается долго сидеть</h3>
    <div class="grid2">
      <ul class="tight"><li><b>Сессия = 1 миссия.</b> 6–10 минут. Закончил — можно уходить без чувства вины.</li>
      <li><b>Лабораторию можно бросить и вернуться</b> — состояние терминала держится, пока открыта вкладка, а прогресс шагов виден справа.</li>
      <li><b>Каждый день, а не помногу.</b> Стрик важнее объёма.</li></ul>
      <ul class="tight"><li><b>Ошибка — механика, а не провал.</b> Промах возвращается повтором.</li>
      <li><b>Раз в неделю — руками.</b> Повтори на своей VPS то, что прошёл в лаборатории.</li>
      <li><b>Пет-проект с 4-й недели.</b> Всё новое сразу прикручивай к нему.</li></ul>
    </div></section>`;
}

  return `<section class="card pad" style="margin-bottom:18px">
   <div class="lbl">профиль</div><h1 style="font-size:28px;margin:4px 0 12px">Уровень ${l} · ${S.xp} XP</h1>
   <div class="tw"><table>
    <tr><th>показатель</th><th>значение</th></tr>
    <tr><td>Миссий пройдено</td><td class="mono">${Object.keys(S.mis).length} / ${T.m}</td></tr>
    <tr><td>Лабораторий закрыто</td><td class="mono">${Object.keys(S.labs).length} / ${T.l}</td></tr>
    <tr><td>Боссов побеждено</td><td class="mono">${Object.keys(S.boss).length} / ${T.b}</td></tr>
    <tr><td>Текущий стрик</td><td class="mono">${S.streak} дн.</td></tr>
    <tr><td>Дней в игре</td><td class="mono">${S.days.length}</td></tr>
    <tr><td>Заданий в памяти</td><td class="mono">${Object.keys(S.srs).length}</td></tr>
   </table></div></section>

   <div class="badges">${BADGES.map(b=>`<div class="badge ${S.badges.includes(b.id)?"":"off"}"><div class="ic">${b.ic}</div><b>${b.n}</b><small>${b.d}</small></div>`).join("")}</div>
   <section class="card pad" style="margin-top:18px">
     <h3 style="margin-bottom:8px">Данные</h3>
     <p class="muted" style="font-size:13.5px;margin:0 0 12px">Прогресс хранится в этом браузере. Сохрани копию, если меняешь устройство.</p>

}

const drKey=d=>d.q;
function drMastery(q){return (S.drill&&S.drill[q]&&S.drill[q].m)||0}
function drWorldMastery(w){
  const list=DR.filter(d=>d.w===w); if(!list.length)return 0;
  return list.reduce((a,d)=>a+Math.min(5,drMastery(d.q)),0)/(list.length*5);
}
function drTotalMastery(){return DR.reduce((a,d)=>a+Math.min(5,drMastery(d.q)),0)/(DR.length*5)}
function drLearned(){return DR.filter(d=>drMastery(d.q)>=3).length}
function drPick(mode,w){
  let pool=DR.slice();
  if(w)pool=pool.filter(d=>d.w===w);
  if(mode==="weak")pool.sort((a,b)=>(drMastery(a.q)-drMastery(b.q))||(Math.random()-.5));
  else if(mode==="new")pool=pool.filter(d=>drMastery(d.q)===0).concat(shuffle(pool));
  else pool=shuffle(pool);
  return pool;
}
let DRL=null;
function startDrill(mode,w){
  const pool=drPick(mode,w);
  const n=mode==="blitz"?999:12;
  DRL={mode,w,items:pool.slice(0,n),i:0,ok:0,bad:0,combo:0,best:0,xp:0,t0:Date.now(),
       limit:mode==="blitz"?60:0,done:false,checked:false,last:null};
  if(mode==="blitz")startBlitzTimer();
  drawDrill();
}
let blitzT=null;
function startBlitzTimer(){
  clearInterval(blitzT);
  blitzT=setInterval(()=>{
    if(!DRL||DRL.done){clearInterval(blitzT);return}
    const left=DRL.limit-Math.floor((Date.now()-DRL.t0)/1000);
    const el=document.getElementById("drtimer");
    if(el)el.textContent=Math.max(0,left)+"с";
    if(left<=0){clearInterval(blitzT);finishDrill()}
  },250);
}
function drCheck(val){
  const it=DRL.items[DRL.i];
  const u=norm(val);
  const ok=it.a.some(x=>norm(x)===u);
  DRL.checked=true;DRL.last={ok,val};
  const rec=S.drill[it.q]||{m:0,seen:0};
  rec.seen++;
  rec.m=ok?Math.min(5,rec.m+1):Math.max(0,rec.m-1);
  rec.at=today();
  S.drill[it.q]=rec;
  if(ok){DRL.ok++;DRL.combo++;DRL.best=Math.max(DRL.best,DRL.combo);
    const mult=1+Math.min(4,Math.floor(DRL.combo/5));
    DRL.xp+=3*mult;}
  else {DRL.bad++;DRL.combo=0;}
  save();drawDrill();
}
function drNext(){
  DRL.checked=false;DRL.last=null;DRL.i++;
  if(DRL.i>=DRL.items.length)finishDrill(); else drawDrill();
}
function finishDrill(){
  if(DRL.done)return;
  DRL.done=true;clearInterval(blitzT);
  addXP(DRL.xp);checkDay();
  S.drillRuns=(S.drillRuns||0)+1;
  S.drillOk=(S.drillOk||0)+DRL.ok;
  if(drLearned()>=40)award("drill40");
  if(drLearned()>=DR.length)award("drillall");
  if(DRL.best>=15)award("combo15");
  questTick("drill",DRL.ok);
  if(DRL.mode==="blitz")questTick("blitz",1);
  save();drawDrill();
}

const SKILLS=[
 {id:"linux",n:"Linux",ic:"▟"},{id:"net",n:"Сети и веб",ic:"◈"},{id:"git",n:"Git",ic:"⑂"},
 {id:"docker",n:"Docker",ic:"▣"},{id:"cicd",n:"CI/CD",ic:"⇉"},{id:"iac",n:"IaC",ic:"⌗"},
 {id:"k8s",n:"Kubernetes",ic:"⎈"},{id:"obs",n:"Мониторинг",ic:"◉"},{id:"cloudsec",n:"Облако и безопасность",ic:"⛨"}
];
function skillOf(wid){
  const w=WORLDS.find(x=>x.id===wid); if(!w)return 0;
  const labs=labsOf(wid);
  const mDone=w.miss.filter(m=>S.mis[m.id]).length/Math.max(1,w.miss.length);
  const lDone=labs.length?labs.filter(l=>S.labs[l.id]).length/labs.length:0;
  const b=S.boss[wid]?1:0;
  const dr=DR.some(d=>d.w===wid)?drWorldMastery(wid):0;
  const wm=labs.length?0.38:0.53, wl=labs.length?0.15:0, wb=0.17, wd=DR.some(d=>d.w===wid)?0.30:0;
  const norm=wm+wl+wb+wd;
  return Math.round(100*((mDone*wm+lDone*wl+b*wb+dr*wd)/norm));
}
function softSkill(){
  const iv=(S.interviews||[]).filter(x=>x.passed).length;
  const st=(S.storySeen||[]).length;
  const rp=Math.min(1,(S.repairs||0)/60);
  return Math.min(100,Math.round(iv*11+st*3+rp*25+(S.boss.cloudsec?15:0)));
}
function overall(){
  const vals=SKILLS.map(s=>skillOf(s.id));
  const avg=vals.reduce((a,b)=>a+b,0)/vals.length;
  const top=vals.slice().sort((a,b)=>b-a).slice(0,3);
  const depth=top.reduce((a,b)=>a+b,0)/3;
  return Math.round((avg*0.55+depth*0.45)*0.85+softSkill()*0.15);
}

function todayQuests(){
  const d=today();
  if(!S.quests||S.quests.d!==d){
    const seed=[...d].reduce((a,c)=>a+c.charCodeAt(0),0);
    const pool=QUESTS.slice();const pick=[];
    for(let i=0;i<3;i++)pick.push(pool.splice((seed*(i+3))%pool.length,1)[0]);
    S.quests={d,list:pick.map(q=>({id:q.id,p:0,done:false}))};save();
  }
  return S.quests.list.map(x=>({...QUESTS.find(q=>q.id===x.id),...x}));
}
function questTick(type,n){
  const qs=todayQuests();let changed=false;
  qs.forEach((q,i)=>{
    if(q.type!==type||q.done)return;
    const rec=S.quests.list[i];
    rec.p=Math.min(q.n,rec.p+(n||1));
    if(rec.p>=q.n){rec.done=true;addXP(q.xp);toast(`Задание дня: ${q.t} · +${q.xp} XP`);changed=true}
  });
  if(qs.every(q=>S.quests.list.find(x=>x.id===q.id).done)&&!S.quests.bonus){
    S.quests.bonus=true;addXP(50);award("dailyall");toast("Все задания дня закрыты · +50 XP");
  }
  if(changed)save();
}

let IV=null;
function startInterview(id){
  const j=JOBS.find(x=>x.id===id);
  const reqOk=Object.entries(j.req).every(([k,v])=>skillOf(k)>=v-12);
  const pool=[];
  j.w.forEach(wid=>{const w=WORLDS.find(x=>x.id===wid);
    w.miss.forEach(m=>m.ch.forEach(c=>{if(c.t==="q")pool.push({...c,w:wid})}));
    w.boss.ch.forEach(c=>{if(c.t==="q")pool.push({...c,w:wid})});});
  const soft=shuffle(SOFTQ.slice()).slice(0,gradeIdx(j.g)>=3?3:2).map(c=>({...c,w:"soft"}));
  const tech=shuffle(pool).slice(0,Math.max(2,j.qn-soft.length));
  IV={j,phase:reqOk?"brief":"screen",items:shuffle(tech.concat(soft)),i:0,ok:0,ans:null,checked:false,reqOk};
  drawIV();
}
function ivFeedback(){
  const j=IV.j;
  return Object.entries(j.req).map(([k,v])=>{
    const cur=skillOf(k),s=SKILLS.find(x=>x.id===k);
    return {n:s.n,cur,need:v,gap:v-cur,w:k};
  }).sort((a,b)=>b.gap-a.gap);
}

document.addEventListener("click",e=>{
  const t=e.target.closest("[data-drill],[data-career],[data-story]");
  if(!t)return;
  const d=t.dataset.drill,c=t.dataset.career,s=t.dataset.story;
  if(d){
    if(d==="check"){const i=document.getElementById("drin");drCheck(i?i.value:"");return}
    if(d==="next"){drNext();return}
    if(d==="stop"){finishDrill();return}
    if(d==="again"){startDrill(DRL.mode,DRL.w);return}
    if(d.startsWith("world:")){startDrill("world",d.split(":")[1]);return}
    startDrill(d);return;
  }
  if(s){
    const [id,i]=s.split(":");const sc=STORY.find(x=>x.id===id);
    S.storySeen=(S.storySeen||[]).concat([id]);
    S.storyPick=S.storyPick||{};S.storyPick[id]=sc.ch[+i].e;
    addXP(40);checkDay();save();
    toast(sc.ch[+i].e);
    render();return;
  }
  if(c){
    if(c.startsWith("apply:")){startInterview(c.split(":")[1]);return}
    if(c.startsWith("retry:")){startInterview(c.split(":")[1]);return}
    if(c==="ivgo"){IV.phase="q";IV.i=0;IV.ans=null;IV.checked=false;drawIV();return}
    if(c.startsWith("ivopt:")){if(IV.checked)return;IV.ans=+c.split(":")[1];drawIV();return}
    if(c==="ivcheck"){IV.checked=true;if(IV.ans===IV.items[IV.i].c)IV.ok++;
      srsUpdate(IV.items[IV.i].q,IV.ans===IV.items[IV.i].c,IV.items[IV.i]);save();drawIV();return}
    if(c==="ivnext"){if(IV.i<IV.items.length-1){IV.i++;IV.ans=null;IV.checked=false;drawIV()}else ivFinish();return}
    if(c==="ivlab"){const id=IV.j.lab;IV.pendingLab=id;startLab(id);return}
    if(c.startsWith("accept:")){acceptOffer(c.split(":")[1]);return}
    if(c.startsWith("goworld:")){S.openWorld=c.split(":")[1];go("map");return}
  }
});
document.addEventListener("keydown",e=>{

      <span class="mv">${R.checked?"":`<button data-mv="${i}:-1" aria-label="выше">▲</button><button data-mv="${i}:1" aria-label="ниже">▼</button>`}</span></div>`}).join("")}</div>`;
  }
  const hp=R.mode==="boss"?`<div class="hp">${[0,1,2].map(i=>`<i class="${i<R.hp?"":"off"}"></i>`).join("")}</div>`:"";
  return `<div class="runner">
   <div class="prog"><i style="width:${n/tot*100}%"></i></div>
   <div class="row" style="margin-bottom:14px">
     <span class="lbl">${R.mode==="rep"?"Ремонт памяти":(R.w?R.w.n+" · ":"")+R.m.t}</span>
     <span style="margin-left:auto">${hp}</span><span class="lbl">${R.idx+1}/${R.items.length}</span></div>
   <div class="qbox card pad"><h2>${it.q}</h2>
     <div class="qmeta lbl">${it.d?`<span style="color:${DIFFC[it.d]}">${"◆".repeat(it.d)}${"◇".repeat(5-it.d)} ${DIFF[it.d]}</span> · `:""}${{q:"выбери ответ",c:"введи команду",f:"заполни пропуск",o:"расставь по порядку"}[it.t]}</div>
     ${body}
     ${R.checked?`<div class="fb ${R.ok?"ok":"no"}"><b>${R.ok?"Верно":"Мимо"}</b>${it.why}${!R.ok&&(it.t==="c"||it.t==="f")?`<div class="mono" style="margin-top:8px;color:var(--ok)">Правильно: ${esc(it.ans[0])}</div>`:""}</div>`:""}
     <div class="row" style="margin-top:18px">
       ${R.checked?`<button class="btn" data-nav="next">${R.idx<R.items.length-1?"Следующее →":"Завершить"}</button>`
                  :`<button class="btn" data-nav="check" ${it.t==="q"&&R.ans===null?"disabled":""}>Проверить</button>`}
       <button class="btn ghost" data-nav="quit" style="margin-left:auto">Выйти</button></div></div></div>`;
}
function uiRes(){
  const tot=R.items.length,right=tot-R.wrong,pct=Math.round(right/tot*100),win=R.mode!=="boss"||R.hp>0;
  let extra="";
  if(R.done!==true){
    R.done=true;let xp=0;
    if(R.mode==="mis"){xp=right*12;if(!S.mis[R.m.id]){S.mis[R.m.id]=1;award("first");questTick("mission",1)}if(R.wrong===0)award("flawless")}
    else if(R.mode==="boss"&&win){xp=120;S.boss[R.w.id]=1;award(R.w.id);
      if(R.w.id==="cloudsec"){award("hired");extra=`<p style="max-width:56ch;margin:12px auto 0" class="muted">Финальный раунд пройден. Собери пет-проект из блока 10 плана, отрепетируй ответы вслух — и иди на настоящие собеседования.</p>`}}
    else if(R.mode==="rep"){xp=right*8;S.repairs+=right;if(S.repairs>=20)award("repair");questTick("repair",1)}
    R.xp=xp; if(xp){addXP(xp);checkDay()} save();
  }
  return `<div class="runner"><div class="card res">
    <div class="lbl">${R.mode==="boss"?(win?"босс повержен":"поражение"):"итог"}</div>
    <div class="big ${pct>=70?"ok":"no"}">${pct}%</div>
    <p class="muted" style="margin:6px 0 4px">${right} из ${tot} верно${R.mode==="boss"&&!win?" · жизни кончились":""}</p>
    <p class="xpfly">+${R.xp||0} XP</p>
    ${R.wrong?`<p class="muted" style="max-width:52ch;margin:12px auto 0;font-size:14px">Промахи отправлены в «Повторы» — вернутся завтра, пока не станут рефлексом.</p>`:`<p style="color:var(--ok);margin-top:10px">Чисто. Так и держи.</p>`}
    ${extra}
    <div class="row" style="justify-content:center;margin-top:22px">
      <button class="btn" data-nav="map">К карте</button>
      ${R.mode==="boss"&&!win?`<button class="btn ghost" data-nav="retry">Повторить бой</button>`:""}
      ${R.mode==="mis"?`<button class="btn ghost" data-nav="again">Задания снова</button>`:""}
    </div></div></div>`;
}
const norm=s=>String(s||"").toLowerCase().replace(/["']/g,"").replace(/\s+/g," ").trim();
function checkAnswer(){
  const it=R.items[R.idx];
  if(it.t==="q")R.ok=R.ans===it.c;
  else if(it.t==="c"||it.t==="f"){const el=document.getElementById("cin");R.ans=el?el.value:"";
    const u=norm(R.ans);R.ok=it.ans.some(a=>norm(a)===u);}
  else if(it.t==="o")R.ok=R.ord.every((x,i)=>x===it.items[i]);
  R.checked=true;
  if(!R.ok){R.wrong++;if(R.mode==="boss")R.hp--}
  srsUpdate(it.q,R.ok,it);save();drawRunner();
}
function nextItem(){
  if(R.mode==="boss"&&R.hp<=0){R.phase="res";drawRunner();return}
  if(R.idx<R.items.length-1){R.idx++;R.ans=null;R.checked=false;R.ok=false;
    const it=R.items[R.idx];if(it.t==="o")R.ord=shuffle(it.items.slice());}
  else R.phase="res";
  drawRunner();
}
function toQuestions(){
  R.phase="q";R.idx=0;R.ans=null;R.checked=false;
  const it=R.items[0];if(it.t==="o")R.ord=shuffle(it.items.slice());
  drawRunner();
}
/* ================= ЛАБОРАТОРИЯ ================= */
function startLab(id){
  const def=LABS[id];
  L={id,def,ctx:mkCtx(def.spec),out:[],hist:[],hi:-1,hints:0,done:false,started:Date.now()};
  L.out.push({h:`{{d|Подключение к ${L.ctx.host}...  соединение установлено.}}`});
  L.out.push({h:`{{d|Введи }}help{{d| — список доступных команд. Задачи справа обновляются сами.}}`});
  if(def.after)def.after(L.ctx);
  drawLab();
}
function labTaskState(){return L.def.tasks.map(t=>{try{return !!t.ok(L.ctx)}catch(e){return false}})}
function drawLab(){
  document.getElementById("tabs").innerHTML="";
  const st=labTaskState(),alldone=st.every(Boolean);
  if(alldone&&!L.done){
    L.done=true;
    if(!S.labs[L.id]){S.labs[L.id]=1;award("lab1");
      const n=Object.keys(S.labs).length; if(n>=5)award("lab5"); if(n>=Object.keys(LABS).length)award("laball");
      if(L.hints===0)award("nohint");
      addXP(L.def.xp);checkDay();questTick("lab",1);
      if(IV&&IV.pendingLab===L.id)toast("Тестовое задание зачтено — возвращайся к вакансии");}
    save();
  }
  const v=document.getElementById("view");
  v.innerHTML=`<div class="row" style="margin-bottom:12px"><span class="lbl">лаборатория · ${WORLDS.find(w=>w.id===L.def.w).n}</span>
    <button class="btn ghost sm" data-nav="quit" style="margin-left:auto">Выйти</button>
    <button class="btn ghost sm" data-lab="reset">Сбросить сценарий</button></div>
  <div class="card pad" style="margin-bottom:14px;border-left:3px solid var(--amber)">
    <h1 style="font-size:22px;margin-bottom:6px">${L.def.t}</h1><p style="margin:0" class="muted">${L.def.brief}</p></div>
  <div class="lab">
    <div class="cli"><div class="bar"><i></i><i></i><i></i><span style="margin-left:8px">${L.ctx.user}@${L.ctx.host}</span></div>
      <div class="out" id="cliout">${L.out.map(o=>fmt(o.h)).join("\n")}</div>
      <div class="line"><span>${L.ctx.user}@${L.ctx.host}:${L.ctx.cwd.replace("/home/"+L.ctx.user,"~")}$</span>
        <input id="cliin" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="команда…"></div></div>
    <div>
      <div class="lbl" style="margin-bottom:9px">задачи · ${st.filter(Boolean).length}/${st.length}</div>
      <div class="tasks">${L.def.tasks.map((t,i)=>`<div class="tk ${st[i]?"on":""}"><span class="bx">${st[i]?"✓":""}</span>
        <span>${t.t}${L.showHint===i?`<small>подсказка: ${t.hint}</small>`:""}</span></div>`).join("")}</div>
      <div class="card pad" style="margin-top:12px">
        <div class="lbl">если застрял</div>
        <p class="muted" style="font-size:13px;margin:8px 0 10px">${L.def.hint}</p>
        <button class="btn ghost sm" data-lab="hint">Показать подсказку к текущему шагу</button>
        <p class="muted" style="font-size:12px;margin:10px 0 0">Подсказок использовано: ${L.hints}</p>
      </div>
      <div class="card pad" style="margin-top:12px">
        <div class="lbl">шпаргалка</div>
        <p class="muted" style="font-size:12.5px;margin:8px 0 0">
        <span class="kbd">↑</span> <span class="kbd">↓</span> — история команд · <span class="kbd">help</span> — список команд · поддерживаются пайпы <span class="kbd">|</span> и редирект <span class="kbd">&gt;</span></p>
      </div>
    </div></div>
  ${L.done?`<div class="card pad" style="margin-top:16px;border-color:rgba(63,191,143,.5);background:rgba(63,191,143,.06)">
     <div class="lbl" style="color:var(--ok)">инцидент закрыт · +${L.def.xp} xp</div>
     <h2 style="font-size:20px;margin:6px 0 10px">Разбор полётов</h2>${L.def.debrief}
     <div class="row" style="margin-top:14px"><button class="btn" data-nav="map">К карте</button>
     <button class="btn ghost" data-lab="reset">Пройти заново</button></div></div>`:""}`;
  const inp=document.getElementById("cliin");
  if(inp&&!L.done)inp.focus();
  const out=document.getElementById("cliout");
  if(out)out.scrollTop=out.scrollHeight;
}
function labExec(line){
  if(!line.trim())return;
  L.out.push({h:`{{p|${L.ctx.user}@${L.ctx.host}:${L.ctx.cwd.replace("/home/"+L.ctx.user,"~")}$}} ${line}`});
  L.hist.push(line);L.hi=L.hist.length;
  let res="";
  try{res=runLine(L.ctx,line)}catch(e){res="{{e|ошибка выполнения: "+e.message+"}}"}
  if(L.ctx.flags._clear){L.ctx.flags._clear=false;L.out=[]}
  else if(res!==""&&res!==undefined)L.out.push({h:res});
  if(L.def.after)try{L.def.after(L.ctx)}catch(e){}
  drawLab();
}
/* ================= ПЕСОЧНИЦА ================= */
let SB=null;
function viewSandbox(){
  return `<section class="card pad" style="margin-bottom:16px">
    <div class="lbl">свободный режим</div><h1 style="font-size:26px;margin:4px 0 8px">Песочница</h1>
    <p class="muted" style="max-width:66ch;margin:0">Живой сервер без заданий: nginx, приложение на 8080, postgres, пара контейнеров и мини-кластер. Ломай, изучай, пробуй команды из миссий. Ничего не сохраняется — обновил страницу, всё как было.</p></section>
  <div class="lab"><div class="cli"><div class="bar"><i></i><i></i><i></i><span style="margin-left:8px">deploy@sandbox</span></div>
    <div class="out" id="sbout"></div>
    <div class="line"><span id="sbp">deploy@sandbox:~$</span><input id="sbin" autocomplete="off" spellcheck="false" placeholder="попробуй: ls -la /var/log"></div></div>
    <div><div class="card pad"><div class="lbl">попробуй</div>
      <ul class="tight" style="margin-top:9px">
      <li><code>ls -la /var/log/nginx</code></li><li><code>cat /var/log/nginx/access.log | grep 500</code></li>
      <li><code>ps aux | grep nginx</code></li><li><code>systemctl status app</code></li>
      <li><code>journalctl -u app</code></li><li><code>ss -tulpn</code></li>
      <li><code>df -h</code> · <code>du -sh /var/*</code></li><li><code>docker ps -a</code></li>
      <li><code>kubectl get pods</code></li><li><code>curl -i localhost:8080</code></li>
      <li><code>dig shop.ru +short</code></li><li><code>grep -c ERROR /var/log/app/app.log</code></li></ul></div>
      <div class="card pad" style="margin-top:12px"><div class="lbl">заметка</div>
      <p class="muted" style="font-size:13px;margin:8px 0 0">Симулятор понимает основные флаги, пайпы и редирект. Он не полный bash — но покрывает всё, что спрашивают на собеседовании уровня middle.</p></div></div></div>`;
}
function initSandbox(){
  SB={ctx:mkCtx(SANDBOX),out:[{h:"{{d|Песочница. Введи }}help{{d| для списка команд.}}"}],hist:[],hi:-1};
  paintSB();
  const inp=document.getElementById("sbin");if(inp)inp.focus();
}
function paintSB(){
  const o=document.getElementById("sbout");if(!o)return;
  o.innerHTML=SB.out.map(x=>fmt(x.h)).join("\n");o.scrollTop=o.scrollHeight;
  const p=document.getElementById("sbp");if(p)p.textContent=`deploy@sandbox:${SB.ctx.cwd.replace("/home/deploy","~")}$`;
}
function sbExec(line){
  if(!line.trim())return;
  SB.out.push({h:`{{p|deploy@sandbox:${SB.ctx.cwd.replace("/home/deploy","~")}$}} ${line}`});
  SB.hist.push(line);SB.hi=SB.hist.length;
  let res="";try{res=runLine(SB.ctx,line)}catch(e){res="{{e|"+e.message+"}}"}
  if(SB.ctx.flags._clear){SB.ctx.flags._clear=false;SB.out=[]}
  else if(res!=="")SB.out.push({h:res});
  paintSB();
}
/* ================= СОБЫТИЯ ================= */
document.addEventListener("click",e=>{
  const t=e.target.closest("[data-tab],[data-go],[data-world],[data-act],[data-nav],[data-opt],[data-mv],[data-lab]");
  if(!t)return;
  if(t.dataset.tab){go(t.dataset.tab);return}
  if(t.dataset.go){go(t.dataset.go);return}
  if(t.dataset.lab){
    if(t.dataset.lab==="reset"){startLab(L.id);return}
    if(t.dataset.lab==="hint"){const st=labTaskState();const i=st.findIndex(x=>!x);
      if(i<0){toast("Все шаги уже закрыты");return}
      L.showHint=i;L.hints++;S.hintsUsed=(S.hintsUsed||0)+1;save();drawLab();return}
  }
  if(t.dataset.mv){const[i,d]=t.dataset.mv.split(":").map(Number);const j=i+d;
    if(j<0||j>=R.ord.length)return;[R.ord[i],R.ord[j]]=[R.ord[j],R.ord[i]];drawRunner();return}
  if(t.dataset.opt!==undefined){if(R.checked)return;R.ans=+t.dataset.opt;drawRunner();return}
  const a=t.dataset.act;
  if(a==="mis"){startMission(t.dataset.w,t.dataset.m);return}
  if(a==="boss"){startBoss(t.dataset.w);return}
  if(a==="lab"){startLab(t.dataset.l);return}
  if(a==="repair"){startRepair();return}
  if(a==="export"){navigator.clipboard.writeText(JSON.stringify(S)).then(()=>toast("Сохранение скопировано"),()=>toast("Не удалось скопировать"));return}
  if(a==="import"){const s=prompt("Вставь строку сохранения:");if(!s)return;
    try{S=Object.assign(defState(),JSON.parse(s));save();render();toast("Прогресс восстановлен")}catch(err){toast("Строка повреждена")}return}
  if(a==="reset"){if(confirm("Удалить весь прогресс без возможности вернуть?")){S=defState();save();render()}return}
  if(t.dataset.world){S.openWorld=S.openWorld===t.dataset.world?null:t.dataset.world;save();render();return}
  const n=t.dataset.nav;
  if(n==="back"){R.ci--;drawRunner()}
  else if(n==="fwd"){if(R.phase==="intro")toQuestions();else if(R.ci<R.cards.length-1){R.ci++;drawRunner()}else toQuestions()}
  else if(n==="check")checkAnswer();
  else if(n==="next")nextItem();
  else if(n==="quit"||n==="map"){go("map")}
  else if(n==="retry")startBoss(R.w.id);
  else if(n==="again"){if(!R.items.some(x=>x.d))R.items=shuffle(R.items);R.idx=0;R.wrong=0;R.done=false;R.phase="q";R.ans=null;R.checked=false;
    const it=R.items[0];if(it.t==="o")R.ord=shuffle(it.items.slice());drawRunner()}
});
document.addEventListener("keydown",e=>{
  const cli=document.getElementById("cliin"),sb=document.getElementById("sbin");
  if(L&&cli&&document.activeElement===cli){
    if(e.key==="Enter"){e.preventDefault();const v=cli.value;cli.value="";labExec(v);return}
    if(e.key==="ArrowUp"){e.preventDefault();if(L.hi>0){L.hi--;cli.value=L.hist[L.hi]||""}return}
    if(e.key==="ArrowDown"){e.preventDefault();if(L.hi<L.hist.length-1){L.hi++;cli.value=L.hist[L.hi]||""}else{L.hi=L.hist.length;cli.value=""}return}
    return;
  }
  if(SB&&sb&&document.activeElement===sb){
    if(e.key==="Enter"){e.preventDefault();const v=sb.value;sb.value="";sbExec(v);return}
    if(e.key==="ArrowUp"){e.preventDefault();if(SB.hi>0){SB.hi--;sb.value=SB.hist[SB.hi]||""}return}
    if(e.key==="ArrowDown"){e.preventDefault();if(SB.hi<SB.hist.length-1){SB.hi++;sb.value=SB.hist[SB.hi]||""}else{SB.hi=SB.hist.length;sb.value=""}return}
    return;
  }
  if(!R||R.phase!=="q")return;
  const it=R.items[R.idx];
  if(e.key==="Enter"){e.preventDefault();R.checked?nextItem():((it.t!=="q"||R.ans!==null)&&checkAnswer());return}
  if(it.t==="q"&&!R.checked&&/^[1-9]$/.test(e.key)){const i=+e.key-1;if(i<it.a.length){R.ans=i;drawRunner()}}
});
checkDay();render();
</script>
