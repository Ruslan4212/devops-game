{id:"l9",t:"Текстовые потоки: перенаправление, sed, awk",goal:"Обрабатывать логи и вывод, не открывая редактор",
 cards:[
 {h:"Потоки и перенаправление",b:"<p>У каждого процесса три потока: <b>0</b> stdin, <b>1</b> stdout, <b>2</b> stderr.</p><pre>cmd &gt; out.log            <span class='c'># stdout в файл (перезапись)</span>\ncmd &gt;&gt; out.log           <span class='c'># дописать</span>\ncmd 2&gt; err.log           <span class='c'># только ошибки</span>\ncmd &gt; all.log 2&gt;&amp;1       <span class='c'># и то, и другое в один файл</span>\ncmd 2&gt;/dev/null          <span class='c'># выбросить ошибки</span>\ncmd &lt; input.txt          <span class='c'># подать файл на вход</span></pre><p><b>Порядок важен:</b> <code>2&gt;&amp;1 &gt; file</code> и <code>&gt; file 2&gt;&amp;1</code> — разные вещи. Правильный вариант — второй: сначала перенаправить stdout, потом привязать stderr туда же.</p>"},
 {h:"sed — потоковый редактор",b:"<pre>sed 's/old/new/' f        <span class='c'># первое вхождение в строке</span>\nsed 's/old/new/g' f       <span class='c'># все вхождения</span>\nsed -i.bak 's/8080/3000/g' app.conf   <span class='c'># на месте, с бэкапом</span>\nsed -n '10,20p' f         <span class='c'># только строки 10-20</span>\nsed '/^#/d' f             <span class='c'># удалить комментарии</span></pre><p><code>-i</code> без бэкапа на проде — способ узнать, что такое паника. Сначала прогони без <code>-i</code> и посмотри вывод.</p>"},
 {h:"awk — по колонкам",b:"<pre>awk '{print $1}' access.log            <span class='c'># первая колонка (IP)</span>\nawk '$9 == 500 {print $7}' access.log  <span class='c'># URL с кодом 500</span>\nawk '{sum+=$10} END {print sum}' f     <span class='c'># сумма колонки</span>\n\n<span class='c'># топ-10 IP по числу запросов</span>\nawk '{print $1}' access.log | sort | uniq -c | sort -rn | head\n</pre><p>Последняя строка — самый используемый однострочник в жизни админа. Разбери его на части, и половина работы с логами станет тривиальной.</p>"}],
 ch:[
 {t:"c",q:"Записать и обычный вывод, и ошибки команды ./deploy.sh в файл deploy.log.",ans:["./deploy.sh > deploy.log 2>&1","./deploy.sh >deploy.log 2>&1","./deploy.sh &> deploy.log"],hint:"> файл, затем 2>&1",why:"Порядок обязателен: 2>&1 копирует текущее назначение stdout. Поставишь раньше — ошибки уйдут в терминал."},
 {t:"q",q:"Что делает <code>awk '{print $1}' access.log | sort | uniq -c | sort -rn | head</code>?",a:["Сортирует лог","Показывает 10 самых активных IP-адресов","Удаляет дубликаты строк","Считает размер файла"],c:1,why:"Взять колонку → отсортировать → посчитать повторы (uniq -c работает только по соседним строкам!) → отсортировать по числу → верхушка."},
 {t:"c",q:"Заменить во всём файле app.conf порт 8080 на 3000 прямо в файле.",ans:["sed -i s/8080/3000/g app.conf","sed -i 's/8080/3000/g' app.conf","sed -i.bak 's/8080/3000/g' app.conf"],hint:"sed -i 's/…/…/g' файл",why:"Без /g заменится только первое вхождение в каждой строке. Привыкай к -i.bak — бэкап бесплатный."},
 {t:"q",q:"Зачем перед <code>uniq -c</code> почти всегда ставят <code>sort</code>?",a:["Для красоты","uniq схлопывает только соседние одинаковые строки","sort ускоряет uniq","Так требует POSIX"],c:1,why:"Забыл sort — получил неверные счётчики и не заметил. Одна из самых частых ошибок в однострочниках."},
 {t:"q",q:"<code>cmd 2>/dev/null</code> — что произойдёт?",a:["Команда не выполнится","Сообщения об ошибках будут отброшены, обычный вывод останется","Всё уйдёт в никуда","Ошибки попадут в файл null"],c:1,why:"Полезно, когда find шумит про «Permission denied». Опасно, когда так глушат настоящие ошибки в скриптах."}]},
{id:"l10",t:"Ссылки, архивы, специальные права",goal:"Разобраться в том, что выглядит магией",
 cards:[
 {h:"Hard link и symlink",b:"<pre>ln файл жёсткая_ссылка      <span class='c'># hard link</span>\nln -s /opt/app/current /opt/app/live   <span class='c'># symlink</span></pre><ul><li><b>Hard link</b> — второе имя того же inode. Удалил оригинал — данные живы. Только в пределах одной ФС, не работает для каталогов.</li><li><b>Symlink</b> — указатель на путь. Удалил цель — ссылка «повисла» (broken).</li></ul><p>Symlink — основа схемы деплоя: каталоги <code>releases/2025-02-12/</code>, а <code>current</code> — симлинк на нужный. Переключение релиза и откат = замена ссылки, атомарно и мгновенно.</p>"},
 {h:"tar и сжатие",b:"<pre>tar czf backup.tar.gz /var/www    <span class='c'># создать (c) gzip (z) файл (f)</span>\ntar xzf backup.tar.gz -C /restore <span class='c'># распаковать в каталог</span>\ntar tzf backup.tar.gz | head      <span class='c'># посмотреть содержимое, не распаковывая</span></pre><p>Мнемоника: <b>c</b>reate, e<b>x</b>tract, lis<b>t</b>. Всегда сначала <code>t</code> — посмотреть, что внутри, чтобы архив не разъехался по текущему каталогу.</p>"},
 {h:"Специальные биты",b:"<ul><li><b>SUID</b> (4xxx) — программа выполняется от имени владельца файла. Так работает <code>passwd</code>: обычный пользователь меняет /etc/shadow.</li><li><b>SGID</b> (2xxx) — на каталоге: новые файлы наследуют группу каталога. Удобно для общих папок команды.</li><li><b>Sticky bit</b> (1xxx) — в общем каталоге удалять файл может только его владелец. Именно так устроен <code>/tmp</code> (<code>drwxrwxrwt</code>).</li></ul><p>Поиск SUID-файлов — обязательный пункт аудита: <code>find / -perm -4000 -type f 2&gt;/dev/null</code>.</p>"}],
 ch:[
 {t:"q",q:"Удалили файл, на который указывал symlink. Что стало со ссылкой?",a:["Удалилась тоже","Осталась, но стала битой — указывает в никуда","Данные сохранились в ссылке","Ничего не изменилось"],c:1,why:"Hard link в этой ситуации сохранил бы данные: он ссылается на inode, а не на путь."},
 {t:"c",q:"Создай символическую ссылку /opt/app/current на каталог /opt/app/releases/v2.",ans:["ln -s /opt/app/releases/v2 /opt/app/current"],hint:"ln -s цель имя_ссылки",why:"Порядок аргументов: сначала куда указываем, потом имя ссылки. Перепутал — получил ссылку не там."},
 {t:"q",q:"Почему <code>/tmp</code> имеет права <code>drwxrwxrwt</code>?",a:["Опечатка","Sticky bit: писать могут все, но удалять — только владелец своего файла","Только чтение","Каталог сломан"],c:1,why:"Без sticky bit любой пользователь удалял бы чужие временные файлы. Буква t на месте x у «остальных»."},
 {t:"c",q:"Посмотри содержимое архива backup.tar.gz, не распаковывая его.",ans:["tar tzf backup.tar.gz","tar -tzf backup.tar.gz","tar tf backup.tar.gz"],hint:"t = list",why:"Проверка перед распаковкой: увидишь, лежат ли файлы в подкаталоге или разлетятся по текущему."},
 {t:"q",q:"Зачем при аудите ищут файлы с битом SUID?",a:["Они занимают место","Такая программа выполняется с правами владельца — часто root, и это вектор повышения привилегий","Они не удаляются","Они замедляют систему"],c:1,why:"Уязвимость в SUID-бинаре = локальный root. Список должен быть коротким и понятным."}]},
{id:"l11",t:"Процессы вглубь: сигналы, приоритеты, нагрузка",goal:"Читать состояние системы, а не гадать",
 cards:[
 {h:"Load average — три числа",b:"<pre>uptime\n load average: 2.31, 1.84, 1.02\n                 1м    5м    15м</pre><p>Это среднее число процессов, готовых выполняться или ждущих диск. Сравнивать надо <b>с количеством ядер</b>: LA 4.0 на 4 ядрах — полная загрузка, на 1 ядре — перегрузка вчетверо.</p><p>Растёт первое число и падают остальные — нагрузка только началась. Наоборот — уже спадает. Высокий LA при низком CPU — почти всегда ожидание диска или сети (столбец <code>wa</code> в top).</p>"},
 {h:"Состояния и сигналы",b:"<p>Состояния в <code>ps</code>: <b>R</b> выполняется, <b>S</b> спит (ждёт события), <b>D</b> непрерываемый сон (ждёт диск — такой процесс не убивается даже <code>-9</code>), <b>Z</b> зомби (завершился, родитель не забрал код), <b>T</b> остановлен.</p><pre>kill -15 PID   <span class='c'># SIGTERM — попросить завершиться (по умолчанию)</span>\nkill -9  PID   <span class='c'># SIGKILL — нельзя перехватить</span>\nkill -1  PID   <span class='c'># SIGHUP — часто «перечитай конфиг»</span>\nkill -2  PID   <span class='c'># SIGINT — то же, что Ctrl+C</span></pre>"},
 {h:"Приоритеты и лимиты",b:"<pre>nice -n 10 ./heavy.sh     <span class='c'># запустить с пониженным приоритетом</span>\nrenice -n 5 -p 1234       <span class='c'># изменить у работающего</span>\nulimit -n                 <span class='c'># лимит открытых файлов</span></pre><p><b>nice</b>: от -20 (самый приоритетный, только root) до 19 (самый уступчивый).</p><p><b>cgroups</b> — то, чем ядро ограничивает группы процессов по CPU и памяти. На них построены и <code>systemd</code> (<code>MemoryMax=</code> в юните), и контейнеры. Когда ты ставишь limits в Kubernetes — ты в итоге настраиваешь cgroups.</p>"}],
 ch:[
 {t:"q",q:"Load average 8.0 на 8-ядерном сервере. Это проблема?",a:["Да, критично","Нет, это примерно полная загрузка — смотри тренд и время ответа сервиса","Всегда норма","Нужен ребут"],c:1,why:"LA сам по себе не диагноз. Сравнивай с числом ядер и смотри, страдает ли латентность."},
 {t:"q",q:"Процесс в состоянии D не убивается даже <code>kill -9</code>. Почему?",a:["Баг ядра","Непрерываемый сон: ждёт ответа от диска или сети (часто зависший NFS)","Он защищён","Нет прав"],c:1,why:"Лечится устранением причины ввода-вывода. Массовые D-процессы — признак умирающего диска или отвалившегося сетевого хранилища."},
 {t:"q",q:"Что такое зомби-процесс?",a:["Вирус","Завершившийся процесс, чей код возврата не забрал родитель","Процесс без владельца","Зависший процесс"],c:1,why:"Сам по себе ресурсов почти не ест, но толпа зомби = сломанный родитель. В контейнерах решается процессом-init (tini, --init)."},
 {t:"c",q:"Отправь процессу 4210 сигнал «перечитать конфигурацию».",ans:["kill -1 4210","kill -hup 4210","kill -sighup 4210","kill -s hup 4210"],hint:"номер 1 или HUP",why:"Многие демоны (nginx, sshd) по SIGHUP перечитывают конфиг без перезапуска и разрыва соединений."},
 {t:"q",q:"Чем ядро ограничивает память контейнера?",a:["Виртуализацией","cgroups","Файрволом","nice"],c:1,why:"cgroups + namespaces = контейнер. Limits в Kubernetes в конечном счёте превращаются именно в cgroup-лимиты."}]},
{id:"l12",t:"Диски, монтирование, LVM",goal:"Добавить место, не уронив сервер",
 cards:[
 {h:"Что где лежит",b:"<pre>lsblk                <span class='c'># дерево дисков и разделов</span>\ndf -h                <span class='c'># занятость смонтированных ФС</span>\ndf -i                <span class='c'># занятость inode (!)</span>\nblkid                <span class='c'># UUID разделов</span>\nmount /dev/sdb1 /mnt\numount /mnt</pre><p><b>Коварный случай:</b> <code>df -h</code> показывает свободное место, но система пишет «No space left on device». Смотри <code>df -i</code> — кончились inode: миллионы мелких файлов (сессии, кэш, письма).</p>"},
 {h:"fstab и постоянное монтирование",b:"<pre># /etc/fstab\nUUID=9f2c-1ab4  /data  ext4  defaults,noatime  0 2</pre><p>Монтируй по <b>UUID</b>, а не по <code>/dev/sdb1</code>: имена устройств меняются при перезагрузке или добавлении диска.</p><p><b>Правило выживания:</b> после правки fstab обязательно <code>mount -a</code> — если строка ошибочна, ты увидишь это сейчас, а не при следующей загрузке, когда сервер уйдёт в аварийный режим и перестанет пускать по SSH.</p>"},
 {h:"LVM — место без перезагрузки",b:"<pre>pvcreate /dev/sdc          <span class='c'># физический том</span>\nvgextend vg0 /dev/sdc      <span class='c'># добавить в группу</span>\nlvextend -L +50G /dev/vg0/data\nresize2fs /dev/vg0/data    <span class='c'># растянуть саму ФС</span></pre><p>Два шага: сначала растёт логический том, потом файловая система. Забыл второй — место «добавилось», а <code>df</code> его не видит.</p><p>Бонус LVM — снапшоты: мгновенный снимок перед рискованным обновлением, откат за секунды.</p>"}],
 ch:[
 {t:"q",q:"<code>df -h</code> показывает 40% занято, но приложение пишет «No space left on device». Что проверишь?",a:["Права доступа","df -i — свободные inode","Оперативную память","Сеть"],c:1,why:"Inode кончаются раньше байтов, когда файлов миллионы. Лечится чисткой мелочи или пересозданием ФС с другими параметрами."},
 {t:"q",q:"Почему в /etc/fstab пишут UUID вместо /dev/sdb1?",a:["Короче","Имена устройств могут поменяться при перезагрузке — сервер не загрузится","Быстрее монтируется","Требование ext4"],c:1,why:"Добавили диск — порядок перечисления сместился. UUID привязан к самой файловой системе."},
 {t:"c",q:"Проверь, что все записи в /etc/fstab корректны и монтируются прямо сейчас.",ans:["mount -a","sudo mount -a"],hint:"mount + флаг all",why:"Единственная защита от «сервер не поднялся после ребута из-за одной строки в fstab»."},
 {t:"q",q:"Расширили логический том LVM на 50 ГБ, но <code>df -h</code> показывает старый размер. Что забыли?",a:["Перезагрузиться","Расширить файловую систему: resize2fs (ext4) или xfs_growfs (xfs)","Пересоздать раздел","Смонтировать заново"],c:1,why:"LVM и файловая система — два независимых слоя. Оба надо растянуть."},
 {t:"q",q:"Главное преимущество LVM для сервера?",a:["Скорость","Можно расширять тома и делать снапшоты без остановки системы","Экономия места","Шифрование"],c:1,why:"Плюс снапшот перед миграцией БД или обновлением — это откат за секунды вместо восстановления из бэкапа за часы."}]},
{id:"l13",t:"Логи системы и ротация",goal:"Не утонуть в логах и не потерять нужное",
 cards:[
 {h:"journald и rsyslog",b:"<pre>journalctl -u nginx --since \"1 hour ago\"\njournalctl -p err -b            <span class='c'># только ошибки текущей загрузки</span>\njournalctl -f                   <span class='c'># живой поток</span>\njournalctl --disk-usage\njournalctl --vacuum-time=7d     <span class='c'># почистить старое</span></pre><p><b>journald</b> — бинарный журнал systemd (фильтры по юниту, приоритету, времени). <b>rsyslog</b> — классические текстовые файлы в <code>/var/log</code> и пересылка логов на удалённый сервер. На современных серверах живут оба.</p>"},
 {h:"logrotate",b:"<pre># /etc/logrotate.d/myapp\n/var/log/myapp/*.log {\n  daily\n  rotate 14\n  size 100M\n  compress\n  delaycompress\n  missingok\n  notifempty\n  copytruncate\n}</pre><p><code>copytruncate</code> нужен приложениям, которые не умеют переоткрывать файл по сигналу — иначе после ротации они продолжат писать в удалённый файл, и место не освободится (ровно та ловушка из лаборатории про диск).</p><pre>logrotate -d /etc/logrotate.d/myapp   <span class='c'># сухой прогон</span></pre>"},
 {h:"Уровни логирования",b:"<p>emerg, alert, crit, err, warning, notice, info, debug. На проде обычно <code>info</code>, в отладке — <code>debug</code>, но <b>никогда не оставляй debug включённым надолго</b>: он и диск съест, и секреты в лог напишет.</p>"}],
 ch:[
 {t:"c",q:"Покажи только ошибки из журнала за текущую загрузку системы.",ans:["journalctl -p err -b","journalctl -b -p err","journalctl -p 3 -b"],hint:"-p приоритет, -b текущая загрузка",why:"Быстрый способ увидеть, что вообще сломано, не читая мегабайты info-сообщений."},
 {t:"q",q:"Зачем в logrotate опция <code>copytruncate</code>?",a:["Ускоряет ротацию","Для приложений, не умеющих переоткрывать лог: файл копируется и обнуляется на месте","Сжимает лучше","Удаляет старые логи"],c:1,why:"Иначе процесс продолжит писать в удалённый inode: df покажет полный диск, du — ничего не найдёт."},
 {t:"q",q:"Журнал journald занял 8 ГБ. Как ограничить?",a:["Удалить /var/log","journalctl --vacuum-time / --vacuum-size и SystemMaxUse в journald.conf","Отключить логи","Перезагрузиться"],c:1,why:"Настраивать надо заранее: SystemMaxUse=1G в /etc/systemd/journald.conf — и проблема не возникнет."},
 {t:"q",q:"На проде оставили уровень debug. Чем это плохо, кроме объёма?",a:["Ничем","В debug часто попадают тела запросов, токены и персональные данные — это утечка","Замедляет диск","Ломает ротацию"],c:1,why:"Лог с секретами приравнивается к утечке секретов: его читают шире, чем прод-базу, и он уезжает во внешние системы."}]},
{id:"l14",t:"Сеть изнутри: маршруты, диагностика, передача файлов",goal:"Понять, докуда доходит пакет",
 cards:[
 {h:"Адреса и маршруты",b:"<pre>ip a                  <span class='c'># адреса интерфейсов</span>\nip r                  <span class='c'># таблица маршрутизации</span>\nip r get 8.8.8.8      <span class='c'># каким маршрутом пойдёт пакет</span>\nresolvectl status     <span class='c'># какие DNS используются</span>\ncat /etc/resolv.conf</pre><p><code>ifconfig</code> и <code>netstat</code> — устаревшие, их место заняли <code>ip</code> и <code>ss</code>. На собеседовании упоминание современных команд — маленький, но заметный плюс.</p>"},
 {h:"Диагностика по слоям",b:"<pre>ping 8.8.8.8          <span class='c'># есть ли связь вообще (L3)</span>\ntraceroute site.ru    <span class='c'># где теряется маршрут</span>\nmtr site.ru           <span class='c'># traceroute + статистика потерь</span>\nnc -zv host 5432      <span class='c'># открыт ли порт (L4)</span>\ncurl -v https://site  <span class='c'># TLS и HTTP (L7)</span>\ntcpdump -i eth0 port 443 -nn -c 20</pre><p>Двигайся снизу вверх: адрес → маршрут → порт → TLS → приложение. Так ты за пять команд сужаешь проблему до одного слоя.</p>"},
 {h:"Передача файлов",b:"<pre>scp file.tar.gz user@host:/opt/\nrsync -avz --progress ./dist/ user@host:/var/www/\nrsync -avz --delete ./dist/ user@host:/var/www/   <span class='c'># зеркало</span></pre><p><code>rsync</code> лучше <code>scp</code>: докачивает, передаёт только изменения, сохраняет права. Ключевая тонкость — <b>слеш в конце источника</b>: <code>dist/</code> копирует содержимое, <code>dist</code> — сам каталог внутрь. И <code>--delete</code> удаляет на приёмнике лишнее: мощно и опасно, сначала <code>--dry-run</code>.</p>"}],
 ch:[
 {t:"c",q:"Покажи таблицу маршрутизации современной командой.",ans:["ip r","ip route","ip route show","ip -4 r"],hint:"две буквы после ip",why:"Ищи default — это шлюз по умолчанию. Его отсутствие = «интернета нет», хотя интерфейс поднят."},
 {t:"q",q:"Ping до сервера проходит, но приложение не подключается к порту 5432. Чем проверить порт?",a:["ping -p 5432","nc -zv host 5432 (или telnet host 5432)","traceroute","dig"],c:1,why:"Ping — это L3/ICMP, он ничего не говорит о портах. Connection refused = никто не слушает, таймаут = фильтрует фаервол."},
 {t:"q",q:"Чем <code>rsync -avz</code> лучше <code>scp</code> при повторной выкатке?",a:["Ничем","Передаёт только изменившиеся части, докачивает и сохраняет права","Шифрует лучше","Работает без SSH"],c:1,why:"Для больших каталогов разница в разы. Плюс --dry-run, чтобы увидеть, что будет сделано."},
 {t:"q",q:"Что показывает <code>mtr site.ru</code> в отличие от traceroute?",a:["То же самое","Непрерывную статистику потерь и задержек по каждому узлу маршрута","Только DNS","Только первый узел"],c:1,why:"Позволяет доказать провайдеру, что потери на его участке — с цифрами, а не «у нас тормозит»."},
 {t:"q",q:"Слеш в конце в <code>rsync -a ./dist/ host:/var/www/</code> — что меняет?",a:["Ничего","Копируется содержимое dist, а без слеша — сам каталог dist внутрь /var/www","Включает сжатие","Удаляет файлы"],c:1,why:"Самая частая ошибка с rsync: получаешь /var/www/dist/index.html вместо /var/www/index.html."}]}
);

{id:"l1",t:"Первый вход на сервер",goal:"Ориентироваться в чужой системе вслепую",
 cards:[
 {h:"Терминал — это диалог, а не магия",
  b:"<p>Ты пишешь команду — система отвечает. Формат почти всегда один:</p><pre><span class='k'>команда</span> -флаги аргументы</pre><p><code>ls -la /etc</code>: программа <code>ls</code>, флаги <code>-l</code> и <code>-a</code> (склеены), путь <code>/etc</code>. Короткие флаги склеиваются: <code>-la</code> = <code>-l -a</code>. Если флаг требует значение, оно идёт следом: <code>tail -n 50</code>.</p><div class='analogy'><b>Зачем в жизни:</b> когда команда из статьи «не работает», в половине случаев дело в флаге, который ждёт значение, или в двух склеенных флагах, где первый ждёт аргумент. Понимая формат, ты чинишь это за секунды.</div>",
  cheat:"формат — команда -флаги аргумент, короткие флаги склеиваются (-la)"},
 {h:"pwd — где я сейчас",
  b:"<p><code>pwd</code> (print working directory) печатает полный путь текущего каталога.</p><pre>pwd\n/home/deploy</pre><p><b>Зачем в жизни:</b> подключился по SSH к чужому серверу в четыре утра — первым делом <code>pwd</code>, чтобы не выполнить разрушительную команду не в том каталоге. Это твой компас.</p>",
  cheat:"pwd — показать текущий каталог",
  t:{q:"Ты только что зашёл по SSH и не понимаешь, в каком каталоге оказался. Спроси систему.",ans:["pwd"],hint:"print working directory",why:"pwd — первое, что набирают на незнакомой машине."}},
 {h:"ls — что здесь лежит",
  b:"<pre>ls           <span class='c'># просто имена</span>\nls -l        <span class='c'># подробно: права, владелец, размер, дата</span>\nls -la       <span class='c'># то же плюс скрытые файлы (начинаются с точки)</span>\nls -lh       <span class='c'># размеры по-человечески: 4.0K, 84M</span></pre><p><b>Зачем в жизни:</b> конфиги <code>.env</code>, <code>.git</code>, <code>.ssh</code> начинаются с точки и без <code>-a</code> невидимы. Человек час ищет «пропавший» файл, который лежит на самом видном месте — просто скрыт.</p>",
  cheat:"ls -la — всё содержимое, включая скрытые файлы и права",
  t:{q:"Покажи полное содержимое текущего каталога: подробно и включая скрытые файлы.",ans:["ls -la","ls -al","ls -a -l","ls -l -a"],hint:"два флага: длинный формат + all",why:"Без -a скрытые файлы с точкой не видны, а самое важное часто именно в них."}},
 {h:"cd — переход по каталогам",
  b:"<div class='tw'><table><tr><th>команда</th><th>куда</th></tr><tr><td><code>cd /var/log</code></td><td>в указанный каталог</td></tr><tr><td><code>cd ..</code></td><td>на уровень вверх</td></tr><tr><td><code>cd ~</code> или <code>cd</code></td><td>домой</td></tr><tr><td><code>cd -</code></td><td>назад, где был</td></tr></table></div><p><b>Зачем в жизни:</b> при разборе аварии ты постоянно прыгаешь между <code>/etc/nginx</code> и <code>/var/log/nginx</code>. <code>cd -</code> переключает между ними одним символом.</p>",
  cheat:"cd .. вверх · cd ~ домой · cd - назад",
  t:{q:"Ты в /var/log/nginx. Вернись ровно на уровень выше одной командой.",ans:["cd .."],hint:"две точки",why:".. — родительский каталог. cd - вернул бы в предыдущий, а не вверх."}},
 {h:"Абсолютный и относительный путь",
  b:"<p><b>Абсолютный</b> начинается со слэша и не зависит от места: <code>/var/log/nginx/error.log</code>. <b>Относительный</b> отсчитывается от текущего каталога: <code>nginx/error.log</code>, <code>../etc/hosts</code>.</p><ul><li><code>.</code> текущий каталог · <code>..</code> родительский · <code>~</code> домашний</li></ul><p><b>Зачем в жизни:</b> в командах, которые удаляют или перезаписывают, всегда пиши абсолютный путь. Относительный путь плюс неверное представление о том, где ты стоишь — самый дешёвый способ снести чужие данные, и команда при этом отработает без ошибки.</p>",
  cheat:"абсолютный путь начинается с / и не зависит от текущего каталога",
  t:{q:"Ты в /home/deploy, а посмотреть нужно /etc/hosts. Напиши абсолютный путь в команде cat.",ans:["cat /etc/hosts"],hint:"путь начинается со слэша",why:"Абсолютный путь надёжнее относительного: он не зависит от того, где ты стоишь."}},
 {h:"Карта чужой системы",
  b:"<div class='tw'><table><tr><th>каталог</th><th>что там</th></tr><tr><td><code>/etc</code></td><td>конфиги сервисов — идёшь настраивать</td></tr><tr><td><code>/var/log</code></td><td>логи — идёшь при аварии</td></tr><tr><td><code>/var/lib</code></td><td>данные: базы, docker</td></tr><tr><td><code>/opt</code></td><td>здесь обычно живёт приложение</td></tr><tr><td><code>/tmp</code></td><td>временное, чистится при перезагрузке</td></tr><tr><td><code>/proc</code></td><td>живое состояние ядра</td></tr></table></div><p><b>Зачем в жизни:</b> «приложение упало» → сразу <code>/var/log</code>. «Надо поменять настройку» → <code>/etc</code>. Ты знаешь, куда идти, ещё не открыв сервер.</p>",
  cheat:"/etc конфиги · /var/log логи · /opt приложения · /tmp временное"}],
 ch:[
 {t:"c",d:1,q:"Разминка. Подключился к серверу — спроси систему, в каком ты каталоге.",ans:["pwd"],hint:"print working directory",why:"pwd — компас на любой машине."},
 {t:"c",d:2,q:"Покажи всё содержимое текущего каталога подробно и со скрытыми файлами.",ans:["ls -la","ls -al","ls -a -l","ls -l -a"],hint:"длинный формат + all",why:"Скрытые файлы с точкой без -a не видны."},
 {t:"c",d:3,q:"Ты в /var/log. Перейди в подкаталог nginx и сразу покажи его подробное содержимое двумя командами через ;",ans:["cd nginx; ls -la","cd nginx ; ls -la","cd nginx;ls -la","cd /var/log/nginx; ls -la"],hint:"cd каталог; ls -la",why:"Через ; команды выполняются подряд. Так связывают навигацию и просмотр одним действием."},
 {t:"c",d:4,q:"Не переходя никуда, покажи подробное содержимое каталога /etc/nginx абсолютным путём, включая скрытые файлы.",ans:["ls -la /etc/nginx","ls -al /etc/nginx"],hint:"ls -la и абсолютный путь аргументом",why:"ls принимает путь аргументом — не обязательно сначала переходить в каталог. Абсолютный путь работает откуда угодно."},
 {t:"f",d:4,q:"Допиши путь, чтобы из /home/deploy обратиться к /etc/hosts относительным путём (через родительские каталоги).",pre:"cat ___/etc/hosts",ans:["../../","../..","../../"],hint:"из /home/deploy до / — два уровня вверх",why:"/home/deploy → .. это /home → .. это /. Дальше /etc/hosts. Показывает, как устроен относительный путь, хотя абсолютный тут был бы проще."},
 {t:"c",d:5,q:"Инцидент. Тебе сказали: «зайди и удали каталог со старым релизом в /opt/app/releases». Прежде чем удалять, ты хочешь убедиться, что каталог существует и что именно в нём. Напиши команду, которая покажет подробное содержимое этого каталога.",ans:["ls -la /opt/app/releases","ls -al /opt/app/releases","ls -la /opt/app/releases/"],hint:"ls -la по абсолютному пути",why:"Правило дежурного: перед rm — всегда ls по тому же абсолютному пути. Увидел, что удаляешь, — не снёс лишнего. Полное расследование таких ситуаций отрабатывается в лаборатории мира."}]},

{id:"l2",t:"Чтение логов",goal:"Найти нужное в сотнях мегабайт текста",
 cards:[
 {h:"Файл не обязательно открывать целиком",
  b:"<pre>cat file.log       <span class='c'># весь файл в терминал</span>\nless file.log      <span class='c'># листать: q выход, /слово поиск, G в конец</span>\nhead -20 file.log  <span class='c'># первые 20 строк</span>\ntail -50 file.log  <span class='c'># последние 50 строк</span></pre><p><b>Зачем в жизни:</b> <code>cat</code> на файле в гигабайт залипнет и вытеснит из буфера всё полезное. Логи растут по времени, свежее — внизу, поэтому разбор аварии начинают с <code>tail</code>.</p>",
  cheat:"head -N первые строки · tail -N последние · less листать",
  t:{q:"Покажи последние 50 строк файла /var/log/syslog.",ans:["tail -n 50 /var/log/syslog","tail -50 /var/log/syslog"],hint:"tail -n число файл",why:"Свежие события в конце файла — начинают с tail."}},
 {h:"tail -f — следить за логом вживую",
  b:"<pre>tail -f app.log    <span class='c'># печатает новые строки по мере появления</span>\ntail -F app.log    <span class='c'># то же, но переживает ротацию файла</span></pre><p><b>Зачем в жизни:</b> самая частая команда дежурного. Запускаешь <code>tail -f</code>, коллега воспроизводит баг — и ты видишь ошибку в реальном времени. <code>-F</code> надёжнее: когда лог переименуют и создадут новый, обычный <code>-f</code> замолчит навсегда.</p>",
  cheat:"tail -f следить вживую · tail -F переживает ротацию",
  t:{q:"Начни следить в реальном времени за файлом /var/log/app/app.log.",ans:["tail -f /var/log/app/app.log","tail -F /var/log/app/app.log","tail -f app.log"],hint:"tail и флаг follow",why:"tail -f держит файл открытым и печатает новые строки."}},
 {h:"grep — поиск по содержимому",
  b:"<div class='tw'><table><tr><th>флаг</th><th>что делает</th></tr><tr><td><code>-i</code></td><td>без учёта регистра</td></tr><tr><td><code>-c</code></td><td>сколько строк совпало</td></tr><tr><td><code>-n</code></td><td>номера строк</td></tr><tr><td><code>-v</code></td><td>строки БЕЗ совпадения</td></tr><tr><td><code>-r</code></td><td>рекурсивно по каталогу</td></tr><tr><td><code>-C5</code></td><td>5 строк контекста вокруг</td></tr></table></div><p><b>Зачем в жизни:</b> в логе на миллион строк <code>grep ERROR</code> за секунду вытащит только нужное. А <code>grep -c</code> сразу скажет, насколько всё плохо.</p>",
  cheat:"grep слово файл · -c посчитать · -i регистр · -v инвертировать · -C5 контекст",
  t:{q:"Посчитай, в скольких строках файла app.log встречается слово ERROR.",ans:["grep -c error app.log","grep -c ERROR app.log","grep -ci error app.log"],hint:"флаг count у grep",why:"grep -c считает строки с совпадением — быстрая оценка масштаба."}},
 {h:"Кавычки в grep обязательны для фраз",
  b:"<p><code>grep connection refused app.log</code> ищет слово <code>connection</code> в файлах <code>refused</code> и <code>app.log</code>. Первый аргумент — шаблон, остальные — файлы.</p><pre>grep \"connection refused\" app.log</pre><p><b>Зачем в жизни:</b> без кавычек команда отработает без ошибки, выведет мусор или ничего, и человек решит «в логах пусто». На самом деле искал не то и не там.</p>",
  cheat:'grep "фраза из двух слов" файл — фразу берут в кавычки',
  t:{q:"Найди в app.log строки с фразой «connection refused» (два слова).",ans:['grep "connection refused" app.log',"grep 'connection refused' app.log"],hint:"фразу возьми в кавычки",why:"Без кавычек второе слово grep примет за имя файла."}},
 {h:"Пайп: конвейер из команд",
  b:"<p>Символ <code>|</code> передаёт вывод одной команды на вход другой.</p><pre>cat access.log | grep \" 500 \" | wc -l\n<span class='c'># сколько было ответов с кодом 500</span>\ngrep ERROR app.log | tail -20\n<span class='c'># двадцать последних ошибок</span></pre><p><b>Зачем в жизни:</b> из простых команд собираются точные ответы. «Сколько пятисоток за сегодня», «топ ошибок» — всё это конвейеры из двух-трёх звеньев.</p>",
  cheat:"| — передать вывод дальше · wc -l посчитать строки",
  t:{q:"Через пайп посчитай, сколько строк в app.log содержат ERROR (grep и wc).",ans:["grep ERROR app.log | wc -l","grep error app.log | wc -l"],hint:"grep ... | wc -l",why:"wc -l считает строки на входе. Это эквивалент grep -c, собранный из двух команд."}},
 {h:"Сузить по времени — первый шаг",
  b:"<pre>grep \"09:4\" app.log | grep ERROR    <span class='c'># окно 09:40-09:49, затем ошибки</span>\ntail -5000 app.log | grep ERROR     <span class='c'># свежий хвост, затем ошибки</span></pre><p><b>Зачем в жизни:</b> в логе на 4 ГБ сначала сужают окно вокруг времени инцидента, потом фильтруют. Обратный порядок заставляет систему перечитывать гигабайты зря.</p>",
  cheat:"сначала окно по времени, потом фильтр по слову"}],
 ch:[
 {t:"c",d:1,q:"Разминка. Покажи последние 50 строк файла /var/log/syslog.",ans:["tail -n 50 /var/log/syslog","tail -50 /var/log/syslog"],hint:"tail -n число",why:"Разбор начинают с конца лога."},
 {t:"c",d:2,q:"Посчитай число строк со словом ERROR в файле app.log.",ans:["grep -c error app.log","grep -c ERROR app.log","grep -ci error app.log"],hint:"флаг count",why:"grep -c — быстрая оценка масштаба."},
 {t:"c",d:3,q:"Найди в app.log строки с фразой «connection refused» и покажи по 5 строк контекста вокруг каждой.",ans:['grep -C5 "connection refused" app.log','grep -C 5 "connection refused" app.log',"grep -C5 'connection refused' app.log"],hint:"флаг контекста -C5 и кавычки вокруг фразы",why:"Контекст показывает, что было до и после ошибки. Без кавычек grep сломается на втором слове."},
 {t:"c",d:4,q:"Собери конвейер: в файле access.log посчитай, сколько было ответов с кодом 500. Код стоит отдельным словом, ищи по \" 500 \".",ans:['grep " 500 " access.log | wc -l',"cat access.log | grep \" 500 \" | wc -l",'grep -c " 500 " access.log'],hint:'grep " 500 " ... | wc -l',why:"Фильтр по коду плюс подсчёт строк. Классический разбор логов веб-сервера."},
 {t:"c",d:4,q:"Убери шум: покажи последние 100 строк app.log, в которых НЕТ слова INFO.",ans:["tail -100 app.log | grep -v INFO","tail -n 100 app.log | grep -v INFO"],hint:"tail даёт хвост, grep -v убирает строки со словом",why:"-v инвертирует условие. Приём «убрать заведомо неинтересное» часто эффективнее поиска нужного."},
 {t:"c",d:5,q:"Инцидент. Приложение начало падать около 09:41, лог app.log огромный. Собери одну команду, которая сузит лог до окна 09:41 и покажет только строки с ERROR внутри него.",ans:['grep "09:41" app.log | grep ERROR','grep 09:41 app.log | grep ERROR','grep "09:41" app.log | grep error'],hint:"сначала grep по времени, потом пайп в grep ERROR",why:"Сначала окно по времени, потом фильтр по слову — иначе система перечитывает гигабайты зря. Полное расследование — в лаборатории «диск» и других."}]},

{id:"l3",t:"Права доступа",goal:"Понять, почему Permission denied — и починить правильно",
 cards:[
 {h:"Три роли и три права",
  b:"<pre>-rw-r--r--  1 deploy www-data  app.conf\n ^^^ ^^^ ^^^\n  │   │   └ остальные: r--\n  │   └── группа:     r--\n  └────── владелец:   rw-</pre><p>Права <b>r</b> чтение, <b>w</b> запись, <b>x</b> выполнение — отдельно для владельца, группы, остальных. Система проверяет по порядку и останавливается на первом подходящем: ты владелец → права владельца, и дальше не смотрит.</p><p><b>Зачем в жизни:</b> отсюда парадокс — если владельцу запрещено, а остальным разрешено, владелец всё равно не получит доступ. Понимание порядка проверки экономит часы на «почему не читается мой же файл».</p>",
  cheat:"rwx для трёх ролей: владелец, группа, остальные · r=чтение w=запись x=выполнение"},
 {h:"Цифры: r=4, w=2, x=1",
  b:"<p>Складываешь права и получаешь цифру для каждой роли.</p><div class='tw'><table><tr><th>цифра</th><th>права</th><th>для чего</th></tr><tr><td>7</td><td>rwx</td><td>каталоги под запись</td></tr><tr><td>6</td><td>rw-</td><td>обычные файлы</td></tr><tr><td>5</td><td>r-x</td><td>чтение и вход в каталог</td></tr><tr><td>4</td><td>r--</td><td>только чтение</td></tr></table></div><pre>chmod 644 app.conf   <span class='c'># владелец пишет, остальные читают</span>\nchmod 600 id_rsa     <span class='c'># только владелец: иначе ssh откажется</span>\nchmod 755 script.sh  <span class='c'># исполняемый скрипт</span></pre><p><b>Зачем в жизни:</b> SSH откажется работать с ключом, у которого права шире 600 — сосед по серверу мог бы его прочитать. Знание цифр решает это одной командой.</p>",
  cheat:"chmod 644 файлы · 600 ключи · 755 скрипты и каталоги",
  t:{q:"Закрой приватный SSH-ключ id_rsa так, чтобы читать и писать мог только владелец.",ans:["chmod 600 id_rsa"],hint:"rw для владельца = 6, остальным 0",why:"600 = rw------. SSH требует именно таких прав на приватный ключ."}},
 {h:"chmod: сделать исполняемым",
  b:"<pre>chmod 755 deploy.sh   <span class='c'># цифрами: rwx владельцу, r-x остальным</span>\nchmod +x deploy.sh    <span class='c'># буквами: добавить x всем ролям</span>\nchmod u+x deploy.sh   <span class='c'># добавить x только владельцу</span></pre><p><b>Зачем в жизни:</b> скачал скрипт — он не запускается с ошибкой «Permission denied» или «not executable». Причина почти всегда одна: нет бита x. <code>chmod +x</code> чинит это мгновенно.</p>",
  cheat:"chmod 755 файл или chmod +x файл — сделать исполняемым",
  t:{q:"Сделай скрипт deploy.sh исполняемым: владельцу полный доступ, остальным чтение и выполнение (цифрами).",ans:["chmod 755 deploy.sh","sudo chmod 755 deploy.sh"],hint:"7 владельцу, 5 остальным",why:"755 = rwxr-xr-x. 777 добавило бы всем право записи — это дыра в безопасности."}},
 {h:"chown: сменить владельца и группу",
  b:"<pre>chown deploy:deploy app.conf   <span class='c'># владелец и группа</span>\nchown -R app:app /opt/app      <span class='c'># рекурсивно</span>\nid deploy                      <span class='c'># в каких группах пользователь</span></pre><p><b>Зачем в жизни:</b> типовая схема веб-сервера — файлы принадлежат <code>deploy</code>, группа <code>www-data</code>, права 640. Деплой пишет, nginx читает, посторонние не видят ничего. Настраивается это через <code>chown</code>, а не через раздачу прав всем.</p>",
  cheat:"chown владелец:группа файл · -R рекурсивно",
  t:{q:"Смени владельца и группу файла app.conf на deploy (и владелец, и группа — deploy).",ans:["chown deploy:deploy app.conf"],hint:"chown владелец:группа файл",why:"Доступ чинят сменой владельца/группы, а не chmod 777."}},
 {h:"Права на каталог значат другое",
  b:"<div class='tw'><table><tr><th></th><th>файл</th><th>каталог</th></tr><tr><td>r</td><td>прочитать</td><td>увидеть список имён</td></tr><tr><td>w</td><td>изменить</td><td>создавать и удалять файлы внутри</td></tr><tr><td>x</td><td>запустить</td><td>войти и обратиться к файлу по имени</td></tr></table></div><p><b>Зачем в жизни:</b> чтобы прочитать <code>/opt/app/config.yml</code>, нужен бит <b>x</b> на всех каталогах пути. Права на файл идеальны, а доступа нет — проверяй весь путь командой <code>namei -l</code>. И никогда не лечи это через <code>chmod 777</code>.</p>",
  cheat:"на каталоге x = право войти · namei -l покажет права всего пути"}],
 ch:[
 {t:"c",d:1,q:"Разминка. Закрой приватный ключ id_rsa: читать и писать только владелец.",ans:["chmod 600 id_rsa"],hint:"6 владельцу, 0 остальным",why:"600 — обязательные права SSH-ключа."},
 {t:"c",d:2,q:"Сделай скрипт backup.sh исполняемым: 7 владельцу, 5 группе и остальным.",ans:["chmod 755 backup.sh","sudo chmod 755 backup.sh"],hint:"три цифры",why:"755 — стандартные права исполняемого файла."},
 {t:"c",d:3,q:"Смени владельца и группу каталога /opt/app и всего его содержимого на пользователя app (рекурсивно).",ans:["chown -R app:app /opt/app","sudo chown -R app:app /opt/app"],hint:"chown -R владелец:группа путь",why:"-R применяет смену ко всему дереву. Так выдают приложению его каталог."},
 {t:"c",d:4,q:"Сервис работает от пользователя app и не может прочитать /opt/app/secret.yml. Ты подозреваешь права на каталогах пути. Напиши команду, которая покажет права на каждом шаге пути к файлу.",ans:["namei -l /opt/app/secret.yml","namei -m /opt/app/secret.yml"],hint:"namei -l путь_к_файлу",why:"namei -l разбирает путь по шагам и показывает права каждого каталога — так находят недостающий бит x."},
 {t:"c",d:4,q:"Проверь, от чьего имени и в каких группах состоит пользователь app, чтобы понять, даст ли ему доступ группа www-data.",ans:["id app","groups app"],hint:"одна команда покажет uid, gid и группы",why:"id показывает все группы пользователя. Если app не в www-data, права группы ему не помогут."},
 {t:"c",d:5,q:"Инцидент. После деплоя сайт отдаёт 403, в логе nginx: «Permission denied» на /var/www/app. Файлы принадлежат deploy:deploy с правами 640, nginx работает от www-data. Одной командой дай nginx доступ, не трогая права: смени группу файлов на www-data рекурсивно.",ans:["chown -R deploy:www-data /var/www/app","sudo chown -R deploy:www-data /var/www/app","chgrp -R www-data /var/www/app","sudo chgrp -R www-data /var/www/app"],hint:"chown -R deploy:www-data путь (или chgrp -R)",why:"640 = чтение для группы. Сделав группой владельца www-data, даёшь nginx чтение без chmod 777. Минимальное изменение, закрывающее ровно проблему."}]},

{id:"l4",t:"Процессы и ресурсы",goal:"Узнать, кто съел процессор, память и диск",
 cards:[
 {h:"ps — найти процесс",
  b:"<pre>ps aux                 <span class='c'># все процессы: пользователь, PID, %CPU, %MEM, команда</span>\nps aux | grep nginx    <span class='c'># отфильтровать по имени</span></pre><p><b>Зачем в жизни:</b> «сервис не отвечает» — первым делом смотришь, жив ли вообще процесс и от кого запущен. Последняя колонка (полная команда с аргументами) часто сразу объясняет проблему: например, кто-то забыл выключить отладочный сервер на нужном порту.</p>",
  cheat:"ps aux | grep имя — найти процесс и его PID",
  t:{q:"Найди все процессы nginx в списке процессов.",ans:["ps aux | grep nginx","ps -ef | grep nginx","pgrep -a nginx"],hint:"ps aux и пайп в grep",why:"ps aux | grep — рабочая лошадка поиска процессов."}},
 {h:"kill — правильно останавливать",
  b:"<pre>kill 4210      <span class='c'># SIGTERM: попросить завершиться (по умолчанию)</span>\nkill -9 4210   <span class='c'># SIGKILL: убить немедленно, нельзя перехватить</span>\nkill -1 4210   <span class='c'># SIGHUP: у демонов «перечитай конфиг»</span></pre><p><b>Зачем в жизни:</b> сначала обычный <code>kill</code> — процесс успеет закрыть файлы и соединения с базой. <code>-9</code> исчезает мгновенно, оставляя битые данные. Порядок: <code>kill</code>, подождать, потом <code>-9</code>.</p>",
  cheat:"kill PID вежливо · kill -9 PID насмерть · kill -1 PID перечитать конфиг",
  t:{q:"Мягко заверши процесс с PID 4210 (без насильственного убийства).",ans:["kill 4210","kill -15 4210","kill -term 4210"],hint:"kill без флага -9",why:"Обычный kill даёт процессу закрыться корректно."}},
 {h:"free — память системы",
  b:"<pre>free -h\n         total   used   free   available\nMem:     3.8Gi  1.2Gi  0.4Gi       2.4Gi</pre><p><b>Зачем в жизни:</b> малое значение <code>free</code> пугает новичков, и они «заказывают память». На деле Linux занимает свободную память под кэш и отдаёт её по требованию. Смотреть надо на <b>available</b> — сколько реально доступно программам.</p>",
  cheat:"free -h — смотреть на available, а не на free",
  t:{q:"Покажи использование памяти в человекочитаемом виде.",ans:["free -h","free -m","free -g"],hint:"free и флаг human",why:"free -h показывает память в ГБ/МБ. Ключевая колонка — available."}},
 {h:"df и du — диск",
  b:"<pre>df -h              <span class='c'># сколько занято на разделах</span>\ndf -i              <span class='c'># сколько занято inode</span>\ndu -sh /var/*      <span class='c'># сколько весят каталоги</span></pre><p><b>Зачем в жизни:</b> алерт «диск 100%» → <code>df -h</code> покажет раздел, <code>du -sh</code> найдёт виновника. А если <code>df</code> показывает переполнение, но <code>du</code> ничего не находит — процесс держит удалённый файл открытым (ищи через <code>lsof | grep deleted</code>).</p>",
  cheat:"df -h занятость разделов · du -sh /var/* размер каталогов · df -i inode",
  t:{q:"Покажи занятость всех разделов в человекочитаемом виде.",ans:["df -h"],hint:"disk free + human",why:"df -h — первая команда при алерте на диск."}},
 {h:"load average — нагрузка",
  b:"<pre>uptime\n load average: 2.31, 1.84, 1.02\n                 1м    5м    15м</pre><p>Это среднее число процессов, которые выполняются или ждут. Сравнивать надо с числом ядер (<code>nproc</code>): 4.0 на четырёх ядрах — полная загрузка, на одном — перегрузка вчетверо.</p><p><b>Зачем в жизни:</b> первое число больше остальных — авария нарастает прямо сейчас. Высокий load при низком %CPU — процессы ждут диск или сеть, а не считают.</p>",
  cheat:"uptime — load average, сравнивать с числом ядер (nproc)",
  t:{q:"Покажи среднюю нагрузку и время работы системы.",ans:["uptime"],hint:"одно слово",why:"uptime показывает load average — сравнивай с числом ядер."}}],
 ch:[
 {t:"c",d:1,q:"Разминка. Покажи занятость разделов в человекочитаемом виде.",ans:["df -h"],hint:"disk free + human",why:"Первая команда при алерте на диск."},
 {t:"c",d:2,q:"Найди все процессы postgres в системе.",ans:["ps aux | grep postgres","ps -ef | grep postgres","pgrep -a postgres"],hint:"ps aux | grep",why:"Смотри на колонку команды — она объясняет, что это за процесс."},
 {t:"c",d:3,q:"Найди процесс python на порту (по имени) и мягко его заверши. Сначала команда поиска, чтобы узнать PID.",ans:["ps aux | grep python","pgrep -a python","ps -ef | grep python"],hint:"сначала найди PID через ps aux | grep",why:"Сначала находят PID, потом kill. Насильственный -9 применяют только если обычный kill не помог."},
 {t:"c",d:4,q:"Раздел /var заполнен. Найди, какие подкаталоги внутри /var занимают больше всего места, отсортировав по размеру (человекочитаемо).",ans:["du -sh /var/* | sort -h","du -sh /var/*|sort -h","du -h -s /var/* | sort -h"],hint:"du -sh /var/* и пайп в sort -h",why:"du -sh даёт размеры, sort -h сортирует человеческие размеры (K, M, G). Так находят виновника переполнения."},
 {t:"c",d:4,q:"Проверь среднюю нагрузку, а затем число ядер, чтобы понять, перегружен ли сервер. Начни с команды нагрузки.",ans:["uptime","cat /proc/loadavg"],hint:"uptime покажет load average",why:"load average сравнивают с числом ядер (nproc). Высокая нагрузка при низком CPU — ожидание диска или сети."},
 {t:"c",d:5,q:"Инцидент. Алерт: /var заполнен на 100%. Первым делом одной командой убедись, какой именно раздел переполнен и на сколько.",ans:["df -h","df -h /var"],hint:"df -h",why:"df -h показывает разделы. Дальше du ищет виновника, а расхождение df и du означает удалённый открытый файл — это отрабатывается в лаборатории «диск заполнен»."}]},

{id:"l5",t:"Bash-скрипты",goal:"Автоматизировать то, что делал руками, и не навредить",
 cards:[
 {h:"Скелет скрипта",
  b:"<pre>#!/bin/bash\nset -euo pipefail\n\nAPP_DIR=\"/opt/app\"\necho \"работаю с $APP_DIR\"</pre><p>Первая строка (shebang) говорит системе, чем исполнять файл. Без неё скрипт запустит оболочка по умолчанию, где синтаксис bash может не сработать.</p><p><b>Зачем в жизни:</b> любой повторяющийся набор команд рано или поздно оформляют скриптом. Правильный скелет отличает надёжный скрипт от бомбы замедленного действия.</p>",
  cheat:"#!/bin/bash в начале · set -euo pipefail сразу после"},
 {h:"set -euo pipefail — три слова инженера",
  b:"<div class='tw'><table><tr><th>флаг</th><th>от чего спасает</th></tr><tr><td><code>-e</code></td><td>падать при первой ошибке, а не продолжать на неверных данных</td></tr><tr><td><code>-u</code></td><td>ошибка на необъявленной переменной: <code>rm -rf $DIR/</code> при пустой DIR не станет <code>rm -rf /</code></td></tr><tr><td><code>-o pipefail</code></td><td>поймать ошибку внутри пайпа, а не только последней команды</td></tr></table></div><p><b>Зачем в жизни:</b> без <code>-o pipefail</code> команда <code>tar ... | gzip &gt; f</code> считается успешной, даже если tar упал. Так «успешно» создаются пустые бэкапы, о которых узнают в день восстановления.</p>",
  cheat:"set -euo pipefail — падать на ошибке, ловить пустые переменные и ошибки в пайпах",
  t:{q:"Напиши строку, которую ставят сразу после shebang: падать при ошибке, ругаться на необъявленные переменные, ловить ошибки в пайпах.",ans:["set -euo pipefail","set -eou pipefail"],hint:"set -e + -u + -o pipefail",why:"Три опции — минимальная гигиена любого скрипта, который что-то меняет."}},
 {h:"Код возврата — язык автоматизации",
  b:"<p>Каждая команда возвращает число: <b>0</b> успех, иначе ошибка. Посмотреть последнее — <code>echo $?</code>.</p><pre>curl -fsS http://localhost/health || exit 1\n<span class='c'># || выполняется только при ненулевом коде</span>\nmkdir -p /opt/app &amp;&amp; cd /opt/app\n<span class='c'># &amp;&amp; выполняется только при успехе</span></pre><p><b>Зачем в жизни:</b> на кодах возврата держится всё — CI считает шаг упавшим, Docker проверяет здоровье, systemd решает, перезапускать ли сервис. Коды 126 (не исполняемый) и 127 (не найден) экономят часы отладки.</p>",
  cheat:"echo $? — код последней команды · 0 успех · || при ошибке · && при успехе",
  t:{q:"Выведи код возврата последней выполненной команды.",ans:["echo $?",'echo "$?"'],hint:"специальная переменная со знаком вопроса",why:"$? — 0 успех, иначе ошибка. Это читают CI, systemd и healthcheck."}},
 {h:"Кавычки вокруг переменных",
  b:"<pre>DIR=\"/opt/my app\"\nrm -rf $DIR      <span class='c'># ОПАСНО: две цели — /opt/my и app</span>\nrm -rf \"$DIR\"    <span class='c'># верно: один аргумент</span></pre><p><b>Зачем в жизни:</b> без кавычек оболочка разбивает значение по пробелам. Пробел в пути или пустая переменная — и деплой-скрипт удаляет не то. Правило: всегда заключай переменные в двойные кавычки.</p>",
  cheat:'всегда "$VAR" в кавычках — иначе пробелы и пустые значения ломают команду',
  t:{q:"Выведи на экран значение переменной APP_DIR так, чтобы пробелы в пути не сломали вывод (в кавычках).",ans:['echo "$APP_DIR"',"echo \"${APP_DIR}\""],hint:'echo "$ИМЯ"',why:"Двойные кавычки сохраняют значение как единое целое."}},
 {h:"Проверки в начале скрипта",
  b:"<pre>[ -f \"$F\" ]   <span class='c'># файл существует</span>\n[ -d \"$D\" ]   <span class='c'># каталог существует</span>\n[ -z \"$V\" ]   <span class='c'># переменная пустая</span>\ntest -n \"$TOKEN\" || { echo \"нет токена\" &gt;&amp;2; exit 1; }</pre><p><b>Зачем в жизни:</b> проверка обязательных переменных в начале скрипта заставляет его падать сразу и с понятным сообщением, а не на середине с непонятной ошибкой в чужой команде. Ошибки пиши в stderr через <code>&gt;&amp;2</code>.</p>",
  cheat:'[ -f файл ] [ -d каталог ] [ -z пусто ] · echo "ошибка" >&2'}],
 ch:[
 {t:"c",d:1,q:"Разминка. Выведи код возврата последней команды.",ans:["echo $?",'echo "$?"'],hint:"переменная со знаком вопроса",why:"$? — успех это 0."},
 {t:"f",d:2,q:"Допиши строку сразу после shebang: падать при ошибке, ловить необъявленные переменные и ошибки в пайпах.",pre:"#!/bin/bash\n___",ans:["set -euo pipefail","set -eou pipefail","set -euo pipefail;"],hint:"set -e + -u + -o pipefail",why:"Три опции — гигиена любого рабочего скрипта."},
 {t:"c",d:3,q:"Напиши строку-healthcheck: если curl к http://localhost/health не вернул успех, выйти из скрипта с кодом 1. Используй флаги -fsS.",ans:["curl -fsS http://localhost/health || exit 1","curl -fsS http://localhost/health||exit 1"],hint:"curl -fsS URL || exit 1",why:"|| срабатывает при ненулевом коде. Флаг -f заставляет curl вернуть ошибку при HTTP 500 — без него он считает такой ответ успехом."},
 {t:"c",d:4,q:"Напиши безопасное удаление содержимого каталога из переменной BUILD_DIR: переменная в кавычках, чтобы пустое значение не превратило команду в удаление корня.",ans:['rm -rf "$BUILD_DIR"/*','rm -rf "${BUILD_DIR}"/*','rm -rf "$BUILD_DIR"/','rm -rf "$BUILD_DIR"'],hint:'rm -rf "$BUILD_DIR"/* — переменная в кавычках',why:"Кавычки защищают от пробелов, а set -u в начале скрипта — от пустой переменной. Вместе они предотвращают катастрофу."},
 {t:"c",d:4,q:"Напиши проверку: если переменная TOKEN пустая, вывести в stderr «нет токена» и выйти с кодом 1. Одной строкой через test и ||.",ans:['test -n "$TOKEN" || { echo "нет токена" >&2; exit 1; }','test -n "$TOKEN" || { echo нет токена >&2; exit 1; }'],hint:'test -n "$TOKEN" || { echo ... >&2; exit 1; }',why:"Проверка обязательных переменных в начале скрипта даёт падение сразу и с понятным сообщением. >&2 направляет текст в stderr."},
 {t:"c",d:5,q:"Инцидент. Ночной бэкап «успешен», но архивы пустые. Виноват пайп без pipefail: tar падал, gzip записывал пустоту, скрипт считал всё удачным. Напиши строку, которую нужно добавить в начало скрипта, чтобы ошибка внутри пайпа больше не терялась.",ans:["set -euo pipefail","set -o pipefail","set -eo pipefail","set -euo pipefail;"],hint:"set ... pipefail",why:"pipefail делает пайп неуспешным, если упало любое звено. И отдельный урок: успех бэкапа проверяется восстановлением, а не отсутствием ошибок в логе."}]}
);
W("linux").miss.push(

{id:"l6",t:"systemd: сервисы навсегда",goal:"Сделать так, чтобы приложение поднималось само",
 cards:[
 {h:"Зачем нужен systemd",b:"<p>Приложение, запущенное командой в терминале, умирает вместе с сессией. Приложение, запущенное через <code>nohup</code> в фоне, переживает выход, но не переживает перезагрузку, не перезапускается после падения и не имеет внятного журнала.</p><p><b>systemd</b> — система инициализации и менеджер служб. Он решает четыре задачи сразу: запуск при загрузке, перезапуск после падения, порядок и зависимости между сервисами, сбор журналов.</p><p>Единица управления называется <b>юнит</b>. Типы юнитов: <code>.service</code> (служба), <code>.timer</code> (расписание), <code>.socket</code> (активация по обращению к порту), <code>.target</code> (группа юнитов), <code>.mount</code> (точка монтирования).</p><p><b>Зачем в жизни:</b> любой сервис, который должен работать «всегда» — API, база, воркер очереди — заворачивают в systemd-юнит. Без него сервер после перезагрузки останется пустым."},
 {h:"Юнит-файл целиком",b:"<pre>[Unit]\nDescription=Shop API\nAfter=network-online.target postgresql.service\nRequires=postgresql.service\n\n[Service]\nType=simple\nUser=app\nGroup=app\nWorkingDirectory=/opt/app\nEnvironmentFile=/etc/app/env\nExecStart=/opt/app/bin/api --port 8080\nExecReload=/bin/kill -HUP $MAINPID\nRestart=on-failure\nRestartSec=5\nLimitNOFILE=65535\n\n[Install]\nWantedBy=multi-user.target</pre><div class='tw'><table><tr><th>секция</th><th>отвечает за</th></tr><tr><td><b>[Unit]</b></td><td>описание и зависимости от других юнитов</td></tr><tr><td><b>[Service]</b></td><td>как именно запускать процесс</td></tr><tr><td><b>[Install]</b></td><td>куда цеплять юнит при включении автозапуска</td></tr></table></div><p>Свои юниты кладут в <code>/etc/systemd/system/имя.service</code>. Юниты из пакетов лежат в <code>/lib/systemd/system/</code> — их не редактируют напрямую, используют <code>systemctl edit имя</code>.</p>",
  cheat:"юнит: [Unit] зависимости, [Service] запуск, [Install] автозагрузка — файл в /etc/systemd/system/"},
 {h:"systemctl status — первая команда",b:"<pre>systemctl status nginx</pre><p>Показывает: активен ли сервис, PID, потребление памяти, время последнего старта и хвост журнала — всё за одну команду.</p><p><b>Зачем в жизни:</b> «сервис не отвечает» — первое, что набираешь, ещё до логов и мониторинга. Три секунды дают полную картину.</p>",
  cheat:"systemctl status имя — состояние, PID, память, последние строки журнала",
  t:{q:"Проверь состояние сервиса nginx: активен ли он, какой PID, что в последних строках журнала.",ans:["systemctl status nginx"],hint:"systemctl и подкоманда status",why:"status даёт максимум информации за одну команду."}},
 {h:"After, Requires, Wants — три разные вещи",b:"<div class='tw'><table><tr><th>директива</th><th>что задаёт</th><th>если зависимость упадёт</th></tr><tr><td><code>After=</code></td><td>только порядок запуска</td><td>ничего, сервис продолжит работать</td></tr><tr><td><code>Requires=</code></td><td>жёсткую зависимость</td><td>наш сервис тоже остановится</td></tr><tr><td><code>Wants=</code></td><td>мягкую зависимость</td><td>ничего</td></tr></table></div><p><b>Ключевая тонкость:</b> <code>Requires</code> не задаёт порядок. Указав только его, получишь параллельный запуск — приложение попытается подключиться к ещё не готовой базе. На практике пишут обе строки: <code>Requires=postgresql.service</code> и <code>After=postgresql.service</code>.</p><p><b>Зачем в жизни:</b> даже правильный порядок не гарантирует готовность — systemd считает сервис запущенным, когда стартовал процесс, а не когда база начала принимать соединения. Надёжное решение — ретраи подключения в приложении.</p>",
  cheat:"Requires= жёсткая зависимость (без порядка) · After= порядок запуска — нужны обе строки"},
 {h:"start против enable",b:"<pre>systemctl start api        <span class='c'># запустить прямо сейчас</span>\nsystemctl enable api       <span class='c'># запускать при загрузке системы</span>\nsystemctl enable --now api <span class='c'># и то, и другое</span>\nsystemctl is-enabled api\nsystemctl list-units --failed   <span class='c'># что сломано прямо сейчас</span></pre><p>Это две разные операции. <code>enable</code> создаёт символическую ссылку, которая заставляет юнит стартовать при загрузке.</p><p><b>Зачем в жизни:</b> классика жанра — всё работало неделю, сервер перезагрузили, сервис не поднялся, потому что забыли <code>enable</code>. Проверяется одной командой <code>is-enabled</code>.</p>",
  cheat:"systemctl start сейчас · enable при загрузке · enable --now оба сразу",
  t:{q:"Включи автозапуск сервиса api при загрузке системы И запусти его прямо сейчас — одной командой.",ans:["systemctl enable --now api","sudo systemctl enable --now api"],hint:"enable с флагом --now",why:"--now объединяет start и enable в одну команду."}},
 {h:"daemon-reload — главная ловушка",b:"<pre>systemctl daemon-reload    <span class='c'># перечитать все юниты с диска</span></pre><p>systemd держит юниты в памяти. Правишь файл, делаешь <code>restart</code> — и ничего не меняется, потому что перечитан старый юнит из кэша.</p><p>Порядок всегда один: <b>правка файла → daemon-reload → restart → status</b>.</p><p><b>Зачем в жизни:</b> подсказка, что попал в эту ловушку — в <code>status</code> видна прежняя команда запуска, хотя в файле она другая. systemd обычно сам пишет предупреждение «unit file changed on disk».</p>",
  cheat:"после правки юнита: daemon-reload, потом restart — иначе изменения не применятся",
  t:{q:"Ты отредактировал /etc/systemd/system/api.service. Заставь systemd перечитать юниты с диска.",ans:["systemctl daemon-reload","sudo systemctl daemon-reload"],hint:"daemon-...",why:"Без daemon-reload перезапуск использует старую версию юнита из памяти."}},
 {h:"Restart и как не устроить шторм",b:"<div class='tw'><table><tr><th>значение</th><th>когда перезапускать</th></tr><tr><td><code>on-failure</code></td><td>только при ошибке — обычный выбор</td></tr><tr><td><code>always</code></td><td>всегда, даже после штатной остановки</td></tr></table></div><pre>Restart=on-failure\nRestartSec=5\nStartLimitBurst=5\nStartLimitIntervalSec=60</pre><p><code>RestartSec</code> — пауза между попытками. <code>StartLimitBurst</code> ограничивает число попыток в окне — после пяти неудач за минуту systemd прекращает попытки и оставляет сервис в failed.</p><p><b>Зачем в жизни:</b> <code>Restart=always</code> без ограничений на сервисе с ошибкой в конфиге способен за ночь заполнить диск журналом перезапусков.</p>",
  cheat:"Restart=on-failure + RestartSec=5 + StartLimitBurst — без этого шторм перезапусков"},
 {h:"reload против restart",b:"<pre>nginx -t &amp;&amp; systemctl reload nginx</pre><p><code>reload</code> перечитывает конфиг без разрыва соединений — новые воркеры поднимаются с новым конфигом, старые дорабатывают текущие запросы. Работает, только если в юните описан <code>ExecReload=</code>.</p><p><b>Зачем в жизни:</b> связка <code>nginx -t &amp;&amp; reload</code> — одна строка, спасающая продакшены. При ошибке в конфиге reload не выполнится; restart без проверки оставил бы без веб-сервера.</p>",
  cheat:"nginx -t && systemctl reload nginx — проверка перед применением, без разрыва соединений",
  t:{q:"Примени новый конфиг nginx без разрыва текущих соединений (не restart).",ans:["systemctl reload nginx","sudo systemctl reload nginx","nginx -t && systemctl reload nginx"],hint:"systemctl reload, не restart",why:"reload поднимает новые воркеры, старые дорабатывают запросы — zero downtime."}}],
 ch:[
 {t:"c",d:1,q:"Разминка. Проверь состояние сервиса api: активен ли, какой PID.",ans:["systemctl status api"],hint:"systemctl status",why:"Первая команда при подозрении на проблему с сервисом."},
 {t:"c",d:2,q:"Включи автозапуск сервиса api при загрузке И запусти его сейчас одной командой.",ans:["systemctl enable --now api","sudo systemctl enable --now api"],hint:"enable --now",why:"Без enable сервис не переживёт следующую перезагрузку."},
 {t:"c",d:3,q:"Ты изменил ExecStart в юните api.service. Напиши последовательность из двух команд через &&: сначала перечитать юниты, потом перезапустить сервис.",ans:["systemctl daemon-reload && systemctl restart api","sudo systemctl daemon-reload && sudo systemctl restart api"],hint:"daemon-reload && restart",why:"daemon-reload обязателен перед restart после правки файла юнита — иначе применится старая версия."},
 {t:"c",d:4,q:"Юнит api.service должен запускаться после базы postgresql, и падать вместе с ней, если она недоступна. Напиши две строки секции [Unit], которые это обеспечивают.",ans:["After=postgresql.service\nRequires=postgresql.service","Requires=postgresql.service\nAfter=postgresql.service"],hint:"обе строки одной строкой через пробел: After=... Requires=...",why:"Requires без After не задаёт порядок — оба юнита стартуют параллельно. Нужны обе строки."},
 {t:"f",d:4,q:"Допиши строку конфигурации сервиса: перезапускать только при ошибке, с паузой 5 секунд между попытками.",pre:"[Service]\nExecStart=/opt/app/bin/api\n___\n___",ans:["Restart=on-failure\nRestartSec=5"],hint:"одной строкой через пробел: Restart=on-failure RestartSec=5",why:"on-failure не перезапускает после штатной остановки, RestartSec даёт паузу между попытками."},
 {t:"c",d:5,q:"Инцидент. Ты поправил ExecStart в юните, выполнил systemctl restart api — сервис поднялся, но работает по-старому: status показывает прежнюю команду запуска. Напиши правильную последовательность из двух команд через &&, которая это исправит.",ans:["systemctl daemon-reload && systemctl restart api","sudo systemctl daemon-reload && sudo systemctl restart api"],hint:"пропущен daemon-reload перед restart",why:"systemd работал с кэшированной версией юнита. Расхождение файла и вывода status — точный признак пропущенного daemon-reload."}]},

{id:"l7",t:"Планировщик задач",goal:"Автоматизировать рутину по расписанию и узнавать о сбоях",
 cards:[
 {h:"cron: пять полей",b:"<pre>crontab -e        <span class='c'># редактировать задания текущего пользователя</span>\ncrontab -l        <span class='c'># посмотреть</span>\n\n<span class='c'># мин  час  день_месяца  месяц  день_недели  команда</span>\n0    3    *    *    *   /opt/scripts/backup.sh\n*/5  *    *    *    *   /opt/scripts/check.sh</pre><p><code>*</code> — любое значение, <code>*/N</code> — каждые N единиц. <b>Первое поле — минуты</b>, поэтому <code>*/5 * * * *</code> значит «каждые пять минут».</p><p><b>Зачем в жизни:</b> ночной бэкап, ротация, проверка здоровья — типичные кандидаты на cron. Ошибка в позиции поля — самая частая при чтении чужого crontab.</p>",
  cheat:"crontab -e редактировать · формат: мин час день месяц день_недели команда",
  t:{q:"Открой редактор заданий cron для текущего пользователя.",ans:["crontab -e"],hint:"crontab -e",why:"crontab -l только показывает список, -e открывает редактор."}},
 {h:"Почему скрипт работает руками и молчит из cron",b:"<p>Три причины по частоте: другое окружение (минимальный PATH, нет переменных из .bashrc), вывод никуда не идёт (cron пытается слать почтой, которой нет), нет прав или бита выполнения.</p><pre>*/5 * * * * /opt/scripts/check.sh &gt;&gt; /var/log/check.log 2&gt;&amp;1</pre><p><b>Зачем в жизни:</b> в crontab всегда пишут абсолютные пути и перенаправляют оба потока в файл — иначе не узнаешь ни об успехе, ни о провале.</p>",
  cheat:"в crontab: абсолютные пути + >> log 2>&1, иначе ошибки не увидишь",
  t:{q:"Допиши задание cron так, чтобы и вывод, и ошибки скрипта check.sh дописывались в /var/log/check.log.",ans:["*/5 * * * * /opt/scripts/check.sh >> /var/log/check.log 2>&1"],hint:">> файл 2>&1 в конце строки",why:"Без перенаправления ошибку из cron никто не увидит."}},
 {h:"systemd timer — современная замена",b:"<pre>[Timer]\nOnCalendar=*-*-* 03:00:00\nPersistent=true\n\nsystemctl enable --now backup.timer\nsystemctl list-timers</pre><p>Преимущества: журнал в journalctl без перенаправлений, <code>Persistent=true</code> догоняет пропущенный запуск после простоя машины, можно запустить вручную и сразу увидеть результат.</p><p><b>Зачем в жизни:</b> на боевом сервере таймер удобнее cron именно возможностью запустить задачу как обычный сервис и тут же посмотреть журнал — не дожидаясь расписания.</p>",
  cheat:"systemctl list-timers — когда сработает и когда работал таймер"},
 {h:"Блокировка от параллельного запуска",b:"<pre>flock -n /var/lock/backup.lock /opt/scripts/backup.sh || exit 0</pre><p><code>flock -n</code> завершается сразу, если блокировка занята (без <code>-n</code> будет ждать).</p><p><b>Зачем в жизни:</b> бэкап растущей базы однажды выйдет за интервал — второй запуск начнёт писать в тот же файл поверх первого. flock делает это технически невозможным.</p>",
  cheat:"flock -n /путь/lock команда || exit 0 — не даёт запустить второй экземпляр",
  t:{q:"Оберни запуск /opt/scripts/backup.sh блокировкой flock (неблокирующей), чтобы второй экземпляр не стартовал поверх первого.",ans:["flock -n /var/lock/backup.lock /opt/scripts/backup.sh"],hint:"flock -n /путь/к/lock-файлу команда",why:"-n делает flock неблокирующим: выходит сразу, если занято, вместо ожидания в очереди."}},
 {h:"Мониторинг самих заданий",b:"<p>Главная проблема фоновых задач — тихий отказ: задание перестало выполняться месяц назад, и никто не заметил, потому что отсутствие результата ничем не проявляется.</p><p>Правильно: проверять результат, а не факт запуска. Алерт «свежесть последнего бэкапа больше 26 часов» надёжнее, чем «код возврата 0».</p><p><b>Зачем в жизни:</b> «задание зелёное» и «бэкап пригоден» — разные утверждения. Проверяется только тестовым восстановлением.</p>",
  cheat:"алерт на свежесть результата, а не на факт запуска — иначе тихий отказ незаметен"}],
 ch:[
 {t:"c",d:1,q:"Разминка. Открой редактор cron-заданий текущего пользователя.",ans:["crontab -e"],hint:"crontab -e",why:"crontab -l показывает список, -e редактирует."},
 {t:"f",d:2,q:"Допиши хвост строки crontab так, чтобы вывод и ошибки скрипта дописывались в один файл.",pre:"*/5 * * * * /opt/scripts/check.sh ___",ans:[">> /var/log/check.log 2>&1",">>/var/log/check.log 2>&1"],hint:"дописать в файл, потом привязать stderr",why:"Порядок обязателен: сначала >>, потом 2>&1."},
 {t:"c",d:3,q:"Напиши строку crontab: запускать /opt/scripts/sync.sh каждые 6 часов, с перенаправлением вывода и ошибок в /var/log/sync.log.",ans:["0 */6 * * * /opt/scripts/sync.sh >> /var/log/sync.log 2>&1"],hint:"0 */6 * * * команда >> лог 2>&1",why:"Первое поле минуты (0 — в начале часа), второе часы (*/6 — каждые шесть)."},
 {t:"c",d:4,q:"Оберни команду /opt/scripts/backup.sh в неблокирующую блокировку flock с файлом /var/lock/backup.lock, чтобы при занятой блокировке скрипт тихо завершался без ошибки.",ans:["flock -n /var/lock/backup.lock /opt/scripts/backup.sh || exit 0"],hint:"flock -n /путь команда || exit 0",why:"-n не ждёт освобождения. || exit 0 делает выход не ошибкой, а штатным пропуском."},
 {t:"c",d:5,q:"Инцидент. Ночной бэкап базы шёл дольше обычного из-за роста данных. В 03:00 запустился второй экземпляр поверх незавершённого, архив повреждён — обнаружили через две недели при попытке восстановления. Перепиши строку задания cron так, чтобы параллельный запуск стал невозможен. Исходная строка: 0 3 * * * /opt/scripts/backup.sh",ans:["0 3 * * * flock -n /var/lock/backup.lock /opt/scripts/backup.sh"],hint:"добавь flock -n перед командой",why:"flock технически исключает параллельный запуск. Второй системный вывод (отдельно от этого задания): бэкап проверяют тестовым восстановлением, а не отсутствием ошибок в логе."}]},

{id:"l8",t:"Пакеты, пользователи, sudo",goal:"Управлять системой, а не только смотреть на неё",
 cards:[
 {h:"apt install/update",b:"<pre>apt update                  <span class='c'># обновить индекс пакетов</span>\napt install -y nginx\napt remove nginx            <span class='c'># удалить, конфиги остаются</span>\napt purge nginx             <span class='c'># удалить вместе с конфигами</span></pre><p><b>Всегда <code>apt update</code> перед install</b> — без него используется устаревший индекс: пакет «не находится» или ставится версия с уже исправленной уязвимостью.</p><p><b>Зачем в жизни:</b> первое, что делаешь на свежем сервере — обновляешь индекс и ставишь нужные пакеты.</p>",
  cheat:"apt update && apt install -y пакет · apt purge удаляет и конфиги",
  t:{q:"Установи nginx на Ubuntu без интерактивных вопросов.",ans:["apt install -y nginx","sudo apt install -y nginx"],hint:"apt install -y",why:"-y отвечает «да» на все подтверждения автоматически."}},
 {h:"Пользователи, UID и группы",b:"<pre>adduser deploy\nusermod -aG sudo deploy\nid deploy                    <span class='c'># uid, gid и все группы</span></pre><p>Внутри системы пользователь — это число (UID), имя лишь подставляется из /etc/passwd.</p><p><b>Флаг -a обязателен.</b> <code>usermod -G sudo deploy</code> без него <i>заменяет</i> весь список групп — так люди отбирают у себя доступ.</p><p><b>Зачем в жизни:</b> выдать доступ к docker или sudo новому коллеге — рутинная задача, где забытый -a запирает человека снаружи сервера.</p>",
  cheat:"usermod -aG группа пользователь — ОБЯЗАТЕЛЬНО с -a, иначе группы заменятся",
  t:{q:"Добавь пользователя deploy в группу docker, сохранив его остальные группы.",ans:["usermod -aG docker deploy","sudo usermod -aG docker deploy"],hint:"флаги -a и G",why:"Без -a список групп будет полностью перезаписан."}},
 {h:"sudo и точечные права",b:"<pre>visudo   <span class='c'># безопасно править /etc/sudoers</span></pre><pre># /etc/sudoers.d/deploy\ndeploy ALL=(ALL) NOPASSWD: /bin/systemctl restart api</pre><p>Позволяет скрипту деплоя перезапускать один сервис без root на всё.</p><p><b>Правь sudoers только через visudo</b> — он проверяет синтаксис перед сохранением, ошибка блокирует sudo для всех.</p><p><b>Зачем в жизни:</b> CI должен уметь перезапустить сервис на проде, но не иметь полный root — так выдают точечные права.</p>",
  cheat:"visudo — безопасная правка sudoers, проверяет синтаксис перед сохранением"},
 {h:"Сервисные пользователи",b:"<pre>useradd -r -s /usr/sbin/nologin -M app</pre><p><code>-r</code> системный пользователь, <code>-s /usr/sbin/nologin</code> вход невозможен, <code>-M</code> без домашнего каталога.</p><p><b>Зачем в жизни:</b> приложение не должно работать от root. Если его скомпрометируют, атакующий не получит рабочую оболочку. Тот же принцип — USER в Dockerfile, runAsNonRoot в Kubernetes.</p>",
  cheat:"useradd -r -s /usr/sbin/nologin имя — сервисный пользователь без входа"}],
 ch:[
 {t:"c",d:1,q:"Разминка. Установи nginx без интерактивных подтверждений.",ans:["apt install -y nginx","sudo apt install -y nginx"],hint:"apt install -y",why:"Флаг -y отвечает да на все вопросы."},
 {t:"c",d:2,q:"Добавь пользователя deploy в группу docker, не потеряв остальные его группы.",ans:["usermod -aG docker deploy","sudo usermod -aG docker deploy"],hint:"-aG, не просто -G",why:"Без -a перезапишутся все группы пользователя."},
 {t:"c",d:3,q:"Обнови индекс пакетов и установи одной строкой через && пакеты nginx и curl.",ans:["apt update && apt install -y nginx curl","sudo apt update && sudo apt install -y nginx curl"],hint:"apt update && apt install -y пакет1 пакет2",why:"update перед install обязателен — иначе индекс устаревший."},
 {t:"c",d:4,q:"Создай системного сервисного пользователя app: без домашнего каталога, без возможности интерактивного входа.",ans:["useradd -r -s /usr/sbin/nologin -M app","sudo useradd -r -s /usr/sbin/nologin -M app"],hint:"useradd -r -s /usr/sbin/nologin -M имя",why:"-r системный, -s nologin запрещает вход, -M без домашнего каталога — три признака сервисного пользователя."},
 {t:"c",d:5,q:"Инцидент. Коллега на боевом сервере выполнил usermod -G docker deploy (без -a) и вышел из сессии — deploy выпал из sudo, других учёток с доступом нет. Восстановить доступ через консоль провайдера ты уже смог. Напиши правильную команду, которая добавила бы docker, сохранив sudo.",ans:["usermod -aG docker deploy","sudo usermod -aG docker deploy"],hint:"тот же флаг -a, которого не хватило",why:"Именно отсутствие -a стёрло группу sudo. Правило на будущее: при любых изменениях доступа держать вторую сессию открытой до проверки."}]},

{id:"l9",t:"Vim: выжить и отредактировать",goal:"Править конфиг на сервере, где нет твоего редактора",
 cards:[
 {h:"Почему это обязательный навык",b:"<p><code>vi</code> входит в базовую поставку практически любой Unix-системы. В минимальном контейнере может не быть ничего, кроме vi.</p><p><b>Зачем в жизни:</b> продакшен лежит, нужно поправить строку в конфиге, на экране vim, который не реагирует на набор текста. Базовый набор из десяти команд закрывает эту ситуацию полностью.</p>"},
 {h:"Два режима — вся суть",b:"<pre>i     <span class='c'># вставка перед курсором</span>\na     <span class='c'># вставка после курсора</span>\nEsc   <span class='c'># вернуться в командный режим</span></pre><p>Vim открывается в командном режиме: буквы — команды, а не текст. Чтобы печатать, нужно перейти в режим вставки.</p><p><b>Правило выживания:</b> если непонятно, что происходит — нажми Esc. Это возвращает в известное состояние из любого режима.</p>",
  cheat:"i вставка · Esc командный режим — при потере ориентации всегда Esc",
  t:{q:"Ты в vim, экран издаёт звуки при наборе текста — ты в командном режиме. Какую клавишу нажать, чтобы перейти в режим вставки?",ans:["i","a"],hint:"одна буква",why:"i вставляет перед курсором. Esc всегда возвращает обратно в командный режим."}},
 {h:"Выйти, сохранить, не потерять",b:"<pre>:wq    <span class='c'># сохранить и выйти</span>\n:q!    <span class='c'># выйти, отбросив изменения</span></pre><p>Команды с двоеточием набираются в командном режиме.</p><p><b>Приём, спасавший тысячи людей:</b> открыл системный конфиг без sudo, всё отредактировал, записать не можешь — <code>:w !sudo tee %</code> передаёт буфер в tee от root. На будущее лучше сразу <code>sudoedit файл</code>.</p>",
  cheat:":wq сохранить и выйти · :q! выйти без сохранения · :w !sudo tee % записать без прав",
  t:{q:"Ты внёс правки и хочешь сохранить файл и выйти из vim одной командой.",a:[":wq — сохранить и выйти",":q! — выйти без сохранения","dd — удалить строку","yy — скопировать строку"],c:0,why:":wq записывает изменения и закрывает файл."}},
 {h:"Замена по файлу",b:"<pre>:%s/8080/3000/g     <span class='c'># все вхождения во всём файле</span></pre><p><code>%</code> весь файл, <code>s</code> замена, <code>g</code> все вхождения в строке (без него — только первое). Синтаксис совпадает с sed.</p><p><b>Зачем в жизни:</b> массовая правка порта или адреса во всём конфиге — секундное дело вместо построчного редактирования.</p>",
  cheat:":%s/старое/новое/g — замена по всему файлу, все вхождения",
  t:{q:"Замени во всём открытом файле все вхождения 8080 на 3000.",ans:[":%s/8080/3000/g"],hint:"% весь файл, g все вхождения",why:"Без g заменится только первое вхождение в каждой строке."}},
 {h:"Номера строк для быстрой навигации",b:"<pre>:set nu   <span class='c'># показать номера строк</span>\n:42       <span class='c'># перейти к строке 42</span></pre><p><b>Зачем в жизни:</b> <code>nginx -t</code> сообщает «ошибка в строке 42» — с включённой нумерацией ты попадаешь туда мгновенно вместо пролистывания.</p>",
  cheat:":set nu номера строк · :42 перейти к строке 42",
  t:{q:"nginx -t сообщил об ошибке в строке 42. Включи нумерацию строк в vim.",ans:[":set nu",":set number"],hint:":set nu",why:"Дальше :42 переносит курсор сразу на нужную строку."}}],
 ch:[
 {t:"c",d:1,q:"Разминка. Ты в vim в командном режиме. Какой командой сохранить файл и выйти?",ans:[":wq",":x"],hint:"двоеточие, w, q",why:":wq — стандартный способ сохранить и выйти."},
 {t:"c",d:2,q:"Внесённые правки нужно отбросить и выйти без сохранения.",ans:[":q!"],hint:"двоеточие, q, восклицательный знак",why:"! означает «принудительно», отбрасывая несохранённые изменения."},
 {t:"c",d:3,q:"В открытом файле замени все вхождения слова old на new по всему файлу.",ans:[":%s/old/new/g"],hint:":%s/что/на что/g",why:"% — весь файл, g — все вхождения в каждой строке."},
 {t:"c",d:4,q:"Замени в открытом конфиге все вхождения порта 8080 на 3000 только в строках с 1 по 20.",ans:[":1,20s/8080/3000/g"],hint:"диапазон строк перед s",why:"Диапазон 1,20 ограничивает область замены — полезно, когда 8080 встречается и в других, не нужных местах файла."},
 {t:"c",d:5,q:"Инцидент. Ты открыл /etc/nginx/nginx.conf без sudo, внёс двадцать правок, и :w отвечает «Read-only file». Терять правки нельзя. Напиши команду, которая запишет буфер в файл через sudo.",ans:[":w !sudo tee %",":w !sudo tee % > /dev/null"],hint:":w !sudo tee %",why:"% — текущий файл. Команда передаёт содержимое буфера в tee, запущенный от root, минуя необходимость переоткрывать файл."}]},

{id:"l10",t:"Текстовые потоки: sed, awk, пайпы",goal:"Обрабатывать логи и вывод, не открывая редактор",
 cards:[
 {h:"Три потока",b:"<p>У каждого процесса три стандартных потока: 0 stdin (вход), 1 stdout (вывод), 2 stderr (ошибки).</p><p>Разделение позволяет передать данные дальше по конвейеру, а ошибки оставить человеку.</p><p><b>Зачем в жизни:</b> именно поэтому grep в пайпе не засоряется предупреждениями предыдущей команды.</p>"},
 {h:"Перенаправление и порядок операций",b:"<pre>cmd &gt; out.log         <span class='c'># stdout в файл, перезапись</span>\ncmd &gt;&gt; out.log        <span class='c'># дописать</span>\ncmd &gt; all.log 2&gt;&amp;1    <span class='c'># оба потока в один файл</span></pre><p><b>Порядок критичен:</b> <code>&gt; file 2&gt;&amp;1</code> — сначала stdout в файл, потом stderr туда же. Обратный порядок оставит ошибки на экране.</p><p><b>Зачем в жизни:</b> половина скриптов теряет сообщения об ошибках именно из-за перепутанного порядка.</p>",
  cheat:"cmd > file 2>&1 — сначала stdout в файл, потом stderr туда же (порядок важен)",
  t:{q:"Запусти скрипт ./deploy.sh так, чтобы и обычный вывод, и ошибки попали в один файл deploy.log.",ans:["./deploy.sh > deploy.log 2>&1","./deploy.sh &> deploy.log"],hint:"сначала > файл, потом 2>&1",why:"Порядок обязателен: 2>&1 копирует текущее назначение stdout."}},
 {h:"sed — потоковый редактор",b:"<pre>sed 's/old/new/g' f         <span class='c'># все вхождения</span>\nsed -i.bak 's/8080/3000/g' app.conf   <span class='c'># на месте, с бэкапом</span></pre><p><code>-i</code> изменяет файл на месте, <code>-i.bak</code> сохраняет оригинал.</p><p><b>Зачем в жизни:</b> массовая замена в конфиге без открытия редактора — типовая задача деплой-скриптов. На проде сначала прогоняют без -i, смотрят вывод, потом добавляют флаг.</p>",
  cheat:"sed -i.bak 's/старое/новое/g' файл — замена на месте с резервной копией",
  t:{q:"Замени в файле app.conf все вхождения 8080 на 3000 прямо в файле, сохранив резервную копию с суффиксом .bak.",ans:["sed -i.bak s/8080/3000/g app.conf","sed -i.bak 's/8080/3000/g' app.conf"],hint:"sed -i.bak 's/…/…/g' файл",why:"-i.bak создаёт app.conf.bak с исходным содержимым перед заменой."}},
 {h:"awk — работа по колонкам",b:"<pre>awk '{print $1}' access.log            <span class='c'># первая колонка</span>\nawk '$9 == 500 {print $7}' access.log <span class='c'># URL, где код 500</span></pre><p><code>$1</code>, <code>$2</code> — колонки, <code>$0</code> — вся строка. Условие перед блоком фильтрует строки.</p><p><b>Зачем в жизни:</b> вытащить IP или код ответа из access.log — задача на awk, а не на визуальный просмотр.</p>",
  cheat:"awk '{print $N}' файл — колонка номер N (разделитель — пробел)",
  t:{q:"Выведи первую колонку (IP-адреса) из файла access.log.",ans:["awk '{print $1}' access.log"],hint:"awk '{print $1}' файл",why:"$1 — первая колонка при разделении по пробелам."}},
 {h:"Классический однострочник: топ по частоте",b:"<pre>awk '{print $1}' access.log | sort | uniq -c | sort -rn | head</pre><p>Колонка → sort ставит одинаковые рядом → uniq -c считает повторы → sort -rn по убыванию → head верхушка.</p><p><b>Почему sort обязателен:</b> uniq схлопывает только соседние одинаковые строки. Без сортировки счётчики будут неверными, и команда отработает без ошибки — получишь правдоподобные, но неправильные числа.</p><p><b>Зачем в жизни:</b> «топ-10 IP по числу запросов» — ровно эта команда, дословно то, что спрашивают на собеседовании.</p>",
  cheat:"колонка | sort | uniq -c | sort -rn | head — топ по частоте, sort перед uniq обязателен"}],
 ch:[
 {t:"c",d:1,q:"Разминка. Выведи первую колонку файла access.log.",ans:["awk '{print $1}' access.log"],hint:"awk '{print $1}'",why:"$1 — первая колонка при разделении по пробелам."},
 {t:"c",d:2,q:"Запусти скрипт ./deploy.sh так, чтобы весь вывод (и обычный, и ошибки) записался в файл deploy.log.",ans:["./deploy.sh > deploy.log 2>&1","./deploy.sh &> deploy.log"],hint:"> файл 2>&1",why:"Порядок обязателен: сначала stdout в файл, потом stderr туда же."},
