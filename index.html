{id:"l11",t:"Ссылки, архивы, специальные права",goal:"Разобраться в том, что выглядит магией",
 cards:[
 {h:"Inode: имя и содержимое — разные вещи",b:"<p>Файл в Linux — это <b>inode</b> (запись с данными, правами, размером) плюс одно или несколько имён в каталогах. Имя — просто ссылка на inode.</p><pre>ls -i file.txt    <span class='c'># номер inode</span>\nln file.txt hard  <span class='c'># второе имя того же inode</span>\nln -s /opt/app/v2 current   <span class='c'># символическая ссылка на путь</span></pre><div class='tw'><table><tr><th></th><th>hard link</th><th>symlink</th></tr><tr><td>указывает на</td><td>inode (данные)</td><td>путь (строку)</td></tr><tr><td>удалили оригинал</td><td>данные живы</td><td>ссылка «повисла»</td></tr><tr><td>между разделами</td><td>нельзя</td><td>можно</td></tr><tr><td>на каталог</td><td>нельзя</td><td>можно</td></tr></table></div>"},
 {h:"Симлинк как механизм деплоя",b:"<pre>/opt/app/releases/2025-02-10/\n/opt/app/releases/2025-02-12/\n/opt/app/current -&gt; releases/2025-02-12</pre><p>Выкатка: распаковали новый релиз рядом, переключили ссылку, перезапустили сервис. Откат — переключить ссылку обратно, это доли секунды.</p><pre>ln -sfn /opt/app/releases/2025-02-10 /opt/app/current</pre><p><code>-f</code> перезаписать, <code>-n</code> не заходить внутрь существующей ссылки-каталога. Без <code>-n</code> получишь вложенную ссылку внутри старой — классическая ошибка скриптов деплоя.</p>"},
 {h:"tar: create, extract, list",b:"<pre>tar czf backup.tar.gz /var/www    <span class='c'># c=create z=gzip f=file</span>\ntar tzf backup.tar.gz | head      <span class='c'># t=list: посмотреть, не распаковывая</span>\ntar xzf backup.tar.gz -C /restore <span class='c'># x=extract, -C куда</span></pre><p>Мнемоника: <b>c</b>reate, e<b>x</b>tract, lis<b>t</b>. <code>z</code> — gzip, <code>j</code> — bzip2, <code>J</code> — xz.</p><p><b>Всегда сначала <code>t</code>.</b> Если архив собран без общего каталога внутри, распаковка разбросает сотни файлов по текущему каталогу — убирать придётся руками.</p>"},
 {h:"Специальные биты",b:"<div class='tw'><table><tr><th>бит</th><th>цифра</th><th>смысл</th></tr><tr><td>SUID</td><td>4xxx</td><td>программа выполняется от имени владельца файла</td></tr><tr><td>SGID</td><td>2xxx</td><td>на каталоге: новые файлы наследуют его группу</td></tr><tr><td>sticky</td><td>1xxx</td><td>в общем каталоге удалять файл может только его владелец</td></tr></table></div><p>Так работает <code>passwd</code>: обычный пользователь меняет <code>/etc/shadow</code>, потому что у бинарника SUID и владелец root. И так устроен <code>/tmp</code>: права <code>drwxrwxrwt</code> — писать могут все, удалять только свои файлы.</p><pre>find / -perm -4000 -type f 2&gt;/dev/null   <span class='c'># все SUID-файлы</span></pre><p>Этот список — обязательный пункт аудита: уязвимость в SUID-бинаре даёт локальный root.</p>"}],
 ch:[
 {t:"q",d:1,q:"Удалили файл, на который указывал symlink. Что стало со ссылкой?",a:["Удалилась вместе с файлом","Осталась, но стала битой — указывает в никуда","Превратилась в обычный файл","Ничего не изменилось"],c:1,why:"Symlink хранит путь, а не данные. Hard link в этой ситуации сохранил бы содержимое: он указывает на inode."},
 {t:"c",d:2,q:"Посмотри содержимое архива backup.tar.gz, не распаковывая его.",ans:["tar tzf backup.tar.gz","tar -tzf backup.tar.gz","tar tf backup.tar.gz"],hint:"t = list",why:"Проверка перед распаковкой показывает, лежат ли файлы внутри общего каталога или разлетятся по текущему."},
 {t:"c",d:2,q:"Создай символическую ссылку /opt/app/current на каталог /opt/app/releases/v2.",ans:["ln -s /opt/app/releases/v2 /opt/app/current"],hint:"ln -s цель имя_ссылки",why:"Порядок аргументов: сначала куда указываем, потом имя ссылки. Перепутал — создал ссылку не в том месте."},
 {t:"q",d:3,q:"Почему <code>/tmp</code> имеет права <code>drwxrwxrwt</code>?",a:["Это опечатка в системе","Sticky bit: писать могут все, но удалять — только владелец своего файла","Каталог доступен только для чтения","Так помечены временные файлы"],c:1,why:"Без sticky bit любой пользователь удалял бы чужие временные файлы. Буква t стоит на месте x у «остальных»."},
 {t:"q",d:4,q:"Скрипт деплоя выполняет <code>ln -sf /opt/app/releases/new /opt/app/current</code>, и после нескольких выкаток появляется <code>current/new/new/...</code>. Что не так?",a:["Нужен ключ -r","Не хватает <code>-n</code>: без него ln заходит внутрь существующей ссылки-каталога и создаёт ссылку там","Права на каталог","Симлинки нельзя перезаписывать"],c:1,why:"Правильная форма — ln -sfn. Ошибка коварна тем, что первый деплой проходит нормально, а ломается со второго."},
 {t:"q",d:5,q:"<b>Инцидент.</b> Аудит нашёл в системе бинарник <code>/opt/tools/backup</code> с правами <code>-rwsr-xr-x root root</code>. Разработчик объясняет: «иначе скрипт бэкапа не мог читать чужие файлы». Чем это опасно и что предложить?",a:["Ничем, это нормальная практика","Любой пользователь выполняет этот код от root — уязвимость в нём даёт полный контроль над сервером; правильно точечное правило sudoers или отдельный сервисный пользователь с нужной группой","Надо просто сменить владельца на пользователя","Достаточно убрать право чтения"],c:1,why:"SUID превращает каждую ошибку в программе в повышение привилегий. Задача «дать доступ к чужим файлам» решается группами и sudoers, а не битом s."}]},

{id:"l12",t:"Процессы вглубь: состояния и приоритеты",goal:"Читать состояние системы, а не гадать",
 cards:[
 {h:"Состояния процессов",b:"<div class='tw'><table><tr><th>код</th><th>состояние</th><th>что значит на практике</th></tr><tr><td>R</td><td>running</td><td>выполняется или готов выполняться</td></tr><tr><td>S</td><td>sleeping</td><td>ждёт события — нормальное состояние большинства</td></tr><tr><td>D</td><td>uninterruptible</td><td>ждёт диск или сеть; <b>не убивается даже -9</b></td></tr><tr><td>Z</td><td>zombie</td><td>завершился, родитель не забрал код возврата</td></tr><tr><td>T</td><td>stopped</td><td>приостановлен сигналом</td></tr></table></div><p>Массовые <b>D</b>-процессы — признак умирающего диска или отвалившегося сетевого хранилища. Лечится устранением причины ввода-вывода, а не убийством процессов.</p><p><b>Z</b>-процесс сам ресурсов почти не ест, но толпа зомби означает сломанного родителя. В контейнерах решается процессом-init (<code>--init</code>, tini).</p>"},
 {h:"Приоритеты",b:"<pre>nice -n 10 ./heavy.sh    <span class='c'># запустить с пониженным приоритетом</span>\nrenice -n 5 -p 4210      <span class='c'># изменить у работающего</span></pre><p>Шкала nice: от <b>−20</b> (самый приоритетный, только root) до <b>19</b> (самый уступчивый). Значение по умолчанию 0.</p><p>Практика: тяжёлые фоновые задачи (бэкап, переиндексация, архивирование) запускают с <code>nice 10–19</code>, чтобы они не мешали обслуживать пользователей.</p>"},
 {h:"cgroups: чем ядро ограничивает ресурсы",b:"<p><b>cgroups</b> (control groups) — механизм ядра, ограничивающий группу процессов по CPU, памяти и вводу-выводу. На нём построено всё современное:</p><ul><li><code>MemoryMax=512M</code> и <code>CPUQuota=50%</code> в systemd-юните</li><li><code>mem_limit</code> у Docker-контейнера</li><li><code>resources.limits</code> в Kubernetes</li></ul><p>Когда ты ставишь лимит памяти поду, ты в конечном счёте настраиваешь cgroup. Превышение лимита памяти = <b>OOMKilled</b>, превышение CPU = троттлинг (процесс тормозят, но не убивают).</p><p>Вместе с <b>namespaces</b> (что процесс видит) cgroups (сколько ему можно) и составляют контейнер.</p>"},
 {h:"Лимиты пользователя",b:"<pre>ulimit -n        <span class='c'># лимит открытых файлов в текущей сессии</span>\nulimit -a        <span class='c'># все лимиты</span></pre><p>Ошибка <code>Too many open files</code> — это упёрлись в лимит дескрипторов. Для сервисов правильное место лечения — юнит systemd (<code>LimitNOFILE=65535</code>), а не ручной ulimit в сессии: он действует только до выхода.</p>"}],
 ch:[
 {t:"q",d:1,q:"Что означает состояние процесса <code>Z</code>?",a:["Процесс спит","Зомби: завершился, но родитель не забрал код возврата","Процесс заблокирован","Наивысший приоритет"],c:1,why:"Зомби сам по себе почти безвреден, но их накопление означает, что родительский процесс не обрабатывает завершение потомков."},
 {t:"c",d:2,q:"Отправь процессу 711 сигнал «перечитать конфигурацию».",ans:["kill -1 711","kill -hup 711","kill -sighup 711","kill -s hup 711"],hint:"номер 1 или HUP",why:"Многие демоны по SIGHUP перечитывают конфиг без перезапуска и без разрыва соединений."},
 {t:"q",d:3,q:"Процесс висит в состоянии D и не убивается даже <code>kill -9</code>. Почему?",a:["Он защищён системой","Непрерываемый сон: ждёт ответа от диска или сети, и ядро не может его прервать","У тебя нет прав","Это баг ядра"],c:1,why:"Сигнал доставится только когда операция ввода-вывода завершится. Смотреть надо на носитель или сетевое хранилище, а не на сам процесс."},
 {t:"q",d:3,q:"Тяжёлый бэкап мешает пользователям. Что сделать, не останавливая его?",a:["kill -9","<code>renice -n 15 -p PID</code> — понизить приоритет работающего процесса","Перезапустить сервер","Увеличить память"],c:1,why:"nice/renice позволяют фоновой задаче доработать, уступая процессор пользовательским запросам. Для дисковой нагрузки есть ionice."},
 {t:"q",d:4,q:"Приложение падает с ошибкой <code>Too many open files</code>. Где чинить правильно?",a:["Выполнить ulimit -n 65535 в своей сессии","Задать <code>LimitNOFILE=65535</code> в systemd-юните сервиса","Перезагрузить сервер","Уменьшить число пользователей"],c:1,why:"ulimit в сессии действует только до выхода и не влияет на сервис, запущенный systemd. Лимиты сервиса живут в его юните."},
 {t:"q",d:5,q:"<b>Инцидент.</b> Под в Kubernetes регулярно перезапускается, в событиях <code>OOMKilled</code>, код выхода 137. Разработчик уверяет, что «памяти на ноде полно». Кто прав и что происходит на уровне ядра?",a:["Разработчик прав, это баг Kubernetes","Свободная память ноды не важна: контейнер превысил лимит своей cgroup, и ядро убило процесс — поднимать нужно limits или чинить потребление","Нужно перезапустить kubelet","Проблема в сети"],c:1,why:"Лимит пода — это cgroup-лимит, а не доля от памяти ноды. 137 = 128 + 9 (SIGKILL). Отсюда и разница с CPU: его превышение даёт троттлинг, а память убивают сразу."}]},

{id:"l13",t:"Диски, монтирование, LVM",goal:"Добавить место, не уронив сервер",
 cards:[
 {h:"Что где лежит",b:"<pre>lsblk        <span class='c'># дерево дисков и разделов</span>\ndf -h        <span class='c'># занятость смонтированных ФС</span>\ndf -i        <span class='c'># занятость inode</span>\nblkid        <span class='c'># UUID разделов</span>\nmount /dev/sdb1 /mnt\numount /mnt</pre><p><b>Коварный случай:</b> <code>df -h</code> показывает свободное место, а система пишет «No space left on device». Смотри <code>df -i</code>: закончились inode — их число фиксировано при создании файловой системы, и миллионы мелких файлов (сессии, кэш, письма) исчерпывают лимит раньше, чем байты.</p>"},
 {h:"fstab и постоянное монтирование",b:"<pre># /etc/fstab\nUUID=9f2c-1ab4  /data  ext4  defaults,noatime  0 2</pre><p>Монтируй по <b>UUID</b>, а не по <code>/dev/sdb1</code>: имена устройств зависят от порядка обнаружения и меняются при добавлении диска.</p><p><b>Правило выживания:</b> после правки fstab обязательно выполни <code>mount -a</code>. Если строка ошибочна, ты узнаешь об этом сейчас, а не при следующей загрузке, когда сервер уйдёт в аварийный режим и перестанет пускать по SSH.</p>"},
 {h:"LVM: место без перезагрузки",b:"<p>LVM добавляет слой между дисками и файловой системой: физические тома (PV) собираются в группу (VG), из неё нарезаются логические тома (LV).</p><pre>pvcreate /dev/sdc            <span class='c'># сделать диск физическим томом</span>\nvgextend vg0 /dev/sdc        <span class='c'># добавить в группу</span>\nlvextend -L +50G /dev/vg0/data\nresize2fs /dev/vg0/data      <span class='c'># растянуть файловую систему (ext4)</span>\nxfs_growfs /data             <span class='c'># то же для xfs</span></pre><p><b>Два слоя — два действия.</b> Расширил том, но забыл файловую систему — место «есть», а <code>df</code> его не видит.</p>"},
 {h:"Снапшоты LVM",b:"<pre>lvcreate -L 5G -s -n db_snap /dev/vg0/db</pre><p>Мгновенный снимок состояния тома. Делается перед рискованным обновлением или миграцией БД: если что-то пошло не так, откат занимает секунды вместо восстановления из бэкапа за часы.</p><p>Снапшот — не бэкап: он живёт на том же диске и исчезнет вместе с ним. Это инструмент короткого отката, а не резервного копирования.</p>"}],
 ch:[
 {t:"c",d:1,q:"Покажи дерево блочных устройств и разделов.",ans:["lsblk","lsblk -f"],hint:"list block devices",why:"lsblk сразу показывает, какие диски есть, как они разбиты и куда смонтированы."},
 {t:"q",d:2,q:"<code>df -h</code> показывает 40% занято, но приложение пишет «No space left on device». Что проверить?",a:["Права доступа","<code>df -i</code> — свободные inode","Оперативную память","Сетевое соединение"],c:1,why:"Inode кончаются раньше байтов, когда файлов миллионы. Лечится чисткой мелочи или пересозданием ФС с другими параметрами."},
 {t:"c",d:3,q:"Ты поправил /etc/fstab. Проверь, что все записи корректны, прямо сейчас.",ans:["mount -a","sudo mount -a"],hint:"mount + флаг all",why:"Единственная защита от «сервер не поднялся после перезагрузки из-за одной строки в fstab»."},
 {t:"q",d:3,q:"Почему в fstab указывают UUID вместо <code>/dev/sdb1</code>?",a:["Так короче","Имена устройств зависят от порядка обнаружения и могут поменяться — сервер не загрузится","Быстрее монтируется","Требование ext4"],c:1,why:"Добавили диск — порядок сместился, /dev/sdb1 стал другим разделом. UUID привязан к самой файловой системе."},
 {t:"q",d:4,q:"Расширили логический том LVM на 50 ГБ, но <code>df -h</code> показывает прежний размер. Что забыли?",a:["Перезагрузиться","Растянуть файловую систему: <code>resize2fs</code> для ext4 или <code>xfs_growfs</code> для xfs","Пересоздать раздел","Смонтировать заново"],c:1,why:"LVM и файловая система — независимые слои. Расширять нужно оба, именно в этом порядке."},
 {t:"q",d:5,q:"<b>Инцидент.</b> Ночью раздел с базой заполнился, база встала. В группе томов есть 100 ГБ свободного места. Нужно вернуть сервис максимально быстро и без остановки. Порядок действий?",a:["Перезагрузить сервер и надеяться","<code>lvextend -L +50G</code> на том базы, затем <code>resize2fs</code>/<code>xfs_growfs</code> — расширение идёт онлайн, без размонтирования","Удалить логи базы","Скопировать базу на другой сервер"],c:1,why:"Расширение LVM и современных ФС выполняется на смонтированном томе. Это и есть главный аргумент за LVM: место добавляется под нагрузкой. После стабилизации — разобраться, почему выросло потребление, и поставить алерт на 80%."}]},

{id:"l14",t:"Логи системы и ротация",goal:"Не утонуть в логах и не потерять нужное",
 cards:[
 {h:"journald и rsyslog",b:"<pre>journalctl -u nginx --since \"1 hour ago\"\njournalctl -p err -b          <span class='c'># только ошибки текущей загрузки</span>\njournalctl -f                 <span class='c'># живой поток</span>\njournalctl --since \"09:30\" --until \"10:00\"\njournalctl --disk-usage\njournalctl --vacuum-time=7d   <span class='c'># почистить старше недели</span></pre><p><b>journald</b> — бинарный журнал systemd с фильтрами по юниту, приоритету и времени. <b>rsyslog</b> — классические текстовые файлы в <code>/var/log</code> и пересылка на удалённый сервер. На современных серверах работают оба.</p><p>Приоритеты (<code>-p</code>): emerg, alert, crit, err, warning, notice, info, debug.</p>"},
 {h:"logrotate",b:"<pre># /etc/logrotate.d/myapp\n/var/log/myapp/*.log {\n  daily\n  rotate 14\n  size 100M\n  compress\n  delaycompress\n  missingok\n  notifempty\n  copytruncate\n}</pre><div class='tw'><table><tr><th>опция</th><th>смысл</th></tr><tr><td><code>rotate 14</code></td><td>хранить 14 архивов</td></tr><tr><td><code>size 100M</code></td><td>вращать и по размеру, не только по расписанию</td></tr><tr><td><code>compress</code></td><td>сжимать старые</td></tr><tr><td><code>copytruncate</code></td><td>скопировать и обнулить файл на месте</td></tr></table></div><pre>logrotate -d /etc/logrotate.d/myapp   <span class='c'># сухой прогон</span></pre>"},
 {h:"Зачем copytruncate",b:"<p>Обычная ротация переименовывает файл и создаёт новый. Приложение, которое держит файл открытым и <b>не умеет переоткрывать его по сигналу</b>, продолжит писать в переименованный (а потом удалённый) файл.</p><p>Результат: <code>df</code> показывает переполненный диск, <code>du</code> ничего не находит — та самая ситуация с удалённым файлом, который держит процесс.</p><p><code>copytruncate</code> копирует содержимое и обнуляет исходный файл, не меняя inode. Приложение продолжает писать в тот же дескриптор. Цена — крошечное окно, в котором несколько строк могут потеряться.</p>"},
 {h:"Уровни логирования и цена",b:"<p>На проде обычно <code>info</code>, в отладке <code>debug</code>. <b>Не оставляй debug включённым надолго</b> по двум причинам: он съедает диск и часто пишет тела запросов, токены и персональные данные.</p><p>Лог с секретами приравнивается к утечке секретов: его читают шире, чем боевую базу, и он уезжает во внешние системы хранения.</p><p>Ограничивать объём заранее: <code>SystemMaxUse=1G</code> в <code>/etc/systemd/journald.conf</code>, срок хранения и семплирование шумных событий.</p>"}],
 ch:[
 {t:"c",d:1,q:"Покажи журнал сервиса nginx.",ans:["journalctl -u nginx"],hint:"journalctl -u юнит",why:"-u фильтрует по конкретному юниту. Добавь -f для живого потока и --since для окна времени."},
 {t:"c",d:2,q:"Покажи только ошибки из журнала за текущую загрузку системы.",ans:["journalctl -p err -b","journalctl -b -p err","journalctl -p 3 -b"],hint:"-p приоритет, -b текущая загрузка",why:"Быстрый способ увидеть, что сломано, не читая мегабайты info-сообщений."},
 {t:"q",d:3,q:"Журнал journald занял 8 ГБ. Как решить проблему по-инженерному?",a:["Удалить /var/log целиком","Почистить (<code>journalctl --vacuum-time=7d</code>) и ограничить на будущее через SystemMaxUse в journald.conf","Отключить логирование","Перезагрузить сервер"],c:1,why:"Разовая чистка без ограничения приведёт к повторению через месяц. Лечим и симптом, и причину."},
 {t:"q",d:4,q:"Зачем в конфигурации logrotate опция <code>copytruncate</code>?",a:["Ускоряет ротацию","Для приложений, не умеющих переоткрывать лог: файл копируется и обнуляется на месте, inode не меняется","Улучшает сжатие","Удаляет старые архивы"],c:1,why:"Иначе процесс продолжит писать в переименованный или удалённый файл: df покажет полный диск, du ничего не найдёт."},
 {t:"q",d:4,q:"На проде месяц работает уровень логирования debug. Чем это плохо, кроме объёма?",a:["Ничем","В debug попадают тела запросов, токены и персональные данные — это утечка","Замедляется диск","Ломается ротация"],c:1,why:"Логи распространяются шире, чем база: их видят разработчики, они уезжают в системы хранения и бэкапы. Секрет в логе считается скомпрометированным."},
 {t:"q",d:5,q:"<b>Инцидент.</b> Диск заполнен логами. Ты удалил старые файлы <code>rm /var/log/app/*.log.1</code>, но <code>df -h</code> по-прежнему показывает 100%, хотя <code>du</code> насчитал вдвое меньше. Что произошло и что делать?",a:["Файловая система повреждена, нужен fsck","Процесс держит открытыми удалённые файлы: найти через <code>lsof | grep deleted</code> и перезапустить сервис; на будущее настроить logrotate с copytruncate","Нужно удалить ещё файлов","Помогут только новые диски"],c:1,why:"Ядро освобождает блоки только после закрытия последнего дескриптора. Расхождение df и du — точный признак. Причина же системная: не настроена корректная ротация."}]},

{id:"l15",t:"Сеть изнутри",goal:"Понять, докуда доходит пакет",
 cards:[
 {h:"Адреса и маршруты",b:"<pre>ip a                 <span class='c'># адреса интерфейсов</span>\nip r                 <span class='c'># таблица маршрутизации</span>\nip r get 8.8.8.8     <span class='c'># каким маршрутом пойдёт пакет</span>\nresolvectl status    <span class='c'># какие DNS-серверы используются</span></pre><p>В выводе <code>ip r</code> ищи строку <b>default</b> — это шлюз по умолчанию. Его отсутствие означает «интернета нет», хотя интерфейс поднят и локальная сеть работает.</p><p><code>ifconfig</code> и <code>netstat</code> устарели, их заменили <code>ip</code> и <code>ss</code>. Упоминание современных команд на собеседовании — маленький, но заметный плюс.</p>"},
 {h:"Диагностика по слоям — снизу вверх",b:"<div class='tw'><table><tr><th>слой</th><th>инструмент</th><th>что проверяет</th></tr><tr><td>L3 связность</td><td><code>ping</code></td><td>доходит ли пакет до хоста</td></tr><tr><td>маршрут</td><td><code>traceroute</code>, <code>mtr</code></td><td>где теряется и на каком узле</td></tr><tr><td>L4 порт</td><td><code>nc -zv</code>, <code>ss -tulpn</code></td><td>слушает ли сервис, открыт ли порт</td></tr><tr><td>TLS</td><td><code>curl -v</code>, <code>openssl s_client</code></td><td>сертификат и рукопожатие</td></tr><tr><td>L7 приложение</td><td><code>curl -I</code></td><td>код ответа и заголовки</td></tr></table></div><p>Двигаясь снизу вверх, ты за пять команд сужаешь проблему до одного слоя вместо перебора гипотез.</p>"},
 {h:"Что означают ответы",b:"<ul><li><b>Connection refused</b> — до хоста дошли, но порт никто не слушает. Сервис не запущен или слушает другой адрес.</li><li><b>Connection timed out</b> — ответа нет вовсе: фильтрует фаервол или неверный маршрут.</li><li><b>No route to host</b> — маршрут отсутствует или сеть недоступна.</li><li><b>Name or service not known</b> — проблема DNS, до сети дело не дошло.</li></ul><p>Различие между «refused» и «timeout» — самая полезная развилка в сетевой диагностике: первое ведёт к сервису, второе к фильтрации.</p>"},
 {h:"Слушает ли сервис нужный адрес",b:"<pre>ss -tulpn | grep 5432\ntcp LISTEN 0 128 127.0.0.1:5432 users:((\"postgres\",pid=820))</pre><p>Обрати внимание на адрес слева от порта:</p><ul><li><code>127.0.0.1:5432</code> — только локально, снаружи не подключиться (для БД это правильно)</li><li><code>0.0.0.0:5432</code> — на всех интерфейсах, доступен из сети</li></ul><p>Частая ситуация: «порт открыт в фаерволе, а не работает» — сервис слушает только localhost.</p>"},
 {h:"Передача файлов",b:"<pre>scp file.tar.gz user@host:/opt/\nrsync -avz ./dist/ user@host:/var/www/\nrsync -avz --delete --dry-run ./dist/ user@host:/var/www/</pre><p><code>rsync</code> лучше <code>scp</code>: передаёт только изменения, докачивает, сохраняет права.</p><p><b>Слеш в конце источника решает всё:</b> <code>dist/</code> копирует <i>содержимое</i> каталога, <code>dist</code> — сам каталог внутрь приёмника. Это самая частая ошибка с rsync.</p><p><code>--delete</code> удаляет на приёмнике то, чего нет в источнике — мощно и опасно, поэтому сначала <code>--dry-run</code>.</p>"}],
 ch:[
 {t:"c",d:1,q:"Покажи таблицу маршрутизации современной командой.",ans:["ip r","ip route","ip route show","ip -4 r"],hint:"две буквы после ip",why:"Ищи строку default — это шлюз по умолчанию. Без него наружу пакеты не уйдут."},
 {t:"c",d:2,q:"Проверь, какие порты слушаются и какими процессами.",ans:["ss -tulpn","ss -tulnp","sudo ss -tulpn","netstat -tulpn"],hint:"ss + четыре флага",why:"t=tcp, u=udp, l=listening, p=процесс, n=числовые порты. Смотри не только на порт, но и на адрес слева от него."},
 {t:"q",d:3,q:"<code>nc -zv host 5432</code> отвечает «Connection refused». Что это говорит?",a:["Пакеты фильтрует фаервол","До хоста дошли, но порт никто не слушает — сервис не запущен или слушает другой адрес","Не резолвится имя","Нет маршрута"],c:1,why:"Refused означает активный отказ, то есть связность есть. Таймаут, наоборот, указывает на фильтрацию — это ключевая развилка диагностики."},
 {t:"q",d:4,q:"Порт 5432 разрешён в фаерволе, приложение с другого сервера не подключается, <code>ss -tulpn</code> показывает <code>127.0.0.1:5432</code>. В чём причина?",a:["Фаервол всё-таки блокирует","Сервис слушает только localhost — снаружи к нему подключиться нельзя, нужно менять адрес привязки в конфиге","Проблема в DNS","Порт занят другим процессом"],c:1,why:"Правильное решение здесь — не открывать БД наружу, а ходить через приватную сеть или SSH-туннель. Но понимать разницу между 127.0.0.1 и 0.0.0.0 обязательно."},
 {t:"q",d:4,q:"Чем <code>rsync -avz</code> лучше <code>scp</code> при повторной выкатке каталога?",a:["Ничем","Передаёт только изменившиеся части, докачивает после обрыва и сохраняет права","Шифрует надёжнее","Работает без SSH"],c:1,why:"Для больших каталогов разница в разы. Плюс --dry-run позволяет увидеть, что именно будет сделано, до реальной передачи."},
 {t:"q",d:5,q:"<b>Инцидент.</b> Приложение на сервере A перестало ходить к API на сервере B. <code>ping B</code> проходит, <code>nc -zv B 443</code> висит и завершается таймаутом. Где проблема и что делать дальше?",a:["Упало приложение на B — перезапустить его","Пакеты фильтруются: связность есть, но до порта они не доходят — проверять правила фаервола на B и security group, а также маршрут через mtr","Проблема с DNS","Сертификат просрочен"],c:1,why:"Ping отвечает за ICMP и говорит только о связности. Таймаут (а не refused) на конкретном порту — почти всегда фильтрация. Если бы сервис просто упал, ответом был бы Connection refused."}]}
);

{id:"n1",t:"Путь запроса от Enter до ответа",goal:"Знать всю цепочку и место каждого разрыва",
 cards:[
 {h:"Шесть шагов, которые надо уметь рассказать",b:"<ol><li><b>DNS.</b> Браузер спрашивает: какой IP у shop.ru? Ответ кэшируется на время TTL.</li><li><b>TCP.</b> Открывается соединение на порт 443: три пакета — SYN → SYN-ACK → ACK.</li><li><b>TLS.</b> Рукопожатие: сервер предъявляет сертификат, стороны договариваются о шифровании.</li><li><b>HTTP-запрос.</b> <code>GET / HTTP/1.1</code> с заголовками, среди которых <code>Host</code>.</li><li><b>Обработка.</b> Nginx принимает, отдаёт статику сам или проксирует в приложение.</li><li><b>Ответ.</b> Код, заголовки, тело — обратно тем же соединением.</li></ol><p>Это <b>любимый вопрос собеседований</b>. Ценность не в перечислении, а в умении сказать, что ломается на каждом шаге.</p>"},
 {h:"Где именно рвётся",b:"<div class='tw'><table><tr><th>шаг</th><th>симптом</th><th>чем проверить</th></tr><tr><td>DNS</td><td>«имя не найдено», сайт не открывается ни у кого</td><td><code>dig домен +short</code></td></tr><tr><td>TCP</td><td>таймаут или connection refused</td><td><code>nc -zv host 443</code></td></tr><tr><td>TLS</td><td>предупреждение браузера о сертификате</td><td><code>curl -v https://...</code></td></tr><tr><td>HTTP</td><td>код 4xx или 5xx</td><td><code>curl -I</code></td></tr><tr><td>Приложение</td><td>502, 504, ошибки в теле ответа</td><td>логи приложения</td></tr></table></div><p>Диагностика — это <b>деление пополам</b>: проверяешь середину цепочки и отсекаешь половину гипотез.</p>"},
 {h:"Порты, которые знают наизусть",b:"<div class='tw'><table><tr><th>порт</th><th>сервис</th></tr><tr><td>22</td><td>SSH</td></tr><tr><td>53</td><td>DNS</td></tr><tr><td>80 / 443</td><td>HTTP / HTTPS</td></tr><tr><td>3306</td><td>MySQL</td></tr><tr><td>5432</td><td>PostgreSQL</td></tr><tr><td>6379</td><td>Redis</td></tr><tr><td>9090 / 3000</td><td>Prometheus / Grafana</td></tr></table></div><p>Порты до 1024 — привилегированные: занять их может только root. Поэтому приложения слушают 3000 или 8080, а 80/443 держит nginx, запущенный от root и сбрасывающий права у воркеров.</p>"},
 {h:"Клиент, прокси, апстрим",b:"<pre>браузер → балансировщик/nginx → приложение → база</pre><p>Терминология, которую надо употреблять точно:</p><ul><li><b>апстрим (upstream)</b> — то, куда прокси передаёт запрос: твоё приложение</li><li><b>даунстрим</b> — сторона клиента</li><li><b>реверс-прокси</b> — стоит перед приложением и представляет его наружу</li><li><b>форвард-прокси</b> — стоит перед клиентом и выпускает его наружу</li></ul><p>Когда nginx пишет «connect() failed while connecting to upstream», он говорит именно про твоё приложение.</p>"}],
 ch:[
 {t:"q",d:1,q:"На каком порту по умолчанию работает PostgreSQL?",a:["3306","5432","6379","8080"],c:1,why:"5432 — Postgres, 3306 — MySQL, 6379 — Redis. Эти три помнят рефлекторно."},
 {t:"o",d:2,q:"Расставь шаги открытия https-сайта по порядку.",items:["DNS: имя превращается в IP","TCP-соединение: SYN, SYN-ACK, ACK","TLS-рукопожатие и проверка сертификата","HTTP-запрос GET / с заголовком Host","Ответ приложения через прокси"],why:"Эта же цепочка — план диагностики: dig, nc, curl -v, curl -I, логи приложения."},
 {t:"q",d:3,q:"Почему приложение обычно слушает 8080, а не 80?",a:["8080 быстрее","Порты ниже 1024 привилегированные — занять их может только root, а приложение не должно работать от root","Так требует HTTP","80 занят системой"],c:1,why:"Наружу 80 и 443 держит nginx: он стартует от root, занимает порт и сбрасывает привилегии у рабочих процессов."},
 {t:"q",d:4,q:"Сайт не открывается только у части пользователей, у остальных работает. Какой шаг цепочки под подозрением в первую очередь?",a:["Приложение упало","DNS: у части клиентов закэширован старый IP или отвечает другой резолвер","Кончилось место на диске","Сертификат истёк"],c:1,why:"Если бы упало приложение или истёк сертификат, страдали бы все. Частичный отказ — почти всегда кэш, TTL или разные резолверы."},
 {t:"q",d:4,q:"В логе nginx: <code>connect() failed while connecting to upstream</code>. Про что эта строка?",a:["Клиент разорвал соединение","Nginx не смог достучаться до твоего приложения","Проблема с DNS клиента","Сертификат недействителен"],c:1,why:"Upstream — это бэкенд за прокси. Дальше проверяешь: запущен ли процесс, тот ли порт или сокет указан в конфиге, что в логах приложения."},
 {t:"q",d:5,q:"<b>Инцидент.</b> Поддержка пишет: «сайт не работает». Ты открываешь его — работает. Какой набор действий даст ответ быстрее всего?",a:["Перезапустить nginx на всякий случай","Спросить конкретику (домен, время, регион, скриншот ошибки) и проверить цепочку с их стороны: dig с их резолвером, curl с их сети, коды в access.log за это время","Подождать, само пройдёт","Откатить последний релиз"],c:1,why:"«Не работает» — не диагноз. Нужен точный симптом и время: по ним в access.log находишь коды ответа именно этих запросов и понимаешь, на каком шаге разрыв."}]},

{id:"n2",t:"DNS: как имена превращаются в адреса",goal:"Диагностировать руками, а не «попробуй перезагрузить»",
 cards:[
 {h:"Типы записей",b:"<div class='tw'><table><tr><th>тип</th><th>что задаёт</th></tr><tr><td><b>A</b></td><td>имя → IPv4</td></tr><tr><td><b>AAAA</b></td><td>имя → IPv6</td></tr><tr><td><b>CNAME</b></td><td>псевдоним на другое имя</td></tr><tr><td><b>MX</b></td><td>почтовые серверы домена</td></tr><tr><td><b>TXT</b></td><td>произвольный текст: SPF, DKIM, подтверждение владения</td></tr><tr><td><b>NS</b></td><td>какие серверы отвечают за зону</td></tr></table></div><p><b>Ограничение CNAME:</b> на корне домена (<code>shop.ru</code> без www) его ставить нельзя — там уже обязаны быть NS и SOA. Поэтому корень указывают через A-запись или ALIAS/ANAME провайдера.</p>"},
 {h:"dig и чтение ответа",b:"<pre>dig shop.ru +short            <span class='c'># только результат</span>\ndig shop.ru                   <span class='c'># полный ответ с секциями</span>\ndig @8.8.8.8 shop.ru          <span class='c'># спросить конкретный резолвер</span>\ndig shop.ru MX +short\ndig +trace shop.ru            <span class='c'># весь путь от корневых серверов</span></pre><p>В полном ответе смотри <code>status</code>: <b>NOERROR</b> — запись есть, <b>NXDOMAIN</b> — домена не существует, <b>SERVFAIL</b> — резолвер не смог получить ответ (часто проблема на стороне зоны).</p>"},
 {h:"TTL и кэш: почему изменения не видны",b:"<p><b>TTL</b> — сколько секунд ответ разрешено кэшировать. Пока он не истёк, резолверы будут отдавать старый адрес, что бы ты ни менял.</p><p><b>Практика миграции:</b> за сутки до переезда снижаешь TTL до 60 секунд, ждёшь, пока старое значение истечёт у всех, потом меняешь адрес. После переезда возвращаешь TTL обратно.</p><p>Кэш живёт в трёх местах: у провайдера/резолвера, в системе (<code>systemd-resolved</code>) и в браузере. Отсюда «у меня открывается, у тебя нет».</p>"},
 {h:"Кто отвечает за имя на твоём сервере",b:"<pre>cat /etc/resolv.conf   <span class='c'># какие резолверы использует система</span>\nresolvectl status      <span class='c'># то же для systemd-resolved</span>\ncat /etc/hosts         <span class='c'># локальные переопределения</span></pre><p><code>/etc/hosts</code> проверяется <b>до</b> DNS. Это удобно для тестов («притворимся, что домен уже переехал») и одновременно источник загадок: приложение ходит не туда, а DNS показывает правильный адрес.</p>"}],
 ch:[
 {t:"c",d:1,q:"Узнай IPv4-адрес домена example.com максимально коротким выводом.",ans:["dig example.com a +short","dig example.com +short","dig +short example.com","dig +short example.com a"],hint:"dig ... +short",why:"+short убирает всё лишнее. Для проверки конкретного резолвера: dig @1.1.1.1 example.com +short."},
 {t:"q",d:2,q:"<code>dig</code> вернул status: NXDOMAIN. Что это значит?",a:["Резолвер не смог получить ответ","Такого домена не существует","Сервер недоступен","Ответ пришёл из кэша"],c:1,why:"NXDOMAIN — домена нет. SERVFAIL — резолвер не смог отработать (чаще проблема в зоне или у авторитетных серверов). Разница определяет, куда идти дальше."},
 {t:"q",d:3,q:"Ты сменил IP в A-записи два часа назад, но часть пользователей всё ещё попадает на старый сервер. Причина?",a:["Ошибка в панели регистратора","Не истёк TTL: резолверы отдают закэшированный ответ","Нужно перезагрузить сервер","Проблема с сертификатом"],c:1,why:"Поэтому TTL снижают до 60 секунд заранее, за сутки до переезда, и держат старый сервер живым, пока идёт трафик."},
 {t:"q",d:3,q:"Почему нельзя поставить CNAME на корень домена <code>shop.ru</code>?",a:["Технически можно, просто не принято","На корне обязаны быть NS и SOA, а CNAME не допускает соседних записей — используют A или ALIAS провайдера","CNAME работает только для почты","Ограничение браузеров"],c:1,why:"Отсюда типовая схема: www как CNAME на балансировщик, корень — A-запись или ALIAS/ANAME."},
 {t:"q",d:4,q:"На сервере приложение стучится не по тому адресу, хотя <code>dig домен +short</code> показывает правильный IP. Что проверить?",a:["Перезапустить приложение","<code>/etc/hosts</code>: локальные записи проверяются раньше DNS","Сменить резолвер","Обновить сертификат"],c:1,why:"Забытая строка в /etc/hosts после отладки — классический источник многочасовых загадок. dig её не показывает, потому что вообще не заглядывает в файл."},
 {t:"q",d:5,q:"<b>Инцидент.</b> Ночью переносили сайт на новый сервер. Утром часть заказов приходит, часть теряется, в логах нового сервера трафика вдвое меньше ожидаемого. Что происходит и что делать прямо сейчас?",a:["Новый сервер не справляется, нужно масштабировать","Часть клиентов ещё резолвит старый IP из кэша: держать старый сервер работающим (или проксировать с него на новый), пока не истечёт TTL","Откатить DNS обратно и отменить переезд","Проблема в базе данных"],c:1,why:"Переезд по DNS никогда не мгновенный. Правило: старый адрес продолжает обслуживать или проксировать трафик, пока не истечёт максимальный TTL, и только потом гасится."}]},

{id:"n3",t:"HTTP: коды, заголовки, curl",goal:"Читать ответ сервера как диагноз",
 cards:[
 {h:"Коды по классам",b:"<div class='tw'><table><tr><th>класс</th><th>смысл</th><th>кто виноват</th></tr><tr><td>2xx</td><td>успех</td><td>—</td></tr><tr><td>3xx</td><td>перенаправление</td><td>конфигурация</td></tr><tr><td>4xx</td><td>ошибка запроса</td><td>клиент</td></tr><tr><td>5xx</td><td>ошибка сервера</td><td>сервер</td></tr></table></div><p>Конкретика, которую спрашивают:</p><ul><li><b>301</b> постоянный редирект (кэшируется браузером надолго!), <b>302</b> временный</li><li><b>401</b> не аутентифицирован (кто ты?), <b>403</b> аутентифицирован, но нет прав</li><li><b>404</b> нет ресурса, <b>429</b> слишком много запросов</li></ul>"},
 {h:"502, 503, 504 — три разных диагноза",b:"<div class='tw'><table><tr><th>код</th><th>что произошло</th><th>куда смотреть</th></tr><tr><td><b>502</b> Bad Gateway</td><td>прокси не получил валидный ответ: апстрим мёртв или вернул мусор</td><td>жив ли процесс, тот ли порт/сокет</td></tr><tr><td><b>503</b> Service Unavailable</td><td>сервис сам говорит «я не готов»: перегрузка, нет здоровых бэкендов</td><td>healthcheck, число реплик, лимиты</td></tr><tr><td><b>504</b> Gateway Timeout</td><td>апстрим жив, но не ответил за отведённое время</td><td>медленный SQL, залипшие соединения</td></tr></table></div><p><b>504 не лечится увеличением <code>proxy_read_timeout</code>.</b> Это прячет симптом: пользователь ждёт дольше и всё равно уходит. Искать надо, что именно тормозит.</p>"},
 {h:"curl как швейцарский нож",b:"<pre>curl -I https://shop.ru            <span class='c'># только заголовки (HEAD)</span>\ncurl -v https://shop.ru            <span class='c'># подробно, видно TLS и заголовки</span>\ncurl -L shop.ru                    <span class='c'># идти по редиректам</span>\ncurl -X POST -d '{\"a\":1}' \\\n  -H 'Content-Type: application/json' https://api.shop.ru\ncurl -o /dev/null -s -w '%{http_code} %{time_total}\\n' https://shop.ru\ncurl --resolve shop.ru:443:10.0.1.20 https://shop.ru</pre><p>Последняя строка — приём для проверки нового сервера <b>до</b> переключения DNS: curl обращается по нужному IP, но отправляет правильный Host и SNI.</p>"},
 {h:"Заголовки, которые решают",b:"<ul><li><b>Host</b> — по нему сервер понимает, какой сайт запрошен. Один IP, десятки доменов.</li><li><b>Cache-Control</b> — сколько и кому кэшировать.</li><li><b>Content-Type</b> — формат тела.</li><li><b>X-Forwarded-For</b> — реальный IP клиента, когда запрос прошёл через прокси.</li><li><b>X-Forwarded-Proto</b> — исходный протокол (http или https).</li></ul><p>Без правильного <code>Host</code> сервер отдаст сайт по умолчанию, а не твой — отсюда «на IP работает, по домену нет» и наоборот.</p>"}],
 ch:[
 {t:"c",d:1,q:"Проверь только заголовки ответа https://shop.ru, не скачивая тело.",ans:["curl -i https://shop.ru","curl -i shop.ru","curl --head https://shop.ru","curl -i https://shop.ru/"],hint:"заглавная I",why:"curl -I делает HEAD-запрос: быстро видно код, редиректы и заголовки кэширования."},
 {t:"q",d:2,q:"Чем 401 отличается от 403?",a:["Ничем, синонимы","401 — не аутентифицирован (система не знает, кто ты); 403 — знает, но доступ запрещён","401 для API, 403 для сайтов","403 временный, 401 постоянный"],c:1,why:"Различие определяет действие: 401 — чинить токен или сессию, 403 — права и роли."},
 {t:"q",d:3,q:"Nginx отдаёт 504 Gateway Timeout. Что это значит и чего делать НЕ надо?",a:["Апстрим мёртв; надо его перезапустить","Апстрим жив, но не ответил вовремя; не надо просто увеличивать proxy_read_timeout — это прячет причину","Проблема с сертификатом; переиздать","Клиент прислал плохой запрос"],c:1,why:"Ищи, что тормозит: тяжёлый запрос к БД, внешний вызов без таймаута, исчерпанный пул соединений. Увеличенный таймаут лишь растягивает страдание пользователя."},
 {t:"q",d:4,q:"Ты поднял новый сервер и хочешь проверить сайт на нём ДО переключения DNS. Как это сделать правильно?",a:["Открыть http://IP в браузере","<code>curl --resolve shop.ru:443:НОВЫЙ_IP https://shop.ru</code> — правильный Host и SNI при обращении на нужный адрес","Прописать домен в /etc/hosts навсегда","Никак, надо сначала переключить DNS"],c:1,why:"Обращение по голому IP отдаёт сайт по умолчанию и ломает TLS: сертификат выписан на домен. --resolve (или временная строка в /etc/hosts) решает обе проблемы."},
 {t:"q",d:4,q:"Сайт настроили на постоянный редирект 301 на неправильный адрес и быстро починили, но у части пользователей он остался. Почему?",a:["Они не обновили страницу","301 кэшируется браузером надолго, иногда до очистки кэша — для временных переездов нужен 302","Проблема на стороне провайдера","Сертификат кэшируется"],c:1,why:"Отсюда правило: пока не уверен, что редирект навсегда — ставь 302. Исправить ошибочный 301 у уже посетивших пользователей практически невозможно."},
 {t:"q",d:5,q:"<b>Инцидент.</b> После релиза часть запросов отдаёт 502, часть работает. <code>curl -I</code> с сервера на <code>localhost:3000</code> отвечает 200. Что вероятнее всего?",a:["Сломался DNS","Здоровы не все экземпляры приложения: прокси балансирует на несколько бэкендов, часть из них мертва или не прогрелась","Истёк сертификат","Проблема у клиентов"],c:1,why:"Чередование успехов и 502 — почти всегда признак того, что часть апстримов нездорова. Смотри список upstream в конфиге, проверь каждый порт отдельно и настрой healthcheck, чтобы больные выводились из ротации."}]},

{id:"n4",t:"Nginx как reverse proxy",goal:"Поставить правильную дверь перед приложением",
 cards:[
 {h:"Зачем нужен прокси перед приложением",b:"<p>Приложение слушает 3000 на localhost. Nginx стоит на 80/443 и берёт на себя:</p><ul><li>терминацию TLS и редирект с http на https</li><li>отдачу статики (быстрее и дешевле, чем приложением)</li><li>балансировку между несколькими копиями</li><li>ограничение скорости и размера запроса</li><li>единый access-лог со временем ответа</li></ul><p>Приложение при этом остаётся простым и не знает про сертификаты.</p>"},
 {h:"Минимальный рабочий конфиг",b:"<pre>server {\n  listen 80;\n  server_name shop.ru;\n  return 301 https://$host$request_uri;\n}\n\nserver {\n  listen 443 ssl;\n  server_name shop.ru;\n\n  ssl_certificate     /etc/letsencrypt/live/shop.ru/fullchain.pem;\n  ssl_certificate_key /etc/letsencrypt/live/shop.ru/privkey.pem;\n\n  location / {\n    proxy_pass http://127.0.0.1:3000;\n    proxy_set_header Host              $host;\n    proxy_set_header X-Real-IP         $remote_addr;\n    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;\n    proxy_set_header X-Forwarded-Proto $scheme;\n  }\n}</pre>"},
 {h:"Четыре строки proxy_set_header — не формальность",b:"<div class='tw'><table><tr><th>заголовок</th><th>что сломается без него</th></tr><tr><td><code>Host</code></td><td>приложение видит «127.0.0.1» и строит неправильные ссылки и редиректы</td></tr><tr><td><code>X-Real-IP</code> / <code>X-Forwarded-For</code></td><td>в логах приложения у всех запросов один IP — прокси; блокировки и лимиты бесполезны</td></tr><tr><td><code>X-Forwarded-Proto</code></td><td>приложение считает соединение незащищённым и редиректит на https → бесконечная петля</td></tr></table></div>"},
 {h:"Не сломай прод: -t, reload, restart",b:"<pre>nginx -t                  <span class='c'># проверить синтаксис конфигурации</span>\nsystemctl reload nginx    <span class='c'># применить БЕЗ разрыва соединений</span>\nsystemctl restart nginx   <span class='c'># жёстко: соединения рвутся</span></pre><p><code>reload</code> запускает новые воркеры с новым конфигом, а старые дорабатывают текущие запросы и завершаются. Даунтайма нет.</p><p><b>Правило:</b> всегда <code>nginx -t</code> перед reload. Reload с битым конфигом просто не применится, а restart с ним — оставит тебя без веб-сервера.</p>"},
 {h:"Балансировка",b:"<pre>upstream app {\n  least_conn;\n  server 10.0.1.11:3000 max_fails=3 fail_timeout=10s;\n  server 10.0.1.12:3000 max_fails=3 fail_timeout=10s;\n}</pre><ul><li><b>round-robin</b> — по кругу, по умолчанию</li><li><b>least_conn</b> — тому, у кого меньше активных соединений</li><li><b>ip_hash</b> — привязка клиента к бэкенду (нужно, если сессии хранятся в памяти)</li></ul><p><code>max_fails</code> и <code>fail_timeout</code> временно выводят больной сервер из ротации — иначе ровно 1/N пользователей стабильно получает ошибки.</p>"}],
 ch:[
 {t:"c",d:1,q:"Проверь синтаксис конфигурации nginx перед применением.",ans:["nginx -t","sudo nginx -t","nginx -T"],hint:"одна буква",why:"nginx -t разбирает конфиг и указывает файл и строку с ошибкой. Без него reload может оставить тебя без сервиса."},
 {t:"q",d:2,q:"Нужно применить новый конфиг без обрыва пользователей. Что выбрать?",a:["restart","reload","stop и потом start","kill -9 и запуск заново"],c:1,why:"reload поднимает новые воркеры, старые дорабатывают текущие запросы. Zero downtime без ухищрений."},
 {t:"f",d:2,q:"Допиши директиву, передающую запрос на приложение, которое слушает localhost:3000.",pre:"location / {\n  ___ http://127.0.0.1:3000;\n}",ans:["proxy_pass"],hint:"proxy_...",why:"proxy_pass — ядро reverse proxy. Следом обязательно идут proxy_set_header, иначе приложение получит искажённый контекст запроса."},
 {t:"q",d:3,q:"В логах приложения у всех запросов IP <code>127.0.0.1</code>. Что забыли в конфиге прокси?",a:["proxy_pass","proxy_set_header X-Real-IP и X-Forwarded-For","listen 443","server_name"],c:1,why:"Прокси подключается к приложению от своего имени. Реальный адрес клиента нужно передать заголовком — и научить приложение ему доверять, иначе его подделают."},
 {t:"q",d:4,q:"После включения HTTPS на прокси браузер зацикливается в бесконечном редиректе. Причина?",a:["Плохой сертификат","Не передан <code>X-Forwarded-Proto</code>: приложение видит http и редиректит на https, прокси снова отдаёт http внутрь","Ошибка DNS","Кэш браузера"],c:1,why:"Классическая петля при терминации TLS на прокси. Приложение должно узнать исходный протокол из заголовка и доверять ему только от доверенных прокси."},
 {t:"q",d:5,q:"<b>Инцидент.</b> Один из трёх бэкендов упал. Nginx балансирует round-robin без <code>max_fails</code>. Что видят пользователи и как правильно починить?",a:["Ничего, nginx сам всё поймёт","Примерно каждый третий запрос падает с 502; нужно настроить max_fails/fail_timeout (а лучше активные проверки), чтобы больной сервер выводился из ротации","Все запросы падают","Сайт становится медленнее, но работает"],c:1,why:"Без проверки здоровья балансировщик честно отправляет треть трафика в мёртвый узел. Поднять упавший бэкенд — лечение симптома; настроить вывод из ротации — лечение причины."}]},

{id:"n5",t:"TLS и сертификаты",goal:"Понимать, что именно проверяет браузер",
 cards:[
 {h:"Что происходит при рукопожатии",b:"<ol><li>Клиент присылает список поддерживаемых шифров и <b>SNI</b> — имя домена, к которому обращается.</li><li>Сервер по SNI выбирает нужный сертификат и отдаёт его вместе с цепочкой.</li><li>Клиент проверяет: подпись доверенного центра, срок действия, совпадение имени с запрошенным доменом.</li><li>Стороны договариваются о сеансовом ключе, дальше трафик шифруется симметрично.</li></ol><p><b>SNI</b> объясняет, почему на одном IP живут сотни сайтов с разными сертификатами: сервер узнаёт нужный домен до начала шифрования.</p>"},
 {h:"Из чего состоит сертификат",b:"<ul><li><b>fullchain.pem</b> — сертификат сайта плюс промежуточные сертификаты центра</li><li><b>privkey.pem</b> — приватный ключ; никогда не покидает сервер, права 600</li></ul><p><b>Частая ошибка:</b> отдать только сертификат сайта без промежуточных. Десктопный браузер может достроить цепочку сам и всё «работает», а мобильные приложения и curl — нет. Отсюда «у меня открывается, а приложение выдаёт ошибку TLS».</p>"},
 {h:"Проверка руками",b:"<pre>curl -v https://shop.ru\n\necho | openssl s_client -connect shop.ru:443 -servername shop.ru 2&gt;/dev/null \\\n  | openssl x509 -noout -dates -subject -issuer</pre><p>Выведет <code>notBefore</code>, <code>notAfter</code>, кому выдан и кем. Это и есть быстрый ответ на вопрос «сертификат ещё жив?».</p><p>Типичные ошибки: <code>certificate has expired</code>, <code>unable to get local issuer certificate</code> (нет промежуточных), <code>hostname mismatch</code> (сертификат на другой домен).</p>"},
 {h:"Let's Encrypt и автопродление",b:"<p>Сертификат действует 90 дней, продление автоматическое — через systemd-таймер или cron с certbot. Проверка владения доменом обычно по <b>http-01</b>: центр запрашивает файл по <code>http://домен/.well-known/acme-challenge/...</code>, значит порт 80 должен быть открыт и обслуживаться.</p><p><b>Главное правило:</b> у автоматики тоже должен быть мониторинг. Ставь алерт «сертификат истекает через 21 день» — иначе о поломке продления ты узнаешь от клиентов в день истечения.</p>"}],
 ch:[
 {t:"q",d:1,q:"Какой файл ни при каких обстоятельствах не должен покидать сервер?",a:["fullchain.pem","privkey.pem — приватный ключ","cert.pem","chain.pem"],c:1,why:"Утечка приватного ключа означает, что трафик можно расшифровать и подделать сайт. Права на файл — 600, владелец root."},
 {t:"c",d:2,q:"Сделай подробный запрос к https://shop.ru, чтобы увидеть детали TLS-рукопожатия.",ans:["curl -v https://shop.ru","curl -vI https://shop.ru"],hint:"флаг verbose",why:"В выводе видно версию TLS, выбранный шифр, цепочку сертификатов и причину отказа, если он есть."},
 {t:"q",d:3,q:"Сайт открывается в десктопном браузере, но мобильное приложение и <code>curl</code> ругаются «unable to get local issuer certificate». В чём дело?",a:["Сертификат истёк","Не отдаётся промежуточная цепочка: браузер достраивает её сам, а другие клиенты — нет","Неверный домен в сертификате","Проблема с DNS"],c:1,why:"Нужно отдавать fullchain, а не только сертификат сайта. Проверяется тем же openssl s_client — он покажет всю предъявленную цепочку."},
 {t:"q",d:3,q:"Зачем в TLS нужен SNI?",a:["Для сжатия трафика","Чтобы сервер узнал запрошенный домен до шифрования и выбрал нужный сертификат — так на одном IP живут сотни сайтов","Для ускорения рукопожатия","Для проверки пароля"],c:1,why:"Отсюда же и подвох при обращении по голому IP: без SNI сервер отдаёт сертификат по умолчанию, и проверка имени не проходит."},
 {t:"q",d:4,q:"Автопродление certbot сломалось месяц назад, никто не заметил. Что должно было предотвратить инцидент?",a:["Ручная проверка раз в квартал","Алерт на приближение срока действия сертификата и контроль результата таймера, а не факта его запуска","Более длинный сертификат","Второй сервер"],c:1,why:"Автоматика без наблюдения — просто отложенный инцидент. Проверять надо итог (дата в сертификате), а не то, что задание стартовало."},
 {t:"q",d:5,q:"<b>Инцидент.</b> Сертификат истёк ночью, продажи встали. <code>journalctl -u certbot</code> показывает: «Failed authorization: connection to :80 refused». Что чинить и в каком порядке?",a:["Купить платный сертификат","Вернуть обслуживание порта 80 (там проходит http-01 challenge), перевыпустить сертификат, перезагрузить nginx — и поставить алерт на срок действия","Отключить HTTPS до утра","Перенести сайт на другой сервер"],c:1,why:"Порядок: восстановить сервис, потом устранить причину, потом закрыть слепое пятно мониторинга. Закрытие 80 «для безопасности» — частая причина именно этой поломки."}]},

{id:"n6",t:"SSH: доступ и туннели",goal:"Заходить безопасно и добираться до закрытых сервисов",
 cards:[
 {h:"Ключи вместо паролей",b:"<pre>ssh-keygen -t ed25519 -C \"me@work\"\nssh-copy-id user@server\nssh -i ~/.ssh/id_ed25519 user@server\nssh -p 2222 user@server</pre><p><b>Приватный ключ не покидает твою машину.</b> Публичный лежит на сервере в <code>~/.ssh/authorized_keys</code>. Права обязательны: <code>700</code> на каталог <code>.ssh</code>, <code>600</code> на приватный ключ — иначе клиент откажется его использовать.</p><p><code>ed25519</code> короче и надёжнее RSA-2048; RSA-4096 оставляют для старых систем.</p>"},
 {h:"~/.ssh/config — экономия времени",b:"<pre>Host prod\n  HostName 10.0.1.20\n  User deploy\n  Port 2222\n  IdentityFile ~/.ssh/prod_ed25519\n  ServerAliveInterval 60\n\nHost db\n  HostName 10.0.2.5\n  User deploy\n  ProxyJump prod</pre><p>Теперь <code>ssh prod</code> вместо длинной строки, а <code>ssh db</code> автоматически идёт через бастион. <code>ProxyJump</code> — правильный способ добраться до машин в закрытой сети.</p>"},
 {h:"Проброс портов",b:"<pre>ssh -L 5433:localhost:5432 user@server\n<span class='c'># локальный 5433 → 5432 на удалённой стороне</span>\n\nssh -L 5433:db-internal:5432 user@bastion\n<span class='c'># через бастион до сервера БД во внутренней сети</span></pre><p>После этого <code>psql -h localhost -p 5433</code> с твоего ноутбука работает с базой, которая не смотрит в интернет — и не должна.</p><p><b>Обратный проброс</b> <code>-R</code> открывает порт на сервере и ведёт к тебе. Мощно и опасно: так открывают доступ внутрь периметра, поэтому на серверах его часто запрещают.</p>"},
 {h:"Как укрепляют SSH-сервер",b:"<pre># /etc/ssh/sshd_config\nPermitRootLogin no\nPasswordAuthentication no\nPubkeyAuthentication yes\nAllowUsers deploy</pre><p>После правки — <code>sshd -t</code> для проверки синтаксиса, затем <code>systemctl reload sshd</code>.</p><p><b>Правило выживания:</b> меняя настройки SSH или фаервола, держи вторую сессию открытой и проверяй вход в новом окне. Ошибка в конфиге при закрытой сессии означает поездку в консоль провайдера.</p>"}],
 ch:[
 {t:"c",d:1,q:"Сгенерируй современный SSH-ключ типа ed25519.",ans:["ssh-keygen -t ed25519","ssh-keygen -t ed25519 -c \"\"","ssh-keygen ed25519"],hint:"ssh-keygen -t ...",why:"ed25519 короче и надёжнее RSA-2048. RSA-4096 оставляют только для систем, не понимающих ed25519."},
 {t:"q",d:2,q:"Что должно лежать на сервере в <code>~/.ssh/authorized_keys</code>?",a:["Приватный ключ","Публичный ключ","Пароль","Сертификат TLS"],c:1,why:"Приватный ключ не уезжает с твоей машины никогда. Если он утёк — доступ считается скомпрометированным, ключ нужно менять."},
 {t:"c",d:3,q:"Пробрось локальный порт 5433 на порт 5432 сервера, чтобы подключиться к его базе с ноутбука.",ans:["ssh -L 5433:localhost:5432 user@server","ssh -L 5433:127.0.0.1:5432 user@server"],hint:"-L локальный:хост:удалённый",why:"Безопасный доступ без открытия порта БД наружу. Порядок в -L: сначала локальный порт, потом адрес и порт со стороны сервера."},
 {t:"q",d:3,q:"SSH отказывается использовать приватный ключ и пишет про «unprotected private key file». Что не так?",a:["Ключ повреждён","Слишком широкие права на файл — нужен <code>chmod 600</code>","Не тот тип ключа","Истёк срок действия"],c:1,why:"Клиент защищает тебя от ключа, который могут прочитать другие пользователи машины. 700 на ~/.ssh и 600 на ключ."},
 {t:"q",d:4,q:"Нужно подключиться к серверу во внутренней сети, доступному только через бастион. Как правильно?",a:["Открыть внутренний сервер наружу","<code>ProxyJump</code> в ~/.ssh/config (или <code>ssh -J bastion user@internal</code>)","Скопировать приватный ключ на бастион и заходить оттуда","Пробросить весь трафик через VPN вручную"],c:1,why:"ProxyJump строит цепочку, не оставляя ключ на промежуточной машине. Копировать приватный ключ на бастион — распространённая и опасная ошибка."},
 {t:"q",d:5,q:"<b>Инцидент.</b> Ты отключил вход по паролю в sshd_config, сделал reload и закрыл терминал. Утром выясняется: твой публичный ключ на сервер добавить забыли. Что делать и как этого избежать впредь?",a:["Ждать, пока кто-нибудь починит","Заходить через веб-консоль провайдера или режим восстановления; на будущее — держать вторую сессию открытой и проверять новый способ входа до закрытия старого","Переустановить сервер","Сбросить пароль root по почте"],c:1,why:"Правило одно для SSH, фаервола и sudo: пока новая конфигурация не проверена отдельной сессией, старую не закрывай."}]},

{id:"n7",t:"Firewall и сетевые доступы",goal:"Закрыть всё лишнее и не отрезать себя",
 cards:[
 {h:"Политика по умолчанию",b:"<p>Правильная модель: <b>всё входящее запрещено</b>, разрешено точечно. Обратный подход («закроем плохое») не масштабируется — ты не перечислишь всё плохое.</p><pre>ufw default deny incoming\nufw default allow outgoing\nufw allow 22/tcp\nufw allow 80,443/tcp\nufw enable\nufw status numbered</pre><p>Под капотом это <code>nftables</code> (раньше <code>iptables</code>); <code>ufw</code> — удобная обёртка. В облаке добавляется второй слой — security groups провайдера.</p>"},
 {h:"Два слоя фильтрации",b:"<p>Когда «порт открыт, но не отвечает», проверяй оба уровня:</p><ol><li><b>Фаервол на хосте</b> — <code>ufw status</code>, <code>nft list ruleset</code></li><li><b>Security group / сетевой ACL провайдера</b> — в панели облака</li></ol><p>И третье, что не является фаерволом, но выглядит так же: сервис слушает <code>127.0.0.1</code> вместо <code>0.0.0.0</code>. Проверяется <code>ss -tulpn</code>.</p>"},
 {h:"Refused против timeout — точный диагноз",b:"<div class='tw'><table><tr><th>ответ</th><th>что значит</th><th>куда идти</th></tr><tr><td>Connection refused</td><td>пакет дошёл, порт никто не слушает</td><td>сервис: запущен ли, тот ли адрес привязки</td></tr><tr><td>Connection timed out</td><td>ответа нет вовсе</td><td>фаервол, security group, маршрут</td></tr></table></div><p>Одна эта таблица экономит часы: она сразу говорит, идти к приложению или к сети.</p>"},
 {h:"Что не должно смотреть наружу",b:"<ul><li>базы данных (5432, 3306, 27017, 6379) — только приватная сеть или туннель</li><li>панели администрирования и метрики (9090, 3000, 15672)</li><li>docker API и kubelet</li></ul><p>Открытый Redis или Postgres находят автоматические сканеры за считанные часы после появления в сети. «У нас же сложный пароль» — не аргумент: ищут не пароль, а известную уязвимость версии.</p>"}],
 ch:[
 {t:"q",d:1,q:"Какая политика по умолчанию правильна для входящего трафика?",a:["allow — разрешить всё","deny — запретить всё и открывать точечно","reject всё, включая 22","Зависит от нагрузки"],c:1,why:"Deny by default. Только не забудь разрешить SSH до включения фаервола, иначе отрежешь себя."},
 {t:"c",d:2,q:"Проверь, какой процесс слушает порт 5432 и на каком адресе.",ans:["ss -tulpn | grep 5432","ss -tulpn|grep 5432","netstat -tulpn | grep 5432","ss -tulpn | grep postgres"],hint:"ss + пайп в grep",why:"Смотри адрес слева от порта: 127.0.0.1 — только локально (для БД это правильно), 0.0.0.0 — на всех интерфейсах."},
 {t:"q",d:3,q:"<code>nc -zv host 443</code> завершается по таймауту, а не «refused». О чём это говорит?",a:["Сервис не запущен","Пакеты фильтруются: фаервол или security group — до порта они не доходят","Проблема с DNS","Сертификат недействителен"],c:1,why:"Refused означает, что хост ответил отказом, то есть связность есть. Таймаут — молчание, характерное для DROP-правила."},
 {t:"q",d:3,q:"Порт 5432 открыт в security group на 0.0.0.0/0. Насколько это критично?",a:["Нормально, доступ по паролю","Критично: база доступна всему интернету и будет найдена сканерами за часы","Не важно, если версия свежая","Важно только для публичных облаков"],c:1,why:"Доступ к БД — только из приватной сети, через бастион или SSH-туннель. Публичный порт базы — типовая причина утечек у небольших проектов."},
 {t:"q",d:4,q:"Ты добавил правило фаервола, и приложение перестало ходить к внешнему API. Что могло произойти?",a:["Правило для входящего трафика не влияет на исходящий — дело в другом","Изменена политика для исходящего трафика (default deny outgoing) или обрезаны ответы на установленные соединения","Сломался DNS","Провайдер заблокировал API"],c:1,why:"Фильтрация исходящего трафика — законная практика, но она требует явных разрешений. Плюс правило для established/related соединений, иначе ответы на твои же запросы будут отбрасываться."},
 {t:"q",d:5,q:"<b>Инцидент.</b> Тебе нужно закрыть все порты, кроме 80, 443 и SSH, на боевом сервере, к которому ты подключён по SSH. Как выполнить это безопасно?",a:["Сразу <code>ufw default deny incoming &amp;&amp; ufw enable</code>","Сначала явно разрешить SSH (<code>ufw allow 22/tcp</code>) и 80/443, потом менять политику по умолчанию, держа вторую сессию открытой и проверив вход в новом окне","Отключить сеть и настроить локально","Попросить провайдера настроить"],c:1,why:"Порядок «сначала разрешить нужное, потом запретить остальное» плюс контрольная вторая сессия. Обратный порядок обрывает твою собственную связь с сервером."}]},

{id:"n8",t:"За прокси: заголовки, сессии, лимиты",goal:"Понимать, что видит приложение и как его защитить",
 cards:[
 {h:"Кто такой клиент с точки зрения приложения",b:"<p>За балансировщиком приложение видит адрес прокси. Реальный клиент приходит в <code>X-Forwarded-For</code> — это список, куда каждый прокси дописывает предыдущий адрес:</p><pre>X-Forwarded-For: 93.10.4.2, 10.0.1.5</pre><p><b>Заголовок можно подделать.</b> Клиент способен прислать его сам. Поэтому приложение должно доверять ему <b>только от известных прокси</b> (список доверенных адресов в конфигурации фреймворка). Иначе блокировки по IP и лимиты обходятся одной строкой в запросе.</p>"},
 {h:"Сессии и масштабирование",b:"<p>Если приложение хранит сессию в памяти процесса, то при нескольких копиях пользователь «теряет» вход, попадая на другой сервер.</p><ul><li><b>Быстрое решение:</b> sticky-сессии (<code>ip_hash</code>) — привязать клиента к бэкенду. Костыль: при падении узла сессии теряются, балансировка перекашивается.</li><li><b>Правильное:</b> вынести сессии в Redis или БД, сделав приложение <b>stateless</b>. Тогда любую копию можно убить и добавить в любой момент.</li></ul><p>Stateless — обязательное условие для автоскейлинга и Kubernetes.</p>"},
 {h:"Ограничение скорости и размера",b:"<pre>limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;\n\nserver {\n  client_max_body_size 10m;\n  location /api/ {\n    limit_req zone=api burst=20 nodelay;\n    proxy_pass http://app;\n  }\n}</pre><p><code>limit_req</code> защищает от перебора паролей и наплыва запросов; <code>burst</code> разрешает короткие всплески.</p><p><code>client_max_body_size</code> — частая причина ошибки <b>413 Request Entity Too Large</b> при загрузке файлов: по умолчанию около 1 МБ, и это не настройка приложения, а настройка прокси.</p>"},
 {h:"Таймауты",b:"<pre>proxy_connect_timeout 5s;   <span class='c'># сколько ждать установки соединения</span>\nproxy_read_timeout 30s;     <span class='c'># сколько ждать ответа</span>\nkeepalive_timeout 65s;</pre><p>Таймауты — это про <b>сколько страдает пользователь</b>, прежде чем получит ошибку. Ставить огромные значения, чтобы «не было 504», — способ превратить быструю ошибку в долгое ожидание с тем же результатом.</p>"}],
 ch:[
 {t:"q",d:1,q:"Пользователь загружает файл 5 МБ и получает 413 Request Entity Too Large. Где настройка?",a:["В приложении","В nginx: <code>client_max_body_size</code>","В браузере","В базе данных"],c:1,why:"По умолчанию лимит около 1 МБ, и запрос отсекается прокси до того, как дойдёт до приложения — поэтому в логах приложения ничего нет."},
 {t:"q",d:2,q:"В приложении блокировка по IP не работает: злоумышленник продолжает запросы. Приложение стоит за nginx. Почему?",a:["Блокировка написана с ошибкой","Приложение видит IP прокси, а не клиента — нужен X-Forwarded-For и доверие к нему","Не хватает памяти","IP меняется у провайдера"],c:1,why:"И вторая половина ответа: доверять заголовку можно только от известных прокси, иначе его подделают и обойдут блокировку."},
 {t:"q",d:3,q:"Сессии пользователей рвутся при балансировке на три сервера. Быстрое и правильное решения?",a:["Только ip_hash навсегда","Быстро — sticky-сессии; правильно — хранить сессии в Redis или БД, сделав приложение stateless","Оставить один сервер","Отключить балансировку"],c:1,why:"Stateless-приложение масштабируется горизонтально без ограничений и переживает падение любой копии. Sticky — временная мера на период миграции."},
 {t:"q",d:4,q:"Команда предлагает поднять <code>proxy_read_timeout</code> до 300 секунд, чтобы убрать 504 на тяжёлом отчёте. Что с этим не так?",a:["Ничего, нормальное решение","Пользователь всё равно ждёт пять минут и уходит, а соединения копятся и исчерпывают пул; правильно — сделать отчёт фоновой задачей с уведомлением","Nginx не поддерживает такие значения","Это небезопасно"],c:1,why:"Долгие синхронные запросы съедают воркеры и соединения к БД. Тяжёлые операции выносят в очередь, а пользователю сразу отвечают «задача принята»."},
 {t:"q",d:4,q:"Зачем в <code>limit_req</code> параметр <code>burst</code>?",a:["Увеличивает общий лимит","Разрешает короткие всплески запросов сверх средней скорости, не отсекая нормальных пользователей","Ускоряет обработку","Отключает лимит для админов"],c:1,why:"Без burst жёсткий лимит отсекает даже обычную загрузку страницы, где браузер делает несколько параллельных запросов подряд."},
 {t:"q",d:5,q:"<b>Инцидент.</b> На форму входа идёт перебор паролей: тысячи запросов в минуту с сотен адресов, сайт тормозит. Что сделать в первую очередь и что потом?",a:["Заблокировать все IP вручную","Сейчас: включить limit_req на /login и капчу или задержку после неудач; потом: разобрать логи, добавить мониторинг доли 4xx и постоянную защиту","Отключить форму входа","Увеличить число серверов"],c:1,why:"Сначала снизить нагрузку и остановить перебор на уровне прокси, потом — устойчивое решение. Ручные блокировки по IP при распределённой атаке бесполезны."}]}
);
