{id:"s1",t:"Облачная модель",goal:"Понимать, за что отвечаешь ты, а за что провайдер",
 cards:[
 {h:"IaaS, PaaS, SaaS",b:"<div class='tw'><table><tr><th>модель</th><th>ты управляешь</th><th>пример</th></tr><tr><td><b>IaaS</b></td><td>ОС, патчи, ПО, данные</td><td>виртуальная машина, сеть, диск</td></tr><tr><td><b>PaaS</b></td><td>приложение, конфигурация, данные</td><td>managed Postgres, managed Kubernetes</td></tr><tr><td><b>SaaS</b></td><td>только свои данные и доступы</td><td>почта, трекер задач</td></tr></table></div><p>Чем выше уровень, тем меньше твоей операционной работы и тем меньше гибкости. Managed-сервис почти всегда дешевле по совокупной стоимости, если считать не только счёт, но и часы инженеров и ночные дежурства.</p>",
  cheat:"IaaS=ОС+патчи твои, PaaS=только приложение, SaaS=только данные"},
 {h:"Разделяемая ответственность",b:"<p>Провайдер отвечает за безопасность <b>самого облака</b>: дата-центры, железо, гипервизор, физическая сеть.</p><p>Ты отвечаешь за безопасность <b>в облаке</b>: доступы и роли, настройки сервисов, шифрование данных, патчи гостевой ОС в IaaS, конфигурацию сети.</p><p>Для managed Kubernetes граница проходит так: провайдер держит control plane, ты отвечаешь за рабочие нагрузки, RBAC, политики и содержимое образов.</p><p>Подавляющее большинство утечек в облаках — это ошибки в <b>твоей</b> половине: публичный бакет, слишком широкая роль, открытый порт.</p>",
  t:{q:"Managed Kubernetes: назови одним словом, за что отвечает провайдер (control plane или workload)?",ans:["control plane","control-plane"],hint:"держит провайдер",why:"Ты отвечаешь за рабочие нагрузки, RBAC, политики и содержимое образов — провайдер только за control plane."}},
 {h:"Сеть в облаке",b:"<ul><li><b>VPC</b> — изолированная виртуальная сеть проекта</li><li><b>публичные подсети</b> — только балансировщики и шлюзы</li><li><b>приватные подсети</b> — приложения и базы, без публичных адресов</li><li><b>NAT-шлюз</b> — выход в интернет из приватной подсети без входящих подключений</li><li><b>security groups</b> — фаервол на уровне ресурса, правила по принципу белого списка</li></ul><p>База данных не должна иметь публичного адреса никогда. Доступ инженера — через бастион или SSH-туннель, доступ приложения — по внутренней сети.</p>",
  cheat:"публичная подсеть=балансировщики, приватная=приложения/БД; NAT=выход без входящих"},
 {h:"FinOps: почему счёт растёт",b:"<p>Типовые статьи, о которых забывают:</p><ul><li>неиспользуемые диски и снапшоты от удалённых машин</li><li>исходящий трафик между зонами и в интернет</li><li>переразмеренные ноды и «временные» стенды, живущие месяцами</li><li>логи и метрики с избыточным сроком хранения</li></ul><p>Первый шаг всегда один: <b>теги на все ресурсы</b> (проект, среда, владелец) и отчёт по ним. Без разметки оптимизировать нечего — не видно, кому что принадлежит.</p><p>Дальше: автоудаление стендов, spot/preemptible для CI и staging, автоскейлинг вниз ночью.</p>",
  t:{q:"Счёт за облако растёт непонятно откуда. Напиши первый шаг (одно слово) — что нужно расставить на все ресурсы, прежде чем что-либо оптимизировать.",ans:["теги"],hint:"проект, среда, владелец",why:"Без разметки оптимизировать нечего — не видно, кому что принадлежит и на чём экономить."}}],
 ch:[
 {t:"q",d:1,q:"Managed Kubernetes: за что отвечаешь ты?",a:["Ни за что, всё делает провайдер","За control plane","За рабочие нагрузки, конфигурацию, доступы и данные; провайдер — за control plane","За физические серверы"],c:2,why:"Модель разделяемой ответственности — типовой вопрос собеседования на middle. Граница у каждого сервиса своя, её надо знать."},
 {t:"q",d:2,q:"Где должна находиться production-база данных в VPC?",a:["В публичной подсети с белым IP","В приватной подсети без публичного адреса; доступ через security group и бастион или туннель","На той же машине, что балансировщик","В интернете, но со сложным паролем"],c:1,why:"Публичный адрес у базы — прямая дорога к утечке: сканеры находят такие порты за часы, а ищут не пароль, а уязвимость версии."},
 {t:"c",d:3,q:"Зачем в приватной подсети NAT-шлюз? Напиши одним словом, что он даёт машинам без входящих подключений (глагол, инфинитив).",ans:["выходить","выходить в интернет"],hint:"исходящий трафик без входящего",why:"Исходящие соединения нужны почти всегда, входящие — почти никогда. NAT даёт ровно это разделение."},
 {t:"c",d:3,q:"Счёт за облако вырос вдвое за месяц. Напиши первый шаг (одно слово), который делает возможным дальнейший анализ расходов.",ans:["теги","тегирование"],hint:"разметка ресурсов",why:"Сначала видимость, потом действия. Как правило, три-четыре находки после разметки дают 80% экономии."},
 {t:"c",d:4,q:"Команда предлагает поднять свой Postgres на виртуалке вместо managed, «чтобы сэкономить». Напиши термин (два слова, рус.), который нужно посчитать вместо цены одной VM — то, что включает бэкапы, репликацию, обновления и дежурства.",ans:["совокупная стоимость","совокупная стоимость владения"],hint:"TCO — total cost of ownership",why:"Счёт провайдера — видимая часть. Невидимая — часы инженеров и стоимость инцидента, который случится в самый неудобный момент."},
 {t:"c",d:5,q:"Инцидент. Обнаружено, что бакет с бэкапами доступен публично на чтение уже полгода. Напиши первое действие (глагол + что) — прежде чем разбираться, что скачивали.",ans:["закрыть доступ"],hint:"остановить утечку немедленно",why:"Закрыть доступ — необходимо, но недостаточно. После этого нужны оценка ущерба по логам и техническая гарантия, что это не повторится (checkov/tfsec в CI)."}]},

{id:"s2",t:"Доступы и секреты",goal:"Не стать причиной утечки",
 cards:[
 {h:"Наименьшие привилегии",b:"<p>Каждой сущности — минимально необходимые права:</p><ul><li>у CI своя роль: push в конкретный реестр и деплой в конкретный неймспейс</li><li>у приложения своя: чтение конкретного секрета и запись в свой бакет</li><li>у человека своя: обычно read-only на прод, изменения через пайплайн</li></ul><p>Общий admin-ключ «чтобы работало» превращает любую утечку в полную компрометацию инфраструктуры. Разделение ролей ограничивает ущерб.</p>",
  cheat:"принцип наименьших привилегий: каждой сущности — только необходимые права"},
 {h:"Управление секретами",b:"<div class='tw'><table><tr><th>плохо</th><th>хорошо</th></tr><tr><td>секрет в git</td><td>менеджер секретов (Vault, secrets manager облака)</td></tr><tr><td>статический ключ навсегда</td><td>короткоживущие токены, OIDC-федерация</td></tr><tr><td>один ключ на всех</td><td>отдельный на каждую систему</td></tr><tr><td>ротация «когда-нибудь»</td><td>автоматическая по расписанию</td></tr></table></div><p><b>Правило:</b> если секрет где-то засветился — в логе, в истории git, на скриншоте — он скомпрометирован. Первое действие всегда ротация, а не уборка следов.</p>",
  t:{q:"Секрет засветился в логе. Напиши первое действие (глагол + что).",ans:["ротировать секрет","сменить секрет"],hint:"не уборка следов, а смена значения",why:"Первое действие всегда ротация, а не уборка следов — секрет уже считается скомпрометированным."}},
 {h:"Сканирование и патчи",b:"<ul><li><b>gitleaks</b> — секреты в коммитах</li><li><b>trivy / grype</b> — уязвимости в образах</li><li><b>dependabot</b> — уязвимые зависимости</li><li><b>tfsec / checkov</b> — небезопасные настройки инфраструктуры</li></ul><p>Отдельная дисциплина — <b>обновление базовых образов</b>. Уязвимость чаще приходит не из твоего кода, а из системных пакетов базы. Общий базовый образ на всю компанию позволяет закрыть её одним обновлением для всего парка.</p><p>Позиция «работает — не трогай» в безопасности означает накопление известных дыр.</p>",
  cheat:"gitleaks=секреты, trivy/grype=образ, dependabot=зависимости, tfsec/checkov=IaC"},
 {h:"Контейнерная гигиена",b:"<ul><li>непривилегированный пользователь, read-only файловая система, drop всех capabilities</li><li>минимальная база: меньше пакетов — меньше уязвимостей</li><li>в Kubernetes: NetworkPolicy для сегментации, RBAC вместо cluster-admin, политики допуска</li><li>подпись образов и проверка происхождения для критичных систем</li></ul><p>Это не отдельная «работа по безопасности», а часть обычной конфигурации — те же пять строк securityContext, что и в манифесте приложения.</p>"}],
 ch:[
 {t:"q",d:1,q:"Где хранить пароль базы данных для приложения на проде?",a:["В git в зашифрованном виде","В менеджере секретов с ротацией, доставляя в рантайме","В образе контейнера","В переменных Dockerfile"],c:1,why:"ENV в Dockerfile попадает в слои образа и виден через docker history любому, кто его скачал."},
 {t:"q",d:2,q:"Как CI должен получать доступ к облаку без статических ключей?",a:["Ключ в переменной, менять раз в год","OIDC-федерация с короткоживущими токенами, привязанными к репозиторию и ветке","Общий admin-ключ команды","Пароль в коде пайплайна"],c:1,why:"Статический ключ утекает один раз и живёт вечно. Токен на несколько минут обесценивает саму кражу."},
 {t:"c",d:3,q:"Обнаружен критичный CVE в базовом образе, который используют 20 сервисов. Напиши, что нужно обновить централизованно (два слова, рус.), чтобы закрыть весь парк одним исправлением.",ans:["базовый образ"],hint:"общий слой для всех 20 сервисов",why:"Отсюда и практика общего базового образа: одно исправление закрывает весь парк, а не двадцать отдельных задач."},
 {t:"c",d:3,q:"Разработчик просит выдать ему admin-права в проде «на время отладки». Напиши, что предложить вместо этого (тип доступа, англ.).",ans:["read-only","read only"],hint:"доступ только на чтение",why:"Задача — разблокировать человека минимально достаточным способом: read-only к логам и метрикам, ограниченный RBAC, а не выдача ключей от всего."},
 {t:"c",d:4,q:"Токен для деплоя случайно попал в публичный репозиторий на 10 минут, потом коммит удалили. Напиши первое действие (глагол + что).",ans:["отозвать токен","перевыпустить токен"],hint:"сам коммит уже не важен",why:"Публичные репозитории сканируются ботами непрерывно. Десять минут — более чем достаточно; известны случаи использования через 30 секунд."},
 {t:"c",d:5,q:"Инцидент. Скомпрометирован токен CI с правами на весь облачный проект. Напиши порядок трёх действий через стрелку: отозвать, оценить ущерб (по журналам), сузить права — в правильном порядке.",ans:["отозвать → оценить → сузить","отозвать оценить сузить"],hint:"сначала остановить доступ",why:"Три этапа: остановить доступ, оценить ущерб по журналам, устранить первопричину (избыточные права и вечный токен). Пропуск второго этапа оставляет закладки незамеченными."}]},

{id:"s3",t:"Бэкапы и восстановление",goal:"Уметь ответить «а если всё сгорит?»",
 cards:[
 {h:"Правило 3-2-1 и неизменяемость",b:"<p><b>3</b> копии данных, <b>2</b> разных носителя, <b>1</b> вне площадки.</p><p>Плюс современное дополнение: копия, из которой <b>нельзя удалить</b> (immutable, версионирование с блокировкой). Шифровальщики целенаправленно ищут и стирают бэкапы — доступные из той же сети копии не спасают.</p><p><b>Реплика — не бэкап.</b> Репликация мгновенно повторяет и порчу данных, и ошибочное удаление. Она защищает от отказа железа, а не от ошибки человека.</p>",
  cheat:"3-2-1: 3 копии, 2 носителя, 1 вне площадки; реплика ≠ бэкап",
  t:{q:"Напиши правило резервного копирования числами через дефис (например: 3-2-1).",ans:["3-2-1"],hint:"копии-носители-площадки",why:"3 копии, 2 разных носителя, 1 вне площадки — базовое правило, к которому добавляют неизменяемость (immutable)."}},
 {h:"RPO и RTO",b:"<div class='tw'><table><tr><th></th><th>RPO</th><th>RTO</th></tr><tr><td>вопрос</td><td>сколько данных допустимо потерять</td><td>за сколько обязаны восстановиться</td></tr><tr><td>определяет</td><td>частоту копий</td><td>способ и скорость восстановления</td></tr><tr><td>пример</td><td>1 час → бэкап каждый час</td><td>2 часа → нужен горячий резерв</td></tr></table></div><p>Эти два числа определяют архитектуру и стоят денег. Их называет бизнес, а не инженер: «сколько заказов мы готовы потерять» — вопрос не технический.</p>",
  t:{q:"Какая из двух метрик (RPO или RTO) определяет частоту резервного копирования?",ans:["RPO"],hint:"recovery point objective",why:"RPO — сколько данных допустимо потерять, отсюда частота копий. RTO — за сколько восстановиться, отсюда способ восстановления."}},
 {h:"Что бэкапить в инфраструктуре",b:"<ul><li>базы данных и файловые хранилища — очевидное</li><li><b>state Terraform</b> — версионирование бакета</li><li>конфигурации и манифесты — они в git, но и git нужно резервировать</li><li>секреты — в защищённом хранилище с собственным резервированием</li><li><b>etcd</b>, если кластер Kubernetes самоуправляемый</li><li>PersistentVolume в кластере — Velero или снапшоты дисков</li></ul>"},
 {h:"Проверка — единственное доказательство",b:"<p><b>Бэкап без тестового восстановления не считается бэкапом.</b> Типичные сюрпризы, которые вскрываются только на практике:</p><ul><li>архив создаётся, но пустой или битый</li><li>восстановление занимает 9 часов вместо обещанных двух</li><li>нет доступа к ключам шифрования бэкапа</li><li>бэкапится не та схема или не все таблицы</li></ul><p>Раз в квартал: поднять из копии, сверить контрольные данные, замерить фактический RTO. Зелёный статус задания проверяет факт запуска, а не пригодность копии.</p>"}],
 ch:[
 {t:"q",d:1,q:"RPO = 1 час означает…",a:["Восстановление занимает час","Допустимо потерять данные максимум за час — значит копии делаются не реже","Бэкап хранится час","Час простоя в месяц"],c:1,why:"RPO определяет частоту копий, RTO — скорость восстановления. Путаница между ними — частая ошибка на собеседовании."},
 {t:"q",d:2,q:"Почему репликация базы не заменяет бэкап?",a:["Она заменяет, если реплик несколько","Реплика мгновенно повторяет порчу и ошибочное удаление — она защищает от отказа железа, а не от ошибки человека","Реплика медленнее","Реплика дороже"],c:1,why:"Классический сценарий: DELETE без WHERE прилетает на все реплики за секунды. Спасает только копия на момент времени."},
 {t:"c",d:3,q:"Шифровальщик зашифровал прод и доступные из сети бэкапы. Напиши свойство копии (одно слово, англ.), которое должно было спасти — копия, из которой нельзя удалить данные.",ans:["immutable","immutability"],hint:"неизменяемая копия",why:"Атакующие целенаправленно ищут бэкапы. Версионирование с блокировкой удаления и офлайн-копия — то, что реально работает."},
 {t:"c",d:3,q:"Что бэкапить в самоуправляемом кластере Kubernetes в первую очередь? Напиши название компонента, который хранит всё состояние кластера.",ans:["etcd"],hint:"база состояния кластера",why:"etcd — всё состояние кластера. Для ресурсов и томов стандартный инструмент — Velero."},
 {t:"c",d:4,q:"Как убедиться, что бэкапы действительно работают, а не просто «зелёные» в отчёте? Напиши фразу (глагол + откуда), которую нужно делать регулярно.",ans:["восстанавливаться из копии","тестовое восстановление"],hint:"единственное реальное доказательство",why:"Зелёное задание проверяет факт запуска. Восстановление — единственное доказательство пригодности копии."},
 {t:"c",d:5,q:"Инцидент. Разработчик выполнил на проде миграцию, которая удалила колонку с данными. Обнаружили через два часа, бэкапы делаются раз в сутки ночью. Напиши термин (англ. аббревиатура из 4 букв), который нужен для восстановления данных на произвольный момент времени внутри дня, а не только на момент ночного бэкапа.",ans:["PITR"],hint:"point-in-time recovery",why:"Полный откат базы уничтожит все транзакции за день. Point-in-time recovery (через WAL) — правильный инструмент; вывод — RPO в сутки недостаточно."}]},

{id:"s4",t:"Подготовка к собеседованию",goal:"Уметь рассказать, а не только сделать",
 cards:[
 {h:"Структура ответа STAR",b:"<p><b>S</b>ituation — контекст. <b>T</b>ask — что требовалось. <b>A</b>ction — что сделал именно ты. <b>R</b>esult — измеримый итог.</p><p><i>«Пайплайн собирался 40 минут, релизы делали раз в неделю (S/T). Я закэшировал зависимости, распараллелил тесты и перевёл сборку на multi-stage (A). Стало 9 минут, деплоев в день — три вместо одного в неделю (R)».</i></p><p><b>Цифры важнее прилагательных.</b> «Ускорил» — ничего не значит; «с 40 до 9 минут» — проверяемый факт. Всегда заканчивай результатом в числах.</p>",
  t:{q:"Расшифруй аббревиатуру STAR четырьмя английскими словами через пробел:",ans:["situation task action result"],hint:"S... T... A... R...",why:"Situation → Task → Action → Result: структура, которая делает ответ проверяемым, а не набором прилагательных."}},
 {h:"Что спрашивают на middle",b:"<ul><li><b>Linux:</b> диагностика, права, процессы, диск, сеть</li><li><b>Сети:</b> путь запроса, 502 против 504, DNS, TLS</li><li><b>Docker:</b> слои, multi-stage, отличие от ВМ, безопасность</li><li><b>Kubernetes:</b> объекты, пробы, ресурсы, отладка пода, откат</li><li><b>CI/CD:</b> устройство пайплайна, стратегии деплоя, секреты</li><li><b>IaC:</b> state, идемпотентность, plan/apply</li><li><b>Мониторинг:</b> RED, перцентили, алерты, SLO</li><li><b>Поведенческое:</b> инцидент, конфликт с разработчиками, самая дорогая ошибка</li></ul><p>Технические вопросы почти всегда идут «вглубь»: за верным ответом следует «а почему?» и «а что, если?». Готовься объяснять механизм, а не называть команду.</p>"},
 {h:"Как отвечать, когда не знаешь",b:"<p>Худшее — выдумывать: это вскрывается следующим уточняющим вопросом и обесценивает всё сказанное ранее.</p><p>Рабочая формула: <i>«С этим конкретно не работал. Судя по тому, что это похоже на X, я бы начал с проверки Y и посмотрел в Z. Если ошибаюсь — поправьте, интересно, как правильно»</i>.</p><p>Интервьюер оценивает ход мыслей и честность выше зазубренного ответа: работать вы будете с незнакомыми задачами, и важно, как человек к ним подходит.</p>"},
 {h:"Пет-проект как козырь",b:"<pre>приложение → multi-stage Dockerfile → CI/CD с тестами и сканированием\n → registry с тегами по коммиту → Terraform для инфраструктуры\n → Kubernetes с пробами, лимитами и ингрессом\n → Prometheus + Grafana + алерты → README со схемой</pre><p>Это закрывает половину вопросов интервью: ты отвечаешь примерами из своего кода, а не пересказом статей. И даёт естественные ответы на поведенческие вопросы: что ломалось, как чинил, что изменил.</p>"},
 {h:"Практическая подготовка",b:"<ul><li>резюме по <b>результатам</b>, а не по списку технологий</li><li>30 отрепетированных <b>вслух</b> ответов, включая поведенческие</li><li>10 тренировочных собеседований — первые три будут провальными, это часть плана</li><li>свои вопросы работодателю: как устроены дежурства, есть ли постмортемы, как часто деплоят, кто отвечает за инциденты</li></ul><p>Последний пункт работает в обе стороны: он показывает зрелость и помогает не попасть в место, где вместо инженерной культуры героизм и ночные авралы.</p>"}],
 ch:[
 {t:"q",d:1,q:"Как правильно закончить ответ по методу STAR?",a:["Извинением за неидеальность","Измеримым результатом: время сборки, доступность, стоимость, число инцидентов","Шуткой","Перечислением использованных технологий"],c:1,why:"Цифры делают историю проверяемой и запоминающейся. Без результата рассказ звучит как описание процесса."},
 {t:"q",d:2,q:"«Расскажите о своей самой большой ошибке» — что хочет услышать интервьюер?",a:["Что ошибок не было","Конкретную ошибку, как её обнаружили, как чинили и что изменили в системе, чтобы не повторилась","Ошибку коллеги","Что виновата была компания"],c:1,why:"Оценивают зрелость и способность к системным выводам. «Ошибок не было» читается как отсутствие опыта или честности."},
 {t:"c",d:3,q:"Не знаешь ответа на технический вопрос. Напиши фразу-заготовку (2-3 слова), с которой стоит начать ответ, вместо того чтобы выдумывать.",ans:["с этим не работал","не сталкивался с этим"],hint:"честное признание + план",why:"Выдумка вскрывается следующим уточняющим вопросом. Ход мыслей ценят выше заученного ответа."},
 {t:"c",d:3,q:"Напиши хотя бы один вопрос (коротко), который стоит задать работодателю о культуре эксплуатации в конце собеседования.",ans:["как устроены дежурства","есть ли постмортемы","как часто деплоят"],hint:"дежурства, постмортемы, частота деплоев",why:"Эти вопросы показывают инженерную зрелость и одновременно защищают тебя: ответы говорят о культуре команды больше, чем описание вакансии."},
 {t:"c",d:4,q:"На вопрос «Kubernetes или простой деплой на пару серверов» — какой ответ звучит на уровне middle? Напиши одно слово: от чего должен зависеть выбор (кроме моды на технологию).",ans:["нагрузка","требований","критериев"],hint:"конкретные критерии, а не лозунг",why:"Умение назвать критерии, а не лозунги, — главный признак middle. Технология не самоцель, а решение с ценой."},
 {t:"c",d:5,q:"Инцидент на собеседовании. Тебе дают задачу: «сайт отдаёт 502, у тебя пять минут, рассуждай вслух». Напиши цепочку диагностики через стрелку из пяти звеньев (например: DNS → TCP → ... → ... → БД).",ans:["DNS → TCP → TLS → прокси → приложение → БД","dns tcp tls прокси приложение бд"],hint:"от клиента до базы",why:"Интервьюер смотрит, как ты сужаешь пространство поиска и не бросаешься чинить наугад — важен метод, а не угаданный ответ."}]}
);

{id:"z1",t:"Архитектура Zabbix",goal:"Понимать, из чего состоит система и кто с кем говорит",
 cards:[
 {h:"Компоненты",b:"<div class='tw'><table><tr><th>компонент</th><th>роль</th></tr><tr><td><b>Zabbix Server</b></td><td>ядро: опрашивает, считает триггеры, шлёт уведомления</td></tr><tr><td><b>Zabbix Agent</b></td><td>ставится на хост, собирает локальные метрики (CPU, диск, процессы)</td></tr><tr><td><b>Zabbix Proxy</b></td><td>опциональный посредник для удалённых сетей и снижения нагрузки на сервер</td></tr><tr><td><b>БД</b> (MySQL/PostgreSQL)</td><td>хранит конфигурацию, историю и тренды значений</td></tr><tr><td><b>Web-фронтенд</b></td><td>интерфейс: настройка, дашборды, отчёты</td></tr></table></div><p>Сервер — единственный, кто принимает решения (триггеры, эскалации). Всё остальное — сбор и хранение данных для него.</p>",
  cheat:"Server=мозг, Agent=сборщик на хосте, Proxy=посредник, DB=хранилище, Web=интерфейс"},
 {h:"Passive и active агент",b:"<p><b>Passive</b> (по умолчанию): сервер сам подключается к агенту на порт 10050 и спрашивает значение каждого item по расписанию.</p><p><b>Active</b>: агент сам подключается к серверу, получает список своих items и дальше сам присылает значения (порт 10051, trapper).</p><p>Active выгоднее при большом числе хостов и агентов за NAT: не нужно, чтобы сервер достучался до каждого агента — только агент должен достучаться до сервера.</p>",
  cheat:"passive: сервер→агент (10050), active: агент→сервер (10051)",
  t:{q:"На каком порту сервер по умолчанию опрашивает passive-агента?",ans:["10050"],hint:"порт агента",why:"10050 — агент слушает запросы сервера (passive). 10051 — сервер слушает данные от active-агентов и trapper-items."}},
 {h:"Опрос против отправки",b:"<p>Помимо агента, у Zabbix есть и другие способы получения данных:</p><ul><li><b>SNMP</b> — сетевое оборудование, принтеры, ИБП</li><li><b>Trapper</b> — данные присылает внешний скрипт через <code>zabbix_sender</code>, сервер их просто принимает</li><li><b>HTTP agent</b> — Zabbix сам ходит на URL и парсит ответ</li><li><b>IPMI</b> — аппаратные датчики серверов (температура, вентиляторы)</li></ul><p>Выбор типа item определяет, кто инициирует передачу данных — это первое, что проверяют при диагностике «данные не идут».</p>"},
 {h:"Frontend и права",b:"<p>Веб-интерфейс не хранит логику мониторинга сам — он читает и пишет конфигурацию через ту же БД, что использует сервер. Права разграничены по группам хостов: оператор поддержки видит только свои системы, администратор — всё.</p><p>Частая ошибка новичка: искать проблему в интерфейсе, когда на самом деле не пришли данные от агента — фронтенд лишь показывает то, что успел собрать и посчитать сервер.</p>"}],
 ch:[
 {t:"q",d:1,q:"Что делает Zabbix Server?",a:["Только хранит данные","Опрашивает источники, вычисляет триггеры и рассылает уведомления — центр принятия решений","Только рисует графики","Заменяет базу данных"],c:1,why:"Сервер — единственный компонент, который решает, есть проблема или нет. Агент и прокси только поставляют данные."},
 {t:"q",d:2,q:"Зачем нужен Zabbix Proxy?",a:["Для красоты в интерфейсе","Собирать данные локально в удалённой сети и снижать нагрузку/трафик до центрального сервера","Заменяет агента","Нужен только для SNMP"],c:1,why:"Proxy особенно полезен при плохом канале до сервера: буферизует данные и переживает временный разрыв связи."},
 {t:"c",d:3,q:"Напиши номер порта, на котором сервер слушает данные от active-агентов и trapper-items.",ans:["10051"],hint:"порт сервера",why:"10051 — входящий порт сервера. Active-агент и zabbix_sender подключаются именно к нему."},
 {t:"c",d:3,q:"Хосты находятся за NAT, сервер не может инициировать к ним подключение. Напиши режим агента (одно слово, англ.), который решает эту проблему.",ans:["active"],hint:"агент сам приходит к серверу",why:"В active-режиме именно агент инициирует соединение к серверу — направление подключения не упирается в NAT на стороне хостов."},
 {t:"c",d:4,q:"Нужно собирать температуру с сетевого коммутатора, у которого нет Zabbix-агента. Напиши тип item (протокол, англ. аббревиатура), который для этого используют.",ans:["SNMP","snmp"],hint:"стандартный протокол сетевого мониторинга",why:"SNMP — основной способ мониторить оборудование, где нельзя поставить агента: свитчи, принтеры, ИБП."},
 {t:"c",d:5,q:"Инцидент. В интерфейсе Zabbix не видно свежих данных ни по одному хосту уже час, хотя раньше всё работало. Напиши, какой компонент нужно проверить первым (не агент, не хосты) — тот, через который фронтенд читает данные.",ans:["сервер","Zabbix Server"],hint:"без него данные не считаются и не сохраняются",why:"Если упал сам Zabbix Server, агенты продолжают работать, но некому опрашивать, считать триггеры и писать в БД — фронтенд просто показывает то, что было собрано раньше."}]},

{id:"z2",t:"Установка и первое подключение хоста",goal:"Довести агент от нуля до данных на графике",
 cards:[
 {h:"Конфиг агента",b:"<pre># /etc/zabbix/zabbix_agentd.conf\nServer=10.0.1.5          <span class='c'># кому разрешено опрашивать (passive)</span>\nServerActive=10.0.1.5    <span class='c'># куда самому слать данные (active)</span>\nHostname=web-01           <span class='c'># имя, под которым хост заведён в Zabbix</span>\nListenPort=10050</pre><p><code>Hostname</code> в конфиге агента обязан <b>точно</b> совпадать с именем хоста, заведённым во фронтенде — иначе сервер получает данные, но не может сопоставить их ни с одним хостом.</p>",
  cheat:"Server= (кто опрашивает), ServerActive= (кому слать), Hostname= (должен совпадать с фронтендом)",
  t:{q:"Каким параметром конфига агента задаётся имя хоста, под которым он должен быть заведён во фронтенде Zabbix?",ans:["Hostname"],hint:"Hostname=...",why:"Несовпадение Hostname в конфиге и во фронтенде — самая частая причина «агент работает, а данных нет»."}},
 {h:"Добавление хоста во фронтенде",b:"<p>Data collection → Hosts → Create host: указываешь имя (совпадающее с <code>Hostname</code> агента), группу хостов и интерфейс — IP и порт, по которому сервер будет опрашивать (для passive) или ничего, если только active.</p><p>Хост без привязанного шаблона не соберёт ни одной метрики: сами по себе хосты — это только карточка, items приходят из шаблонов или создаются вручную.</p>"},
 {h:"Проверка после установки",b:"<pre>systemctl status zabbix-agent\nsystemctl restart zabbix-agent\nzabbix_agentd -t agent.ping        <span class='c'># проверить конкретный item локально</span>\nzabbix_get -s 10.0.1.20 -k agent.ping   <span class='c'># с сервера, как это видит Zabbix</span></pre><p><code>zabbix_agentd -t</code> запускается прямо на хосте с агентом и показывает, что вернул бы конкретный ключ — не нужно ждать реального опроса сервером.</p>",
  cheat:"zabbix_get -s <хост> -k <ключ> — проверка item с сервера, как видит Zabbix",
  t:{q:"Проверь с сервера, что вернёт item agent.ping на хосте 10.0.1.20.",ans:["zabbix_get -s 10.0.1.20 -k agent.ping"],hint:"zabbix_get -s <IP> -k <ключ>",why:"zabbix_get подключается к агенту напрямую, минуя очередь и интервалы сервера — быстрый способ проверить связь."}},
 {h:"Частые причины «нет данных» на новом хосте",b:"<ol><li>несовпадение <code>Hostname</code> в конфиге и во фронтенде</li><li>агент не запущен или файрвол блокирует порт 10050/10051</li><li>к хосту не привязан ни один шаблон — items просто не созданы</li><li>неверный <code>Server=</code>/<code>ServerActive=</code> в конфиге — агент не пускает или не знает, куда слать</li></ol><p>Диагностика всегда идёт по этому списку сверху вниз: сначала связь, потом конфигурация items.</p>"}],
 ch:[
 {t:"c",d:1,q:"Проверь статус службы агента на хосте.",ans:["systemctl status zabbix-agent"],hint:"systemctl status <служба>",why:"Первый шаг диагностики: жив ли процесс агента вообще."},
 {t:"c",d:2,q:"Проверь локально на агенте, что вернёт item agent.ping, не дожидаясь опроса сервером.",ans:["zabbix_agentd -t agent.ping"],hint:"zabbix_agentd -t <ключ>",why:"Флаг -t тестирует item прямо на месте — полезно, когда неясно, проблема в агенте или в сети до сервера."},
 {t:"c",d:3,q:"Хост заведён во фронтенде под именем web-01, но данные не поступают. Напиши параметр конфига агента (без значения), который нужно сверить в первую очередь.",ans:["Hostname"],hint:"должен совпадать с именем во фронтенде",why:"Несовпадение Hostname — самая частая причина «агент работает, а данных нет»: сервер получает данные, но не может их сопоставить с хостом."},
 {t:"c",d:3,q:"Напиши команду, которой с сервера (IP агента 10.0.1.20) проверяется item agent.ping.",ans:["zabbix_get -s 10.0.1.20 -k agent.ping"],hint:"zabbix_get -s <IP> -k <ключ>",why:"zabbix_get показывает то же самое, что видел бы сервер при реальном опросе — минуя интервал и очередь."},
 {t:"c",d:4,q:"Хост заведён, агент запущен, Hostname совпадает — но ни одной метрики нет. Напиши причину (два-три слова): что не привязано к хосту, из-за чего items просто не создались.",ans:["шаблон","нет шаблона"],hint:"без него не появляются items",why:"Хост без привязанного шаблона — это только карточка. Items либо создаются шаблоном, либо вручную — без них собирать нечего."},
 {t:"c",d:5,q:"Инцидент. Новый хост добавлен, шаблон привязан, но во фронтенде статус item'ов — Not supported. Напиши команду, которой проверить с сервера, что реально возвращает агент по ключу vfs.fs.size[/,pfree] на хосте 10.0.2.15.",ans:["zabbix_get -s 10.0.2.15 -k vfs.fs.size[/,pfree]"],hint:"zabbix_get -s <IP> -k <ключ с параметрами>",why:"Not supported означает, что агент/сервер не смог получить значение — часто из-за неверного ключа или отсутствия прав. zabbix_get воспроизводит ровно тот же запрос, что делает сервер."}]},

{id:"z3",t:"Items: что и как собирать",goal:"Настроить сбор метрик осознанно, а не по шаблону вслепую",
 cards:[
 {h:"Ключ item'а",b:"<pre>agent.ping                     <span class='c'># жив ли агент</span>\nsystem.cpu.load[all,avg1]      <span class='c'># load average за 1 мин</span>\nvfs.fs.size[/,pfree]           <span class='c'># % свободного места на /</span>\nnet.tcp.port[,443]             <span class='c'># слушает ли порт 443</span>\nproc.num[nginx]                <span class='c'># число процессов nginx</span></pre><p>Ключ — это <b>имя функции с параметрами в квадратных скобках</b>. Полный список ключей и параметров смотрят в документации агента — их сотни, и запоминать все не нужно, важно понимать синтаксис.</p>",
  cheat:"ключ[параметр1,параметр2] — синтаксис item, параметры в квадратных скобках"},
 {h:"Тип хранения: history и trends",b:"<div class='tw'><table><tr><th></th><th>history</th><th>trends</th></tr><tr><td>что хранит</td><td>каждое отдельное значение</td><td>агрегаты по часам: min/avg/max</td></tr><tr><td>срок по умолчанию</td><td>короткий (дни-недели)</td><td>долгий (годы)</td></tr><tr><td>для чего</td><td>детальный график, диагностика</td><td>долгосрочные тренды, отчёты</td></tr></table></div><p>History storage period настраивают короче для шумных item'ов (каждую секунду) и длиннее для редких и важных (раз в час). Не задирай хранение истории «на всякий случай» — это прямой рост базы.</p>"},
 {h:"Интервал опроса и типы проверок",b:"<p><b>Update interval</b> — как часто опрашивать. Для CPU и сети — 30-60 секунд достаточно, для проверки сертификата — раз в сутки хватит с избытком.</p><p><b>Custom intervals</b> позволяют опрашивать реже ночью или чаще во время инцидента (flexible interval) — без ручного редактирования каждого item'а.</p><p>Слишком частый опрос десятков item'ов на сотнях хостов — прямая причина роста нагрузки на Zabbix Server и БД, а не только на сеть.</p>",
  t:{q:"Напиши ключ item'а, который проверяет процент свободного места в корневом разделе /.",ans:["vfs.fs.size[/,pfree]"],hint:"vfs.fs.size[<точка монтирования>,pfree]",why:"pfree — процент свободного, bytesfree — байты. Оба параметра ключа vfs.fs.size стоит знать наизусть."}},
 {h:"Preprocessing",b:"<pre>получил: '{\"free_mb\": 512, \"total_mb\": 2048}'\nJSONPath: $.free_mb\n→ ещё один шаг: Custom multiplier ×1048576  <span class='c'># мегабайты в байты</span></pre><p>Preprocessing — цепочка шагов обработки полученного значения <b>до</b> записи в историю: вытащить поле из JSON, умножить, привести единицы, отбросить погрешность. Позволяет получать сырые данные откуда угодно (HTTP agent, скрипт) и приводить их к нужному виду прямо в Zabbix, не трогая источник.</p>"}],
 ch:[
 {t:"q",d:1,q:"Что делает item с ключом agent.ping?",a:["Меряет пинг до сервера","Проверяет, что агент жив и отвечает","Пингует другие хосты","Проверяет доступность порта 443"],c:1,why:"agent.ping — самый базовый item: возвращает 1, если агент смог обработать запрос. Часто основа для триггера доступности хоста."},
 {t:"c",d:2,q:"Напиши ключ item'а, который показывает число запущенных процессов nginx.",ans:["proc.num[nginx]"],hint:"proc.num[имя_процесса]",why:"proc.num с именем процесса в параметре — стандартный способ следить, что критичный процесс жив и не расплодился."},
 {t:"c",d:3,q:"Item каждую секунду пишет в history, база растёт неконтролируемо. Напиши, какой из двух параметров хранения (history или trends) стоит сократить для этого шумного item'а.",ans:["history"],hint:"детальные отдельные значения, а не агрегаты",why:"History storage period настраивают короче для шумных item'ов. Trends можно оставить длинным — это уже агрегаты по часам, они дешевле."},
 {t:"c",d:3,q:"Напиши ключ item'а, который проверяет, слушает ли хост порт 443.",ans:["net.tcp.port[,443]"],hint:"net.tcp.port[,<порт>]",why:"net.tcp.port возвращает 0/1 — удобная база для триггера «сервис не слушает порт»."},
 {t:"c",d:4,q:"Источник отдаёт JSON {\"free_mb\": 512}, а в Zabbix нужно получить именно число свободных мегабайт. Напиши название механизма (англ., одно слово), который вытаскивает поле из JSON до записи в историю.",ans:["preprocessing"],hint:"обработка значения перед сохранением",why:"Preprocessing позволяет приводить сырые данные к нужному виду прямо в Zabbix через JSONPath, регулярки, множители — не трогая источник данных."},
 {t:"c",d:5,q:"Инцидент. Zabbix Server и БД перегружены, дашборды тормозят. Аудит показал: 200 хостов опрашивают по 40 item'ов каждую секунду. Напиши, что нужно изменить в первую очередь (термин из двух слов, англ.), чтобы снизить нагрузку без потери важных данных.",ans:["update interval"],hint:"как часто опрашивается item",why:"Слишком частый опрос — прямая причина роста нагрузки на сервер и БД. Для большинства метрик 30-60 секунд достаточно; секундный интервал нужен единицам item'ов, а не всем сразу."}]},

{id:"z4",t:"Триггеры: превратить данные в проблему",goal:"Написать выражение, которое не дребезжит и не молчит",
 cards:[
 {h:"Анатомия выражения",b:"<pre>last(/web-01/vfs.fs.size[/,pfree])&lt;10\n\navg(/web-01/system.cpu.load[all,avg1],5m)&gt;5\n\nnodata(/web-01/agent.ping,3m)=1</pre><p>Формат: <code>функция(/хост/ключ,параметры)оператор значение</code>. <code>last()</code> — последнее значение, <code>avg()</code> — среднее за окно, <code>nodata()</code> — данных не поступало заданное время (главный способ поймать «хост отвалился»).</p>",
  cheat:"last()=последнее, avg(item,5m)=среднее за окно, nodata(item,3m)=1 → данных нет N времени"},
 {h:"Severity и хорошая формулировка",b:"<div class='tw'><table><tr><th>severity</th><th>когда</th></tr><tr><td>Disaster</td><td>сервис полностью недоступен, деньги/клиенты страдают</td></tr><tr><td>High</td><td>серьёзная деградация, нужно действие сейчас</td></tr><tr><td>Average</td><td>приближение к пределу, стоит посмотреть</td></tr><tr><td>Warning / Information</td><td>для контекста, не для будильника</td></tr></table></div><p>Название триггера должно быть понятно человеку в 4 утра без открытия выражения: <i>«Свободное место на / меньше 10% на {HOST.NAME}»</i>, а не <i>«Trigger 47»</i>.</p>"},
 {h:"Гистерезис и дребезг",b:"<p>Если триггер срабатывает при <code>&gt;90</code> и гаснет при <code>&lt;90</code>, значение, колеблющееся ровно у 90, даёт бесконечный PROBLEM/OK/PROBLEM — <b>дребезг</b>.</p><pre>expression:    last(/h/item)&gt;90\nrecovery:      last(/h/item)&lt;80</pre><p><b>Гистерезис</b> — разные пороги для входа в проблему и выхода из неё (recovery expression). Разрыв между 90 и 80 не даёт триггеру мигать при небольших колебаниях около границы.</p><p>Второй способ снять дребезг — усреднение через <code>avg(item,5m)</code> вместо мгновенного <code>last()</code>.</p>",
  t:{q:"Напиши функцию (без параметров), которой в выражении триггера ловят ситуацию «данные от хоста не поступают».",ans:["nodata()","nodata"],hint:"буквально «нет данных»",why:"nodata(item,3m)=1 — главный способ поймать зависший или упавший хост, когда обычные триггеры на значения item'а молчат."}},
 {h:"Зависимости между триггерами",b:"<p>Упал коммутатор — легли 40 хостов за ним. Без зависимостей дежурный получает 40 уведомлений вместо одного.</p><p><b>Trigger dependency</b>: триггер «хост недоступен» становится зависимым от триггера «коммутатор недоступен» — пока коммутатор в проблеме, зависимые триггеры не эскалируют уведомления, хотя формально остаются в статусе PROBLEM.</p><p>Это тот же принцип, что inhibition в Alertmanager: не будить дежурного двадцать раз об одной причине.</p>"}],
 ch:[
 {t:"c",d:1,q:"Напиши функцию выражения триггера, которая возвращает последнее полученное значение item'а.",ans:["last()","last"],hint:"самая простая функция",why:"last(/хост/item) — база большинства простых триггеров: сравнить последнее значение с порогом."},
 {t:"q",d:2,q:"Триггер называется «Trigger 47». Что с ним не так?",a:["Ничего, работает же","Название непонятно человеку без открытия выражения — в 4 утра дежурный должен сразу понимать проблему из текста","Слишком длинное имя","Нужно добавить emoji"],c:1,why:"Хорошее имя: «Свободное место на / меньше 10% на {HOST.NAME}» — сразу ясно, что случилось и где, без разбора выражения."},
 {t:"c",d:3,q:"Хост отвалился от сети, но обычные триггеры на значения item'ов молчат — данные просто перестали поступать. Напиши функцию (с параметром 3m), которая это ловит.",ans:["nodata(item,3m)","nodata(/хост/item,3m)"],hint:"nodata(item,время)",why:"nodata(item,3m)=1 — главный способ поймать зависший или упавший хост. Обычные пороговые триггеры на этот случай не реагируют."},
 {t:"c",d:3,q:"Триггер срабатывает при last()>90 и гаснет при last()<90 — значение колеблется около 90 и триггер дребезжит. Напиши recovery expression с разрывом (гистерезисом), например до 80.",ans:["last(/h/item)<80"],hint:"более низкий порог для выхода из проблемы",why:"Гистерезис — разные пороги для входа и выхода из проблемы. Разрыв между 90 и 80 не даёт триггеру мигать при небольших колебаниях."},
 {t:"c",d:4,q:"Упал коммутатор — легли 40 хостов за ним, дежурный получил 40 уведомлений. Напиши название механизма (два слова, англ.), который делает зависимые триггеры не эскалирующими, пока активен триггер верхнего уровня.",ans:["trigger dependency","trigger dependencies"],hint:"зависимость между триггерами",why:"Trigger dependency — тот же принцип, что inhibition в Alertmanager: не будить дежурного двадцать раз об одной причине."},
 {t:"c",d:5,q:"Инцидент. Триггер на CPU срабатывает и гаснет каждые 20-30 секунд около порога, дежурного заваливает уведомлениями. Напиши, какую функцию нужно применить вместо last(), чтобы сгладить кратковременные скачки (с окном, например 5 минут).",ans:["avg(item,5m)","avg(/h/item,5m)"],hint:"усреднение вместо мгновенного значения",why:"avg(item,5m) сглаживает шум — кратковременный всплеск не выбивает среднее за окно выше порога. Вместе с гистерезисом это основной способ борьбы с дребезгом."}]},

{id:"z5",t:"Шаблоны и автообнаружение",goal:"Настроить сотню хостов один раз, а не по одному",
 cards:[
 {h:"Шаблон — это переиспользуемый набор",b:"<p>Template содержит items, triggers, graphs и dashboards. Привязал шаблон к хосту — все items и триггеры появились сразу, без ручного создания на каждом хосте.</p><p>Изменил item в шаблоне — изменение прилетает на все хосты, использующие этот шаблон. Именно так поддерживают мониторинг сотен однотипных серверов: правишь один шаблон, а не сто хостов.</p>"},
 {h:"Макросы делают шаблон гибким",b:"<pre>{$FS.PFREE.MIN}     <span class='c'># порог свободного места, по умолчанию 10</span>\n\nlast(/{HOST.HOST}/vfs.fs.size[/,pfree])&lt;{$FS.PFREE.MIN}</pre><p>Макрос уровня шаблона задаёт значение по умолчанию, а на конкретном хосте его можно переопределить: для хоста с базой данных порог места на диске логично сделать выше, чем для обычного веб-сервера — без создания отдельного шаблона.</p>",
  cheat:"{$MACRO} на уровне шаблона = значение по умолчанию, переопределяется на хосте",
  t:{q:"Напиши синтаксис пользовательского макроса Zabbix для порога свободного места (без указания значения).",ans:["{$FS.PFREE.MIN}","{$MACRO}"],hint:"фигурные скобки и знак доллара",why:"Макрос уровня шаблона задаёт значение по умолчанию, переопределяемое на конкретном хосте — так один шаблон обслуживает хосты с разными требованиями."}},
 {h:"Low-Level Discovery (LLD)",b:"<p>Задача: на сервере с переменным числом дисков или сетевых интерфейсов нельзя заранее прописать item на каждый — их количество и имена разные на каждом хосте.</p><pre>Discovery rule: vfs.fs.discovery\n  → находит все точки монтирования\nItem prototype: vfs.fs.size[{#FSNAME},pfree]\n  → создаёт item для КАЖДОЙ найденной точки\nTrigger prototype: last(...)&lt;{$FS.PFREE.MIN}\n  → создаёт триггер для КАЖДОГО item'а</pre><p>LLD периодически пересканирует хост: появился новый диск — появился и item с триггером, без участия человека.</p>",
  cheat:"LLD: discovery rule находит объекты → item prototype создаёт item на каждый"},
 {h:"Наследование и конфликты",b:"<p>Хост может использовать несколько шаблонов одновременно (например, «OS Linux» + «Nginx» + «Application X»). Item, добавленный вручную прямо на хосте, имеет приоритет над шаблонным с тем же ключом.</p><p>Частая ошибка: поправить item на хосте вручную «чтобы починить», а через месяц забыть — при обновлении шаблона это ручное переопределение никто не заметит и не обновит.</p>"}],
 ch:[
 {t:"q",d:1,q:"Что даёт привязка шаблона к хосту?",a:["Только визуальное оформление","Хост сразу получает все items, триггеры и графики шаблона без ручного создания","Ускоряет опрос","Ничего не меняет"],c:1,why:"Изменения в шаблоне распространяются на все хосты, использующие его — так поддерживают мониторинг сотен однотипных серверов одной правкой."},
 {t:"q",d:2,q:"Зачем нужны пользовательские макросы вида {$FS.PFREE.MIN}?",a:["Для красоты в интерфейсе","Задать значение по умолчанию в шаблоне и переопределить его для конкретного хоста без создания отдельного шаблона","Только для паролей","Заменяют items"],c:1,why:"Хост с базой данных может иметь другой порог свободного места, чем обычный веб-сервер — без дублирования шаблона."},
 {t:"c",d:3,q:"На сервере разное число дисков на разных хостах, и заранее прописать item на каждый диск нельзя. Напиши название механизма (англ. аббревиатура из трёх букв), который сам находит объекты и создаёт items по шаблону-прототипу.",ans:["LLD"],hint:"Low-Level Discovery",why:"LLD периодически пересканирует хост: появился новый диск — автоматически появляется item и триггер на него, без участия человека."},
 {t:"c",d:3,q:"Напиши макрос LLD (в фигурных скобках с решёткой), который в item prototype подставляется именем найденной точки монтирования.",ans:["{#FSNAME}"],hint:"макрос LLD начинается с {# ...}",why:"{#FSNAME} заполняется discovery rule для каждой найденной точки монтирования — из него получается конкретный item на конкретном диске."},
 {t:"c",d:4,q:"Item, добавленный шаблоном, и item, добавленный вручную прямо на хосте с тем же ключом — какой из них имеет приоритет? Напиши одно слово.",ans:["вручную","хостовый"],hint:"более конкретный уровень переопределяет общий",why:"Ручное переопределение на хосте выигрывает у шаблонного — и именно поэтому оно опасно: при обновлении шаблона такую правку никто не заметит и не обновит."},
 {t:"c",d:5,q:"Инцидент. После обновления общего шаблона у трёх хостов из ста пропали кастомные пороги на дисковое пространство, настроенные полгода назад вручную прямо на хосте. Напиши, что нужно было использовать вместо ручной правки item'а на хосте, чтобы это пережило обновление шаблона (термин из предыдущей карточки, англ.).",ans:["макрос","{$MACRO}","пользовательский макрос"],hint:"переопределение через значение макроса на хосте, а не правка item'а",why:"Переопределение макроса на уровне хоста переживает обновление шаблона, а ручная правка item'а — нет, потому что шаблон просто перезаписывает то, чем управляет сам."}]},

{id:"z6",t:"Действия, уведомления и эскалации",goal:"Довести проблему до нужного человека вовремя",
 cards:[
 {h:"Anatomy of an Action",b:"<pre>Action: \"Уведомить о проблемах диска\"\nConditions: Trigger name contains \"disk\" AND Severity >= High\nOperations:\n  Step 1 (0m):  notify on-call (Telegram)\n  Step 2 (15m): notify team lead (email) — если ещё не решено\n  Step 3 (30m): notify manager                                </pre><p>Action связывает условие (какие проблемы это касается) с операциями (кому и когда слать). Эскалация по шагам — если проблема не подтверждена (acknowledged) за 15 минут, уведомление идёт выше.</p>",
  cheat:"Action = Conditions (какие проблемы) + Operations (эскалация по шагам)"},
 {h:"Media types и получатели",b:"<p>Media type — канал доставки: email, Telegram, Slack (через webhook), SMS-шлюз. У каждого пользователя своя media с расписанием (например, SMS только ночью, Telegram — всегда).</p><p>User group определяет, кто вообще может получать уведомления по конкретному Action — так поддержка не получает алерты про Kubernetes, а инженеры инфраструктуры не тонут в тикетах поддержки.</p>"},
 {h:"Acknowledge и подавление шума",b:"<p><code>Acknowledge</code> — дежурный подтверждает: «вижу, разбираюсь». Это не решает проблему, но останавливает эскалацию на следующий уровень — иначе через 15 минут разбудят ещё и тимлида, хотя работа уже идёт.</p><p><b>Maintenance period</b> — плановое окно (например, во время деплоя) подавляет уведомления по выбранным хостам, но данные продолжают собираться. Это отличается от отключения хоста: история не рвётся, просто не будят зря.</p>",
  t:{q:"Напиши термин (одно слово, англ.), которым дежурный подтверждает проблему и тем самым останавливает дальнейшую эскалацию по шагам Action.",ans:["acknowledge","ack"],hint:"буквально «подтвердить»",why:"Acknowledge не решает проблему, но сигнализирует остальной цепочке эскалации: «уже занимаются» — следующий шаг (например, уведомление тимлида) не выполняется."}},
 {h:"Проблема эскалаций «в лоб»",b:"<p>Плохой Action: одно правило на все триггеры, один канал, без иерархии — либо шлёт слишком много (fatigue), либо слишком мало (пропущенный Disaster тонет среди Warning).</p><p>Рабочий подход: отдельные Actions по severity и по группе хостов, эскалация ступенями, обязательный Acknowledge для остановки эскалации, и Maintenance period на время плановых работ — чтобы плановый деплой не будил дежурного ложной тревогой.</p>"}],
 ch:[
 {t:"q",d:1,q:"Из чего состоит Action в Zabbix?",a:["Только из текста уведомления","Из условий (Conditions) — каких проблем это касается, и операций (Operations) — кому и когда слать","Только из списка получателей","Из одного триггера"],c:1,why:"Conditions фильтруют проблемы, Operations описывают ступенчатую эскалацию во времени — оба компонента обязательны для рабочего Action."},
 {t:"q",d:2,q:"Зачем нужны разные Media types для разных пользователей?",a:["Для разнообразия интерфейса","Разные каналы и расписания доставки: например, SMS только ночью, Telegram всегда — под роль и доступность человека","Media type не влияет на доставку","Только для истории"],c:1,why:"User group определяет, кто вообще получает уведомления по Action, а Media — как именно каждому из них удобнее их получать."},
 {t:"c",d:3,q:"Дежурный увидел алерт и начал разбираться, но через 15 минут система всё равно уведомила тимлида, будто ничего не происходит. Напиши действие (термин, англ.), которое дежурному нужно было выполнить, чтобы остановить эскалацию.",ans:["acknowledge","ack"],hint:"подтвердить проблему",why:"Acknowledge сигнализирует цепочке эскалации, что проблемой уже занимаются — без него Action продолжает эскалировать по расписанию, даже если работа идёт."},
 {t:"c",d:3,q:"Плановый деплой на час гарантированно вызовет срабатывание нескольких триггеров на затронутых хостах. Напиши механизм (два слова, англ.), который подавляет уведомления на это время, не прерывая сбор данных.",ans:["maintenance period","maintenance"],hint:"плановое окно обслуживания",why:"Maintenance period отличается от отключения хоста: история продолжает собираться, просто уведомления по выбранным хостам временно не отправляются."},
 {t:"c",d:4,q:"Одно правило Action покрывает все триггеры без разделения по severity — Disaster тонет среди потока Warning. Напиши, что нужно добавить в Conditions, чтобы критичные проблемы обрабатывались отдельным (более быстрым) Action.",ans:["severity","Severity >= High"],hint:"условие по уровню важности",why:"Разделение Actions по severity — то же самое, что уровни critical/warning/info в Alertmanager: у каждого свой канал и своя скорость эскалации."},
 {t:"c",d:5,q:"Инцидент. Ночью пришло 30 уведомлений о разных дисках на разных хостах одного дата-центра, хотя причина одна — авария на уровне сети ДЦ. Напиши, какой механизм из предыдущей миссии (два слова, англ.) нужно настроить между триггером сети и триггерами дисков, чтобы получить одно уведомление вместо тридцати.",ans:["trigger dependency","trigger dependencies"],hint:"уже встречался в миссии про триггеры",why:"Trigger dependency: пока активен триггер верхнего уровня (авария сети), зависимые триггеры не эскалируют собственные уведомления — та же идея, что inhibition в Alertmanager."}]}
);
