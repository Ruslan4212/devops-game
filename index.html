{id:"c1",t:"Зачем нужен конвейер",goal:"Понимать смысл, а не только синтаксис YAML",
 cards:[
 {h:"CI, Delivery, Deployment",b:"<div class='tw'><table><tr><th>термин</th><th>что означает</th></tr><tr><td><b>CI</b> — непрерывная интеграция</td><td>каждый push автоматически собирается и проходит тесты; поломка видна за минуты, а не за неделю</td></tr><tr><td><b>Continuous Delivery</b></td><td>артефакт всегда готов к выкатке, но кнопку жмёт человек</td></tr><tr><td><b>Continuous Deployment</b></td><td>зелёный пайплайн едет на прод сам</td></tr></table></div><p>Разницу между двумя CD спрашивают почти на каждом собеседовании — она в наличии ручного гейта.</p>",
  t:{q:"Как одним словом называется практика, когда каждый push автоматически собирается и тестируется?",ans:["CI","ci","continuous integration"],hint:"непрерывная ...",why:"CI — фундамент: без автосборки на каждый push всё остальное (Delivery, Deployment) не имеет смысла."}},
 {h:"Типовой конвейер",b:"<pre>lint → test → build → scan → publish → deploy(staging) → deploy(prod)</pre><p>Три принципа, определяющие порядок:</p><ul><li><b>Быстрая обратная связь.</b> Дешёвые проверки первыми: линтер за 8 секунд отсекает то, ради чего не стоит собирать образ.</li><li><b>Fail fast.</b> Упало — останавливаемся, а не идём дальше «на всякий случай».</li><li><b>Build once, deploy everywhere.</b> Артефакт собирается <b>один раз</b> и продвигается по средам. Отличается только конфигурация.</li></ul>",
  cheat:"lint→test→build→scan→publish→deploy — дешёвое и быстрое раньше, дорогое позже",
  t:{q:"Расположи в правильном порядке (через пробел): build test lint",ans:["lint test build","lint, test, build"],hint:"дешёвое и быстрое всегда идёт первым",why:"Линтер стоит секунды, сборка образа — минуты. Нет смысла собирать то, что не проходит статический анализ."}},
 {h:"Почему нельзя пересобирать под каждую среду",b:"<p>Если образ для staging и prod собираются отдельно, это <b>два разных артефакта</b>: другая версия зависимости, другой порядок сборки, другой базовый слой, обновившийся за час.</p><p>Тестировали одно — выкатили другое. Гарантия «протестировано» исчезает, а фраза «на стейдже работало» становится постоянной.</p><p>Практика: собрали <code>app:1a2b3c4</code>, прогнали тесты, выкатили <b>этот же</b> образ на staging, затем <b>этот же</b> на prod.</p>"},
 {h:"Из чего состоит пайплайн",b:"<ul><li><b>Триггер</b> — что запускает: push, PR, тег, расписание, ручной запуск</li><li><b>Раннер (agent)</b> — машина или контейнер, где выполняются шаги</li><li><b>Стадии и job'ы</b> — job'ы одной стадии обычно идут параллельно</li><li><b>Артефакты</b> — то, что передаётся дальше или сохраняется для человека</li><li><b>Секреты</b> — токены и ключи, доступные шагам, но не видимые в логах</li></ul><p>Шаг считается упавшим по <b>ненулевому коду возврата</b> — тому самому <code>$?</code> из bash. Вся автоматизация держится на этом соглашении.</p>",
  cheat:"$? — код возврата команды; != 0 → шаг CI считается упавшим",
  t:{q:"Какой код возврата команды означает провал шага в CI? (число)",ans:["ненулевой","не 0","1","non-zero"],hint:"не ноль",why:"Вся автоматизация CI держится на этом соглашении shell: 0 — успех, всё остальное — провал."}}],
 ch:[
 {t:"o",d:1,q:"Расставь стадии типового пайплайна в разумном порядке.",items:["lint — статический анализ","test — автотесты","build — сборка образа","scan — проверка уязвимостей","deploy на staging","deploy на production"],why:"Дешёвое и быстрое — раньше. Нет смысла собирать образ, если код не проходит линтер."},
 {t:"q",d:2,q:"В чём разница между Continuous Delivery и Continuous Deployment?",a:["Ни в чём","Delivery — артефакт готов к выкатке, деплой запускает человек; Deployment — выкатывается автоматически","Delivery только для фронтенда","Deployment дешевле"],c:1,why:"Точный ответ на этот вопрос сразу отличает подготовленного кандидата от заучившего термины."},
 {t:"c",d:3,q:"Одной командой в bash-шаге узнай код возврата предыдущей команды.",ans:["echo $?"],hint:"переменная $? хранит код возврата",why:"Именно эту переменную проверяет CI-раннер, чтобы решить, зелёный шаг или красный."},
 {t:"c",d:4,q:"Пайплайн собирает образ отдельно для staging и отдельно для prod (два разных Dockerfile-запуска). Напиши одним словом принцип, который здесь нарушен (англ., два слова через пробел).",ans:["build once","build once deploy everywhere"],hint:"build ... deploy everywhere",why:"Build once, deploy everywhere: тестировать нужно ровно тот артефакт, который поедет на прод, а не его пересборку."},
 {t:"c",d:4,q:"Команда предлагает убрать тесты из пайплайна, потому что «они долгие и мешают релизить». Напиши команду, которая покажет топ-5 самых долгих тестов в отчёте pytest (флаг durations).",ans:["pytest --durations=5"],hint:"pytest --durations=N",why:"Правильный ответ на проблему медленных тестов — найти и ускорить узкое место, а не выключить проверку целиком."},
 {t:"c",d:5,q:"Инцидент. Тест падает только в CI, локально всё зелёное. Разработчик третий раз нажимает «перезапустить», и на четвёртый прогон становится зелёным. Напиши команду pytest, которая находит нестабильные (flaky) тесты, повторяя набор несколько раз подряд.",ans:["pytest --count=5","pytest -p flaky --count=5"],hint:"pytest --count=N (плагин pytest-repeat)",why:"Привычка «перезапустить и надеяться» разрушает доверие к пайплайну. Флаки нужно ловить многократным прогоном и чинить, а не игнорировать."}]},

{id:"c2",t:"GitHub Actions",goal:"Написать рабочий workflow руками",
 cards:[
 {h:"Структура файла",b:"<pre>name: ci\non:\n  push:\n    branches: [main]\n  pull_request:\n\njobs:\n  test:\n    runs-on: ubuntu-latest\n    steps:\n      - uses: actions/checkout@v4\n      - uses: actions/setup-node@v4\n        with:\n          node-version: '20'\n          cache: 'npm'\n      - run: npm ci\n      - run: npm test</pre><p>Иерархия: <b>workflow</b> → <b>jobs</b> (по умолчанию параллельны, каждый на своей чистой машине) → <b>steps</b> (последовательны, в общей файловой системе).</p><p>Файлы лежат в <code>.github/workflows/</code>. Каждый job начинается с чистого раннера — поэтому <code>checkout</code> нужен в каждом.</p>",
  cheat:"runs-on: ubuntu-latest — раннер job'а; uses: actions/checkout@v4 — обязателен в каждом job'е",
  t:{q:"Допиши ключ job'а, задающий раннер (одно слово с дефисом):",ans:["runs-on"],hint:"runs-...",why:"runs-on выбирает машину: ubuntu-latest, self-hosted или свой лейбл."}},
 {h:"Зависимости между job'ами",b:"<pre>jobs:\n  test:\n    runs-on: ubuntu-latest\n    steps: [...]\n  build:\n    needs: test\n    runs-on: ubuntu-latest\n    steps: [...]\n  deploy:\n    needs: [test, build]\n    if: github.ref == 'refs/heads/main'\n    environment: production</pre><p><code>needs</code> строит граф выполнения. Без него job'ы стартуют одновременно, и деплой может уехать раньше тестов.</p><p><code>if</code> ограничивает условия запуска, <code>environment</code> подключает защищённое окружение с ручным подтверждением и своими секретами.</p>",
  cheat:"needs: [test, build] — job ждёт перечисленные; if: github.ref==... — условие запуска",
  t:{q:"Напиши ключ, которым job deploy указывает, что должен дождаться job'а test:",ans:["needs: test","needs:test"],hint:"needs: <имя job'а>",why:"Без needs job'ы стартуют параллельно на разных чистых машинах, и деплой может обогнать тесты."}},
 {h:"Секреты",b:"<pre>      - run: docker login -u ci -p \"$TOKEN\" registry.company.ru\n        env:\n          TOKEN: ${{ secrets.REGISTRY_TOKEN }}</pre><ul><li>секреты хранятся в настройках репозитория или организации</li><li>в логах маскируются автоматически</li><li>не доступны в workflow, запущенных из форков — защита от кражи через PR</li></ul><p><b>Лучшая практика вместо статических ключей:</b> OIDC-федерация. Пайплайн получает короткоживущий токен облака под свою идентичность — красть нечего, срок жизни минуты.</p>",
  t:{q:"Как в шаге workflow сослаться на секрет REGISTRY_TOKEN? (выражение)",ans:["${{ secrets.REGISTRY_TOKEN }}","secrets.REGISTRY_TOKEN"],hint:"${{ secrets.ИМЯ }}",why:"Только так секрет попадает в шаг — GitHub автоматически маскирует его значение в логах."}},
 {h:"Матрица и кэш",b:"<pre>strategy:\n  fail-fast: false\n  matrix:\n    node: [18, 20, 22]\n\nsteps:\n  - uses: actions/cache@v4\n    with:\n      path: ~/.npm\n      key: npm-${{ hashFiles('**/package-lock.json') }}</pre><p>Матрица превращает один job в несколько параллельных — проверка совместимости без роста времени.</p><p><b>Ключ кэша обязан зависеть от lock-файла.</b> Иначе получишь протухший кэш и невоспроизводимые сборки, которые невозможно объяснить.</p>",
  cheat:"key: npm-${{ hashFiles('**/package-lock.json') }} — ключ кэша обязан зависеть от lock-файла",
  t:{q:"Допиши функцию, которая вычисляет хеш lock-файла для ключа кэша:",ans:["hashFiles('**/package-lock.json')","hashFiles"],hint:"hashFiles(...)",why:"Изменился lock — новый кэш; не изменился — мгновенное восстановление старого."}}],
 ch:[
 {t:"f",d:1,q:"Допиши ключ, задающий, на каком раннере выполняется job.",pre:"jobs:\n  build:\n    ___: ubuntu-latest\n    steps:\n      - uses: actions/checkout@v4",ans:["runs-on"],hint:"runs-...",why:"runs-on выбирает раннер: ubuntu-latest, self-hosted или лейбл своей группы."},
 {t:"q",d:2,q:"Job deploy должен запускаться только после успешного test. Какой ключ?",a:["after","needs: test","depends","waitFor"],c:1,why:"needs строит граф. Без него job'ы стартуют параллельно, и деплой может обогнать тесты."},
 {t:"c",d:3,q:"Напиши строку YAML, дающую job'у deploy доступ к защищённому окружению production (ключ: значение).",ans:["environment: production"],hint:"environment: <имя окружения>",why:"environment подключает ручное подтверждение и отдельные секреты именно для прод-деплоя."},
 {t:"c",d:3,q:"Напиши ключ и значение кэша, чтобы он пересоздавался при каждом изменении package-lock.json.",ans:["key: npm-${{ hashFiles('**/package-lock.json') }}","key: ${{ hashFiles('**/package-lock.json') }}"],hint:"key: ...-${{ hashFiles('**/package-lock.json') }}",why:"Изменился lock — новый кэш; не изменился — мгновенное восстановление. Постоянный ключ рано или поздно даст протухшие зависимости."},
 {t:"c",d:4,q:"Как пайплайну получить доступ к облаку без вечных ключей в секретах? Напиши название технологии (англ. аббревиатура).",ans:["OIDC","oidc"],hint:"OpenID Connect федерация",why:"Статический ключ утекает один раз и живёт вечно. Короткоживущий токен, привязанный к конкретному репозиторию и ветке, обесценивает саму кражу."},
 {t:"c",d:5,q:"Инцидент. Внешний контрибьютор открыл PR, workflow упал на шаге деплоя без доступа к секретам. Коллега предлагает выдать секреты и для форков. Опиши правильное решение: какое условие (ключ: значение) нужно добавить в job деплоя, чтобы он не запускался на pull_request из форков?",ans:["if: github.event.pull_request.head.repo.full_name == github.repository"],hint:"if: github.event.pull_request.head.repo.full_name == github.repository",why:"Ограничение секретов для форков — намеренная защита. Деплой должен быть отдельным workflow, запускаемым по push в main или по тегу, а не по PR."}]},

{id:"c3",t:"GitLab CI",goal:"Читать и писать пайплайны второго распространённого формата",
 cards:[
 {h:"gitlab-ci.yml",b:"<pre>stages: [test, build, deploy]\n\nvariables:\n  IMAGE: $CI_REGISTRY_IMAGE:$CI_COMMIT_SHA\n\ntest:\n  stage: test\n  image: node:20-alpine\n  script:\n    - npm ci\n    - npm test\n  cache:\n    key:\n      files: [package-lock.json]\n    paths: [node_modules/]\n\ndeploy:prod:\n  stage: deploy\n  script: ./deploy.sh\n  when: manual\n  only: [tags]</pre><p>Отличие от Actions: стадии объявляются явно в <code>stages</code>, а каждый job указывает свою через <code>stage</code>.</p>",
  cheat:"stages: [test,build,deploy] — общий список; stage: test — стадия конкретного job'а",
  t:{q:"Каким ключом job указывает, к какой стадии он относится?",ans:["stage"],hint:"stage: <имя>",why:"stage привязывает job к общему списку stages — порядок выполнения задаётся именно списком stages."}},
 {h:"rules — управление запуском",b:"<pre>deploy:prod:\n  rules:\n    - if: '$CI_COMMIT_TAG =~ /^v/'\n      when: manual\n    - if: '$CI_COMMIT_BRANCH == \"main\"'\n      when: on_success\n    - when: never</pre><p><code>rules</code> проверяются сверху вниз, срабатывает первое совпадение. Финальное <code>when: never</code> — явный запрет во всех остальных случаях: без него легко получить деплой из случайной ветки.</p><p><code>rules: changes:</code> запускает job только если менялись определённые файлы — экономит время в монорепозитории.</p>",
  cheat:"rules: проверяются сверху вниз; всегда заканчивай списком '- when: never'",
  t:{q:"Какую строку правила стоит писать последней в списке rules, чтобы запретить запуск во всех остальных случаях?",ans:["- when: never","when: never"],hint:"- when: ...",why:"Без финального never job может сработать там, где не ждали — например, при пуше в произвольную ветку."}},
 {h:"needs против dependencies",b:"<div class='tw'><table><tr><th>ключ</th><th>про что</th></tr><tr><td><code>needs</code></td><td>порядок выполнения: job стартует, не дожидаясь всей предыдущей стадии (DAG)</td></tr><tr><td><code>dependencies</code></td><td>какие артефакты скачать из предыдущих job'ов</td></tr></table></div><p>Их постоянно путают. <code>needs</code> ускоряет пайплайн, превращая лестницу в граф; <code>dependencies</code> экономит трафик, не скачивая лишние артефакты.</p>"},
 {h:"Раннеры и исполнители",b:"<ul><li><b>shared</b> — общие раннеры провайдера, быстрый старт</li><li><b>self-hosted</b> — свои: нужны для доступа во внутреннюю сеть, особого железа и контроля над данными</li></ul><p>Исполнители: <b>shell</b> (просто, но состояние накапливается между запусками — источник загадочных багов), <b>docker</b> (чистое окружение каждый раз, рекомендуется), <b>kubernetes</b> (масштабируется сам).</p><p>Свой раннер — это сервер, который ты патчишь, изолируешь и мониторишь. Особенно осторожно с privileged-режимом.</p>"},
 {h:"Шаблоны и переиспользование",b:"<pre>include:\n  - project: 'devops/ci-templates'\n    file: '/docker.yml'\n\n.build-base:\n  stage: build\n  image: docker:24\n\nbuild:app:\n  extends: .build-base\n  variables: { IMAGE_NAME: app }</pre><p>Job'ы, начинающиеся с точки, — скрытые: сами не выполняются, служат основой для <code>extends</code>.</p><p>Централизованные шаблоны — способ привести к одному стандарту десятки репозиториев одной правкой.</p>",
  t:{q:"Каким ключом job наследует настройки скрытого job'а .build-base?",ans:["extends"],hint:"extends: .build-base",why:"extends — механизм наследования GitLab CI, аналог ООП-наследования для job'ов."}}],
 ch:[
 {t:"q",d:1,q:"Что делает <code>when: manual</code> у job'а?",a:["Запускает автоматически","Job ждёт нажатия кнопки человеком","Отключает job","Запускает по расписанию"],c:1,why:"Ручной гейт — это и есть отличие Continuous Delivery от Deployment. Плюс защищённые окружения ограничивают, кто вправе нажать."},
 {t:"q",d:2,q:"Чем <code>needs</code> отличается от <code>dependencies</code>?",a:["Ничем","needs задаёт порядок выполнения и позволяет стартовать раньше; dependencies указывает, какие артефакты скачать","needs только для деплоя","dependencies работает быстрее"],c:1,why:"Частый вопрос на собеседовании по GitLab CI: путаница выдаёт поверхностное знакомство."},
 {t:"c",d:3,q:"Напиши правило rules, которое запускает job только на теге, начинающемся с 'v' (ключ if:, регулярка).",ans:["if: '$CI_COMMIT_TAG =~ /^v/'","if: $CI_COMMIT_TAG =~ /^v/"],hint:"if: '$CI_COMMIT_TAG =~ /^v/'",why:"Безопасность по умолчанию: белый список правил и явный запрет всего остального. Особенно важно для job'ов деплоя."},
 {t:"c",d:3,q:"Job'ы shell-исполнителя раннера копят состояние между прогонами. Напиши название исполнителя, дающего чистое окружение на каждый прогон.",ans:["docker"],hint:"один из executor'ов GitLab Runner",why:"Docker-исполнитель даёт чистое окружение на каждый прогон — воспроизводимость перевешивает небольшой оверхед."},
 {t:"c",d:4,q:"Один и тот же блок сборки скопирован в 12 репозиториев. Напиши ключ, которым подключают внешний файл шаблонов в начале .gitlab-ci.yml.",ans:["include"],hint:"include: - project: ... file: ...",why:"Одна правка обновляет все проекты. Плюс единый стандарт качества: сканирование, кэш и теги настроены одинаково везде."},
 {t:"c",d:5,q:"Инцидент. Job деплоя на прод неожиданно запустился из ветки разработчика вместо main. В конфиге были rules с одним условием ($CI_COMMIT_BRANCH == \"main\", when: on_success) без финальной строки-запрета. Допиши недостающую строку правил.",ans:["- when: never"],hint:"- when: never",why:"Правила без финального запрета оставляют поведение по умолчанию — job срабатывает и там, где условие не было явно расписано. Три независимых барьера (rules, защищённое окружение с апрувом, деплой по тегу) надёжнее одной договорённости."}]},

{id:"c4",t:"Артефакты, кэш и скорость",goal:"Сделать пайплайн быстрым и воспроизводимым",
 cards:[
 {h:"Артефакт — не кэш",b:"<div class='tw'><table><tr><th></th><th>артефакт</th><th>кэш</th></tr><tr><td>смысл</td><td>результат работы</td><td>ускоритель</td></tr><tr><td>потеря</td><td>критична</td><td>безболезненна</td></tr><tr><td>примеры</td><td>собранный бинарь, отчёт о тестах, coverage</td><td>node_modules, ~/.m2, слои сборки</td></tr></table></div><p>Путать их опасно: артефакт, положенный в кэш, однажды исчезнет ровно в тот момент, когда понадобится для расследования.</p>"},
 {h:"Отчёты в интерфейсе",b:"<pre>artifacts:\n  when: always\n  reports:\n    junit: report.xml\n    coverage_report:\n      coverage_format: cobertura\n      path: coverage.xml</pre><p><code>when: always</code> важен: отчёт нужен именно тогда, когда job упал.</p><p>Упавшие тесты и изменение покрытия показываются прямо в merge request — ревьюер видит результат, не открывая логи. Туда же встают отчёты сканеров безопасности.</p>",
  t:{q:"Каким значением ключа when нужно сохранить отчёт даже при падении job'а?",ans:["always","when: always"],hint:"artifacts: when: ...",why:"Без when: always отчёт не сохранится именно в тот момент, когда он нужнее всего — при падении."}},
 {h:"Чем ускоряют пайплайн",b:"<p>По убыванию эффекта:</p><ol><li><b>Кэш зависимостей</b> — обычно самая долгая стадия</li><li><b>Параллельные job'ы и матрицы</b> вместо последовательной лестницы</li><li><b>Разделение тестов</b> на быстрые (на каждый push) и медленные (перед мержем или ночью)</li><li><b>Сборка только изменённых сервисов</b> в монорепозитории (<code>rules: changes</code>)</li><li><b>Кэш слоёв образа</b> через <code>--cache-from</code></li></ol><p>Начинать надо с измерения: смотри длительность каждой стадии, а не улучшай наугад.</p>"},
 {h:"Сборка образов внутри CI",b:"<div class='tw'><table><tr><th>способ</th><th>цена</th></tr><tr><td>проброс <code>/var/run/docker.sock</code></td><td>просто, но даёт раннеру фактический root на хосте — недопустимо на общих раннерах</td></tr><tr><td>DinD (docker:dind)</td><td>изолированнее, но требует privileged и теряет кэш</td></tr><tr><td>kaniko / buildah</td><td>без демона и привилегий — рекомендуемый вариант в Kubernetes</td></tr></table></div><pre>build:\n  image: gcr.io/kaniko-project/executor:debug\n  script:\n    - /kaniko/executor --context $CI_PROJECT_DIR\n        --destination $CI_REGISTRY_IMAGE:$CI_COMMIT_SHA</pre>",
  cheat:"kaniko/buildah — сборка образа без docker.sock и без privileged",
  t:{q:"Напиши название инструмента, который собирает Docker-образ внутри Kubernetes-раннера без демона и без привилегированного режима.",ans:["kaniko","buildah"],hint:"k... или b...",why:"docker.sock даёт фактический root на хосте раннера — недопустимо на общих раннерах. kaniko/buildah решают эту проблему."}}],
 ch:[
 {t:"q",d:1,q:"Отчёт о тестах нужно скачать после падения пайплайна. Куда его класть?",a:["В кэш","В артефакты с when: always","В логи","В git"],c:1,why:"Кэш эфемерен и общий; артефакты привязаны к конкретному прогону. Без when: always отчёт не сохранится именно при падении."},
 {t:"q",d:2,q:"Пайплайн занимает 25 минут. С чего начать оптимизацию?",a:["Купить более мощный раннер","Измерить длительность стадий, затем кэшировать зависимости и распараллелить независимые job'ы","Убрать линтер","Деплоить реже"],c:1,why:"Оптимизация без измерения — угадывание. Обычно львиную долю съедает установка зависимостей и последовательные тесты."},
 {t:"c",d:3,q:"Напиши название инструмента (или флаг docker build), который собирает образ без демона и без привилегированного режима на shared-раннере.",ans:["kaniko","buildah"],hint:"k... или b...",why:"Поэтому в Kubernetes-раннерах собирают через kaniko или buildah — без демона и без привилегированного режима."},
 {t:"c",d:3,q:"Напиши ключ artifacts, который публикует junit-отчёт report.xml прямо в интерфейс merge request (без значения when).",ans:["reports:\n  junit: report.xml","reports: junit: report.xml"],hint:"artifacts: reports: junit: <файл>",why:"Обратная связь там, где она нужна: упавшие тесты видны прямо в MR, без открытия логов."},
 {t:"c",d:4,q:"В монорепозитории из 20 сервисов пайплайн собирает все при любом изменении. Напиши ключ GitLab CI (внутри rules), который запускает job только если менялись файлы конкретного сервиса.",ans:["changes","rules: changes"],hint:"rules: - changes: [...]",why:"Разделение репозиториев — большое организационное решение с своей ценой. Условные запуски по changes дают основной выигрыш почти бесплатно."},
 {t:"c",d:5,q:"Инцидент. Сборка стала «случайно» падать на разных проектах: то не находится модуль, то версия библиотеки не та. Кэш настроен с постоянным ключом cache-node. Напиши правильный ключ кэша, который решает проблему (используй хеш lock-файла).",ans:["key: npm-${{ hashFiles('**/package-lock.json') }}","cache: key: files: [package-lock.json]"],hint:"ключ должен зависеть от хеша package-lock.json",why:"Ключ обязан зависеть от хеша lock-файла. Симптом «непонятные плавающие ошибки сборки» почти всегда указывает на кэш или на нечистое окружение раннера."}]},

{id:"c5",t:"Стратегии деплоя и откат",goal:"Выкатываться без даунтайма и уметь отступить",
 cards:[
 {h:"Четыре стратегии",b:"<div class='tw'><table><tr><th>стратегия</th><th>как работает</th><th>цена</th></tr><tr><td><b>Recreate</b></td><td>погасить старое, поднять новое</td><td>простой даунтайм</td></tr><tr><td><b>Rolling</b></td><td>заменять по одному экземпляру</td><td>одновременно живут две версии</td></tr><tr><td><b>Blue-Green</b></td><td>две среды, мгновенное переключение трафика</td><td>двойные ресурсы</td></tr><tr><td><b>Canary</b></td><td>5% трафика на новую версию, наблюдаем метрики</td><td>сложность маршрутизации</td></tr></table></div><p>Rolling — умолчание в Kubernetes. Canary — выбор для рискованных изменений: реальный трафик проверяет то, что не проверят тесты.</p>",
  cheat:"Recreate=даунтайм, Rolling=default k8s, Blue-Green=мгновенное переключение, Canary=% трафика"},
 {h:"Две версии одновременно",b:"<p>При rolling и canary старая и новая версии работают <b>параллельно</b>. Значит, изменения должны быть обратно совместимы:</p><ul><li>API не удаляет и не переименовывает поля в том же релизе</li><li>очереди понимают оба формата сообщений</li><li>схема БД совместима с обеими версиями кода</li></ul><p>Игнорирование этого правила даёт ошибки ровно у части пользователей — тех, кто попал на другую версию.</p>"},
 {h:"Миграции БД: expand → migrate → contract",b:"<ol><li><b>Expand.</b> Добавили новую колонку, код пишет в обе.</li><li><b>Migrate.</b> Перенесли данные, код читает из новой.</li><li><b>Contract.</b> Через релиз-другой удалили старую колонку.</li></ol><p><b>Никогда не удаляй колонку в том же релизе, что и код.</b> Иначе откат кода станет невозможен: данных уже нет.</p><p>Правило простое: код должен работать и со старой, и с новой схемой в момент выкатки.</p>",
  cheat:"expand → migrate → contract — три отдельных релиза для изменения схемы БД",
  t:{q:"Назови три шага безопасной миграции схемы БД (через пробел, англ.):",ans:["expand migrate contract"],hint:"expand ... migrate ... contract",why:"Три отдельных релиза дают возможность откатить код на любом шаге, не теряя данные."}},
 {h:"Откат — часть плана",b:"<p>Если ты не знаешь, как откатить релиз, ты не готов его катить.</p><ul><li>образы помечены неизменяемым тегом (хеш коммита), не <code>latest</code></li><li>откат — одна команда или одна кнопка, отрепетированная заранее</li><li>миграции обратимы или обратно совместимы</li><li><b>feature flag</b> выключает функцию без выкатки вообще</li></ul><p>Feature flags разделяют <b>деплой</b> и <b>релиз</b>: код уезжает выключенным, включается отдельно и мгновенно гасится при проблемах.</p>"}],
 ch:[
 {t:"q",d:1,q:"Нужно проверить рискованное изменение на реальном трафике, но только на 5% пользователей. Какая стратегия?",a:["Recreate","Rolling","Canary","Blue-Green"],c:2,why:"Canary плюс наблюдение за метриками ошибок и латентности, плюс автоматический откат при деградации."},
 {t:"q",d:2,q:"Почему тег <code>latest</code> на проде — плохая идея?",a:["Длинное имя","Непонятно, какая версия реально работает, и невозможно воспроизвести откат","Занимает место","Медленно скачивается"],c:1,why:"Неизменяемые теги дают однозначную связь «контейнер ↔ код». Без неё расследование инцидента превращается в гадание."},
 {t:"c",d:3,q:"Напиши тег образа, который должен ехать на прод вместо latest (используя git).",ans:["git rev-parse --short HEAD","$(git rev-parse --short HEAD)"],hint:"хеш коммита через git rev-parse",why:"Неизменяемые теги (хеш коммита) дают однозначную связь «контейнер ↔ код» — обязательное условие для воспроизводимого отката."},
 {t:"c",d:4,q:"Релиз добавляет колонку в БД (expand) и код, который начинает её использовать. Напиши, каким шагом (одно слово из expand/migrate/contract) можно безопасно удалить старую колонку.",ans:["contract"],hint:"третий шаг из expand → migrate → contract",why:"Правило: код должен работать со старой и новой схемой одновременно. Удаление — отдельный релиз, когда откат к старому коду уже не нужен."},
 {t:"c",d:4,q:"Напиши термин: переключатель функции в рантайме, разделяющий деплой и релиз, позволяющий мгновенно выключить функцию без нового деплоя (англ., два слова).",ans:["feature flag","feature flags"],hint:"feature ...",why:"Код едет выключенным, включается на части пользователей и гасится мгновенно без пайплайна — снижает риск любого релиза."},
 {t:"c",d:5,q:"Инцидент. Через три минуты после выкатки доля 5xx выросла до 12%. В релизе были и код, и expand-миграция (добавляющая колонку). Опиши первое действие одной командой/фразой: что откатывать в первую очередь — код или миграцию?",ans:["откатить код","rollback код","откат кода на предыдущий образ"],hint:"expand-миграция обратно совместима, мешать откату кода не будет",why:"Сначала стабилизация: откатить код на предыдущий образ. Добавляющая миграция безопасна для отката — именно ради этого её и делают отдельно от удаляющей."}]},

{id:"c6",t:"Безопасность и качество пайплайна",goal:"Не превратить конвейер в дыру",
 cards:[
 {h:"Что проверяет зрелый пайплайн",b:"<div class='tw'><table><tr><th>проверка</th><th>инструмент</th><th>что ловит</th></tr><tr><td>секреты в коде</td><td>gitleaks, trufflehog</td><td>токены и пароли в коммитах</td></tr><tr><td>зависимости</td><td>dependabot, npm audit</td><td>известные уязвимости библиотек</td></tr><tr><td>образ</td><td>trivy, grype</td><td>CVE в системных пакетах базы</td></tr><tr><td>код</td><td>SAST-анализаторы</td><td>типовые уязвимые паттерны</td></tr><tr><td>инфраструктура</td><td>tfsec, checkov</td><td>публичные бакеты, открытые порты в IaC</td></tr></table></div><p><b>Shift left:</b> чем раньше найдена проблема, тем дешевле её исправить. Найденная на проде стоит в сотни раз дороже найденной в PR.</p>",
  cheat:"gitleaks/trufflehog=секреты, trivy/grype=образ, tfsec/checkov=IaC",
  t:{q:"Напиши команду сканирования образа myapp:latest на уязвимости утилитой trivy.",ans:["trivy image myapp:latest"],hint:"trivy image <образ>",why:"trivy ловит CVE в системных пакетах базового слоя образа — то, что не увидит ни один линтер кода."}},
 {h:"Секреты в пайплайне",b:"<ul><li>только из хранилища секретов, никогда из кода</li><li>маскирование в логах — обязательно, но не гарантия: <code>echo $TOKEN | base64</code> обойдёт его</li><li>минимальные права: токен только на нужный реестр и только на push</li><li>ротация и короткий срок жизни; в идеале — OIDC вместо статических ключей</li></ul><p><b>Если секрет засветился в логе — он скомпрометирован.</b> Порядок: сначала ротация, потом чистка логов. Логи хранятся в кэшах, форках и глазах людей.</p>"},
 {h:"Гейты перед продом",b:"<ul><li>обязательный зелёный CI и ревью перед merge (branch protection)</li><li>ручное подтверждение прод-деплоя через защищённое окружение — с аудитом, кто и когда одобрил</li><li>smoke-тесты <b>после</b> выкатки: деплой заканчивается не словом «выкачено», а подтверждением здоровья</li><li>автоматический откат при деградации метрик</li></ul>"},
 {h:"Итоговый конвейер проекта",b:"<pre>PR:      lint → unit → build → scan → ephemeral-окружение → e2e\nmain:    build app:$SHA → push → deploy staging → smoke\ntag v*:  ручной аппрув → canary 10% → метрики → 100%\n                     → при деградации автооткат</pre><p>Обрати внимание: образ собирается один раз на этапе main и дальше только продвигается. Ephemeral-окружение для PR — временный стенд, который удаляется после слияния (иначе счёт за облако растёт незаметно).</p>"}],
 ch:[
 {t:"q",d:1,q:"Что означает принцип shift left в безопасности?",a:["Сдвигать релизы влево по календарю","Находить проблемы как можно раньше — в PR и в CI, а не на проде","Писать код левой рукой","Смещать нагрузку на левую половину кластера"],c:1,why:"Стоимость исправления растёт на порядки с каждым этапом. Автоматические проверки в PR — самая дешёвая точка."},
 {t:"q",d:2,q:"Зачем нужны gitleaks и trivy, если есть код-ревью?",a:["Для отчётности перед аудитом","Человек пропускает и не помнит все CVE; автоматика проверяет каждый коммит одинаково и без усталости","Требование закона","Ускоряют сборку"],c:1,why:"Ревью и автоматика решают разные задачи: человек оценивает замысел, инструмент — известные шаблоны и базы уязвимостей."},
 {t:"c",d:3,q:"Секрет случайно распечатался в логах пайплайна. Напиши первое действие (глагол + что делаем с секретом).",ans:["ротировать секрет","ротация секрета","сменить секрет"],hint:"единственное реальное действие при компрометации",why:"Логи копируются в кэши, уведомления и чужие глаза. Компрометация уже произошла — единственное реальное действие — сменить секрет, потом чистить логи."},
 {t:"c",d:3,q:"Пайплайн зелёный, деплой прошёл, но сервис не работает. Напиши название проверки, которой не хватает после деплоя (англ., одно слово).",ans:["smoke","smoke-test","smoke test"],hint:"проверка здоровья сразу после выкатки",why:"Деплой заканчивается подтверждением здоровья системы, а не фактом отправки манифеста. Иначе о проблеме сообщают пользователи."},
 {t:"c",d:4,q:"Напиши команду gitleaks для сканирования истории git-репозитория в текущей директории на утечки секретов.",ans:["gitleaks detect","gitleaks detect --source ."],hint:"gitleaks detect ...",why:"Принцип наименьших привилегий и регулярное сканирование истории репозитория ограничивают ущерб от случайно закоммиченного секрета."},
 {t:"c",d:5,q:"Инцидент. Злоумышленник открыл PR, который добавил в workflow шаг с отправкой переменных окружения на внешний адрес. Секреты не утекли, потому что GitHub Actions не даёт секретов workflow из форков. Напиши название файла в репозитории, которым назначают обязательных ревьюеров для каталога .github/workflows (без пути).",ans:["CODEOWNERS"],hint:"специальный файл GitHub для обязательного ревью",why:"Изменения в самом пайплайне — привилегированный код. CODEOWNERS на каталог workflows гарантирует, что такие PR не сольются без ревью нужных людей."}]}
);

{id:"i1",t:"Идея IaC",goal:"Понять декларативность и идемпотентность",
 cards:[
 {h:"Два слова, которые надо выучить",b:"<p><b>Декларативно</b> — ты описываешь <i>желаемое состояние</i>: «нужно три сервера такого типа». Инструмент сам сравнивает с реальностью и вычисляет разницу.</p><p><b>Императивно</b> — ты описываешь <i>шаги</i>: «создай сервер, потом ещё один». При повторном запуске получишь шесть серверов.</p><p><b>Идемпотентность</b> — применил один раз или десять, результат одинаковый. Именно поэтому декларативный подход безопасен: повторный запуск ничего не ломает.</p>",
  t:{q:"Одним словом: свойство, при котором повторный запуск даёт тот же результат, что и первый.",ans:["идемпотентность","идемпотентный"],hint:"идемпо...",why:"Идемпотентность — причина, почему декларативный инструмент безопасно перезапускать хоть сто раз."}},
 {h:"Почему это лучше кликов в консоли",b:"<div class='tw'><table><tr><th>клики в панели</th><th>инфраструктура как код</th></tr><tr><td>«а кто это поменял?»</td><td>история в git с автором и датой</td></tr><tr><td>изменения не ревьюят</td><td>PR с обсуждением до применения</td></tr><tr><td>среды расходятся</td><td>один код, разные параметры</td></tr><tr><td>восстановление — по памяти</td><td>пересоздание с нуля одной командой</td></tr></table></div><p>Инфраструктура становится обычным кодом: ревью, откат, аудит, тесты. Это главный аргумент, который ждут на собеседовании.</p>"},
 {h:"Terraform и Ansible решают разные задачи",b:"<div class='tw'><table><tr><th></th><th>Terraform</th><th>Ansible</th></tr><tr><td>задача</td><td>создавать ресурсы (provisioning)</td><td>настраивать внутри (configuration)</td></tr><tr><td>стиль</td><td>декларативный, есть state</td><td>процедурный, состояние не хранит</td></tr><tr><td>типично</td><td>ВМ, сети, кластеры, БД, DNS</td><td>пакеты, конфиги, деплой приложений</td></tr><tr><td>агент</td><td>не нужен</td><td>не нужен, работает по SSH</td></tr></table></div><p>Классическая связка: Terraform поднял серверы → Ansible их настроил. В контейнерном мире вторая часть часто заменяется образом.</p>",
  cheat:"Terraform=provisioning (создать), Ansible=configuration (настроить)"},
 {h:"Дрейф конфигурации",b:"<p><b>Drift</b> — расхождение между кодом и реальностью: кто-то поменял настройку руками, и теперь состояние отличается от описанного.</p><p>Terraform обнаруживает дрейф при <code>plan</code>: он опрашивает провайдера и сравнивает. Ansible «чинит» дрейф самим фактом повторного прогона.</p><p>Практическое правило: если инфраструктура под IaC, ручные правки в консоли запрещены. Иначе следующий apply молча вернёт всё назад — иногда посреди рабочего дня.</p>",
  cheat:"drift — расхождение кода и реальности; terraform plan его обнаруживает"}],
 ch:[
 {t:"q",d:1,q:"Что означает «идемпотентный playbook»?",a:["Он быстро выполняется","Повторный запуск не меняет систему, если она уже в нужном состоянии","Работает без сети","Не требует sudo"],c:1,why:"Поэтому в Ansible пишут state: present, а не «выполни apt install»: инструмент сам решает, нужно ли действие."},
 {t:"q",d:2,q:"Нужно создать 10 виртуальных машин в облаке. Какой инструмент?",a:["Ansible","Terraform","Bash-скрипт с curl к API","Руками в панели"],c:1,why:"Terraform управляет жизненным циклом ресурсов: создание, изменение, удаление и зависимости между ними. Ansible настроит их уже изнутри."},
 {t:"c",d:3,q:"Напиши одну команду, которой Terraform обнаруживает дрейф конфигурации (сравнивает код с реальностью, ничего не меняя).",ans:["terraform plan"],hint:"та же команда, что показывает предстоящие изменения",why:"plan опрашивает провайдера и сравнивает с состоянием — расхождение и есть дрейф."},
 {t:"c",d:3,q:"Двумя словами (рус.) назови главную причину предпочесть IaC кликам в веб-консоли (история изменений + возможность ревью).",ans:["воспроизводимость и ревью","история и ревью","git и ревью"],hint:"то, что даёт git-история изменений",why:"Воспроизводимость, ревью изменений в PR и история в git — то, чего никогда не будет у ручных кликов."},
 {t:"c",d:4,q:"Коллега поправил security group руками в панели «на пять минут, потом верну». Напиши, какая команда terraform на следующем прогоне молча откатит его правку (без флагов).",ans:["terraform apply"],hint:"та же команда, что применяет план",why:"Следующий apply вернёт всё к описанному в коде состоянию — возможно, в разгар рабочего дня. Правки должны идти только через код."},
 {t:"c",d:5,q:"Инцидент. Тебе передали проект: инфраструктура создана руками, документации нет, автор уволился. Напиши команду, которой существующий ресурс (тип aws_instance, адрес aws_instance.app, id i-0a1b2c3d) привязывается к state без пересоздания.",ans:["terraform import aws_instance.app i-0a1b2c3d"],hint:"terraform import <адрес> <id>",why:"Импорт даёт контроль без даунтайма. Критерий успеха — plan без изменений: значит код точно описывает реальность."}]},

{id:"i2",t:"Terraform: цикл работы и state",goal:"Не удалить прод при первом же apply",
 cards:[
 {h:"Рабочий цикл",b:"<pre>terraform init      <span class='c'># скачать провайдеры, настроить backend</span>\nterraform fmt -recursive\nterraform validate  <span class='c'># синтаксис и обязательные аргументы</span>\nterraform plan -out=tf.plan\nterraform apply tf.plan\nterraform destroy</pre><p><code>plan</code> перед <code>apply</code> — не рекомендация, а правило. Применяют <b>сохранённый план</b>, а не «plan посмотрели, apply запустили»: между ними состояние могло измениться.</p><p>Читать план надо по строкам, обращая внимание на итог: сколько <b>create</b>, <b>change</b> и особенно <b>destroy</b>.</p>",
  cheat:"init → fmt → validate → plan -out=tf.plan → apply tf.plan → destroy",
  t:{q:"Напиши команду, которая скачивает провайдеры и настраивает backend перед первой работой с проектом.",ans:["terraform init"],hint:"первая команда цикла",why:"Без init Terraform не знает, какие провайдеры использовать и куда писать state."}},
 {h:"State — сердце Terraform",b:"<p><code>terraform.tfstate</code> — карта соответствия «ресурс в коде ↔ реальный объект у провайдера». Без него Terraform не знает, что уже создано, и попытается создать всё заново.</p><ul><li>хранить <b>удалённо</b> (S3, GCS, Terraform Cloud), не в git</li><li>обязательно <b>блокировка</b>: иначе два одновременных apply разнесут инфраструктуру</li><li>включить <b>версионирование</b> бакета: испорченный state можно откатить</li><li>шифрование: state хранит значения атрибутов открытым текстом, включая пароли</li></ul>"},
 {h:"Символы плана",b:"<div class='tw'><table><tr><th>символ</th><th>значение</th></tr><tr><td><code>+</code></td><td>создать</td></tr><tr><td><code>~</code></td><td>изменить на месте — безопасно</td></tr><tr><td><code>-</code></td><td>уничтожить</td></tr><tr><td><code>-/+</code></td><td><b>пересоздать</b>: уничтожить и создать заново</td></tr></table></div><p>Строка <code># forces replacement</code> рядом с полем говорит, какой именно атрибут вызывает пересоздание. Такие поля называют <b>ForceNew</b>: зона доступности, подсеть, иногда имя или образ.</p><p>Увидел <code>-/+</code> на боевом ресурсе — остановись и разберись. Это не «мелкое изменение тега».</p>",
  cheat:"+ создать, ~ изменить на месте, - уничтожить, -/+ пересоздать (опасно на проде)"},
 {h:"Импорт и удаление из state",b:"<pre>terraform import aws_instance.app i-0a1b2c3d\n\n# современный способ — блок в коде:\nimport {\n  to = aws_instance.app\n  id = \"i-0a1b2c3d\"\n}\n\nterraform state rm aws_instance.app   <span class='c'># забыть о ресурсе, не удаляя его</span></pre><p><code>import</code> связывает существующий объект с адресом в коде. Без него apply попытается создать дубликат.</p><p><code>state rm</code> — обратная операция: Terraform перестаёт управлять ресурсом, сам объект остаётся жить. Используется при разделении проектов.</p>",
  t:{q:"Напиши команду, которая заставляет Terraform забыть о ресурсе aws_instance.app, не удаляя сам объект.",ans:["terraform state rm aws_instance.app"],hint:"terraform state rm <адрес>",why:"Обратная операция импорту — используется при разделении проектов между командами."}},
 {h:"Версии — часть воспроизводимости",b:"<pre>terraform {\n  required_version = \"~&gt; 1.7\"\n  required_providers {\n    aws = { source = \"hashicorp/aws\", version = \"~&gt; 5.40\" }\n  }\n}</pre><p>Файл <code>.terraform.lock.hcl</code> фиксирует точные версии провайдеров и коммитится в git. Без него завтрашний apply может повести себя иначе из-за вышедшего обновления — и сломать прод без единого изменения в коде.</p>"}],
 ch:[
 {t:"c",d:1,q:"Посмотри, что именно Terraform собирается изменить, ничего не применяя.",ans:["terraform plan","terraform plan -out=tf.plan","tf plan"],hint:"одно слово после terraform",why:"В CI план публикуют в PR, чтобы ревьюер увидел diff инфраструктуры до применения."},
 {t:"q",d:2,q:"Зачем state хранят в S3 с блокировкой, а не локально?",a:["Так быстрее","Общее состояние для команды и защита от одновременного apply","Дешевле","Требование провайдера"],c:1,why:"Локальный state = рассинхрон и потерянная инфраструктура при смене ноутбука. Блокировка спасает от гонки двух инженеров."},
 {t:"c",d:3,q:"В плане на боевом ресурсе видно -/+ и пометку # forces replacement, хотя менялся только тег. Напиши, какая строка плана (одно слово-символ) должна остановить тебя перед apply.",ans:["-/+"],hint:"символ пересоздания",why:"Пересоздание боевой машины или базы — это потеря данных и даунтайм. Чтение плана построчно — базовый навык, спасающий продакшены."},
 {t:"c",d:3,q:"Ресурс создали руками в консоли (id i-0a1b2c3d, тип aws_instance, адрес aws_instance.app), теперь им нужно управлять из Terraform. Напиши нужную команду.",ans:["terraform import aws_instance.app i-0a1b2c3d"],hint:"terraform import <адрес> <id>",why:"Без импорта apply создаст дубликат. После импорта критерий успеха — plan, показывающий отсутствие изменений."},
 {t:"c",d:4,q:"Напиши название файла (с расширением), который фиксирует точные версии провайдеров и должен коммититься в git.",ans:[".terraform.lock.hcl"],hint:".terraform.lock....",why:"Без него завтрашний apply может повести себя иначе из-за обновления провайдера — источник самых загадочных инцидентов."},
 {t:"c",d:5,q:"Инцидент. Два инженера одновременно запустили apply на одном проекте. State испорчен: часть ресурсов задублирована, часть числится удалённой, но существует. Напиши, какой механизм backend'а (одно слово) предотвратил бы саму возможность одновременного apply.",ans:["блокировка","lock","locking"],hint:"механизм, который не даёт двум apply идти одновременно",why:"Блокировка state (DynamoDB или встроенная в backend) делает гонку двух apply технически невозможной — вместе с версионированием бакета и apply только из CI."}]},

{id:"i3",t:"Terraform: переменные, модули, окружения",goal:"Не копировать конфиги между prod и staging",
 cards:[
 {h:"Переменные, выводы, локальные значения",b:"<pre>variable \"env\" {\n  type        = string\n  description = \"окружение\"\n  validation {\n    condition     = contains([\"stage\",\"prod\"], var.env)\n    error_message = \"допустимо только stage или prod\"\n  }\n}\n\nlocals {\n  name_prefix = \"shop-${var.env}\"\n}\n\noutput \"app_ip\" {\n  value = aws_instance.app[0].public_ip\n}</pre><p><code>variable</code> — вход, <code>output</code> — выход (в том числе для других модулей), <code>locals</code> — вычисляемые значения внутри. Валидация переменных ловит опечатки до создания ресурсов.</p>",
  cheat:"variable=вход, output=выход, locals=вычисляемое значение внутри",
  t:{q:"Каким блоком объявляют выходное значение модуля, доступное другим модулям?",ans:["output"],hint:"противоположность variable",why:"output — выход модуля наружу, variable — вход. Их постоянно путают на собеседованиях."}},
 {h:"Модуль — функция для инфраструктуры",b:"<pre>module \"app\" {\n  source = \"./modules/service\"\n\n  env           = \"prod\"\n  instance_type = \"t3.large\"\n  replicas      = 3\n}\n\n# использование вывода модуля\noutput \"ip\" { value = module.app.public_ip }</pre><p>Внутри модуля — ресурсы и переменные, снаружи — только параметры. Terraform строит граф зависимостей автоматически по ссылкам между ресурсами: если один ссылается на другой, порядок создания определится сам.</p><p>Модуль оправдан, когда набор используется дважды и более. Преждевременная модуляризация усложняет чтение.</p>"},
 {h:"Разделение окружений",b:"<pre>infra/\n  modules/\n    service/\n  envs/\n    stage/  main.tf  → module \"app\" { replicas = 1 }\n    prod/   main.tf  → module \"app\" { replicas = 3 }</pre><p>У каждого окружения <b>свой state</b>. Ошибка в stage физически не может задеть prod, и права доступа к state тоже разные.</p><p>Альтернатива — <code>workspace</code>, но отдельные каталоги нагляднее: видно, что где развёрнуто, и разные окружения могут отличаться не только числами.</p>"},
 {h:"count и for_each",b:"<pre>resource \"aws_instance\" \"app\" {\n  count         = var.env == \"prod\" ? 3 : 1\n  instance_type = var.instance_type\n}\n\nresource \"aws_s3_bucket\" \"b\" {\n  for_each = toset([\"logs\", \"backups\"])\n  bucket   = \"shop-${each.key}\"\n}</pre><p><b>Важное различие:</b> <code>count</code> адресует ресурсы по индексу (<code>app[0]</code>, <code>app[1]</code>). Удалил элемент из середины — все последующие сдвинутся и <b>будут пересозданы</b>.</p><p><code>for_each</code> адресует по ключу (<code>b[\"logs\"]</code>): удаление одного элемента не задевает остальные. Для наборов именованных ресурсов почти всегда нужен for_each.</p>",
  cheat:"count — по индексу (сдвиг при удалении), for_each — по ключу (безопасно)",
  t:{q:"Каким ключевым словом задают набор ресурсов, адресуемых по ключу, а не по индексу?",ans:["for_each"],hint:"альтернатива count",why:"Удаление одного элемента набора for_each не задевает остальные — в отличие от count, где сдвигаются индексы."}}],
 ch:[
 {t:"q",d:1,q:"Главная причина разделять state по окружениям?",a:["Скорость apply","Изоляция: ошибка в stage не может задеть prod, и права доступа разные","Экономия денег","Требование Terraform"],c:1,why:"Общий state — один неверный apply от катастрофы. Плюс разные люди могут иметь доступ к разным окружениям."},
 {t:"q",d:2,q:"Что выносят в модуль?",a:["Всё подряд, для порядка","Повторяющийся набор ресурсов с параметрами, используемый минимум дважды","Только переменные","Секреты"],c:1,why:"Модуль ради одного использования добавляет уровень абстракции, не давая выгоды: читать становится сложнее, а переиспользования нет."},
 {t:"c",d:3,q:"Напиши ключевое слово блока, которым модуль передаёт своё значение (например, public_ip) наружу для использования другими модулями.",ans:["output"],hint:"блок для выходных значений",why:"Граф зависимостей строится по ссылкам между ресурсами — output первого модуля становится входом второго."},
 {t:"c",d:4,q:"У тебя count = 3 для серверов, и ты удаляешь второй элемент из списка. Напиши ключевое слово, которым нужно было адресовать этот набор, чтобы избежать каскадного пересоздания.",ans:["for_each"],hint:"адресация по ключу, а не по индексу",why:"for_each адресует по ключу: удаление одного элемента не задевает остальные, в отличие от count с его индексами."},
 {t:"c",d:4,q:"Напиши название блока внутри variable, которым отсекают недопустимые значения (например, разрешают только stage или prod) до создания ресурсов.",ans:["validation"],hint:"блок внутри variable",why:"Дешёвая проверка на входе вместо дорогого разбирательства, почему в проде появился ресурс с именем shop-prod-prod."},
 {t:"c",d:5,q:"Инцидент. В компании один state на всё, файлы prod.tf и stage.tf лежат рядом. Инженер применил изменение для stage, и apply заодно пересоздал прод-балансировщик. Напиши структуру каталогов (два слова через пробел), которая делает такую ошибку технически невозможной.",ans:["envs/stage envs/prod","envs stage prod","отдельные state"],hint:"разные каталоги окружений со своим state",why:"Изоляция state по каталогам envs/stage и envs/prod делает пересечение stage и prod технически невозможным — внимательность не масштабируется."}]},

{id:"i4",t:"Ansible",goal:"Привести десять серверов к одинаковому состоянию",
 cards:[
 {h:"Инвентарь и первое подключение",b:"<pre># inventory.ini\n[web]\nweb-1 ansible_host=10.0.1.11\nweb-2 ansible_host=10.0.1.12\n\n[web:vars]\nansible_user=deploy\nansible_python_interpreter=/usr/bin/python3</pre><pre>ansible all -i inventory.ini -m ping\nansible web -i inventory.ini -a \"uptime\"</pre><p>Ansible <b>agentless</b>: на целевых машинах не нужен агент, работа идёт по SSH. Требуется только доступ и Python на удалённой стороне. Инвентарь может быть динамическим — генерироваться из облака.</p>",
  cheat:"ansible all -i inventory -m ping — проверка доступности всех хостов",
  t:{q:"Проверь доступность всех хостов инвентаря inventory.ini модулем ping.",ans:["ansible all -i inventory.ini -m ping"],hint:"ansible all -i <файл> -m ping",why:"Это не ICMP-пинг: модуль подключается по SSH и запускает Python — проверяются доступ, ключи и интерпретатор разом."}},
 {h:"Playbook",b:"<pre>- hosts: web\n  become: true\n  vars:\n    app_port: 8080\n  tasks:\n    - name: установить nginx\n      apt:\n        name: nginx\n        state: present\n        update_cache: true\n\n    - name: положить конфиг\n      template:\n        src: nginx.conf.j2\n        dest: /etc/nginx/nginx.conf\n        validate: 'nginx -t -c %s'\n      notify: reload nginx\n\n  handlers:\n    - name: reload nginx\n      service:\n        name: nginx\n        state: reloaded</pre><p><code>validate</code> проверяет конфиг <b>до</b> замены рабочего файла — если синтаксис плох, ничего не меняется.</p>",
  t:{q:"Каким ключом модуля apt задаётся желаемое состояние «пакет должен присутствовать»?",ans:["state: present","state"],hint:"state: ...",why:"state: present/absent — декларативное описание желаемого состояния, Ansible сам решает, нужно ли действие."}},
 {h:"Идемпотентность на практике",b:"<p>Декларативные модули (<code>apt</code>, <code>copy</code>, <code>template</code>, <code>service</code>) сами проверяют состояние и сообщают <code>changed</code> только при реальном изменении.</p><p><code>command</code> и <code>shell</code> идемпотентными <b>не являются</b>: они выполняются всегда. Для них есть <code>creates</code>, <code>removes</code> и <code>when</code>:</p><pre>- name: распаковать архив\n  command: tar xzf /tmp/app.tar.gz -C /opt/app\n  args:\n    creates: /opt/app/bin/server</pre><p><b>handler + notify</b> — вторая половина идемпотентности: сервис перезапускается <i>только если конфиг реально изменился</i>. Без этого каждый прогон дёргает прод без необходимости.</p>",
  cheat:"command/shell не идемпотентны — используй creates/removes/when",
  t:{q:"Каким аргументом модуля command/shell задают путь, наличие которого делает задачу пропущенной (идемпотентной)?",ans:["creates"],hint:"args: creates: <путь>",why:"Без creates/removes/when command и shell выполняются при каждом прогоне безусловно."}},
 {h:"Роли, шаблоны, секреты",b:"<pre>roles/nginx/\n  tasks/main.yml\n  templates/nginx.conf.j2\n  handlers/main.yml\n  defaults/main.yml</pre><p><b>Роль</b> — переиспользуемый структурированный набор. <b>Jinja2-шаблоны</b> подставляют переменные: один шаблон на все окружения.</p><pre>ansible-vault encrypt group_vars/prod/secrets.yml\nansible-playbook site.yml --ask-vault-pass\nansible-playbook site.yml --check --diff   <span class='c'># сухой прогон</span></pre><p><code>--check --diff</code> — аналог terraform plan: показывает, что изменилось бы, ничего не применяя.</p>",
  cheat:"ansible-playbook site.yml --check --diff — сухой прогон, аналог terraform plan",
  t:{q:"Напиши флаги ansible-playbook для сухого прогона (что изменится, без применения).",ans:["--check --diff","--check"],hint:"--check ...",why:"Аналог terraform plan: увидеть diff до того, как что-то реально изменится на серверах."}}],
 ch:[
 {t:"c",d:1,q:"Проверь доступность всех хостов инвентаря.",ans:["ansible all -m ping","ansible all -i inventory -m ping"],hint:"модуль ping",why:"Это не ICMP-пинг: модуль подключается по SSH и запускает Python — проверяются сразу доступ, ключи и интерпретатор."},
 {t:"f",d:2,q:"Допиши ключ, который делает задачу декларативной: «пакет должен присутствовать».",pre:"- name: установить nginx\n  apt:\n    name: nginx\n    ___: present",ans:["state"],hint:"state",why:"state: present/absent — описание желаемого состояния. Ansible сам проверит и не сделает лишнего."},
 {t:"c",d:3,q:"Напиши, какая связка двух ключей (через +) обеспечивает перезапуск сервиса только когда конфиг реально изменился.",ans:["handler + notify","notify + handler","handlers и notify"],hint:"один в задаче, другой в конце плейбука",why:"Иначе каждый прогон дёргает прод без причины. Handler выполняется один раз в конце, даже если его вызвали несколько задач."},
 {t:"c",d:3,q:"Плейбук при каждом запуске показывает changed на задаче с shell: tar xzf .... Напиши аргумент (ключ: значение), который сделает её идемпотентной, если результат распаковки — файл /opt/app/bin/server.",ans:["creates: /opt/app/bin/server"],hint:"args: creates: <путь_к_результату>",why:"command и shell выполняются всегда: Ansible не знает, что они делают. creates/removes/when возвращают идемпотентность."},
 {t:"c",d:4,q:"Напиши команду, которая шифрует файл group_vars/prod/secrets.yml с помощью ansible-vault.",ans:["ansible-vault encrypt group_vars/prod/secrets.yml"],hint:"ansible-vault encrypt <файл>",why:"Секреты никогда не должны лежать в плейбуках открытым текстом — vault шифрует файл целиком."},
 {t:"c",d:5,q:"Инцидент. Плейбук выкатил конфиг nginx с опечаткой на десять серверов и перезапустил сервис — сайт лёг везде одновременно. Напиши ключ модуля template, который не даст заменить рабочий конфиг, если синтаксис не проходит проверку nginx -t.",ans:["validate: 'nginx -t -c %s'","validate"],hint:"аргумент модуля template",why:"validate проверяет конфиг до замены рабочего файла. Вместе с --check --diff и serial:1 (выкатка порциями) это три независимых барьера против массового падения."}]},

{id:"i5",t:"IaC в командной работе",goal:"Сделать инфраструктуру безопасной для изменений",
 cards:[
 {h:"Пайплайн для инфраструктуры",b:"<pre>PR:    terraform fmt -check → validate → plan\n       план публикуется комментарием в PR\n       tfsec / checkov — проверка на небезопасные настройки\nmerge: apply только после ревью и аппрува</pre><p>Ревьюер смотрит не только код, но и <b>diff плана</b>: сколько create, change и особенно destroy. Это принципиально: один и тот же код в разных состояниях даёт разный план.</p><p><code>apply</code> из CI, а не с ноутбуков: тогда у людей нет прямого доступа к прод-state и облачным ключам.</p>",
  t:{q:"Напиши команду, которая проверяет форматирование .tf-файлов без изменения (флаг проверки, а не автоформат).",ans:["terraform fmt -check"],hint:"terraform fmt -...",why:"В CI используют -check, чтобы падать на неотформатированном коде, а не молча переформатировать чужой PR."}},
 {h:"Секреты и чувствительные данные",b:"<ul><li>секреты <b>не</b> в переменных Terraform по умолчанию: state хранит их открытым текстом</li><li>помечай выводы <code>sensitive = true</code>, чтобы они не печатались в логах</li><li>источник секретов — менеджер (Vault, secrets manager облака), а Terraform только ссылается на них</li><li>пароли, сгенерированные Terraform, всё равно окажутся в state — поэтому state шифруют и ограничивают доступ</li></ul>",
  t:{q:"Каким атрибутом output помечают вывод, чтобы он не печатался в открытом виде в логах?",ans:["sensitive = true","sensitive"],hint:"output \"x\" { sensitive = ... }",why:"Без этого атрибута значение (например, пароль базы) окажется в логах CI открытым текстом."}},
 {h:"Тестирование инфраструктуры",b:"<div class='tw'><table><tr><th>уровень</th><th>инструмент</th><th>что ловит</th></tr><tr><td>синтаксис</td><td><code>fmt</code>, <code>validate</code></td><td>опечатки, пропущенные аргументы</td></tr><tr><td>политики</td><td>tfsec, checkov, OPA</td><td>публичный бакет, открытый в мир порт, отсутствие шифрования</td></tr><tr><td>поведение</td><td>terratest, terraform test</td><td>реально ли поднимается и отвечает</td></tr></table></div><p>Первые два уровня стоят почти ничего и ловят самые дорогие ошибки — начинают всегда с них.</p>",
  cheat:"fmt/validate=синтаксис, tfsec/checkov=политики, terratest=поведение"},
 {h:"Что делать нельзя",b:"<ul><li><b>Править state руками.</b> Есть <code>state mv</code>, <code>state rm</code>, <code>import</code> — они безопаснее и логируются.</li><li><b>Хранить state в git.</b> Открытые секреты и постоянные конфликты слияния.</li><li><b>apply без plan.</b> Особенно на проде и особенно в пятницу.</li><li><b>Автоматический apply без ревью</b> на проде: одна опечатка в ветке — и кластер пересоздан.</li><li><b>Общий admin-ключ</b> для всех: у CI своя роль с минимальными правами.</li></ul>",
  t:{q:"Напиши команду, которая переименовывает адрес ресурса в state без его пересоздания (старый адрес aws_instance.old, новый aws_instance.new).",ans:["terraform state mv aws_instance.old aws_instance.new"],hint:"terraform state mv <старый> <новый>",why:"Простое переименование в коде выглядит для Terraform как удаление одного ресурса и создание другого — state mv сохраняет соответствие."}}],
 ch:[
 {t:"q",d:1,q:"Что должен смотреть ревьюер в инфраструктурном PR помимо кода?",a:["Только форматирование","Diff плана: сколько ресурсов создаётся, изменяется и особенно уничтожается","Размер файлов","Число коммитов"],c:1,why:"Код может выглядеть безобидно, а план — показывать пересоздание базы. Публикация плана в PR делает это видимым до применения."},
 {t:"q",d:2,q:"Почему apply запускают из CI, а не с ноутбука инженера?",a:["Так быстрее","У людей не должно быть прямого доступа к прод-state и облачным ключам; плюс аудит и единый порядок действий","Ноутбуки слабые","Требование Terraform"],c:1,why:"Заодно исчезает класс проблем «у меня другая версия провайдера» и «я применил из не той папки»."},
 {t:"c",d:3,q:"Terraform сгенерировал пароль для базы. Напиши атрибут output, которым нужно было пометить этот вывод, чтобы он не светился в логах.",ans:["sensitive = true","sensitive"],hint:"output { sensitive = ... }",why:"State — чувствительный артефакт по определению. Лучше вообще не генерировать секреты в Terraform, а брать их из менеджера секретов."},
 {t:"c",d:3,q:"Напиши название хотя бы одного инструмента, который ловит небезопасные настройки (публичные бакеты, открытые порты) в .tf-файлах.",ans:["tfsec","checkov","opa"],hint:"два похожих инструмента на выбор",why:"Это проверка политик, а не синтаксиса. Дешёвый способ не выкатить в мир открытое хранилище — самая частая причина утечек в облаках."},
 {t:"c",d:4,q:"Нужно переименовать ресурс aws_instance.web в aws_instance.app в коде, не пересоздавая его. Напиши команду.",ans:["terraform state mv aws_instance.web aws_instance.app"],hint:"terraform state mv <старый> <новый>",why:"Простое переименование выглядит для Terraform как удаление одного ресурса и создание другого. state mv сохраняет соответствие без пересоздания."},
 {t:"c",d:5,q:"Инцидент. В пятницу вечером инженер запустил apply без плана, чтобы «поправить тег». Apply пересоздал кластер БД: 40 минут недоступности и потеря данных. Напиши атрибут блока lifecycle, который заставил бы Terraform отказаться применять план, уничтожающий этот ресурс.",ans:["prevent_destroy = true","prevent_destroy"],hint:"lifecycle { prevent_destroy = ... }",why:"prevent_destroy — недооценённая защита. Вместе с ревью сохранённого плана и запуском apply только из CI это три независимых барьера против таких инцидентов."}]}
);
