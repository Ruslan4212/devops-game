{id:"i1",t:"Идея IaC",goal:"Понять декларативность и идемпотентность",
 cards:[
 {h:"Два слова, которые надо выучить",b:"<p><b>Декларативно</b> — ты описываешь <i>желаемое состояние</i>: «нужно три сервера такого типа». Инструмент сам сравнивает с реальностью и вычисляет разницу.</p><p><b>Императивно</b> — ты описываешь <i>шаги</i>: «создай сервер, потом ещё один». При повторном запуске получишь шесть серверов.</p><p><b>Идемпотентность</b> — применил один раз или десять, результат одинаковый. Именно поэтому декларативный подход безопасен: повторный запуск ничего не ломает.</p>"},
 {h:"Почему это лучше кликов в консоли",b:"<div class='tw'><table><tr><th>клики в панели</th><th>инфраструктура как код</th></tr><tr><td>«а кто это поменял?»</td><td>история в git с автором и датой</td></tr><tr><td>изменения не ревьюят</td><td>PR с обсуждением до применения</td></tr><tr><td>среды расходятся</td><td>один код, разные параметры</td></tr><tr><td>восстановление — по памяти</td><td>пересоздание с нуля одной командой</td></tr></table></div><p>Инфраструктура становится обычным кодом: ревью, откат, аудит, тесты. Это главный аргумент, который ждут на собеседовании.</p>"},
 {h:"Terraform и Ansible решают разные задачи",b:"<div class='tw'><table><tr><th></th><th>Terraform</th><th>Ansible</th></tr><tr><td>задача</td><td>создавать ресурсы (provisioning)</td><td>настраивать внутри (configuration)</td></tr><tr><td>стиль</td><td>декларативный, есть state</td><td>процедурный, состояние не хранит</td></tr><tr><td>типично</td><td>ВМ, сети, кластеры, БД, DNS</td><td>пакеты, конфиги, деплой приложений</td></tr><tr><td>агент</td><td>не нужен</td><td>не нужен, работает по SSH</td></tr></table></div><p>Классическая связка: Terraform поднял серверы → Ansible их настроил. В контейнерном мире вторая часть часто заменяется образом.</p>"},
 {h:"Дрейф конфигурации",b:"<p><b>Drift</b> — расхождение между кодом и реальностью: кто-то поменял настройку руками, и теперь состояние отличается от описанного.</p><p>Terraform обнаруживает дрейф при <code>plan</code>: он опрашивает провайдера и сравнивает. Ansible «чинит» дрейф самим фактом повторного прогона.</p><p>Практическое правило: если инфраструктура под IaC, ручные правки в консоли запрещены. Иначе следующий apply молча вернёт всё назад — иногда посреди рабочего дня.</p>"}],
 ch:[
 {t:"q",d:1,q:"Что означает «идемпотентный playbook»?",a:["Он быстро выполняется","Повторный запуск не меняет систему, если она уже в нужном состоянии","Работает без сети","Не требует sudo"],c:1,why:"Поэтому в Ansible пишут state: present, а не «выполни apt install»: инструмент сам решает, нужно ли действие."},
 {t:"q",d:2,q:"Нужно создать 10 виртуальных машин в облаке. Какой инструмент?",a:["Ansible","Terraform","Bash-скрипт с curl к API","Руками в панели"],c:1,why:"Terraform управляет жизненным циклом ресурсов: создание, изменение, удаление и зависимости между ними. Ansible настроит их уже изнутри."},
 {t:"q",d:3,q:"Главный аргумент в пользу IaC перед кликами в веб-консоли?",a:["Красиво выглядит","Воспроизводимость, ревью изменений, история в git и возможность пересоздать всё с нуля","Дешевле по деньгам","Быстрее, чем кликать"],c:1,why:"И побочный эффект той же ценности: исчезает вопрос «кто и когда это поменял» — ответ всегда в истории коммитов."},
 {t:"q",d:3,q:"Что такое дрейф конфигурации?",a:["Медленная работа облака","Расхождение между описанным в коде состоянием и фактическим — обычно из-за ручных правок","Устаревание версии Terraform","Задержка сети"],c:1,why:"Terraform показывает дрейф при plan. Именно поэтому ручные изменения в консоли на IaC-инфраструктуре запрещают."},
 {t:"q",d:4,q:"Коллега поправил security group руками в панели «на пять минут, потом верну». Чем это опасно?",a:["Ничем, если он вернёт","Следующий apply молча откатит изменение (возможно, в разгар дня), а до этого код и реальность расходятся — правки должны идти только через код","Панель заблокируется","Terraform перестанет работать"],c:1,why:"Хуже всего промежуточное состояние: код перестаёт быть источником правды, и никто не знает, что реально работает."},
 {t:"q",d:5,q:"<b>Инцидент.</b> Тебе передали проект: инфраструктура создана руками, документации нет, автор уволился. Нужно перевести всё в код. С чего начать?",a:["Снести и создать заново по-правильному","Описать текущее состояние в коде и импортировать существующие ресурсы в state, убедиться, что plan показывает «нет изменений», и только потом рефакторить","Написать документацию и оставить как есть","Создать копию инфраструктуры рядом"],c:1,why:"Импорт даёт контроль без даунтайма. Критерий успеха первого этапа — plan без изменений: значит код точно описывает реальность, и дальше можно менять осознанно."}]},

{id:"i2",t:"Terraform: цикл работы и state",goal:"Не удалить прод при первом же apply",
 cards:[
 {h:"Рабочий цикл",b:"<pre>terraform init      <span class='c'># скачать провайдеры, настроить backend</span>\nterraform fmt -recursive\nterraform validate  <span class='c'># синтаксис и обязательные аргументы</span>\nterraform plan -out=tf.plan\nterraform apply tf.plan\nterraform destroy</pre><p><code>plan</code> перед <code>apply</code> — не рекомендация, а правило. Применяют <b>сохранённый план</b>, а не «plan посмотрели, apply запустили»: между ними состояние могло измениться.</p><p>Читать план надо по строкам, обращая внимание на итог: сколько <b>create</b>, <b>change</b> и особенно <b>destroy</b>.</p>"},
 {h:"State — сердце Terraform",b:"<p><code>terraform.tfstate</code> — карта соответствия «ресурс в коде ↔ реальный объект у провайдера». Без него Terraform не знает, что уже создано, и попытается создать всё заново.</p><ul><li>хранить <b>удалённо</b> (S3, GCS, Terraform Cloud), не в git</li><li>обязательно <b>блокировка</b>: иначе два одновременных apply разнесут инфраструктуру</li><li>включить <b>версионирование</b> бакета: испорченный state можно откатить</li><li>шифрование: state хранит значения атрибутов открытым текстом, включая пароли</li></ul>"},
 {h:"Символы плана",b:"<div class='tw'><table><tr><th>символ</th><th>значение</th></tr><tr><td><code>+</code></td><td>создать</td></tr><tr><td><code>~</code></td><td>изменить на месте — безопасно</td></tr><tr><td><code>-</code></td><td>уничтожить</td></tr><tr><td><code>-/+</code></td><td><b>пересоздать</b>: уничтожить и создать заново</td></tr></table></div><p>Строка <code># forces replacement</code> рядом с полем говорит, какой именно атрибут вызывает пересоздание. Такие поля называют <b>ForceNew</b>: зона доступности, подсеть, иногда имя или образ.</p><p>Увидел <code>-/+</code> на боевом ресурсе — остановись и разберись. Это не «мелкое изменение тега».</p>"},
 {h:"Импорт и удаление из state",b:"<pre>terraform import aws_instance.app i-0a1b2c3d\n\n# современный способ — блок в коде:\nimport {\n  to = aws_instance.app\n  id = \"i-0a1b2c3d\"\n}\n\nterraform state rm aws_instance.app   <span class='c'># забыть о ресурсе, не удаляя его</span></pre><p><code>import</code> связывает существующий объект с адресом в коде. Без него apply попытается создать дубликат.</p><p><code>state rm</code> — обратная операция: Terraform перестаёт управлять ресурсом, сам объект остаётся жить. Используется при разделении проектов.</p>"},
 {h:"Версии — часть воспроизводимости",b:"<pre>terraform {\n  required_version = \"~&gt; 1.7\"\n  required_providers {\n    aws = { source = \"hashicorp/aws\", version = \"~&gt; 5.40\" }\n  }\n}</pre><p>Файл <code>.terraform.lock.hcl</code> фиксирует точные версии провайдеров и коммитится в git. Без него завтрашний apply может повести себя иначе из-за вышедшего обновления — и сломать прод без единого изменения в коде.</p>"}],
 ch:[
 {t:"c",d:1,q:"Посмотри, что именно Terraform собирается изменить, ничего не применяя.",ans:["terraform plan","terraform plan -out=tf.plan","tf plan"],hint:"одно слово после terraform",why:"В CI план публикуют в PR, чтобы ревьюер увидел diff инфраструктуры до применения."},
 {t:"q",d:2,q:"Зачем state хранят в S3 с блокировкой, а не локально?",a:["Так быстрее","Общее состояние для команды и защита от одновременного apply","Дешевле","Требование провайдера"],c:1,why:"Локальный state = рассинхрон и потерянная инфраструктура при смене ноутбука. Блокировка спасает от гонки двух инженеров."},
 {t:"q",d:3,q:"В плане на боевом ресурсе видно <code>-/+</code> и пометку <code># forces replacement</code>, хотя ты менял только тег. Что делать?",a:["Применить, тег же мелкий","Остановиться и найти ForceNew-атрибут: какое-то поле изменено так, что требует пересоздания ресурса","Удалить state и начать заново","Запустить apply дважды"],c:1,why:"Пересоздание боевой машины или базы — это потеря данных и даунтайм. Чтение плана построчно — базовый навык, спасающий продакшены."},
 {t:"q",d:3,q:"Ресурс создали руками в консоли, теперь им нужно управлять из Terraform. Как?",a:["Пересоздать через apply","<code>terraform import</code> или import-блок — затянуть существующий объект в state","Скопировать конфигурацию в код, этого достаточно","Это невозможно"],c:1,why:"Без импорта apply создаст дубликат. После импорта критерий успеха — plan, показывающий отсутствие изменений."},
 {t:"q",d:4,q:"Зачем коммитить <code>.terraform.lock.hcl</code> в git?",a:["Не нужно, это временный файл","Он фиксирует точные версии провайдеров: без него завтрашний apply может повести себя иначе из-за обновления","Ускоряет init","Хранит секреты"],c:1,why:"Воспроизводимость инфраструктуры так же важна, как воспроизводимость сборки. Инфраструктура, меняющаяся сама по себе, — источник самых загадочных инцидентов."},
 {t:"q",d:5,q:"<b>Инцидент.</b> Два инженера одновременно запустили apply на одном проекте. State испорчен, часть ресурсов задублирована, часть числится удалённой, но существует. Что делать и что предотвратило бы это?",a:["Удалить всё и создать заново","Восстановить предыдущую версию state из версионирования бакета, сверить с реальностью и доимпортировать расхождения; предотвращает блокировка state (DynamoDB или встроенная в backend) и apply только из CI","Написать state вручную","Игнорировать, Terraform сам починит"],c:1,why:"Три меры вместе: блокировка (гонка невозможна), версионирование (есть куда откатиться), запуск только из пайплайна (людям не нужен прямой доступ к прод-state)."}]},

{id:"i3",t:"Terraform: переменные, модули, окружения",goal:"Не копировать конфиги между prod и staging",
 cards:[
 {h:"Переменные, выводы, локальные значения",b:"<pre>variable \"env\" {\n  type        = string\n  description = \"окружение\"\n  validation {\n    condition     = contains([\"stage\",\"prod\"], var.env)\n    error_message = \"допустимо только stage или prod\"\n  }\n}\n\nlocals {\n  name_prefix = \"shop-${var.env}\"\n}\n\noutput \"app_ip\" {\n  value = aws_instance.app[0].public_ip\n}</pre><p><code>variable</code> — вход, <code>output</code> — выход (в том числе для других модулей), <code>locals</code> — вычисляемые значения внутри. Валидация переменных ловит опечатки до создания ресурсов.</p>"},
 {h:"Модуль — функция для инфраструктуры",b:"<pre>module \"app\" {\n  source = \"./modules/service\"\n\n  env           = \"prod\"\n  instance_type = \"t3.large\"\n  replicas      = 3\n}\n\n# использование вывода модуля\noutput \"ip\" { value = module.app.public_ip }</pre><p>Внутри модуля — ресурсы и переменные, снаружи — только параметры. Terraform строит граф зависимостей автоматически по ссылкам между ресурсами: если один ссылается на другой, порядок создания определится сам.</p><p>Модуль оправдан, когда набор используется дважды и более. Преждевременная модуляризация усложняет чтение.</p>"},
 {h:"Разделение окружений",b:"<pre>infra/\n  modules/\n    service/\n  envs/\n    stage/  main.tf  → module \"app\" { replicas = 1 }\n    prod/   main.tf  → module \"app\" { replicas = 3 }</pre><p>У каждого окружения <b>свой state</b>. Ошибка в stage физически не может задеть prod, и права доступа к state тоже разные.</p><p>Альтернатива — <code>workspace</code>, но отдельные каталоги нагляднее: видно, что где развёрнуто, и разные окружения могут отличаться не только числами.</p>"},
 {h:"count и for_each",b:"<pre>resource \"aws_instance\" \"app\" {\n  count         = var.env == \"prod\" ? 3 : 1\n  instance_type = var.instance_type\n}\n\nresource \"aws_s3_bucket\" \"b\" {\n  for_each = toset([\"logs\", \"backups\"])\n  bucket   = \"shop-${each.key}\"\n}</pre><p><b>Важное различие:</b> <code>count</code> адресует ресурсы по индексу (<code>app[0]</code>, <code>app[1]</code>). Удалил элемент из середины — все последующие сдвинутся и <b>будут пересозданы</b>.</p><p><code>for_each</code> адресует по ключу (<code>b[\"logs\"]</code>): удаление одного элемента не задевает остальные. Для наборов именованных ресурсов почти всегда нужен for_each.</p>"}],
 ch:[
 {t:"q",d:1,q:"Главная причина разделять state по окружениям?",a:["Скорость apply","Изоляция: ошибка в stage не может задеть prod, и права доступа разные","Экономия денег","Требование Terraform"],c:1,why:"Общий state — один неверный apply от катастрофы. Плюс разные люди могут иметь доступ к разным окружениям."},
 {t:"q",d:2,q:"Что выносят в модуль?",a:["Всё подряд, для порядка","Повторяющийся набор ресурсов с параметрами, используемый минимум дважды","Только переменные","Секреты"],c:1,why:"Модуль ради одного использования добавляет уровень абстракции, не давая выгоды: читать становится сложнее, а переиспользования нет."},
 {t:"q",d:3,q:"Как передать значение из одного модуля в другой?",a:["Через общий файл","Через <code>output</code> первого и входную переменную второго — Terraform сам построит порядок по этой связи","Через переменные окружения","Никак, модули изолированы"],c:1,why:"Граф зависимостей строится по ссылкам между ресурсами. Ручной порядок задавать не нужно и обычно вредно."},
 {t:"q",d:4,q:"У тебя <code>count = 3</code> для серверов, и ты удаляешь второй элемент из списка. Что произойдёт?",a:["Удалится только он","Индексы сдвинутся: третий станет вторым, и Terraform пересоздаст всё, что после удалённого","Ничего не изменится","Terraform откажется применять"],c:1,why:"Именно поэтому для наборов именованных ресурсов используют for_each: адресация по ключу, а не по позиции."},
 {t:"q",d:4,q:"Зачем в переменной блок <code>validation</code>?",a:["Для документации","Отсечь недопустимые значения до создания ресурсов — опечатка ломает plan, а не прод","Ускоряет apply","Требуется для модулей"],c:1,why:"Дешёвая проверка на входе вместо дорогого разбирательства, почему в проде появился ресурс с именем shop-prod-prod."},
 {t:"q",d:5,q:"<b>Инцидент.</b> В компании один state на всё, файлы <code>prod.tf</code> и <code>stage.tf</code> лежат рядом. Инженер применил изменение для stage, и apply заодно пересоздал прод-балансировщик — 8 минут недоступности. Как перестроить?",a:["Внимательнее читать план","Разделить на каталоги envs/stage и envs/prod со своими state и правами доступа, общее вынести в модули, apply в prod — только из CI после ревью плана","Работать по очереди","Делать бэкап state перед каждым apply"],c:1,why:"Внимательность не масштабируется: рано или поздно устанет любой. Изоляция state делает такую ошибку технически невозможной."}]},

{id:"i4",t:"Ansible",goal:"Привести десять серверов к одинаковому состоянию",
 cards:[
 {h:"Инвентарь и первое подключение",b:"<pre># inventory.ini\n[web]\nweb-1 ansible_host=10.0.1.11\nweb-2 ansible_host=10.0.1.12\n\n[web:vars]\nansible_user=deploy\nansible_python_interpreter=/usr/bin/python3</pre><pre>ansible all -i inventory.ini -m ping\nansible web -i inventory.ini -a \"uptime\"</pre><p>Ansible <b>agentless</b>: на целевых машинах не нужен агент, работа идёт по SSH. Требуется только доступ и Python на удалённой стороне. Инвентарь может быть динамическим — генерироваться из облака.</p>"},
 {h:"Playbook",b:"<pre>- hosts: web\n  become: true\n  vars:\n    app_port: 8080\n  tasks:\n    - name: установить nginx\n      apt:\n        name: nginx\n        state: present\n        update_cache: true\n\n    - name: положить конфиг\n      template:\n        src: nginx.conf.j2\n        dest: /etc/nginx/nginx.conf\n        validate: 'nginx -t -c %s'\n      notify: reload nginx\n\n  handlers:\n    - name: reload nginx\n      service:\n        name: nginx\n        state: reloaded</pre><p><code>validate</code> проверяет конфиг <b>до</b> замены рабочего файла — если синтаксис плох, ничего не меняется.</p>"},
 {h:"Идемпотентность на практике",b:"<p>Декларативные модули (<code>apt</code>, <code>copy</code>, <code>template</code>, <code>service</code>) сами проверяют состояние и сообщают <code>changed</code> только при реальном изменении.</p><p><code>command</code> и <code>shell</code> идемпотентными <b>не являются</b>: они выполняются всегда. Для них есть <code>creates</code>, <code>removes</code> и <code>when</code>:</p><pre>- name: распаковать архив\n  command: tar xzf /tmp/app.tar.gz -C /opt/app\n  args:\n    creates: /opt/app/bin/server</pre><p><b>handler + notify</b> — вторая половина идемпотентности: сервис перезапускается <i>только если конфиг реально изменился</i>. Без этого каждый прогон дёргает прод без необходимости.</p>"},
 {h:"Роли, шаблоны, секреты",b:"<pre>roles/nginx/\n  tasks/main.yml\n  templates/nginx.conf.j2\n  handlers/main.yml\n  defaults/main.yml</pre><p><b>Роль</b> — переиспользуемый структурированный набор. <b>Jinja2-шаблоны</b> подставляют переменные: один шаблон на все окружения.</p><pre>ansible-vault encrypt group_vars/prod/secrets.yml\nansible-playbook site.yml --ask-vault-pass\nansible-playbook site.yml --check --diff   <span class='c'># сухой прогон</span></pre><p><code>--check --diff</code> — аналог terraform plan: показывает, что изменилось бы, ничего не применяя.</p>"}],
 ch:[
 {t:"c",d:1,q:"Проверь доступность всех хостов инвентаря.",ans:["ansible all -m ping","ansible all -i inventory -m ping"],hint:"модуль ping",why:"Это не ICMP-пинг: модуль подключается по SSH и запускает Python — проверяются сразу доступ, ключи и интерпретатор."},
 {t:"f",d:2,q:"Допиши ключ, который делает задачу декларативной: «пакет должен присутствовать».",pre:"- name: установить nginx\n  apt:\n    name: nginx\n    ___: present",ans:["state"],hint:"state",why:"state: present/absent — описание желаемого состояния. Ansible сам проверит и не сделает лишнего."},
 {t:"q",d:3,q:"Что означает «Ansible agentless»?",a:["Работает без интернета","На управляемых хостах не нужен агент — подключение по SSH","Не требует Python","Работает без конфигурации"],c:1,why:"Отличие от Puppet и Chef с их агентами. Нужны лишь SSH-доступ и Python на целевой машине."},
 {t:"q",d:3,q:"Зачем связка handler + notify вместо перезапуска сервиса в конце плейбука?",a:["Красивее","Сервис перезапускается только если конфиг действительно изменился","Быстрее выполняется","Обязательно по синтаксису"],c:1,why:"Иначе каждый прогон дёргает прод без причины. Handler выполняется один раз в конце, даже если его вызвали несколько задач."},
 {t:"q",d:4,q:"Плейбук при каждом запуске показывает changed на задаче с <code>shell: tar xzf ...</code>. Как сделать её идемпотентной?",a:["Убрать задачу","Добавить <code>args: creates: путь_к_результату</code> или условие when — тогда команда выполнится только при отсутствии результата","Запускать плейбук реже","Использовать become"],c:1,why:"command и shell выполняются всегда: Ansible не знает, что они делают. creates/removes/when возвращают идемпотентность."},
 {t:"q",d:5,q:"<b>Инцидент.</b> Плейбук выкатил конфиг nginx с опечаткой на десять серверов и перезапустил сервис — сайт лёг везде одновременно. Что должно было это предотвратить?",a:["Более внимательный автор","<code>validate</code> в модуле template (конфиг не заменится, если nginx -t не прошёл), прогон <code>--check --diff</code>, выкатка порциями через <code>serial: 1</code> и проверка после каждой","Ручная выкатка по одному серверу","Откат из бэкапа"],c:1,why:"Автоматизация умножает и правильные действия, и ошибки. Поэтому в неё встраивают проверку до применения и постепенность выкатки — ровно как в rolling update."}]},

{id:"i5",t:"IaC в командной работе",goal:"Сделать инфраструктуру безопасной для изменений",
 cards:[
 {h:"Пайплайн для инфраструктуры",b:"<pre>PR:    terraform fmt -check → validate → plan\n       план публикуется комментарием в PR\n       tfsec / checkov — проверка на небезопасные настройки\nmerge: apply только после ревью и аппрува</pre><p>Ревьюер смотрит не только код, но и <b>diff плана</b>: сколько create, change и destroy. Это принципиально: один и тот же код в разных состояниях даёт разный план.</p><p><code>apply</code> из CI, а не с ноутбуков: тогда у людей нет прямого доступа к прод-state и облачным ключам.</p>"},
 {h:"Секреты и чувствительные данные",b:"<ul><li>секреты <b>не</b> в переменных Terraform по умолчанию: state хранит их открытым текстом</li><li>помечай выводы <code>sensitive = true</code>, чтобы они не печатались в логах</li><li>источник секретов — менеджер (Vault, secrets manager облака), а Terraform только ссылается на них</li><li>пароли, сгенерированные Terraform, всё равно окажутся в state — поэтому state шифруют и ограничивают доступ</li></ul>"},
 {h:"Тестирование инфраструктуры",b:"<div class='tw'><table><tr><th>уровень</th><th>инструмент</th><th>что ловит</th></tr><tr><td>синтаксис</td><td><code>fmt</code>, <code>validate</code></td><td>опечатки, пропущенные аргументы</td></tr><tr><td>политики</td><td>tfsec, checkov, OPA</td><td>публичный бакет, открытый в мир порт, отсутствие шифрования</td></tr><tr><td>поведение</td><td>terratest, terraform test</td><td>реально ли поднимается и отвечает</td></tr></table></div><p>Первые два уровня стоят почти ничего и ловят самые дорогие ошибки — начинают всегда с них.</p>"},
 {h:"Что делать нельзя",b:"<ul><li><b>Править state руками.</b> Есть <code>state mv</code>, <code>state rm</code>, <code>import</code> — они безопаснее и логируются.</li><li><b>Хранить state в git.</b> Открытые секреты и постоянные конфликты слияния.</li><li><b>apply без plan.</b> Особенно на проде и особенно в пятницу.</li><li><b>Автоматический apply без ревью</b> на проде: одна опечатка в ветке — и кластер пересоздан.</li><li><b>Общий admin-ключ</b> для всех: у CI своя роль с минимальными правами.</li></ul>"}],
 ch:[
 {t:"q",d:1,q:"Что должен смотреть ревьюер в инфраструктурном PR помимо кода?",a:["Только форматирование","Diff плана: сколько ресурсов создаётся, изменяется и особенно уничтожается","Размер файлов","Число коммитов"],c:1,why:"Код может выглядеть безобидно, а план — показывать пересоздание базы. Публикация плана в PR делает это видимым до применения."},
 {t:"q",d:2,q:"Почему apply запускают из CI, а не с ноутбука инженера?",a:["Так быстрее","У людей не должно быть прямого доступа к прод-state и облачным ключам; плюс аудит и единый порядок действий","Ноутбуки слабые","Требование Terraform"],c:1,why:"Заодно исчезает класс проблем «у меня другая версия провайдера» и «я применил из не той папки»."},
 {t:"q",d:3,q:"Terraform сгенерировал пароль для базы. Где он окажется?",a:["Только в облаке","В state открытым текстом — поэтому state шифруют, хранят удалённо и ограничивают доступ","В зашифрованном виде в коде","Нигде, он одноразовый"],c:1,why:"State — чувствительный артефакт по определению. Лучше вообще не генерировать секреты в Terraform, а брать их из менеджера секретов."},
 {t:"q",d:3,q:"Что ловят tfsec и checkov?",a:["Синтаксические ошибки","Небезопасные настройки: публичные бакеты, открытые в интернет порты, отсутствие шифрования","Медленные ресурсы","Опечатки в именах"],c:1,why:"Это проверка политик, а не синтаксиса. Дешёвый способ не выкатить в мир открытое хранилище — самая частая причина утечек в облаках."},
 {t:"q",d:4,q:"Нужно переименовать ресурс в коде, не пересоздавая его. Как правильно?",a:["Просто переименовать и применить","<code>terraform state mv</code> старый_адрес новый_адрес — Terraform сохранит связь с реальным объектом","Удалить и создать заново","Править state в текстовом редакторе"],c:1,why:"Простое переименование выглядит для Terraform как удаление одного ресурса и создание другого. state mv сохраняет соответствие без пересоздания."},
 {t:"q",d:5,q:"<b>Инцидент.</b> В пятницу вечером инженер запустил apply без плана, чтобы «поправить тег». Apply пересоздал кластер БД: 40 минут недоступности и потеря данных за 15 минут. Какие три меры сделали бы это невозможным?",a:["Запрет работать по пятницам","1) apply только сохранённого плана после ревью в PR; 2) apply из CI с обязательным аппрувом для прода; 3) защита критичных ресурсов через lifecycle prevent_destroy","Более опытный инженер","Ежедневные бэкапы"],c:1,why:"prevent_destroy — недооценённая защита: Terraform откажется применять план, уничтожающий помеченный ресурс. Вместе с ревью плана и запуском из CI это три независимых барьера."}]}
);

{id:"k1",t:"Устройство кластера",goal:"Понять, кто и как приводит кластер к желаемому состоянию",
 cards:[
 {h:"Control plane",b:"<div class='tw'><table><tr><th>компонент</th><th>роль</th></tr><tr><td><b>API server</b></td><td>единственная точка входа: всё идёт через него, включая обмен между компонентами</td></tr><tr><td><b>etcd</b></td><td>база всего состояния кластера; её бэкапят</td></tr><tr><td><b>scheduler</b></td><td>решает, на какую ноду поставить под</td></tr><tr><td><b>controller manager</b></td><td>набор контроллеров, приводящих реальность к желаемому состоянию</td></tr></table></div><p>На каждой ноде: <b>kubelet</b> (запускает контейнеры и следит за ними) и <b>kube-proxy</b> (правила сети для сервисов).</p>"},
 {h:"Reconciliation loop — главная идея",b:"<p>Ты не отдаёшь команды «запусти контейнер». Ты <b>записываешь желаемое состояние</b> в API, и контроллеры бесконечно сверяют его с фактическим, устраняя разницу.</p><pre>желаемое: 3 реплики\nфакт:     2 реплики\n→ контроллер создаёт третью</pre><p>Отсюда всё остальное: самовосстановление, декларативность манифестов, бессмысленность ручных изменений (их вернут назад) и то, что <code>kubectl apply</code> — это «запиши намерение», а не «сделай сейчас».</p>"},
 {h:"Объекты, которые используешь каждый день",b:"<div class='tw'><table><tr><th>объект</th><th>назначение</th></tr><tr><td><b>Pod</b></td><td>минимальная единица: один или несколько контейнеров с общей сетью и томами. Смертен</td></tr><tr><td><b>ReplicaSet</b></td><td>держит заданное число подов</td></tr><tr><td><b>Deployment</b></td><td>управляет ReplicaSet: rolling update и откат</td></tr><tr><td><b>Service</b></td><td>стабильный адрес и балансировка к подам по лейблам</td></tr><tr><td><b>Ingress</b></td><td>HTTP-маршрутизация снаружи по доменам и путям</td></tr><tr><td><b>ConfigMap / Secret</b></td><td>конфигурация и чувствительные данные</td></tr><tr><td><b>StatefulSet</b></td><td>стабильные имена и диски: БД, кворумные системы</td></tr><tr><td><b>DaemonSet</b></td><td>по одному поду на каждой ноде: агенты логов, мониторинг</td></tr><tr><td><b>Job / CronJob</b></td><td>разовые и периодические задачи</td></tr></table></div>"},
 {h:"Namespace и контексты",b:"<pre>kubectl config get-contexts\nkubectl config use-context prod          <span class='c'># ОСТОРОЖНО</span>\nkubectl config set-context --current --namespace=dev\nkubectl get pods -A                      <span class='c'># во всех неймспейсах</span></pre><p><b>Namespace</b> — логическое разделение объектов (среды, команды), к нему привязывают квоты и права. Сетевой изоляции он <b>не даёт</b>: поды разных неймспейсов свободно ходят друг к другу, пока нет NetworkPolicy.</p><p>Правило безопасности: выводи текущий контекст в приглашение терминала (kube-ps1, starship). Большинство аварий вида «я думал, что я в стейдже» лечится этой настройкой.</p>"},
 {h:"Локальный кластер",b:"<div class='tw'><table><tr><th>инструмент</th><th>когда</th></tr><tr><td>minikube</td><td>универсальный старт, много аддонов</td></tr><tr><td>kind</td><td>кластер внутри Docker: быстрый, удобен для CI</td></tr><tr><td>k3s / k3d</td><td>лёгкий; годится и для небольшого реального прода</td></tr></table></div><pre>kubectl explain deployment.spec.template   <span class='c'># встроенная документация по любому полю</span></pre><p><code>explain</code> читает схему прямо из API-сервера — всегда актуально для твоей версии кластера и работает офлайн.</p>"}],
 ch:[
 {t:"c",d:1,q:"Проверь, какие узлы есть в кластере.",ans:["kubectl get nodes","kubectl get node","k get nodes"],hint:"kubectl get ...",why:"Первая команда после подключения. NotReady у ноды — смотри kubelet и сетевой плагин."},
 {t:"c",d:2,q:"Покажи поды во всех неймспейсах сразу.",ans:["kubectl get pods -a","kubectl get pods --all-namespaces","kubectl get po -a"],hint:"флаг -A",why:"Полезно, когда «под где-то есть, но я его не вижу»: чаще всего ты просто в другом неймспейсе."},
 {t:"q",d:3,q:"Под упал и не вернулся. Что должно было его пересоздать?",a:["kubelet сам по себе","Deployment через ReplicaSet: контроллер держит нужное число реплик","Ingress","etcd"],c:1,why:"Голый Pod никто не воскрешает. Поэтому в проде создают Deployment (или StatefulSet), а не Pod напрямую."},
 {t:"q",d:3,q:"Namespace обеспечивает сетевую изоляцию между приложениями?",a:["Да, полностью","Нет: он разделяет объекты API, квоты и права, но поды разных неймспейсов свободно общаются, пока нет NetworkPolicy","Только для Service","Только в managed-кластерах"],c:1,why:"Частое заблуждение, которое приводит к ложному ощущению безопасности. Микросегментация — отдельная работа."},
 {t:"q",d:4,q:"Что такое reconciliation loop и почему это важно понимать?",a:["Цикл перезапуска подов","Контроллеры непрерывно сверяют желаемое состояние с фактическим и устраняют разницу — отсюда самовосстановление и бесполезность ручных правок","Механизм балансировки","Процесс обновления кластера"],c:1,why:"Из этой модели следует всё поведение Kubernetes: kubectl apply записывает намерение, а не выполняет команду немедленно."},
 {t:"q",d:5,q:"<b>Инцидент.</b> Инженер вручную удалил под, который «мешал», и он тут же появился снова. Затем он удалил его пять раз подряд с тем же результатом и решил, что кластер сломан. Что происходит?",a:["Кластер действительно неисправен","Так и должно быть: ReplicaSet восстанавливает нужное число реплик — чтобы под исчез, нужно менять желаемое состояние (scale, удаление Deployment), а не сам под","Под завис в etcd","Нужно перезапустить kubelet"],c:1,why:"Это лучшая иллюстрация декларативной модели: борьба с симптомом бесполезна, менять надо запись о желаемом состоянии."}]},

{id:"k2",t:"Deployment и манифесты",goal:"Описать приложение так, чтобы оно пережило нагрузку и деплой",
 cards:[
 {h:"Полный манифест",b:"<pre>apiVersion: apps/v1\nkind: Deployment\nmetadata:\n  name: api\nspec:\n  replicas: 3\n  selector:\n    matchLabels: { app: api }\n  strategy:\n    type: RollingUpdate\n    rollingUpdate:\n      maxUnavailable: 0\n      maxSurge: 1\n  template:\n    metadata:\n      labels: { app: api }\n    spec:\n      containers:\n        - name: api\n          image: registry/api:1a2b3c4\n          ports: [{ containerPort: 8080 }]\n          resources:\n            requests: { cpu: 100m, memory: 128Mi }\n            limits:   { cpu: 500m, memory: 512Mi }\n          readinessProbe:\n            httpGet: { path: /health, port: 8080 }</pre><p><code>selector.matchLabels</code> обязан совпадать с <code>template.metadata.labels</code> — иначе Deployment не будет управлять своими же подами.</p>"},
 {h:"requests и limits",b:"<div class='tw'><table><tr><th></th><th>requests</th><th>limits</th></tr><tr><td>смысл</td><td>гарантированный минимум</td><td>жёсткий потолок</td></tr><tr><td>кто использует</td><td>scheduler при выборе ноды</td><td>ядро через cgroups</td></tr><tr><td>превышение CPU</td><td>—</td><td>троттлинг: приложение тормозит</td></tr><tr><td>превышение памяти</td><td>—</td><td><b>OOMKilled</b>: контейнер убит</td></tr></table></div><p>Без <code>requests</code> планировщик работает вслепую и переполняет ноды. Единицы: <code>100m</code> = 0,1 ядра, <code>128Mi</code> = мебибайты.</p><p>Практика: память ставят с запасом и обязательно, CPU-лимиты — щедро или не ставят вовсе, чтобы не троттлить без нужды.</p>"},
 {h:"Стратегия обновления",b:"<p><code>maxUnavailable: 0</code> — не убирать старый под, пока новый не готов. <code>maxSurge: 1</code> — можно временно поднять на один под больше.</p><p>Такая пара даёт выкатку без потери мощности. Обратная сторона — нужно место на ноде под лишний под и обратная совместимость: обе версии работают одновременно.</p><pre>kubectl rollout status deploy/api\nkubectl rollout history deploy/api\nkubectl rollout undo deploy/api</pre><p>Deployment хранит историю ревизий, поэтому откат — одна команда. Это главный практический аргумент декларативного подхода.</p>"},
 {h:"Команды выживания",b:"<pre>kubectl get pods -o wide          <span class='c'># с нодами и IP</span>\nkubectl describe pod api-xxx      <span class='c'># события внизу — главное</span>\nkubectl logs -f api-xxx\nkubectl logs api-xxx --previous   <span class='c'># логи упавшего контейнера</span>\nkubectl exec -it api-xxx -- sh\nkubectl get events --sort-by=.lastTimestamp\nkubectl apply -f deploy.yaml\nkubectl diff -f deploy.yaml       <span class='c'># что изменится до применения</span></pre><p><code>kubectl diff</code> — недооценённая команда: тот же смысл, что terraform plan.</p>"}],
 ch:[
 {t:"c",d:1,q:"Посмотри подробности и события пода api-7f9.",ans:["kubectl describe pod api-7f9","k describe pod api-7f9","kubectl describe pods api-7f9"],hint:"kubectl describe ...",why:"Раздел Events внизу объясняет большинство проблем: ImagePullBackOff, Insufficient cpu, FailedMount, OOMKilling."},
 {t:"c",d:2,q:"Откати деплоймент api на предыдущую ревизию.",ans:["kubectl rollout undo deploy/api","kubectl rollout undo deployment/api","kubectl rollout undo deployment api"],hint:"rollout undo",why:"Deployment хранит историю ревизий. Сначала стабилизировать откатом, потом расследовать — правило инцидент-менеджмента."},
 {t:"q",d:3,q:"Что произойдёт, если задать limits, но не задать requests?",a:["Ничего, они одинаковые","Планировщик не знает, сколько ресурсов резервировать, и может переполнить ноду — поды начнут вытесняться","Под не запустится","Limits будут игнорироваться"],c:1,why:"requests — это про размещение, limits — про ограничение. Разные механизмы, оба нужны."},
 {t:"q",d:3,q:"Чем отличается превышение лимита CPU от превышения лимита памяти?",a:["Ничем","CPU — троттлинг (приложение тормозит), память — OOMKilled (контейнер убит немедленно)","CPU убивает под, память нет","Оба вызывают перезапуск"],c:1,why:"Отсюда практика: память ставят с запасом обязательно, а слишком жёсткий CPU-лимит незаметно замедляет сервис без единой ошибки в логах."},
 {t:"q",d:4,q:"Deployment создан, но поды не появляются, и в <code>describe</code> у Deployment ошибка про selector. Что проверить?",a:["Образ","Совпадение <code>spec.selector.matchLabels</code> и <code>spec.template.metadata.labels</code>","Число реплик","Namespace"],c:1,why:"Deployment находит свои поды по лейблам. Несовпадение делает конструкцию бессмысленной, и API это отклоняет."},
 {t:"q",d:5,q:"<b>Инцидент.</b> После деплоя часть пользователей получает 502, хотя все поды в статусе Running. Стратегия RollingUpdate с <code>maxUnavailable: 25%</code>, readinessProbe не настроен. Что произошло?",a:["Не хватает реплик","Без readiness трафик пошёл в поды, которые запустились, но ещё не готовы; плюс старые поды уже убрали — нужны readinessProbe и maxUnavailable: 0","Ошибка в образе","Проблема с Ingress"],c:1,why:"Running означает лишь «процесс стартовал». Готовность к трафику определяет readiness — без неё rolling update гарантированно роняет часть запросов."}]},

{id:"k3",t:"Service, Ingress и сеть",goal:"Довести запрос снаружи до нужного пода",
 cards:[
 {h:"Путь трафика",b:"<pre>пользователь → DNS → внешний балансировщик\n  → Ingress Controller (nginx/traefik)\n  → Service (ClusterIP)\n  → Pod</pre><p><b>Ingress</b> — это только правила маршрутизации. Исполняет их <b>Ingress Controller</b>, который надо установить отдельно. Создать Ingress без контроллера — всё равно что написать конфиг nginx, не запустив nginx.</p>"},
 {h:"Типы Service",b:"<div class='tw'><table><tr><th>тип</th><th>что даёт</th></tr><tr><td><b>ClusterIP</b></td><td>внутренний адрес, доступен только внутри кластера (по умолчанию)</td></tr><tr><td><b>NodePort</b></td><td>порт на каждой ноде — обычно для отладки</td></tr><tr><td><b>LoadBalancer</b></td><td>внешний балансировщик облака</td></tr><tr><td><b>Headless</b> (clusterIP: None)</td><td>без единого адреса: DNS отдаёт IP всех подов, нужен StatefulSet</td></tr></table></div><p>Внутри кластера обращаются по DNS-имени: <code>api.prod.svc.cluster.local</code> или коротко <code>api</code> в том же неймспейсе.</p>"},
 {h:"Как Service находит поды",b:"<pre>kind: Service\nspec:\n  selector:\n    app: api        # ← должно совпадать с лейблами подов\n  ports:\n    - port: 80        # порт Service\n      targetPort: 8080  # порт контейнера</pre><p>Связь идёт <b>только по лейблам</b>. Результат виден в объекте Endpoints:</p><pre>kubectl get endpoints api</pre><p><b>Пустой список endpoints</b> — однозначный диагноз. Три причины по частоте:</p><ol><li>selector не совпадает с лейблами подов</li><li>поды не проходят readinessProbe (Running, но не Ready — Service их исключает)</li><li><code>targetPort</code> не совпадает с портом, который слушает контейнер</li></ol>"},
 {h:"Ingress",b:"<pre>kind: Ingress\nmetadata:\n  annotations:\n    cert-manager.io/cluster-issuer: letsencrypt\nspec:\n  ingressClassName: nginx\n  tls:\n    - hosts: [shop.ru]\n      secretName: shop-tls\n  rules:\n    - host: shop.ru\n      http:\n        paths:\n          - path: /api\n            pathType: Prefix\n            backend:\n              service: { name: api, port: { number: 80 } }</pre><p>TLS-сертификаты обычно выпускает <b>cert-manager</b> автоматически. Тонкие настройки прокси (таймауты, размер тела) задаются аннотациями конкретного контроллера.</p>"},
 {h:"Сетевая модель",b:"<ul><li>у каждого пода свой IP, поды видят друг друга напрямую без NAT</li><li>сеть реализует <b>CNI</b>-плагин (Calico, Cilium, Flannel)</li><li>по умолчанию <b>разрешено всё</b>: любой под может обратиться к любому</li><li><b>NetworkPolicy</b> вводит ограничения, но требует поддерживающего CNI — с Flannel в базовой конфигурации политики просто не работают</li></ul>"}],
 ch:[
 {t:"c",d:1,q:"Проверь endpoints сервисов в текущем неймспейсе.",ans:["kubectl get endpoints","kubectl get ep"],hint:"сокращение ep",why:"Пустой список endpoints мгновенно объясняет, почему Service никуда не ведёт."},
 {t:"q",d:2,q:"Зачем нужен Service, если у пода есть IP?",a:["Для красоты","IP пода меняется при пересоздании; Service даёт стабильное DNS-имя и балансировку по лейблам","Service ускоряет сеть","Это одно и то же"],c:1,why:"Поды эфемерны by design. Обращение по IP пода ломается при первом же перезапуске."},
 {t:"q",d:3,q:"Создан Ingress, но домен не отвечает, и в кластере не установлен ingress-контроллер. Почему не работает?",a:["Нужно подождать","Ingress — только правила; исполнять их некому, пока не установлен контроллер","Ошибка в DNS","Не выпущен сертификат"],c:1,why:"Аналогия: написать конфиг nginx и не запустить nginx. В managed-кластерах контроллер часто ставится отдельным аддоном."},
 {t:"q",d:4,q:"Поды Running и Ready 1/1, но <code>kubectl get endpoints</code> пуст. Что проверить первым?",a:["Логи приложения","Совпадение selector в Service с лейблами подов","Ресурсы ноды","Версию кластера"],c:1,why:"Если поды готовы, а endpoints пусты — почти всегда рассинхрон лейблов. Второй кандидат: targetPort не совпадает с портом контейнера."},
 {t:"q",d:4,q:"Нужно ограничить доступ к подам базы так, чтобы к ней ходило только приложение. Чем?",a:["Namespace","NetworkPolicy (при поддерживающем CNI)","Ingress","ResourceQuota"],c:1,why:"По умолчанию сеть плоская. Типовая политика: deny all в неймспейсе, затем разрешить трафик от подов с определённым лейблом."},
 {t:"q",d:5,q:"<b>Инцидент.</b> После выкатки v2 приложение работает (логи чистые, поды Ready), но через Ingress приходит 503 «no healthy upstream». В Deployment лейблы сменили на <code>app: api-v2</code>, Service остался с <code>selector: app: api</code>. Что делать?",a:["Перезапустить ingress-контроллер","Привести selector Service в соответствие с лейблами подов и применить — endpoints наполнятся, 503 исчезнет","Откатить приложение","Пересоздать Ingress"],c:1,why:"Переименование лейблов при выкатке — типовая ловушка. Урок: лейблы, по которым связываются объекты, менять нельзя без одновременного обновления всех ссылающихся на них ресурсов."}]},

{id:"k4",t:"Конфигурация и секреты",goal:"Отделить настройки от образа",
 cards:[
 {h:"ConfigMap",b:"<pre>kind: ConfigMap\nmetadata: { name: app-config }\ndata:\n  LOG_LEVEL: info\n  app.yaml: |\n    server:\n      port: 8080</pre><p>Два способа доставки в под:</p><pre>envFrom:\n  - configMapRef: { name: app-config }\n\nvolumeMounts:\n  - name: cfg\n    mountPath: /etc/app\nvolumes:\n  - name: cfg\n    configMap: { name: app-config }</pre><p><b>Важное различие:</b> переменные окружения фиксируются при старте пода — изменение ConfigMap на них не влияет до перезапуска. Смонтированные файлы обновляются автоматически (с задержкой), но приложение должно уметь их перечитывать.</p>"},
 {h:"Secret — это не шифрование",b:"<p>Secret хранится в etcd в кодировке <b>base64</b>, а не в зашифрованном виде. Base64 — это не защита, а способ представления бинарных данных.</p><p>Чтобы секреты действительно были секретами, нужно:</p><ul><li>шифрование etcd at rest</li><li>RBAC: доступ к секретам только тем, кому положено</li><li>внешний менеджер: Vault, External Secrets Operator, Sealed Secrets</li><li>не логировать содержимое и не выводить в манифестах в git</li></ul><p>Это классический вопрос-ловушка на собеседовании: правильный ответ показывает зрелость в безопасности.</p>"},
 {h:"Секреты и GitOps",b:"<p>Если желаемое состояние живёт в git, секреты туда класть нельзя. Два рабочих подхода:</p><ul><li><b>Sealed Secrets / SOPS</b> — в git лежит зашифрованное значение, расшифровать может только кластер</li><li><b>External Secrets Operator</b> — в git лежит только ссылка на секрет в Vault или менеджере облака, значение подтягивается в рантайме</li></ul><p>Второй подход обычно предпочтительнее: ротация происходит в менеджере, а манифесты вообще не трогают.</p>"},
 {h:"Перезапуск при изменении конфигурации",b:"<p>Изменил ConfigMap — поды продолжают работать со старыми переменными. Способы:</p><pre>kubectl rollout restart deploy/api</pre><p>Или добавить в аннотации пода хеш конфигурации: тогда любое изменение ConfigMap меняет шаблон пода и вызывает штатный rolling update. Именно так делает Helm с <code>checksum/config</code>.</p>"}],
 ch:[
 {t:"q",d:1,q:"Secret в Kubernetes — это шифрование?",a:["Да, AES","Нет, по умолчанию base64: нужны шифрование etcd, RBAC и внешний менеджер секретов","Да, RSA","Секретов в Kubernetes нет"],c:1,why:"Частый вопрос-ловушка. Base64 читается в одну команду — это кодирование, а не защита."},
 {t:"c",d:2,q:"Перезапусти поды деплоймента api, чтобы они подхватили новую конфигурацию.",ans:["kubectl rollout restart deploy/api","kubectl rollout restart deployment/api","kubectl rollout restart deployment api"],hint:"rollout restart",why:"Штатный rolling restart без изменения манифеста: старые поды заменяются новыми по одному, без даунтайма."},
 {t:"q",d:3,q:"Ты изменил ConfigMap, но приложение продолжает работать со старым значением. Почему?",a:["ConfigMap не применился","Значения переданы через env: они фиксируются при старте пода и не обновляются на лету","Нужно подождать час","Ошибка в кластере"],c:1,why:"Смонтированные файлы обновляются автоматически, переменные окружения — нет. Отсюда практика с хешем конфигурации в аннотациях пода."},
 {t:"q",d:4,q:"Кластер под управлением GitOps. Где хранить пароль базы?",a:["Прямо в манифесте в git","Sealed Secrets/SOPS (зашифрованное значение в git) или External Secrets (в git только ссылка на Vault)","В ConfigMap","В образе приложения"],c:1,why:"Иначе весь смысл «всё состояние в git» упирается в утечку. External Secrets удобнее для ротации: меняешь в менеджере, манифесты не трогаешь."},
 {t:"q",d:4,q:"Разработчик просит выдать доступ на чтение секретов всего кластера «для отладки». Что предложить?",a:["Выдать, это удобно","Role только на нужный неймспейс и только на нужные объекты; для отладки достаточно логов и describe — доступ к секретам даёт учётные данные ко всем системам","Отказать без объяснений","Выдать временно на день"],c:1,why:"Секреты — это учётные данные к БД, платёжным системам и облаку. Наименьшие привилегии здесь не формальность, а граница ущерба при компрометации."},
 {t:"q",d:5,q:"<b>Инцидент.</b> Секрет с паролем БД случайно закоммитили в манифест в git, репозиторий приватный. Коллега предлагает удалить строку следующим коммитом и забыть. Что ответить?",a:["Согласиться, репозиторий же приватный","Пароль в истории считается скомпрометированным: сначала ротация в БД и обновление секрета в кластере, затем чистка истории и переход на Sealed Secrets или External Secrets","Достаточно закрыть доступ к репозиторию","Переименовать файл"],c:1,why:"Приватность репозитория не отменяет утечки: доступ есть у всех участников, форков и систем CI. Порядок всегда один — сначала смена секрета."}]},

{id:"k5",t:"Диагностика и жизненный цикл пода",goal:"Понять, почему под не работает, за три команды",
 cards:[
 {h:"Статусы и что они значат",b:"<div class='tw'><table><tr><th>статус</th><th>смысл</th><th>куда смотреть</th></tr><tr><td><b>Pending</b></td><td>не размещён на ноде</td><td>describe → Events: не хватает ресурсов, taints, нет PV</td></tr><tr><td><b>ContainerCreating</b></td><td>создаётся</td><td>монтирование томов, секретов</td></tr><tr><td><b>ImagePullBackOff</b></td><td>образ не скачивается</td><td>имя и тег, imagePullSecrets</td></tr><tr><td><b>CrashLoopBackOff</b></td><td>падает и перезапускается</td><td>logs --previous</td></tr><tr><td><b>OOMKilled</b></td><td>убит по превышению памяти</td><td>limits и потребление</td></tr><tr><td><b>Running, но 0/1 Ready</b></td><td>не проходит readiness</td><td>probe и здоровье приложения</td></tr></table></div><p><b>Pending</b> — проблема планирования (кластер), <b>CrashLoop</b> — проблема приложения. Это первая развилка диагностики.</p>"},
 {h:"Три пробы",b:"<div class='tw'><table><tr><th>проба</th><th>вопрос</th><th>последствие провала</th></tr><tr><td><b>readiness</b></td><td>готов принимать трафик?</td><td>под исключается из Service</td></tr><tr><td><b>liveness</b></td><td>жив?</td><td>контейнер перезапускается</td></tr><tr><td><b>startup</b></td><td>успел стартовать?</td><td>откладывает liveness</td></tr></table></div><p><b>Ошибка новичка:</b> liveness с коротким таймаутом на медленно стартующем приложении — бесконечный рестарт-луп. Приложение не успевает подняться, liveness его убивает, цикл повторяется.</p><p>Ещё опаснее: liveness, проверяющий доступность базы. Упала база — Kubernetes начинает перезапускать все поды приложения, добавляя нагрузку к аварии.</p>"},
 {h:"Порядок остановки пода",b:"<ol><li>под помечается Terminating</li><li>удаляется из endpoints (перестаёт получать трафик)</li><li>в контейнер отправляется SIGTERM</li><li>ждём <code>terminationGracePeriodSeconds</code> (по умолчанию 30)</li><li>SIGKILL</li></ol><p>Шаги 2 и 3 происходят <b>параллельно</b>, поэтому под может получить последние запросы уже после SIGTERM. Отсюда приём:</p><pre>lifecycle:\n  preStop:\n    exec: { command: [\"sleep\", \"5\"] }</pre><p>Пауза даёт балансировщику время убрать под из ротации до начала остановки.</p>"},
 {h:"Init-контейнеры, Job и CronJob",b:"<pre>initContainers:\n  - name: wait-db\n    image: busybox\n    command: ['sh','-c','until nc -z db 5432; do sleep 2; done']</pre><p>Init-контейнеры отрабатывают по очереди <b>до</b> основного: миграции, ожидание зависимостей, подготовка файлов.</p><pre>kind: CronJob\nspec:\n  schedule: \"0 3 * * *\"\n  concurrencyPolicy: Forbid\n  jobTemplate:\n    spec:\n      backoffLimit: 3</pre><p><code>concurrencyPolicy: Forbid</code> не даст запуститься второму экземпляру поверх зависшего первого.</p>"}],
 ch:[
 {t:"c",d:1,q:"Прочитай логи предыдущего, упавшего контейнера пода api-7f9.",ans:["kubectl logs api-7f9 --previous","kubectl logs -p api-7f9","kubectl logs api-7f9 -p"],hint:"флаг previous",why:"Обычный logs покажет свежезапущенный контейнер, где ещё ничего не произошло. Причина падения — в предыдущем."},
 {t:"q",d:2,q:"Под в статусе <code>Pending</code>. Куда смотреть?",a:["В логи приложения","В <code>describe pod</code> → Events: не хватает ресурсов, taints или нет подходящего тома","В Ingress","В образ"],c:1,why:"Pending означает, что под ещё не размещён на ноде — приложение даже не запускалось, логов нет по определению."},
 {t:"q",d:3,q:"Под в <code>ImagePullBackOff</code>. Что проверить в первую очередь?",a:["Ресурсы ноды","Имя и тег образа, доступность реестра и наличие imagePullSecrets","Пробы","Сеть подов"],c:1,why:"Чаще всего опечатка в теге или отсутствие секрета для приватного реестра. Точная причина видна в Events."},
 {t:"q",d:4,q:"Приложение стартует 40 секунд. Какая проба спасёт от бесконечного рестарт-лупа?",a:["liveness с коротким периодом","startupProbe: она откладывает liveness до успешного старта","только readiness","никакая, нужно ускорить приложение"],c:1,why:"Readiness при этом держит трафик до готовности, а startup защищает от преждевременного убийства медленно поднимающегося приложения."},
 {t:"q",d:4,q:"Почему опасно проверять доступность базы данных в liveness-пробе?",a:["Это медленно","Упала база — Kubernetes начнёт перезапускать все поды приложения, усугубляя аварию; зависимости проверяют в readiness","Проба не поддерживает TCP","Нагружает базу"],c:1,why:"Liveness отвечает на вопрос «процесс исправен?», а не «все ли зависимости живы». Перезапуск не чинит чужую базу, но добавляет шторм соединений."},
 {t:"q",d:5,q:"<b>Инцидент.</b> При каждом деплое теряется около сотни запросов, хотя readiness настроен и <code>maxUnavailable: 0</code>. Что ещё нужно?",a:["Больше реплик","Корректная обработка SIGTERM в приложении и preStop-пауза: удаление из endpoints и остановка идут параллельно, и под успевает получить запросы после начала завершения","Увеличить таймауты Ingress","Перейти на Recreate"],c:1,why:"Readiness решает проблему на старте, graceful shutdown — на остановке. Для деплоя без потерь нужны оба конца."}]},

{id:"k6",t:"Хранилище и StatefulSet",goal:"Запускать данные в кластере осознанно",
 cards:[
 {h:"PV, PVC, StorageClass",b:"<div class='tw'><table><tr><th>объект</th><th>роль</th></tr><tr><td><b>PersistentVolumeClaim</b></td><td>заявка пода: «нужно 20Gi с таким режимом доступа»</td></tr><tr><td><b>StorageClass</b></td><td>как создать такой том: тип диска у провайдера</td></tr><tr><td><b>PersistentVolume</b></td><td>сам созданный том</td></tr></table></div><pre>volumeClaimTemplates:\n  - metadata: { name: data }\n    spec:\n      accessModes: [ReadWriteOnce]\n      storageClassName: fast-ssd\n      resources: { requests: { storage: 20Gi } }</pre><p>Режимы доступа: <b>ReadWriteOnce</b> — том монтируется к одной ноде (обычные диски), <b>ReadWriteMany</b> — к нескольким (NFS, CephFS; дороже и медленнее).</p>"},
 {h:"emptyDir и потеря данных",b:"<p><code>emptyDir</code> живёт ровно столько, сколько под. Пересоздался под — данные исчезли. Это нормальный выбор для кэша и временных файлов и катастрофический — для базы.</p><p>Симптом «данные пропали после обновления» почти всегда означает, что тома не было вовсе.</p>"},
 {h:"StatefulSet",b:"<p>Что он даёт в отличие от Deployment:</p><ul><li><b>стабильные имена</b>: <code>db-0</code>, <code>db-1</code> — и после пересоздания имя то же</li><li><b>свой том</b> у каждой реплики, переживающий пересоздание пода</li><li><b>упорядоченный</b> запуск и остановка</li><li>обычно рядом headless Service для адресации конкретных экземпляров</li></ul><p>Это нужно кворумным системам: узлы должны знать друг друга по именам и не терять свои данные.</p>"},
 {h:"Взрослый вопрос: нужна ли БД в кластере",b:"<p>Managed-база у провайдера берёт на себя бэкапы, репликацию, обновления, мониторинг и ночные дежурства. Kubernetes ничего из этого не делает за тебя: оператор БД — отдельный продукт со своей сложностью.</p><p>Честный ответ на собеседовании: <b>по умолчанию managed</b>, в кластер — только при явном обосновании (требования по данным, стоимость на масштабе, наличие экспертизы и оператора). Это признак зрелости, а не незнания.</p>"}],
 ch:[
 {t:"q",d:1,q:"Под с базой пересоздался — данные пропали. Чего не хватало?",a:["Реплик","PersistentVolumeClaim: без тома данные лежали в эфемерном слое","Ingress","Пробы готовности"],c:1,why:"emptyDir и слой контейнера живут ровно столько, сколько под. Для данных нужен PVC с подходящим StorageClass."},
 {t:"q",d:2,q:"Что означает режим доступа ReadWriteOnce?",a:["Только чтение","Том монтируется на запись к одной ноде одновременно","Можно записать только один раз","Доступен только root"],c:1,why:"Для нескольких пишущих подов нужен ReadWriteMany (NFS/CephFS) — заметно дороже и медленнее, поэтому его берут только при реальной необходимости."},
 {t:"q",d:3,q:"Почему для кластера PostgreSQL берут StatefulSet, а не Deployment?",a:["StatefulSet быстрее","Нужны стабильные имена подов, персональные тома и предсказуемый порядок запуска — на этом строится репликация","Deployment не умеет тома","Так требует Helm"],c:1,why:"db-0 всегда db-0 и всегда со своим диском. Deployment создаёт взаимозаменяемые поды со случайными именами — для кворума это не годится."},
 {t:"q",d:4,q:"Что произойдёт при удалении StatefulSet с базой?",a:["Тома удалятся вместе с ним","PVC по умолчанию сохраняются — данные остаются, и при пересоздании StatefulSet поды подключатся к тем же томам","Данные переедут на другую ноду","Кластер откажет в удалении"],c:1,why:"Это защита от случайной потери данных. Обратная сторона — забытые PVC копятся и стоят денег: их чистят осознанно."},
 {t:"q",d:4,q:"Когда запуск базы в Kubernetes — оправданное решение?",a:["Всегда, это современно","Когда есть экспертиза, зрелый оператор и требования, которых managed не закрывает","Никогда","Когда нужно сэкономить"],c:1,why:"Ответ «по умолчанию managed, в кластер — с обоснованием» показывает, что ты считаешь стоимость эксплуатации, а не только стоимость ресурсов."},
 {t:"q",d:5,q:"<b>Инцидент.</b> Кластер обновляли, ноду с подом <code>db-0</code> вывели из эксплуатации. Под завис в Pending с событием «volume node affinity conflict». Что произошло?",a:["Том повреждён","Диск ReadWriteOnce привязан к зоне или ноде, где был создан, а под пытаются запустить в другой — нужно планировать под в ту же зону или использовать репликацию на уровне БД","Не хватает памяти","Ошибка StorageClass"],c:1,why:"Блочные диски облаков зональны. Отсюда правило: отказоустойчивость stateful-нагрузки обеспечивается репликацией данных, а не надеждой на переезд тома между зонами."}]},

{id:"k7",t:"Масштабирование и надёжность",goal:"Держать нагрузку и переживать обслуживание кластера",
 cards:[
 {h:"Горизонтальное масштабирование",b:"<pre>kubectl scale deploy/api --replicas=5\n\nkind: HorizontalPodAutoscaler\nspec:\n  scaleTargetRef: { kind: Deployment, name: api }\n  minReplicas: 2\n  maxReplicas: 10\n  metrics:\n    - type: Resource\n      resource:\n        name: cpu\n        target: { type: Utilization, averageUtilization: 70 }</pre><p><b>HPA считает утилизацию относительно <code>requests</code>.</b> Без requests автоскейлер не работает вовсе — это причина номер один, почему «HPA ничего не делает». Вторая — не установлен metrics-server.</p><p><b>Cluster Autoscaler</b> — другой уровень: добавляет ноды, когда поды не помещаются.</p>"},
 {h:"Размещение подов",b:"<div class='tw'><table><tr><th>механизм</th><th>задача</th></tr><tr><td><b>nodeSelector / affinity</b></td><td>разместить на подходящих нодах</td></tr><tr><td><b>podAntiAffinity</b></td><td>развести реплики по разным нодам</td></tr><tr><td><b>topologySpreadConstraints</b></td><td>равномерно распределить по зонам</td></tr><tr><td><b>taints / tolerations</b></td><td>зарезервировать ноды под особые нагрузки</td></tr></table></div><p>Три реплики на одной ноде не дают отказоустойчивости: нода упала — сервис лёг целиком. Anti-affinity превращает число реплик в реальную надёжность.</p>"},
 {h:"PodDisruptionBudget",b:"<pre>kind: PodDisruptionBudget\nspec:\n  minAvailable: 2\n  selector:\n    matchLabels: { app: api }</pre><p>PDB защищает от <b>добровольных</b> выселений: обновление нод, <code>kubectl drain</code>, работа автоскейлера. Kubernetes не выселит поды, если это нарушит бюджет.</p><p>Без PDB обслуживание кластера может одновременно снять все реплики сервиса. От аварийных отказов (упала нода) PDB не защищает — для этого нужны реплики и распределение по зонам.</p>"},
 {h:"Квоты неймспейса",b:"<pre>kind: ResourceQuota\nspec:\n  hard:\n    requests.cpu: \"10\"\n    requests.memory: 20Gi\n    persistentvolumeclaims: \"10\"\n\nkind: LimitRange\nspec:\n  limits:\n    - type: Container\n      default: { cpu: 500m, memory: 512Mi }\n      defaultRequest: { cpu: 100m, memory: 128Mi }</pre><p><b>ResourceQuota</b> ограничивает суммарное потребление неймспейса, <b>LimitRange</b> подставляет значения по умолчанию тем, кто их не указал. Вместе они не дают одной команде съесть кластер.</p>"}],
 ch:[
 {t:"c",d:1,q:"Увеличь число реплик деплоймента api до 5.",ans:["kubectl scale deploy/api --replicas=5","kubectl scale deployment/api --replicas=5","kubectl scale deployment api --replicas=5"],hint:"kubectl scale",why:"Быстро для инцидента. В GitOps итог всё равно фиксируют в манифесте, иначе следующая синхронизация вернёт прежнее значение."},
 {t:"q",d:2,q:"HPA настроен, но масштабирование не происходит. Самая частая причина?",a:["Мало нод","Не заданы <code>resources.requests</code> или не установлен metrics-server","Старая версия kubectl","Нет Ingress"],c:1,why:"HPA считает утилизацию как долю от requests. Нет requests — нет базы для расчёта, и автоскейлер молчит."},
 {t:"q",d:3,q:"Зачем нужен PodDisruptionBudget?",a:["Ограничить расходы","Гарантировать минимум доступных подов при плановых выселениях: drain, обновление нод, автоскейлинг","Ограничить CPU","Настроить сеть"],c:1,why:"Без PDB обновление узлов может одновременно снять все реплики. От аварийного отказа ноды он не спасает — это другая задача."},
 {t:"q",d:4,q:"Три реплики сервиса оказались на одной ноде. Чем это грозит и как исправить?",a:["Ничем, Kubernetes сам разберётся","Отказ ноды положит сервис целиком; нужно podAntiAffinity или topologySpreadConstraints для разнесения по нодам и зонам","Замедлится работа","Вырастет стоимость"],c:1,why:"Число реплик само по себе не даёт отказоустойчивости — важно, где они размещены. Планировщик по умолчанию не обязан их разносить."},
 {t:"q",d:4,q:"Как не дать одной команде занять ресурсы всего кластера?",a:["Договориться на встрече","ResourceQuota на неймспейс плюс LimitRange со значениями по умолчанию","Отдельный кластер на каждую команду","Ограничить число подов вручную"],c:1,why:"Квоты — это граница ответственности в общем кластере. LimitRange дополнительно страхует от подов вообще без указанных ресурсов."},
 {t:"q",d:5,q:"<b>Инцидент.</b> Во время планового обновления нод сервис на 4 минуты стал недоступен, хотя реплик было три. Что не было настроено?",a:["Автоскейлер","PodDisruptionBudget и распределение реплик по нодам: drain снял все три пода сразу, поскольку они стояли на одной ноде","Больше реплик","Ingress"],c:1,why:"Два независимых упущения складываются: без anti-affinity реплики оказались вместе, без PDB их разрешено выселить одновременно."}]},

{id:"k8",t:"Helm, GitOps и безопасность",goal:"Управлять релизами и не отдать кластер",
 cards:[
 {h:"Helm",b:"<pre>helm install api ./chart -f values-prod.yaml\nhelm upgrade api ./chart --set image.tag=1a2b3c4\nhelm rollback api 3\nhelm list\nhelm template ./chart -f values-prod.yaml   <span class='c'># посмотреть итоговые манифесты</span></pre><p><b>Chart</b> — шаблоны манифестов, <b>values</b> — параметры окружения. Один chart, разные values для stage и prod.</p><p><code>helm template</code> перед выкаткой — привычка того же рода, что <code>terraform plan</code>: сначала посмотреть, что получится.</p><p>Альтернатива — <b>Kustomize</b>: не шаблоны, а наложение патчей на базовые манифесты. Проще, когда различий между средами немного.</p>"},
 {h:"GitOps",b:"<p>Желаемое состояние хранится в git, агент (ArgoCD, Flux) непрерывно сравнивает кластер с репозиторием и устраняет расхождение.</p><ul><li>выкатка = merge в git, откат = <code>git revert</code></li><li>полный аудит: кто, когда и что изменил</li><li>ручной <code>kubectl apply</code> становится аномалией — агент вернёт состояние из git</li><li>у людей нет прямого доступа к прод-кластеру: права нужны только агенту</li></ul><p>Отсюда важное следствие: аварийный <code>kubectl scale</code> допустим для стабилизации, но результат обязательно фиксируется в репозитории.</p>"},
 {h:"RBAC",b:"<pre>kind: Role            # права внутри неймспейса\nrules:\n  - apiGroups: [\"\"]\n    resources: [\"pods\", \"pods/log\"]\n    verbs: [\"get\", \"list\"]\n---\nkind: RoleBinding     # кому эти права выдать</pre><p><b>Role</b> действует в пределах неймспейса, <b>ClusterRole</b> — на весь кластер. Раздача <code>cluster-admin</code> всем подряд — самая частая находка аудита.</p><pre>kubectl auth can-i delete pods --as dev@company.ru\nkubectl auth can-i --list --as system:serviceaccount:prod:api</pre><p>Проверять права нужно не по памяти, а этой командой.</p>"},
 {h:"securityContext и политики",b:"<pre>securityContext:\n  runAsNonRoot: true\n  runAsUser: 1000\n  readOnlyRootFilesystem: true\n  allowPrivilegeEscalation: false\n  capabilities: { drop: [\"ALL\"] }</pre><p>Пять строк, закрывающих большинство сценариев побега из контейнера. Для временных файлов монтируют emptyDir.</p><p>В зрелых кластерах это проверяется автоматически: <b>Pod Security Admission</b>, Kyverno или OPA Gatekeeper просто не примут манифест без них. Ручная дисциплина не масштабируется.</p>"}],
 ch:[
 {t:"q",d:1,q:"Что даёт Helm по сравнению с голым kubectl apply?",a:["Работает быстрее","Шаблоны с параметрами для разных сред, версионирование релизов и откат одной командой","Безопаснее по умолчанию","Он обязателен в Kubernetes"],c:1,why:"Альтернатива — Kustomize с наложением патчей. Выбор зависит от того, насколько среды различаются."},
 {t:"q",d:2,q:"Ты вручную выполнил <code>kubectl scale</code> на кластере под управлением ArgoCD. Что произойдёт?",a:["Изменение останется навсегда","Агент вернёт состояние из git, устранив расхождение","Кластер откажет в команде","ArgoCD остановится"],c:1,why:"Поэтому в GitOps любое постоянное изменение фиксируется в репозитории. Ручная команда допустима как аварийная мера с последующим коммитом."},
 {t:"q",d:3,q:"Разработчику нужен доступ только к логам подов одного неймспейса. Что выдать?",a:["cluster-admin","Role с verbs get/list на pods и pods/log плюс RoleBinding в этом неймспейсе","admin на кластер","Доступ к kubeconfig администратора"],c:1,why:"Проверить результат: kubectl auth can-i --as пользователь. Наименьшие привилегии — граница ущерба при компрометации учётки."},
 {t:"q",d:3,q:"Что делает <code>readOnlyRootFilesystem: true</code>?",a:["Ускоряет запуск","Запрещает запись в файловую систему контейнера — атакующему негде разместить полезную нагрузку","Экономит место","Отключает логи"],c:1,why:"Для временных файлов монтируют emptyDir. В защищённых кластерах это требование проверяется автоматически политиками."},
 {t:"q",d:4,q:"Как в GitOps откатить неудачный релиз?",a:["kubectl delete deployment","<code>git revert</code> коммита с изменением — агент приведёт кластер к предыдущему состоянию","Перезагрузить ноды","Восстановить etcd из бэкапа"],c:1,why:"История релизов равна истории git — в этом и главная ценность подхода: откат обычный, воспроизводимый и с аудитом."},
 {t:"q",d:5,q:"<b>Инцидент.</b> Аудит показал: у трёх сервисных аккаунтов есть cluster-admin, часть подов работает от root, NetworkPolicy нет вовсе. С чего начать исправление, чтобы снизить риск быстрее всего?",a:["Настроить NetworkPolicy для всех сервисов","Сначала убрать избыточные cluster-admin (наибольший риск при минимальных усилиях), затем привести поды к non-root через securityContext и политики допуска, и только потом заняться сетевой сегментацией","Обновить версию кластера","Включить аудит-логи и наблюдать"],c:1,why:"Приоритизация по соотношению «риск / стоимость исправления». Избыточные права — это мгновенный полный захват кластера при утечке одного токена."}]}
);
