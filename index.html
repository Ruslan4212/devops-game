   {t:"c",q:"Следи за файлом /var/log/app.log в реальном времени, пока коллега воспроизводит баг.",ans:["tail -f /var/log/app.log","tail -f app.log","tail --follow /var/log/app.log"],hint:"tail + флаг follow",why:"tail -f держит файл открытым и печатает новые строки. Для сжатых/ротируемых файлов надёжнее tail -F."},
   {t:"c",q:"Посчитай, сколько строк со словом ERROR в файле app.log.",ans:["grep -c error app.log","grep -c ERROR app.log","grep -ci error app.log","grep -c \"ERROR\" app.log"],hint:"у grep есть флаг count",why:"grep -c считает строки с совпадением (не сами совпадения). Альтернатива: grep ERROR app.log | wc -l."},
   {t:"q",q:"Что делает <code>cat access.log | grep 404 | wc -l</code>?",a:["Удаляет строки с 404","Считает строки, содержащие 404","Ищет файл 404","Показывает последние 404 строки"],c:1,why:"Конвейер: весь файл → фильтр по 404 → подсчёт строк. Классический разбор логов веб-сервера."},
   {t:"q",q:"Нужны 5 строк ДО и ПОСЛЕ каждой ошибки, чтобы понять контекст падения. Какой флаг?",a:["grep -v","grep -C5","grep -q","grep -l"],c:1,why:"-C5 = context, эквивалент -A5 -B5. -v наоборот исключает совпадения (тоже полезно: grep -v INFO)."}]},
 {id:"l3",t:"Права, процессы, ресурсы",goal:"Понять, кто съел диск и почему Permission denied",
  cards:[
   {h:"Права: rwx для трёх ролей",b:"<pre>-rw-r--r--  1 deploy www-data  app.conf\n ^^^ ^^^ ^^^\n  |   |   └── остальные: r--  (4)\n  |   └────── группа:    r--  (4)\n  └────────── владелец:  rw-  (6)</pre><p>r=4, w=2, x=1. Сложи — получишь цифру. <code>chmod 644</code> — владелец пишет, остальные читают. <code>chmod 600</code> — только владелец (так живут SSH-ключи, иначе ssh откажется работать).</p><pre>chmod 755 script.sh   <span class='c'># исполняемый скрипт</span>\nchown deploy:deploy f <span class='c'># сменить владельца</span></pre>"},
   {h:"Процессы",b:"<pre>ps aux | grep nginx   <span class='c'># найти процесс</span>\ntop / htop            <span class='c'># живой монитор</span>\nkill 1234             <span class='c'># попросить завершиться (SIGTERM)</span>\nkill -9 1234          <span class='c'># убить насмерть (SIGKILL)</span></pre><p>Всегда сначала обычный <code>kill</code>: процесс успеет закрыть файлы и соединения. <code>-9</code> — последнее средство.</p>"},
   {h:"Диск кончился — что делать",b:"<pre>df -h                 <span class='c'># сколько свободно на разделах</span>\ndu -sh /var/* | sort -h  <span class='c'># кто занимает место</span>\nfree -h               <span class='c'># память</span></pre><p>Классика: диск забит логами. И засада: если файл удалён, но процесс держит его открытым — место не вернётся, пока не рестартнёшь сервис (<code>lsof | grep deleted</code>)."}],
  ch:[
   {t:"c",q:"Диск на 100%. Первая команда, чтобы увидеть заполненность разделов в человекочитаемом виде.",ans:["df -h","df -h /","df --human-readable"],hint:"disk free + human",why:"df -h показывает разделы. Затем du -sh /var/* | sort -h находит виновника."},
   {t:"q",q:"<code>chmod 600 id_rsa</code> — что это значит?",a:["Читать и писать может только владелец","Все могут читать","Файл стал исполняемым","Владелец сменился"],c:0,why:"6 = rw для владельца, 0 и 0 — ничего остальным. SSH ОТКАЗЫВАЕТСЯ использовать приватный ключ с более широкими правами."},
   {t:"q",q:"Сервис не отвечает. <code>kill -9</code> сразу или сначала обычный <code>kill</code>?",a:["Сразу -9, быстрее","Сначала kill (SIGTERM), дать закрыться корректно","kill вообще нельзя","Только через reboot"],c:1,why:"SIGTERM даёт процессу сбросить буферы и закрыть соединения. SIGKILL нельзя перехватить — риск битых данных."},
   {t:"c",q:"Найди в списке процессов все процессы nginx.",ans:["ps aux | grep nginx","ps -ef | grep nginx","pgrep nginx","pgrep -a nginx"],hint:"ps aux и пайп",why:"ps aux | grep — рабочая лошадка. pgrep/pkill аккуратнее, но на собеседовании ждут именно ps aux | grep."}]},
 {id:"l4",t:"Bash-скрипты",goal:"Автоматизировать то, что делал руками",
  cards:[
   {h:"Скелет любого скрипта",b:"<pre>#!/bin/bash\nset -euo pipefail\n\nAPP_DIR=\"/opt/app\"\n\nif [ ! -d \"$APP_DIR\" ]; then\n  echo \"нет папки $APP_DIR\" >&2\n  exit 1\nfi\n\nfor f in \"$APP_DIR\"/*.log; do\n  echo \"обрабатываю $f\"\ndone</pre><p><code>set -e</code> — падать на первой ошибке, <code>-u</code> — ругаться на необъявленные переменные, <code>-o pipefail</code> — ловить ошибку внутри пайпа. Три слова, которые отличают скрипт инженера от скрипта студента.</p>"},
   {h:"Код возврата — язык автоматизации",b:"<p>Каждая команда возвращает число: <code>0</code> — успех, не ноль — ошибка. Проверить: <code>echo $?</code>.</p><p>На этом стоит ВСЁ: CI-пайплайн считает шаг упавшим, если код не 0. Healthcheck в Docker — то же самое.</p><pre>curl -fsS http://localhost/health || exit 1</pre>"}],
  ch:[
   {t:"f",q:"Допиши строку, которая заставит скрипт падать при первой ошибке, ругаться на пустые переменные и ловить ошибки в пайпах.",pre:"#!/bin/bash\n___",ans:["set -euo pipefail","set -eou pipefail","set -euo pipefail;"],hint:"set -e + u + o pipefail",why:"Без set -e скрипт весело продолжит выполняться после провала — и удалит не то, что нужно."},
   {t:"c",q:"Как узнать код возврата последней выполненной команды?",ans:["echo $?","echo \"$?\"","$?"],hint:"специальная переменная",why:"$? — 0 значит успех. Именно это читает CI, чтобы понять — упал шаг или нет."},
   {t:"q",q:"Что делает <code>curl -fsS http://localhost/health || exit 1</code>?",a:["Всегда выходит из скрипта","Если curl не вернул успех — выходит с ошибкой","Печатает health","Перезапускает сервис"],c:1,why:"|| срабатывает только при ненулевом коде. Это готовый healthcheck-паттерн для CI и Docker."},
   {t:"q",q:"Зачем в скрипте писать <code>\"$VAR\"</code> в кавычках, а не <code>$VAR</code>?",a:["Красивее","Чтобы пробелы и пустые значения не разорвали команду","Быстрее работает","Кавычки обязательны в bash"],c:1,why:"Без кавычек путь «/opt/my app» превратится в два аргумента, а пустая переменная — в исчезнувший аргумент. Классический баг деплой-скриптов."}]}],
 boss:{t:"Дежурство: сервер лёг",intro:"03:40. Алерт. Ты один. Пять вопросов — пять минут даунтайма. Три ошибки — постмортем с CTO.",
  ch:[
  {t:"q",q:"Первое действие при «сайт не открывается»?",a:["Перезагрузить сервер","Проверить, жив ли процесс и что в логах","Написать в чат разработчикам","Откатить последний релиз"],c:1,why:"Сначала собрать факты: ps/systemctl status + логи. Ребут стирает улики и часто не чинит причину."},
  {t:"c",q:"Покажи 100 последних строк лога nginx с ошибками.",ans:["tail -100 /var/log/nginx/error.log","tail -n 100 /var/log/nginx/error.log","tail -n100 /var/log/nginx/error.log"],hint:"tail -n",why:"tail -n 100 — стандарт. Дальше грепаешь по времени инцидента."},
  {t:"q",q:"<code>df -h</code> показывает /var 100%. Что делаешь?",a:["Удаляю всё из /var","Нахожу крупные файлы через du, чищу старые логи, настраиваю logrotate","Ставлю новый диск","Перезагружаюсь"],c:1,why:"Найти → почистить безопасное → устранить причину (ротация). Плюс проверить lsof | grep deleted."},
  {t:"q",q:"Процесс висит зомби и не отвечает на kill. Твои действия?",a:["kill -9 по PID","Ждать","Удалить бинарник","chmod 000"],c:0,why:"Если SIGTERM проигнорирован — SIGKILL. Зомби-процесс сам по себе не ест ресурсы, но его родитель может быть сломан."},
  {t:"q",q:"Тебя спрашивают: «как проверить, слушает ли приложение порт 8080?»",a:["ping localhost:8080","ss -tulpn | grep 8080","ls /proc/8080","df -h"],c:1,why:"ss -tulpn (или устаревший netstat -tulpn) показывает открытые сокеты и процесс. Обязательный вопрос на собеседовании."}]}},

{id:"net",n:"Сети и веб",ic:"◈",tag:"Почему «у меня не открывается»",
 desc:"Понять путь запроса от браузера до твоего процесса — и найти, где он рвётся.",
 miss:[
 {id:"n1",t:"Путь запроса",goal:"Что происходит между Enter и картинкой",
  cards:[
   {h:"Шесть шагов, которые надо уметь рассказать",b:"<ol><li>Браузер спрашивает DNS: какой IP у site.ru?</li><li>Открывает TCP-соединение на порт 443 (три рукопожатия SYN → SYN-ACK → ACK).</li><li>TLS-handshake: обмен сертификатами, шифрование.</li><li>Отправляет HTTP-запрос <code>GET / HTTP/1.1</code>.</li><li>Nginx/балансировщик принимает и проксирует на приложение.</li><li>Приложение отвечает, ответ идёт назад.</li></ol><p>Это <b>любимый вопрос собеседований</b>. Умей назвать шаг, на котором может сломаться.</p>"},
   {h:"Порты, которые надо знать наизусть",b:"<div class='tw'><table><tr><th>порт</th><th>что</th></tr><tr><td>22</td><td>SSH</td></tr><tr><td>80 / 443</td><td>HTTP / HTTPS</td></tr><tr><td>53</td><td>DNS</td></tr><tr><td>5432</td><td>PostgreSQL</td></tr><tr><td>3306</td><td>MySQL</td></tr><tr><td>6379</td><td>Redis</td></tr><tr><td>9090 / 3000</td><td>Prometheus / Grafana</td></tr></table></div>"}],
  ch:[
   {t:"o",q:"Расставь шаги открытия https-сайта в правильном порядке.",items:["DNS-резолв имени в IP","TCP-соединение (3-way handshake)","TLS-handshake","HTTP-запрос GET /","Ответ от приложения"],why:"Эту цепочку у тебя спросят почти на каждом собеседовании. Она же — план диагностики: dig → telnet/nc → openssl s_client → curl."},
   {t:"q",q:"На каком порту по умолчанию слушает PostgreSQL?",a:["3306","5432","6379","8080"],c:1,why:"5432 — Postgres, 3306 — MySQL, 6379 — Redis. Эти три надо помнить рефлекторно."},
   {t:"q",q:"Сайт не открывается, но <code>ping site.ru</code> проходит. Где скорее всего проблема?",a:["DNS","Сеть до сервера","Приложение или веб-сервер на этом хосте","Кабель"],c:2,why:"Ping = ICMP до хоста, значит DNS и маршрут в порядке. Дальше проверяем порт (ss/nc) и логи веб-сервера."}]},
 {id:"n2",t:"DNS и curl",goal:"Диагностировать руками, а не «попробуй перезагрузить»",
  cards:[
   {h:"Типы записей",b:"<ul><li><b>A</b> — имя → IPv4. <b>AAAA</b> — IPv6.</li><li><b>CNAME</b> — псевдоним на другое имя.</li><li><b>MX</b> — почта. <b>TXT</b> — произвольный текст (SPF, верификация).</li><li><b>NS</b> — какие серверы отвечают за зону.</li></ul><pre>dig site.ru A +short\ndig @8.8.8.8 site.ru       <span class='c'># спросить конкретный резолвер</span>\nnslookup site.ru</pre><p><b>TTL</b> — сколько секунд ответ кэшируется. Меняешь IP перед миграцией — заранее снижай TTL до 60.</p>"},
   {h:"curl — швейцарский нож",b:"<pre>curl -I https://site.ru          <span class='c'># только заголовки</span>\ncurl -v https://site.ru          <span class='c'># подробно, видно TLS</span>\ncurl -L site.ru                  <span class='c'># идти по редиректам</span>\ncurl -X POST -d '{\"a\":1}' \\\n  -H 'Content-Type: application/json' url\ncurl -o /dev/null -s -w '%{http_code}\\n' url</pre>"},
   {h:"Коды ответов как диагноз",b:"<ul><li><b>200</b> ок · <b>301/302</b> редирект</li><li><b>400</b> кривой запрос · <b>401</b> не авторизован · <b>403</b> запрещено · <b>404</b> нет такого</li><li><b>500</b> упало приложение · <b>502</b> бэкенд не ответил проксe · <b>503</b> сервис недоступен/перегружен · <b>504</b> бэкенд не успел (таймаут)</li></ul><p><b>502 vs 504</b> — любимый вопрос. 502: бэкенд отдал мусор или умер. 504: бэкенд жив, но слишком медленный.</p>"}],
  ch:[
   {t:"c",q:"Узнай IPv4-адрес домена example.com максимально коротким выводом.",ans:["dig example.com a +short","dig example.com +short","dig +short example.com","dig +short example.com a"],hint:"dig ... +short",why:"+short убирает всё лишнее. Для проверки конкретного резолвера: dig @1.1.1.1 example.com +short."},
   {t:"c",q:"Проверь только HTTP-заголовки ответа https://site.ru, не скачивая тело.",ans:["curl -i https://site.ru","curl -i site.ru","curl --head https://site.ru","curl -i https://site.ru/"],hint:"заглавная I",why:"curl -I делает HEAD-запрос. Быстрый способ увидеть код, редиректы и заголовки кэша.",ansNorm:true},
   {t:"q",q:"Nginx отдаёт 502 Bad Gateway. Что это значит?",a:["Клиент прислал плохой запрос","Апстрим (приложение) недоступен или вернул мусор","Слишком много запросов","Проблема с сертификатом"],c:1,why:"502 — прокси не смог получить валидный ответ от бэкенда. Смотри: жив ли процесс, тот ли порт/сокет в upstream."},
   {t:"q",q:"А 504 Gateway Timeout?",a:["Бэкенд не ответил за отведённое время","Нет DNS-записи","Кончилось место","Неверный пароль"],c:0,why:"Бэкенд жив, но медленный: тяжёлый SQL, залипшие соединения. Лечится не увеличением proxy_read_timeout, а поиском причины."}]},
 {id:"n3",t:"Nginx и TLS",goal:"Поставить дверь перед приложением",
  cards:[
   {h:"Reverse proxy — зачем",b:"<p>Приложение слушает 3000 на localhost. Nginx стоит на 80/443 и: терминирует TLS, отдаёт статику, балансирует между копиями, ограничивает скорость, пишет access-логи.</p><pre>server {\n  listen 443 ssl;\n  server_name site.ru;\n  ssl_certificate     /etc/letsencrypt/live/site.ru/fullchain.pem;\n  ssl_certificate_key /etc/letsencrypt/live/site.ru/privkey.pem;\n\n  location / {\n    proxy_pass http://127.0.0.1:3000;\n    proxy_set_header Host $host;\n    proxy_set_header X-Real-IP $remote_addr;\n  }\n}</pre>"},
   {h:"Не сломай прод",b:"<pre>nginx -t                 <span class='c'># проверить конфиг</span>\nsystemctl reload nginx   <span class='c'># применить БЕЗ разрыва соединений</span>\nsystemctl restart nginx  <span class='c'># жёстко, соединения рвутся</span></pre><p>Правило: <b>всегда</b> <code>nginx -t</code> перед reload. Иначе получишь упавший сервис и очень плохое утро.</p>"}],
  ch:[
   {t:"c",q:"Проверь синтаксис конфигурации nginx перед применением.",ans:["nginx -t","sudo nginx -t","nginx -T"],hint:"одна буква",why:"nginx -t парсит конфиг и говорит, где ошибка. Без этого reload может убить сервис."},
   {t:"q",q:"reload или restart, если нужно применить новый конфиг без обрыва пользователей?",a:["restart","reload","stop + start","kill -9"],c:1,why:"reload поднимает новые воркеры с новым конфигом, старые дорабатывают текущие запросы. Zero downtime."},
   {t:"f",q:"Допиши директиву, которая передаёт запрос на приложение, слушающее localhost:3000.",pre:"location / {\n  ___ http://127.0.0.1:3000;\n}",ans:["proxy_pass"],hint:"proxy_...",why:"proxy_pass — ядро reverse proxy. Не забудь proxy_set_header Host — иначе приложение увидит неверный домен."},
   {t:"q",q:"Что означает «терминация TLS на балансировщике»?",a:["TLS расшифровывается на балансировщике, дальше идёт HTTP","Сертификат удаляется","Соединение обрывается","TLS запрещён"],c:0,why:"Классическая схема: сертификат один — на LB, внутренняя сеть доверенная. Минус: трафик внутри не шифрован (лечится mTLS/service mesh)."}]},
 {id:"n4",t:"SSH и доступ",goal:"Заходить безопасно и не терять ключи",
  cards:[
   {h:"Ключи вместо паролей",b:"<pre>ssh-keygen -t ed25519 -C \"me@work\"\nssh-copy-id user@server\nssh -i ~/.ssh/id_ed25519 user@server\nssh -p 2222 user@server</pre><p>Приватный ключ не покидает твою машину. Публичный лежит в <code>~/.ssh/authorized_keys</code> на сервере. Права: <code>700</code> на <code>.ssh</code>, <code>600</code> на ключ.</p>"},
   {h:"Проброс портов — суперспособность",b:"<pre><span class='c'># локальный порт 5433 → БД на удалённом сервере</span>\nssh -L 5433:localhost:5432 user@server</pre><p>Теперь <code>psql -h localhost -p 5433</code> с твоего ноутбука ходит в закрытую БД через SSH-туннель. Спасает, когда БД не смотрит в интернет (а она и не должна)."},
   {h:"~/.ssh/config",b:"<pre>Host prod\n  HostName 10.0.1.20\n  User deploy\n  Port 2222\n  IdentityFile ~/.ssh/prod_ed25519</pre><p>Теперь просто <code>ssh prod</code>.</p>"}],
  ch:[
   {t:"c",q:"Сгенерируй современный SSH-ключ типа ed25519.",ans:["ssh-keygen -t ed25519","ssh-keygen -t ed25519 -c \"\"","ssh-keygen ed25519"],hint:"ssh-keygen -t ...",why:"ed25519 короче и надёжнее RSA-2048. RSA оставляют только для старых систем (тогда -t rsa -b 4096)."},
   {t:"q",q:"Что должно лежать на сервере в ~/.ssh/authorized_keys?",a:["Приватный ключ","Публичный ключ","Пароль","Сертификат TLS"],c:1,why:"Приватный ключ НИКОГДА не уезжает с твоей машины. Если он утёк — считай, доступ скомпрометирован."},
   {t:"q",q:"БД слушает только 127.0.0.1 на проде. Как подключиться с ноутбука без открытия порта наружу?",a:["Открыть 5432 в firewall","SSH-туннель: ssh -L 5433:localhost:5432","Отключить firewall","Через ping"],c:1,why:"Проброс порта через SSH — безопасный доступ без изменения периметра. Обязательно знать на собеседовании."}]}],
 boss:{t:"«У клиентов не открывается сайт»",intro:"Поддержка эскалирует. Твоя очередь. Диагностируй по цепочке.",
  ch:[
  {t:"q",q:"С чего начинаешь диагностику недоступности?",a:["Перезапуск приложения","Идти по цепочке: DNS → TCP-порт → TLS → HTTP-код → логи","Написать разработчикам","Откатить релиз"],c:1,why:"Системность важнее скорости. Разделяй пополам: где именно рвётся цепочка."},
  {t:"c",q:"Проверь, резолвится ли домен shop.ru (короткий вывод).",ans:["dig shop.ru +short","dig +short shop.ru","dig shop.ru a +short","nslookup shop.ru"],hint:"dig +short",why:"Нет ответа → проблема в DNS-зоне или у регистратора, дальше идти бессмысленно."},
  {t:"q",q:"DNS ок, порт 443 открыт, curl отдаёт 502. Где проблема?",a:["В DNS","В бэкенде за nginx","В сертификате","У клиента"],c:1,why:"Nginx работает, но апстрим мёртв. Проверяем процесс приложения, порт/сокет, его логи."},
  {t:"c",q:"Посмотри, какие порты слушаются и каким процессом.",ans:["ss -tulpn","ss -tulnp","netstat -tulpn","sudo ss -tulpn","ss -tulpn | grep listen"],hint:"ss -tulpn",why:"t=tcp, u=udp, l=listening, p=process, n=числовые порты. Одна из самых частых команд на дежурстве."},
  {t:"q",q:"Браузер ругается на сертификат, curl -v пишет «certificate has expired». Что делать?",a:["Игнорировать","Перевыпустить/продлить сертификат и проверить автопродление certbot","Отключить HTTPS","Сменить DNS"],c:1,why:"И сразу поставить алерт на срок действия сертификата — просроченный TLS кладёт продажи целиком."}]}},

{id:"git",n:"Git и командная работа",ic:"⑂",tag:"Твой единственный источник правды",
 desc:"Всё, что не в git, — не существует. Инфраструктура тоже.",
 miss:[
 {id:"g1",t:"База и три зоны",goal:"Понять, где сейчас лежит твой код",
  cards:[
   {h:"Три зоны",b:"<pre>рабочая папка  →  индекс (stage)  →  коммит\n     git add ──────┘         git commit ─┘</pre><pre>git status            <span class='c'># где я и что изменено</span>\ngit add file.txt      <span class='c'># положить в индекс</span>\ngit add -p            <span class='c'># по кускам, осознанно</span>\ngit commit -m \"fix: таймаут в проксе\"\ngit log --oneline --graph --all</pre>"},
   {h:"Ветки",b:"<pre>git switch -c feature/login   <span class='c'># создать и перейти</span>\ngit switch main\ngit merge feature/login\ngit branch -d feature/login</pre><p>Ветка — это просто указатель на коммит. Дёшево создать, дёшево удалить.</p>"}],
  ch:[
   {t:"c",q:"Посмотри текущее состояние репозитория: что изменено, что в индексе.",ans:["git status","git status -s","git status --short"],hint:"главная команда git",why:"git status — читай его каждый раз. Он сам подсказывает следующую команду."},
   {t:"o",q:"Расставь порядок работы с изменением.",items:["Изменил файл в рабочей папке","git add — положил в индекс","git commit — зафиксировал","git push — отправил на сервер"],why:"Три зоны + удалёнка. Понимание этой цепочки убирает 80% страха перед git."},
   {t:"c",q:"Создай ветку feature/auth и сразу перейди в неё (современный синтаксис).",ans:["git switch -c feature/auth","git checkout -b feature/auth"],hint:"switch -c или checkout -b",why:"switch/restore — новые понятные команды вместо перегруженного checkout."}]},
 {id:"g2",t:"Конфликты и откаты",goal:"Не паниковать, когда всё красное",
  cards:[
   {h:"Merge vs rebase",b:"<p><b>merge</b> — склеивает истории, создаёт merge-коммит. История честная, но ветвистая.</p><p><b>rebase</b> — переносит твои коммиты поверх свежего main. История линейная и красивая.</p><p><b>Золотое правило:</b> не делай rebase веток, которые уже запушены и которыми пользуются другие. Ты перепишешь общую историю.</p>"},
   {h:"Отмена: три разных инструмента",b:"<pre>git revert abc123   <span class='c'># НОВЫЙ коммит, отменяющий старый — безопасно для общих веток</span>\ngit reset --soft HEAD~1   <span class='c'># убрать коммит, изменения оставить в индексе</span>\ngit reset --hard HEAD~1   <span class='c'># убрать коммит И изменения — данные теряются</span>\ngit stash / git stash pop <span class='c'># отложить незакоммиченное</span></pre><p>В общей ветке — только <code>revert</code>. <code>reset --hard</code> на main = переписанная история у всей команды.</p>"}],
  ch:[
   {t:"q",q:"Плохой коммит уже в main, которым пользуется команда. Как откатить?",a:["git reset --hard + force push","git revert","Удалить репозиторий","git stash"],c:1,why:"revert создаёт новый коммит-антидот, история не переписывается. Force push в main — способ поругаться со всей командой."},
   {t:"q",q:"Когда rebase опасен?",a:["Всегда","На ветке, которую уже запушили и используют другие","На локальной ветке","Никогда"],c:1,why:"Rebase меняет хеши коммитов. Для остальных это выглядит как «история подменилась»."},
   {t:"c",q:"Отложи незакоммиченные изменения, чтобы срочно переключиться на другую ветку.",ans:["git stash","git stash push","git stash save"],hint:"четыре буквы",why:"git stash прячет изменения, git stash pop возвращает. Спасает при срочном хотфиксе."},
   {t:"q",q:"Что делает <code>git reset --soft HEAD~1</code>?",a:["Удаляет изменения навсегда","Убирает последний коммит, оставляя изменения в индексе","Создаёт ветку","Отправляет на сервер"],c:1,why:"Идеально, когда закоммитил рано или с плохим сообщением: soft-reset → поправил → закоммитил заново."}]},
 {id:"g3",t:"Командный процесс",goal:"Работать так, как работают в компаниях",
  cards:[
   {h:"Trunk-based или GitFlow",b:"<p><b>GitFlow</b>: main, develop, release/*, hotfix/*. Тяжёлый, для релизов по расписанию и коробочных продуктов.</p><p><b>Trunk-based</b>: короткая ветка на 1-2 дня → PR → main. Плюс feature flags. Так работает большинство современных команд с CI/CD.</p><p>На собеседовании: назови оба, скажи что выбрал бы trunk-based для частых деплоев, и объясни почему — короткие ветки = мало конфликтов.</p>"},
   {h:"Conventional commits и PR",b:"<pre>feat: добавлен ретрай для платежей\nfix: таймаут nginx увеличен до 60s\nchore(ci): обновлён образ раннера\ndocs: описан процесс отката</pre><p>Из таких сообщений автоматически собирается changelog и версия (semver). Хороший PR: маленький, с описанием «что и зачем», с проходящим CI."}],
  ch:[
   {t:"q",q:"Команда деплоит по 5 раз в день. Какая стратегия ветвления уместнее?",a:["GitFlow с develop и release-ветками","Trunk-based: короткие ветки + PR в main","Одна ветка на разработчика навсегда","Без веток"],c:1,why:"Частые деплои требуют коротких живущих веток. Долгие ветки = ад слияний."},
   {t:"q",q:"Что означает префикс <code>fix:</code> в conventional commits?",a:["Новая функция","Исправление бага","Документация","Рефакторинг"],c:1,why:"feat — минорная версия, fix — патч, BREAKING CHANGE — мажорная. Это основа автоматического версионирования."},
   {t:"q",q:"Зачем нужен .gitignore и что туда точно НЕ должно попасть в репозиторий?",a:["Тесты","Секреты, .env, ключи, артефакты сборки","README","Dockerfile"],c:1,why:"Секрет в истории git = утёкший секрет навсегда. Даже после удаления файла он остаётся в истории — нужен ротейт ключа."}]}],
 boss:{t:"Ревью и разбор полётов",intro:"Тимлид проверяет, можно ли пускать тебя к общим веткам.",
  ch:[
  {t:"q",q:"Ты случайно закоммитил .env с паролем БД и запушил. Действия?",a:["Удалить файл новым коммитом — достаточно","Немедленно сменить пароль/ключ, затем чистить историю","Ничего, репозиторий приватный","Переименовать файл"],c:1,why:"Секрет в истории считается скомпрометированным. Сначала ротация, потом git filter-repo/BFG и force push с согласованием команды."},
  {t:"q",q:"Разница между <code>git fetch</code> и <code>git pull</code>?",a:["Ничего","fetch скачивает изменения, pull скачивает и сразу сливает","pull только для main","fetch удаляет ветки"],c:1,why:"pull = fetch + merge (или rebase). fetch безопаснее: посмотрел, что прилетело, потом решил."},
  {t:"c",q:"Посмотри историю коммитов компактно, одной строкой на коммит.",ans:["git log --oneline","git log --oneline --graph","git log --oneline --graph --all"],hint:"git log --...",why:"--oneline --graph --all даёт визуальную картину веток прямо в терминале."},
  {t:"q",q:"Что такое git tag и зачем в DevOps?",a:["Метка на коммите — так помечают релизные версии, по ним триггерится деплой","Комментарий","Ветка","Пользователь"],c:0,why:"CI часто запускает продакшен-деплой именно по тегу v1.2.3 — воспроизводимая точка релиза."},
  {t:"q",q:"Коллега сделал force push в main и снёс чужие коммиты. Как этого избежать в будущем?",a:["Довериться","Включить branch protection: запрет force push, обязательный PR и зелёный CI","Удалить его аккаунт","Делать бэкапы вручную"],c:1,why:"Защита веток — организационное решение проблемы. Правила должны быть в системе, а не в головах."}]}},

{id:"docker",n:"Docker и контейнеры",ic:"▣",tag:"«У меня работает» — больше не аргумент",
 desc:"Упаковать приложение так, чтобы оно одинаково запускалось везде.",
 miss:[
 {id:"d1",t:"Что такое контейнер",goal:"Отличать образ от контейнера и не путать с ВМ",
  cards:[
   {h:"Образ ≠ контейнер",b:"<p><b>Образ</b> — это шаблон, слепок файловой системы, только для чтения. Как класс.</p><p><b>Контейнер</b> — запущенный экземпляр образа с тонким записываемым слоем сверху. Как объект.</p><p>Из одного образа можно поднять 50 контейнеров.</p>"},
   {h:"Контейнер — не виртуалка",b:"<p>ВМ несёт своё ядро и полную ОС — гигабайты, десятки секунд на старт.</p><p>Контейнер — это <b>процесс на хостовом ядре</b>, изолированный через namespaces (что он видит) и cgroups (сколько ресурсов ему можно). Мегабайты, миллисекунды.</p><div class='analogy'><b>Аналогия:</b> ВМ — отдельная квартира со своими коммуникациями. Контейнер — комната в коммуналке со звукоизоляцией и лимитом на электричество.</div>"},
   {h:"Команды первого дня",b:"<pre>docker run -d -p 8080:80 --name web nginx\ndocker ps            <span class='c'># запущенные</span>\ndocker ps -a         <span class='c'># включая остановленные</span>\ndocker logs -f web\ndocker exec -it web bash   <span class='c'># зайти внутрь</span>\ndocker stop web && docker rm web\ndocker images</pre>"}],
  ch:[
   {t:"q",q:"Чем контейнер принципиально отличается от виртуальной машины?",a:["Ничем, это синонимы","Контейнер использует ядро хоста, изоляция через namespaces и cgroups","Контейнер медленнее","Контейнеру нужен свой BIOS"],c:1,why:"Формулировка «изолированный процесс на общем ядре, namespaces + cgroups» — то, что хотят услышать на собеседовании."},
   {t:"c",q:"Запусти nginx в фоне, пробросив порт 8080 хоста на 80 контейнера, с именем web.",ans:["docker run -d -p 8080:80 --name web nginx","docker run -d --name web -p 8080:80 nginx","docker run --name web -d -p 8080:80 nginx"],hint:"-d, -p хост:контейнер, --name",why:"Порядок в -p всегда ХОСТ:КОНТЕЙНЕР. Перепутал — и ничего не работает."},
   {t:"c",q:"Зайди внутрь работающего контейнера web интерактивной bash-сессией.",ans:["docker exec -it web bash","docker exec -ti web bash","docker exec -it web /bin/bash","docker exec -it web sh"],hint:"exec -it",why:"exec запускает процесс в существующем контейнере. attach — цепляется к главному процессу (и Ctrl+C может его убить)."},
   {t:"q",q:"Контейнер остановился сразу после запуска. Самая частая причина?",a:["Мало памяти","Главный процесс завершился — контейнер живёт ровно столько, сколько PID 1","Нет интернета","Порт занят"],c:1,why:"Контейнеру нужен процесс на переднем плане. Запуск демона в фоне = мгновенный выход. Смотри docker logs."}]},
 {id:"d2",t:"Dockerfile",goal:"Собрать свой образ и не сделать его на 2 ГБ",
  cards:[
   {h:"Анатомия",b:"<pre>FROM node:20-alpine\nWORKDIR /app\nCOPY package*.json ./\nRUN npm ci --omit=dev\nCOPY . .\nEXPOSE 3000\nUSER node\nCMD [\"node\", \"server.js\"]</pre><p>Каждая инструкция — <b>слой</b>. Слои кэшируются. Поэтому package.json копируется ОТДЕЛЬНО и раньше кода: изменил код — npm ci не переустанавливается, сборка в 10 раз быстрее.</p>"},
   {h:"Multi-stage: собрать в одном, запустить в другом",b:"<pre>FROM golang:1.22 AS build\nWORKDIR /src\nCOPY . .\nRUN go build -o /app/server\n\nFROM alpine:3.20\nCOPY --from=build /app/server /server\nUSER 1000\nCMD [\"/server\"]</pre><p>В финальный образ не попадают компилятор и исходники: 900 МБ → 15 МБ. Меньше размер = быстрее деплой и меньше уязвимостей.</p>"},
   {h:"CMD vs ENTRYPOINT",b:"<p><code>CMD</code> — команда по умолчанию, легко переопределяется аргументом при docker run.</p><p><code>ENTRYPOINT</code> — то, что выполняется всегда; аргументы run добавляются к нему.</p><p>Частая связка: ENTRYPOINT — бинарник, CMD — дефолтные флаги.</p>"}],
  ch:[
   {t:"q",q:"Почему package.json копируют отдельно и ДО остального кода?",a:["Так требует Docker","Ради кэша слоёв: зависимости не переустанавливаются при изменении кода","Иначе не соберётся","Для безопасности"],c:1,why:"Кэш слоёв — главный приём ускорения сборок. Правило: редко меняющееся выше, часто меняющееся ниже."},
   {t:"q",q:"Зачем нужен multi-stage build?",a:["Собирать несколько приложений","Оставить в финальном образе только артефакт, без компилятора и исходников","Ускорить запуск","Обязателен для Kubernetes"],c:1,why:"Размер и безопасность. Классический ответ: «золотой» образ = минимальная база + бинарник + непривилегированный пользователь."},
   {t:"f",q:"Допиши инструкцию, задающую команду запуска контейнера по умолчанию.",pre:"FROM node:20-alpine\nWORKDIR /app\nCOPY . .\n___ [\"node\", \"server.js\"]",ans:["cmd","entrypoint"],hint:"три буквы",why:"CMD в exec-форме (массив) — правильно: процесс становится PID 1 и получает сигналы. Shell-форма ломает graceful shutdown."},
   {t:"q",q:"Контейнер запущен от root. Чем это плохо?",a:["Ничем","Побег из контейнера даёт root на хосте при неверной конфигурации; это нарушение базовой практики","Медленнее работает","Больше размер"],c:1,why:"USER non-root + read-only rootfs + drop capabilities — базовая гигиена. Спрашивают почти всегда."}]},
 {id:"d3",t:"Данные, сети, compose",goal:"Поднять стек из нескольких сервисов",
  cards:[
   {h:"Данные не живут в контейнере",b:"<p>Удалил контейнер — writable-слой исчез. Для состояния есть тома:</p><pre>docker volume create pgdata\ndocker run -v pgdata:/var/lib/postgresql/data postgres:16\n<span class='c'># bind mount — папка хоста внутрь контейнера</span>\ndocker run -v $(pwd)/conf:/etc/app:ro myapp</pre>"},
   {h:"docker compose",b:"<pre>services:\n  web:\n    build: .\n    ports: [\"8080:3000\"]\n    environment:\n      DB_HOST: db\n    depends_on: [db]\n  db:\n    image: postgres:16\n    environment:\n      POSTGRES_PASSWORD: secret\n    volumes:\n      - pgdata:/var/lib/postgresql/data\nvolumes:\n  pgdata:</pre><p>Внутри compose-сети контейнеры видят друг друга <b>по имени сервиса</b>: приложение ходит на хост <code>db</code>, а не на IP.</p><pre>docker compose up -d\ndocker compose logs -f web\ndocker compose down        <span class='c'># -v чтобы снести тома</span></pre>"}],
  ch:[
   {t:"q",q:"Как контейнер web обращается к базе в том же docker compose?",a:["По IP-адресу","По имени сервиса: db:5432","Через localhost","Никак"],c:1,why:"Встроенный DNS docker-сети резолвит имена сервисов. Хардкодить IP нельзя — они меняются."},
   {t:"q",q:"Данные Postgres пропали после docker rm. Что забыли?",a:["Бэкап","Volume: без тома данные лежат в writable-слое контейнера","Пароль","Сеть"],c:1,why:"Контейнер эфемерен by design. Всё, что должно пережить пересоздание, — в volume или внешнем хранилище."},
   {t:"c",q:"Подними весь стек из docker-compose.yml в фоне.",ans:["docker compose up -d","docker-compose up -d","docker compose up --detach"],hint:"compose up + флаг фона",why:"docker compose up -d. Без -d логи повиснут в терминале, а Ctrl+C остановит стек."},
   {t:"q",q:"Как правильно передать пароль БД в контейнер на проде?",a:["Написать в Dockerfile через ENV","Захардкодить в образ","Через секреты оркестратора / внешний секрет-менеджер, монтируя в рантайме","В имя контейнера"],c:2,why:"ENV в Dockerfile попадает в слои образа и виден через docker history. Секреты — только в рантайме."}]}],
 boss:{t:"Ревью Dockerfile от разработчика",intro:"Тебе прислали Dockerfile на 1.8 ГБ, который запускается от root. Раздай замечания.",
  ch:[
  {t:"q",q:"Образ 1.8 ГБ на Go-приложение. Первое замечание?",a:["Нормально","Multi-stage build + минимальная база (alpine/distroless)","Добавить оперативки","Сжать архиватором"],c:1,why:"Компилятор и исходники не нужны в рантайме. Go-бинарь + distroless = единицы мегабайт."},
  {t:"q",q:"В Dockerfile строка <code>COPY . .</code> первой. Что не так?",a:["Ничего","Ломает кэш слоёв: любое изменение кода инвалидирует установку зависимостей; плюс в образ попадает лишнее","Слишком медленно копирует","Нужен ADD"],c:1,why:"И обязательно .dockerignore, иначе внутрь уедут .git, node_modules и .env."},
  {t:"c",q:"Посмотри логи контейнера api в реальном времени.",ans:["docker logs -f api","docker logs --follow api","docker logs -f --tail 100 api"],hint:"logs + follow",why:"Приложение в контейнере должно писать логи в stdout/stderr — их собирает docker и дальше система логирования."},
  {t:"q",q:"Зачем в контейнере HEALTHCHECK?",a:["Для красоты","Оркестратор понимает, что контейнер жив и готов принимать трафик, и может перезапустить/не слать трафик","Ускоряет старт","Уменьшает образ"],c:1,why:"Running ≠ healthy. Без healthcheck трафик уйдёт в ещё не прогретое приложение."},
  {t:"q",q:"Приложение внутри пишет логи в /app/logs/app.log. Что предложишь?",a:["Оставить","Писать в stdout/stderr — это стандарт для контейнеров (12-factor)","Монтировать том под логи всегда","Отключить логи"],c:1,why:"stdout подхватывается драйвером логов и уезжает в Loki/ELK. Файлы внутри контейнера теряются при пересоздании."}]}},

{id:"cicd",n:"CI/CD",ic:"⇉",tag:"Конвейер, который делает работу за тебя",
 desc:"От push до продакшена без ручных шагов и без страха.",
 miss:[
 {id:"c1",t:"Зачем это всё",goal:"Понять смысл, а не только синтаксис",
  cards:[
   {h:"CI, CD и CD",b:"<ul><li><b>CI</b> (непрерывная интеграция): каждый push автоматически собирается и прогоняется тестами. Цель — ловить поломку за минуты, а не за неделю.</li><li><b>Continuous Delivery</b>: артефакт всегда готов к выкатке, но кнопку жмёт человек.</li><li><b>Continuous Deployment</b>: зелёный пайплайн едет на прод сам.</li></ul>"},
   {h:"Типовой пайплайн",b:"<pre>lint → test → build → scan → publish → deploy(staging) → deploy(prod)</pre><p>Ключевые принципы: <b>быстрая обратная связь</b> (дешёвые шаги первыми), <b>fail fast</b>, <b>один артефакт</b> — собрали один раз и продвигаем ЕГО по средам, не пересобирая. Пересборка на прод = другой артефакт = «а на стейдже работало».</p>"}],
  ch:[
   {t:"o",q:"Расставь стадии пайплайна в разумном порядке.",items:["lint — статический анализ","test — автотесты","build — сборка образа","scan — проверка уязвимостей","deploy на staging","deploy на production"],why:"Дешёвое и быстрое — раньше. Нет смысла собирать образ, если код не проходит линтер."},
   {t:"q",q:"В чём разница Continuous Delivery и Continuous Deployment?",a:["Ни в чём","Delivery — готов к выкатке, деплой запускает человек; Deployment — выкатывается автоматически","Delivery только для фронтенда","Deployment дешевле"],c:1,why:"Точный ответ на этот вопрос сразу отличает подготовленного кандидата."},
   {t:"q",q:"Почему нельзя пересобирать образ отдельно для staging и для prod?",a:["Долго","Это разные артефакты — тестировали одно, выкатили другое","Дорого","Нельзя технически"],c:1,why:"Build once, deploy everywhere. Отличается только конфигурация, задаваемая переменными окружения."}]},
 {id:"c2",t:"GitHub Actions",goal:"Написать рабочий workflow руками",
  cards:[
   {h:"Структура",b:"<pre>name: ci\non:\n  push:\n    branches: [main]\n  pull_request:\n\njobs:\n  test:\n    runs-on: ubuntu-latest\n    steps:\n      - uses: actions/checkout@v4\n      - uses: actions/setup-node@v4\n        with: { node-version: '20' }\n      - run: npm ci\n      - run: npm test</pre><p><b>workflow</b> → <b>jobs</b> (параллельны по умолчанию) → <b>steps</b> (последовательны). Связать job'ы: <code>needs: test</code>.</p>"},
   {h:"Секреты и окружения",b:"<pre>      - run: docker login -u $U -p $P\n        env:\n          U: ${{ secrets.REG_USER }}\n          P: ${{ secrets.REG_TOKEN }}</pre><p>Секреты хранятся в настройках репозитория/организации, в логах маскируются. В коде секретов нет никогда.</p><p>Environments дают ручное подтверждение перед прод-деплоем — то самое отличие Delivery от Deployment.</p>"}],
  ch:[
   {t:"f",q:"Допиши ключ, который задаёт, на каком раннере выполняется job.",pre:"jobs:\n  build:\n    ___: ubuntu-latest\n    steps:\n      - uses: actions/checkout@v4",ans:["runs-on"],hint:"runs-...",why:"runs-on выбирает раннер: ubuntu-latest, self-hosted или лейбл своей группы."},
   {t:"q",q:"Job deploy должен запускаться только после успешного test. Какой ключ?",a:["after","needs: test","depends","waitFor"],c:1,why:"needs создаёт зависимость и выстраивает граф. Без него job'ы стартуют параллельно."},
   {t:"q",q:"Где хранить токен доступа к registry?",a:["В коде workflow","В секретах репозитория/организации","В README","В имени ветки"],c:1,why:"Секреты не печатаются в логах и не доступны в workflow из форков — важная деталь безопасности."},
   {t:"q",q:"Пайплайн стал занимать 25 минут. Что сделаешь первым?",a:["Купить раннер помощнее","Кэшировать зависимости и распараллелить независимые job'ы","Убрать тесты","Деплоить реже"],c:1,why:"Кэш зависимостей + параллельные job'ы + матрицы. Убирать тесты — антипаттерн, ради которого CI и строился."}]},
 {id:"c3",t:"Стратегии деплоя и откат",goal:"Выкатываться без даунтайма и уметь отступить",
  cards:[
   {h:"Четыре стратегии",b:"<ul><li><b>Recreate</b>: погасил старое, поднял новое. Простой даунтайм.</li><li><b>Rolling</b>: заменяем по одному поду. Дефолт в Kubernetes.</li><li><b>Blue-Green</b>: две среды, переключение трафика мгновенно, откат — переключение обратно.</li><li><b>Canary</b>: 5% трафика на новую версию, смотрим метрики, увеличиваем.</li></ul>"},
   {h:"Откат — часть плана, а не импровизация",b:"<p>Правило: если ты не знаешь, как откатить релиз, — ты не готов его катить.</p><ul><li>Образы тегируются неизменяемо (по коммиту), не <code>latest</code>.</li><li>Миграции БД — обратносовместимые: сначала добавили колонку, потом код, потом удалили старое. Никогда не удаляй колонку в том же релизе.</li><li>Feature flag выключает функцию без деплоя.</li></ul>"}],
  ch:[
   {t:"q",q:"Нужно выкатить рискованное изменение и проверить его на реальном трафике на 5% пользователей. Стратегия?",a:["Recreate","Rolling","Canary","Никакая"],c:2,why:"Canary + метрики ошибок/латентности + автоматический откат по SLO."},
   {t:"q",q:"Почему тег <code>latest</code> — плохая идея на проде?",a:["Длинное имя","Непонятно, какая версия реально запущена, и невозможно воспроизвести откат","Занимает место","Медленно тянется"],c:1,why:"Неизменяемые теги (git-sha) = воспроизводимость. Основа для честного отката."},
   {t:"q",q:"Релиз включает удаление колонки в БД. Что не так?",a:["Ничего","Откат кода станет невозможен — данных уже нет; миграции должны быть обратносовместимыми","Долго","Нужен даунтайм"],c:1,why:"Expand → migrate → contract. Раскатывай в два-три релиза, тогда откат остаётся возможным."},
   {t:"q",q:"Что такое feature flag и зачем DevOps-инженеру?",a:["Флаг компилятора","Переключатель функции в рантайме: деплой и релиз разделяются, откат без выкатки","Метка в git","Тип теста"],c:1,why:"Отделяет доставку кода от включения функции — снижает риск любого релиза."}]}],
 boss:{t:"Пайплайн красный в пятницу вечером",intro:"Задача — не сломать прод и внятно объяснить решения.",
  ch:[
  {t:"q",q:"Тест упал только в CI, локально всё зелёное. Первая гипотеза?",a:["CI сломан","Разница окружений: версии, переменные, порядок тестов, отсутствие сети/времени","Тест плохой","Надо перезапустить"],c:1,why:"«Перезапустить и надеяться» — путь к flaky-тестам. Ищем различие сред и фиксируем его."},
  {t:"q",q:"Как правильно тегировать образ, собранный в CI?",a:["latest","Хешем коммита (и дополнительно семвером для релизов)","Датой","Именем разработчика"],c:1,why:"app:1a2b3c4 однозначно связывает работающий контейнер с кодом. Это основа расследования инцидентов."},
  {t:"q",q:"Секрет случайно распечатался в логах пайплайна. Действия?",a:["Удалить лог","Ротировать секрет немедленно, потом чистить логи и чинить причину","Ничего","Сделать репозиторий приватным"],c:1,why:"Скомпрометирован — значит меняем. Логи хранятся в кэшах, форках и глазах людей."},
  {t:"q",q:"Prod-деплой должен требовать подтверждения человеком. Как это реализовать?",a:["Просить в чате","Environment с required reviewers / manual approval job","Деплоить вручную","Никак"],c:1,why:"Ручной gate в пайплайне даёт и контроль, и аудит — кто и когда одобрил выкатку."},
  {t:"q",q:"Что ты положишь в пайплайн для безопасности?",a:["Ничего","Сканирование зависимостей и образа, проверку секретов в коде, SAST","Только тесты","Антивирус"],c:1,why:"Shift left: trivy/grype для образов, gitleaks для секретов, dependabot для зависимостей."}]}},

{id:"iac",n:"Инфраструктура как код",ic:"⌗",tag:"Terraform и Ansible",
 desc:"Перестать кликать в консоли и начать описывать инфраструктуру в git.",
 miss:[
 {id:"i1",t:"Идея IaC",goal:"Понять декларативность и идемпотентность",
  cards:[
   {h:"Два слова, которые надо выучить",b:"<p><b>Декларативно</b> — ты описываешь ЖЕЛАЕМОЕ состояние («нужно 3 сервера»), инструмент сам считает разницу. Императивно — ты описываешь ШАГИ («создай сервер, потом ещё один»).</p><p><b>Идемпотентность</b> — применяешь один раз или десять раз, результат одинаковый. Именно поэтому IaC безопасен.</p>"},
   {h:"Terraform vs Ansible",b:"<div class='tw'><table><tr><th></th><th>Terraform</th><th>Ansible</th></tr><tr><td>Задача</td><td>создавать ресурсы (provisioning)</td><td>настраивать внутри (configuration)</td></tr><tr><td>Стиль</td><td>декларативный, есть state</td><td>процедурный, без state</td></tr><tr><td>Типично</td><td>ВМ, сети, кластеры, БД</td><td>пакеты, конфиги, деплой</td></tr></table></div><p>Классическая связка: Terraform поднял сервера → Ansible их настроил.</p>"}],
  ch:[
   {t:"q",q:"Что значит «идемпотентный playbook»?",a:["Быстро выполняется","Повторный запуск не меняет систему, если она уже в нужном состоянии","Работает без сети","Не требует sudo"],c:1,why:"Поэтому в Ansible пишут state: present, а не «выполни apt install». Инструмент сам решает, нужно ли действие."},
   {t:"q",q:"Нужно создать 10 виртуальных машин в облаке. Какой инструмент?",a:["Ansible","Terraform","Bash-скрипт с curl","Руками в консоли"],c:1,why:"Terraform управляет жизненным циклом ресурсов и знает про зависимости и удаление. Ansible уже настроит их изнутри."},
   {t:"q",q:"Главный аргумент в пользу IaC перед кликами в веб-консоли?",a:["Красиво","Воспроизводимость, ревью изменений, история в git и возможность пересоздать всё с нуля","Дешевле","Быстрее кликать"],c:1,why:"Инфраструктура становится обычным кодом: PR, ревью, откат, аудит. Плюс исчезает «а кто это поменял?»"}]},
 {id:"i2",t:"Terraform на практике",goal:"Понять state и рабочий цикл",
  cards:[
   {h:"Цикл работы",b:"<pre>terraform init     <span class='c'># скачать провайдеры, настроить backend</span>\nterraform fmt -recursive\nterraform validate\nterraform plan -out=tf.plan   <span class='c'># ЧТО будет сделано</span>\nterraform apply tf.plan\nterraform destroy</pre><p><code>plan</code> перед <code>apply</code> — не рекомендация, а правило. Читаешь diff: сколько create / change / <b>destroy</b>.</p>"},
   {h:"State — самое важное и самое опасное",b:"<p><code>terraform.tfstate</code> — карта соответствия «код ↔ реальные ресурсы». Без него Terraform не знает, что уже создано.</p><ul><li>Хранить <b>удалённо</b> (S3, GCS, Terraform Cloud), не в git — там могут быть секреты.</li><li>Обязательно <b>блокировка</b> (DynamoDB lock, встроенная в бэкенд), иначе два инженера одновременно разнесут инфраструктуру.</li><li><code>terraform import</code> — затянуть существующий ресурс под управление.</li></ul>"},
   {h:"Модули и переменные",b:"<pre>variable \"env\" { type = string }\n\nresource \"aws_instance\" \"app\" {\n  count         = var.env == \"prod\" ? 3 : 1\n  instance_type = \"t3.small\"\n  tags = { Name = \"app-${var.env}\" }\n}\n\noutput \"ip\" { value = aws_instance.app[0].public_ip }</pre><p>Модуль — переиспользуемый набор ресурсов. Среды разделяют через отдельные state (workspace или папки prod/stage).</p>"}],
  ch:[
   {t:"c",q:"Посмотри, что именно Terraform собирается изменить, ничего не применяя.",ans:["terraform plan","terraform plan -out=tf.plan","tf plan"],hint:"одно слово после terraform",why:"plan — обязательный шаг. В CI план публикуют в PR, чтобы ревьюер увидел diff инфраструктуры."},
   {t:"q",q:"Зачем state хранят в S3 с блокировкой, а не локально?",a:["Быстрее","Общая правда для команды + защита от одновременного apply","Дешевле","Так требует AWS"],c:1,why:"Локальный state = рассинхрон и потерянная инфраструктура при смене ноутбука. Блокировка спасает от гонок."},
   {t:"q",q:"В plan видишь <code>1 to destroy</code> на проде, хотя менял только тег. Действия?",a:["Применить, тег же мелкий","Остановиться и разобраться: скорее всего изменение атрибута, требующего пересоздания","Удалить state","Запустить apply дважды"],c:1,why:"Некоторые поля — ForceNew. Читать plan построчно — базовый навык, спасающий продакшены."},
   {t:"q",q:"Ресурс создали руками в консоли, теперь надо им управлять из Terraform.",a:["Пересоздать через apply","terraform import (или import-блок) — затянуть в state","Скопировать в код и всё","Невозможно"],c:1,why:"import связывает существующий ресурс с адресом в коде. Иначе apply попытается создать дубль."}]},
 {id:"i3",t:"Ansible",goal:"Настроить десять серверов одинаково",
  cards:[
   {h:"Playbook",b:"<pre>- hosts: web\n  become: true\n  vars:\n    pkg: nginx\n  tasks:\n    - name: установить nginx\n      apt:\n        name: \"{{ pkg }}\"\n        state: present\n        update_cache: true\n\n    - name: положить конфиг\n      template:\n        src: nginx.conf.j2\n        dest: /etc/nginx/nginx.conf\n      notify: reload nginx\n\n  handlers:\n    - name: reload nginx\n      service: { name: nginx, state: reloaded }</pre><p>Ansible <b>agentless</b> — работает по SSH, ничего не надо ставить на целевые машины.</p>"},
   {h:"Инвентарь, роли, секреты",b:"<p><b>Inventory</b> — список хостов и групп (может быть динамическим из облака).</p><p><b>Роль</b> — структурированный переиспользуемый набор tasks/templates/vars.</p><p><b>ansible-vault</b> — шифрование секретов прямо в репозитории.</p><pre>ansible-playbook -i inventory site.yml --check --diff\nansible all -m ping</pre><p><code>--check</code> — сухой прогон, аналог plan.</p>"}],
  ch:[
   {t:"f",q:"Допиши ключ, который делает задачу идемпотентной — «пакет должен присутствовать».",pre:"- name: установить nginx\n  apt:\n    name: nginx\n    ___: present",ans:["state"],hint:"state",why:"state: present/absent — декларация желаемого состояния, а не команда. Ansible сам проверит и не сделает лишнего."},
   {t:"q",q:"Что означает «Ansible agentless»?",a:["Не нужен интернет","На управляемых хостах не надо ставить агента — работает через SSH","Работает без Python","Нет конфигурации"],c:1,why:"Отличие от Puppet/Chef с их агентами. Требуется лишь SSH и Python на целевом хосте."},
   {t:"q",q:"Как безопасно хранить пароли в репозитории с плейбуками?",a:["Открытым текстом","ansible-vault (или внешний секрет-менеджер)","В комментариях","В имени файла"],c:1,why:"ansible-vault шифрует файл; ключ хранится вне репозитория, в CI подставляется из секретов."},
   {t:"q",q:"Зачем handler + notify вместо простого рестарта в конце?",a:["Красивее","Сервис перезапускается ТОЛЬКО если конфиг реально изменился","Быстрее пишется","Обязательно по синтаксису"],c:1,why:"Иначе каждый прогон дёргает прод без необходимости. Это и есть идемпотентность на практике."}]}],
 boss:{t:"Аудит инфраструктуры",intro:"Новый проект: всё создано руками, паролей никто не помнит. Наводи порядок.",
  ch:[
  {t:"q",q:"С чего начнёшь перевод ручной инфраструктуры в код?",a:["Всё снести и создать заново","Описать текущее состояние и импортировать в state, потом рефакторить","Написать документацию","Ничего не трогать"],c:1,why:"Импорт без даунтайма, потом постепенный рефакторинг в модули. Пересоздание прода — не вариант."},
  {t:"q",q:"Terraform state лежит в git и содержит пароль БД. Проблема?",a:["Нет","Да: state хранит значения в открытом виде — переносим в защищённый remote backend и ротируем секрет","Только если репозиторий публичный","Достаточно .gitignore"],c:1,why:"State — чувствительный артефакт. Remote backend с шифрованием и ограниченным доступом, плюс ротация утёкшего."},
  {t:"q",q:"Как разделить окружения prod и staging в Terraform?",a:["Одним state и переменными","Отдельные state/workspace и разные каталоги конфигураций","Одним файлом с if","Разными аккаунтами git"],c:1,why:"Изоляция state = ошибка в стейдже не роняет прод. Общий код выносится в модули."},
  {t:"q",q:"Ansible-плейбук при каждом запуске рестартует nginx, даже если ничего не менялось. Что чинить?",a:["Ничего","Использовать handlers + notify и декларативные модули вместо command/shell","Запускать реже","Отключить nginx"],c:1,why:"command/shell по умолчанию не идемпотентны — им нужен creates/when, иначе changed каждый раз."},
  {t:"q",q:"Что ты добавишь в CI для Terraform?",a:["Ничего","fmt, validate, план в PR и apply только после ревью/аппрува","Только apply","Ручной запуск"],c:1,why:"Инфраструктурный PR ревьюят по diff'у плана. Автоапплай без ревью на проде — способ потерять кластер."}]}},

{id:"k8s",n:"Kubernetes",ic:"⎈",tag:"Оркестрация, где живут middle-инженеры",
 desc:"Кластер сам держит нужное состояние. Твоя задача — правильно его описать и уметь чинить.",
 miss:[
 {id:"k1",t:"Из чего состоит кластер",goal:"Не путать Pod, Deployment и Service",
  cards:[
   {h:"Control plane и ноды",b:"<ul><li><b>API server</b> — единственная точка входа, всё идёт через него.</li><li><b>etcd</b> — база состояния кластера (её бэкапят!).</li><li><b>scheduler</b> — решает, на какую ноду поставить под.</li><li><b>controller manager</b> — приводит реальность к желаемому состоянию.</li><li>На каждой ноде: <b>kubelet</b> (запускает контейнеры) и <b>kube-proxy</b> (сеть).</li></ul><p>Ключевая идея: <b>reconciliation loop</b>. Ты объявил «нужно 3 реплики» — контроллер бесконечно сверяет и чинит.</p>"},
   {h:"Объекты, которые используешь каждый день",b:"<ul><li><b>Pod</b> — минимальная единица, один или несколько контейнеров с общей сетью. Смертен.</li><li><b>ReplicaSet</b> — держит N подов.</li><li><b>Deployment</b> — управляет ReplicaSet, даёт rolling update и откат.</li><li><b>Service</b> — стабильный адрес и балансировка к подам по лейблам.</li><li><b>Ingress</b> — HTTP-маршрутизация снаружи по доменам/путям.</li><li><b>ConfigMap / Secret</b> — конфиги и чувствительные данные.</li><li><b>StatefulSet</b> — для БД и всего, чему нужны стабильные имена и диски.</li><li><b>DaemonSet</b> — по одному поду на каждую ноду (агенты логов, мониторинг).</li></ul>"}],
  ch:[
   {t:"q",q:"Под упал и не вернулся. Что должно было его пересоздать?",a:["kubelet сам по себе","Deployment → ReplicaSet держит нужное число реплик","Ingress","etcd"],c:1,why:"Голый Pod никто не воскрешает. Поэтому в проде создают Deployment, а не Pod."},
   {t:"q",q:"Зачем нужен Service, если у пода есть IP?",a:["Для красоты","IP пода меняется при пересоздании; Service даёт стабильное DNS-имя и балансировку по лейблам","Service ускоряет сеть","Это одно и то же"],c:1,why:"Связь идёт через selector по лейблам. Типичная ошибка — несовпадение лейблов, и Service никуда не ведёт."},
   {t:"q",q:"Нужно по одному агенту сбора логов на КАЖДОЙ ноде. Какой объект?",a:["Deployment","DaemonSet","StatefulSet","Job"],c:1,why:"DaemonSet — ровно по поду на ноду, автоматически и на новых нодах тоже."},
   {t:"q",q:"Разница Deployment и StatefulSet?",a:["Нет разницы","StatefulSet даёт стабильные имена подов и персистентные тома — для БД и кворумных систем","StatefulSet быстрее","Deployment только для БД"],c:1,why:"Postgres/Kafka/Elasticsearch — StatefulSet. Stateless-приложения — Deployment."}]},
 {id:"k2",t:"Манифесты и kubectl",goal:"Писать YAML и читать состояние кластера",
  cards:[
   {h:"Deployment целиком",b:"<pre>apiVersion: apps/v1\nkind: Deployment\nmetadata:\n  name: api\nspec:\n  replicas: 3\n  selector:\n    matchLabels: { app: api }\n  template:\n    metadata:\n      labels: { app: api }\n    spec:\n      containers:\n        - name: api\n          image: registry/api:1a2b3c4\n          ports: [{ containerPort: 8080 }]\n          resources:\n            requests: { cpu: 100m, memory: 128Mi }\n            limits:   { cpu: 500m, memory: 512Mi }\n          readinessProbe:\n            httpGet: { path: /health, port: 8080 }</pre>"},
   {h:"Команды выживания",b:"<pre>kubectl get pods -n prod\nkubectl describe pod api-xxx     <span class='c'># события — главное при отладке</span>\nkubectl logs -f api-xxx\nkubectl logs api-xxx --previous  <span class='c'># логи упавшего контейнера</span>\nkubectl exec -it api-xxx -- sh\nkubectl apply -f deploy.yaml\nkubectl rollout status deploy/api\nkubectl rollout undo deploy/api  <span class='c'># откат</span>\nkubectl get events --sort-by=.lastTimestamp</pre>"},
   {h:"requests и limits",b:"<p><b>requests</b> — сколько гарантированно резервируется; по ним <b>scheduler</b> размещает под.</p><p><b>limits</b> — потолок. Превысил память → <b>OOMKilled</b>. Превысил CPU → троттлинг (не убийство).</p><p>Без requests планировщик работает вслепую, и ноды переполняются.</p>"}],
  ch:[
   {t:"c",q:"Посмотри подробности и события пода api-7f9 (главный инструмент отладки).",ans:["kubectl describe pod api-7f9","k describe pod api-7f9","kubectl describe pods api-7f9"],hint:"kubectl describe ...",why:"Раздел Events внизу вывода объясняет 90% проблем: ImagePullBackOff, Insufficient cpu, FailedMount."},
   {t:"c",q:"Откати деплоймент api на предыдущую ревизию.",ans:["kubectl rollout undo deploy/api","kubectl rollout undo deployment/api","kubectl rollout undo deployment api"],hint:"rollout undo",why:"Deployment хранит историю ревизий. Откат — одна команда, и это главный аргумент в пользу декларативности."},
   {t:"q",q:"Под в статусе <code>OOMKilled</code>. Что произошло?",a:["Нет образа","Контейнер превысил memory limit и был убит ядром","Нет места на диске","Ошибка сети"],c:1,why:"Либо поднять limit, либо чинить утечку. CPU-limit, в отличие от памяти, приводит к троттлингу, а не к убийству."},
   {t:"q",q:"Под в <code>ImagePullBackOff</code>. Первая проверка?",a:["Перезапустить кластер","Имя/тег образа и доступ к registry (imagePullSecrets)","Увеличить память","Сменить ноду"],c:1,why:"Обычно опечатка в теге или нет секрета для приватного registry. Всё видно в describe → Events."}]},
 {id:"k3",t:"Конфиги, сеть, доступ",goal:"Довести трафик до пода и не хранить пароли в YAML",
  cards:[
   {h:"ConfigMap и Secret",b:"<pre>envFrom:\n  - configMapRef: { name: app-config }\n  - secretRef:    { name: app-secrets }</pre><p><b>Важно:</b> Secret в Kubernetes по умолчанию всего лишь base64, не шифрование. Нужны: шифрование etcd at rest, RBAC, и для git — sealed-secrets / external-secrets / Vault.</p>"},
   {h:"Как трафик доходит",b:"<pre>Пользователь → DNS → Ingress Controller (nginx/traefik)\n  → Service (ClusterIP) → Pod</pre><p>Типы Service: <b>ClusterIP</b> (внутри), <b>NodePort</b> (порт на ноде), <b>LoadBalancer</b> (внешний балансировщик облака).</p>"},
   {h:"Probes: три штуки",b:"<ul><li><b>readiness</b> — готов ли принимать трафик. Не готов → Service его исключает.</li><li><b>liveness</b> — жив ли. Нет → контейнер перезапускается.</li><li><b>startup</b> — для медленно стартующих, чтобы liveness не убил раньше времени.</li></ul><p>Ошибка новичка: liveness с коротким таймаутом на тяжёлом приложении — бесконечный рестарт-луп.</p>"}],
  ch:[
   {t:"q",q:"Приложение стартует 40 секунд. Какая probe спасёт от рестарт-лупа?",a:["liveness с коротким периодом","startupProbe (и корректная readiness)","Никакая","Убрать все probes"],c:1,why:"startupProbe откладывает liveness до успешного старта. Readiness при этом держит трафик до готовности."},
   {t:"q",q:"Secret в Kubernetes — это шифрование?",a:["Да, AES","Нет, по умолчанию base64; нужны шифрование etcd, RBAC и внешний менеджер секретов","Да, RSA","Секретов в k8s нет"],c:1,why:"Частый вопрос-ловушка на собеседовании. Правильный ответ показывает зрелость в безопасности."},
   {t:"q",q:"Нужно раздать трафик на два домена внутрь кластера по HTTPS. Что используешь?",a:["NodePort на каждый","Ingress + Ingress Controller (+ cert-manager для TLS)","Только ClusterIP","DaemonSet"],c:1,why:"Ingress — правила маршрутизации; Controller — то, что их исполняет. Без контроллера Ingress не делает ничего."},
   {t:"q",q:"Service создан, но трафик не идёт в поды. Куда смотришь первым делом?",a:["На версию kubectl","На совпадение selector Service и labels подов, и на endpoints","На CPU","На DNS провайдера"],c:1,why:"kubectl get endpoints — если пусто, значит селектор не находит поды. Ошибка №1 у новичков."}]},
 {id:"k4",t:"Эксплуатация кластера",goal:"Масштабирование, обновления, надёжность",
  cards:[
   {h:"Масштабирование",b:"<p><b>HPA</b> — горизонтально по метрикам (CPU, память, кастомные).</p><p><b>Cluster Autoscaler</b> — добавляет ноды, когда поды не влезают.</p><pre>kubectl scale deploy/api --replicas=5\nkubectl autoscale deploy/api --min=2 --max=10 --cpu-percent=70</pre><p>HPA работает только если у подов заданы resources.requests.</p>"},
   {h:"Надёжность",b:"<ul><li><b>PodDisruptionBudget</b> — не дать выселить слишком много подов при обслуживании нод.</li><li><b>affinity / topologySpreadConstraints</b> — размазать реплики по зонам и нодам.</li><li><b>taints / tolerations</b> — зарезервировать ноды под особые нагрузки.</li><li><b>Helm</b> — пакетирование манифестов с values для сред; <b>ArgoCD</b> — GitOps: кластер синхронизируется с git-репозиторием.</li></ul>"}],
  ch:[
   {t:"c",q:"Увеличь число реплик деплоймента api до 5.",ans:["kubectl scale deploy/api --replicas=5","kubectl scale deployment/api --replicas=5","kubectl scale deployment api --replicas=5"],hint:"kubectl scale",why:"Быстро для инцидента, но в GitOps итог всё равно надо зафиксировать в манифесте, иначе следующая синхронизация откатит."},
   {t:"q",q:"Что такое GitOps?",a:["Git-хостинг","Желаемое состояние кластера хранится в git, агент (ArgoCD/Flux) непрерывно приводит кластер к нему","Способ ветвления","CI-система"],c:1,why:"Плюсы: аудит, откат через git revert, отсутствие ручных kubectl apply на проде."},
   {t:"q",q:"Зачем PodDisruptionBudget?",a:["Ограничить бюджет","Гарантировать минимум доступных подов при плановых выселениях (drain, обновление нод)","Ограничить CPU","Настроить сеть"],c:1,why:"Без PDB обновление нод может одновременно выселить все реплики и уронить сервис."},
   {t:"q",q:"HPA не масштабирует поды. Частая причина?",a:["Мало нод","Не заданы resources.requests / нет metrics-server","Старый kubectl","Нет Ingress"],c:1,why:"HPA считает утилизацию относительно requests. Нет requests — нечего считать."}]}],
 boss:{t:"Кластер деградирует",intro:"Половина подов рестартует, клиенты видят 502. Пять решений.",
  ch:[
  {t:"q",q:"Поды в CrashLoopBackOff. Твой первый шаг?",a:["Удалить деплоймент","kubectl logs --previous и kubectl describe — понять причину падения","Перезагрузить ноды","Увеличить реплики"],c:1,why:"--previous показывает логи предыдущего, упавшего контейнера. Без этого причина не видна."},
  {t:"q",q:"Часть подов Pending. Что смотришь?",a:["Логи приложения","describe pod → Events: недостаточно ресурсов, taints, нет PV","Ingress","Сертификаты"],c:1,why:"Pending — проблема планирования, а не приложения. Обычно не хватает CPU/памяти или нет подходящей ноды."},
  {t:"q",q:"После деплоя 502 у пользователей. Причина, скорее всего?",a:["DNS","Нет readinessProbe — трафик пошёл в неготовые поды","Мало реплик","Старый образ"],c:1,why:"Readiness + rolling update с maxUnavailable=0 = деплой без ошибок для пользователя."},
  {t:"c",q:"Останови катящийся неудачный релиз и верни предыдущую версию api.",ans:["kubectl rollout undo deploy/api","kubectl rollout undo deployment/api","kubectl rollout undo deployment api"],hint:"rollout undo",why:"Сначала стабилизировать, потом разбираться. Это правило инцидент-менеджмента."},
  {t:"q",q:"Как ограничить, чтобы одно приложение не съело ресурсы всего неймспейса?",a:["Просить разработчиков","ResourceQuota и LimitRange на неймспейс + requests/limits в подах","Отдельный кластер всегда","Никак"],c:1,why:"Квоты — граница ответственности между командами в общем кластере."}]}},

{id:"obs",n:"Мониторинг и надёжность",ic:"◉",tag:"Узнать о проблеме раньше клиента",
 desc:"Метрики, логи, трейсы, алерты — и культура разбора инцидентов.",
 miss:[
 {id:"o1",t:"Три столпа наблюдаемости",goal:"Понимать, чем метрика отличается от лога",
  cards:[
   {h:"Метрики, логи, трейсы",b:"<ul><li><b>Метрики</b> — числа во времени (rps, latency, errors, CPU). Дёшевы, отвечают «что-то не так и когда».</li><li><b>Логи</b> — события с деталями. Отвечают «что именно произошло».</li><li><b>Трейсы</b> — путь одного запроса через сервисы. Отвечают «где именно тормозит».</li></ul><p>Стек по умолчанию: Prometheus + Grafana (метрики), Loki или ELK (логи), Jaeger/Tempo + OpenTelemetry (трейсы).</p>"},
   {h:"Что мерить: RED и USE",b:"<p><b>RED</b> для сервисов: <b>R</b>ate (запросов/сек), <b>E</b>rrors (доля ошибок), <b>D</b>uration (латентность).</p><p><b>USE</b> для ресурсов: <b>U</b>tilization, <b>S</b>aturation, <b>E</b>rrors.</p><p>И четыре «золотых сигнала» Google SRE: latency, traffic, errors, saturation.</p>"},
   {h:"Перцентили, а не среднее",b:"<p>Среднее время ответа врёт. Если 95% запросов по 50 мс, а 5% по 10 секундам, среднее покажет ~550 мс — и никто не поймёт, что каждый двадцатый клиент страдает.</p><p>Смотри <b>p50 / p95 / p99</b>. SLO формулируют именно в перцентилях.</p>"}],
  ch:[
   {t:"q",q:"Нужно понять, на каком из 6 микросервисов теряется время в медленном запросе. Что используешь?",a:["Метрики","Логи","Распределённые трейсы","df -h"],c:2,why:"Трейс показывает span'ы по каждому сервису. Метрики скажут «медленно», трейс — «где именно»."},
   {t:"q",q:"Почему p99 важнее среднего времени ответа?",a:["Красивее график","Среднее прячет хвост: страдающее меньшинство пользователей не видно","p99 считается быстрее","Так принято"],c:1,why:"Хвостовые задержки бьют по самым активным пользователям. SLO пишут по перцентилям."},
   {t:"q",q:"Что означает RED в мониторинге сервиса?",a:["Red-Error-Debug","Rate, Errors, Duration","Reliability, Efficiency, Delivery","Regression Every Deploy"],c:1,why:"RED — минимальный набор дашборда для любого HTTP-сервиса. USE — для железа и ресурсов."}]},
 {id:"o2",t:"Prometheus и алерты",goal:"Настроить оповещения, которые не хочется отключить",
  cards:[
   {h:"Модель Prometheus",b:"<p>Prometheus сам <b>ходит и забирает</b> метрики (pull) с эндпоинта <code>/metrics</code>. Типы: counter (только растёт), gauge (скачет), histogram (распределение).</p><pre>rate(http_requests_total{status=~\"5..\"}[5m])\n/ rate(http_requests_total[5m]) > 0.05\n<span class='c'># доля 5xx больше 5% за 5 минут</span></pre><p><code>rate()</code> обязателен для counter — сырое значение растёт вечно и само по себе бессмысленно.</p>"},
   {h:"Алерты, которым верят",b:"<ul><li>Алерт должен быть <b>actionable</b>: если по нему нечего делать — это не алерт, а график.</li><li>Алертить по <b>симптомам для пользователя</b> (ошибки, латентность), а не по «CPU 80%».</li><li><code>for: 5m</code> — не будить из-за секундного всплеска.</li><li>Alert fatigue — главный враг: когда алертов много, их перестают читать, и настоящий инцидент теряется.</li></ul>"}],
  ch:[
   {t:"q",q:"Prometheus использует push или pull модель сбора?",a:["Push от приложений","Pull: сам скрейпит /metrics по расписанию","Оба всегда","Через syslog"],c:1,why:"Pull. Для коротких задач есть Pushgateway — но это исключение, а не норма."},
   {t:"q",q:"Какой алерт полезнее для дежурного?",a:["CPU > 80% пять минут","Доля 5xx > 5% в течение 5 минут","Диск заполнен на 60%","Перезапустился под"],c:1,why:"Симптом, который чувствует пользователь. Высокий CPU может быть нормой при штатной нагрузке."},
   {t:"q",q:"Зачем в PromQL функция rate() для counter?",a:["Ускоряет запрос","Counter монотонно растёт; rate даёт скорость изменения в секунду","Округляет","Фильтрует лейблы"],c:1,why:"И rate корректно обрабатывает перезапуск (сброс счётчика). Без rate график бесполезен."},
   {t:"q",q:"Команда отключила уведомления, потому что «алертов слишком много». Как чинить?",a:["Заставить читать","Убрать неактионабельные алерты, поднять пороги, добавить for и группировку — лечить alert fatigue","Добавить ещё алертов","Уволить дежурного"],c:1,why:"Качество важнее количества: каждый алерт — обещание, что по нему есть что сделать прямо сейчас."}]},
 {id:"o3",t:"SLI, SLO и инциденты",goal:"Говорить на языке бизнеса и надёжности",
  cards:[
   {h:"SLI / SLO / SLA / error budget",b:"<ul><li><b>SLI</b> — измеряемый показатель (доля успешных запросов).</li><li><b>SLO</b> — твоя внутренняя цель (99,9% за 30 дней).</li><li><b>SLA</b> — контракт с клиентом и деньги за нарушение.</li><li><b>Error budget</b> — разрешённое количество плохого. 99,9% = ~43 минуты в месяц. Бюджет потрачен → останавливаем фичи, чиним надёжность.</li></ul>"},
   {h:"Инцидент: роли и постмортем",b:"<p>Порядок: <b>обнаружили → стабилизировали → нашли причину → починили → написали постмортем</b>. Сначала вернуть сервис, потом расследовать.</p><p>Постмортем — <b>blameless</b>: ищем недостатки системы, а не виноватого. Итог — список конкретных задач с ответственными.</p><p><b>MTTR</b> (среднее время восстановления) важнее MTBF: сбои будут всегда, вопрос — как быстро ты возвращаешься.</p>"}],
  ch:[
   {t:"q",q:"SLO 99,9% в месяц. Сколько это примерно даунтайма?",a:["43 минуты","4 часа","7 часов","5 секунд"],c:0,why:"99,9% ≈ 43 мин/мес, 99,99% ≈ 4,3 мин, 99% ≈ 7,2 часа. Цифры полезно помнить наизусть."},
   {t:"q",q:"Error budget исчерпан в середине месяца. Что предлагает практика SRE?",a:["Игнорировать","Заморозить рискованные релизы и вложиться в надёжность","Понизить SLO","Уволить дежурного"],c:1,why:"Бюджет ошибок — объективный арбитр между скоростью фич и стабильностью."},
   {t:"q",q:"Что первое во время инцидента: найти причину или восстановить сервис?",a:["Найти причину","Восстановить сервис, потом расследовать","Написать постмортем","Сообщить в соцсетях"],c:1,why:"Mitigate first. Улики собираются параллельно: скриншоты графиков, логи, таймлайн."},
   {t:"q",q:"Что такое blameless postmortem?",a:["Разбор без указания виновных, фокус на дефектах системы и процессов","Разбор без документа","Отчёт для клиента","Собрание руководителей"],c:0,why:"Культура без обвинений даёт честные данные. Если наказывают — люди скрывают ошибки, и система не улучшается."}]}],
 boss:{t:"Ночной инцидент",intro:"Алерт: доля 5xx 12%. Ты — incident commander.",
  ch:[
  {t:"q",q:"Первые 5 минут инцидента. Что делаешь?",a:["Ищу первопричину в коде","Подтверждаю масштаб по дашборду, объявляю инцидент, стабилизирую (откат/скейл)","Пишу постмортем","Жду утра"],c:1,why:"Оценка влияния → коммуникация → митигация. Расследование — после стабилизации."},
  {t:"q",q:"5xx начались через 3 минуты после деплоя. Гипотеза номер один?",a:["Атака","Новый релиз — откатываем и проверяем, ушли ли ошибки","Проблема провайдера","Сломался DNS"],c:1,why:"Корреляция по времени с изменением — самая частая причина инцидентов. Первый вопрос всегда: «что менялось?»"},
  {t:"q",q:"Какую метрику покажешь бизнесу как «влияние на клиента»?",a:["CPU нод","Долю неуспешных запросов и рост p95 латентности за период инцидента","Число подов","Размер логов"],c:1,why:"Бизнес понимает «столько-то процентов пользователей не смогли оформить заказ», а не утилизацию CPU."},
  {t:"q",q:"Что обязательно попадёт в постмортем?",a:["Имя виноватого","Таймлайн, влияние, первопричина, что помешало заметить раньше, конкретные action items с владельцами","Только причина","Извинения"],c:1,why:"Отдельный ценный пункт — «почему не заметили раньше»: он улучшает мониторинг, а не только код."},
  {t:"q",q:"Как снизить MTTR на будущее?",a:["Больше алертов","Раннеры для отката одной кнопкой, runbook'и, тренировки инцидентов, хорошие дашборды","Меньше деплоев","Ничего"],c:1,why:"Быстрое восстановление — тренируемый навык и инфраструктура, а не героизм дежурного."}]}},

{id:"cloudsec",n:"Облако, безопасность, собеседование",ic:"⛨",tag:"Финишная прямая",
 desc:"Облачная модель, базовая безопасность и подготовка к интервью на middle.",
 miss:[
 {id:"s1",t:"Облако по-инженерному",goal:"Понимать модель ответственности и стоимость",
  cards:[
   {h:"IaaS / PaaS / SaaS и общая ответственность",b:"<p><b>IaaS</b> — тебе дают ВМ и сеть, всё остальное твоё. <b>PaaS</b> — управляемая БД, managed Kubernetes: провайдер держит платформу. <b>SaaS</b> — готовый продукт.</p><p><b>Shared responsibility:</b> облако отвечает за безопасность <i>самого</i> облака (железо, гипервизор), ты — за безопасность <i>в</i> облаке (доступы, настройки, данные, патчи ОС в IaaS).</p>"},
   {h:"Сеть и деньги",b:"<ul><li><b>VPC</b>: приватные подсети для приложений и БД, публичные — только для балансировщиков. БД никогда не смотрит в интернет.</li><li>Security groups — фаервол на уровне ресурса; принцип наименьших привилегий.</li><li><b>FinOps</b>: теги на ресурсы, автоудаление неиспользуемых дисков и снапшотов, spot/preemptible для стейджинга и CI, автоскейлинг вниз ночью.</li></ul>"}],
  ch:[
   {t:"q",q:"Managed Kubernetes у облачного провайдера — за что отвечаешь ты?",a:["Ни за что","За control plane","За рабочие нагрузки, конфигурацию, доступы и данные; провайдер — за control plane","За железо"],c:2,why:"Модель разделяемой ответственности — типичный вопрос собеседования на middle."},
   {t:"q",q:"Где должна находиться production-БД в VPC?",a:["В публичной подсети с публичным IP","В приватной подсети без публичного адреса, доступ через security group и bastion/туннель","На том же хосте, что и балансировщик","В интернете с паролем"],c:1,why:"Публичный IP у БД — прямая дорога к утечке. Доступ — только изнутри сети или через SSH-туннель."},
   {t:"q",q:"Счёт за облако вырос вдвое. С чего начнёшь?",a:["Отключить прод","Разметить ресурсы тегами и найти крупнейшие статьи: неиспользуемые диски, снапшоты, трафик, переразмеренные ноды","Сменить провайдера","Уменьшить логи"],c:1,why:"Сначала видимость (теги + отчёты), потом действия. Обычно 80% экономии дают 3-4 находки."}]},
 {id:"s2",t:"Безопасность в потоке работы",goal:"Не стать причиной утечки",
  cards:[
   {h:"Практики, которые от тебя ждут",b:"<ul><li><b>Секреты</b> — только в менеджере (Vault, облачный secrets manager, sealed-secrets). Никогда в git, образах и переменных Dockerfile.</li><li><b>Наименьшие привилегии</b> — отдельные роли для CI, для человека, для сервиса. Никакого общего admin-ключа.</li><li><b>Ротация</b> ключей и коротко живущие токены (OIDC вместо статических ключей в CI).</li><li><b>Сканирование</b>: образов (trivy), зависимостей (dependabot), кода на секреты (gitleaks).</li><li><b>Патчи и базовые образы</b> — регулярное обновление, а не «работает, не трогай».</li></ul>"},
   {h:"Контейнерная гигиена",b:"<ul><li>non-root пользователь, read-only файловая система, drop всех capabilities.</li><li>Минимальная база (alpine/distroless) — меньше пакетов, меньше CVE.</li><li>В Kubernetes: NetworkPolicy (по умолчанию сеть плоская — все ходят ко всем!), RBAC вместо cluster-admin всем подряд.</li></ul>"}],
  ch:[
   {t:"q",q:"Как CI должен получать доступ к облаку без статических ключей?",a:["Ключ в переменной навсегда","OIDC/federated-идентичность с короткоживущими токенами","Общий admin-ключ","Пароль в коде"],c:1,why:"Статический ключ утекает и живёт вечно. OIDC-федерация — современный стандарт для GitHub Actions/GitLab CI."},
   {t:"q",q:"В Kubernetes по умолчанию любой под может обратиться к любому другому. Чем ограничить?",a:["Ingress","NetworkPolicy","ResourceQuota","PodDisruptionBudget"],c:1,why:"NetworkPolicy — сегментация внутри кластера. Требует поддерживающего CNI (Calico, Cilium)."},
   {t:"q",q:"Обнаружен критичный CVE в базовом образе, который используют 20 сервисов. Действия?",a:["Игнорировать","Обновить базовый образ централизованно, пересобрать и выкатить, проверить сканером","Отключить сканер","Переписать приложение"],c:1,why:"Отсюда и практика общего базового образа: одно исправление закрывает весь парк."}]},
 {id:"s3",t:"Подготовка к собеседованию",goal:"Уметь рассказать, а не только сделать",
  cards:[
   {h:"Структура ответа STAR",b:"<p><b>S</b>ituation — контекст. <b>T</b>ask — что требовалось. <b>A</b>ction — что сделал именно ты. <b>R</b>esult — измеримый итог.</p><p>«Пайплайн собирался 40 минут (S/T). Я закэшировал зависимости, распараллелил тесты и перевёл сборку на multi-stage (A). Стало 9 минут, деплоев в день стало втрое больше (R)».</p><p>Цифры важнее прилагательных. Всегда добавляй результат в числах.</p>"},
   {h:"Что спрашивают на middle DevOps",b:"<ul><li>Linux: диагностика, права, процессы, диск, сеть.</li><li>Сети: путь запроса, 502 vs 504, DNS, TLS.</li><li>Docker: слои, multi-stage, отличие от ВМ, безопасность.</li><li>Kubernetes: объекты, probes, ресурсы, отладка пода, откат.</li><li>CI/CD: устройство пайплайна, стратегии деплоя, секреты.</li><li>IaC: state, идемпотентность, plan/apply.</li><li>Мониторинг: RED, перцентили, алерты, SLO.</li><li>Поведенческое: инцидент, конфликт с разработчиками, самая дорогая ошибка.</li></ul>"},
   {h:"Твой козырь — пет-проект",b:"<p>К собеседованию собери один сквозной проект и умей рассказать по нему всё: приложение → Dockerfile (multi-stage) → GitHub Actions → registry → Terraform для инфраструктуры → Kubernetes-манифесты или compose → Prometheus + Grafana → README с архитектурной схемой.</p><p>Это закрывает половину вопросов интервью: ты отвечаешь примерами из своего кода, а не пересказом статей.</p>"}],
  ch:[
   {t:"q",q:"«Расскажите о своей самой большой ошибке» — что хочет услышать интервьюер?",a:["Что ошибок не было","Конкретную ошибку, как её обнаружили, как чинили и что изменили в системе, чтобы не повторилась","Ошибку коллеги","Что виновата компания"],c:1,why:"Оценивают зрелость и способность к системным выводам. Ответ «ошибок не было» читается как отсутствие опыта или честности."},
   {t:"q",q:"Как правильно закончить ответ по STAR?",a:["Извинением","Измеримым результатом: время сборки, доступность, стоимость, число инцидентов","Шуткой","Перечислением технологий"],c:1,why:"Цифры делают историю проверяемой и запоминающейся."},
   {t:"q",q:"Не знаешь ответа на технический вопрос. Лучшая стратегия?",a:["Выдумать","Сказать, что не работал с этим, объяснить, как стал бы разбираться, и провести аналогию с известным","Промолчать","Сменить тему"],c:1,why:"Честность + ход мыслей ценятся выше зазубренного ответа. Выдумка вскрывается следующим уточняющим вопросом."}]}],
 boss:{t:"Финальное собеседование: Middle DevOps",intro:"Технический раунд. Восемь вопросов из всех областей. Проходной балл — 7 из 8.",hp:2,
  ch:[
  {t:"q",q:"Опишите путь HTTP-запроса от браузера до вашего приложения в Kubernetes.",a:["Браузер → приложение","DNS → LB/Ingress Controller → Service → Pod, с TLS-терминацией на входе","Браузер → etcd → Pod","Через kubelet напрямую"],c:1,why:"Умение развернуть цепочку и назвать место, где может сломаться, — половина технического интервью."},
  {t:"q",q:"Под перезапускается каждые 30 секунд. План диагностики?",a:["Увеличить реплики","logs --previous → describe (Events) → проверить probes, limits (OOMKilled), зависимости","Перезагрузить ноду","Удалить неймспейс"],c:1,why:"Ценят структуру диагностики, а не угадывание."},
  {t:"q",q:"Чем контейнер отличается от ВМ — коротко и точно.",a:["Контейнер меньше","Контейнер — изолированный процесс на ядре хоста (namespaces + cgroups); ВМ несёт своё ядро и ОС","Контейнер быстрее грузится","Разницы нет"],c:1,why:"Формулировка через namespaces/cgroups сразу выдаёт понимание, а не заученность."},
  {t:"q",q:"Как обеспечить деплой без даунтайма?",a:["Деплоить ночью","Rolling update с readiness-пробами, maxUnavailable=0, обратносовместимые миграции и план отката","Останавливать сервис","Больше реплик"],c:1,why:"Полный ответ включает и БД-миграции — про них забывают, и это отличает middle от junior."},
  {t:"q",q:"Где хранить секреты приложения в проде?",a:["В git","В secrets manager/Vault с ротацией, доставка в рантайме, доступ по ролям","В Dockerfile","В переменных образа"],c:1,why:"И упомянуть, что k8s Secret — base64, а не шифрование."},
  {t:"q",q:"Terraform: зачем remote state и блокировка?",a:["Для скорости","Общее состояние для команды, защита от параллельного apply, безопасное хранение чувствительных данных","Требование провайдера","Для бэкапа"],c:1,why:"State — сердце Terraform. Вопрос про него звучит почти всегда."},
  {t:"q",q:"Какие метрики положишь на дашборд нового сервиса?",a:["CPU и память","RED: rate, errors, duration (p50/p95/p99) + сатурация ресурсов и бизнес-метрика","Только логи","Число деплоев"],c:1,why:"Начинать с пользовательских симптомов, а потом идти к ресурсам — признак зрелого подхода."},
  {t:"q",q:"Разработчики просят прямой доступ к проду. Твоя позиция?",a:["Дать admin всем","Предложить безопасный путь: read-only доступ к логам/метрикам, ограниченный RBAC, аудит, self-service через пайплайн","Отказать без объяснений","Игнорировать"],c:1,why:"Проверяют софт-скиллы: DevOps — про сотрудничество и снятие блокеров, а не про охрану ворот."}]}}
];
