{id:"c1",t:"Зачем нужен конвейер",goal:"Понимать смысл, а не только синтаксис YAML",
 cards:[
 {h:"CI, Delivery, Deployment",b:"<div class='tw'><table><tr><th>термин</th><th>что означает</th></tr><tr><td><b>CI</b> — непрерывная интеграция</td><td>каждый push автоматически собирается и проходит тесты; поломка видна за минуты, а не за неделю</td></tr><tr><td><b>Continuous Delivery</b></td><td>артефакт всегда готов к выкатке, но кнопку жмёт человек</td></tr><tr><td><b>Continuous Deployment</b></td><td>зелёный пайплайн едет на прод сам</td></tr></table></div><p>Разницу между двумя CD спрашивают почти на каждом собеседовании — она в наличии ручного гейта.</p>"},
 {h:"Типовой конвейер",b:"<pre>lint → test → build → scan → publish → deploy(staging) → deploy(prod)</pre><p>Три принципа, определяющие порядок:</p><ul><li><b>Быстрая обратная связь.</b> Дешёвые проверки первыми: линтер за 8 секунд отсекает то, ради чего не стоит собирать образ.</li><li><b>Fail fast.</b> Упало — останавливаемся, а не идём дальше «на всякий случай».</li><li><b>Build once, deploy everywhere.</b> Артефакт собирается <b>один раз</b> и продвигается по средам. Отличается только конфигурация.</li></ul>"},
 {h:"Почему нельзя пересобирать под каждую среду",b:"<p>Если образ для staging и prod собираются отдельно, это <b>два разных артефакта</b>: другая версия зависимости, другой порядок сборки, другой базовый слой, обновившийся за час.</p><p>Тестировали одно — выкатили другое. Гарантия «протестировано» исчезает, а фраза «на стейдже работало» становится постоянной.</p><p>Практика: собрали <code>app:1a2b3c4</code>, прогнали тесты, выкатили <b>этот же</b> образ на staging, затем <b>этот же</b> на prod.</p>"},
 {h:"Из чего состоит пайплайн",b:"<ul><li><b>Триггер</b> — что запускает: push, PR, тег, расписание, ручной запуск</li><li><b>Раннер (agent)</b> — машина или контейнер, где выполняются шаги</li><li><b>Стадии и job'ы</b> — job'ы одной стадии обычно идут параллельно</li><li><b>Артефакты</b> — то, что передаётся дальше или сохраняется для человека</li><li><b>Секреты</b> — токены и ключи, доступные шагам, но не видимые в логах</li></ul><p>Шаг считается упавшим по <b>ненулевому коду возврата</b> — тому самому <code>$?</code> из bash. Вся автоматизация держится на этом соглашении.</p>"}],
 ch:[
 {t:"o",d:1,q:"Расставь стадии типового пайплайна в разумном порядке.",items:["lint — статический анализ","test — автотесты","build — сборка образа","scan — проверка уязвимостей","deploy на staging","deploy на production"],why:"Дешёвое и быстрое — раньше. Нет смысла собирать образ, если код не проходит линтер."},
 {t:"q",d:2,q:"В чём разница между Continuous Delivery и Continuous Deployment?",a:["Ни в чём","Delivery — артефакт готов к выкатке, деплой запускает человек; Deployment — выкатывается автоматически","Delivery только для фронтенда","Deployment дешевле"],c:1,why:"Точный ответ на этот вопрос сразу отличает подготовленного кандидата от заучившего термины."},
 {t:"q",d:3,q:"Как CI понимает, что шаг упал?",a:["По тексту в логах","По ненулевому коду возврата команды","По времени выполнения","По наличию файлов"],c:1,why:"Отсюда практическое следствие: команда, которая молча возвращает 0 при ошибке (например, пайп без pipefail), делает шаг зелёным при реальном провале."},
 {t:"q",d:4,q:"Почему образ нельзя пересобирать отдельно для staging и prod?",a:["Долго и дорого","Это разные артефакты: тестировали один, выкатили другой — гарантия тестирования теряется","Не позволяет реестр","Ломается кэш"],c:1,why:"Build once, deploy everywhere. Между средами меняется только конфигурация, передаваемая переменными окружения."},
 {t:"q",d:4,q:"Команда предлагает убрать тесты из пайплайна, потому что «они долгие и мешают релизить». Что ответить?",a:["Согласиться, скорость важнее","Предложить ускорить: кэш зависимостей, параллельные job'ы, разделение на быстрые и медленные наборы — убирать проверку ради скорости значит терять то, ради чего строился CI","Запустить тесты только ночью","Оставить только линтер"],c:1,why:"Медленный пайплайн — техническая проблема с техническим решением. Отключённые тесты возвращаются инцидентами на проде."},
 {t:"q",d:5,q:"<b>Инцидент.</b> Тест падает только в CI, локально всё зелёное. Разработчик третий раз нажимает «перезапустить», и на четвёртый прогон становится зелёным. Что происходит и что делать?",a:["CI нестабилен, надо просто перезапускать","Это flaky-тест: зависимость от порядка выполнения, времени, сети или общего состояния — его нужно найти и починить, а не перезапускать","Проблема в раннере, сменить его","Отключить этот тест"],c:1,why:"Привычка «перезапустить и надеяться» разрушает доверие к пайплайну: когда красный не означает поломку, настоящую поломку тоже пропустят."}]},

{id:"c2",t:"GitHub Actions",goal:"Написать рабочий workflow руками",
 cards:[
 {h:"Структура файла",b:"<pre>name: ci\non:\n  push:\n    branches: [main]\n  pull_request:\n\njobs:\n  test:\n    runs-on: ubuntu-latest\n    steps:\n      - uses: actions/checkout@v4\n      - uses: actions/setup-node@v4\n        with:\n          node-version: '20'\n          cache: 'npm'\n      - run: npm ci\n      - run: npm test</pre><p>Иерархия: <b>workflow</b> → <b>jobs</b> (по умолчанию параллельны, каждый на своей чистой машине) → <b>steps</b> (последовательны, в общей файловой системе).</p><p>Файлы лежат в <code>.github/workflows/</code>. Каждый job начинается с чистого раннера — поэтому <code>checkout</code> нужен в каждом.</p>"},
 {h:"Зависимости между job'ами",b:"<pre>jobs:\n  test:\n    runs-on: ubuntu-latest\n    steps: [...]\n  build:\n    needs: test\n    runs-on: ubuntu-latest\n    steps: [...]\n  deploy:\n    needs: [test, build]\n    if: github.ref == 'refs/heads/main'\n    environment: production</pre><p><code>needs</code> строит граф выполнения. Без него job'ы стартуют одновременно, и деплой может уехать раньше тестов.</p><p><code>if</code> ограничивает условия запуска, <code>environment</code> подключает защищённое окружение с ручным подтверждением и своими секретами.</p>"},
 {h:"Секреты",b:"<pre>      - run: docker login -u ci -p \"$TOKEN\" registry.company.ru\n        env:\n          TOKEN: ${{ secrets.REGISTRY_TOKEN }}</pre><ul><li>секреты хранятся в настройках репозитория или организации</li><li>в логах маскируются автоматически</li><li>не доступны в workflow, запущенных из форков — защита от кражи через PR</li></ul><p><b>Лучшая практика вместо статических ключей:</b> OIDC-федерация. Пайплайн получает короткоживущий токен облака под свою идентичность — красть нечего, срок жизни минуты.</p>"},
 {h:"Матрица и кэш",b:"<pre>strategy:\n  fail-fast: false\n  matrix:\n    node: [18, 20, 22]\n\nsteps:\n  - uses: actions/cache@v4\n    with:\n      path: ~/.npm\n      key: npm-${{ hashFiles('**/package-lock.json') }}</pre><p>Матрица превращает один job в несколько параллельных — проверка совместимости без роста времени.</p><p><b>Ключ кэша обязан зависеть от lock-файла.</b> Иначе получишь протухший кэш и невоспроизводимые сборки, которые невозможно объяснить.</p>"}],
 ch:[
 {t:"f",d:1,q:"Допиши ключ, задающий, на каком раннере выполняется job.",pre:"jobs:\n  build:\n    ___: ubuntu-latest\n    steps:\n      - uses: actions/checkout@v4",ans:["runs-on"],hint:"runs-...",why:"runs-on выбирает раннер: ubuntu-latest, self-hosted или лейбл своей группы."},
 {t:"q",d:2,q:"Job deploy должен запускаться только после успешного test. Какой ключ?",a:["after","needs: test","depends","waitFor"],c:1,why:"needs строит граф. Без него job'ы стартуют параллельно, и деплой может обогнать тесты."},
 {t:"q",d:3,q:"Почему в каждом job'е нужен <code>actions/checkout</code>, даже если предыдущий job уже клонировал код?",a:["Это перестраховка","Каждый job выполняется на отдельной чистой машине — файлы предыдущего job'а недоступны","checkout кэширует репозиторий","Так требует GitHub"],c:1,why:"Отсюда и роль артефактов: передать файлы между job'ами можно только через upload/download artifact или реестр."},
 {t:"q",d:3,q:"Что должно входить в ключ кэша зависимостей?",a:["Дата","Хеш lock-файла","Всегда имя ветки","Ничего, ключ может быть постоянным"],c:1,why:"Изменился lock — новый кэш; не изменился — мгновенное восстановление. Постоянный ключ рано или поздно даст протухшие зависимости."},
 {t:"q",d:4,q:"Как пайплайну получить доступ к облаку без вечных ключей в секретах?",a:["Класть ключ в секреты и менять раз в год","OIDC-федерация: пайплайн обменивает свою идентичность на короткоживущий токен","Хранить ключ в приватном репозитории","Использовать переменные окружения раннера"],c:1,why:"Статический ключ утекает один раз и живёт вечно. Короткоживущий токен, привязанный к конкретному репозиторию и ветке, обесценивает саму кражу."},
 {t:"q",d:5,q:"<b>Инцидент.</b> Внешний контрибьютор открыл PR, workflow запустился и упал на шаге деплоя с ошибкой доступа. Коллега предлагает «выдать секреты и для форков, чтобы не падало». Что ответить?",a:["Согласиться, так удобнее","Это дыра: любой сможет прислать PR, который распечатает секреты; правильно — не запускать деплой на PR из форков и разделить workflow на проверку и выкатку","Запретить внешние PR","Хранить секреты в коде репозитория"],c:1,why:"Ограничение секретов для форков — намеренная защита. Пайплайн для PR должен только проверять, а деплоить — отдельный workflow по push в main или по тегу."}]},

{id:"c3",t:"GitLab CI",goal:"Читать и писать пайплайны второго распространённого формата",
 cards:[
 {h:"gitlab-ci.yml",b:"<pre>stages: [test, build, deploy]\n\nvariables:\n  IMAGE: $CI_REGISTRY_IMAGE:$CI_COMMIT_SHA\n\ntest:\n  stage: test\n  image: node:20-alpine\n  script:\n    - npm ci\n    - npm test\n  cache:\n    key:\n      files: [package-lock.json]\n    paths: [node_modules/]\n\ndeploy:prod:\n  stage: deploy\n  script: ./deploy.sh\n  when: manual\n  only: [tags]</pre><p>Отличие от Actions: стадии объявляются явно в <code>stages</code>, а каждый job указывает свою через <code>stage</code>.</p>"},
 {h:"rules — управление запуском",b:"<pre>deploy:prod:\n  rules:\n    - if: '$CI_COMMIT_TAG =~ /^v/'\n      when: manual\n    - if: '$CI_COMMIT_BRANCH == \"main\"'\n      when: on_success\n    - when: never</pre><p><code>rules</code> проверяются сверху вниз, срабатывает первое совпадение. Финальное <code>when: never</code> — явный запрет во всех остальных случаях: без него легко получить деплой из случайной ветки.</p><p><code>rules: changes:</code> запускает job только если менялись определённые файлы — экономит время в монорепозитории.</p>"},
 {h:"needs против dependencies",b:"<div class='tw'><table><tr><th>ключ</th><th>про что</th></tr><tr><td><code>needs</code></td><td>порядок выполнения: job стартует, не дожидаясь всей предыдущей стадии (DAG)</td></tr><tr><td><code>dependencies</code></td><td>какие артефакты скачать из предыдущих job'ов</td></tr></table></div><p>Их постоянно путают. <code>needs</code> ускоряет пайплайн, превращая лестницу в граф; <code>dependencies</code> экономит трафик, не скачивая лишние артефакты.</p>"},
 {h:"Раннеры и исполнители",b:"<ul><li><b>shared</b> — общие раннеры провайдера, быстрый старт</li><li><b>self-hosted</b> — свои: нужны для доступа во внутреннюю сеть, особого железа и контроля над данными</li></ul><p>Исполнители: <b>shell</b> (просто, но состояние накапливается между запусками — источник загадочных багов), <b>docker</b> (чистое окружение каждый раз, рекомендуется), <b>kubernetes</b> (масштабируется сам).</p><p>Свой раннер — это сервер, который ты патчишь, изолируешь и мониторишь. Особенно осторожно с privileged-режимом.</p>"},
 {h:"Шаблоны и переиспользование",b:"<pre>include:\n  - project: 'devops/ci-templates'\n    file: '/docker.yml'\n\n.build-base:\n  stage: build\n  image: docker:24\n\nbuild:app:\n  extends: .build-base\n  variables: { IMAGE_NAME: app }</pre><p>Job'ы, начинающиеся с точки, — скрытые: сами не выполняются, служат основой для <code>extends</code>.</p><p>Централизованные шаблоны — способ привести к одному стандарту десятки репозиториев одной правкой.</p>"}],
 ch:[
 {t:"q",d:1,q:"Что делает <code>when: manual</code> у job'а?",a:["Запускает автоматически","Job ждёт нажатия кнопки человеком","Отключает job","Запускает по расписанию"],c:1,why:"Ручной гейт — это и есть отличие Continuous Delivery от Deployment. Плюс защищённые окружения ограничивают, кто вправе нажать."},
 {t:"q",d:2,q:"Чем <code>needs</code> отличается от <code>dependencies</code>?",a:["Ничем","needs задаёт порядок выполнения и позволяет стартовать раньше; dependencies указывает, какие артефакты скачать","needs только для деплоя","dependencies работает быстрее"],c:1,why:"Частый вопрос на собеседовании по GitLab CI: путаница выдаёт поверхностное знакомство."},
 {t:"q",d:3,q:"Зачем в конце списка <code>rules</code> писать <code>- when: never</code>?",a:["Для читаемости","Явно запретить запуск во всех неперечисленных случаях — иначе job может сработать там, где не ждали","Ускоряет пайплайн","Обязательно синтаксически"],c:1,why:"Безопасность по умолчанию: белый список правил и явный запрет всего остального. Особенно важно для job'ов деплоя."},
 {t:"q",d:3,q:"Почему shell-исполнитель раннера считается менее надёжным, чем docker?",a:["Он медленнее","Состояние накапливается между запусками: остатки предыдущих сборок влияют на следующие и дают невоспроизводимые результаты","Он не поддерживает кэш","Требует больше памяти"],c:1,why:"Docker-исполнитель даёт чистое окружение на каждый прогон — воспроизводимость перевешивает небольшой оверхед."},
 {t:"q",d:4,q:"Один и тот же блок сборки скопирован в 12 репозиториев. Как навести порядок?",a:["Оставить как есть, так проще","Вынести в общий репозиторий шаблонов и подключать через include/extends","Написать скрипт копирования","Объединить всё в монорепо"],c:1,why:"Одна правка обновляет все проекты. Плюс единый стандарт качества: сканирование, кэш и теги настроены одинаково везде."},
 {t:"q",d:5,q:"<b>Инцидент.</b> Job деплоя на прод неожиданно запустился из ветки разработчика и выкатил незаконченный код. В конфиге было <code>only: [main]</code>, но кто-то заменил его на <code>rules</code> с одним условием и без <code>when: never</code>. Что произошло и как защититься?",a:["Ошибка GitLab","Правила без финального запрета оставили поведение по умолчанию, и job сработал вне ожидаемых условий; защита — явный when: never, защищённое окружение с ручным подтверждением и деплой только по тегу","Нужно было использовать only","Виноват разработчик, достаточно выговора"],c:1,why:"Технические ограничения надёжнее договорённостей: три независимых барьера (правила, окружение с апрувом, триггер по тегу) не отключаются случайной правкой одной строки."}]},

{id:"c4",t:"Артефакты, кэш и скорость",goal:"Сделать пайплайн быстрым и воспроизводимым",
 cards:[
 {h:"Артефакт — не кэш",b:"<div class='tw'><table><tr><th></th><th>артефакт</th><th>кэш</th></tr><tr><td>смысл</td><td>результат работы</td><td>ускоритель</td></tr><tr><td>потеря</td><td>критична</td><td>безболезненна</td></tr><tr><td>примеры</td><td>собранный бинарь, отчёт о тестах, coverage</td><td>node_modules, ~/.m2, слои сборки</td></tr></table></div><p>Путать их опасно: артефакт, положенный в кэш, однажды исчезнет ровно в тот момент, когда понадобится для расследования.</p>"},
 {h:"Отчёты в интерфейсе",b:"<pre>artifacts:\n  when: always\n  reports:\n    junit: report.xml\n    coverage_report:\n      coverage_format: cobertura\n      path: coverage.xml</pre><p><code>when: always</code> важен: отчёт нужен именно тогда, когда job упал.</p><p>Упавшие тесты и изменение покрытия показываются прямо в merge request — ревьюер видит результат, не открывая логи. Туда же встают отчёты сканеров безопасности.</p>"},
 {h:"Чем ускоряют пайплайн",b:"<p>По убыванию эффекта:</p><ol><li><b>Кэш зависимостей</b> — обычно самая долгая стадия</li><li><b>Параллельные job'ы и матрицы</b> вместо последовательной лестницы</li><li><b>Разделение тестов</b> на быстрые (на каждый push) и медленные (перед мержем или ночью)</li><li><b>Сборка только изменённых сервисов</b> в монорепозитории (<code>rules: changes</code>)</li><li><b>Кэш слоёв образа</b> через <code>--cache-from</code></li></ol><p>Начинать надо с измерения: смотри длительность каждой стадии, а не улучшай наугад.</p>"},
 {h:"Сборка образов внутри CI",b:"<div class='tw'><table><tr><th>способ</th><th>цена</th></tr><tr><td>проброс <code>/var/run/docker.sock</code></td><td>просто, но даёт раннеру фактический root на хосте — недопустимо на общих раннерах</td></tr><tr><td>DinD (docker:dind)</td><td>изолированнее, но требует privileged и теряет кэш</td></tr><tr><td>kaniko / buildah</td><td>без демона и привилегий — рекомендуемый вариант в Kubernetes</td></tr></table></div><pre>build:\n  image: gcr.io/kaniko-project/executor:debug\n  script:\n    - /kaniko/executor --context $CI_PROJECT_DIR\n        --destination $CI_REGISTRY_IMAGE:$CI_COMMIT_SHA</pre>"}],
 ch:[
 {t:"q",d:1,q:"Отчёт о тестах нужно скачать после падения пайплайна. Куда его класть?",a:["В кэш","В артефакты с when: always","В логи","В git"],c:1,why:"Кэш эфемерен и общий; артефакты привязаны к конкретному прогону. Без when: always отчёт не сохранится именно при падении."},
 {t:"q",d:2,q:"Пайплайн занимает 25 минут. С чего начать оптимизацию?",a:["Купить более мощный раннер","Измерить длительность стадий, затем кэшировать зависимости и распараллелить независимые job'ы","Убрать линтер","Деплоить реже"],c:1,why:"Оптимизация без измерения — угадывание. Обычно львиную долю съедает установка зависимостей и последовательные тесты."},
 {t:"q",d:3,q:"Почему проброс docker.sock в раннер — плохая идея на общих раннерах?",a:["Медленно работает","Доступ к сокету равен правам root на хосте: чужой пайплайн может захватить машину раннера","Не поддерживается новыми версиями","Требует лицензии"],c:1,why:"Поэтому в Kubernetes-раннерах собирают через kaniko или buildah — без демона и без привилегированного режима."},
 {t:"q",d:3,q:"Что даёт публикация junit-отчёта в артефактах?",a:["Ускоряет тесты","Показывает упавшие тесты прямо в merge request, где принимается решение о слиянии","Хранит логи навсегда","Запускает тесты повторно"],c:1,why:"Обратная связь там, где она нужна. Логи открывают, только когда отчёта недостаточно."},
 {t:"q",d:4,q:"В монорепозитории из 20 сервисов пайплайн собирает все при любом изменении. Что сделать?",a:["Разделить на 20 репозиториев","Запускать job'ы по условию изменений (rules: changes) и кэшировать общее — собирать только затронутые сервисы","Собирать раз в день","Увеличить число раннеров"],c:1,why:"Разделение репозиториев — большое организационное решение с своей ценой. Условные запуски дают основной выигрыш почти бесплатно."},
 {t:"q",d:5,q:"<b>Инцидент.</b> Сборка стала «случайно» падать на разных проектах: то не находится модуль, то версия библиотеки не та. Кэш настроен с постоянным ключом <code>cache-node</code>. Что произошло?",a:["Проблемы с сетью","Протухший кэш: ключ не зависит от lock-файла, поэтому в кэше лежат зависимости от старой версии и смешиваются с новыми","Раннер перегружен","Ошибка в реестре пакетов"],c:1,why:"Ключ обязан зависеть от хеша lock-файла. Симптом «непонятные плавающие ошибки сборки» почти всегда указывает на кэш или на нечистое окружение раннера."}]},

{id:"c5",t:"Стратегии деплоя и откат",goal:"Выкатываться без даунтайма и уметь отступить",
 cards:[
 {h:"Четыре стратегии",b:"<div class='tw'><table><tr><th>стратегия</th><th>как работает</th><th>цена</th></tr><tr><td><b>Recreate</b></td><td>погасить старое, поднять новое</td><td>простой даунтайм</td></tr><tr><td><b>Rolling</b></td><td>заменять по одному экземпляру</td><td>одновременно живут две версии</td></tr><tr><td><b>Blue-Green</b></td><td>две среды, мгновенное переключение трафика</td><td>двойные ресурсы</td></tr><tr><td><b>Canary</b></td><td>5% трафика на новую версию, наблюдаем метрики</td><td>сложность маршрутизации</td></tr></table></div><p>Rolling — умолчание в Kubernetes. Canary — выбор для рискованных изменений: реальный трафик проверяет то, что не проверят тесты.</p>"},
 {h:"Две версии одновременно",b:"<p>При rolling и canary старая и новая версии работают <b>параллельно</b>. Значит, изменения должны быть обратно совместимы:</p><ul><li>API не удаляет и не переименовывает поля в том же релизе</li><li>очереди понимают оба формата сообщений</li><li>схема БД совместима с обеими версиями кода</li></ul><p>Игнорирование этого правила даёт ошибки ровно у части пользователей — тех, кто попал на другую версию.</p>"},
 {h:"Миграции БД: expand → migrate → contract",b:"<ol><li><b>Expand.</b> Добавили новую колонку, код пишет в обе.</li><li><b>Migrate.</b> Перенесли данные, код читает из новой.</li><li><b>Contract.</b> Через релиз-другой удалили старую колонку.</li></ol><p><b>Никогда не удаляй колонку в том же релизе, что и код.</b> Иначе откат кода станет невозможен: данных уже нет.</p><p>Правило простое: код должен работать и со старой, и с новой схемой в момент выкатки.</p>"},
 {h:"Откат — часть плана",b:"<p>Если ты не знаешь, как откатить релиз, ты не готов его катить.</p><ul><li>образы помечены неизменяемым тегом (хеш коммита), не <code>latest</code></li><li>откат — одна команда или одна кнопка, отрепетированная заранее</li><li>миграции обратимы или обратно совместимы</li><li><b>feature flag</b> выключает функцию без выкатки вообще</li></ul><p>Feature flags разделяют <b>деплой</b> и <b>релиз</b>: код уезжает выключенным, включается отдельно и мгновенно гасится при проблемах.</p>"}],
 ch:[
 {t:"q",d:1,q:"Нужно проверить рискованное изменение на реальном трафике, но только на 5% пользователей. Какая стратегия?",a:["Recreate","Rolling","Canary","Blue-Green"],c:2,why:"Canary плюс наблюдение за метриками ошибок и латентности, плюс автоматический откат при деградации."},
 {t:"q",d:2,q:"Почему тег <code>latest</code> на проде — плохая идея?",a:["Длинное имя","Непонятно, какая версия реально работает, и невозможно воспроизвести откат","Занимает место","Медленно скачивается"],c:1,why:"Неизменяемые теги дают однозначную связь «контейнер ↔ код». Без неё расследование инцидента превращается в гадание."},
 {t:"q",d:3,q:"При rolling update старая и новая версии работают одновременно. Что это требует от изменений?",a:["Ничего особенного","Обратной совместимости: API, формат сообщений и схема БД должны понимать обе версии","Отключить старую версию заранее","Использовать только Recreate"],c:1,why:"Иначе ошибки получат ровно те пользователи, чьи запросы попали на «другую» версию — и воспроизвести это будет тяжело."},
 {t:"q",d:4,q:"Релиз включает удаление колонки в БД и код, который её больше не использует. Что не так?",a:["Ничего, всё согласовано","Откат кода станет невозможен: данных уже нет — миграции делают в три шага (expand → migrate → contract)","Слишком долго выполняется","Нужен даунтайм"],c:1,why:"Правило: код должен работать со старой и новой схемой одновременно. Удаление — отдельный релиз, когда откат к старому коду уже не нужен."},
 {t:"q",d:4,q:"Что такое feature flag и зачем он DevOps-инженеру?",a:["Флаг компилятора","Переключатель функции в рантайме: деплой и релиз разделяются, а откат функции не требует выкатки","Метка в git","Тип автотеста"],c:1,why:"Снижает риск любого релиза: код едет выключенным, включается на части пользователей и гасится мгновенно без пайплайна."},
 {t:"q",d:5,q:"<b>Инцидент.</b> Через три минуты после выкатки доля 5xx выросла до 12%. В релизе были и код, и миграция, добавляющая колонку. Порядок действий?",a:["Искать причину в логах, пока пользователи ждут","Немедленно откатить код на предыдущий образ (миграция добавляла колонку — она обратно совместима и откату не мешает), убедиться по метрикам, что ошибки ушли, и только потом расследовать","Откатить миграцию первой","Увеличить число реплик"],c:1,why:"Сначала стабилизация, потом расследование. Добавляющая миграция безопасна для отката — именно ради этого её и делают отдельно от удаляющей."}]},

{id:"c6",t:"Безопасность и качество пайплайна",goal:"Не превратить конвейер в дыру",
 cards:[
 {h:"Что проверяет зрелый пайплайн",b:"<div class='tw'><table><tr><th>проверка</th><th>инструмент</th><th>что ловит</th></tr><tr><td>секреты в коде</td><td>gitleaks, trufflehog</td><td>токены и пароли в коммитах</td></tr><tr><td>зависимости</td><td>dependabot, npm audit</td><td>известные уязвимости библиотек</td></tr><tr><td>образ</td><td>trivy, grype</td><td>CVE в системных пакетах базы</td></tr><tr><td>код</td><td>SAST-анализаторы</td><td>типовые уязвимые паттерны</td></tr><tr><td>инфраструктура</td><td>tfsec, checkov</td><td>публичные бакеты, открытые порты в IaC</td></tr></table></div><p><b>Shift left:</b> чем раньше найдена проблема, тем дешевле её исправить. Найденная на проде стоит в сотни раз дороже найденной в PR.</p>"},
 {h:"Секреты в пайплайне",b:"<ul><li>только из хранилища секретов, никогда из кода</li><li>маскирование в логах — обязательно, но не гарантия: <code>echo $TOKEN | base64</code> обойдёт его</li><li>минимальные права: токен только на нужный реестр и только на push</li><li>ротация и короткий срок жизни; в идеале — OIDC вместо статических ключей</li></ul><p><b>Если секрет засветился в логе — он скомпрометирован.</b> Порядок: сначала ротация, потом чистка логов. Логи хранятся в кэшах, форках и глазах людей.</p>"},
 {h:"Гейты перед продом",b:"<ul><li>обязательный зелёный CI и ревью перед merge (branch protection)</li><li>ручное подтверждение прод-деплоя через защищённое окружение — с аудитом, кто и когда одобрил</li><li>smoke-тесты <b>после</b> выкатки: деплой заканчивается не словом «выкачено», а подтверждением здоровья</li><li>автоматический откат при деградации метрик</li></ul>"},
 {h:"Итоговый конвейер проекта",b:"<pre>PR:      lint → unit → build → scan → ephemeral-окружение → e2e\nmain:    build app:$SHA → push → deploy staging → smoke\ntag v*:  ручной аппрув → canary 10% → метрики → 100%\n                     → при деградации автооткат</pre><p>Обрати внимание: образ собирается один раз на этапе main и дальше только продвигается. Ephemeral-окружение для PR — временный стенд, который удаляется после слияния (иначе счёт за облако растёт незаметно).</p>"}],
 ch:[
 {t:"q",d:1,q:"Что означает принцип shift left в безопасности?",a:["Сдвигать релизы влево по календарю","Находить проблемы как можно раньше — в PR и в CI, а не на проде","Писать код левой рукой","Смещать нагрузку на левую половину кластера"],c:1,why:"Стоимость исправления растёт на порядки с каждым этапом. Автоматические проверки в PR — самая дешёвая точка."},
 {t:"q",d:2,q:"Зачем нужны gitleaks и trivy, если есть код-ревью?",a:["Для отчётности перед аудитом","Человек пропускает и не помнит все CVE; автоматика проверяет каждый коммит одинаково и без усталости","Требование закона","Ускоряют сборку"],c:1,why:"Ревью и автоматика решают разные задачи: человек оценивает замысел, инструмент — известные шаблоны и базы уязвимостей."},
 {t:"q",d:3,q:"Секрет случайно распечатался в логах пайплайна. Что делать в первую очередь?",a:["Удалить лог","Немедленно ротировать секрет, и только потом чистить логи и чинить причину","Ничего, логи приватные","Сделать репозиторий приватным"],c:1,why:"Логи копируются в кэши, уведомления и чужие глаза. Компрометация уже произошла — единственное реальное действие — сменить секрет."},
 {t:"q",d:3,q:"Пайплайн зелёный, деплой прошёл, но сервис не работает. Какого этапа не хватает?",a:["Ещё одного линтера","Проверки после выкатки: smoke-тестов и контроля метрик, с автоматическим откатом при деградации","Больше unit-тестов","Ручного тестирования"],c:1,why:"Деплой заканчивается подтверждением здоровья системы, а не фактом отправки манифеста. Иначе о проблеме сообщают пользователи."},
 {t:"q",d:4,q:"Какие права должен иметь токен, которым пайплайн публикует образ в реестр?",a:["Полные права администратора","Минимальные: push только в нужный репозиторий образов, без прав на удаление и на другие проекты","Права на чтение всего реестра","Права владельца организации"],c:1,why:"Принцип наименьших привилегий ограничивает ущерб при утечке. Токен с правами администратора превращает любую утечку в катастрофу."},
 {t:"q",d:5,q:"<b>Инцидент.</b> Злоумышленник открыл PR, который добавил в workflow шаг с отправкой переменных окружения на внешний адрес. Проверки прошли, но секреты не утекли. Почему и какие ещё барьеры должны быть?",a:["Повезло, барьеров не было","Секреты недоступны workflow из форков — это встроенная защита; дополнительно: обязательное ревью изменений в .github/workflows, запрет автозапуска для новых контрибьюторов, отдельный workflow для деплоя","Сработал антивирус","Сканер безопасности заблокировал шаг"],c:1,why:"Изменения в самом пайплайне — привилегированный код. Их ревьюят внимательнее обычного и защищают отдельными правилами (CODEOWNERS на каталог workflows)."}]}
);
/* =====================================================================
   ЛАБОРАТОРИИ — сценарии отладки в живом терминале
   ===================================================================== */
const LABS={};

LABS.disk={w:"linux",t:"Инцидент: диск заполнен",xp:70,
 brief:`Алерт: <code>DiskSpaceCritical /var 100%</code>. Приложение перестало писать логи и отдаёт ошибки. Найди, что съело место, освободи его — и убедись, что место реально вернулось.`,
 hint:`Порядок: <code>df -h</code> → <code>du -sh /var/log/*</code> → удалить старое → проверить <code>lsof</code> на удалённые файлы, которые всё ещё держит процесс.`,
 spec:{host:"app-01",user:"deploy",cwd:"/home/deploy",
  df:[{fs:"/dev/sda1",size:"40G",used:"12G",avail:"26G",pct:"32%",mnt:"/"},
      {fs:"/dev/sdb1",size:"20G",used:"20G",avail:"0",pct:"{{e|100%}}",mnt:"/var"}],
  du:{"/var/log/nginx":"312M","/var/log/journal":"820M","/var/log/app":"17G","/var/lib/docker":"1.4G"},
  fs:{"/var/log/app/app.log":{c:"2025-02-12 09:00 INFO старт\n2025-02-12 09:01 ERROR disk write failed: No space left on device",mode:"-rw-r--r--",own:"app app",size:412},
      "/var/log/app/app.log.1":{c:"старый лог",mode:"-rw-r--r--",own:"app app",size:5100000000},
      "/var/log/app/app.log.2":{c:"старый лог",mode:"-rw-r--r--",own:"app app",size:4900000000},
      "/var/log/app/debug-2024.log":{c:"дамп отладки",mode:"-rw-r--r--",own:"app app",size:6800000000},
      "/etc/logrotate.d/nginx":{c:"/var/log/nginx/*.log {\n  daily\n  rotate 14\n  compress\n}",own:"root root"},
      "/home/deploy/README":{c:"Дежурная смена. Логи приложения: /var/log/app",own:"deploy deploy"}},
  ps:[{pid:711,user:"root",cmd:"/usr/sbin/nginx -g daemon off;",cpu:"0.3",mem:"0.6"},
      {pid:902,user:"app",cmd:"/opt/app/bin/api --port 8080",cpu:"2.1",mem:"4.2"}],
  svc:{app:{state:"active",pid:902,desc:"API service",port:8080,exec:"/opt/app/bin/api --port 8080",
        log:["09:01 ERROR write /var/log/app/app.log: no space left on device"]},
       nginx:{state:"active",pid:711,desc:"nginx web server",port:80}},
  ports:[{proto:"tcp",port:80,pid:711,proc:"nginx"},{proto:"tcp",port:8080,pid:902,proc:"api"}],
  extra:{deleted:[{proc:"api",pid:902,size:"3221225472",path:"/var/log/app/old-trace.log"}]}},
 after(ctx){
   let freed=0;
   ["/var/log/app/app.log.1","/var/log/app/app.log.2","/var/log/app/debug-2024.log"].forEach(p=>{if(ctx.fs[p]===undefined)freed+=5.5});
   if(ctx.flags["restart:app"]&&ctx.extra.deleted.length){ctx.extra.deleted=[];freed+=3;ctx.flags.releasedDeleted=true}
   const used=Math.max(2,20-freed), pct=Math.round(used/20*100);
   ctx.df[1].used=used.toFixed(0)+"G";ctx.df[1].avail=(20-used).toFixed(0)+"G";
   ctx.df[1].pct=pct>=95?"{{e|"+pct+"%}}":pct>=80?"{{w|"+pct+"%}}":"{{p|"+pct+"%}}";
   if(pct<80)ctx.flags.diskOk=true;
   if(freed>0)ctx.du["/var/log/app"]=(17-freed).toFixed(1)+"G";
 },
 tasks:[
  {t:"Оценить заполненность разделов",hint:"df -h",ok:c=>c.flags.df},
  {t:"Найти каталог-виновник",hint:"du -sh /var/log/*  (или du -sh /var/*)",ok:c=>c.flags.du},
  {t:"Удалить старые ротированные логи",hint:"rm /var/log/app/app.log.1  и остальные крупные старые файлы",ok:c=>c.fs["/var/log/app/app.log.1"]===undefined&&c.fs["/var/log/app/debug-2024.log"]===undefined},
  {t:"Найти удалённый файл, который процесс всё ещё держит",hint:"lsof | grep deleted",ok:c=>c.flags.lsof},
  {t:"Освободить его, перезапустив сервис",hint:"systemctl restart app",ok:c=>c.flags.releasedDeleted},
  {t:"Убедиться, что место вернулось (ниже 80%)",hint:"снова df -h",ok:c=>c.flags.diskOk}],
 debrief:`<p><b>Почему место не вернулось сразу.</b> Пока процесс держит открытым удалённый файл, ядро не отдаёт блоки. <code>lsof | grep deleted</code> показывает такие файлы, а <code>df</code> и <code>du</code> расходятся в показаниях — это и есть диагностический признак.</p>
 <p><b>Что сделать, чтобы не повторилось:</b> logrotate с <code>rotate</code> и <code>maxsize</code>, алерт на 80% (а не на 100%), отдельный раздел под логи, отправка логов наружу вместо хранения на хосте.</p>`};

LABS.svcfail={w:"linux",t:"Инцидент: сервис не запускается",xp:75,
 brief:`После ночного обновления сервис <code>api</code> не поднялся. <code>systemctl start api</code> падает. Найди настоящую причину, устрани её и подними сервис. Проверь результат запросом.`,
 hint:`Логи сервиса — <code>journalctl -u api</code>. Если пишет «address already in use» — ищи, кто занял порт: <code>ss -tulpn</code>.`,
 spec:{host:"app-02",user:"deploy",
  svc:{api:{state:"failed",code:1,desc:"API service",port:8080,exec:"/opt/app/bin/api --port 8080",blocked:true,
       log:["09:12:31 запуск API v2.4.1","09:12:31 {{e|FATAL: listen tcp 0.0.0.0:8080: bind: address already in use}}","09:12:31 процесс завершился с кодом 1"]},
      nginx:{state:"active",pid:711,desc:"nginx",port:80}},
  ps:[{pid:711,user:"root",cmd:"/usr/sbin/nginx -g daemon off;",cpu:"0.2",mem:"0.6"},
      {pid:1544,user:"root",cmd:"python3 /opt/tmp/debug_server.py 8080",cpu:"0.1",mem:"1.1"}],
  ports:[{proto:"tcp",port:80,pid:711,proc:"nginx"},{proto:"tcp",port:8080,pid:1544,proc:"python3"}],
  fs:{"/opt/tmp/debug_server.py":{c:"# временный отладочный сервер, забыли выключить после ночного дежурства\nimport http.server",own:"root root"},
      "/etc/systemd/system/api.service":{c:"[Service]\nExecStart=/opt/app/bin/api --port 8080\nRestart=on-failure\nUser=app",own:"root root"}},
  http:{"localhost:8080":{code:502,msg:"Bad Gateway"},"localhost":{code:502,msg:"Bad Gateway"}},
  dns:{localhost:"127.0.0.1"}},
 after(ctx){
   const s=ctx.svc.api;
   if(!ctx.ports.find(p=>p.port===8080&&p.proc!=="api"))s.blocked_cleared=true;
   if(s.state==="active"){ctx.http["localhost:8080"]={code:200,msg:"OK",body:"{\"status\":\"ok\",\"version\":\"2.4.1\"}"};ctx.http["localhost"]={code:200,msg:"OK",body:"OK"}}
 },
 tasks:[
  {t:"Посмотреть состояние сервиса",hint:"systemctl status api",ok:c=>c.flags["status:api"]},
  {t:"Прочитать журнал сервиса и найти причину",hint:"journalctl -u api",ok:c=>c.flags["journal:api"]},
  {t:"Выяснить, кто занял порт 8080",hint:"ss -tulpn",ok:c=>c.flags.ss},
  {t:"Освободить порт",hint:"kill <PID процесса python3>",ok:c=>!c.ports.find(p=>p.port===8080&&p.proc!=="api")},
  {t:"Запустить сервис",hint:"systemctl start api",ok:c=>c.svc.api.state==="active"},
  {t:"Проверить, что приложение отвечает",hint:"curl localhost:8080",ok:c=>c.flags["curl:localhost:8080"]&&c.svc.api.state==="active"}],
 debrief:`<p><b>Схема, которая работает всегда:</b> статус → журнал → конкретная строка ошибки → проверка гипотезы отдельной командой → устранение → проверка результата. Ты только что прошёл её целиком.</p>
 <p>«Address already in use» — одна из трёх самых частых причин незапуска. Две другие: нет прав на файл/сокет (<code>Permission denied</code>) и отсутствует зависимость (БД, переменная окружения).</p>
 <p>Заметь: перезапуск сервера «вслепую» тоже бы починил — но ты бы не узнал, что кто-то оставил отладочный сервер, и он бы вернулся.</p>`};

LABS.gw502={w:"net",t:"Инцидент: 502 Bad Gateway",xp:80,
 brief:`Пользователи видят 502. Nginx работает. Пройди цепочку от внешнего запроса до бэкенда, найди разрыв и восстанови сервис.`,
 hint:`502 значит: прокси жив, апстрим — нет. Проверь <code>nginx -t</code>, потом статус приложения и его журнал, потом от чего зависит приложение.`,
 spec:{host:"web-01",user:"deploy",
  dns:{"shop.ru":"10.0.1.20","localhost":"127.0.0.1"},
  http:{"shop.ru":{code:502,msg:"Bad Gateway",headers:{Server:"nginx/1.24.0"},body:"<html><head><title>502 Bad Gateway</title></head></html>"},
        "localhost:3000":{code:0}},
  svc:{nginx:{state:"active",pid:711,desc:"nginx",port:443},
       shopapi:{state:"failed",code:1,desc:"Shop API",port:3000,exec:"/opt/shop/api",blocked:true,
        log:["09:40:02 старт Shop API","09:40:02 подключение к postgres://db-01:5432/shop","09:40:07 {{e|FATAL: could not connect to server: Connection refused}}","09:40:07 exit code 1"]},
       postgresql:{state:"inactive",desc:"PostgreSQL 16",port:5432,exec:"/usr/lib/postgresql/16/bin/postgres"}},
  ps:[{pid:711,user:"root",cmd:"nginx: master process",cpu:"0.2",mem:"0.5"}],
  ports:[{proto:"tcp",port:443,pid:711,proc:"nginx"},{proto:"tcp",port:80,pid:711,proc:"nginx"}],
  fs:{"/etc/nginx/sites-enabled/shop.conf":{c:"server {\n  listen 443 ssl;\n  server_name shop.ru;\n  location / {\n    proxy_pass http://127.0.0.1:3000;\n    proxy_set_header Host $host;\n  }\n}",own:"root root"},
      "/var/log/nginx/error.log":{c:"2025/02/12 09:41:10 [error] 711#0: *2201 connect() failed (111: Connection refused) while connecting to upstream, client: 93.10.4.2, upstream: \"http://127.0.0.1:3000/\", host: \"shop.ru\"",own:"root root"}}},
 after(ctx){
   const pg=ctx.svc.postgresql,api=ctx.svc.shopapi;
   if(pg.state==="active")api.blocked_cleared=true;
   if(api.state==="active"){ctx.http["shop.ru"]={code:200,msg:"OK",headers:{Server:"nginx/1.24.0"},body:"<html><body>Магазин работает</body></html>"};
     ctx.http["localhost:3000"]={code:200,msg:"OK",body:"{\"ok\":true}"}}
 },
 tasks:[
  {t:"Воспроизвести проблему запросом",hint:"curl -I https://shop.ru",ok:c=>c.flags["curl:shop.ru"]},
  {t:"Убедиться, что конфиг nginx валиден",hint:"nginx -t",ok:c=>c.flags["nginx-t"]},
  {t:"Прочитать error.log nginx и увидеть, куда он проксирует",hint:"cat /var/log/nginx/error.log",ok:c=>c.flags["cat:/var/log/nginx/error.log"]||c.flags["tail:/var/log/nginx/error.log"]},
  {t:"Найти причину падения бэкенда в его журнале",hint:"journalctl -u shopapi",ok:c=>c.flags["journal:shopapi"]},
  {t:"Поднять зависимость — базу данных",hint:"systemctl start postgresql",ok:c=>c.svc.postgresql.state==="active"},
  {t:"Поднять само приложение",hint:"systemctl start shopapi",ok:c=>c.svc.shopapi.state==="active"},
  {t:"Проверить, что сайт отвечает 200",hint:"curl -I https://shop.ru",ok:c=>c.http["shop.ru"]&&c.http["shop.ru"].code===200&&c.flags["curl:shop.ru"]}],
 debrief:`<p><b>Разбор:</b> 502 — это всегда «прокси не получил валидный ответ от апстрима». Причина оказалась на два слоя глубже: приложение падало, потому что не поднялась БД. Так почти всегда: цепочка зависимостей длиннее, чем кажется.</p>
 <p><b>Что предотвратило бы инцидент:</b> <code>Requires=postgresql.service</code> и <code>After=</code> в юните, ретраи подключения к БД в приложении, healthcheck и алерт на долю 5xx, а не на «сайт не открывается» от пользователей.</p>`};

LABS.tlsdns={w:"net",t:"Инцидент: сертификат истёк",xp:70,
 brief:`Браузеры показывают предупреждение безопасности, конверсия упала до нуля. Проверь DNS, TLS и механизм автопродления — и почини так, чтобы не повторилось.`,
 hint:`<code>dig домен +short</code> проверит DNS, <code>curl -v</code> покажет состояние TLS, а автопродление живёт в systemd-таймере <code>certbot.timer</code>.`,
 spec:{host:"web-02",user:"deploy",
  dns:{"shop.ru":"10.0.1.20"},
  http:{"shop.ru":{code:526,msg:"Invalid SSL Certificate",tls:"{{e|certificate has expired (expired 2 days ago)}}",headers:{Server:"nginx/1.24.0"}}},
  svc:{nginx:{state:"active",pid:711,desc:"nginx",port:443},
       "certbot.timer":{state:"failed",desc:"Certbot renewal timer",
        log:["06:00:01 запуск обновления сертификата","06:00:04 {{e|Failed authorization: connection to :80 refused — challenge не прошёл}}","06:00:04 renewal failed"]},
       certbot:{state:"inactive",desc:"Certbot renew"}},
  fs:{"/etc/letsencrypt/live/shop.ru/cert.pem":{c:"-----BEGIN CERTIFICATE-----\nnotAfter=2025-02-10 09:00:00 GMT   <-- ИСТЁК\n-----END CERTIFICATE-----",own:"root root"},
      "/etc/nginx/sites-enabled/shop.conf":{c:"server {\n  # listen 80;   <-- закомментировали при чистке конфигов\n  listen 443 ssl;\n  server_name shop.ru;\n  ssl_certificate /etc/letsencrypt/live/shop.ru/fullchain.pem;\n}",own:"root root"}},
  ports:[{proto:"tcp",port:443,pid:711,proc:"nginx"}]},
 after(ctx){
   const cf=ctx.fs["/etc/nginx/sites-enabled/shop.conf"];
   const has80=cf&&/^\s*listen\s+80;/m.test(fnode(cf).c);
   if(has80&&(ctx.flags["reload:nginx"]||ctx.flags["restart:nginx"])&&!ctx.ports.find(p=>p.port===80))
     ctx.ports.push({proto:"tcp",port:80,pid:711,proc:"nginx"});
   if(ctx.svc.certbot.state==="active"&&ctx.ports.find(p=>p.port===80)){
     ctx.flags.certRenewed=true;
     ctx.http["shop.ru"]={code:200,msg:"OK",tls:"{{p|TLSv1.3 / сертификат действителен ещё 89 дней}}",body:"OK"};
     ctx.fs["/etc/letsencrypt/live/shop.ru/cert.pem"]={c:"-----BEGIN CERTIFICATE-----\nnotAfter=2025-05-13 09:00:00 GMT\n-----END CERTIFICATE-----",own:"root root"};
   }
 },
 tasks:[
  {t:"Проверить, что домен резолвится",hint:"dig shop.ru +short",ok:c=>c.flags.dig},
  {t:"Увидеть проблему TLS в подробном выводе",hint:"curl -v https://shop.ru",ok:c=>c.flags["curl:shop.ru"]},
  {t:"Проверить срок в самом сертификате",hint:"cat /etc/letsencrypt/live/shop.ru/cert.pem",ok:c=>c.flags["cat:/etc/letsencrypt/live/shop.ru/cert.pem"]},
  {t:"Найти, почему не сработало автопродление",hint:"journalctl -u certbot.timer",ok:c=>c.flags["journal:certbot.timer"]},
  {t:"Понять, почему challenge не проходит: nginx не слушает 80",hint:"cat /etc/nginx/sites-enabled/shop.conf и ss -tulpn — порта 80 нет",ok:c=>c.flags["cat:/etc/nginx/sites-enabled/shop.conf"]&&c.flags.ss},
  {t:"Вернуть listen 80 в конфиг и перечитать nginx",hint:"sed -i 's/# listen 80;/listen 80;/' /etc/nginx/sites-enabled/shop.conf, затем nginx -t и systemctl reload nginx",ok:c=>!!c.ports.find(p=>p.port===80)},
  {t:"Перевыпустить сертификат",hint:"systemctl start certbot",ok:c=>c.flags.certRenewed}],
 debrief:`<p>Сертификат истёк не сам по себе: сломалось автопродление, и об этом никто не узнал. Классика — <b>у автоматизации тоже должен быть мониторинг</b>.</p>
 <p>Ставь алерт «сертификат истекает через 21 день» и проверяй результат таймера, а не факт его запуска. Проверка вручную: <code>echo | openssl s_client -connect shop.ru:443 2>/dev/null | openssl x509 -noout -dates</code>.</p>`};

LABS.secret={w:"git",t:"Инцидент: секрет уехал в репозиторий",xp:65,
 brief:`Сканер безопасности нашёл пароль БД в истории git. Оцени масштаб, закрой дыру в процессе и объясни, почему одного «удалить файл» недостаточно.`,
 hint:`Смотри <code>git log</code>, читай <code>.env</code>, ищи упоминания по всему дереву через <code>grep -r</code>, потом создай <code>.gitignore</code>.`,
 spec:{host:"laptop",user:"dev",cwd:"/home/dev/app",
  git:{branch:"main",ahead:1,modified:[],untracked:[],
    log:[{h:"9f8e7d6",m:"feat: подключение к БД"},{h:"3c2b1a0",m:"chore: добавлен .env с настройками  <-- сюда"},{h:"a1b2c3d",m:"init"}]},
  fs:{"/home/dev/app/.env":{c:"DB_HOST=db-prod.internal\nDB_USER=shop\nDB_PASSWORD=Pr0d_Pa55w0rd!\nSTRIPE_KEY=sk_live_51H9x2",mode:"-rw-r--r--",own:"dev dev"},
      "/home/dev/app/README.md":{c:"# Shop API\nЗапуск: docker compose up",own:"dev dev"},
      "/home/dev/app/src/db.js":{c:"const pass = process.env.DB_PASSWORD; // берём из окружения",own:"dev dev"},
      "/home/dev/app/docker-compose.yml":{c:"services:\n  db:\n    image: postgres:16\n    environment:\n      POSTGRES_PASSWORD: Pr0d_Pa55w0rd!",own:"dev dev"}}},
 after(ctx){
   const gi=ctx.fs["/home/dev/app/.gitignore"];
   if(gi&&fnode(gi).c.includes(".env"))ctx.flags.gitignoreOk=true;
   const dc=ctx.fs["/home/dev/app/docker-compose.yml"];
   if(dc&&!fnode(dc).c.includes("Pr0d_Pa55w0rd"))ctx.flags.composeClean=true;
 },
 tasks:[
  {t:"Посмотреть историю коммитов",hint:"git log",ok:c=>c.cmds.some(x=>x.startsWith("git log"))},
  {t:"Увидеть, что именно утекло",hint:"cat .env",ok:c=>c.flags["cat:/home/dev/app/.env"]},
  {t:"Найти все места, где пароль повторяется",hint:"grep -r Pr0d_Pa55w0rd .",ok:c=>Object.keys(c.flags).some(k=>k.startsWith("grep:")&&k.includes("pr0d"))},
  {t:"Убрать пароль из docker-compose.yml",hint:"sed -i 's/Pr0d_Pa55w0rd!/${DB_PASSWORD}/' docker-compose.yml",ok:c=>c.flags.composeClean},
  {t:"Создать .gitignore и внести туда .env",hint:"echo .env > .gitignore",ok:c=>c.flags.gitignoreOk},
  {t:"Зафиксировать изменения",hint:"git add . затем git commit -m \"chore: убраны секреты\"",ok:c=>c.flags["git commit"]}],
 debrief:`<p><b>Главное:</b> ты закрыл дыру в процессе, но секрет всё ещё в истории git и считается скомпрометированным. Правильный порядок в реальности: <b>1)</b> немедленно ротировать пароль и ключ Stripe, <b>2)</b> потом чистить историю (<code>git filter-repo</code> / BFG) с согласованием команды, <b>3)</b> включить сканер секретов в CI (gitleaks) и pre-commit хук.</p>
 <p>Файл, удалённый новым коммитом, остаётся доступным в любом клоне и форке. Именно поэтому первый шаг — ротация, а не уборка.</p>`};

LABS.crashloop={w:"docker",t:"Инцидент: контейнер в рестарт-петле",xp:80,
 brief:`Контейнер <code>web</code> бесконечно перезапускается. Разберись почему, устрани причину и убедись, что приложение отвечает.`,
 hint:`<code>docker ps -a</code> покажет состояния всех контейнеров, <code>docker logs web</code> — почему падает. Смотри, от чего зависит web.`,
 spec:{host:"docker-host",user:"deploy",
  docker:[{id:"c1a2b3c4d5e6",name:"web",image:"shop/web:2.4.1",status:"Restarting (1) 3 seconds ago",ports:"0.0.0.0:8080->3000/tcp",
    brokenUntilFixed:true,logs:["node server.js","подключение к postgres://db:5432/shop","{{e|Error: connect ECONNREFUSED 172.18.0.3:5432}}","{{e|процесс завершился с кодом 1}}"]},
   {id:"f6e5d4c3b2a1",name:"db",image:"postgres:16",status:"Exited (137) 8 minutes ago",ports:"",
    logs:["database system is starting up","{{e|killed by signal 9 — контейнер остановлен из-за нехватки памяти (OOM)}}"],oom:true,memLimit:268435456}],
  images:[{repo:"shop/web",tag:"2.4.1",id:"9f2c1ab44e10",size:"1.82GB"},{repo:"postgres",tag:"16",id:"aa41bd2f5f30",size:"432MB"}],
  http:{"localhost:8080":{code:0}},dns:{localhost:"127.0.0.1"},
  fs:{"/opt/shop/docker-compose.yml":{c:"services:\n  web:\n    image: shop/web:2.4.1\n    ports: [\"8080:3000\"]\n    depends_on: [db]\n  db:\n    image: postgres:16\n    mem_limit: 256m\n    environment:\n      POSTGRES_PASSWORD: secret",own:"deploy deploy"}},
  ps:[{pid:640,user:"root",cmd:"dockerd",cpu:"1.4",mem:"2.2"}],mem:{t:7900,u:2100}},
 after(ctx){
   const db=ctx.docker.find(c=>c.name==="db"),web=ctx.docker.find(c=>c.name==="web");
   if(db&&db.status.startsWith("Up"))web.fixed=true;
   if(web&&web.status.startsWith("Up")&&db.status.startsWith("Up")){
     ctx.http["localhost:8080"]={code:200,msg:"OK",body:"{\"status\":\"ok\"}"};ctx.flags.appUp=true;}
 },
 tasks:[
  {t:"Увидеть состояние ВСЕХ контейнеров, включая остановленные",hint:"docker ps -a",ok:c=>c.flags["docker ps"]},
  {t:"Прочитать логи падающего контейнера",hint:"docker logs web",ok:c=>c.flags["dlogs:web"]},
  {t:"Прочитать логи упавшей зависимости",hint:"docker logs db",ok:c=>c.flags["dlogs:db"]},
  {t:"Посмотреть, почему db был убит (код 137)",hint:"docker inspect db — смотри OOMKilled и Memory",ok:c=>c.flags["inspect:db"]},
  {t:"Поднять базу",hint:"docker start db",ok:c=>{const d=c.docker.find(x=>x.name==="db");return d&&d.status.startsWith("Up")}},
  {t:"Перезапустить приложение",hint:"docker restart web",ok:c=>{const w=c.docker.find(x=>x.name==="web");return w&&w.status.startsWith("Up")}},
  {t:"Проверить, что сервис отвечает",hint:"curl localhost:8080",ok:c=>c.flags.appUp&&c.flags["curl:localhost:8080"]}],
 debrief:`<p><b>Код выхода 137</b> = 128 + 9 (SIGKILL). Почти всегда это OOM-killer: контейнер превысил <code>mem_limit</code>. Код <b>143</b> = SIGTERM (штатная остановка), <b>1</b> — приложение упало само.</p>
 <p><code>depends_on</code> в compose ждёт только СТАРТА контейнера, а не готовности БД принимать соединения. Правильно: healthcheck на db + <code>condition: service_healthy</code>, и ретраи подключения в самом приложении.</p>`};

LABS.dfile={w:"docker",t:"Ревью: Dockerfile на 1.8 ГБ",xp:70,
 brief:`Разработчики прислали образ на 1.8 ГБ, который запускается от root и пересобирает зависимости при каждом изменении кода. Исправь Dockerfile прямо здесь и пересобери.`,
 hint:`Читай файл, потом правь через <code>sed -i</code>, добавляй строки через <code>echo ... >> Dockerfile</code>. Нужны: лёгкая база, порядок слоёв, непривилегированный пользователь, .dockerignore.`,
 spec:{host:"builder",user:"deploy",cwd:"/opt/app",
  fs:{"/opt/app/Dockerfile":{c:"FROM node:20\nWORKDIR /app\nCOPY . .\nRUN npm install\nEXPOSE 3000\nCMD [\"node\", \"server.js\"]",own:"deploy deploy"},
      "/opt/app/package.json":{c:"{\"name\":\"shop-web\",\"dependencies\":{\"express\":\"^4\"}}",own:"deploy deploy"},
      "/opt/app/server.js":{c:"require('express')().listen(3000)",own:"deploy deploy"},
      "/opt/app/node_modules/.keep":{c:"",own:"deploy deploy"},
      "/opt/app/.git/config":{c:"[remote \"origin\"]",own:"deploy deploy"}},
  images:[{repo:"shop/web",tag:"2.4.1",id:"9f2c1ab44e10",size:"1.82GB"}],docker:[]},
 after(ctx){
   const d=ctx.fs["/opt/app/Dockerfile"];if(!d)return;
   const c=fnode(d).c;
   ctx.flags.dfAlpine=/node:20-alpine|distroless/.test(c);
   ctx.flags.dfUser=/^USER\s+\S+/m.test(c);
   ctx.flags.dfCache=/COPY\s+package\*?\.json/.test(c);
   const di=ctx.fs["/opt/app/.dockerignore"];
   ctx.flags.dfIgnore=!!di&&/node_modules/.test(fnode(di).c)&&/\.git/.test(fnode(di).c);
   if(ctx.flags["docker build"]&&ctx.flags.dfAlpine){
     const img=ctx.images.find(i=>i.repo==="shop/web");if(img)img.size="118MB";ctx.flags.dfBuilt=true;}
 },
 tasks:[
  {t:"Прочитать текущий Dockerfile",hint:"cat Dockerfile",ok:c=>c.flags["cat:/opt/app/Dockerfile"]},
  {t:"Посмотреть, что вообще лежит в контексте сборки",hint:"ls -la  (обрати внимание на node_modules и .git)",ok:c=>c.flags.find||Object.keys(c.flags).length>1},
  {t:"Заменить базовый образ на лёгкий",hint:"sed -i 's/node:20/node:20-alpine/' Dockerfile",ok:c=>c.flags.dfAlpine},
  {t:"Добавить непривилегированного пользователя",hint:"echo 'USER node' >> Dockerfile",ok:c=>c.flags.dfUser},
  {t:"Создать .dockerignore с node_modules и .git",hint:"echo 'node_modules' > .dockerignore  затем  echo '.git' >> .dockerignore",ok:c=>c.flags.dfIgnore},
  {t:"Пересобрать образ",hint:"docker build -t shop/web:2.4.2 .",ok:c=>c.flags.dfBuilt},
  {t:"Убедиться, что образ похудел",hint:"docker images",ok:c=>c.flags.dfBuilt&&c.cmds.some(x=>x.startsWith("docker images"))}],
 debrief:`<p>Ты закрыл четыре типичные проблемы: тяжёлая база, root, сломанный кэш слоёв и мусор в контексте сборки. Осталась пятая, самая ценная — <b>multi-stage</b>: собирать зависимости в одном stage, копировать в чистый рантайм-образ во втором.</p>
 <pre>FROM node:20-alpine AS build
WORKDIR /app
COPY package*.json ./
RUN npm ci
COPY . .
RUN npm run build

FROM node:20-alpine
WORKDIR /app
COPY --from=build /app/dist ./dist
COPY --from=build /app/node_modules ./node_modules
USER node
CMD ["node","dist/server.js"]</pre>
 <p>И порядок слоёв: сначала <code>COPY package*.json</code> + установка, только потом <code>COPY . .</code> — тогда изменение кода не сбрасывает кэш зависимостей.</p>`};
/* ---- вспомогательная команда CI для лаборатории пайплайна ---- */
CMD.ci=(ctx,a)=>{
  const C=ctx.extra.ci||{};
  if(a[0]==="secrets"){
    if(a[1]==="list")return (C.secrets||[]).join("\n")||"{{d|(секретов не задано)}}";
    if(a[1]==="set"){C.secrets=(C.secrets||[]).concat(a[2]);ctx.flags["secret:"+a[2]]=true;return `{{p|секрет ${a[2]} сохранён в хранилище проекта}}`}
  }
  if(a[0]==="log")return (C.lastLog||["{{d|запусков не было}}"]).join("\n");
  if(a[0]==="run"){
    ctx.flags["ci run"]=true;
    const dep=ctx.fs["/home/dev/app/scripts/deploy.sh"];
    const execOk=dep&&fnode(dep).mode.includes("x");
    const tokenOk=(C.secrets||[]).includes("REGISTRY_TOKEN");
    let out=["{{d|› lint}}    {{p|passed  (8s)}}","{{d|› test}}    {{p|passed  (54s)}}","{{d|› build}}   {{p|passed  (1m 12s)}}"];
    if(!tokenOk){out.push("{{d|› push}}    {{e|failed  (4s)}}","{{e|  Error: denied: requested access to the resource is denied}}","{{e|  unauthorized: authentication required — переменная REGISTRY_TOKEN пуста}}");
      C.lastLog=out;ctx.flags.ciStage="push";return out.join("\n")}
    out.push("{{d|› push}}    {{p|passed  (22s)}}");
    if(!execOk){out.push("{{d|› deploy}}  {{e|failed  (1s)}}","{{e|  ./scripts/deploy.sh: Permission denied}}","{{e|  Process completed with exit code 126}}");
      C.lastLog=out;ctx.flags.ciStage="deploy";ctx.flags.sawDeployFail=true;return out.join("\n")}
    out.push("{{d|› deploy}}  {{p|passed  (31s)}}","","{{p|✔ пайплайн зелёный — 2m 51s}}");
    C.lastLog=out;ctx.flags.ciGreen=true;ctx.flags.ciStage="done";return out.join("\n");
  }
  return "{{d|ci run | ci log | ci secrets list | ci secrets set NAME}}";
};

LABS.pipeline={w:"cicd",t:"Инцидент: пайплайн красный",xp:75,
 brief:`Релиз заблокирован: пайплайн падает и никто не понимает почему. Запусти его, прочитай ошибку, устрани — и добейся зелёного прогона. Ошибок будет две.`,
 hint:`<code>ci run</code> запускает пайплайн, <code>ci log</code> показывает последний вывод. Секреты — <code>ci secrets list</code> и <code>ci secrets set ИМЯ</code>. Права на файл смотри через <code>ls -l</code>.`,
 spec:{host:"runner-01",user:"dev",cwd:"/home/dev/app",
  fs:{"/home/dev/app/.github/workflows/ci.yml":{c:"name: ci\non:\n  push:\n    branches: [main]\njobs:\n  build:\n    runs-on: ubuntu-latest\n    steps:\n      - uses: actions/checkout@v4\n      - run: npm ci && npm test\n      - run: docker build -t registry/app:${{ github.sha }} .\n      - run: docker login -u ci -p ${{ secrets.REGISTRY_TOKEN }}\n      - run: docker push registry/app:${{ github.sha }}\n      - run: ./scripts/deploy.sh",own:"dev dev"},
      "/home/dev/app/scripts/deploy.sh":{c:"#!/bin/bash\nset -euo pipefail\nkubectl set image deploy/api api=registry/app:$GITHUB_SHA",mode:"-rw-r--r--",own:"dev dev"},
      "/home/dev/app/package.json":{c:"{\"name\":\"app\"}",own:"dev dev"}},
  extra:{ci:{secrets:[]}}},
 tasks:[
  {t:"Прочитать конфигурацию пайплайна",hint:"cat .github/workflows/ci.yml",ok:c=>c.flags["cat:/home/dev/app/.github/workflows/ci.yml"]},
  {t:"Запустить пайплайн и увидеть первую ошибку",hint:"ci run",ok:c=>c.flags["ci run"]},
  {t:"Проверить, какие секреты заданы",hint:"ci secrets list",ok:c=>c.cmds.some(x=>x.includes("secrets list"))},
  {t:"Добавить недостающий секрет",hint:"ci secrets set REGISTRY_TOKEN",ok:c=>c.flags["secret:REGISTRY_TOKEN"]},
  {t:"Найти вторую ошибку — права на скрипт деплоя",hint:"ls -l scripts/",ok:c=>c.flags.sawDeployFail},
  {t:"Сделать скрипт исполняемым",hint:"chmod 755 scripts/deploy.sh",ok:c=>{const f=c.fs["/home/dev/app/scripts/deploy.sh"];return f&&fnode(f).mode.includes("x")}},
  {t:"Добиться зелёного пайплайна",hint:"ci run",ok:c=>c.flags.ciGreen}],
 debrief:`<p><b>Exit code 126</b> — «команда найдена, но не исполняема». <b>127</b> — «команда не найдена». Эти два числа экономят часы при отладке CI.</p>
 <p>Права на файлы <b>хранятся в git</b> (бит выполнения). Правильный способ починить навсегда: <code>git update-index --chmod=+x scripts/deploy.sh</code> и коммит — иначе каждый свежий клон снова упадёт.</p>
 <p>И про секреты: пустая переменная не должна выглядеть как «отказ в доступе». Хорошая практика — проверка в начале пайплайна: <code>test -n "$REGISTRY_TOKEN" || { echo "нет токена"; exit 1; }</code>.</p>`};

LABS.tfplan={w:"iac",t:"Инцидент: terraform хочет удалить прод",xp:75,
 brief:`Коллега поменял пару строк в <code>main.tf</code>, и теперь <code>terraform plan</code> показывает уничтожение боевого сервера. Разберись, какое поле вызывает пересоздание, и приведи план к безопасному виду.`,
 hint:`Читай <code>main.tf</code>, сравнивай с тем, что записано в state (<code>terraform state list</code> и комментарии в файле). Правь через <code>sed -i</code>, потом снова <code>terraform plan</code>.`,
 spec:{host:"laptop",user:"dev",cwd:"/home/dev/infra",
  fs:{"/home/dev/infra/main.tf":{c:'resource "aws_instance" "app" {\n  ami               = "ami-0c55b159cbfafe1f0"\n  instance_type     = "t3.small"\n  availability_zone = "eu-central-1b"   # было eu-central-1a\n  tags = {\n    Name = "app-prod"\n    Env  = "prod"\n  }\n}\n\nresource "aws_security_group" "web" {\n  name = "web-sg"\n}',own:"dev dev"},
      "/home/dev/infra/backend.tf":{c:'terraform {\n  # backend "s3" {\n  #   bucket = "company-tfstate"\n  #   key    = "prod/terraform.tfstate"\n  #   dynamodb_table = "tf-locks"\n  # }\n}',own:"dev dev"},
      "/home/dev/infra/terraform.tfstate":{c:'{"resources":[{"type":"aws_instance","name":"app","attributes":{"availability_zone":"eu-central-1a","instance_type":"t3.small","db_password":"Pr0d_Pa55w0rd!"}}]}',own:"dev dev",size:4210},
      "/home/dev/infra/.gitignore":{c:"# пусто",own:"dev dev"}},
  tf:{add:1,change:0,destroy:1,state:["aws_instance.app","aws_security_group.web"],
    plan:["{{e|-/+ resource \"aws_instance\" \"app\" {  # forces replacement}}",
      "      ~ availability_zone = \"eu-central-1a\" -> \"eu-central-1b\" {{e|# forces replacement}}",
      "        instance_type     = \"t3.small\"",
      "      ~ id                = \"i-0a1b2c3d\" -> (known after apply)"]}},
 after(ctx){
   const f=ctx.fs["/home/dev/infra/main.tf"];if(!f)return;
   const c=fnode(f).c;
   const azOk=/availability_zone\s*=\s*"eu-central-1a"/.test(c);
   if(azOk){ctx.tf.destroy=0;ctx.tf.add=0;ctx.tf.change=1;
     ctx.tf.plan=["{{p|~ resource \"aws_instance\" \"app\" {  # обновление на месте}}","      ~ tags.Name = \"app-prod\" -> \"app-prod\"","{{d|      (пересоздание не требуется)}}"];
     ctx.flags.tfSafe=true;}
   const gi=ctx.fs["/home/dev/infra/.gitignore"];
   if(gi&&/tfstate/.test(fnode(gi).c))ctx.flags.stateIgnored=true;
   const b=ctx.fs["/home/dev/infra/backend.tf"];
   if(b&&/^\s*backend "s3"/m.test(fnode(b).c))ctx.flags.backendOn=true;
 },
 tasks:[
  {t:"Посмотреть план и увидеть уничтожение",hint:"terraform plan",ok:c=>c.flags["tf plan"]},
  {t:"Прочитать конфигурацию",hint:"cat main.tf",ok:c=>c.flags["cat:/home/dev/infra/main.tf"]},
  {t:"Посмотреть, что уже есть в state",hint:"terraform state list",ok:c=>c.cmds.some(x=>x.includes("state list"))},
  {t:"Вернуть зону доступности к текущему значению",hint:"sed -i 's/eu-central-1b/eu-central-1a/' main.tf",ok:c=>c.flags.tfSafe},
  {t:"Убедиться, что план больше не уничтожает ресурс",hint:"terraform plan ещё раз",ok:c=>c.flags.tfSafe&&c.cmds.filter(x=>x.includes("terraform plan")).length>1},
  {t:"Заметить пароль в state-файле",hint:"cat terraform.tfstate",ok:c=>c.flags["cat:/home/dev/infra/terraform.tfstate"]},
  {t:"Исключить state из git",hint:"echo '*.tfstate*' > .gitignore",ok:c=>c.flags.stateIgnored}],
 debrief:`<p><b>ForceNew-атрибуты</b> — поля, которые нельзя изменить у существующего ресурса (зона, подсеть, AMI у некоторых провайдеров, имя). Terraform честно пишет <code>forces replacement</code> — этот маркер надо искать глазами в каждом плане перед прод-apply.</p>
 <p><b>State — секретный артефакт:</b> он хранит значения атрибутов в открытом виде, включая пароли. Место ему — в S3/GCS с шифрованием, версионированием и блокировкой (<code>dynamodb_table</code>), а не в git.</p>
 <p>Практика зрелой команды: <code>terraform plan</code> публикуется в PR, а <code>apply</code> запускается только после аппрува ревьюера.</p>`};

LABS.oom={w:"k8s",t:"Инцидент: CrashLoopBackOff",xp:85,
 brief:`Поды приложения <code>api</code> бесконечно рестартуют, часть запросов теряется. Найди причину по событиям и логам, исправь манифест и раскати.`,
 hint:`<code>kubectl get pods</code> → <code>kubectl describe pod ИМЯ</code> (секция Events) → <code>kubectl logs ИМЯ --previous</code>. Манифест лежит в /opt/k8s/deploy.yaml.`,
 spec:{host:"bastion",user:"deploy",cwd:"/opt/k8s",
  k8s:{ns:"prod",
   pods:[{name:"api-7d4f9b6c5-x8k2p",ready:"0/1",status:"CrashLoopBackOff",restarts:7,age:"9m",image:"registry/api:2.4.1",
     memLim:"128Mi",memReq:"64Mi",last:"Terminated (OOMKilled), exit code 137",
     events:[{type:"Normal",reason:"Pulled",age:"9m",msg:"Container image already present"},
             {type:"Warning",reason:"BackOff",age:"1m",msg:"Back-off restarting failed container"},
             {type:"Warning",reason:"OOMKilling",age:"2m",msg:"Memory cgroup out of memory: Killed process (node)"}],
     logs:["{{d|(контейнер только что стартовал, логов ещё нет)}}"],
     prev:["09:41:02 API стартует, загружаю справочник товаров в память","09:41:09 загружено 240 000 записей","{{e|09:41:11 <--- Last few GCs --->  JS heap out of memory}}","{{e|killed (137)}}"]},
    {name:"api-7d4f9b6c5-q2m9r",ready:"0/1",status:"CrashLoopBackOff",restarts:7,age:"9m",image:"registry/api:2.4.1",memLim:"128Mi",
     events:[{type:"Warning",reason:"OOMKilling",age:"2m",msg:"Memory cgroup out of memory"}],prev:["{{e|killed (137)}}"]},
    {name:"web-5c8d7f9b4-t7v3n",ready:"1/1",status:"Running",restarts:0,age:"6d",image:"registry/web:1.9.0"}],
   deploys:[{name:"api",ready:"0/2",up:"2",avail:"0",age:"6d",replicas:"2/2"},{name:"web",ready:"1/1",up:"1",avail:"1",age:"6d"}],
   svcs:[{name:"api",type:"ClusterIP",cip:"10.96.14.2",ports:"80/TCP",selector:"app=api",endpoints:[]}],
   events:[{age:"2m",type:"Warning",reason:"OOMKilling",obj:"pod/api-7d4f9b6c5-x8k2p",msg:"Memory cgroup out of memory"},
           {age:"1m",type:"Warning",reason:"BackOff",obj:"pod/api-7d4f9b6c5-q2m9r",msg:"Back-off restarting failed container"}]},
  fs:{"/opt/k8s/deploy.yaml":{c:"apiVersion: apps/v1\nkind: Deployment\nmetadata:\n  name: api\nspec:\n  replicas: 2\n  template:\n    spec:\n      containers:\n        - name: api\n          image: registry/api:2.4.1\n          resources:\n            requests:\n              memory: 64Mi\n            limits:\n              memory: 128Mi\n          readinessProbe:\n            httpGet: { path: /health, port: 8080 }",own:"deploy deploy"}},
  http:{"api.shop.ru":{code:503,msg:"Service Unavailable"}},dns:{"api.shop.ru":"10.0.1.9"}},
 after(ctx){
   const f=ctx.fs["/opt/k8s/deploy.yaml"];if(!f)return;
   const c=fnode(f).c;
   const m=c.match(/limits:\s*\n\s*memory:\s*(\d+)Mi/);
   ctx.flags.memRaised=!!m&&(+m[1])>=384;
   if(ctx.flags.memRaised&&ctx.flags.apply){
     ctx.k8s.pods.forEach(p=>{if(p.name.startsWith("api")){p.status="Running";p.ready="1/1";p.restarts=0;p.memLim="512Mi"}});
     ctx.k8s.deploys[0].ready="2/2";ctx.k8s.deploys[0].avail="2";
     ctx.k8s.svcs[0].endpoints=["10.244.1.14:8080","10.244.2.9:8080"];
     ctx.http["api.shop.ru"]={code:200,msg:"OK",body:"{\"ok\":true}"};ctx.flags.k8sFixed=true;}
 },
 tasks:[
  {t:"Увидеть состояние подов",hint:"kubectl get pods",ok:c=>c.flags["get:po"]||c.flags["get:pod"]},
  {t:"Посмотреть события проблемного пода",hint:"kubectl describe pod api-7d4f9b6c5-x8k2p",ok:c=>Object.keys(c.flags).some(k=>k.startsWith("describe:api"))},
  {t:"Прочитать логи ПРЕДЫДУЩЕГО, упавшего контейнера",hint:"kubectl logs api-7d4f9b6c5-x8k2p --previous",ok:c=>Object.keys(c.flags).some(k=>k.startsWith("logsp:"))},
  {t:"Прочитать манифест деплоймента",hint:"cat /opt/k8s/deploy.yaml",ok:c=>c.flags["cat:/opt/k8s/deploy.yaml"]},
  {t:"Поднять лимит памяти минимум до 384–512Mi",hint:"sed -i 's/memory: 128Mi/memory: 512Mi/' /opt/k8s/deploy.yaml",ok:c=>c.flags.memRaised},
  {t:"Применить манифест",hint:"kubectl apply -f /opt/k8s/deploy.yaml",ok:c=>c.flags.apply},
  {t:"Убедиться, что поды Running",hint:"kubectl get pods",ok:c=>c.flags.k8sFixed}],
 debrief:`<p><b>OOMKilled = exit 137.</b> Контейнер превысил <code>limits.memory</code> — его убило ядро, а не Kubernetes «по своей воле». Поднять лимит — это временная мера; правильный следующий шаг — понять, почему приложению нужно 400 МБ (здесь: грузит весь справочник в память при старте).</p>
 <p><b>Важная разница:</b> превышение <code>limits.cpu</code> вызывает троттлинг (приложение тормозит), превышение памяти — мгновенное убийство. Поэтому CPU-лимиты часто ставят щедро или не ставят вовсе, а память — обязательно и с запасом.</p>
 <p><b>requests vs limits:</b> по requests планировщик выбирает ноду, limits — жёсткий потолок. Если requests сильно занижены, поды поедут на переполненную ноду и будут страдать все.</p>`};

LABS.svcep={w:"k8s",t:"Инцидент: Service никуда не ведёт",xp:80,
 brief:`Поды <code>Running</code>, приложение живо, но через Service запросы получают 503. Найди разрыв между Service и подами.`,
 hint:`Если <code>kubectl get endpoints</code> пуст — Service не находит поды. Сравни <code>selector</code> в Service с лейблами подов.`,
 spec:{host:"bastion",user:"deploy",cwd:"/opt/k8s",
  k8s:{ns:"prod",
   pods:[{name:"api-6b9c4d8f7-h4n2x",ready:"1/1",status:"Running",restarts:0,age:"14m",image:"registry/api:2.5.0",labels:"app=api-v2",
     logs:["09:52:01 API 2.5.0 слушает :8080","09:52:01 health ok"],
     events:[{type:"Normal",reason:"Started",age:"14m",msg:"Started container api"}]},
    {name:"api-6b9c4d8f7-p8q5z",ready:"1/1",status:"Running",restarts:0,age:"14m",image:"registry/api:2.5.0",labels:"app=api-v2",
     logs:["09:52:01 API 2.5.0 слушает :8080"]}],
   deploys:[{name:"api",ready:"2/2",up:"2",avail:"2",age:"6d"}],
   svcs:[{name:"api",type:"ClusterIP",cip:"10.96.14.2",ports:"80/TCP",selector:"app=api",endpoints:[]}],
   ing:[{name:"api",host:"api.shop.ru",addr:"10.0.1.9"}],
   events:[{age:"3m",type:"Warning",reason:"FailedToUpdateEndpoint",obj:"service/api",msg:"no pods match selector app=api"}]},
  fs:{"/opt/k8s/svc.yaml":{c:"apiVersion: v1\nkind: Service\nmetadata:\n  name: api\nspec:\n  selector:\n    app: api\n  ports:\n    - port: 80\n      targetPort: 8080",own:"deploy deploy"},
      "/opt/k8s/deploy.yaml":{c:"apiVersion: apps/v1\nkind: Deployment\nmetadata:\n  name: api\nspec:\n  selector:\n    matchLabels:\n      app: api-v2\n  template:\n    metadata:\n      labels:\n        app: api-v2      # переименовали при выкатке v2\n    spec:\n      containers:\n        - name: api\n          image: registry/api:2.5.0",own:"deploy deploy"}},
  http:{"api.shop.ru":{code:503,msg:"Service Unavailable",body:"no healthy upstream"}},dns:{"api.shop.ru":"10.0.1.9"}},
 after(ctx){
   const f=ctx.fs["/opt/k8s/svc.yaml"];if(!f)return;
   const ok=/app:\s*api-v2/.test(fnode(f).c);
   ctx.flags.selFixed=ok;
   if(ok&&ctx.flags.apply){
     ctx.k8s.svcs[0].selector="app=api-v2";
     ctx.k8s.svcs[0].endpoints=["10.244.1.21:8080","10.244.2.14:8080"];
     ctx.http["api.shop.ru"]={code:200,msg:"OK",body:"{\"version\":\"2.5.0\"}"};ctx.flags.epFixed=true;}
 },
 tasks:[
  {t:"Воспроизвести 503",hint:"curl -I https://api.shop.ru",ok:c=>c.flags["curl:api.shop.ru"]},
  {t:"Убедиться, что поды здоровы",hint:"kubectl get pods",ok:c=>c.flags["get:po"]||c.flags["get:pod"]},
  {t:"Проверить логи пода — приложение точно живо?",hint:"kubectl logs api-6b9c4d8f7-h4n2x",ok:c=>Object.keys(c.flags).some(k=>k.startsWith("logs:api"))},
  {t:"Увидеть пустые endpoints",hint:"kubectl get endpoints",ok:c=>c.flags["get:ep"]||c.flags["get:endpoint"]},
  {t:"Сравнить selector сервиса и лейблы подов",hint:"cat svc.yaml и cat deploy.yaml",ok:c=>c.flags["cat:/opt/k8s/svc.yaml"]&&c.flags["cat:/opt/k8s/deploy.yaml"]},
  {t:"Исправить selector в Service",hint:"sed -i 's/app: api$/app: api-v2/' svc.yaml",ok:c=>c.flags.selFixed},
  {t:"Применить и проверить, что появились endpoints",hint:"kubectl apply -f svc.yaml, затем kubectl get endpoints",ok:c=>c.flags.epFixed}],
 debrief:`<p><b>Правило:</b> Service находит поды <i>только</i> по лейблам. Ни имя деплоймента, ни неймспейс, ни порядок создания роли не играют. Пустой <code>ENDPOINTS</code> — однозначный диагноз рассинхрона лейблов и селектора.</p>
 <p>Вторая по частоте причина пустых endpoints — <b>readinessProbe не проходит</b>: поды Running, но не Ready, и Service их исключает. Проверяется колонкой READY в <code>get pods</code>.</p>
 <p>Третья — <code>targetPort</code> не совпадает с портом, который реально слушает контейнер.</p>`};

LABS.night={w:"obs",t:"Инцидент: ночной алерт 5xx",xp:90,

 spec:{host:"bastion",user:"oncall",cwd:"/home/oncall",

   pods:[{name:"api-9f7c2b1a4-k3m8x",ready:"1/1",status:"Running",restarts:0,age:"11m",image:"registry/api:2.6.0",

    {name:"api-9f7c2b1a4-w9n4t",ready:"1/1",status:"Running",restarts:0,age:"11m",image:"registry/api:2.6.0",
     logs:["03:31 {{e|ERROR cache.get is not a function}}"]}],

const _git=CMD.git;
CMD.git=(ctx,a)=>{
  const G=ctx.git;
  if(a[0]==="bisect"){
    if(!G.commits)return "{{e|git bisect: в этом репозитории нечего искать}}";
    const idx=r=>{if(!r||r==="HEAD")return G.headIdx;const i=G.commits.findIndex(c=>c.h===r||c.h.startsWith(r));return i};
    const B=G.bisect=G.bisect||{};
    const step=()=>{
      if(B.lo===undefined||B.hi===undefined)return "";
      if(B.hi-B.lo<=1){B.done=true;ctx.flags.bisectFound=G.commits[B.hi].h;
        const c=G.commits[B.hi];
        return `{{hl|${c.h} is the first bad commit}}\n    ${c.m}\n{{d|(проверено ${B.steps||0} шагов; выйти из режима — git bisect reset)}}`;}
      B.cur=Math.floor((B.lo+B.hi)/2);G.headIdx=B.cur;
      const left=B.hi-B.lo-1,steps=Math.max(0,Math.round(Math.log2(left||1)));
      const c=G.commits[B.cur];
      return `Bisecting: ${left} revisions left to test after this (roughly ${steps} steps)\n[${c.h}] ${c.m}\n{{d|проверь состояние и скажи: git bisect good  или  git bisect bad}}`;
    };
    if(a[1]==="start"){B.lo=undefined;B.hi=undefined;B.done=false;B.steps=0;ctx.flags.bisectStart=true;
      return "{{d|режим поиска включён: отметь плохой и хороший коммиты}}"}
    if(a[1]==="bad"||a[1]==="good"){
      if(!ctx.flags.bisectStart)return "{{e|You need to start by \"git bisect start\"}}";
      const i=idx(a[2]);
      if(i<0)return `{{e|неизвестная ревизия: ${a[2]}}}`;
      if(a[1]==="bad")B.hi=i; else B.lo=i;
      B.steps=(B.steps||0)+1;ctx.flags.bisectSteps=B.steps;
      return step();
    }
    if(a[1]==="reset"){G.headIdx=G.commits.length-1;G.bisect={};ctx.flags.bisectReset=true;
      return "{{p|Previous HEAD position restored}}"}
    if(a[1]==="log")return (G.commits||[]).slice(0,(G.headIdx||0)+1).map(c=>`${c.h} ${c.m}`).join("\n");
    return "{{d|git bisect start | bad | good | reset}}";
  }
  if(a[0]==="show"){
    const G2=ctx.git;if(!G2.commits)return _git(ctx,a);
    const r=a[1]&&a[1]!=="HEAD"?a[1]:null;
    const c=r?G2.commits.find(x=>x.h.startsWith(r)):G2.commits[G2.headIdx];
    if(!c)return `{{e|fatal: bad object ${a[1]}}}`;
    ctx.flags["show:"+c.h]=true;
    return `commit ${c.h}\nAuthor: ${c.a||"dev@shop.ru"}\n\n    ${c.m}\n\n${c.diff||"{{d|(изменения не показаны)}}"}`;
  }
  if(a[0]==="log"&&ctx.git.commits){
    const G3=ctx.git;ctx.flags["git log"]=true;
    return G3.commits.slice().reverse().map((c,i)=>
      `{{hl|${c.h}}} ${c.m}${G3.commits.length-1-i===G3.headIdx?" {{p|(HEAD)}}":""}`).join("\n");
  }
  if(a[0]==="revert"&&ctx.git.commits){ctx.flags["revert:"+a[1]]=true;
    return `[main f0f0f0f] Revert "${(ctx.git.commits.find(c=>c.h.startsWith(a[1]))||{}).m||a[1]}"\n{{p|1 file changed}}`}
  return _git(ctx,a);
};

const KEY="pipeline_devops_v2";
const today=()=>new Date().toISOString().slice(0,10);
const defState=()=>({xp:0,mis:{},boss:{},labs:{},srs:{},streak:0,last:null,days:[],badges:[],repairs:0,tab:"map",openWorld:null,hintsUsed:0,

let S=load();
function load(){try{const r=localStorage.getItem(KEY)||localStorage.getItem("pipeline_devops_v1");
  if(r)return Object.assign(defState(),JSON.parse(r));}catch(e){}return defState();}
let saveT;
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}
  const el=document.getElementById("s-saved");el.classList.add("on");el.textContent="сохранено ✓";
  clearTimeout(saveT);saveT=setTimeout(()=>el.classList.remove("on"),1200);}
function checkDay(){
  const t=today(); if(S.last===t)return;
  if(S.last){const d=Math.round((new Date(t)-new Date(S.last))/864e5);S.streak=d===1?S.streak+1:1;}else S.streak=1;
  S.last=t; if(!S.days.includes(t))S.days.push(t);
  if(S.streak>=3)award("streak3"); if(S.streak>=7)award("streak7"); if(S.streak>=30)award("streak30");
  save();
}
const LVL=x=>Math.floor(Math.sqrt(x/60))+1;
const lvlFloor=l=>Math.round(60*Math.pow(l-1,2));
function addXP(n){S.xp+=n;save();renderStats();}
function award(id){if(S.badges.includes(id))return;S.badges.push(id);save();toast("Бейдж: "+((BADGES.find(b=>b.id===id)||{}).n||id));}
function toast(m){const t=document.getElementById("toast");t.textContent=m;t.classList.add("on");setTimeout(()=>t.classList.remove("on"),2800);}
const BOX=[0,1,3,7,16,35];
function srsUpdate(key,ok,item){
  const r=S.srs[key]||{b:1};
  r.b=ok?Math.min(5,r.b+1):1;
  r.due=new Date(Date.now()+BOX[r.b]*864e5).toISOString().slice(0,10);
  r.it=item;S.srs[key]=r;
}
function dueList(){const t=today();return Object.entries(S.srs).filter(([k,v])=>v.due&&v.due<=t).map(([k,v])=>({k,...v.it}));}
const labsOf=wid=>Object.entries(LABS).filter(([id,l])=>l.w===wid).map(([id,l])=>({id,...l}));
function wProgress(w){
  const L=labsOf(w.id);
  const total=w.miss.length+L.length+1;
  const done=w.miss.filter(m=>S.mis[m.id]).length+L.filter(l=>S.labs[l.id]).length+(S.boss[w.id]?1:0);
  return {done,total,pct:Math.round(done/total*100)};
}
function wUnlocked(i){
  if(i===0)return true;
  const prev=WORLDS[i-1];
  return prev.miss.filter(m=>S.mis[m.id]).length>=prev.miss.length-1||!!S.boss[prev.id];
}
function nextThing(){
  for(let i=0;i<WORLDS.length;i++){
    const w=WORLDS[i]; if(!wUnlocked(i))break;
    const m=w.miss.find(m=>!S.mis[m.id]); if(m)return{w,m};
    const l=labsOf(w.id).find(l=>!S.labs[l.id]); if(l)return{w,lab:l};
    if(!S.boss[w.id])return{w,boss:true};
  }
  return null;
}
