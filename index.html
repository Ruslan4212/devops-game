{id:"tf1",t:"Провайдеры вглубь",goal:"Понять, что провайдер — это отдельный API-клиент со своим жизненным циклом",
 cards:[
 {h:"Провайдер — не часть Terraform",b:"<pre>terraform {\n  required_providers {\n    aws = { source = \"hashicorp/aws\", version = \"~> 5.40\" }\n  }\n}\nprovider \"aws\" {\n  region = \"eu-central-1\"\n}</pre><p>Провайдер — отдельный бинарник-плагин, который Terraform скачивает при <code>init</code> и запускает как подпроцесс. Ядро Terraform не знает деталей API AWS или Kubernetes — оно знает только общий протокол, а провайдер переводит его в реальные вызовы облака.</p><p>Именно поэтому у провайдера своя версия, свой changelog и свои breaking changes, независимые от версии самого Terraform.</p>",
  cheat:"провайдер = отдельный плагин-переводчик к конкретному API, версионируется отдельно от Terraform"},
 {h:"Множественные конфигурации провайдера (alias)",b:"<pre>provider \"aws\" {\n  region = \"eu-central-1\"\n}\nprovider \"aws\" {\n  alias  = \"us\"\n  region = \"us-east-1\"\n}\n\nresource \"aws_instance\" \"eu\" { }                    <span class='c'># дефолтный provider</span>\nresource \"aws_instance\" \"us\" { provider = aws.us }  <span class='c'># явно указанный alias</span></pre><p><code>alias</code> нужен, когда один проект работает с несколькими регионами или несколькими аккаунтами одного облака одновременно — например, реплика в другом регионе для отказоустойчивости.</p>",
  t:{q:"Каким атрибутом блока provider задают дополнительную (не основную) конфигурацию того же провайдера, например для другого региона?",ans:["alias"],hint:"provider \"aws\" { alias = ... }",why:"alias позволяет иметь несколько независимых конфигураций одного провайдера — например, aws.us и aws.eu в одном проекте."}},
 {h:"Версионирование провайдера и breaking changes",b:"<pre>required_providers {\n  aws = { source = \"hashicorp/aws\", version = \"~> 5.40\" }\n}</pre><p><code>~> 5.40</code> — pessimistic constraint: допускает 5.41, 5.42, но не 6.0. Мажорное обновление провайдера часто меняет поведение атрибутов по умолчанию или удаляет устаревшие поля — это ломает существующий код без единой строчки, изменённой в самом проекте.</p><p>Практика для крупного обновления: сначала на некритичном окружении, с полным просмотром <code>plan</code> и changelog провайдера, и только потом — на прод.</p>",
  cheat:"~> 5.40 — допускает патчи и минорные версии, блокирует мажорное обновление"},
 {h:"Локальные и сторонние провайдеры",b:"<p>Кроме облачных, есть провайдеры без внешнего API: <code>random</code> (генерация случайных значений, переживающих state), <code>local</code> (работа с локальными файлами), <code>null_resource</code> (произвольные действия через <code>local-exec</code>/<code>remote-exec</code> — используется как последний инструмент, когда нет декларативного способа).</p><p><code>null_resource</code> с <code>local-exec</code> — осознанный компромисс: он делает конфигурацию императивной в одном месте, и такие блоки стоит минимизировать, а не использовать как основной инструмент.</p>"}],
 ch:[
 {t:"q",d:1,q:"Что такое провайдер в Terraform?",a:["Часть ядра Terraform","Отдельный плагин-подпроцесс, который переводит общий протокол Terraform в вызовы конкретного API (AWS, Kubernetes и т.д.)","Файл конфигурации","Хранилище state"],c:1,why:"Ядро Terraform не знает деталей API конкретного облака — это знает провайдер, скачиваемый отдельно при init."},
 {t:"c",d:2,q:"Напиши атрибут блока provider, которым задают вторую независимую конфигурацию (например, для другого региона AWS).",ans:["alias"],hint:"provider \"aws\" { alias = ... }",why:"alias даёт возможность работать с несколькими регионами/аккаунтами одного облака в одном проекте одновременно."},
 {t:"c",d:3,q:"Ресурс должен создаваться через провайдер с alias us, а не через дефолтный. Напиши атрибут ресурса (без значения), которым это указывается.",ans:["provider"],hint:"provider = aws.us",why:"Явное provider = aws.us говорит Terraform использовать именно эту конфигурацию провайдера для конкретного ресурса."},
 {t:"c",d:3,q:"Напиши constraint версии провайдера (формат ~> X.Y), который разрешает патчи и минорные обновления 5.40.x/5.41/5.42, но блокирует переход на 6.0.",ans:["~> 5.40"],hint:"pessimistic constraint",why:"~> 5.40 — стандартная защита от неожиданного мажорного обновления с breaking changes."},
 {t:"c",d:4,q:"Нужно выполнить произвольную shell-команду при создании ресурса, для которой нет декларативного способа в провайдере. Напиши название ресурса (два слова через underscore, англ.), который используют как крайний вариант.",ans:["null_resource"],hint:"ресурс без облачного аналога, только для local-exec/remote-exec",why:"null_resource с local-exec — осознанный компромисс, делающий часть конфигурации императивной. Использовать по минимуму, не как основной инструмент."},
 {t:"c",d:5,q:"Инцидент. Провайдер AWS обновился с 5.x до 6.0, и terraform plan на боевом проекте показывает 40 непредвиденных изменений вместо ожидаемого одного (менялся только тег). Напиши первое действие (глагол + что) — не удаление state и не слепой apply.",ans:["прочитать план","изучить changelog"],hint:"понять системную причину, прежде чем что-либо применять",why:"Массовые неожиданные изменения почти всегда имеют одну системную причину — обновление провайдера часто меняет поведение атрибутов по умолчанию. apply вслепую при таком плане рискует пересоздать половину инфраструктуры."}]},

{id:"tf2",t:"Модули на практике",goal:"Спроектировать модуль, которым реально будут пользоваться другие",
 cards:[
 {h:"Источник модуля и версионирование",b:"<pre>module \"vpc\" {\n  source  = \"terraform-aws-modules/vpc/aws\"\n  version = \"~> 5.0\"          <span class='c'># модуль из публичного registry</span>\n}\n\nmodule \"app\" {\n  source = \"git::https://github.com/org/tf-modules.git//service?ref=v2.3.0\"\n}</pre><p>Модуль из <b>registry</b> версионируется через <code>version</code>, модуль из git — через <code>?ref=v2.3.0</code> (тег, ветка или коммит). Без фиксации версии модуля любое обновление у автора молча прилетает во все проекты, использующие его — без предупреждения и без diff в собственном репозитории.</p>",
  cheat:"registry: version=\"~> 5.0\"; git: source=\"...git//path?ref=v2.3.0\"",
  t:{q:"Напиши параметр source модуля из git с фиксацией версии на тег v2.3.0 (используй ?ref=).",ans:["?ref=v2.3.0","source=\"git::...?ref=v2.3.0\""],hint:"?ref=<тег>",why:"Без ?ref модуль из git тянется с HEAD ветки по умолчанию — обновление у автора прилетит незаметно во все проекты."}},
 {h:"Интерфейс модуля: входы и выходы",b:"<pre>variable \"instance_type\" {\n  type    = string\n  default = \"t3.micro\"\n}\noutput \"instance_id\" {\n  value = aws_instance.this.id\n}</pre><p>Хороший модуль имеет чёткую границу: <code>variables.tf</code> — то, что пользователь модуля может настроить, <code>outputs.tf</code> — то, что модуль отдаёт наружу для использования в другом месте. Всё, что не объявлено переменной, не настраивается снаружи — это осознанное ограничение свободы, а не недоработка.</p><p>Слишком много опциональных переменных с сотней флагов — признак того, что модуль пытается быть универсальным для всех сразу и в итоге неудобен никому.</p>"},
 {h:"Композиция модулей",b:"<pre>module \"vpc\" {\n  source = \"./modules/vpc\"\n  cidr   = \"10.0.0.0/16\"\n}\n\nmodule \"app\" {\n  source    = \"./modules/service\"\n  vpc_id    = module.vpc.vpc_id       <span class='c'># output одного — вход другого</span>\n  subnet_ids = module.vpc.private_subnet_ids\n}</pre><p>Модули естественно строят граф зависимостей через ссылки <code>module.X.output</code> — Terraform сам определяет порядок создания: сначала vpc, потом то, что от неё зависит. Явно прописывать порядок не нужно и обычно вредно.</p>"},
 {h:"Тестирование модулей",b:"<pre>terraform test    <span class='c'># встроенный фреймворк тестов (.tftest.hcl)</span></pre><pre># tests/basic.tftest.hcl\nrun \"creates_vpc\" {\n  command = plan\n  assert {\n    condition     = aws_vpc.this.cidr_block == \"10.0.0.0/16\"\n    error_message = \"неверный CIDR\"\n  }\n}</pre><p>Модуль, используемый несколькими командами, стоит покрывать тестами так же, как код приложения — тесты ловят регрессии при рефакторинге модуля до того, как их поймает прод-инфраструктура одного из пользователей модуля.</p>"}],
 ch:[
 {t:"q",d:1,q:"Зачем нужен параметр version у модуля из публичного registry?",a:["Для документации","Фиксирует конкретную версию модуля — без него любое обновление автора модуля прилетит незаметно во все использующие его проекты","Ускоряет terraform init","Обязателен синтаксически"],c:1,why:"Version pinning модуля — та же защита, что version constraint у провайдера: предсказуемость важнее автоматического получения последних изменений."},
 {t:"c",d:2,q:"Напиши, что нужно добавить к source модуля из git (после пути), чтобы зафиксировать версию на тег v1.4.0.",ans:["?ref=v1.4.0"],hint:"?ref=<тег/ветка/коммит>",why:"?ref= работает и с тегами, и с ветками, и с конкретными коммитами — везде фиксирует, какая именно версия кода будет использована."},
 {t:"c",d:3,q:"Модуль вернул наружу id созданной VPC для использования другим модулем. Напиши блок (одно слово), которым это объявляется внутри модуля.",ans:["output"],hint:"противоположность variable",why:"output — единственный способ передать значение из модуля наружу для композиции с другими модулями через module.X.output."},
 {t:"c",d:3,q:"Один модуль должен использовать vpc_id, созданный другим модулем vpc. Напиши выражение (module.<имя>.<атрибут>), которым второй модуль получает это значение.",ans:["module.vpc.vpc_id"],hint:"module.<имя модуля>.<имя output>",why:"Terraform строит граф зависимостей по этим ссылкам автоматически: сначала создаётся vpc, потом то, что от него зависит."},
 {t:"c",d:4,q:"Модуль, используемый пятью командами, недавно сломал прод одной из них после рефакторинга. Напиши команду Terraform (два слова), которой можно было заранее проверить поведение модуля до релиза изменений.",ans:["terraform test"],hint:"встроенный фреймворк тестирования",why:"terraform test с файлами .tftest.hcl ловит регрессии модуля до того, как их поймает прод-инфраструктура одного из пользователей."},
 {t:"c",d:5,q:"Инцидент. Модуль публикуется для использования другими командами без версионирования source (все берут напрямую с main-ветки). Напиши, что нужно ввести (термин из двух слов, англ. или рус.), чтобы обновления автора не прилетали молча во все проекты сразу.",ans:["семантическое версионирование","версионирование модуля","version pinning"],hint:"теги релизов + фиксация ?ref= у потребителей",why:"Семантическое версионирование модуля (v1.0.0, v1.1.0...) вместе с ?ref= у каждого потребителя даёт контролируемое обновление вместо случайного молчаливого."}]},

{id:"tf3",t:"Workspaces и структура окружений",goal:"Управлять dev/stage/prod осознанно, а не копипастой",
 cards:[
 {h:"Workspace — переключатель state, не переменных",b:"<pre>terraform workspace new stage\nterraform workspace select prod\nterraform workspace list\n\n# в коде:\nresource \"aws_instance\" \"app\" {\n  count = terraform.workspace == \"prod\" ? 3 : 1\n}</pre><p>Workspace переключает, <b>какой state файл</b> используется для одного и того же кода — не сами переменные. Значения различий (число реплик, размер инстанса) прописывают через <code>terraform.workspace</code> внутри условий или через отдельные <code>.tfvars</code> файлов на каждый workspace.</p>",
  cheat:"workspace = отдельный state для того же кода, не отдельная конфигурация"},
 {h:"Когда workspaces недостаточно",b:"<p>Workspaces хорошо подходят, когда окружения структурно <b>идентичны</b> и различаются только числами (реплики, размер). Если prod требует принципиально другую архитектуру (например, мультизональность, которой нет в dev) — единый код с условиями быстро превращается в нечитаемую кашу из тернарных выражений.</p><p>В этом случае предпочтительнее раздельные каталоги:</p><pre>envs/\n  dev/    main.tf → module \"app\" { replicas = 1 }\n  stage/  main.tf → module \"app\" { replicas = 2 }\n  prod/   main.tf → module \"app\" { replicas = 5, multi_az = true }</pre><p>У каждого каталога свой backend/state, и права доступа к prod физически можно ограничить отдельно от dev.</p>"},
 {h:"tfvars на окружение",b:"<pre>terraform apply -var-file=\"envs/prod.tfvars\"</pre><pre># envs/prod.tfvars\ninstance_type = \"m5.xlarge\"\nreplicas      = 5</pre><p>Отдельный <code>.tfvars</code> на окружение — способ держать одну кодовую базу модулей/ресурсов, но разные конкретные значения, без изменения самого <code>.tf</code>-кода между применениями к разным окружениям.</p>",
  t:{q:"Напиши флаг команды apply, которым подключается отдельный файл значений переменных для конкретного окружения.",ans:["-var-file"],hint:"terraform apply -var-file=...",why:"-var-file держит одну кодовую базу ресурсов, но разные конкретные значения на разные окружения — без дублирования .tf-файлов."}},
 {h:"Изоляция prod от ошибок",b:"<p>Что бы ни выбрали — workspaces или раздельные каталоги — ключевой принцип один: у prod должен быть <b>физически отдельный state</b> с ограниченным доступом. Общий state на все окружения означает, что одна ошибка в dev технически может задеть prod при неверно указанном workspace/каталоге в команде apply.</p><p>Backend для prod часто настраивают с дополнительным ограничением доступа (отдельная роль/бакет), недоступным для повседневной разработки в dev.</p>"}],
 ch:[
 {t:"q",d:1,q:"Что переключает terraform workspace select prod?",a:["Версию Terraform","Какой state-файл используется для того же кода — не сами значения переменных","Провайдера","Ветку git"],c:1,why:"Разные значения (реплики, размеры) задают отдельно — через terraform.workspace в условиях или tfvars, workspace сам по себе значения не меняет."},
 {t:"c",d:2,q:"Напиши команду, которой создаётся новый workspace с именем stage.",ans:["terraform workspace new stage"],hint:"terraform workspace new <имя>",why:"После создания нужно ещё явно переключиться на него: terraform workspace select stage, если он не стал активным автоматически."},
 {t:"c",d:3,q:"Prod требует принципиально другую архитектуру (мультизональность), которой нет в dev — код с workspace-условиями становится нечитаемым. Напиши альтернативный подход (одно слово, рус.) — что использовать вместо единого кода с ветвлениями по workspace.",ans:["каталоги","envs"],hint:"envs/dev, envs/stage, envs/prod со своим кодом",why:"Раздельные каталоги дают каждому окружению свой state и позволяют структурно отличаться, а не только числами — в отличие от workspaces."},
 {t:"c",d:3,q:"Нужно применить один и тот же код с другими значениями (instance_type, replicas) для prod. Напиши флаг команды apply, который подключает файл с этими значениями.",ans:["-var-file"],hint:"apply -var-file=envs/prod.tfvars",why:"-var-file держит одну кодовую базу .tf-файлов, но разные конкретные значения для каждого окружения без копирования кода."},
 {t:"c",d:4,q:"У всех окружений сейчас общий state и общий доступ у всей команды. Напиши, какое свойство должно быть у prod вне зависимости от выбора workspaces/каталогов, чтобы ошибка в dev не могла задеть его (два слова, рус.).",ans:["отдельный state","физически отдельный state"],hint:"изоляция по состоянию, а не только по коду",why:"Общий state на все окружения означает, что одна ошибка в dev технически может задеть prod при неверно указанной команде — изоляция state устраняет саму возможность такой ошибки."},
 {t:"c",d:5,q:"Инцидент. Инженер выполнил terraform apply, забыв переключить workspace — код применился к prod вместо dev, куда собирался вносить изменение. Напиши команду, которой можно было заранее проверить активный workspace перед apply.",ans:["terraform workspace show"],hint:"показывает текущий активный workspace",why:"terraform workspace show — простая привычка, которая предотвращает именно такой класс ошибок: применение не туда, куда собирались, из-за забытого переключения."}]},

{id:"tf4",t:"Импорт и работа с существующей инфраструктурой",goal:"Взять под контроль то, что уже создано руками",
 cards:[
 {h:"Import-блок — современный способ",b:"<pre>import {\n  to = aws_instance.app\n  id = \"i-0a1b2c3d\"\n}\n\nresource \"aws_instance\" \"app\" {\n  ami           = \"ami-xxxxx\"\n  instance_type = \"t3.micro\"\n}</pre><p>Блок <code>import</code> декларативно описывает намерение привязать существующий объект к адресу в коде — его можно ревьюить в PR как обычное изменение, в отличие от команды <code>terraform import</code>, которая выполняется вручную и не оставляет следа в самом коде.</p><p><code>terraform plan</code> после этого покажет, что именно предстоит импортировать, до реального применения.</p>",
  cheat:"import-блок ревьюится в PR; terraform import — разовая команда без следа в коде"},
 {h:"Генерация кода из существующего ресурса",b:"<pre>terraform plan -generate-config-out=generated.tf</pre><p>Вместо ручного переписывания всех атрибутов существующего ресурса в <code>.tf</code>-файл, Terraform может сгенерировать код автоматически на основе реального состояния объекта в облаке — дальше сгенерированный код правят руками (обычно нужно почистить лишние вычисляемые атрибуты).</p><p>Это заметно ускоряет перенос большого числа ресурсов, созданных когда-то руками, в код.</p>",
  t:{q:"Напиши флаг команды terraform plan, который генерирует .tf-код на основе импортируемого существующего ресурса.",ans:["-generate-config-out"],hint:"plan -generate-config-out=<файл>",why:"Экономит время на ручное переписывание атрибутов существующего ресурса — код генерируется из реального состояния объекта."}},
 {h:"Критерий успешного импорта",b:"<p>Импорт не заканчивается на факте привязки id к адресу. Критерий успеха — <b>plan без изменений</b> сразу после импорта: если plan показывает diff, значит код в <code>.tf</code>-файле описывает ресурс не точно так, как он реально настроен, и apply рискует изменить что-то незапланированное.</p><p>Практика: импортировать → plan → подгонять атрибуты кода под реальность → повторять, пока plan не станет пустым.</p>"},
 {h:"state mv при рефакторинге",b:"<pre>terraform state mv aws_instance.old aws_instance.new\nterraform state mv 'module.old_name' 'module.new_name'</pre><p>Переименование ресурса или перенос его в модуль в коде без <code>state mv</code> Terraform интерпретирует как «удалить старое, создать новое» — для базы данных или диска это потеря данных. <code>state mv</code> сохраняет связь ресурса с его реальным объектом при изменении адреса в коде.</p>"}],
 ch:[
 {t:"q",d:1,q:"В чём преимущество import-блока перед командой terraform import?",a:["Работает быстрее","Import-блок декларативен и виден в коде — его можно ревьюить в PR, в отличие от разовой команды","Их не выполняют одинаково","Import-блок не требует plan"],c:1,why:"Разовая команда terraform import не оставляет следа в самом .tf-коде — import-блок делает намерение частью истории изменений репозитория."},
 {t:"c",d:2,q:"Напиши флаг команды plan, который генерирует .tf-файл с кодом на основе существующего импортируемого ресурса.",ans:["-generate-config-out"],hint:"-generate-config-out=<файл>",why:"Экономит время на ручном переписывании атрибутов — код строится из реального состояния объекта в облаке."},
 {t:"c",d:3,q:"Ресурс импортирован в state, но terraform plan после этого показывает несколько изменений вместо ожидаемого пустого плана. Напиши, что это означает (глагол + что) — что нужно поправить.",ans:["поправить код","подогнать атрибуты кода"],hint:"код не точно описывает реальность",why:"Критерий успешного импорта — plan без изменений. Diff после импорта значит, что .tf-код описывает ресурс не так, как он реально настроен."},
 {t:"c",d:3,q:"Ресурс переименован в коде с aws_instance.old на aws_instance.new без использования state-команд. Напиши, что Terraform сделает при следующем apply (глагол+глагол, кратко).",ans:["удалит и создаст заново","destroy и create"],hint:"воспринимает как разные ресурсы",why:"Без state mv простое переименование в коде читается Terraform как удаление старого ресурса и создание нового — для БД или диска это потеря данных."},
 {t:"c",d:4,q:"Напиши команду, которая переносит адрес ресурса в state с aws_instance.old на aws_instance.new без его пересоздания.",ans:["terraform state mv aws_instance.old aws_instance.new"],hint:"terraform state mv <старый> <новый>",why:"state mv сохраняет связь ресурса с его реальным объектом при изменении адреса в коде — единственный безопасный способ переименования/переноса в модуль."},
 {t:"c",d:5,q:"Инцидент. В облаке вручную создали VPC полгода назад, документации нет, автор уволился. Напиши двумя словами, каким должен быть план перевода в код: сначала что (глагол), а критерий готовности — что показывает plan?",ans:["импортировать, пустой план","import, plan без изменений"],hint:"import → plan без diff как критерий",why:"Импорт без даунтайма привязывает существующий объект к state. Критерий успеха первого этапа — plan без изменений: значит код точно описывает реальность, дальше можно рефакторить осознанно."}]},

{id:"tf5",t:"Terraform в продвинутом CI/CD",goal:"Организовать пайплайн, который не даст применить лишнее",
 cards:[
 {h:"Полный пайплайн prod-инфраструктуры",b:"<pre>PR:      terraform fmt -check → validate → plan\n         план публикуется комментарием в PR (например, через terraform-docs/Atlantis)\n         tfsec/checkov на diff\nmerge:   сохранённый план из PR применяется в CI, без пересчёта заново\n         обязательный ручной аппрув (approval gate) перед apply в prod</pre><p>Ключевой момент: <b>apply использует тот же сохранённый план</b>, что видел ревьюер в PR — если между ревью и apply состояние изменилось, Terraform обнаружит рассинхрон и откажется применять устаревший план вместо того, чтобы тихо применить что-то другое.</p>",
  cheat:"apply применяет сохранённый план из PR, а не пересчитывает заново — иначе ревью бессмысленно"},
 {h:"Atlantis и подобные инструменты",b:"<p>Atlantis (или встроенные фичи GitLab/Terraform Cloud) автоматизируют цикл «PR → plan-комментарий → аппрув → apply» без ручного запуска CLI кем-либо. Разработчик пишет <code>atlantis plan</code> или <code>atlantis apply</code> прямо комментарием в PR — вся история решений остаётся в истории PR, а не в терминале инженера.</p><p>Это устраняет класс проблем «у кого-то на ноутбуке другая версия провайдера» — весь apply идёт из одного контролируемого окружения CI.</p>"},
 {h:"Approval gate перед prod",b:"<pre># .gitlab-ci.yml, упрощённо\napply_prod:\n  stage: deploy\n  script: terraform apply tfplan\n  when: manual\n  environment: production\n  needs: [plan_prod]</pre><p><code>when: manual</code> + <code>environment: production</code> — тот же принцип, что и в общем блоке CI/CD: ручной гейт перед необратимым или рискованным действием. Без него автоматический apply на прод-инфраструктуру после каждого merge — прямой путь к катастрофе от одной опечатки в PR.</p>",
  t:{q:"Каким ключом GitLab CI задают, что job деплоя в prod требует ручного нажатия кнопки?",ans:["when: manual","when:manual"],hint:"когда job не запускается автоматически",why:"Ручной гейт перед prod-apply — стандартная защита в зрелых пайплайнах: сохранённый план должен быть осознанно одобрен человеком, а не применён автоматически."}},
 {h:"lifecycle prevent_destroy как последний барьер",b:"<pre>resource \"aws_db_instance\" \"prod\" {\n  lifecycle {\n    prevent_destroy = true\n  }\n}</pre><p>Даже при прохождении всех пайплайнов и ревью человек может ошибиться. <code>prevent_destroy = true</code> на самых критичных ресурсах (боевая база данных) — технический барьер: Terraform физически откажется выполнять план, уничтожающий этот ресурс, даже если apply был запущен и одобрен по ошибке.</p><p>Это последний рубеж защиты, а не замена ревью плана — рубежи складываются, а не заменяют друг друга.</p>"}],
 ch:[
 {t:"q",d:1,q:"Почему apply в CI должен использовать тот же сохранённый план, что видел ревьюер в PR, а не пересчитывать заново?",a:["Так быстрее","Если между ревью и apply состояние изменилось, пересчёт заново означал бы применение чего-то, чего ревьюер не видел — ревью потеряло бы смысл","Экономит вычисления","Требование Terraform Cloud"],c:1,why:"Сохранённый план — гарантия, что применяется ровно то, что было одобрено, а не что-то, пересчитанное заново в другой момент времени."},
 {t:"q",d:2,q:"Что даёт инструмент вроде Atlantis поверх обычного CI с terraform plan/apply?",a:["Ускоряет apply","Автоматизирует цикл PR → plan-комментарий → аппрув → apply без ручного запуска CLI, вся история решений остаётся в PR","Заменяет провайдеров","Не нужен state"],c:1,why:"Устраняет класс проблем «у кого-то на ноутбуке другая версия» — весь процесс идёт через один контролируемый механизм, привязанный к PR."},
 {t:"c",d:3,q:"Напиши ключ GitLab CI (со значением), который требует ручного нажатия кнопки перед выполнением job'а apply_prod.",ans:["when: manual"],hint:"когда job не запускается автоматически",why:"Ручной гейт (when: manual + environment: production) — обязательная защита перед необратимым действием в проде."},
 {t:"c",d:3,q:"Напиши блок lifecycle (ключ: значение), который физически не даёт Terraform уничтожить помеченный ресурс, даже если план на это указывает.",ans:["prevent_destroy = true","prevent_destroy"],hint:"lifecycle { prevent_destroy = ... }",why:"Технический барьер, срабатывающий даже при ошибочно одобренном и запущенном apply — последний рубеж защиты для самых критичных ресурсов."},
 {t:"c",d:4,q:"В pipeline настроен полный цикл fmt/validate/plan/tfsec, но apply в prod срабатывает автоматически сразу после merge без паузы. Напиши, чего не хватает (два-три слова, рус.) перед apply в prod.",ans:["ручной аппрув","approval gate","ручное подтверждение"],hint:"пауза для решения человеком",why:"Автоматический apply без ревью на проде — прямой путь к катастрофе от одной опечатки в PR, даже если все автоматические проверки прошли."},
 {t:"c",d:5,q:"Инцидент. Инженер по ошибке одобрил и запустил apply, уничтожающий прод-базу данных (план прошёл все автоматические проверки). Напиши, какой атрибут ресурса нужно было настроить заранее, чтобы Terraform физически отказался выполнить это действие несмотря на одобрение.",ans:["prevent_destroy = true","prevent_destroy"],hint:"lifecycle { prevent_destroy = ... }",why:"prevent_destroy — технический барьер, не зависящий от человеческого фактора: даже ошибочно одобренный и запущенный apply будет отклонён самим Terraform для помеченного ресурса."}]}
);

{id:"py1",t:"Синтаксис по минимуму нужного",goal:"Читать и писать простой скрипт без лишней теории языка",
 cards:[
 {h:"Переменные и типы",b:"<pre>name = \"web-01\"          <span class='c'># str</span>\ncount = 3                 <span class='c'># int</span>\nratio = 0.95               <span class='c'># float</span>\nis_ready = True            <span class='c'># bool</span>\nhosts = [\"a\", \"b\", \"c\"]    <span class='c'># list — изменяемый, по индексу</span>\nconfig = {\"env\": \"prod\"}   <span class='c'># dict — ключ-значение</span></pre><p>Python не требует объявлять тип заранее — он определяется значением. Отступы (обычно 4 пробела) — это синтаксис, а не оформление: неверный отступ ломает выполнение блока кода, а не просто выглядит некрасиво.</p>",
  cheat:"list=[...] изменяемый по индексу, dict={...} ключ-значение, отступы=синтаксис"},
 {h:"f-строки",b:"<pre>host = \"web-01\"\nport = 8080\nprint(f\"Проверка {host}:{port}\")\nprint(f\"Занято диска: {used/total*100:.1f}%\")   <span class='c'># .1f — один знак после запятой</span></pre><p>f-строка (f-string) — самый читаемый способ подставить значения переменных в текст. Более старые способы (<code>%</code>-форматирование, <code>.format()</code>) встречаются в чужом коде, но для нового кода стандарт — f-строки.</p>",
  t:{q:"Напиши f-строку, которая выводит: Хост web-01, порт 8080 — используя переменные host и port.",ans:["f\"Хост {host}, порт {port}\"","f'Хост {host}, порт {port}'"],hint:"f\"текст {переменная} текст {переменная}\"",why:"f-строки — самый читаемый и быстрый способ подстановки значений, стандарт для нового кода."}},
 {h:"Условия и циклы",b:"<pre>if free_pct < 10:\n    print(\"мало места\")\nelif free_pct < 30:\n    print(\"скоро закончится\")\nelse:\n    print(\"ок\")\n\nfor host in hosts:\n    print(f\"проверяю {host}\")\n\nfor i, host in enumerate(hosts):     <span class='c'># индекс + значение</span>\n    print(i, host)</pre><p><code>enumerate()</code> — стандартный способ получить и индекс, и значение одновременно, не заводя отдельный счётчик вручную.</p>"},
 {h:"Функции",b:"<pre>def check_disk(path: str, threshold: int = 10) -> bool:\n    \"\"\"Возвращает True, если свободного места меньше threshold процентов.\"\"\"\n    free_pct = get_free_percent(path)\n    return free_pct < threshold\n\nif check_disk(\"/var\", threshold=5):\n    alert(\"мало места на /var\")</pre><p>Аннотации типов (<code>path: str</code>, <code>-> bool</code>) не проверяются самим Python во время выполнения, но делают код читаемым и позволяют внешним инструментам (mypy, IDE) ловить ошибки до запуска.</p>"}],
 ch:[
 {t:"c",d:1,q:"Напиши f-строку, подставляющую значения переменных name и count в текст «Хост {name}, реплик: {count}».",ans:["f\"Хост {name}, реплик: {count}\"","f'Хост {name}, реплик: {count}'"],hint:"f\"...{var}...\"",why:"f-строки — стандартный способ подстановки значений в текст в современном Python."},
 {t:"c",d:2,q:"Напиши цикл for, который перебирает список hosts и печатает каждый элемент.",ans:["for host in hosts:\n    print(host)","for h in hosts: print(h)"],hint:"for <элемент> in <список>:",why:"Базовая конструкция итерации по списку — используется в подавляющем большинстве инфраструктурных скриптов."},
 {t:"c",d:3,q:"Нужно перебрать список hosts и получить одновременно и индекс, и значение каждого элемента. Напиши функцию (одно слово), которая это даёт без отдельного счётчика.",ans:["enumerate"],hint:"for i, host in ...(hosts):",why:"enumerate() — стандартный способ получить пару (индекс, значение) в одном цикле, не заводя счётчик вручную."},
 {t:"c",d:3,q:"Напиши сигнатуру функции check_disk с параметром path типа str и необязательным параметром threshold типа int со значением по умолчанию 10, возвращающей bool.",ans:["def check_disk(path: str, threshold: int = 10) -> bool:"],hint:"def имя(параметр: тип, параметр: тип = значение) -> тип_возврата:",why:"Аннотации типов делают код читаемым и позволяют внешним инструментам (mypy, IDE) ловить ошибки до запуска, хотя сам интерпретатор их не проверяет."},
 {t:"c",d:4,q:"Скрипт использует изменяемую структуру данных для сопоставления ключ→значение (например, имя хоста → его IP). Напиши тип данных (англ., одно слово), который для этого используют в Python.",ans:["dict","dictionary"],hint:"фигурные скобки, пары ключ:значение",why:"dict — стандартная структура для отображений ключ→значение, аналог map/object в других языках."},
 {t:"c",d:5,q:"Инцидент. Скрипт с вложенными if/for падает с IndentationError после правки коллегой в другом редакторе. Напиши причину (два-три слова, рус.) — что смешалось в отступах и ломает синтаксис Python.",ans:["табы и пробелы","смешение табов и пробелов"],hint:"отступы — часть синтаксиса, а не оформление",why:"Python использует отступы как синтаксис блоков кода. Смешение табов и пробелов в одном файле — классическая причина IndentationError после правки в другом редакторе с другими настройками."}]},

{id:"py2",t:"Файлы, пути и обработка текста",goal:"Читать конфиги и логи так, чтобы это работало на любой ОС",
 cards:[
 {h:"Контекстный менеджер with",b:"<pre>with open(\"app.log\") as f:\n    for line in f:\n        if \"ERROR\" in line:\n            print(line.strip())</pre><p><code>with</code> гарантирует, что файл закроется даже при исключении внутри блока — эквивалент <code>try/finally: f.close()</code>, но короче и без риска забыть про закрытие. Итерация по файлу построчно не загружает весь файл в память сразу — работает и с логами в гигабайты.</p>",
  cheat:"with open(...) as f: — файл закроется сам, даже при исключении"},
 {h:"pathlib вместо ручной склейки строк",b:"<pre>from pathlib import Path\n\nlog_dir = Path(\"/var/log/app\")\nfor log_file in log_dir.glob(\"*.log\"):\n    print(log_file.name, log_file.stat().st_size)\n\nconfig_path = Path.home() / \".config\" / \"app.yaml\"   <span class='c'># / вместо ручной склейки</span></pre><p><code>pathlib</code> — современный способ работать с путями: оператор <code>/</code> склеивает части пути корректно на любой ОС (в отличие от ручной конкатенации строк со слэшем, которая ломается на Windows). Старый способ через <code>os.path.join()</code> тоже рабочий, но менее читаемый.</p>",
  t:{q:"Напиши код через pathlib, который склеивает домашнюю директорию пользователя с подпапкой .config и файлом app.yaml.",ans:["Path.home() / \".config\" / \"app.yaml\""],hint:"Path.home() / \"...\" / \"...\"",why:"Оператор / в pathlib корректно строит путь на любой ОС — в отличие от ручной склейки строк со слэшем."}},
 {h:"Чтение и запись, кодировка",b:"<pre>with open(\"report.txt\", \"w\", encoding=\"utf-8\") as f:\n    f.write(\"Отчёт готов\\n\")\n\nwith open(\"report.txt\", \"a\", encoding=\"utf-8\") as f:   <span class='c'># дописать в конец</span>\n    f.write(\"ещё строка\\n\")</pre><p><code>\"w\"</code> — перезаписать файл целиком (существующее содержимое теряется), <code>\"a\"</code> — дописать в конец. Явный <code>encoding=\"utf-8\"</code> важен на серверах с иной локалью по умолчанию — без него могут вылезти проблемы с не-ASCII символами, например с русским текстом в логах.</p>"},
 {h:"Обработка текста построчно",b:"<pre>with open(\"access.log\") as f:\n    status_500 = sum(1 for line in f if \" 500 \" in line)\nprint(f\"Найдено ошибок 500: {status_500}\")</pre><p><code>sum(1 for line in f if ...)</code> — генераторное выражение, аналог <code>cat access.log | grep 500 | wc -l</code> из bash, но внутри Python-скрипта, где дальше можно делать что-то ещё с результатом (алерт, запись в отчёт), а не только печатать число.</p>"}],
 ch:[
 {t:"c",d:1,q:"Напиши код, открывающий файл app.log на чтение с гарантированным закрытием файла.",ans:["with open(\"app.log\") as f:"],hint:"with open(...) as f:",why:"with гарантирует закрытие файла даже при исключении внутри блока — эквивалент try/finally, но короче."},
 {t:"c",d:2,q:"Напиши код, который открывает report.txt на дозапись (не перезаписывая существующее содержимое).",ans:["open(\"report.txt\", \"a\")","open(\"report.txt\", \"a\", encoding=\"utf-8\")"],hint:"второй аргумент open() — режим",why:"\"a\" (append) дописывает в конец файла, в отличие от \"w\", который стирает существующее содержимое."},
 {t:"c",d:3,q:"Нужно построить путь: домашняя директория / .config / app.yaml — так, чтобы это работало и на Linux, и на Windows. Напиши код через pathlib.",ans:["Path.home() / \".config\" / \"app.yaml\""],hint:"from pathlib import Path; Path.home() / ...",why:"Оператор / в pathlib корректно строит путь на любой ОС, в отличие от ручной склейки строк со слэшем."},
 {t:"c",d:3,q:"Скрипт пишет русский текст в файл на сервере с нестандартной локалью, и в файле появляется мусор вместо кириллицы. Напиши аргумент open(), который нужно указать явно, чтобы это исправить.",ans:["encoding=\"utf-8\"","encoding='utf-8'"],hint:"явное указание кодировки",why:"Без явного encoding Python использует кодировку по умолчанию из локали ОС — на сервере с иной локалью не-ASCII символы могут записаться некорректно."},
 {t:"c",d:4,q:"Напиши генераторное выражение, которое считает количество строк со ' 500 ' в открытом файле f (аналог grep 500 | wc -l).",ans:["sum(1 for line in f if \" 500 \" in line)"],hint:"sum(1 for line in f if условие)",why:"Генераторное выражение — питоновский аналог конвейера grep|wc -l, но результат доступен дальше в коде для алертов или отчётов."},
 {t:"c",d:5,q:"Инцидент. Скрипт читает лог-файл размером 8 ГБ и падает с MemoryError. Напиши, что нужно изменить в подходе к чтению (два-три слова, рус.) — как читать файл, чтобы не загружать его целиком в память.",ans:["построчно","итерация по строкам"],hint:"for line in f — не f.read()",why:"Итерация по файлу построчно (for line in f) читает по одной строке за раз, не загружая весь файл в память — в отличие от f.read(), которое пытается вместить весь файл целиком."}]},

{id:"py3",t:"JSON и YAML",goal:"Безопасно читать и писать структурированные конфиги",
 cards:[
 {h:"JSON — почти нативные структуры Python",b:"<pre>import json\n\nwith open(\"config.json\") as f:\n    config = json.load(f)          <span class='c'># файл → dict/list</span>\n\nprint(config[\"database\"][\"host\"])\n\nwith open(\"out.json\", \"w\") as f:\n    json.dump(config, f, indent=2)  <span class='c'># dict/list → файл, читаемо отформатировано</span></pre><p><code>json.load</code> читает из файла, <code>json.loads</code> (с 's') — из строки. Аналогично для записи: <code>dump</code> в файл, <code>dumps</code> в строку. JSON естественно превращается в dict/list/str/int/bool — никакой отдельной схемы описывать не нужно.</p>",
  cheat:"load/dump — файл, loads/dumps — строка (l+s = load string)"},
 {h:"YAML требует библиотеку и осторожности",b:"<pre>import yaml\n\nwith open(\"config.yaml\") as f:\n    config = yaml.safe_load(f)     <span class='c'># НЕ yaml.load()</span></pre><p><code>yaml.load()</code> без явного загрузчика может десериализовать произвольные Python-объекты из YAML — это уязвимость выполнения кода (RCE) на непроверенном входе. <code>yaml.safe_load()</code> ограничивается простыми типами (строки, числа, списки, словари) и должен быть выбором по умолчанию всегда, а не только «для безопасности на всякий случай».</p>",
  t:{q:"Напиши безопасный способ прочитать YAML-файл в переменную config (без risk RCE).",ans:["yaml.safe_load(f)","config = yaml.safe_load(f)"],hint:"safe_ версия load",why:"yaml.load() без загрузчика может выполнить произвольный код из вредоносного YAML — safe_load ограничивается простыми типами данных."}},
 {h:"Обработка отсутствующих ключей",b:"<pre>timeout = config.get(\"timeout\", 30)     <span class='c'># значение по умолчанию, если ключа нет</span>\n\n# config[\"timeout\"] упадёт с KeyError, если ключа нет —\n# .get() вернёт None (или указанное значение) вместо падения</pre><p><code>.get(key, default)</code> — стандартный способ читать необязательные поля конфига без падения скрипта на отсутствующем ключе. Обязательные поля, наоборот, лучше читать через прямой доступ <code>config[\"key\"]</code> — пусть скрипт упадёт сразу с понятной ошибкой, а не продолжит работу с None там, где нужно реальное значение.</p>"},
 {h:"Валидация структуры перед использованием",b:"<pre>required = [\"host\", \"port\"]\nmissing = [k for k in required if k not in config]\nif missing:\n    raise ValueError(f\"В конфиге не хватает полей: {missing}\")</pre><p>Проверка структуры конфига сразу после чтения — то же самое, что <code>validation</code> в переменных Terraform: дешёвая проверка на входе вместо непонятной ошибки где-то в середине выполнения скрипта, когда до реальной причины уже далеко.</p>"}],
 ch:[
 {t:"c",d:1,q:"Напиши код, читающий JSON-файл config.json в переменную config.",ans:["config = json.load(f)","json.load(f)"],hint:"json.load(файловый_объект)",why:"json.load читает из открытого файла и сразу возвращает Python-структуру (dict/list)."},
 {t:"c",d:2,q:"Напиши безопасный способ прочитать YAML-файл, открытый как f, в переменную config.",ans:["config = yaml.safe_load(f)","yaml.safe_load(f)"],hint:"safe_load, не load",why:"yaml.safe_load ограничивается простыми типами данных и не подвержен RCE-уязвимости обычного yaml.load()."},
 {t:"c",d:3,q:"Конфиг может не содержать необязательное поле timeout. Напиши код, который читает его со значением по умолчанию 30, не падая при отсутствии ключа.",ans:["config.get(\"timeout\", 30)"],hint:".get(ключ, значение_по_умолчанию)",why:".get() с default — стандартный способ безопасно читать необязательные поля без KeyError."},
 {t:"c",d:3,q:"Код-ревью заблокировал PR со строкой yaml.load(f) без аргументов. Напиши исправленную версию.",ans:["yaml.safe_load(f)"],hint:"добавить safe_",why:"yaml.load() без указания Loader может выполнить произвольный Python-код из вредоносного YAML — классическая уязвимость на непроверенном вводе."},
 {t:"c",d:4,q:"Напиши код, который сохраняет dict config в файл out.json в читаемо отформатированном виде (с отступом 2 пробела).",ans:["json.dump(config, f, indent=2)"],hint:"json.dump(данные, файл, indent=N)",why:"indent=2 делает JSON человекочитаемым (аналог jq . для просмотра), без него json.dump пишет всё в одну строку."},
 {t:"c",d:5,q:"Инцидент. Скрипт автоматизации упал в середине выполнения с KeyError: 'port', потратив 10 минут на предыдущие шаги впустую. Напиши, что нужно было добавить сразу после чтения конфига (термин, рус.) — чтобы ошибка обнаружилась мгновенно, а не через 10 минут.",ans:["валидацию","проверку обязательных полей"],hint:"по аналогии с validation в Terraform variables",why:"Проверка обязательных полей конфига сразу после чтения — дешёвая защита, которая останавливает скрипт с понятной ошибкой в начале, а не даёт ему выполнить половину работы впустую перед падением."}]},

{id:"py4",t:"subprocess: вызов внешних команд",goal:"Запускать shell-команды из питона так, чтобы ошибки не терялись",
 cards:[
 {h:"subprocess.run — базовый вызов",b:"<pre>import subprocess\n\nresult = subprocess.run(\n    [\"docker\", \"ps\", \"-a\"],\n    capture_output=True, text=True\n)\nprint(result.stdout)\nprint(result.returncode)   <span class='c'># 0 — успех, как $? в bash</span></pre><p>Команду передают <b>списком аргументов</b>, а не одной строкой — это защищает от инъекций через пробелы и спецсимволы в переменных, которые попадают в команду. <code>capture_output=True</code> перехватывает stdout/stderr вместо вывода прямо в терминал, <code>text=True</code> возвращает строки вместо байтов.</p>",
  cheat:"список аргументов, не строка — защита от shell-инъекций"},
 {h:"check=True — не терять ошибки молча",b:"<pre>subprocess.run([\"terraform\", \"apply\", \"-auto-approve\"], check=True)\n<span class='c'># без check=True: команда упала, скрипт как ни в чём не бывало идёт дальше</span>\n<span class='c'># с check=True: при ненулевом коде возврата — исключение CalledProcessError</span></pre><p>Без <code>check=True</code> subprocess.run молча продолжает выполнение при ненулевом коде возврата команды — тот же класс проблем, что скрипт без <code>set -e</code> в bash. <code>check=True</code> — обязательная привычка для любой команды, провал которой критичен для дальнейшей логики скрипта.</p>",
  t:{q:"Допиши subprocess.run, чтобы при ненулевом коде возврата команды скрипт бросал исключение вместо молчаливого продолжения.",ans:["check=True"],hint:"именованный аргумент run()",why:"Без check=True subprocess.run продолжает выполнение при ошибке команды — тот же класс проблем, что скрипт без set -e в bash."}},
 {h:"Передача аргументов и переменных окружения",b:"<pre>host = \"prod-01\"      <span class='c'># значение из внешнего источника, потенциально небезопасное</span>\nsubprocess.run([\"ssh\", host, \"uptime\"])   <span class='c'># безопасно: host — отдельный элемент списка</span>\n\nimport os\nenv = os.environ.copy()\nenv[\"AWS_PROFILE\"] = \"prod\"\nsubprocess.run([\"aws\", \"s3\", \"ls\"], env=env)</pre><p><code>shell=True</code> (передача команды одной строкой) — соблазн для простоты, но открывает shell-инъекцию, если в команду попадает значение из внешнего источника (аргумент пользователя, ответ API). По умолчанию используют список аргументов и <code>shell=False</code> (значение по умолчанию).</p>"},
 {h:"Таймауты для внешних команд",b:"<pre>try:\n    subprocess.run([\"curl\", url], timeout=10, check=True)\nexcept subprocess.TimeoutExpired:\n    print(f\"{url} не ответил за 10 секунд\")</pre><p>Без <code>timeout</code> зависшая внешняя команда (например, curl к недоступному хосту) подвесит скрипт навсегда. Особенно критично для CI и cron-скриптов, где зависший процесс блокирует весь дальнейший конвейер, а не только один шаг.</p>"}],
 ch:[
 {t:"c",d:1,q:"Напиши вызов subprocess.run для команды docker ps -a с перехватом вывода в текстовом виде.",ans:["subprocess.run([\"docker\", \"ps\", \"-a\"], capture_output=True, text=True)"],hint:"список аргументов + capture_output=True + text=True",why:"Список аргументов вместо строки защищает от shell-инъекций, capture_output перехватывает stdout/stderr для дальнейшей обработки."},
 {t:"c",d:2,q:"Напиши код возврата команды, доступный после subprocess.run() как атрибут result (0 — успех).",ans:["result.returncode","returncode"],hint:"аналог $? из bash",why:"returncode — то же самое, что $? в bash: 0 означает успех, любое другое число — ошибку."},
 {t:"c",d:3,q:"Скрипт вызывает terraform apply через subprocess.run и продолжает выполнение, даже если apply реально упал. Напиши аргумент, который нужно добавить, чтобы при ошибке команды бросалось исключение.",ans:["check=True"],hint:"именованный аргумент run()",why:"Без check=True subprocess.run молча продолжает выполнение при ненулевом коде возврата — как скрипт без set -e."},
 {t:"c",d:3,q:"Скрипт передаёт значение host (пришедшее откуда-то извне) в команду ssh одной строкой через shell=True. Напиши безопасную альтернативу — как передать команду ssh с аргументом host (в виде списка).",ans:["[\"ssh\", host, \"uptime\"]","subprocess.run([\"ssh\", host, \"uptime\"])"],hint:"список аргументов вместо строки с shell=True",why:"Список аргументов передаёт host как отдельный элемент, не подверженный интерпретации shell — в отличие от shell=True с конкатенацией строк, открывающей инъекцию."},
 {t:"c",d:4,q:"Скрипт вызывает curl к внешнему URL через subprocess без ограничения по времени, и раз в несколько недель зависает намертво. Напиши аргумент (с примерным значением в секундах), который нужно добавить.",ans:["timeout=10","timeout=30"],hint:"именованный аргумент run()",why:"Без timeout зависшая внешняя команда подвешивает скрипт навсегда — особенно опасно в CI и cron, где это блокирует весь дальнейший конвейер."},
 {t:"c",d:5,q:"Инцидент. Cron-скрипт деплоя раз в несколько недель зависает навсегда, занимая слот в расписании и блокируя следующий запуск. В коде — subprocess.run([\"curl\", url]) без дополнительных аргументов. Напиши недостающий аргумент (с значением), который решает проблему.",ans:["timeout=10","timeout=30"],hint:"ограничение времени ожидания внешней команды",why:"timeout прерывает зависшую команду исключением TimeoutExpired вместо бесконечного ожидания — без него один недоступный хост может остановить весь конвейер автоматизации."}]},

{id:"py5",t:"requests: работа с HTTP API",goal:"Ходить в чужие API так, чтобы это не подвешивало скрипт",
 cards:[
 {h:"Базовый запрос",b:"<pre>import requests\n\nresp = requests.get(\"https://api.example.com/status\", timeout=5)\nresp.raise_for_status()      <span class='c'># бросает исключение при 4xx/5xx</span>\ndata = resp.json()\nprint(data[\"status\"])</pre><p><code>resp.status_code</code> — числовой код (200, 404, 500...), <code>resp.raise_for_status()</code> — превращает плохой код в исключение <code>requests.HTTPError</code>, чтобы не проверять код вручную после каждого запроса. <code>resp.json()</code> парсит тело ответа как JSON автоматически.</p>",
  cheat:"resp.raise_for_status() — превращает 4xx/5xx в исключение, resp.json() — парсит тело"},
 {h:"Таймаут — не опция, а обязательство",b:"<pre>requests.get(url)                <span class='c'># ОПАСНО: таймаута нет вовсе по умолчанию</span>\nrequests.get(url, timeout=5)     <span class='c'># правильно</span></pre><p>У <code>requests</code> нет таймаута по умолчанию — запрос может ждать ответа <b>бесконечно</b>, если сервер на другом конце завис, но не разорвал TCP-соединение. Это одна из самых частых причин зависших CI-джобов и cron-задач в реальной эксплуатации, а не гипотетическая проблема.</p>",
  t:{q:"Допиши requests.get(url) так, чтобы запрос ждал ответа не дольше 5 секунд.",ans:["requests.get(url, timeout=5)"],hint:"именованный аргумент timeout",why:"У requests нет таймаута по умолчанию — без него зависший сервер на другом конце подвешивает скрипт навсегда."}},
 {h:"POST с JSON и заголовками",b:"<pre>resp = requests.post(\n    \"https://api.example.com/deploy\",\n    json={\"version\": \"1a2b3c4\", \"env\": \"prod\"},\n    headers={\"Authorization\": f\"Bearer {token}\"},\n    timeout=10\n)</pre><p>Параметр <code>json=</code> сам сериализует dict в JSON и ставит правильный <code>Content-Type</code> — не нужно вызывать <code>json.dumps()</code> вручную. Токен передают в заголовке, а не в URL — параметры URL логируются прокси и веб-серверами, заголовки авторизации по умолчанию так явно не журналируются.</p>"},
 {h:"Повторные попытки при нестабильной сети",b:"<pre>from requests.adapters import HTTPAdapter\nfrom urllib3.util.retry import Retry\n\nsession = requests.Session()\nretries = Retry(total=3, backoff_factor=1, status_forcelist=[502, 503, 504])\nsession.mount(\"https://\", HTTPAdapter(max_retries=retries))\n\nresp = session.get(url, timeout=5)</pre><p>Одиночный сбойный запрос из-за кратковременной сетевой проблемы не должен ронять весь скрипт. <code>Retry</code> с <code>backoff_factor</code> повторяет запрос с растущей паузой между попытками — тот же принцип, что exponential backoff в любой распределённой системе.</p>"}],
 ch:[
 {t:"c",d:1,q:"Напиши GET-запрос к https://api.example.com/status с таймаутом 5 секунд.",ans:["requests.get(\"https://api.example.com/status\", timeout=5)"],hint:"requests.get(url, timeout=N)",why:"Таймаут обязателен всегда — у requests нет значения по умолчанию, и без него запрос может ждать вечно."},
 {t:"c",d:2,q:"Напиши метод объекта ответа resp, который парсит тело ответа как JSON.",ans:["resp.json()"],hint:".json()",why:"resp.json() автоматически десериализует тело ответа, эквивалент json.loads(resp.text)."},
 {t:"c",d:3,q:"Запрос вернул код 500, но скрипт продолжает работать с пустыми/некорректными данными, не замечая ошибки. Напиши метод, который нужно вызвать сразу после запроса, чтобы плохой код ответа превратился в исключение.",ans:["resp.raise_for_status()"],hint:".raise_for_status()",why:"raise_for_status() бросает HTTPError на 4xx/5xx — без него скрипт может молча работать с телом ошибки как будто это нормальный ответ."},
 {t:"c",d:3,q:"Напиши POST-запрос к https://api.example.com/deploy с JSON-телом {\"version\": \"1a2b3c4\"} и таймаутом 10 секунд.",ans:["requests.post(\"https://api.example.com/deploy\", json={\"version\": \"1a2b3c4\"}, timeout=10)"],hint:"requests.post(url, json={...}, timeout=N)",why:"json= сам сериализует dict и ставит правильный Content-Type — не нужно вызывать json.dumps() вручную."},
 {t:"c",d:4,q:"API токен нужно передать для авторизации запроса. Напиши, куда его правильно поместить (два слова, рус.) — не в URL как query-параметр.",ans:["в заголовок","в headers"],hint:"Authorization: Bearer ...",why:"Параметры URL логируются прокси и веб-серверами по пути следования запроса; заголовки авторизации так явно по умолчанию не журналируются."},
 {t:"c",d:5,q:"Инцидент. Cron-скрипт, дёргающий внутреннее API раз в минуту, зависает раз в несколько дней и блокирует все последующие запуски. В коде requests.get(url) без дополнительных параметров. Напиши недостающий аргумент с примерным значением.",ans:["timeout=5","timeout=10"],hint:"обязательный аргумент requests",why:"Без timeout запрос к зависшему серверу ждёт ответа бесконечно — классическая причина зависших cron-задач, которую легко не заметить в коде до первого реального инцидента."}]},

{id:"py6",t:"argparse: превратить скрипт в инструмент",goal:"Сделать CLI, которым не страшно пользоваться другим",
 cards:[
 {h:"Базовый парсер",b:"<pre>import argparse\n\nparser = argparse.ArgumentParser(description=\"Проверка дискового пространства\")\nparser.add_argument(\"path\", help=\"путь для проверки\")\nparser.add_argument(\"--threshold\", type=int, default=10, help=\"порог в процентах\")\nargs = parser.parse_args()\n\nprint(args.path, args.threshold)</pre><p>Позиционный аргумент (<code>path</code>) обязателен и передаётся по порядку. Аргумент с <code>--</code> (<code>--threshold</code>) — именованный, необязательный, если задан <code>default</code>. <code>argparse</code> сам генерирует <code>--help</code> и сообщения об ошибках при неверных аргументах — не нужно писать это вручную.</p>",
  cheat:"позиционный аргумент = обязателен по порядку, --flag = именованный опциональный"},
 {h:"Флаги действия (store_true)",b:"<pre>parser.add_argument(\"--dry-run\", action=\"store_true\",\n                     help=\"показать, что будет сделано, без применения\")\nparser.add_argument(\"--verbose\", \"-v\", action=\"store_true\")\n\nargs = parser.parse_args()\nif args.dry_run:\n    print(\"[dry-run] удалил бы 5 старых релизов\")\nelse:\n    delete_old_releases()</pre><p><code>action=\"store_true\"</code> превращает флаг в булево значение: указан — <code>True</code>, не указан — <code>False</code>, без явного значения после флага. <code>--dry-run</code> — стандартная практика для скриптов с деструктивными действиями: сначала показать план, только потом выполнять по явному запросу.</p>",
  t:{q:"Напиши add_argument для флага --dry-run, который превращается в True/False без дополнительного значения после себя.",ans:["parser.add_argument(\"--dry-run\", action=\"store_true\")"],hint:"action=\"store_true\"",why:"store_true делает флаг булевым переключателем — стандартная практика для превью деструктивных действий перед их реальным выполнением."}},
 {h:"Обязательные vs опциональные с безопасным поведением по умолчанию",b:"<pre>parser.add_argument(\"--keep-releases\", type=int, default=5,\n                     help=\"сколько последних релизов сохранить\")\nparser.add_argument(\"--force-delete-all\", action=\"store_true\",\n                     help=\"УДАЛИТЬ ВСЕ релизы без сохранения (опасно)\")</pre><p>Безопасное поведение (сохранить релизы) должно быть значением <b>по умолчанию</b>, а деструктивное действие — требовать явного флага с говорящим именем. Скрипт, запущенный без параметров по ошибке, не должен совершать необратимое действие.</p>"},
 {h:"Подкоманды для сложных CLI",b:"<pre>subparsers = parser.add_subparsers(dest=\"command\")\ndeploy_parser = subparsers.add_parser(\"deploy\")\ndeploy_parser.add_argument(\"--version\", required=True)\n\nrollback_parser = subparsers.add_parser(\"rollback\")\n\n# использование: mytool.py deploy --version 1.2.3\n#                mytool.py rollback</pre><p>Подкоманды (как у <code>git commit</code>, <code>git push</code>) организуют инструмент с несколькими режимами работы в понятный интерфейс — вместо одного скрипта с десятком взаимоисключающих флагов, в которых легко запутаться.</p>"}],
 ch:[
 {t:"c",d:1,q:"Напиши add_argument для обязательного позиционного аргумента path.",ans:["parser.add_argument(\"path\")"],hint:"без -- перед именем",why:"Позиционный аргумент без -- обязателен и передаётся по порядку — path нужно указать всегда, иначе argparse сам покажет ошибку."},
 {t:"c",d:2,q:"Напиши add_argument для необязательного именованного аргумента --threshold типа int со значением по умолчанию 10.",ans:["parser.add_argument(\"--threshold\", type=int, default=10)"],hint:"--flag, type=, default=",why:"type= преобразует переданную строку в нужный тип, default= задаёт значение, если флаг не указан."},
 {t:"c",d:3,q:"Напиши add_argument для флага --dry-run, который включается простым указанием флага без значения после него (булево True/False).",ans:["parser.add_argument(\"--dry-run\", action=\"store_true\")"],hint:"action=\"store_true\"",why:"store_true — стандартный способ сделать флаг переключателем; без него argparse ожидал бы значение после --dry-run."},
 {t:"c",d:3,q:"Скрипт деплоя запускается без аргументов и по умолчанию удаляет старые релизы, если не передан флаг --keep-releases. Опиши безопасное решение: что должно быть поведением по умолчанию (глагол).",ans:["сохранять релизы","не удалять"],hint:"безопасное поведение по умолчанию, деструктивное — по явному флагу",why:"Опасные операции не должны быть поведением по умолчанию — деструктивное действие должно требовать явного флага, а безопасное поведение быть значением по умолчанию."},
 {t:"c",d:4,q:"CLI-инструмент должен поддерживать режимы deploy и rollback с разными наборами аргументов у каждого. Напиши название механизма argparse (одно слово, англ.) для организации таких режимов.",ans:["subparsers","subcommands"],hint:"как у git commit / git push",why:"Подкоманды организуют инструмент с несколькими режимами работы в понятный интерфейс вместо одного скрипта с десятком взаимоисключающих флагов."},
 {t:"c",d:5,q:"Инцидент. Коллега случайно запустил скрипт деплоя без параметров, и он удалил все старые релизы, хотя предполагалось сохранять последние 5 по умолчанию. Напиши, какое значение по умолчанию у параметра --keep-releases должно было предотвратить это (число).",ans:["5"],hint:"сколько релизов сохранять по умолчанию",why:"default=5 у --keep-releases означает, что скрипт без явных параметров сохраняет последние 5 релизов — деструктивное поведение (удалить всё) требует отдельного явного флага, а не срабатывает по умолчанию."}]},

{id:"py7",t:"Обработка ошибок и логирование",goal:"Сделать так, чтобы скрипт падал понятно, а не молча",
 cards:[
 {h:"try/except — не глушить всё подряд",b:"<pre>try:\n    config = json.load(open(\"config.json\"))\nexcept FileNotFoundError:\n    print(\"config.json не найден, использую значения по умолчанию\")\n    config = {}\nexcept json.JSONDecodeError as e:\n    print(f\"config.json повреждён: {e}\")\n    sys.exit(1)</pre><p>Ловить конкретный тип исключения (<code>FileNotFoundError</code>, <code>json.JSONDecodeError</code>) вместо голого <code>except:</code> — обязательная практика: голый <code>except</code> глушит вообще всё, включая <code>KeyboardInterrupt</code> и настоящие баги в коде, которые нужно увидеть, а не молча проглотить.</p>",
  cheat:"except ConкретныйТип: — никогда голый except: (глушит абсолютно всё, включая баги)"},
 {h:"logging вместо print для реальных скриптов",b:"<pre>import logging\n\nlogging.basicConfig(\n    level=logging.INFO,\n    format=\"%(asctime)s %(levelname)s %(message)s\"\n)\nlog = logging.getLogger(__name__)\n\nlog.info(\"Деплой начат\")\nlog.warning(\"Диск заполнен на 85%%\")\nlog.error(\"Не удалось подключиться к базе\")</pre><p><code>print()</code> годится для быстрого скрипта на коленке. Для чего-то, что будет работать регулярно (cron, CI), <code>logging</code> даёт уровни важности (можно фильтровать), временные метки автоматически и возможность направить вывод и в файл, и в консоль одновременно без переписывания кода.</p>",
  t:{q:"Напиши строку, которая логирует сообщение уровня warning: 'Диск заполнен на 85%'.",ans:["log.warning(\"Диск заполнен на 85%\")","logging.warning(\"Диск заполнен на 85%\")"],hint:"log.warning(...) или logging.warning(...)",why:"logging разделяет сообщения по уровням важности (info/warning/error) — можно фильтровать вывод по уровню, чего не даёт обычный print()."}},
 {h:"raise и собственные исключения",b:"<pre>class ConfigError(Exception):\n    pass\n\ndef load_config(path):\n    if not os.path.exists(path):\n        raise ConfigError(f\"конфиг не найден: {path}\")\n    return json.load(open(path))</pre><p>Собственный класс исключения (наследник <code>Exception</code>) делает код читаемым для того, кто вызывает функцию: <code>except ConfigError:</code> явно говорит, какую именно проблему обрабатывают, в отличие от перехвата общего <code>Exception</code>, под который попадёт что угодно.</p>"},
 {h:"finally и очистка ресурсов",b:"<pre>lock_file = \"/tmp/deploy.lock\"\nopen(lock_file, \"w\").close()\ntry:\n    run_deploy()\nfinally:\n    os.remove(lock_file)   <span class='c'># выполнится всегда, даже при исключении в run_deploy()</span></pre><p><code>finally</code> выполняется независимо от того, было исключение или нет — используется для гарантированной очистки: снять lock-файл, закрыть соединение, удалить временную директорию. Без <code>finally</code> упавший на середине скрипт может оставить систему в неконсистентном состоянии (забытый lock блокирует все следующие запуски).</p>"}],
 ch:[
 {t:"q",d:1,q:"Почему голый except: (без указания типа исключения) считается плохой практикой?",a:["Он медленнее работает","Глушит абсолютно всё, включая настоящие баги и KeyboardInterrupt, которые нужно увидеть, а не молча проглотить","Он не поддерживается в новых версиях Python","Требует больше памяти"],c:1,why:"Ловить конкретный тип исключения — обязательная практика: неожиданная ошибка должна быть видна, а не тихо исчезнуть внутри except:."},
 {t:"c",d:2,q:"Напиши строку логирования сообщения об ошибке уровня error: 'Не удалось подключиться к базе'.",ans:["log.error(\"Не удалось подключиться к базе\")","logging.error(\"Не удалось подключиться к базе\")"],hint:"log.error(...)",why:"Уровень error для реальных проблем позволяет фильтровать логи и находить критичные сообщения быстро."},
 {t:"c",d:3,q:"Скрипт должен корректно обработать случай, когда config.json не найден, отдельно от случая, когда файл найден, но повреждён. Напиши, какой блок except нужно поставить первым для более специфичной ошибки — FileNotFoundError.",ans:["except FileNotFoundError:"],hint:"более специфичное исключение обрабатывается отдельно",why:"Разные типы исключений — разные причины и разные разумные действия: отсутствующий файл можно заменить значениями по умолчанию, повреждённый — нужно останавливать скрипт."},
 {t:"c",d:3,q:"Скрипт создаёт lock-файл перед деплоем, но при падении run_deploy() lock-файл остаётся навсегда и блокирует следующие запуски. Напиши блок (одно слово), который гарантированно выполнится и уберёт lock-файл — с исключением или без него.",ans:["finally"],hint:"выполняется всегда, независимо от исключения",why:"finally выполняется вне зависимости от того, было исключение в try или нет — единственный надёжный способ гарантировать очистку ресурсов."},
 {t:"c",d:4,q:"Напиши определение собственного класса исключения ConfigError, наследующего Exception.",ans:["class ConfigError(Exception):\n    pass"],hint:"class Имя(Exception): pass",why:"Собственный класс исключения делает код читаемым для вызывающей стороны: except ConfigError явно говорит, какая именно проблема обрабатывается."},
 {t:"c",d:5,q:"Инцидент. Скрипт деплоя упал в середине из-за сетевой ошибки, оставив lock-файл /tmp/deploy.lock, который блокирует все следующие запуски навсегда. Напиши блок, в который нужно было обернуть удаление lock-файла (os.remove), чтобы оно произошло даже при падении run_deploy().",ans:["finally"],hint:"гарантированная очистка независимо от исключения",why:"Без finally очистка ресурсов (снятие lock, закрытие соединений) может не выполниться при исключении — система остаётся в неконсистентном состоянии до ручного вмешательства."}]},

{id:"py8",t:"Свой exporter для Prometheus",goal:"Собрать всё изученное в один сквозной пример",
 cards:[
 {h:"Формат экспозиции руками",b:"<pre>from http.server import HTTPServer, BaseHTTPRequestHandler\n\nclass MetricsHandler(BaseHTTPRequestHandler):\n    def do_GET(self):\n        if self.path == \"/metrics\":\n            body = (\n                \"# HELP queue_size Current queue size\\n\"\n                \"# TYPE queue_size gauge\\n\"\n                f\"queue_size {get_queue_size()}\\n\"\n            )\n            self.send_response(200)\n            self.send_header(\"Content-Type\", \"text/plain\")\n            self.end_headers()\n            self.wfile.write(body.encode())\n\nHTTPServer((\"0.0.0.0\", 9200), MetricsHandler).serve_forever()</pre><p>Формат экспозиции Prometheus — обычный текст: строка <code>имя_метрики значение</code>, плюс необязательные комментарии <code># HELP</code>/<code># TYPE</code>. Никакой специальной библиотеки не требуется, чтобы это заработало — достаточно отдать правильно оформленный текст на HTTP-запрос.</p>",
  cheat:"формат экспозиции: 'имя_метрики значение\\n', # HELP и # TYPE — необязательные комментарии"},
 {h:"prometheus_client — готовая библиотека",b:"<pre>from prometheus_client import start_http_server, Gauge, Counter\n\nQUEUE_SIZE = Gauge('queue_size', 'Current queue size')\nJOBS_PROCESSED = Counter('jobs_processed_total', 'Total processed jobs')\n\nstart_http_server(9200)   <span class='c'># сам поднимает /metrics на порту 9200</span>\n\nwhile True:\n    QUEUE_SIZE.set(get_queue_size())\n    JOBS_PROCESSED.inc()\n    time.sleep(15)</pre><p>Для реального проекта вместо ручного форматирования текста используют официальную библиотеку <code>prometheus_client</code> — она сама реализует формат экспозиции, потокобезопасность счётчиков и HTTP-сервер, оставляя разработчику только обновлять значения метрик.</p>",
  t:{q:"Напиши создание метрики типа Gauge с именем queue_size и описанием 'Current queue size'.",ans:["Gauge('queue_size', 'Current queue size')"],hint:"Gauge(имя, описание)",why:"Gauge — метрика, которая может расти и падать (в отличие от Counter, который только растёт) — подходит для размера очереди."}},
 {h:"Правильный выбор типа метрики",b:"<p>Тот же выбор, что и в самом Prometheus: <b>Gauge</b> для значений, которые могут расти и падать (размер очереди, число активных соединений), <b>Counter</b> для событий, которые только накапливаются (число обработанных задач, число ошибок). Неверный выбор типа ломает <code>rate()</code> и алерты на этой метрике на стороне Prometheus — падающий Counter интерпретируется как рестарт процесса, а не как реальное уменьшение значения.</p><p>Практика: если значение способно уменьшиться при нормальной работе (не при рестарте) — это всегда Gauge, не Counter.</p>"},
 {h:"Собираем всё вместе: собственный exporter очереди задач",b:"<pre>import time, logging, subprocess\nfrom prometheus_client import start_http_server, Gauge\n\nlogging.basicConfig(level=logging.INFO)\nlog = logging.getLogger(\"queue_exporter\")\nQUEUE_SIZE = Gauge('queue_size', 'Jobs waiting in queue')\n\ndef get_queue_size() -> int:\n    result = subprocess.run(\n        [\"redis-cli\", \"llen\", \"jobs\"],\n        capture_output=True, text=True, timeout=5, check=True\n    )\n    return int(result.stdout.strip())\n\nif __name__ == \"__main__\":\n    start_http_server(9200)\n    log.info(\"exporter запущен на :9200\")\n    while True:\n        try:\n            QUEUE_SIZE.set(get_queue_size())\n        except Exception as e:\n            log.error(f\"не удалось получить размер очереди: {e}\")\n        time.sleep(15)</pre><p>Этот пример объединяет все темы мира: subprocess с timeout и check, логирование вместо print, try/except вокруг ненадёжной операции, правильный тип метрики Gauge, и сам HTTP-сервер для Prometheus.</p>"}],
 ch:[
 {t:"q",d:1,q:"Что нужно, чтобы приложение начало отдавать метрики в формате Prometheus?",a:["Обязательно установить сам Prometheus рядом","Отдать на HTTP-запрос текст в формате экспозиции (имя_метрики значение) — никакой специальной библиотеки для самого факта работы не требуется","Купить лицензию","Только через официальный SDK, вручную невозможно"],c:1,why:"Формат экспозиции — обычный текст. prometheus_client облегчает жизнь (потокобезопасность, готовый HTTP-сервер), но не является обязательным условием для базовой работы."},
 {t:"c",d:2,q:"Напиши создание Counter-метрики с именем jobs_processed_total и описанием 'Total processed jobs'.",ans:["Counter('jobs_processed_total', 'Total processed jobs')"],hint:"Counter(имя, описание)",why:"Counter — для значений, которые только растут (число обработанных задач), в отличие от Gauge, который может и падать."},
 {t:"c",d:3,q:"Exporter собирает размер очереди через redis-cli llen jobs с помощью subprocess. Напиши, какие два аргумента subprocess.run() обязательны здесь по темам этого мира (через запятую), чтобы не зависнуть и не пропустить ошибку.",ans:["timeout, check=True","timeout=5, check=True"],hint:"из миссии про subprocess",why:"timeout защищает от зависания на недоступном Redis, check=True гарантирует, что ошибка команды не останется незамеченной."},
 {t:"c",d:3,q:"Метрика queue_size иногда уменьшается при нормальной работе (очередь обрабатывается). Какой тип метрики (одно слово, англ.) для неё правильный — Counter или Gauge?",ans:["Gauge"],hint:"может расти и падать",why:"Counter интерпретируется на стороне Prometheus как монотонно растущее значение — падение читается как рестарт процесса, а не как реальное уменьшение очереди."},
 {t:"c",d:4,q:"Напиши функцию prometheus_client, которая поднимает HTTP-сервер с эндпоинтом /metrics на порту 9200 без ручной реализации HTTP-обработчика.",ans:["start_http_server(9200)"],hint:"из библиотеки prometheus_client",why:"start_http_server сам реализует формат экспозиции и HTTP-сервер — не нужно писать BaseHTTPRequestHandler руками, как в самом первом примере этой миссии."},
 {t:"c",d:5,q:"Инцидент. Exporter время от времени падает целиком, когда Redis временно недоступен — весь процесс завершается, и Prometheus теряет все метрики этого exporter'а, а не только queue_size. Напиши, каким блоком (одно слово) нужно обернуть вызов get_queue_size() внутри основного цикла while True, чтобы ошибка Redis не убивала весь процесс.",ans:["try","try/except"],hint:"конкретная ненадёжная операция внутри бесконечного цикла",why:"try/except вокруг одной ненадёжной операции внутри цикла даёт возможность залогировать ошибку и продолжить на следующей итерации — вместо падения всего процесса из-за временной недоступности одной внешней зависимости."}]}
);
