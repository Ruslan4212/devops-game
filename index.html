 {t:"c",d:3,q:"Замени в конфиге app.conf порт 8080 на 3000 прямо в файле, с резервной копией .bak.",ans:["sed -i.bak s/8080/3000/g app.conf","sed -i.bak 's/8080/3000/g' app.conf"],hint:"sed -i.bak 's/…/…/g' файл",why:"-i.bak — бэкап оригинала перед заменой."},
 {t:"c",d:4,q:"Собери конвейер: покажи топ-5 IP-адресов по числу запросов из файла access.log (адрес — первая колонка).",ans:["awk '{print $1}' access.log | sort | uniq -c | sort -rn | head -5","awk '{print $1}' access.log|sort|uniq -c|sort -rn|head -5"],hint:"колонка | sort | uniq -c | sort -rn | head -N",why:"sort перед uniq -c обязателен — иначе повторы не соседние и счётчики неверны."},
 {t:"c",d:4,q:"В access.log код ответа — девятая колонка. Посчитай, сколько запросов вернули код 500 (через awk с условием).",ans:["awk '$9==500' access.log | wc -l","awk '$9 == 500' access.log | wc -l"],hint:"awk '$9==500' файл | wc -l",why:"Условие перед блоком фильтрует строки — awk без блока печатает всю строку, подходящую условию."},
 {t:"c",d:5,q:"Инцидент. Сайт лёг под нагрузкой, времени мало. Нужно за минуту понять: это реальный наплыв или один источник забивает канал. Собери одну команду: возьми последние 50000 строк access.log, вытащи IP (первая колонка) и покажи топ-10 по частоте.",ans:["tail -50000 access.log | awk '{print $1}' | sort | uniq -c | sort -rn | head -10","tail -n 50000 access.log | awk '{print $1}' | sort | uniq -c | sort -rn | head -10"],hint:"tail -50000 | awk '{print $1}' | sort | uniq -c | sort -rn | head -10",why:"Сначала окно (иначе читается весь файл), потом частоты. Один-два адреса с большой долей — не наплыв клиентов, а источник, который стоит ограничить."}]}
);
W("linux").miss.push(

{id:"l11",t:"Ссылки, архивы, специальные права",goal:"Разобраться в том, что выглядит магией",
 cards:[
 {h:"Inode: имя и содержимое — разные вещи",b:"<p>Файл в Linux состоит из двух частей: <b>inode</b> (метаданные — права, владелец, размер, указатели на данные) и <b>имя в каталоге</b>, ссылающееся на этот inode.</p><pre>ls -i file.txt    <span class='c'># номер inode</span>\nstat file.txt     <span class='c'># все метаданные разом</span></pre><p><b>Зачем в жизни:</b> из этого следует, почему у файла может быть несколько имён, и почему место не освобождается, пока файл открыт процессом — это разбирается дальше в миссии."},
 {h:"ln -s: символическая ссылка",b:"<pre>ln -s /opt/app/v2 current   <span class='c'># указатель на путь</span></pre><table class='tw'><tr><th></th><th>hard link</th><th>symlink</th></tr><tr><td>указывает на</td><td>inode (данные)</td><td>путь (строку)</td></tr><tr><td>удалили оригинал</td><td>данные живы</td><td>ссылка «повисает»</td></tr><tr><td>на каталог</td><td>нельзя</td><td>можно</td></tr></table><p><b>Зачем в жизни:</b> симлинк — механизм деплоя. Распаковал релиз рядом, переключил ссылку <code>current</code> — выкатка готова, откат — переключить обратно, без пересборки.</p>",
  cheat:"ln -s цель ссылка — символическая ссылка (сначала цель, потом имя)",
  t:{q:"Создай символическую ссылку /opt/app/current, указывающую на каталог /opt/app/releases/v2.",ans:["ln -s /opt/app/releases/v2 /opt/app/current"],hint:"ln -s цель имя_ссылки",why:"Порядок аргументов как у cp: сначала откуда, потом куда."}},
 {h:"ln -sfn: обновление ссылки при деплое",b:"<pre>ln -sfn /opt/app/releases/2025-02-10 /opt/app/current</pre><p><code>-f</code> перезаписать существующую ссылку, <code>-n</code> не заходить внутрь неё.</p><p><b>Зачем в жизни:</b> без <code>-n</code> ln трактует существующую ссылку-каталог как каталог и создаёт ссылку внутри — получается <code>current/releases/...</code>. Первый деплой пройдёт нормально, ломается только второй.</p>",
  cheat:"ln -sfn цель ссылка — обновить существующую ссылку (при деплое обязательно -n)",
  t:{q:"Переключи существующую ссылку /opt/app/current на новый релиз /opt/app/releases/2025-02-10, используя флаги, которые не дадут ln зайти внутрь старой ссылки.",ans:["ln -sfn /opt/app/releases/2025-02-10 /opt/app/current"],hint:"ln -sfn — обе буквы обязательны",why:"-f перезаписывает, -n не даёт зайти внутрь существующей ссылки-каталога."}},
 {h:"tar: create, list, extract",b:"<pre>tar czf backup.tar.gz /var/www    <span class='c'># c=create z=gzip f=file</span>\ntar tzf backup.tar.gz | head      <span class='c'># t=list, без распаковки</span>\ntar xzf backup.tar.gz -C /restore <span class='c'># x=extract, -C куда</span></pre><p><b>Всегда сначала t.</b> Если архив собран без общего каталога внутри, распаковка разбросает сотни файлов по текущему каталогу.</p><p><b>Зачем в жизни:</b> бэкапы и перенос данных между серверами — типовая задача tar. Привычка проверять содержимое перед распаковкой экономит часы уборки.</p>",
  cheat:"tar czf архив.tar.gz путь создать · tzf посмотреть · xzf -C куда распаковать",
  t:{q:"Создай архив backup.tar.gz из каталога /var/www с сжатием gzip.",ans:["tar czf backup.tar.gz /var/www"],hint:"tar czf имя.tar.gz путь",why:"c=создать, z=gzip, f=имя файла архива."}},
 {h:"Специальные биты",b:"<table class='tw'><tr><th>бит</th><th>цифра</th><th>что делает</th></tr><tr><td>SUID</td><td>4xxx</td><td>программа выполняется от имени владельца файла</td></tr><tr><td>sticky</td><td>1xxx</td><td>в общем каталоге удалять файл может только его владелец</td></tr></table><p><b>Sticky на практике:</b> права /tmp — <code>drwxrwxrwt</code>. Писать могут все, удалять — только свои файлы.</p><pre>find / -perm -4000 -type f 2&gt;/dev/null   <span class='c'># все SUID-файлы</span></pre><p><b>Зачем в жизни:</b> этот список — обязательный пункт аудита безопасности: уязвимость в SUID-программе означает локальный root.</p>",
  cheat:"find / -perm -4000 -type f — найти все SUID-файлы в системе"}],
 ch:[
 {t:"c",d:1,q:"Разминка. Посмотри содержимое архива backup.tar.gz, не распаковывая его.",ans:["tar tzf backup.tar.gz","tar -tzf backup.tar.gz"],hint:"t означает list",why:"Проверка перед распаковкой — стандартная привычка."},
 {t:"c",d:2,q:"Создай символическую ссылку /opt/app/current на каталог /opt/app/releases/v3.",ans:["ln -s /opt/app/releases/v3 /opt/app/current"],hint:"ln -s цель ссылка",why:"Порядок: сначала цель, потом имя ссылки."},
 {t:"c",d:3,q:"Переключи уже существующую ссылку /opt/app/current на релиз /opt/app/releases/v4, не дав ln зайти внутрь старой ссылки как в каталог.",ans:["ln -sfn /opt/app/releases/v4 /opt/app/current"],hint:"флаги -f и -n вместе",why:"-n предотвращает создание вложенной ссылки внутри существующей."},
 {t:"c",d:4,q:"Создай архив /backup/www.tar.gz из каталога /var/www, исключив из него файлы с расширением .log.",ans:["tar czf /backup/www.tar.gz --exclude='*.log' /var/www","tar czf /backup/www.tar.gz --exclude=*.log /var/www"],hint:"флаг --exclude перед путём",why:"--exclude исключает файлы по шаблону из архива."},
 {t:"c",d:4,q:"Найди в системе все файлы с установленным битом SUID, подавив сообщения об ошибках доступа.",ans:["find / -perm -4000 -type f 2>/dev/null"],hint:"find / -perm -4000 -type f 2>/dev/null",why:"-perm -4000 ищет SUID-бит, 2>/dev/null убирает шум от каталогов без прав доступа."},
 {t:"c",d:5,q:"Инцидент. Скрипт деплоя выполняет ln -sf /opt/app/releases/new /opt/app/current (без -n). Первый запуск прошёл нормально, после второго появился путь current/new/new — ссылка ушла вложенной. Напиши исправленную команду.",ans:["ln -sfn /opt/app/releases/new /opt/app/current"],hint:"добавь -n к существующим флагам -sf",why:"-n не даёт ln зайти внутрь существующей ссылки-каталога при повторном запуске. Без него каждый второй деплой создаёт вложенность."}]},

{id:"l12",t:"Процессы вглубь: состояния и лимиты",goal:"Читать состояние системы, а не гадать",
 cards:[
 {h:"Состояния процессов",b:"<table class='tw'><tr><th>код</th><th>состояние</th><th>на практике</th></tr><tr><td>R</td><td>running</td><td>выполняется</td></tr><tr><td>S</td><td>sleeping</td><td>норма — ждёт события</td></tr><tr><td>D</td><td>uninterruptible</td><td>ждёт диск/сеть, не убивается даже -9</td></tr><tr><td>Z</td><td>zombie</td><td>завершился, родитель не забрал код</td></tr></table><p><b>Зачем в жизни:</b> массовые D-процессы — признак умирающего диска, лечить надо носитель. Накопление Z — сломанный родитель, в контейнерах решается через <code>--init</code>.</p>"},
 {h:"kill -1 (SIGHUP) — перечитать конфиг",b:"<pre>kill -1 711    <span class='c'># или kill -HUP 711</span></pre><p>SIGHUP исторически означал разрыв связи с терминалом, демоны стали использовать его как «перечитай конфиг» — без разрыва соединений.</p><p><b>Зачем в жизни:</b> изменил конфиг nginx или другого демона — вместо перезапуска (который рвёт соединения) шлёшь SIGHUP.</p>",
  cheat:"kill -1 PID (или -HUP) — сигнал демону перечитать конфигурацию",
  t:{q:"Nginx работает с PID 711, ты изменил его конфиг. Отправь сигнал перечитать конфигурацию без перезапуска.",ans:["kill -1 711","kill -hup 711","kill -HUP 711"],hint:"сигнал 1 или HUP",why:"SIGHUP — сигнал «перечитай конфиг», соединения не рвутся."}},
 {h:"ulimit и LimitNOFILE",b:"<pre>ulimit -n                    <span class='c'># лимит открытых файлов в сессии</span>\ncat /proc/PID/limits         <span class='c'># лимиты конкретного процесса</span></pre><p>Ошибка <code>Too many open files</code> — упёрся в лимит дескрипторов (сетевые соединения тоже дескрипторы).</p><p><b>Где чинить:</b> ulimit в сессии не влияет на сервис systemd — нужна директива <code>LimitNOFILE=65535</code> в юните.</p><p><b>Зачем в жизни:</b> нагруженный веб-сервер с тысячами соединений часто упирается именно в этот лимит.</p>",
  cheat:"cat /proc/PID/limits — лимиты процесса · LimitNOFILE в юните systemd, не ulimit в сессии"},
 {h:"dmesg — искал ли OOM killer жертву",b:"<pre>dmesg -T | grep -i \"killed process\"</pre><p>Когда память заканчивается, ядро выбирает и убивает процесс сигналом SIGKILL — его невозможно перехватить, поэтому в логе приложения записи нет.</p><p><b>Зачем в жизни:</b> приложение «пропало без следа» в собственном логе — первое подозрение это OOM, проверяется одной командой dmesg.</p>",
  cheat:'dmesg -T | grep -i "killed process" — искать следы работы OOM killer',
  t:{q:"Приложение исчезло без единой записи в своём логе. Проверь системный журнал на признаки того, что его убил OOM killer.",ans:["dmesg -T | grep -i \"killed process\"","dmesg -T | grep -i killed"],hint:'dmesg -T | grep -i "killed process"',why:"SIGKILL от OOM killer не оставляет приложению шанса записать что-либо в свой лог."}},
 {h:"cgroups и разница CPU/память",b:"<p>cgroups ограничивают ресурсы группы процессов. На них построены <code>MemoryMax</code> в systemd, <code>--memory</code> в Docker, <code>resources.limits</code> в Kubernetes.</p><p><b>Превышение памяти = мгновенное убийство (OOM). Превышение CPU = троттлинг</b>, процессу просто дают меньше времени.</p><p><b>Зачем в жизни:</b> под в Kubernetes с кодом 137 — превышен лимит памяти его собственной cgroup, а не нехватка памяти ноды в целом.</p>",
  cheat:"память: превышение = убийство (137) · CPU: превышение = троттлинг, не убийство"}],
 ch:[
 {t:"c",d:1,q:"Разминка. Пришли процессу 4210 сигнал перечитать конфигурацию (не перезапуск).",ans:["kill -1 4210","kill -hup 4210"],hint:"сигнал 1 или HUP",why:"SIGHUP — стандартный сигнал «перечитай конфиг» у демонов."},
 {t:"c",d:2,q:"Проверь системный журнал на признаки работы OOM killer за последнее время.",ans:["dmesg -T | grep -i \"killed process\"","dmesg -T | grep -i oom"],hint:"dmesg -T + grep",why:"-T добавляет читаемые метки времени вместо секунд с загрузки."},
 {t:"c",d:3,q:"Узнай лимит открытых файловых дескрипторов процесса с PID 4210.",ans:["cat /proc/4210/limits"],hint:"файл limits в /proc/PID/",why:"/proc/PID/limits показывает реальные лимиты именно этого процесса, не текущей сессии."},
 {t:"c",d:4,q:"Сервис под нагрузкой падает с «Too many open files». Проверь, сколько файловых дескрипторов сейчас открыто у процесса с PID 4210 (посчитай их через wc -l).",ans:["ls /proc/4210/fd | wc -l"],hint:"ls /proc/PID/fd | wc -l",why:"Каждый файл и каждое сетевое соединение процесса — отдельный дескриптор в этом каталоге."},
 {t:"c",d:4,q:"Найди все процессы в системе, находящиеся в состоянии D (непрерываемый сон), одной командой через ps.",ans:["ps aux | awk '$8 ~ /D/'","ps -eo pid,stat,cmd | grep ' D'"],hint:"ps aux и фильтрация по колонке STAT",why:"Массовые D-процессы указывают на проблему с диском или сетевым хранилищем, а не с самими процессами."},
 {t:"c",d:5,q:"Инцидент. Под в Kubernetes перезапускается с OOMKilled, код выхода 137. Разработчик говорит «на ноде полно памяти, это баг». Ты хочешь показать ему точную причину со стороны ядра. Какой командой на самой ноде ты проверишь, что именно было убито и почему (используй dmesg)?",ans:["dmesg -T | grep -i \"killed process\"","dmesg -T | grep -i oom"],hint:"dmesg -T | grep killed process",why:"137 = 128+9 = SIGKILL. dmesg покажет, что убит именно процесс контейнера за превышение лимита его cgroup — свободная память ноды тут ни при чём."}]},

{id:"l13",t:"Диски, монтирование, LVM",goal:"Добавить место, не уронив сервер",
 cards:[
 {h:"lsblk и df -h — карта хранилища",b:"<pre>lsblk               <span class='c'># дерево дисков и точек монтирования</span>\ndf -h               <span class='c'># занятость смонтированных ФС</span></pre><p><b>Зачем в жизни:</b> первая команда на любом сервере при работе с дисками — понять, что вообще есть и куда смонтировано.</p>",
  cheat:"lsblk дерево дисков · df -h занятость разделов",
  t:{q:"Покажи дерево всех блочных устройств и их точек монтирования.",ans:["lsblk"],hint:"одно слово",why:"lsblk — карта хранилища сервера за одну команду."}},
 {h:"df -i — вторая причина «нет места»",b:"<pre>df -i</pre><p>Коварный случай: df -h показывает свободное место, а система пишет «No space left on device» — закончились inode. Их число фиксировано при создании ФС, миллионы мелких файлов исчерпывают лимит раньше байтов.</p><p><b>Зачем в жизни:</b> кэш сессий, очереди писем — типичные источники миллионов мелких файлов на проде.</p>",
  cheat:"df -i — занятость inode, вторая (коварная) причина «нет места на диске»",
  t:{q:"df -h показывает свободное место, но система жалуется «No space left on device». Проверь занятость inode.",ans:["df -i"],hint:"df с флагом i",why:"Количество inode фиксировано при создании ФС и может закончиться раньше байтов."}},
 {h:"mount -a — проверка fstab",b:"<pre>mount -a</pre><p>После правки /etc/fstab обязательно mount -a: если строка ошибочна, узнаёшь сейчас, а не при следующей перезагрузке, когда сервер уйдёт в аварийный режим без доступа по SSH.</p><p><b>Зачем в жизни:</b> добавление нового диска в fstab — рутинная задача, где ошибка стоит недоступности сервера.</p>",
  cheat:"mount -a — проверить и применить все записи fstab, не перезагружая сервер",
  t:{q:"Ты добавил строку в /etc/fstab. Проверь корректность всех записей и смонтируй их прямо сейчас.",ans:["mount -a","sudo mount -a"],hint:"mount с флагом all",why:"Единственная защита от аварийного режима при следующей перезагрузке."}},
 {h:"lvextend -r — расширение под нагрузкой",b:"<pre>lvextend -r -L +50G /dev/vg0/data</pre><p>Флаг <code>-r</code> сразу растягивает и логический том, и файловую систему (ext4 или xfs) — без него легко забыть второй шаг, и df покажет старый размер.</p><p><b>Зачем в жизни:</b> ночью заполнился диск с базой — LVM позволяет добавить место онлайн, без остановки СУБД.</p>",
  cheat:"lvextend -r -L +размер /dev/vg/lv — расширить том И файловую систему одной командой",
  t:{q:"Расширь логический том /dev/vg0/data на 50 гигабайт и сразу растяни файловую систему одной командой.",ans:["lvextend -r -L +50G /dev/vg0/data"],hint:"флаг -r делает оба шага сразу",why:"Без -r нужны две команды: lvextend, потом resize2fs или xfs_growfs. -r объединяет их."}}],
 ch:[
 {t:"c",d:1,q:"Разминка. Покажи занятость всех смонтированных разделов в человекочитаемом виде.",ans:["df -h"],hint:"df -h",why:"Первая команда при алерте на диск."},
 {t:"c",d:2,q:"Проверь занятость inode на всех разделах.",ans:["df -i"],hint:"df -i",why:"Вторая, менее очевидная причина «нет места на диске»."},
 {t:"c",d:3,q:"Ты добавил новую запись в /etc/fstab. Примени её без перезагрузки сервера.",ans:["mount -a","sudo mount -a"],hint:"mount -a",why:"Проверяет и применяет все записи fstab сразу, показывая ошибки немедленно."},
 {t:"c",d:4,q:"Найди в каталоге /var подкаталоги, занимающие больше всего места, отсортировав по размеру (человекочитаемо, по убыванию).",ans:["du -sh /var/* | sort -rh","du -sh /var/*|sort -rh"],hint:"du -sh /var/* | sort -rh",why:"sort -rh сортирует человеческие размеры (K/M/G) по убыванию — сразу видно виновника."},
 {t:"c",d:4,q:"Расширь логический том /dev/vg0/data на 50 гигабайт и растяни файловую систему одной командой (используй флаг, который делает оба действия сразу).",ans:["lvextend -r -L +50G /dev/vg0/data"],hint:"lvextend -r -L +50G путь",why:"-r экономит отдельный вызов resize2fs/xfs_growfs — типичная ошибка LVM в том, что про этот шаг забывают."},
 {t:"c",d:5,q:"Инцидент. Ночью раздел с базой данных заполнился, СУБД остановилась. В группе томов vg0 есть 100 ГБ свободного места, том базы — /dev/vg0/data. Верни сервис максимально быстро без остановки: расширь том на 50 ГБ вместе с файловой системой одной командой.",ans:["lvextend -r -L +50G /dev/vg0/data"],hint:"lvextend -r -L +размер путь_к_тому",why:"Расширение LVM выполняется онлайн, на смонтированном томе — это и есть главный практический аргумент в пользу LVM в бою."}]},

{id:"l14",t:"Логи системы и ротация",goal:"Не утонуть в логах и не потерять нужное",
 cards:[
 {h:"journalctl -u — журнал сервиса",b:"<pre>journalctl -u nginx\njournalctl -u nginx -f            <span class='c'># живой поток</span>\njournalctl -u api --since \"1 hour ago\"</pre><p><b>Зачем в жизни:</b> любой разбор проблемы с systemd-сервисом начинается с его журнала — это надёжнее, чем искать текстовый файл лога вручную.</p>",
  cheat:"journalctl -u имя — журнал сервиса · -f живой поток · --since окно времени",
  t:{q:"Посмотри журнал сервиса nginx через systemd.",ans:["journalctl -u nginx"],hint:"journalctl -u имя",why:"-u фильтрует по конкретному юниту."}},
 {h:"journalctl -p err -b — только ошибки",b:"<pre>journalctl -p err -b</pre><p>-p задаёт минимальный уровень (err и выше), -b ограничивает текущей загрузкой системы.</p><p><b>Зачем в жизни:</b> первая команда на незнакомом сервере, когда «что-то не так» — сразу видишь список проблем, не читая мегабайты info.</p>",
  cheat:"journalctl -p err -b — только ошибки текущей загрузки, лучший первый взгляд на сервер",
  t:{q:"Покажи только ошибки из системного журнала за текущую загрузку (не листая весь журнал).",ans:["journalctl -p err -b","journalctl -b -p err"],hint:"-p err и -b вместе",why:"-p задаёт минимальный уровень важности, -b — текущую загрузку."}},
 {h:"logrotate и copytruncate",b:"<pre>rotate 14\ncompress\ncopytruncate</pre><p>Обычная ротация переименовывает файл — но процесс пишет по дескриптору, указывающему на переименованный (затем удалённый) файл. copytruncate копирует содержимое и обнуляет исходный файл на месте, не меняя inode.</p><p><b>Зачем в жизни:</b> без copytruncate (или сигнала переоткрытия) новый лог пуст, старый занимает место и недоступен — та же ситуация df/du из другой миссии.</p>",
  cheat:"copytruncate в logrotate — для приложений, не умеющих переоткрывать лог по сигналу"},
 {h:"journalctl --vacuum-time",b:"<pre>journalctl --disk-usage\njournalctl --vacuum-time=7d</pre><p><b>Зачем в жизни:</b> журнал systemd незаметно растёт и может занять весь диск — эту команду применяют и вручную при аварии, и настраивают заранее через SystemMaxUse в journald.conf.</p>",
  cheat:"journalctl --vacuum-time=7d — удалить записи журнала старше недели",
  t:{q:"Журнал systemd занял слишком много места. Удали из него всё, что старше 7 дней.",ans:["journalctl --vacuum-time=7d"],hint:"--vacuum-time=7d",why:"vacuum-time чистит журнал по возрасту записей."}}],
 ch:[
 {t:"c",d:1,q:"Разминка. Посмотри журнал сервиса nginx.",ans:["journalctl -u nginx"],hint:"journalctl -u имя",why:"Базовая команда просмотра журнала конкретного сервиса."},
 {t:"c",d:2,q:"Покажи только ошибки из журнала за текущую загрузку системы.",ans:["journalctl -p err -b","journalctl -b -p err"],hint:"-p err -b",why:"Быстрый способ увидеть, что вообще сломано."},
 {t:"c",d:3,q:"Посмотри журнал сервиса api за последний час.",ans:["journalctl -u api --since \"1 hour ago\"","journalctl -u api --since '1 hour ago'"],hint:"--since \"1 hour ago\"",why:"--since сужает окно, экономя время на чтение старых записей."},
 {t:"c",d:4,q:"Журнал systemd раздулся. Проверь, сколько места он занимает на диске, а затем удали записи старше 7 дней.",ans:["journalctl --disk-usage\njournalctl --vacuum-time=7d","journalctl --disk-usage && journalctl --vacuum-time=7d"],hint:"одной строкой через &&: journalctl --disk-usage && journalctl --vacuum-time=7d",why:"Сначала оценка масштаба, потом чистка — стандартный порядок действий с ресурсами."},
 {t:"c",d:4,q:"Сервер внезапно перезагрузился ночью. Посмотри журнал предыдущей (не текущей) загрузки, чтобы понять, что происходило перед этим.",ans:["journalctl -b -1"],hint:"journalctl -b -1",why:"-b -1 — журнал загрузки перед текущей. Обычный -b покажет уже новую, где интересного нет."},
 {t:"c",d:5,q:"Инцидент. Диск заполнен логами. Ты уже удалил старые файлы (rm *.log.1), но df -h всё ещё 100%, а du насчитывает вдвое меньше. Ты подозреваешь, что процесс держит открытым удалённый файл. Какой командой это подтвердить?",ans:["lsof | grep deleted"],hint:"lsof | grep deleted",why:"lsof покажет процессы, держащие открытыми файлы с пометкой deleted — именно они не дают ядру освободить блоки. Дальше решение — перезапуск процесса и настройка logrotate с copytruncate."}]},

{id:"l15",t:"Сеть изнутри",goal:"Понять, докуда доходит пакет",
 cards:[
 {h:"ip r — таблица маршрутизации",b:"<pre>ip r\nip r get 8.8.8.8   <span class='c'># каким маршрутом пойдёт пакет</span></pre><p>Ищи строку <b>default</b> — шлюз по умолчанию. Его отсутствие означает «наружу пакеты не уйдут», хотя интерфейс поднят.</p><p><b>Зачем в жизни:</b> «сервер не видит интернет» — первая проверка после ping, современная замена устаревшего route.</p>",
  cheat:"ip r — таблица маршрутизации, искать строку default",
  t:{q:"Покажи таблицу маршрутизации современной командой.",ans:["ip r","ip route"],hint:"две буквы после ip",why:"Строка default — шлюз, через который уходит трафик наружу."}},
 {h:"ss -tulpn — кто слушает порты",b:"<pre>ss -tulpn | grep 5432</pre><p>t=tcp, u=udp, l=слушающие, p=процесс, n=числовые порты. Смотри на адрес слева от порта: <code>127.0.0.1</code> — только локально, <code>0.0.0.0</code> — из сети.</p><p><b>Зачем в жизни:</b> «порт открыт в фаерволе, а подключиться не могу» почти всегда означает, что сервис слушает только localhost.</p>",
  cheat:"ss -tulpn — кто слушает порты · смотреть на адрес слева от порта (127.0.0.1 vs 0.0.0.0)",
  t:{q:"Проверь, какие порты слушаются на сервере, какими процессами и на каких адресах.",ans:["ss -tulpn","sudo ss -tulpn"],hint:"ss -tulpn",why:"Четыре флага дают полную картину: протокол, только слушающие, процесс, числовые порты."}},
 {h:"nc -zv — refused против timeout",b:"<pre>nc -zv host 443</pre><p><b>Connection refused</b> — пакет дошёл, порт никто не слушает: иди к сервису. <b>Connection timed out</b> — пакет отброшен молча: иди к фаерволу.</p><p><b>Зачем в жизни:</b> эта развилка за секунду говорит, к кому идти — к разработчику сервиса или к сетевикам.</p>",
  cheat:"nc -zv хост порт — refused значит сервис не слушает, timeout значит фильтрация",
  t:{q:"Проверь, доступен ли порт 443 на хосте api.internal.",ans:["nc -zv api.internal 443"],hint:"nc -zv хост порт",why:"-z сканирует без передачи данных, -v выводит результат подробно."}},
 {h:"rsync — синхронизация без лишнего",b:"<pre>rsync -avz ./dist/ user@host:/var/www/</pre><p>Передаёт только изменившиеся части, докачивает после обрыва.</p><p><b>Слеш в конце источника решает всё:</b> <code>dist/</code> копирует содержимое, <code>dist</code> — сам каталог внутрь приёмника.</p><p><b>Зачем в жизни:</b> повторная выкатка статики или файлов на сервер — rsync экономит время на больших каталогах в разы против scp.</p>",
  cheat:"rsync -avz источник/ хост:путь/ — слеш после источника обязателен (копирует содержимое, не каталог)"}],
 ch:[
 {t:"c",d:1,q:"Разминка. Покажи таблицу маршрутизации и найди шлюз по умолчанию.",ans:["ip r","ip route"],hint:"ip r",why:"default — строка со шлюзом наружу."},
 {t:"c",d:2,q:"Узнай, какие порты слушаются на сервере и какими процессами.",ans:["ss -tulpn","sudo ss -tulpn"],hint:"ss -tulpn",why:"Стандартная замена устаревшего netstat."},
 {t:"c",d:3,q:"Проверь, доступен ли порт 5432 на хосте db.internal, без передачи данных.",ans:["nc -zv db.internal 5432"],hint:"nc -zv хост порт",why:"-z означает scan-режим без отправки данных."},
 {t:"c",d:4,q:"Синхронизируй локальный каталог ./dist (его содержимое, не сам каталог) на сервер user@host в /var/www/, с сохранением прав и сжатием при передаче.",ans:["rsync -avz ./dist/ user@host:/var/www/","rsync -avz dist/ user@host:/var/www/"],hint:"слеш после dist обязателен",why:"Слеш после источника копирует содержимое каталога, а не сам каталог внутрь приёмника."},
 {t:"c",d:4,q:"Перед синхронизацией с --delete нужно увидеть, что будет удалено на приёмнике, ничего реально не меняя. Допиши нужный флаг к команде.",pre:"rsync -avz --delete ___ ./dist/ user@host:/var/www/",ans:["--dry-run"],hint:"флаг сухого прогона",why:"--dry-run показывает план действий без реального выполнения — обязателен перед --delete."},
 {t:"c",d:5,q:"Инцидент. Приложение на сервере A перестало обращаться к API на сервере B. ping B проходит без потерь. Проверь, доходят ли пакеты именно до порта 443 на B (используй nc), чтобы понять — это фильтрация или упавший сервис.",ans:["nc -zv B 443","nc -zv b 443"],hint:"nc -zv B 443",why:"Если nc зависнет и завершится таймаутом (не refused) — это фильтрация на фаерволе, а не падение сервиса. Ping отвечает только за ICMP-связность, не за конкретный порт."}]}
);

{id:"n1",t:"Путь запроса от Enter до ответа",goal:"Знать всю цепочку и место каждого разрыва",
 cards:[
 {h:"Шесть шагов, которые надо уметь рассказать",b:"<ol><li><b>DNS.</b> Браузер спрашивает: какой IP у shop.ru? Ответ кэшируется на время TTL.</li><li><b>TCP.</b> Открывается соединение на порт 443: три пакета — SYN → SYN-ACK → ACK.</li><li><b>TLS.</b> Рукопожатие: сервер предъявляет сертификат, стороны договариваются о шифровании.</li><li><b>HTTP-запрос.</b> <code>GET / HTTP/1.1</code> с заголовками, среди которых <code>Host</code>.</li><li><b>Обработка.</b> Nginx принимает, отдаёт статику сам или проксирует в приложение.</li><li><b>Ответ.</b> Код, заголовки, тело — обратно тем же соединением.</li></ol><p>Это <b>любимый вопрос собеседований</b>. Ценность не в перечислении, а в умении сказать, что ломается на каждом шаге.</p><p><b>Зачем в жизни:</b> когда сайт «не работает», ты не гадаешь — идёшь по этой цепочке снизу вверх и на каждом шаге одной командой проверяешь, дошли ли до него."},
 {h:"Где именно рвётся",b:"<table class='tw'><tr><th>шаг</th><th>симптом</th><th>чем проверить</th></tr><tr><td>DNS</td><td>«имя не найдено»</td><td><code>dig домен +short</code></td></tr><tr><td>TCP</td><td>таймаут или refused</td><td><code>nc -zv host 443</code></td></tr><tr><td>TLS</td><td>предупреждение о сертификате</td><td><code>curl -v https://...</code></td></tr><tr><td>HTTP</td><td>код 4xx или 5xx</td><td><code>curl -I</code></td></tr><tr><td>Приложение</td><td>502, 504</td><td>логи приложения</td></tr></table><p>Диагностика — <b>деление пополам</b>: проверяешь середину цепочки и отсекаешь половину гипотез.</p>",
  cheat:"dig домен → nc -zv хост порт → curl -v (TLS) → curl -I (код) → логи приложения"},
 {h:"Порты, которые знают наизусть",b:"<table class='tw'><tr><th>порт</th><th>сервис</th></tr><tr><td>22</td><td>SSH</td></tr><tr><td>53</td><td>DNS</td></tr><tr><td>80 / 443</td><td>HTTP / HTTPS</td></tr><tr><td>3306</td><td>MySQL</td></tr><tr><td>5432</td><td>PostgreSQL</td></tr><tr><td>6379</td><td>Redis</td></tr></table><p>Порты до 1024 привилегированные: занять их может только root. Поэтому приложения слушают 3000 или 8080, а 80/443 держит nginx.</p><p><b>Зачем в жизни:</b> собеседование почти гарантированно спросит порт Postgres или Redis — их знают рефлекторно, без раздумий."},
 {h:"Клиент, прокси, апстрим",b:"<pre>браузер → балансировщик/nginx → приложение → база</pre><p><b>апстрим (upstream)</b> — то, куда прокси передаёт запрос: твоё приложение. <b>даунстрим</b> — сторона клиента. Когда nginx пишет «connect() failed while connecting to upstream», он говорит про твоё приложение, не про клиента.</p><p><b>Зачем в жизни:</b> эти два слова постоянно встречаются в логах nginx — не путать их значит сразу понимать, в какую сторону смотреть."}],
 ch:[
 {t:"c",d:1,q:"Разминка. Проверь только заголовки ответа https://shop.ru, не скачивая тело.",ans:["curl -i https://shop.ru","curl -i shop.ru","curl --head https://shop.ru"],hint:"curl -I или --head",why:"HEAD-запрос быстро показывает код и заголовки."},
 {t:"c",d:2,q:"Узнай IPv4-адрес домена example.com максимально коротким выводом.",ans:["dig example.com +short","dig +short example.com","dig example.com a +short"],hint:"dig домен +short",why:"+short убирает всё лишнее из ответа."},
 {t:"c",d:3,q:"Проверь, доступен ли порт 443 на хосте shop.ru, не передавая данные.",ans:["nc -zv shop.ru 443"],hint:"nc -zv хост порт",why:"-z сканирует без отправки данных, -v выводит результат."},
 {t:"c",d:4,q:"Собери три команды через && в правильном порядке диагностики: сначала узнай IP домена shop.ru коротко, потом проверь порт 443, потом сделай подробный TLS-запрос curl.",ans:["dig shop.ru +short && nc -zv shop.ru 443 && curl -v https://shop.ru"],hint:"dig +short && nc -zv && curl -v",why:"Порядок отражает саму цепочку: сначала имя резолвится в адрес, потом проверяется порт, потом TLS и HTTP."},
 {t:"c",d:5,q:"Инцидент. Поддержка пишет «сайт не работает», у тебя открывается нормально. Ты подозреваешь, что дело в DNS у части пользователей. Проверь резолвинг shop.ru через публичный резолвер 8.8.8.8 коротким выводом.",ans:["dig @8.8.8.8 shop.ru +short"],hint:"dig @резолвер домен +short",why:"Обращение к конкретному резолверу показывает, что видит именно он — иногда разные резолверы отдают разный (устаревший) ответ."}]},

{id:"n2",t:"DNS: как имена превращаются в адреса",goal:"Диагностировать руками, а не «попробуй перезагрузить»",
 cards:[
 {h:"Типы записей",b:"<table class='tw'><tr><th>тип</th><th>что задаёт</th></tr><tr><td>A</td><td>имя → IPv4</td></tr><tr><td>AAAA</td><td>имя → IPv6</td></tr><tr><td>CNAME</td><td>псевдоним на другое имя</td></tr><tr><td>MX</td><td>почтовые серверы</td></tr><tr><td>TXT</td><td>SPF, DKIM, подтверждение владения</td></tr></table><p><b>CNAME нельзя на корень домена</b> (shop.ru без www) — там обязаны быть NS и SOA. Корень — через A-запись.</p><p><b>Зачем в жизни:</b> типовая схема — www как CNAME на балансировщик, корень — A-запись напрямую.</p>"},
 {h:"dig — основной инструмент",b:"<pre>dig shop.ru +short            <span class='c'># только результат</span>\ndig shop.ru                   <span class='c'># полный ответ с секциями</span>\ndig @8.8.8.8 shop.ru          <span class='c'># спросить конкретный резолвер</span>\ndig shop.ru MX +short</pre><p>В полном ответе смотри <code>status</code>: <b>NOERROR</b> запись есть, <b>NXDOMAIN</b> домена не существует, <b>SERVFAIL</b> резолвер не смог получить ответ.</p>",
  cheat:"dig домен +short — короткий ответ · dig @резолвер домен — спросить конкретный сервер",
  t:{q:"Узнай почтовые серверы (MX-записи) домена shop.ru коротким выводом.",ans:["dig shop.ru MX +short","dig shop.ru mx +short"],hint:"dig домен MX +short",why:"Тип записи указывается перед +short."}},
 {h:"TTL — почему изменения не видны сразу",b:"<p>TTL — сколько секунд ответ разрешено кэшировать. Пока не истёк, резолверы отдают старый адрес.</p><p><b>Практика миграции:</b> за сутки до переезда снижаешь TTL до 60 секунд, ждёшь, пока старое значение истечёт у всех, потом меняешь адрес.</p><p><b>Зачем в жизни:</b> «я поменял IP, а сайт всё ещё едет на старый сервер у части людей» — это TTL, а не баг.</p>",
  cheat:"TTL — время жизни кэша DNS-ответа. Перед миграцией снижают заранее до 60с"},
 {h:"/etc/hosts проверяется раньше DNS",b:"<pre>cat /etc/hosts</pre><p>Локальные записи в этом файле имеют приоритет над DNS. Удобно для тестов, но источник загадок: приложение ходит не туда, а <code>dig</code> показывает правильный адрес — потому что dig в /etc/hosts вообще не заглядывает.</p><p><b>Зачем в жизни:</b> забытая тестовая строка в /etc/hosts после отладки — классика многочасовых загадок.</p>",
  cheat:"/etc/hosts проверяется ДО DNS — dig его не видит, это частый источник путаницы",
  t:{q:"Проверь, нет ли в /etc/hosts локального переопределения для домена shop.ru.",ans:["cat /etc/hosts","grep shop.ru /etc/hosts"],hint:"cat /etc/hosts",why:"Локальные записи имеют приоритет над DNS и не видны через dig."}}],
 ch:[
 {t:"c",d:1,q:"Разминка. Узнай IPv4-адрес example.com максимально коротким выводом.",ans:["dig example.com +short","dig +short example.com"],hint:"dig домен +short",why:"+short — минимальный полезный вывод."},
 {t:"c",d:2,q:"Спроси про домен shop.ru конкретно резолвер 1.1.1.1, коротким выводом.",ans:["dig @1.1.1.1 shop.ru +short"],hint:"dig @резолвер домен +short",why:"@резолвер направляет запрос конкретному DNS-серверу вместо системного."},
 {t:"c",d:3,q:"Проверь, нет ли локального переопределения shop.ru в /etc/hosts.",ans:["cat /etc/hosts","grep shop.ru /etc/hosts"],hint:"cat или grep по файлу",why:"/etc/hosts проверяется раньше DNS и не виден через dig."},
 {t:"c",d:4,q:"Ты сменил A-запись shop.ru два часа назад. Проверь текущий ответ основного резолвера И ответ 8.8.8.8, чтобы сравнить — не разошлись ли они из-за TTL. Две команды через &&.",ans:["dig shop.ru +short && dig @8.8.8.8 shop.ru +short"],hint:"dig +short && dig @8.8.8.8 +short",why:"Сравнение системного резолвера и стороннего покажет, у кого именно ещё висит старый кэш по TTL."},
 {t:"c",d:5,q:"Инцидент. Ночью переносили сайт на новый сервер (новый IP уже прописан в A-записи). Утром часть заказов теряется. Ты подозреваешь, что часть пользователей резолвит старый IP из кэша. Проверь текущий ответ по A-записи с явным запросом к 8.8.8.8, коротким выводом.",ans:["dig @8.8.8.8 shop.ru a +short","dig @8.8.8.8 shop.ru +short"],hint:"dig @8.8.8.8 домен +short",why:"Если ответ 8.8.8.8 совпадает с новым IP — проблема не в DNS, а глубже. Если старый — часть трафика ещё держит кэш, и старый сервер нужно держать живым до истечения TTL."}]},

{id:"n3",t:"HTTP: коды, заголовки, curl",goal:"Читать ответ сервера как диагноз",
 cards:[
 {h:"Коды по классам",b:"<table class='tw'><tr><th>класс</th><th>смысл</th></tr><tr><td>2xx</td><td>успех</td></tr><tr><td>3xx</td><td>перенаправление</td></tr><tr><td>4xx</td><td>ошибка клиента</td></tr><tr><td>5xx</td><td>ошибка сервера</td></tr></table><p><b>401</b> не аутентифицирован (кто ты?), <b>403</b> аутентифицирован, но нет прав. <b>301</b> постоянный редирект (кэшируется браузером надолго!), <b>302</b> временный.</p><p><b>Зачем в жизни:</b> различие 401/403 определяет, чинить токен или права доступа — разные команды и разные люди."},
 {h:"502, 503, 504 — три разных диагноза",b:"<table class='tw'><tr><th>код</th><th>значит</th></tr><tr><td>502</td><td>апстрим мёртв или вернул мусор</td></tr><tr><td>503</td><td>сервис сам говорит «не готов»</td></tr><tr><td>504</td><td>апстрим жив, но не ответил вовремя</td></tr></table><p><b>504 не лечится увеличением proxy_read_timeout</b> — это прячет симптом, пользователь ждёт дольше и всё равно уходит.</p><p><b>Зачем в жизни:</b> это самый частый вопрос на собеседовании про сети — умение с ходу различить три кода отличает подготовленного кандидата.</p>"},
 {h:"curl -I / -v — заголовки и подробности",b:"<pre>curl -I https://shop.ru            <span class='c'># только заголовки (HEAD)</span>\ncurl -v https://shop.ru            <span class='c'># подробно, видно TLS</span>\ncurl -o /dev/null -s -w '%{http_code}\\n' https://shop.ru</pre><p><b>Зачем в жизни:</b> curl -I — первая команда для проверки «сайт вообще жив и что отвечает», без скачивания тела страницы.</p>",
  cheat:"curl -I заголовки · curl -v подробно с TLS · curl -o /dev/null -s -w '%{http_code}' только код",
  t:{q:"Узнай только HTTP-код ответа https://shop.ru, без вывода заголовков и тела.",ans:["curl -o /dev/null -s -w '%{http_code}\\n' https://shop.ru","curl -o /dev/null -s -w '%{http_code}' https://shop.ru"],hint:"curl -o /dev/null -s -w '%{http_code}' URL",why:"-o /dev/null отбрасывает тело, -s убирает индикатор прогресса, -w печатает только код."}},
 {h:"curl --resolve — проверка до переключения DNS",b:"<pre>curl --resolve shop.ru:443:10.0.1.20 https://shop.ru</pre><p>Обращается по нужному IP, но отправляет правильный Host и SNI — в отличие от простого <code>curl http://IP</code>, который сломает и TLS, и виртуальный хостинг по имени.</p><p><b>Зачем в жизни:</b> так проверяют новый сервер до переключения DNS на него — без риска и без правки /etc/hosts.</p>",
  cheat:"curl --resolve домен:порт:IP https://домен — проверить новый сервер до переключения DNS",
  t:{q:"Проверь сайт shop.ru на новом сервере с IP 10.0.1.20 до переключения DNS, сохранив правильный Host и SNI.",ans:["curl --resolve shop.ru:443:10.0.1.20 https://shop.ru"],hint:"curl --resolve домен:443:IP https://домен",why:"--resolve подменяет только адрес назначения, HTTP и TLS остаются правильными."}}],
 ch:[
 {t:"c",d:1,q:"Разминка. Проверь заголовки ответа https://shop.ru, не скачивая тело.",ans:["curl -i https://shop.ru","curl --head https://shop.ru"],hint:"curl -I",why:"HEAD-запрос — быстрый способ увидеть код и заголовки."},
 {t:"c",d:2,q:"Узнай только числовой HTTP-код ответа https://shop.ru, без остального вывода.",ans:["curl -o /dev/null -s -w '%{http_code}\\n' https://shop.ru","curl -o /dev/null -s -w '%{http_code}' https://shop.ru"],hint:"curl -o /dev/null -s -w '%{http_code}'",why:"Комбинация трёх флагов даёт голый код без шума."},
 {t:"c",d:3,q:"Ты поднял новый сервер с IP 10.0.1.20 и хочешь проверить на нём сайт shop.ru до переключения DNS. Сделай запрос с правильными Host и SNI.",ans:["curl --resolve shop.ru:443:10.0.1.20 https://shop.ru"],hint:"curl --resolve домен:порт:IP https://домен",why:"--resolve — единственный чистый способ проверить новый сервер, не ломая TLS и не трогая /etc/hosts."},
 {t:"c",d:4,q:"Сделай подробный запрос к https://shop.ru, чтобы увидеть детали TLS-рукопожатия и цепочку сертификатов.",ans:["curl -v https://shop.ru"],hint:"curl -v",why:"-v показывает полный обмен, включая версию TLS и предъявленные сертификаты."},
 {t:"c",d:5,q:"Инцидент. После релиза часть запросов отдаёт 502. Ты проверяешь с сервера, отвечает ли приложение локально на 3000 порту. Сделай запрос заголовков к localhost:3000.",ans:["curl -I localhost:3000","curl -i localhost:3000"],hint:"curl -I localhost:3000",why:"Если локально отвечает 200, а снаружи чередуются 502 — проблема не в приложении целиком, а в одном из нескольких экземпляров за балансировщиком, часть которых нездорова."}]},

{id:"n4",t:"Nginx как reverse proxy",goal:"Поставить правильную дверь перед приложением",
 cards:[
 {h:"Зачем нужен прокси перед приложением",b:"<p>Приложение слушает 3000 на localhost. Nginx на 80/443 берёт на себя: терминацию TLS, отдачу статики, балансировку, ограничение скорости, единый access-лог.</p><p><b>Зачем в жизни:</b> приложение остаётся простым и не знает про сертификаты — это забота слоя перед ним."},
 {h:"nginx -t — обязательная проверка",b:"<pre>nginx -t\nsystemctl reload nginx</pre><p><code>reload</code> поднимает новые воркеры с новым конфигом, старые дорабатывают текущие запросы — zero downtime. <code>restart</code> рвёт соединения.</p><p><b>Правило:</b> всегда <code>nginx -t</code> перед reload — иначе битый конфиг оставит без веб-сервера.</p>",
  cheat:"nginx -t && systemctl reload nginx — проверка обязательна перед применением",
  t:{q:"Проверь синтаксис конфигурации nginx, прежде чем его применять.",ans:["nginx -t","sudo nginx -t"],hint:"nginx -t",why:"nginx -t разбирает конфиг и указывает файл и строку с ошибкой, если она есть."}},
 {h:"proxy_pass и заголовки",b:"<pre>location / {\n  proxy_pass http://127.0.0.1:3000;\n  proxy_set_header Host              $host;\n  proxy_set_header X-Real-IP         $remote_addr;\n  proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;\n  proxy_set_header X-Forwarded-Proto $scheme;\n}</pre><p>Без <code>Host</code> приложение видит «127.0.0.1» и строит неправильные ссылки. Без <code>X-Forwarded-For</code> в логах приложения у всех запросов один IP — прокси.</p><p><b>Зачем в жизни:</b> забытый X-Forwarded-Proto даёт бесконечный редирект http↔https при терминации TLS на прокси — частый и неочевидный баг.</p>",
  cheat:"proxy_pass URL — передать запрос на приложение · всегда с proxy_set_header Host/X-Forwarded-*",
  t:{q:"Настрой прокси на приложение, слушающее localhost:3000: напиши директиву proxy_pass внутри location.",ans:["proxy_pass http://127.0.0.1:3000;","proxy_pass http://127.0.0.1:3000"],hint:"proxy_pass http://127.0.0.1:3000;",why:"proxy_pass — ядро reverse proxy, дальше обязательны заголовки proxy_set_header."}},
 {h:"Балансировка нескольких бэкендов",b:"<pre>upstream app {\n  least_conn;\n  server 10.0.1.11:3000 max_fails=3 fail_timeout=10s;\n  server 10.0.1.12:3000 max_fails=3 fail_timeout=10s;\n}</pre><p><code>max_fails</code>/<code>fail_timeout</code> временно выводят больной сервер из ротации — иначе ровно 1/N пользователей стабильно получает ошибки.</p><p><b>Зачем в жизни:</b> без этих параметров балансировщик честно продолжает слать треть трафика в мёртвый узел.</p>",
  cheat:"upstream { server адрес max_fails=3 fail_timeout=10s; } — вывод больного сервера из ротации"}],
 ch:[
 {t:"c",d:1,q:"Разминка. Проверь синтаксис конфигурации nginx перед применением.",ans:["nginx -t","sudo nginx -t"],hint:"nginx -t",why:"Обязательный шаг перед reload."},
 {t:"c",d:2,q:"Примени новый конфиг nginx без разрыва текущих соединений (не restart).",ans:["systemctl reload nginx","sudo systemctl reload nginx"],hint:"reload, не restart",why:"reload поднимает новые воркеры, старые дорабатывают запросы."},
 {t:"f",d:3,q:"Допиши директиву, передающую запрос на приложение, которое слушает localhost:3000.",pre:"location / {\n  ___ http://127.0.0.1:3000;\n}",ans:["proxy_pass"],hint:"proxy_...",why:"proxy_pass — ядро reverse proxy."},
 {t:"c",d:4,q:"Напиши команду, объединяющую проверку конфига и его применение через &&: сначала nginx -t, потом reload сервиса nginx через systemctl — но reload должен выполниться только если проверка прошла успешно.",ans:["nginx -t && systemctl reload nginx","sudo nginx -t && sudo systemctl reload nginx"],hint:"nginx -t && systemctl reload nginx",why:"&& выполняет вторую команду только при успехе первой — reload не запустится с битым конфигом."},
 {t:"c",d:5,q:"Инцидент. Один из трёх бэкендов в upstream app упал, nginx балансирует round-robin без max_fails — каждый третий запрос падает с 502. Допиши строку с адресом упавшего сервера (10.0.1.13:3000) в блок upstream так, чтобы он автоматически выводился из ротации после 3 неудач в течение 10 секунд.",ans:["server 10.0.1.13:3000 max_fails=3 fail_timeout=10s;","server 10.0.1.13:3000 max_fails=3 fail_timeout=10s"],hint:"server адрес max_fails=3 fail_timeout=10s;",why:"max_fails/fail_timeout — параметры именно этого сервера в upstream, они временно исключают его при повторных отказах."}]},

{id:"n5",t:"TLS и сертификаты",goal:"Понимать, что именно проверяет браузер",
 cards:[
 {h:"Что происходит при рукопожатии",b:"<ol><li>Клиент присылает SNI — имя домена, к которому обращается.</li><li>Сервер по SNI выбирает нужный сертификат.</li><li>Клиент проверяет подпись, срок действия, совпадение имени.</li><li>Договариваются о сеансовом ключе, дальше трафик шифруется.</li></ol><p><b>SNI</b> объясняет, почему на одном IP живут сотни сайтов с разными сертификатами.</p><p><b>Зачем в жизни:</b> обращение по голому IP без SNI получает сертификат «по умолчанию» — отсюда предупреждения браузера при прямом IP."},
 {h:"fullchain и приватный ключ",b:"<p><b>fullchain.pem</b> — сертификат сайта плюс промежуточные. <b>privkey.pem</b> — приватный ключ, никогда не покидает сервер, права 600.</p><p><b>Частая ошибка:</b> отдать только сертификат сайта без промежуточных — десктопный браузер достроит цепочку сам, а curl и мобильные приложения — нет.</p><p><b>Зачем в жизни:</b> «у меня открывается, а у клиента через приложение ошибка TLS» почти всегда означает недостающую промежуточную цепочку.</p>"},
 {h:"openssl s_client — проверка сертификата руками",b:"<pre>echo | openssl s_client -connect shop.ru:443 -servername shop.ru 2&gt;/dev/null \\\n  | openssl x509 -noout -dates -subject -issuer</pre><p>Выведет даты действия, кому выдан и кем — быстрый ответ на «сертификат ещё жив?».</p><p><b>Зачем в жизни:</b> когда curl -v даёт слишком много вывода, эта команда точечно показывает именно даты сертификата.</p>",
  cheat:"openssl s_client -connect хост:443 -servername хост | openssl x509 -noout -dates — проверить срок сертификата",
  t:{q:"Проверь срок действия сертификата shop.ru: подключись через openssl s_client с указанием -servername и выведи только даты (используй пайп с openssl x509 -noout -dates).",ans:["echo | openssl s_client -connect shop.ru:443 -servername shop.ru 2>/dev/null | openssl x509 -noout -dates"],hint:"echo | openssl s_client -connect хост:443 -servername хост 2>/dev/null | openssl x509 -noout -dates",why:"-servername обязателен для SNI, без него можно получить не тот сертификат. Пайп в x509 -noout -dates выводит только notBefore/notAfter."}},
 {h:"Let's Encrypt и мониторинг автопродления",b:"<p>Сертификат действует 90 дней, продление автоматическое через certbot. Проверка владения — по http-01: центр запрашивает файл по <code>http://домен/.well-known/acme-challenge/...</code>, значит порт 80 должен быть открыт.</p><p><b>У автоматики тоже должен быть мониторинг.</b> Алерт «сертификат истекает через 21 день» — иначе о поломке продления узнаёшь от клиентов в день истечения.</p><p><b>Зачем в жизни:</b> сломанное автопродление — тихий отказ, который проявляется резко и в самый неудобный момент.</p>",
  cheat:"http-01 challenge требует открытый порт 80 · ставь алерт на приближение срока действия сертификата"}],
 ch:[
 {t:"c",d:1,q:"Разминка. Сделай подробный запрос к https://shop.ru, чтобы увидеть детали TLS-рукопожатия.",ans:["curl -v https://shop.ru"],hint:"curl -v",why:"-v показывает версию TLS и цепочку сертификатов."},
 {t:"c",d:2,q:"Проверь срок действия сертификата shop.ru через openssl s_client, выведи только даты действия.",ans:["echo | openssl s_client -connect shop.ru:443 -servername shop.ru 2>/dev/null | openssl x509 -noout -dates"],hint:"echo | openssl s_client -connect хост:443 -servername хост | openssl x509 -noout -dates",why:"-servername обязателен для правильного SNI при проверке."},
 {t:"c",d:3,q:"Проверь, отдаёт ли сервер полную цепочку сертификатов (включая промежуточные) для shop.ru — выведи subject и issuer через openssl.",ans:["echo | openssl s_client -connect shop.ru:443 -servername shop.ru 2>/dev/null | openssl x509 -noout -subject -issuer"],hint:"тот же openssl s_client, но -subject -issuer вместо -dates",why:"issuer покажет, кем выдан сертификат — если браузер показывает ошибку о недоверенном издателе, проблема обычно тут."},
 {t:"c",d:4,q:"Sайт открывается в браузере, но curl ругается «unable to get local issuer certificate» — подозреваешь отсутствие промежуточной цепочки. Проверь полную цепочку сертификатов, которую реально отдаёт сервер (весь вывод s_client, не только x509, найди все блоки BEGIN CERTIFICATE).",ans:["openssl s_client -connect shop.ru:443 -servername shop.ru -showcerts"],hint:"добавь флаг -showcerts к s_client",why:"-showcerts выводит всю цепочку, которую реально отдаёт сервер — по числу блока BEGIN CERTIFICATE видно, хватает ли промежуточных."},
 {t:"c",d:5,q:"Инцидент. Сертификат истёк ночью, продажи встали. journalctl -u certbot показывает «Failed authorization: connection to :80 refused». Ты уже вернул обслуживание порта 80. Теперь запусти продление сертификата вручную через certbot.",ans:["certbot renew","sudo certbot renew","certbot renew --force-renewal"],hint:"certbot renew",why:"После восстановления порта 80 (нужного для http-01 challenge) продление запускается вручную, не дожидаясь следующего автоматического окна."}]},

{id:"n6",t:"SSH: доступ и туннели",goal:"Заходить безопасно и добираться до закрытых сервисов",
 cards:[
 {h:"Ключи вместо паролей",b:"<pre>ssh-keygen -t ed25519 -C \"me@work\"\nssh-copy-id user@server</pre><p>Приватный ключ не покидает твою машину. Права обязательны: 700 на ~/.ssh, 600 на приватный ключ.</p><p><b>ed25519</b> короче и надёжнее RSA-2048.</p><p><b>Зачем в жизни:</b> первое, что настраивают на новом рабочем месте — свой ключ и доступ к серверам через него, без паролей.</p>",
  cheat:"ssh-keygen -t ed25519 — создать современный ключ · ssh-copy-id — скопировать публичный на сервер",
  t:{q:"Сгенерируй современный SSH-ключ типа ed25519 с комментарием work.",ans:["ssh-keygen -t ed25519 -C work","ssh-keygen -t ed25519"],hint:"ssh-keygen -t ed25519",why:"ed25519 короче и надёжнее RSA-2048 при том же уровне защиты."}},
 {h:"Проброс портов — доступ к закрытым сервисам",b:"<pre>ssh -L 5433:localhost:5432 user@server</pre><p>Локальный 5433 → 5432 на удалённой стороне. После этого <code>psql -h localhost -p 5433</code> работает с базой, которая не смотрит в интернет.</p><p><b>Зачем в жизни:</b> база данных на проде не должна иметь публичный адрес — доступ инженера идёт именно через такой туннель.</p>",
  cheat:"ssh -L локальный_порт:localhost:удалённый_порт user@server — туннель к закрытому сервису",
  t:{q:"Пробрось локальный порт 5433 на порт 5432 сервера prod-db, чтобы подключиться к его базе с ноутбука.",ans:["ssh -L 5433:localhost:5432 user@prod-db","ssh -L 5433:127.0.0.1:5432 user@prod-db"],hint:"-L локальный:localhost:удалённый user@хост",why:"Порядок в -L: сначала локальный порт, потом адрес и порт со стороны сервера."}},
 {h:"ProxyJump — доступ через бастион",b:"<pre>ssh -J bastion user@internal</pre><p>Строит цепочку подключений, не оставляя приватный ключ на промежуточной машине. Копировать ключ на бастион — распространённая и опасная ошибка.</p><p><b>Зачем в жизни:</b> сервер во внутренней сети без прямого доступа снаружи — типовая архитектура, и ProxyJump единственный правильный способ до него достучаться.</p>",
  cheat:"ssh -J бастион user@внутренний_хост — подключение через промежуточный сервер"}],
 ch:[
 {t:"c",d:1,q:"Разминка. Сгенерируй SSH-ключ типа ed25519.",ans:["ssh-keygen -t ed25519"],hint:"ssh-keygen -t ed25519",why:"Современный тип ключа, короче и надёжнее RSA-2048."},
 {t:"c",d:2,q:"Пробрось локальный порт 5433 на порт 5432 сервера db-prod.",ans:["ssh -L 5433:localhost:5432 user@db-prod","ssh -L 5433:127.0.0.1:5432 user@db-prod"],hint:"-L локальный:localhost:удалённый user@хост",why:"Безопасный доступ к базе без открытия порта наружу."},
 {t:"c",d:3,q:"Подключись к серверу internal-01 через бастион-сервер jump-host.",ans:["ssh -J jump-host user@internal-01","ssh -J user@jump-host user@internal-01"],hint:"ssh -J бастион user@конечный_хост",why:"ProxyJump не оставляет приватный ключ на промежуточной машине."},
 {t:"c",d:4,q:"Подключись к серверу с нестандартным SSH-портом 2222, используя конкретный файл ключа ~/.ssh/prod_ed25519, к пользователю deploy на хосте 10.0.1.20.",ans:["ssh -i ~/.ssh/prod_ed25519 -p 2222 deploy@10.0.1.20"],hint:"ssh -i файл_ключа -p порт user@хост",why:"-i указывает конкретный ключ (если их несколько), -p — нестандартный порт."},
 {t:"c",d:5,q:"Инцидент. Нужно подключиться к базе данных на сервере db-internal (порт 5432), которая доступна только из внутренней сети — прямого доступа снаружи нет, но есть бастион bastion.company.ru. Пробрось локальный порт 5433 на db-internal:5432 через бастион одной командой.",ans:["ssh -L 5433:db-internal:5432 user@bastion.company.ru"],hint:"ssh -L локальный:db-internal:5432 user@бастион",why:"Проброс порта через промежуточный хост (бастион) — конечный адрес db-internal указывается как часть -L, а не как отдельный хост подключения."}]},

{id:"n7",t:"Firewall и сетевые доступы",goal:"Закрыть всё лишнее и не отрезать себя",
 cards:[
 {h:"Политика по умолчанию: deny incoming",b:"<pre>ufw default deny incoming\nufw allow 22/tcp\nufw allow 80,443/tcp\nufw enable</pre><p>Правильная модель: всё входящее запрещено, разрешено точечно. Обратный подход («закроем плохое») не масштабируется.</p><p><b>Зачем в жизни:</b> так настраивается любой новый сервер — сначала разрешить SSH, потом включать deny by default, иначе отрежешь себя.</p>",
  cheat:"ufw default deny incoming + ufw allow нужные_порты — базовая настройка любого сервера",
  t:{q:"Разреши на сервере входящие подключения по SSH (порт 22).",ans:["ufw allow 22/tcp","ufw allow 22"],hint:"ufw allow 22/tcp",why:"Обязательно ДО включения политики deny incoming, иначе потеряешь доступ."}},
 {h:"ss -tulpn — проверка адреса привязки",b:"<pre>ss -tulpn | grep 5432</pre><p>Смотри адрес слева от порта: <code>127.0.0.1</code> — только локально, <code>0.0.0.0</code> — доступен из сети.</p><p><b>Зачем в жизни:</b> «порт открыт в фаерволе, а подключиться не могу» часто означает, что сервис слушает только localhost — никакой фаервол это не исправит.</p>",
  cheat:"ss -tulpn | grep порт — на каком адресе слушает сервис (127.0.0.1 vs 0.0.0.0)",
  t:{q:"Проверь, какой процесс слушает порт 5432 и на каком адресе.",ans:["ss -tulpn | grep 5432"],hint:"ss -tulpn | grep порт",why:"Адрес слева от порта решает, доступен ли сервис снаружи."}},
 {h:"Refused против timeout",b:"<table class='tw'><tr><th>ответ</th><th>значит</th><th>куда идти</th></tr><tr><td>refused</td><td>пакет дошёл, порт не слушает</td><td>к сервису</td></tr><tr><td>timeout</td><td>ответа нет вовсе</td><td>к фаерволу</td></tr></table><p><b>Зачем в жизни:</b> эта таблица за секунду говорит, звать разработчика или сетевого инженера.</p>",
  cheat:"nc -zv хост порт → refused = проблема в сервисе, timeout = фильтрация на фаерволе"}],
 ch:[
 {t:"c",d:1,q:"Разминка. Разреши входящие SSH-подключения (порт 22) в ufw.",ans:["ufw allow 22/tcp","ufw allow 22"],hint:"ufw allow 22",why:"Обязательный первый шаг перед включением строгой политики."},
 {t:"c",d:2,q:"Проверь, какой процесс слушает порт 5432 и на каком адресе привязки.",ans:["ss -tulpn | grep 5432"],hint:"ss -tulpn | grep порт",why:"Адрес слева от порта определяет, доступен ли сервис снаружи."},
 {t:"c",d:3,q:"Проверь, доступен ли порт 443 на хосте shop.ru снаружи (без передачи данных).",ans:["nc -zv shop.ru 443"],hint:"nc -zv хост порт",why:"refused значит сервис не слушает, timeout — фильтрация."},
 {t:"c",d:4,q:"Настрой ufw на сервере с нуля безопасно: разреши SSH и 80/443, затем включи политику запрета входящих по умолчанию. Три команды через &&, в правильном порядке (сначала разрешения, потом deny).",ans:["ufw allow 22/tcp && ufw allow 80,443/tcp && ufw default deny incoming","ufw allow 22 && ufw allow 80,443/tcp && ufw default deny incoming"],hint:"сначала allow 22, потом allow 80,443, потом default deny incoming",why:"Обратный порядок (сначала deny) отрежет тебя от сервера раньше, чем ты успеешь разрешить нужные порты."},
 {t:"c",d:5,q:"Инцидент. Приложение на сервере A перестало обращаться к API на сервере B. ping B проходит. Проверь порт 443 на B (используй nc), чтобы понять: это фильтрация на фаерволе или упавший сервис.",ans:["nc -zv B 443"],hint:"nc -zv B 443",why:"Если команда зависнет и завершится таймаутом (не refused) — это фильтрация, значит нужно смотреть правила фаервола на B и security group, а не логи приложения."}]},

{id:"n8",t:"За прокси: заголовки, сессии, лимиты",goal:"Понимать, что видит приложение и как его защитить",
 cards:[
 {h:"X-Forwarded-For — реальный IP клиента",b:"<pre>X-Forwarded-For: 93.10.4.2, 10.0.1.5</pre><p>За балансировщиком приложение видит адрес прокси. Реальный клиент — в этом заголовке, списком через запятую (каждый прокси дописывает предыдущий адрес).</p><p><b>Заголовок можно подделать</b> — доверять ему можно только от известных прокси.</p><p><b>Зачем в жизни:</b> «в логах приложения у всех запросов один IP» — забытая передача этого заголовка на уровне nginx.</p>",
  cheat:"X-Forwarded-For — реальный IP клиента за прокси (список, доверять только от известных прокси)"},
 {h:"client_max_body_size — частая причина 413",b:"<pre>client_max_body_size 10m;</pre><p>По умолчанию лимит около 1 МБ на прокси, и запрос отсекается ДО того, как дойдёт до приложения — поэтому в логах приложения по такой ошибке ничего нет.</p><p><b>Зачем в жизни:</b> пользователь не может загрузить файл, приложение молчит в логах — первым делом смотришь именно эту директиву в nginx, а не код приложения.</p>",
  cheat:"client_max_body_size — лимит размера запроса в nginx, причина 413 без следов в логах приложения",
  t:{q:"Разреши в конфиге nginx загрузку файлов до 20 мегабайт.",ans:["client_max_body_size 20m;","client_max_body_size 20m"],hint:"client_max_body_size 20m;",why:"По умолчанию лимит около 1 МБ — превышение даёт 413 ещё на уровне прокси."}},
 {h:"limit_req — защита от перебора",b:"<pre>limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;\n\nlocation /login {\n  limit_req zone=api burst=20 nodelay;\n}</pre><p><code>burst</code> разрешает короткие всплески сверх средней скорости, не отсекая обычных пользователей.</p><p><b>Зачем в жизни:</b> первая линия защиты формы входа от перебора паролей — прежде чем разбираться с приложением.</p>",
  cheat:"limit_req_zone ... rate=Nr/s + limit_req zone=... burst=N — защита от перебора и наплыва"}],
 ch:[
 {t:"c",d:1,q:"Разминка. Разреши загрузку файлов размером до 15 мегабайт в конфиге nginx.",ans:["client_max_body_size 15m;","client_max_body_size 15m"],hint:"client_max_body_size 15m;",why:"По умолчанию лимит около 1 МБ."},
 {t:"c",d:2,q:"Проверь, какой процесс слушает порт 3000 и на каком адресе (проверяешь, не привязано ли приложение только к localhost).",ans:["ss -tulpn | grep 3000"],hint:"ss -tulpn | grep 3000",why:"Тот же приём диагностики адреса привязки, что и с базами данных."},
 {t:"c",d:3,q:"Настрой зону ограничения скорости в nginx: назови её api, храни в 10 мегабайтах памяти, лимит 5 запросов в секунду с одного адреса.",ans:["limit_req_zone $binary_remote_addr zone=api:10m rate=5r/s;"],hint:"limit_req_zone $binary_remote_addr zone=имя:размер rate=Nr/s;",why:"Это объявление зоны — применяется потом директивой limit_req zone=api в нужном location."},
 {t:"c",d:4,q:"Примени созданную зону api к location /login с разрешённым всплеском в 10 запросов сверх лимита.",ans:["limit_req zone=api burst=10;","limit_req zone=api burst=10"],hint:"limit_req zone=имя_зоны burst=N;",why:"burst даёт короткий запас, чтобы не отсекать обычных пользователей с несколькими параллельными запросами браузера."},
 {t:"c",d:5,q:"Инцидент. На форму входа /login идёт перебор паролей: тысячи запросов в минуту. Настрой немедленную защиту — зону ограничения на 3 запроса в секунду с адреса (имя zone: login, память 10m) и примени её к /login с burst 5 и флагом nodelay. Две строки конфига.",ans:["limit_req_zone $binary_remote_addr zone=login:10m rate=3r/s;\nlimit_req zone=login burst=5 nodelay;"],hint:"поле одной строкой: limit_req_zone ... rate=3r/s; limit_req zone=login burst=5 nodelay; (через пробел вместо переноса)",why:"nodelay не ставит лишние запросы в очередь, а сразу отклоняет их — важно при активной атаке, чтобы не копить соединения."}]}
);
