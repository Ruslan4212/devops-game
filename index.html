{id:"d1",t:"Что такое контейнер на самом деле",goal:"Отличать образ от контейнера и объяснить разницу с ВМ",
 cards:[
 {h:"Образ и контейнер — как класс и объект",b:"<p><b>Образ</b> — неизменяемый шаблон файловой системы плюс метаданные (какую команду запускать, от какого пользователя, какие порты). Только для чтения.</p><p><b>Контейнер</b> — запущенный экземпляр образа с тонким <b>записываемым слоем</b> сверху. Из одного образа поднимаются пятьдесят контейнеров, и каждый пишет в свой слой.</p><p>Отсюда следствие: удалил контейнер — записываемый слой исчез. Всё, что должно пережить пересоздание, выносится в тома.</p>"},
 {h:"Контейнер — не виртуалка",b:"<div class='tw'><table><tr><th></th><th>виртуальная машина</th><th>контейнер</th></tr><tr><td>ядро</td><td>своё</td><td>общее с хостом</td></tr><tr><td>размер</td><td>гигабайты</td><td>мегабайты</td></tr><tr><td>старт</td><td>десятки секунд</td><td>миллисекунды</td></tr><tr><td>изоляция</td><td>аппаратная, сильная</td><td>средствами ядра</td></tr></table></div><p>Контейнер — это <b>обычный процесс на хосте</b>, которому ядро ограничило видимость и ресурсы:</p><ul><li><b>namespaces</b> — что процесс видит: свои PID, сеть, точки монтирования, имя хоста</li><li><b>cgroups</b> — сколько ему можно: CPU, память, ввод-вывод</li></ul><p>Именно эту формулировку хотят услышать на собеседовании.</p><div class='analogy'><b>Аналогия:</b> ВМ — отдельная квартира со своими коммуникациями. Контейнер — комната в коммуналке со звукоизоляцией и счётчиком на электричество.</div>"},
 {h:"Слои и почему они экономят",b:"<p>Образ состоит из слоёв, каждый — результат одной инструкции Dockerfile. Слои <b>переиспользуются между образами</b>: если десять образов основаны на <code>node:20-alpine</code>, базовый слой на диске один.</p><pre>docker images        <span class='c'># локальные образы</span>\ndocker history app:1.0   <span class='c'># из каких слоёв собран и их размер</span></pre><p><code>docker history</code> — способ увидеть, какая инструкция раздула образ.</p>"},
 {h:"Команды первого дня",b:"<pre>docker run -d -p 8080:80 --name web nginx\ndocker ps              <span class='c'># запущенные</span>\ndocker ps -a           <span class='c'># включая остановленные</span>\ndocker logs -f web\ndocker exec -it web sh <span class='c'># зайти внутрь работающего</span>\ndocker stop web &amp;&amp; docker rm web\ndocker inspect web     <span class='c'># вся конфигурация в JSON</span></pre><p><b>Порядок в <code>-p</code> всегда ХОСТ:КОНТЕЙНЕР.</b> Перепутал — снаружи ничего не отвечает.</p><p><code>exec</code> запускает новый процесс в существующем контейнере. <code>attach</code> цепляется к главному процессу, и Ctrl+C может его убить — поэтому в отладке используют exec.</p>"},
 {h:"Жизнь контейнера равна жизни PID 1",b:"<p>Контейнер живёт ровно столько, сколько работает его <b>главный процесс</b>. Завершился — контейнер остановлен, каким бы важным он ни был.</p><p>Отсюда самая частая ошибка новичка: запустить сервис в фоне (демоном) внутри контейнера. Команда отработала, процесс ушёл в фон, PID 1 завершился — контейнер мгновенно остановился.</p><p>Правило: в контейнере процесс запускают <b>на переднем плане</b>: <code>nginx -g 'daemon off;'</code>, <code>node server.js</code>.</p>"}],
 ch:[
 {t:"c",d:1,q:"Покажи все контейнеры, включая остановленные.",ans:["docker ps -a","docker ps --all","docker container ls -a"],hint:"ps + флаг all",why:"Без -a ты не увидишь упавшие контейнеры — а именно они обычно и есть причина проблемы."},
 {t:"c",d:2,q:"Запусти nginx в фоне: порт 8080 хоста на 80 контейнера, имя контейнера web.",ans:["docker run -d -p 8080:80 --name web nginx","docker run -d --name web -p 8080:80 nginx","docker run --name web -d -p 8080:80 nginx"],hint:"-d, -p хост:контейнер, --name",why:"Порядок в -p всегда ХОСТ:КОНТЕЙНЕР. Перепутанные числа — самая частая причина «порт не отвечает»."},
 {t:"q",d:3,q:"Чем контейнер принципиально отличается от виртуальной машины?",a:["Ничем, это синонимы","Контейнер использует ядро хоста; изоляция достигается namespaces (что видно) и cgroups (сколько ресурсов)","Контейнер работает медленнее","Контейнеру нужен свой BIOS"],c:1,why:"Формулировка через namespaces и cgroups — то, что отличает понимание от заучивания. Из неё же следует, что контейнер не заменяет ВМ там, где нужна сильная изоляция."},
 {t:"q",d:3,q:"Контейнер остановился сразу после запуска, в логах ничего. Самая частая причина?",a:["Не хватило памяти","Главный процесс завершился: например, сервис запущен демоном в фоне вместо переднего плана","Не открыт порт","Нет сети"],c:1,why:"Контейнер живёт, пока жив PID 1. Проверять надо docker logs и команду запуска в образе."},
 {t:"q",d:4,q:"Почему при удалении контейнера с базой данных пропали все данные?",a:["Docker их сжал","Данные лежали в записываемом слое контейнера, который удаляется вместе с ним — нужен volume","База была повреждена","Не хватило места"],c:1,why:"Контейнер эфемерен by design. Всё состояние выносится в тома или во внешние сервисы — это фундаментальное свойство, а не недостаток."},
 {t:"q",d:5,q:"<b>Инцидент.</b> Приложение в контейнере отвечает на <code>curl</code> изнутри хоста по <code>localhost:3000</code>, но снаружи по <code>http://сервер:8080</code> — нет. Контейнер запущен как <code>docker run -d -p 3000:8080 app</code>. Что не так?",a:["Нужно открыть порт в фаерволе","Порты перепутаны местами: наружу опубликован 3000, а приложение внутри слушает 3000 — должно быть <code>-p 8080:3000</code>","Контейнер не запущен","Приложение слушает localhost внутри контейнера"],c:1,why:"Порядок ХОСТ:КОНТЕЙНЕР. И вторая частая причина этой же симптоматики — приложение внутри слушает 127.0.0.1 вместо 0.0.0.0, тогда проброс не поможет: снаружи контейнера до него не достучаться."}]},

{id:"d2",t:"Dockerfile и слои",goal:"Собрать образ, который быстро собирается и мало весит",
 cards:[
 {h:"Анатомия",b:"<pre>FROM node:20-alpine\nWORKDIR /app\nCOPY package*.json ./\nRUN npm ci --omit=dev\nCOPY . .\nEXPOSE 3000\nUSER node\nCMD [\"node\", \"server.js\"]</pre><div class='tw'><table><tr><th>инструкция</th><th>смысл</th></tr><tr><td><code>FROM</code></td><td>базовый образ</td></tr><tr><td><code>WORKDIR</code></td><td>рабочий каталог для следующих команд</td></tr><tr><td><code>COPY</code></td><td>копирует файлы из контекста сборки в образ</td></tr><tr><td><code>RUN</code></td><td>выполняет команду <b>во время сборки</b>, создавая слой</td></tr><tr><td><code>CMD</code></td><td>команда <b>при запуске</b> контейнера</td></tr><tr><td><code>EXPOSE</code></td><td>документирует порт (сам ничего не публикует!)</td></tr></table></div>"},
 {h:"Кэш слоёв — главный приём ускорения",b:"<p>Docker кэширует каждый слой. При пересборке он использует кэш, пока не встретит изменившуюся инструкцию, — а дальше пересобирает <b>всё до конца</b>.</p><p>Поэтому <code>package.json</code> копируется отдельно и <b>до</b> остального кода:</p><pre>COPY package*.json ./\nRUN npm ci        <span class='c'># этот слой переиспользуется</span>\nCOPY . .          <span class='c'># меняется часто, но он последний</span></pre><p>Изменил код — установка зависимостей берётся из кэша, сборка вместо трёх минут занимает десять секунд.</p><p><b>Правило:</b> редко меняющееся — выше, часто меняющееся — ниже.</p>"},
 {h:"Multi-stage: собрать в одном, запустить в другом",b:"<pre>FROM golang:1.22 AS build\nWORKDIR /src\nCOPY . .\nRUN go build -o /app/server\n\nFROM alpine:3.20\nCOPY --from=build /app/server /server\nUSER 1000\nCMD [\"/server\"]</pre><p>В финальный образ не попадают компилятор, исходники и кэш сборки: 900 МБ превращаются в 15 МБ.</p><p>Меньше размер — быстрее выкатка, меньше поверхность атаки и меньше уязвимостей в отчётах сканера.</p>"},
 {h:"CMD и ENTRYPOINT",b:"<div class='tw'><table><tr><th></th><th>CMD</th><th>ENTRYPOINT</th></tr><tr><td>смысл</td><td>команда по умолчанию</td><td>то, что выполняется всегда</td></tr><tr><td>аргументы docker run</td><td>заменяют CMD целиком</td><td>добавляются к ENTRYPOINT</td></tr></table></div><p>Частая связка: <code>ENTRYPOINT [\"/app/server\"]</code> и <code>CMD [\"--port=3000\"]</code> — бинарник фиксирован, флаги можно переопределить.</p><p><b>Обязательно exec-форма</b> (массив), а не shell-форма. В shell-форме процессом PID 1 становится <code>/bin/sh</code>, который не передаёт сигналы дальше, — и graceful shutdown ломается.</p>"},
 {h:"Контекст сборки и .dockerignore",b:"<p>Точка в <code>docker build -t app .</code> — это <b>контекст</b>: весь каталог отправляется демону. Без <code>.dockerignore</code> туда уедут <code>.git</code>, <code>node_modules</code>, локальный <code>.env</code>.</p><pre># .dockerignore\n.git\nnode_modules\n*.log\n.env\nDockerfile</pre><p>Это одновременно про скорость (меньше передавать) и про безопасность (секреты не попадут в образ через <code>COPY . .</code>).</p>"}],
 ch:[
 {t:"c",d:1,q:"Собери образ с тегом app:1.0 из текущего каталога.",ans:["docker build -t app:1.0 .","docker build -t app:1.0 ./"],hint:"build -t имя:тег контекст",why:"Точка в конце — контекст сборки, а не «текущий Dockerfile». Весь каталог уходит демону, поэтому нужен .dockerignore."},
 {t:"q",d:2,q:"Что делает инструкция <code>EXPOSE 3000</code>?",a:["Публикует порт наружу","Только документирует порт; публикация делается флагом -p при запуске","Открывает порт в фаерволе","Меняет порт приложения"],c:1,why:"Распространённое заблуждение. EXPOSE — метаданные для человека и для docker run -P; сам по себе он ничего не открывает."},
 {t:"q",d:3,q:"Почему <code>package.json</code> копируют отдельно и ДО остального кода?",a:["Так требует npm","Ради кэша слоёв: при изменении кода зависимости не переустанавливаются","Иначе не соберётся","Для безопасности"],c:1,why:"Кэш инвалидируется с первой изменившейся инструкции и до конца файла. Порядок инструкций напрямую определяет время сборки."},
 {t:"q",d:4,q:"Зачем нужен multi-stage build?",a:["Собирать несколько приложений сразу","Оставить в финальном образе только артефакт, без компилятора и исходников — меньше размер и меньше уязвимостей","Ускорить запуск контейнера","Он обязателен для Kubernetes"],c:1,why:"Классический ответ на собеседовании: минимальная база + бинарник + непривилегированный пользователь. Плюс исходный код не уезжает в реестр."},
 {t:"q",d:4,q:"Почему <code>CMD [\"node\",\"server.js\"]</code> лучше, чем <code>CMD node server.js</code>?",a:["Разницы нет","В exec-форме процесс становится PID 1 и получает сигналы; в shell-форме PID 1 — это sh, он не передаёт SIGTERM, и graceful shutdown ломается","Exec-форма быстрее","Shell-форма устарела синтаксически"],c:1,why:"Последствие видно при docker stop: контейнер висит 10 секунд и убивается жёстко, обрывая запросы. Для приложений, не умеющих в сигналы, есть --init/tini."},
 {t:"q",d:5,q:"<b>Инцидент.</b> Сборка образа в CI занимает 9 минут при каждом коммите, хотя зависимости не менялись. В Dockerfile: <code>FROM node:20</code>, затем <code>COPY . .</code>, затем <code>RUN npm install</code>. Что исправить, по убыванию эффекта?",a:["Купить более мощный раннер","1) разделить COPY: сначала package*.json + npm ci, потом COPY . .; 2) заменить базу на node:20-alpine; 3) добавить .dockerignore; 4) multi-stage","Уменьшить число тестов","Собирать образ реже"],c:1,why:"Первый пункт даёт основной выигрыш: кэш зависимостей перестаёт сбрасываться при каждом изменении кода. Остальное уменьшает размер и объём передаваемого контекста."}]},

{id:"d3",t:"Данные: тома и bind mount",goal:"Разделить эфемерное и постоянное",
 cards:[
 {h:"Три способа отдать контейнеру файлы",b:"<div class='tw'><table><tr><th>тип</th><th>синтаксис</th><th>для чего</th></tr><tr><td><b>volume</b></td><td><code>-v pgdata:/var/lib/postgresql/data</code></td><td>данные; управляется docker, переносим</td></tr><tr><td><b>bind mount</b></td><td><code>-v $(pwd)/conf:/etc/app:ro</code></td><td>конфиги и разработка; конкретная папка хоста</td></tr><tr><td><b>tmpfs</b></td><td><code>--tmpfs /tmp</code></td><td>только в памяти, исчезает с контейнером</td></tr></table></div><p>Суффикс <code>:ro</code> монтирует только для чтения — хорошая практика для конфигов и секретов.</p>"},
 {h:"Почему volume, а не bind mount на проде",b:"<ul><li>том не зависит от структуры каталогов конкретного сервера</li><li>docker управляет правами и владельцем</li><li>его легко забэкапить и перенести стандартным способом</li><li>драйверы позволяют хранить том не только локально</li></ul><p>Bind mount незаменим в разработке (правишь код на хосте — он сразу в контейнере) и для конфигов, но на проде для данных берут именованные тома или внешнее хранилище.</p>"},
 {h:"Бэкап и перенос тома",b:"<pre>docker run --rm \\\n  -v pgdata:/data \\\n  -v $(pwd):/backup \\\n  alpine tar czf /backup/pgdata.tar.gz -C /data .</pre><p>Приём «одноразовый контейнер с двумя томами» работает и для восстановления, и для миграции между хостами. <code>--rm</code> удаляет контейнер сразу после завершения.</p><pre>docker volume ls\ndocker volume inspect pgdata\ndocker volume prune       <span class='c'># удалить неиспользуемые — осторожно!</span></pre>"},
 {h:"Одна буква ценой в данные",b:"<pre>docker compose down       <span class='c'># остановить и удалить контейнеры</span>\ndocker compose down -v    <span class='c'># ...и УДАЛИТЬ ТОМА</span></pre><p>Флаг <code>-v</code> здесь означает не «подробно», а «volumes». Это самая дорогая опечатка новичка: команда отрабатывает молча и мгновенно уносит базу.</p><p>Та же осторожность с <code>docker system prune -a --volumes</code>: она чистит всё неиспользуемое, включая тома остановленных контейнеров.</p>"},
 {h:"Права внутри тома",b:"<p>Контейнер работает от пользователя с определённым UID. Если том создан с владельцем root, а приложение работает от <code>node</code> (UID 1000), получишь <code>Permission denied</code> на запись.</p><p>Решения: задать нужного пользователя в образе (<code>USER node</code>) и выставить владельца на каталог данных при инициализации, либо использовать <code>--user $(id -u):$(id -g)</code> при запуске.</p>"}],
 ch:[
 {t:"c",d:1,q:"Запусти postgres:16 с именованным томом pgdata под данные.",ans:["docker run -v pgdata:/var/lib/postgresql/data postgres:16","docker run -d -v pgdata:/var/lib/postgresql/data postgres:16"],hint:"-v имя_тома:путь_внутри",why:"Путь внутри контейнера берётся из документации образа — у каждого он свой."},
 {t:"q",d:2,q:"Чем bind mount отличается от именованного тома?",a:["Ничем","Bind — конкретный путь на хосте, зависит от машины; том управляется docker и переносим","Bind всегда быстрее","Том доступен только для чтения"],c:1,why:"На проде для данных предпочитают тома, bind оставляют для конфигов и локальной разработки."},
 {t:"q",d:3,q:"Зачем монтировать конфиг с суффиксом <code>:ro</code>?",a:["Ускоряет чтение","Контейнер не сможет изменить файл — защита от порчи конфига и лишних прав","Экономит место","Требуется для secrets"],c:1,why:"Принцип наименьших привилегий на уровне монтирования: приложению конфиг нужен только для чтения."},
 {t:"q",d:3,q:"Что делает флаг <code>-v</code> в команде <code>docker compose down -v</code>?",a:["Включает подробный вывод","Удаляет тома вместе с контейнерами — данные будут потеряны","Проверяет конфигурацию","Показывает версию"],c:1,why:"Для остановки без потери данных — просто docker compose down. Флаг -v используют только осознанно, при полном сбросе окружения."},
 {t:"q",d:4,q:"Контейнер приложения падает с <code>Permission denied</code> при записи в примонтированный том. В образе указан <code>USER node</code>. Причина?",a:["Том повреждён","Владелец каталога тома — root, а процесс работает от UID пользователя node: нужно выставить владельца или запускать с подходящим --user","Не хватает места","Том смонтирован как ro"],c:1,why:"Права внутри тома определяются числовыми UID/GID, а не именами: одно и то же имя в образе и на хосте может иметь разные идентификаторы."},
 {t:"q",d:5,q:"<b>Инцидент.</b> Разработчик выполнил <code>docker compose down -v</code> на боевом сервере, чтобы «перезапустить стек начисто». База пропала. Что делать сейчас и что должно было это предотвратить?",a:["Восстановить том из кэша docker","Восстанавливаться из внешнего бэкапа; предотвращают: регулярные проверенные бэкапы вне хоста, отсутствие прямого доступа к проду руками, деплой только через пайплайн","Перезапустить docker","Данные восстановятся автоматически при следующем запуске"],c:1,why:"Docker не хранит удалённые тома нигде. Два системных вывода: бэкап без тестового восстановления не считается бэкапом, а ручные команды на проде должны быть исключением, а не нормой."}]},

{id:"d4",t:"Сети контейнеров и docker compose",goal:"Поднять стек из нескольких сервисов",
 cards:[
 {h:"Типы сетей",b:"<div class='tw'><table><tr><th>сеть</th><th>что даёт</th></tr><tr><td><b>bridge</b> (по умолчанию)</td><td>контейнеры на одном хосте, NAT наружу</td></tr><tr><td><b>пользовательская bridge</b></td><td>то же плюс <b>DNS по именам контейнеров</b></td></tr><tr><td><b>host</b></td><td>сеть хоста напрямую, без изоляции портов</td></tr><tr><td><b>none</b></td><td>без сети</td></tr></table></div><p><b>Важная деталь:</b> в дефолтной bridge-сети разрешение имён между контейнерами <b>не работает</b>. Оно появляется только в пользовательской сети — а compose создаёт её автоматически.</p><pre>docker network create backend\ndocker run --network backend --name db postgres:16</pre>"},
 {h:"compose: стек одним файлом",b:"<pre>services:\n  web:\n    build: .\n    ports: [\"8080:3000\"]\n    environment:\n      DB_HOST: db\n    depends_on:\n      db:\n        condition: service_healthy\n  db:\n    image: postgres:16\n    environment:\n      POSTGRES_PASSWORD: ${DB_PASSWORD}\n    volumes:\n      - pgdata:/var/lib/postgresql/data\n    healthcheck:\n      test: [\"CMD-SHELL\", \"pg_isready -U postgres\"]\n      interval: 5s\n      retries: 5\n\nvolumes:\n  pgdata:</pre><p>Внутри сети compose сервисы обращаются друг к другу <b>по имени сервиса</b>: приложение ходит на хост <code>db</code>, а не на IP. IP-адреса меняются при пересоздании, имена — нет.</p>"},
 {h:"depends_on обманчив",b:"<p><code>depends_on</code> в простой форме ждёт только <b>запуска</b> контейнера, а не готовности сервиса принимать соединения. База стартует 5–10 секунд, приложение подключается сразу и падает.</p><p>Правильно: <code>healthcheck</code> у зависимости плюс <code>condition: service_healthy</code>. И <b>всё равно</b> — ретраи подключения в самом приложении: в Kubernetes порядок запуска вообще не гарантирован.</p>"},
 {h:"Команды compose",b:"<pre>docker compose up -d          <span class='c'># поднять в фоне</span>\ndocker compose ps\ndocker compose logs -f web\ndocker compose exec web sh\ndocker compose build --no-cache\ndocker compose down           <span class='c'># без -v, чтобы сохранить тома</span></pre><p>Переменные берутся из файла <code>.env</code> рядом с compose-файлом — так пароли не попадают в git вместе с конфигурацией.</p>"},
 {h:"Реестр образов",b:"<pre>docker login registry.company.ru\ndocker tag app:local registry.company.ru/team/app:1a2b3c4\ndocker push registry.company.ru/team/app:1a2b3c4</pre><p>Имя образа — это адрес: <code>[реестр]/[пространство]/[имя]:[тег]</code>. Без указания реестра подразумевается Docker Hub.</p><p>Тег по хешу коммита даёт однозначную связь «контейнер ↔ код». <code>latest</code> такой связи не даёт и делает откат гаданием.</p>"}],
 ch:[
 {t:"c",d:1,q:"Подними весь стек из docker-compose.yml в фоне.",ans:["docker compose up -d","docker-compose up -d","docker compose up --detach"],hint:"compose up + флаг фона",why:"Без -d логи повиснут в терминале, а Ctrl+C остановит стек."},
 {t:"q",d:2,q:"Как контейнер web обращается к базе в том же compose-файле?",a:["По IP-адресу контейнера","По имени сервиса: <code>db:5432</code>","Через localhost","Через IP хоста"],c:1,why:"Встроенный DNS пользовательской сети резолвит имена сервисов. IP меняются при пересоздании — хардкодить их нельзя."},
 {t:"q",d:3,q:"Два контейнера запущены через <code>docker run</code> без указания сети. Один не может обратиться к другому по имени. Почему?",a:["Нужно открыть порты","В дефолтной bridge-сети DNS по именам не работает — нужна пользовательская сеть (docker network create)","Контейнеры на разных хостах","Не хватает прав"],c:1,why:"Именно поэтому compose всегда создаёт свою сеть: в ней разрешение имён работает из коробки."},
 {t:"q",d:3,q:"Как правильно передать пароль БД в контейнер на проде?",a:["ENV в Dockerfile","Захардкодить в образ","Через секреты оркестратора или внешний менеджер, подставляя в рантайме","В имя контейнера"],c:2,why:"ENV в Dockerfile попадает в слои образа и виден через docker history любому, кто скачал образ. Секреты живут только в рантайме."},
 {t:"q",d:4,q:"Приложение падает при старте стека: «connection refused» к базе, хотя в compose есть <code>depends_on: [db]</code>. Что не так?",a:["Опечатка в имени сервиса","depends_on ждёт только запуска контейнера, а не готовности БД принимать соединения — нужен healthcheck с condition: service_healthy и ретраи в приложении","Не хватает памяти","Неверный порт"],c:1,why:"Ретраи в приложении обязательны в любом случае: в Kubernetes порядок запуска не гарантирован вовсе, и полагаться на него нельзя."},
 {t:"q",d:5,q:"<b>Инцидент.</b> После обновления стека приложение не видит базу: в логах «getaddrinfo ENOTFOUND db-1». В compose сервис называется <code>db</code>, но кто-то прописал в конфиге приложения имя контейнера <code>db-1</code>. Что происходит и как правильно?",a:["Нужно переименовать контейнер","Обращаться надо по имени сервиса (db), а не по имени контейнера: имена контейнеров содержат префикс проекта и номер реплики и меняются","Проблема с DNS хоста","Нужно указать IP-адрес"],c:1,why:"Имя сервиса — стабильный сетевой псевдоним, имя контейнера — производное от проекта и масштабирования. Тот же принцип в Kubernetes: обращаются к Service, а не к поду."}]},

{id:"d5",t:"Продакшен-качество образа",goal:"Сделать образ, который не стыдно выкатить",
 cards:[
 {h:"HEALTHCHECK",b:"<pre>HEALTHCHECK --interval=30s --timeout=3s --start-period=20s --retries=3 \\\n  CMD curl -fsS http://localhost:3000/health || exit 1</pre><p><b>Running ≠ healthy.</b> Процесс запущен — не значит, что приложение прогрелось, подключилось к БД и готово принимать трафик.</p><p><code>--start-period</code> даёт время на старт, не считая неудачи за отказ. Оркестратор использует статус, чтобы не слать трафик в неготовый контейнер и перезапускать зависшие.</p>"},
 {h:"Непривилегированный пользователь",b:"<pre>RUN addgroup -g 1000 app &amp;&amp; adduser -u 1000 -G app -D app\nUSER app</pre><p>Процесс от root внутри контейнера — это root в пространстве имён хоста при многих конфигурациях. Ошибка в приложении превращается в компрометацию узла.</p><p>Дополнительно на запуске: <code>--read-only</code> файловая система, <code>--cap-drop ALL</code>, <code>--security-opt no-new-privileges</code>. Для временных файлов монтируют tmpfs.</p>"},
 {h:"Сигналы и корректная остановка",b:"<p>При <code>docker stop</code> контейнер получает SIGTERM и 10 секунд на завершение, потом SIGKILL. Приложение должно за это время: перестать принимать новые запросы, доработать текущие, закрыть соединения с БД.</p><p>Если процесс не является PID 1 или не обрабатывает сигналы, каждый деплой обрывает запросы пользователей. Лечится exec-формой CMD, обработчиком SIGTERM в коде и флагом <code>--init</code> для процессов, не умеющих в сигналы.</p>"},
 {h:"Размер, кэш и сборка",b:"<pre>DOCKER_BUILDKIT=1 docker build \\\n  --cache-from registry/app:cache -t registry/app:$SHA .\n\ndocker buildx build --platform linux/amd64,linux/arm64 .</pre><ul><li><code>--cache-from</code> переиспользует слои из реестра — ускоряет сборку в CI, где кэша нет</li><li>multi-arch нужен, если ноутбук на ARM, а сервер на x86: иначе «exec format error»</li><li><code>trivy image registry/app:tag</code> — проверка на известные уязвимости</li></ul>"},
 {h:"Чек-лист образа для прода",b:"<ul><li>минимальная база (alpine, slim или distroless), зафиксированная версия — не <code>latest</code></li><li>multi-stage: в рантайме нет компилятора и исходников</li><li>кэш слоёв: зависимости отдельно от кода</li><li><code>.dockerignore</code> с <code>.git</code>, <code>node_modules</code>, <code>.env</code></li><li><code>USER</code> не root</li><li>exec-форма CMD и обработка SIGTERM</li><li>HEALTHCHECK</li><li>логи в stdout/stderr, не в файл</li><li>образ помечен хешем коммита</li></ul>"}],
 ch:[
 {t:"q",d:1,q:"Куда контейнеризованное приложение должно писать логи?",a:["В файл внутри контейнера","В stdout и stderr","В базу данных","В syslog хоста"],c:1,why:"Их подхватывает драйвер логов и отправляет в систему сбора. Файлы внутри контейнера теряются при пересоздании и раздувают слой."},
 {t:"q",d:2,q:"Контейнер в состоянии Up, но пользователи получают ошибки сразу после деплоя. Чего не хватает?",a:["Больше реплик","HEALTHCHECK и проверки готовности — трафик пошёл в ещё не прогретое приложение","Больше памяти","Тома для данных"],c:1,why:"Между «процесс стартовал» и «приложение готово» проходят секунды, а с прогревом кэша — минуты."},
 {t:"q",d:3,q:"Чем плохо, что процесс в контейнере работает от root?",a:["Ничем, контейнер изолирован","При неверной конфигурации или уязвимости это даёт путь к правам root на хосте — базовая практика требует USER не root","Работает медленнее","Образ становится больше"],c:1,why:"Дополняется read-only файловой системой, drop capabilities и no-new-privileges. В Kubernetes это же выражается через securityContext."},
 {t:"q",d:4,q:"Приложение не завершается корректно при <code>docker stop</code>: запросы обрываются. Причина?",a:["Мало памяти","Процесс не обрабатывает SIGTERM или запущен через shell-форму CMD и не является PID 1","Нет healthcheck","Не открыт порт"],c:1,why:"Exec-форма CMD плюс обработчик SIGTERM в коде дают graceful shutdown. Без этого каждый деплой стоит пользователям оборванных запросов."},
 {t:"q",d:4,q:"Образ собран на MacBook с процессором ARM, на сервере не запускается: «exec format error». Что сделать?",a:["Пересобрать на сервере","Собирать multi-arch через <code>docker buildx --platform linux/amd64,linux/arm64</code> или явно указать целевую платформу","Обновить docker","Сменить базовый образ"],c:1,why:"Архитектура образа должна совпадать с архитектурой хоста. В CI это обычно решается сборкой на amd64-раннере или buildx."},
 {t:"q",d:5,q:"<b>Инцидент.</b> Тебе прислали на ревью образ: 1.8 ГБ, <code>FROM node:20</code>, <code>COPY . .</code> первой строкой, запуск от root, <code>CMD npm start</code>, логи пишутся в <code>/app/logs/app.log</code>. Какие замечания дать по убыванию важности?",a:["Только размер образа","1) root и отсутствие USER — риск безопасности; 2) COPY . . без .dockerignore тянет .git и .env в образ; 3) сломан кэш слоёв; 4) shell-форма CMD ломает graceful shutdown; 5) логи в файл вместо stdout; 6) тяжёлая база вместо alpine/multi-stage","Заменить node:20 на node:18","Добавить EXPOSE"],c:1,why:"Порядок замечаний важен: сначала безопасность и утечка секретов, потом корректность работы, и только потом размер. Такой разбор и есть содержание ревью Dockerfile на собеседовании."}]},

{id:"d6",t:"Отладка контейнеров",goal:"Понять, почему не работает, не переустанавливая всё",
 cards:[
 {h:"Порядок диагностики",b:"<ol><li><code>docker ps -a</code> — какое состояние и код выхода</li><li><code>docker logs имя</code> — что сказало приложение перед смертью</li><li><code>docker inspect имя</code> — конфигурация: образ, переменные, лимиты, монтирования</li><li><code>docker exec -it имя sh</code> — заглянуть внутрь живого контейнера</li><li><code>docker stats</code> — потребление ресурсов</li></ol><p>Первые два шага закрывают большинство случаев. Пересоздавать контейнер до чтения логов — потерять улики.</p>"},
 {h:"Коды выхода",b:"<div class='tw'><table><tr><th>код</th><th>причина</th></tr><tr><td>0</td><td>штатное завершение (для сервиса — подозрительно)</td></tr><tr><td>1</td><td>приложение упало само</td></tr><tr><td>125</td><td>ошибка самого docker (неверный флаг)</td></tr><tr><td>126</td><td>команда найдена, но не исполняемая</td></tr><tr><td>127</td><td>команда не найдена (опечатка, нет бинарника в образе)</td></tr><tr><td>137</td><td>SIGKILL: чаще всего OOM — превышен лимит памяти</td></tr><tr><td>143</td><td>SIGTERM: штатная остановка</td></tr></table></div><p><b>137</b> и <b>127</b> — два кода, которые экономят больше всего времени.</p>"},
 {h:"Когда внутри нет ни shell, ни утилит",b:"<p>В distroless и scratch-образах нет <code>sh</code>, <code>curl</code> и <code>ps</code> — это плюс для безопасности и минус для отладки.</p><pre>docker run --rm -it --network container:web nicolaka/netshoot</pre><p>Запускается отладочный контейнер <b>в сетевом пространстве</b> целевого: внутри доступны curl, dig, tcpdump, ss — и они видят сеть ровно так, как её видит проблемный контейнер. Тот же приём в Kubernetes называется ephemeral containers (<code>kubectl debug</code>).</p>"},
 {h:"Ресурсы и лимиты",b:"<pre>docker run -m 512m --cpus 1.5 app\ndocker stats\ndocker inspect app --format '{{.State.OOMKilled}}'</pre><p>Превышение лимита <b>памяти</b> = мгновенное убийство (137). Превышение лимита <b>CPU</b> = троттлинг: приложение работает, но медленно.</p><p>Отсюда практическое правило: CPU-лимиты ставят щедро или не ставят вовсе, а лимит памяти — обязательно и с запасом, чтобы один контейнер не съел весь хост.</p>"}],
 ch:[
 {t:"c",d:1,q:"Посмотри логи контейнера api в реальном времени.",ans:["docker logs -f api","docker logs --follow api","docker logs -f --tail 100 api"],hint:"logs + follow",why:"--tail ограничивает начальный объём: docker logs -f --tail 100 удобнее на контейнере, работающем неделю."},
 {t:"q",d:2,q:"Контейнер завершился с кодом 137. Что это значит?",a:["Ошибка в команде запуска","Процесс убит SIGKILL — почти всегда превышен лимит памяти (OOM)","Нет такого файла","Штатная остановка"],c:1,why:"137 = 128 + 9. Проверяется через docker inspect: поле OOMKilled. Лечится увеличением лимита или устранением утечки."},
 {t:"q",d:3,q:"Контейнер падает с кодом 127. Куда смотреть?",a:["На лимиты памяти","Команда не найдена: опечатка в CMD/ENTRYPOINT или бинарника нет в финальном образе","На сеть","На тома"],c:1,why:"Частый случай при multi-stage: забыли скопировать бинарник в финальный stage. 126 рядом — файл есть, но не исполняемый."},
 {t:"q",d:3,q:"Нужно проверить, какие переменные окружения и монтирования у работающего контейнера. Чем?",a:["docker logs","docker inspect имя","docker stats","docker history"],c:1,why:"inspect отдаёт полную конфигурацию в JSON: образ, env, лимиты, mounts, состояние. Формат вывода можно сузить через --format."},
 {t:"q",d:4,q:"Образ собран на базе distroless: внутри нет shell, <code>docker exec -it sh</code> не работает. Как отлаживать сеть контейнера?",a:["Пересобрать образ с shell и выкатить на прод","Запустить отладочный контейнер в сетевом пространстве целевого: <code>docker run --rm -it --network container:web nicolaka/netshoot</code>","Отладить локально и надеяться","Добавить curl в образ навсегда"],c:1,why:"Класть отладочные утилиты в прод-образ — значит расширять поверхность атаки. В Kubernetes аналог — kubectl debug с ephemeral-контейнером."},
 {t:"q",d:5,q:"<b>Инцидент.</b> Контейнер <code>web</code> в бесконечном цикле перезапусков. <code>docker ps -a</code> показывает «Restarting (1)», <code>docker logs web</code> — «connect ECONNREFUSED db:5432». Контейнер <code>db</code> в состоянии «Exited (137)». Порядок действий?",a:["Перезапустить web ещё раз","Разбираться с db: код 137 — OOM, значит поднять лимит памяти или починить потребление; затем поднять db и только потом web; в приложении добавить ретраи подключения","Удалить оба контейнера и создать заново","Увеличить число реплик web"],c:1,why:"Симптом у web, причина у db. Правило: идти по цепочке зависимостей вниз и лечить корень. Ретраи в приложении превращают такую ситуацию из падения в задержку старта."}]}
);

{id:"c1",t:"Зачем нужен конвейер",goal:"Понимать смысл, а не только синтаксис YAML",
 cards:[
 {h:"CI, Delivery, Deployment",b:"<div class='tw'><table><tr><th>термин</th><th>что означает</th></tr><tr><td><b>CI</b> — непрерывная интеграция</td><td>каждый push автоматически собирается и проходит тесты; поломка видна за минуты, а не за неделю</td></tr><tr><td><b>Continuous Delivery</b></td><td>артефакт всегда готов к выкатке, но кнопку жмёт человек</td></tr><tr><td><b>Continuous Deployment</b></td><td>зелёный пайплайн едет на прод сам</td></tr></table></div><p>Разницу между двумя CD спрашивают почти на каждом собеседовании — она в наличии ручного гейта.</p>"},
 {h:"Типовой конвейер",b:"<pre>lint → test → build → scan → publish → deploy(staging) → deploy(prod)</pre><p>Три принципа, определяющие порядок:</p><ul><li><b>Быстрая обратная связь.</b> Дешёвые проверки первыми: линтер за 8 секунд отсекает то, ради чего не стоит собирать образ.</li><li><b>Fail fast.</b> Упало — останавливаемся, а не идём дальше «на всякий случай».</li><li><b>Build once, deploy everywhere.</b> Артефакт собирается <b>один раз</b> и продвигается по средам. Отличается только конфигурация.</li></ul>"},
 {h:"Почему нельзя пересобирать под каждую среду",b:"<p>Если образ для staging и prod собираются отдельно, это <b>два разных артефакта</b>: другая версия зависимости, другой порядок сборки, другой базовый слой, обновившийся за час.</p><p>Тестировали одно — выкатили другое. Гарантия «протестировано» исчезает, а фраза «на стейдже работало» становится постоянной.</p><p>Практика: собрали <code>app:1a2b3c4</code>, прогнали тесты, выкатили <b>этот же</b> образ на staging, затем <b>этот же</b> на prod.</p>"},
 {h:"Из чего состоит пайплайн",b:"<ul><li><b>Триггер</b> — что запускает: push, PR, тег, расписание, ручной запуск</li><li><b>Раннер (agent)</b> — машина или контейнер, где выполняются шаги</li><li><b>Стадии и job'ы</b> — job'ы одной стадии обычно идут параллельно</li><li><b>Артефакты</b> — то, что передаётся дальше или сохраняется для человека</li><li><b>Секреты</b> — токены и ключи, доступные шагам, но не видимые в логах</li></ul><p>Шаг считается упавшим по <b>ненулевому коду возврата</b> — тому самому <code>$?</code> из bash. Вся автоматизация держится на этом соглашении.</p>"}],
 ch:[
 {t:"o",d:1,q:"Расставь стадии типового пайплайна в разумном порядке.",items:["lint — статический анализ","test — автотесты","build — сборка образа","scan — проверка уязвимостей","deploy на staging","deploy на production"],why:"Дешёвое и быстрое — раньше. Нет смысла собирать образ, если код не проходит линтер."},
 {t:"q",d:2,q:"В чём разница между Continuous Delivery и Continuous Deployment?",a:["Ни в чём","Delivery — артефакт готов к выкатке, деплой запускает человек; Deployment — выкатывается автоматически","Delivery только для фронтенда","Deployment дешевле"],c:1,why:"Точный ответ на этот вопрос сразу отличает подготовленного кандидата от заучившего термины."},
 {t:"q",d:3,q:"Как CI понимает, что шаг упал?",a:["По тексту в логах","По ненулевому коду возврата команды","По времени выполнения","По наличию файлов"],c:1,why:"Отсюда практическое следствие: команда, которая молча возвращает 0 при ошибке (например, пайп без pipefail), делает шаг зелёным при реальном провале."},
 {t:"q",d:4,q:"Почему образ нельзя пересобирать отдельно для staging и prod?",a:["Долго и дорого","Это разные артефакты: тестировали один, выкатили другой — гарантия тестирования теряется","Не позволяет реестр","Ломается кэш"],c:1,why:"Build once, deploy everywhere. Между средами меняется только конфигурация, передаваемая переменными окружения."},
 {t:"q",d:4,q:"Команда предлагает убрать тесты из пайплайна, потому что «они долгие и мешают релизить». Что ответить?",a:["Согласиться, скорость важнее","Предложить ускорить: кэш зависимостей, параллельные job'ы, разделение на быстрые и медленные наборы — убирать проверку ради скорости значит терять то, ради чего строился CI","Запустить тесты только ночью","Оставить только линтер"],c:1,why:"Медленный пайплайн — техническая проблема с техническим решением. Отключённые тесты возвращаются инцидентами на проде."},
 {t:"q",d:5,q:"<b>Инцидент.</b> Тест падает только в CI, локально всё зелёное. Разработчик третий раз нажимает «перезапустить», и на четвёртый прогон становится зелёным. Что происходит и что делать?",a:["CI нестабилен, надо просто перезапускать","Это flaky-тест: зависимость от порядка выполнения, времени, сети или общего состояния — его нужно найти и починить, а не перезапускать","Проблема в раннере, сменить его","Отключить этот тест"],c:1,why:"Привычка «перезапустить и надеяться» разрушает доверие к пайплайну: когда красный не означает поломку, настоящую поломку тоже пропустят."}]},

{id:"c2",t:"GitHub Actions",goal:"Написать рабочий workflow руками",
 cards:[
 {h:"Структура файла",b:"<pre>name: ci\non:\n  push:\n    branches: [main]\n  pull_request:\n\njobs:\n  test:\n    runs-on: ubuntu-latest\n    steps:\n      - uses: actions/checkout@v4\n      - uses: actions/setup-node@v4\n        with:\n          node-version: '20'\n          cache: 'npm'\n      - run: npm ci\n      - run: npm test</pre><p>Иерархия: <b>workflow</b> → <b>jobs</b> (по умолчанию параллельны, каждый на своей чистой машине) → <b>steps</b> (последовательны, в общей файловой системе).</p><p>Файлы лежат в <code>.github/workflows/</code>. Каждый job начинается с чистого раннера — поэтому <code>checkout</code> нужен в каждом.</p>"},
 {h:"Зависимости между job'ами",b:"<pre>jobs:\n  test:\n    runs-on: ubuntu-latest\n    steps: [...]\n  build:\n    needs: test\n    runs-on: ubuntu-latest\n    steps: [...]\n  deploy:\n    needs: [test, build]\n    if: github.ref == 'refs/heads/main'\n    environment: production</pre><p><code>needs</code> строит граф выполнения. Без него job'ы стартуют одновременно, и деплой может уехать раньше тестов.</p><p><code>if</code> ограничивает условия запуска, <code>environment</code> подключает защищённое окружение с ручным подтверждением и своими секретами.</p>"},
 {h:"Секреты",b:"<pre>      - run: docker login -u ci -p \"$TOKEN\" registry.company.ru\n        env:\n          TOKEN: ${{ secrets.REGISTRY_TOKEN }}</pre><ul><li>секреты хранятся в настройках репозитория или организации</li><li>в логах маскируются автоматически</li><li>не доступны в workflow, запущенных из форков — защита от кражи через PR</li></ul><p><b>Лучшая практика вместо статических ключей:</b> OIDC-федерация. Пайплайн получает короткоживущий токен облака под свою идентичность — красть нечего, срок жизни минуты.</p>"},
 {h:"Матрица и кэш",b:"<pre>strategy:\n  fail-fast: false\n  matrix:\n    node: [18, 20, 22]\n\nsteps:\n  - uses: actions/cache@v4\n    with:\n      path: ~/.npm\n      key: npm-${{ hashFiles('**/package-lock.json') }}</pre><p>Матрица превращает один job в несколько параллельных — проверка совместимости без роста времени.</p><p><b>Ключ кэша обязан зависеть от lock-файла.</b> Иначе получишь протухший кэш и невоспроизводимые сборки, которые невозможно объяснить.</p>"}],
 ch:[
 {t:"f",d:1,q:"Допиши ключ, задающий, на каком раннере выполняется job.",pre:"jobs:\n  build:\n    ___: ubuntu-latest\n    steps:\n      - uses: actions/checkout@v4",ans:["runs-on"],hint:"runs-...",why:"runs-on выбирает раннер: ubuntu-latest, self-hosted или лейбл своей группы."},
 {t:"q",d:2,q:"Job deploy должен запускаться только после успешного test. Какой ключ?",a:["after","needs: test","depends","waitFor"],c:1,why:"needs строит граф. Без него job'ы стартуют параллельно, и деплой может обогнать тесты."},
 {t:"q",d:3,q:"Почему в каждом job'е нужен <code>actions/checkout</code>, даже если предыдущий job уже клонировал код?",a:["Это перестраховка","Каждый job выполняется на отдельной чистой машине — файлы предыдущего job'а недоступны","checkout кэширует репозиторий","Так требует GitHub"],c:1,why:"Отсюда и роль артефактов: передать файлы между job'ами можно только через upload/download artifact или реестр."},
 {t:"q",d:3,q:"Что должно входить в ключ кэша зависимостей?",a:["Дата","Хеш lock-файла","Всегда имя ветки","Ничего, ключ может быть постоянным"],c:1,why:"Изменился lock — новый кэш; не изменился — мгновенное восстановление. Постоянный ключ рано или поздно даст протухшие зависимости."},
 {t:"q",d:4,q:"Как пайплайну получить доступ к облаку без вечных ключей в секретах?",a:["Класть ключ в секреты и менять раз в год","OIDC-федерация: пайплайн обменивает свою идентичность на короткоживущий токен","Хранить ключ в приватном репозитории","Использовать переменные окружения раннера"],c:1,why:"Статический ключ утекает один раз и живёт вечно. Короткоживущий токен, привязанный к конкретному репозиторию и ветке, обесценивает саму кражу."},
 {t:"q",d:5,q:"<b>Инцидент.</b> Внешний контрибьютор открыл PR, workflow запустился и упал на шаге деплоя с ошибкой доступа. Коллега предлагает «выдать секреты и для форков, чтобы не падало». Что ответить?",a:["Согласиться, так удобнее","Это дыра: любой сможет прислать PR, который распечатает секреты; правильно — не запускать деплой на PR из форков и разделить workflow на проверку и выкатку","Запретить внешние PR","Хранить секреты в коде репозитория"],c:1,why:"Ограничение секретов для форков — намеренная защита. Пайплайн для PR должен только проверять, а деплоить — отдельный workflow по push в main или по тегу."}]},

{id:"c3",t:"GitLab CI",goal:"Читать и писать пайплайны второго распространённого формата",
 cards:[
 {h:"gitlab-ci.yml",b:"<pre>stages: [test, build, deploy]\n\nvariables:\n  IMAGE: $CI_REGISTRY_IMAGE:$CI_COMMIT_SHA\n\ntest:\n  stage: test\n  image: node:20-alpine\n  script:\n    - npm ci\n    - npm test\n  cache:\n    key:\n      files: [package-lock.json]\n    paths: [node_modules/]\n\ndeploy:prod:\n  stage: deploy\n  script: ./deploy.sh\n  when: manual\n  only: [tags]</pre><p>Отличие от Actions: стадии объявляются явно в <code>stages</code>, а каждый job указывает свою через <code>stage</code>.</p>"},
 {h:"rules — управление запуском",b:"<pre>deploy:prod:\n  rules:\n    - if: '$CI_COMMIT_TAG =~ /^v/'\n      when: manual\n    - if: '$CI_COMMIT_BRANCH == \"main\"'\n      when: on_success\n    - when: never</pre><p><code>rules</code> проверяются сверху вниз, срабатывает первое совпадение. Финальное <code>when: never</code> — явный запрет во всех остальных случаях: без него легко получить деплой из случайной ветки.</p><p><code>rules: changes:</code> запускает job только если менялись определённые файлы — экономит время в монорепозитории.</p>"},
 {h:"needs против dependencies",b:"<div class='tw'><table><tr><th>ключ</th><th>про что</th></tr><tr><td><code>needs</code></td><td>порядок выполнения: job стартует, не дожидаясь всей предыдущей стадии (DAG)</td></tr><tr><td><code>dependencies</code></td><td>какие артефакты скачать из предыдущих job'ов</td></tr></table></div><p>Их постоянно путают. <code>needs</code> ускоряет пайплайн, превращая лестницу в граф; <code>dependencies</code> экономит трафик, не скачивая лишние артефакты.</p>"},
 {h:"Раннеры и исполнители",b:"<ul><li><b>shared</b> — общие раннеры провайдера, быстрый старт</li><li><b>self-hosted</b> — свои: нужны для доступа во внутреннюю сеть, особого железа и контроля над данными</li></ul><p>Исполнители: <b>shell</b> (просто, но состояние накапливается между запусками — источник загадочных багов), <b>docker</b> (чистое окружение каждый раз, рекомендуется), <b>kubernetes</b> (масштабируется сам).</p><p>Свой раннер — это сервер, который ты патчишь, изолируешь и мониторишь. Особенно осторожно с privileged-режимом.</p>"},
 {h:"Шаблоны и переиспользование",b:"<pre>include:\n  - project: 'devops/ci-templates'\n    file: '/docker.yml'\n\n.build-base:\n  stage: build\n  image: docker:24\n\nbuild:app:\n  extends: .build-base\n  variables: { IMAGE_NAME: app }</pre><p>Job'ы, начинающиеся с точки, — скрытые: сами не выполняются, служат основой для <code>extends</code>.</p><p>Централизованные шаблоны — способ привести к одному стандарту десятки репозиториев одной правкой.</p>"}],
 ch:[
 {t:"q",d:1,q:"Что делает <code>when: manual</code> у job'а?",a:["Запускает автоматически","Job ждёт нажатия кнопки человеком","Отключает job","Запускает по расписанию"],c:1,why:"Ручной гейт — это и есть отличие Continuous Delivery от Deployment. Плюс защищённые окружения ограничивают, кто вправе нажать."},
 {t:"q",d:2,q:"Чем <code>needs</code> отличается от <code>dependencies</code>?",a:["Ничем","needs задаёт порядок выполнения и позволяет стартовать раньше; dependencies указывает, какие артефакты скачать","needs только для деплоя","dependencies работает быстрее"],c:1,why:"Частый вопрос на собеседовании по GitLab CI: путаница выдаёт поверхностное знакомство."},
 {t:"q",d:3,q:"Зачем в конце списка <code>rules</code> писать <code>- when: never</code>?",a:["Для читаемости","Явно запретить запуск во всех неперечисленных случаях — иначе job может сработать там, где не ждали","Ускоряет пайплайн","Обязательно синтаксически"],c:1,why:"Безопасность по умолчанию: белый список правил и явный запрет всего остального. Особенно важно для job'ов деплоя."},
 {t:"q",d:3,q:"Почему shell-исполнитель раннера считается менее надёжным, чем docker?",a:["Он медленнее","Состояние накапливается между запусками: остатки предыдущих сборок влияют на следующие и дают невоспроизводимые результаты","Он не поддерживает кэш","Требует больше памяти"],c:1,why:"Docker-исполнитель даёт чистое окружение на каждый прогон — воспроизводимость перевешивает небольшой оверхед."},
 {t:"q",d:4,q:"Один и тот же блок сборки скопирован в 12 репозиториев. Как навести порядок?",a:["Оставить как есть, так проще","Вынести в общий репозиторий шаблонов и подключать через include/extends","Написать скрипт копирования","Объединить всё в монорепо"],c:1,why:"Одна правка обновляет все проекты. Плюс единый стандарт качества: сканирование, кэш и теги настроены одинаково везде."},
 {t:"q",d:5,q:"<b>Инцидент.</b> Job деплоя на прод неожиданно запустился из ветки разработчика и выкатил незаконченный код. В конфиге было <code>only: [main]</code>, но кто-то заменил его на <code>rules</code> с одним условием и без <code>when: never</code>. Что произошло и как защититься?",a:["Ошибка GitLab","Правила без финального запрета оставили поведение по умолчанию, и job сработал вне ожидаемых условий; защита — явный when: never, защищённое окружение с ручным подтверждением и деплой только по тегу","Нужно было использовать only","Виноват разработчик, достаточно выговора"],c:1,why:"Технические ограничения надёжнее договорённостей: три независимых барьера (правила, окружение с апрувом, триггер по тегу) не отключаются случайной правкой одной строки."}]},

{id:"c4",t:"Артефакты, кэш и скорость",goal:"Сделать пайплайн быстрым и воспроизводимым",
 cards:[
 {h:"Артефакт — не кэш",b:"<div class='tw'><table><tr><th></th><th>артефакт</th><th>кэш</th></tr><tr><td>смысл</td><td>результат работы</td><td>ускоритель</td></tr><tr><td>потеря</td><td>критична</td><td>безболезненна</td></tr><tr><td>примеры</td><td>собранный бинарь, отчёт о тестах, coverage</td><td>node_modules, ~/.m2, слои сборки</td></tr></table></div><p>Путать их опасно: артефакт, положенный в кэш, однажды исчезнет ровно в тот момент, когда понадобится для расследования.</p>"},
 {h:"Отчёты в интерфейсе",b:"<pre>artifacts:\n  when: always\n  reports:\n    junit: report.xml\n    coverage_report:\n      coverage_format: cobertura\n      path: coverage.xml</pre><p><code>when: always</code> важен: отчёт нужен именно тогда, когда job упал.</p><p>Упавшие тесты и изменение покрытия показываются прямо в merge request — ревьюер видит результат, не открывая логи. Туда же встают отчёты сканеров безопасности.</p>"},
 {h:"Чем ускоряют пайплайн",b:"<p>По убыванию эффекта:</p><ol><li><b>Кэш зависимостей</b> — обычно самая долгая стадия</li><li><b>Параллельные job'ы и матрицы</b> вместо последовательной лестницы</li><li><b>Разделение тестов</b> на быстрые (на каждый push) и медленные (перед мержем или ночью)</li><li><b>Сборка только изменённых сервисов</b> в монорепозитории (<code>rules: changes</code>)</li><li><b>Кэш слоёв образа</b> через <code>--cache-from</code></li></ol><p>Начинать надо с измерения: смотри длительность каждой стадии, а не улучшай наугад.</p>"},
 {h:"Сборка образов внутри CI",b:"<div class='tw'><table><tr><th>способ</th><th>цена</th></tr><tr><td>проброс <code>/var/run/docker.sock</code></td><td>просто, но даёт раннеру фактический root на хосте — недопустимо на общих раннерах</td></tr><tr><td>DinD (docker:dind)</td><td>изолированнее, но требует privileged и теряет кэш</td></tr><tr><td>kaniko / buildah</td><td>без демона и привилегий — рекомендуемый вариант в Kubernetes</td></tr></table></div><pre>build:\n  image: gcr.io/kaniko-project/executor:debug\n  script:\n    - /kaniko/executor --context $CI_PROJECT_DIR\n        --destination $CI_REGISTRY_IMAGE:$CI_COMMIT_SHA</pre>"}],
 ch:[
 {t:"q",d:1,q:"Отчёт о тестах нужно скачать после падения пайплайна. Куда его класть?",a:["В кэш","В артефакты с when: always","В логи","В git"],c:1,why:"Кэш эфемерен и общий; артефакты привязаны к конкретному прогону. Без when: always отчёт не сохранится именно при падении."},
 {t:"q",d:2,q:"Пайплайн занимает 25 минут. С чего начать оптимизацию?",a:["Купить более мощный раннер","Измерить длительность стадий, затем кэшировать зависимости и распараллелить независимые job'ы","Убрать линтер","Деплоить реже"],c:1,why:"Оптимизация без измерения — угадывание. Обычно львиную долю съедает установка зависимостей и последовательные тесты."},
 {t:"q",d:3,q:"Почему проброс docker.sock в раннер — плохая идея на общих раннерах?",a:["Медленно работает","Доступ к сокету равен правам root на хосте: чужой пайплайн может захватить машину раннера","Не поддерживается новыми версиями","Требует лицензии"],c:1,why:"Поэтому в Kubernetes-раннерах собирают через kaniko или buildah — без демона и без привилегированного режима."},
 {t:"q",d:3,q:"Что даёт публикация junit-отчёта в артефактах?",a:["Ускоряет тесты","Показывает упавшие тесты прямо в merge request, где принимается решение о слиянии","Хранит логи навсегда","Запускает тесты повторно"],c:1,why:"Обратная связь там, где она нужна. Логи открывают, только когда отчёта недостаточно."},
 {t:"q",d:4,q:"В монорепозитории из 20 сервисов пайплайн собирает все при любом изменении. Что сделать?",a:["Разделить на 20 репозиториев","Запускать job'ы по условию изменений (rules: changes) и кэшировать общее — собирать только затронутые сервисы","Собирать раз в день","Увеличить число раннеров"],c:1,why:"Разделение репозиториев — большое организационное решение с своей ценой. Условные запуски дают основной выигрыш почти бесплатно."},
 {t:"q",d:5,q:"<b>Инцидент.</b> Сборка стала «случайно» падать на разных проектах: то не находится модуль, то версия библиотеки не та. Кэш настроен с постоянным ключом <code>cache-node</code>. Что произошло?",a:["Проблемы с сетью","Протухший кэш: ключ не зависит от lock-файла, поэтому в кэше лежат зависимости от старой версии и смешиваются с новыми","Раннер перегружен","Ошибка в реестре пакетов"],c:1,why:"Ключ обязан зависеть от хеша lock-файла. Симптом «непонятные плавающие ошибки сборки» почти всегда указывает на кэш или на нечистое окружение раннера."}]},

{id:"c5",t:"Стратегии деплоя и откат",goal:"Выкатываться без даунтайма и уметь отступить",
 cards:[
 {h:"Четыре стратегии",b:"<div class='tw'><table><tr><th>стратегия</th><th>как работает</th><th>цена</th></tr><tr><td><b>Recreate</b></td><td>погасить старое, поднять новое</td><td>простой даунтайм</td></tr><tr><td><b>Rolling</b></td><td>заменять по одному экземпляру</td><td>одновременно живут две версии</td></tr><tr><td><b>Blue-Green</b></td><td>две среды, мгновенное переключение трафика</td><td>двойные ресурсы</td></tr><tr><td><b>Canary</b></td><td>5% трафика на новую версию, наблюдаем метрики</td><td>сложность маршрутизации</td></tr></table></div><p>Rolling — умолчание в Kubernetes. Canary — выбор для рискованных изменений: реальный трафик проверяет то, что не проверят тесты.</p>"},
 {h:"Две версии одновременно",b:"<p>При rolling и canary старая и новая версии работают <b>параллельно</b>. Значит, изменения должны быть обратно совместимы:</p><ul><li>API не удаляет и не переименовывает поля в том же релизе</li><li>очереди понимают оба формата сообщений</li><li>схема БД совместима с обеими версиями кода</li></ul><p>Игнорирование этого правила даёт ошибки ровно у части пользователей — тех, кто попал на другую версию.</p>"},
 {h:"Миграции БД: expand → migrate → contract",b:"<ol><li><b>Expand.</b> Добавили новую колонку, код пишет в обе.</li><li><b>Migrate.</b> Перенесли данные, код читает из новой.</li><li><b>Contract.</b> Через релиз-другой удалили старую колонку.</li></ol><p><b>Никогда не удаляй колонку в том же релизе, что и код.</b> Иначе откат кода станет невозможен: данных уже нет.</p><p>Правило простое: код должен работать и со старой, и с новой схемой в момент выкатки.</p>"},
 {h:"Откат — часть плана",b:"<p>Если ты не знаешь, как откатить релиз, ты не готов его катить.</p><ul><li>образы помечены неизменяемым тегом (хеш коммита), не <code>latest</code></li><li>откат — одна команда или одна кнопка, отрепетированная заранее</li><li>миграции обратимы или обратно совместимы</li><li><b>feature flag</b> выключает функцию без выкатки вообще</li></ul><p>Feature flags разделяют <b>деплой</b> и <b>релиз</b>: код уезжает выключенным, включается отдельно и мгновенно гасится при проблемах.</p>"}],
 ch:[
 {t:"q",d:1,q:"Нужно проверить рискованное изменение на реальном трафике, но только на 5% пользователей. Какая стратегия?",a:["Recreate","Rolling","Canary","Blue-Green"],c:2,why:"Canary плюс наблюдение за метриками ошибок и латентности, плюс автоматический откат при деградации."},
 {t:"q",d:2,q:"Почему тег <code>latest</code> на проде — плохая идея?",a:["Длинное имя","Непонятно, какая версия реально работает, и невозможно воспроизвести откат","Занимает место","Медленно скачивается"],c:1,why:"Неизменяемые теги дают однозначную связь «контейнер ↔ код». Без неё расследование инцидента превращается в гадание."},
 {t:"q",d:3,q:"При rolling update старая и новая версии работают одновременно. Что это требует от изменений?",a:["Ничего особенного","Обратной совместимости: API, формат сообщений и схема БД должны понимать обе версии","Отключить старую версию заранее","Использовать только Recreate"],c:1,why:"Иначе ошибки получат ровно те пользователи, чьи запросы попали на «другую» версию — и воспроизвести это будет тяжело."},
 {t:"q",d:4,q:"Релиз включает удаление колонки в БД и код, который её больше не использует. Что не так?",a:["Ничего, всё согласовано","Откат кода станет невозможен: данных уже нет — миграции делают в три шага (expand → migrate → contract)","Слишком долго выполняется","Нужен даунтайм"],c:1,why:"Правило: код должен работать со старой и новой схемой одновременно. Удаление — отдельный релиз, когда откат к старому коду уже не нужен."},
 {t:"q",d:4,q:"Что такое feature flag и зачем он DevOps-инженеру?",a:["Флаг компилятора","Переключатель функции в рантайме: деплой и релиз разделяются, а откат функции не требует выкатки","Метка в git","Тип автотеста"],c:1,why:"Снижает риск любого релиза: код едет выключенным, включается на части пользователей и гасится мгновенно без пайплайна."},
 {t:"q",d:5,q:"<b>Инцидент.</b> Через три минуты после выкатки доля 5xx выросла до 12%. В релизе были и код, и миграция, добавляющая колонку. Порядок действий?",a:["Искать причину в логах, пока пользователи ждут","Немедленно откатить код на предыдущий образ (миграция добавляла колонку — она обратно совместима и откату не мешает), убедиться по метрикам, что ошибки ушли, и только потом расследовать","Откатить миграцию первой","Увеличить число реплик"],c:1,why:"Сначала стабилизация, потом расследование. Добавляющая миграция безопасна для отката — именно ради этого её и делают отдельно от удаляющей."}]},

{id:"c6",t:"Безопасность и качество пайплайна",goal:"Не превратить конвейер в дыру",
 cards:[
 {h:"Что проверяет зрелый пайплайн",b:"<div class='tw'><table><tr><th>проверка</th><th>инструмент</th><th>что ловит</th></tr><tr><td>секреты в коде</td><td>gitleaks, trufflehog</td><td>токены и пароли в коммитах</td></tr><tr><td>зависимости</td><td>dependabot, npm audit</td><td>известные уязвимости библиотек</td></tr><tr><td>образ</td><td>trivy, grype</td><td>CVE в системных пакетах базы</td></tr><tr><td>код</td><td>SAST-анализаторы</td><td>типовые уязвимые паттерны</td></tr><tr><td>инфраструктура</td><td>tfsec, checkov</td><td>публичные бакеты, открытые порты в IaC</td></tr></table></div><p><b>Shift left:</b> чем раньше найдена проблема, тем дешевле её исправить. Найденная на проде стоит в сотни раз дороже найденной в PR.</p>"},
 {h:"Секреты в пайплайне",b:"<ul><li>только из хранилища секретов, никогда из кода</li><li>маскирование в логах — обязательно, но не гарантия: <code>echo $TOKEN | base64</code> обойдёт его</li><li>минимальные права: токен только на нужный реестр и только на push</li><li>ротация и короткий срок жизни; в идеале — OIDC вместо статических ключей</li></ul><p><b>Если секрет засветился в логе — он скомпрометирован.</b> Порядок: сначала ротация, потом чистка логов. Логи хранятся в кэшах, форках и глазах людей.</p>"},
 {h:"Гейты перед продом",b:"<ul><li>обязательный зелёный CI и ревью перед merge (branch protection)</li><li>ручное подтверждение прод-деплоя через защищённое окружение — с аудитом, кто и когда одобрил</li><li>smoke-тесты <b>после</b> выкатки: деплой заканчивается не словом «выкачено», а подтверждением здоровья</li><li>автоматический откат при деградации метрик</li></ul>"},
 {h:"Итоговый конвейер проекта",b:"<pre>PR:      lint → unit → build → scan → ephemeral-окружение → e2e\nmain:    build app:$SHA → push → deploy staging → smoke\ntag v*:  ручной аппрув → canary 10% → метрики → 100%\n                     → при деградации автооткат</pre><p>Обрати внимание: образ собирается один раз на этапе main и дальше только продвигается. Ephemeral-окружение для PR — временный стенд, который удаляется после слияния (иначе счёт за облако растёт незаметно).</p>"}],
 ch:[
 {t:"q",d:1,q:"Что означает принцип shift left в безопасности?",a:["Сдвигать релизы влево по календарю","Находить проблемы как можно раньше — в PR и в CI, а не на проде","Писать код левой рукой","Смещать нагрузку на левую половину кластера"],c:1,why:"Стоимость исправления растёт на порядки с каждым этапом. Автоматические проверки в PR — самая дешёвая точка."},
 {t:"q",d:2,q:"Зачем нужны gitleaks и trivy, если есть код-ревью?",a:["Для отчётности перед аудитом","Человек пропускает и не помнит все CVE; автоматика проверяет каждый коммит одинаково и без усталости","Требование закона","Ускоряют сборку"],c:1,why:"Ревью и автоматика решают разные задачи: человек оценивает замысел, инструмент — известные шаблоны и базы уязвимостей."},
 {t:"q",d:3,q:"Секрет случайно распечатался в логах пайплайна. Что делать в первую очередь?",a:["Удалить лог","Немедленно ротировать секрет, и только потом чистить логи и чинить причину","Ничего, логи приватные","Сделать репозиторий приватным"],c:1,why:"Логи копируются в кэши, уведомления и чужие глаза. Компрометация уже произошла — единственное реальное действие — сменить секрет."},
 {t:"q",d:3,q:"Пайплайн зелёный, деплой прошёл, но сервис не работает. Какого этапа не хватает?",a:["Ещё одного линтера","Проверки после выкатки: smoke-тестов и контроля метрик, с автоматическим откатом при деградации","Больше unit-тестов","Ручного тестирования"],c:1,why:"Деплой заканчивается подтверждением здоровья системы, а не фактом отправки манифеста. Иначе о проблеме сообщают пользователи."},
 {t:"q",d:4,q:"Какие права должен иметь токен, которым пайплайн публикует образ в реестр?",a:["Полные права администратора","Минимальные: push только в нужный репозиторий образов, без прав на удаление и на другие проекты","Права на чтение всего реестра","Права владельца организации"],c:1,why:"Принцип наименьших привилегий ограничивает ущерб при утечке. Токен с правами администратора превращает любую утечку в катастрофу."},
 {t:"q",d:5,q:"<b>Инцидент.</b> Злоумышленник открыл PR, который добавил в workflow шаг с отправкой переменных окружения на внешний адрес. Проверки прошли, но секреты не утекли. Почему и какие ещё барьеры должны быть?",a:["Повезло, барьеров не было","Секреты недоступны workflow из форков — это встроенная защита; дополнительно: обязательное ревью изменений в .github/workflows, запрет автозапуска для новых контрибьюторов, отдельный workflow для деплоя","Сработал антивирус","Сканер безопасности заблокировал шаг"],c:1,why:"Изменения в самом пайплайне — привилегированный код. Их ревьюят внимательнее обычного и защищают отдельными правилами (CODEOWNERS на каталог workflows)."}]}
);
