   {h:"Цикл работы",b:"<pre>terraform init     <span class='c'># скачать провайдеры, настроить backend</span>\nterraform fmt -recursive\nterraform validate\nterraform plan -out=tf.plan   <span class='c'># ЧТО будет сделано</span>\nterraform apply tf.plan\nterraform destroy</pre><p><code>plan</code> перед <code>apply</code> — не рекомендация, а правило. Читаешь diff: сколько create / change / <b>destroy</b>.</p>"},
   {h:"State — самое важное и самое опасное",b:"<p><code>terraform.tfstate</code> — карта соответствия «код ↔ реальные ресурсы». Без него Terraform не знает, что уже создано.</p><ul><li>Хранить <b>удалённо</b> (S3, GCS, Terraform Cloud), не в git — там могут быть секреты.</li><li>Обязательно <b>блокировка</b> (DynamoDB lock, встроенная в бэкенд), иначе два инженера одновременно разнесут инфраструктуру.</li><li><code>terraform import</code> — затянуть существующий ресурс под управление.</li></ul>"},
   {h:"Модули и переменные",b:"<pre>variable \"env\" { type = string }\n\nresource \"aws_instance\" \"app\" {\n  count         = var.env == \"prod\" ? 3 : 1\n  instance_type = \"t3.small\"\n  tags = { Name = \"app-${var.env}\" }\n}\n\noutput \"ip\" { value = aws_instance.app[0].public_ip }</pre><p>Модуль — переиспользуемый набор ресурсов. Среды разделяют через отдельные state (workspace или папки prod/stage).</p>"}],
  ch:[
   {t:"c",q:"Посмотри, что именно Terraform собирается изменить, ничего не применяя.",ans:["terraform plan","terraform plan -out=tf.plan","tf plan"],hint:"одно слово после terraform",why:"plan — обязательный шаг. В CI план публикуют в PR, чтобы ревьюер увидел diff инфраструктуры."},
   {t:"q",q:"Зачем state хранят в S3 с блокировкой, а не локально?",a:["Быстрее","Общая правда для команды + защита от одновременного apply","Дешевле","Так требует AWS"],c:1,why:"Локальный state = рассинхрон и потерянная инфраструктура при смене ноутбука. Блокировка спасает от гонок."},
   {t:"q",q:"В plan видишь <code>1 to destroy</code> на проде, хотя менял только тег. Действия?",a:["Применить, тег же мелкий","Остановиться и разобраться: скорее всего изменение атрибута, требующего пересоздания","Удалить state","Запустить apply дважды"],c:1,why:"Некоторые поля — ForceNew. Читать plan построчно — базовый навык, спасающий продакшены."},
   {t:"q",q:"Ресурс создали руками в консоли, теперь надо им управлять из Terraform.",a:["Пересоздать через apply","terraform import (или import-блок) — затянуть в state","Скопировать в код и всё","Невозможно"],c:1,why:"import связывает существующий ресурс с адресом в коде. Иначе apply попытается создать дубль."}]},
 {id:"i3",t:"Ansible",goal:"Настроить десять серверов одинаково",
  cards:[
   {h:"Playbook",b:"<pre>- hosts: web\n  become: true\n  vars:\n    pkg: nginx\n  tasks:\n    - name: установить nginx\n      apt:\n        name: \"{{ pkg }}\"\n        state: present\n        update_cache: true\n\n    - name: положить конфиг\n      template:\n        src: nginx.conf.j2\n        dest: /etc/nginx/nginx.conf\n      notify: reload nginx\n\n  handlers:\n    - name: reload nginx\n      service: { name: nginx, state: reloaded }</pre><p>Ansible <b>agentless</b> — работает по SSH, ничего не надо ставить на целевые машины.</p>"},
   {h:"Инвентарь, роли, секреты",b:"<p><b>Inventory</b> — список хостов и групп (может быть динамическим из облака).</p><p><b>Роль</b> — структурированный переиспользуемый набор tasks/templates/vars.</p><p><b>ansible-vault</b> — шифрование секретов прямо в репозитории.</p><pre>ansible-playbook -i inventory site.yml --check --diff\nansible all -m ping</pre><p><code>--check</code> — сухой прогон, аналог plan.</p>"}],
  ch:[
   {t:"f",q:"Допиши ключ, который делает задачу идемпотентной — «пакет должен присутствовать».",pre:"- name: установить nginx\n  apt:\n    name: nginx\n    ___: present",ans:["state"],hint:"state",why:"state: present/absent — декларация желаемого состояния, а не команда. Ansible сам проверит и не сделает лишнего."},
   {t:"q",q:"Что означает «Ansible agentless»?",a:["Не нужен интернет","На управляемых хостах не надо ставить агента — работает через SSH","Работает без Python","Нет конфигурации"],c:1,why:"Отличие от Puppet/Chef с их агентами. Требуется лишь SSH и Python на целевом хосте."},
   {t:"q",q:"Как безопасно хранить пароли в репозитории с плейбуками?",a:["Открытым текстом","ansible-vault (или внешний секрет-менеджер)","В комментариях","В имени файла"],c:1,why:"ansible-vault шифрует файл; ключ хранится вне репозитория, в CI подставляется из секретов."},
   {t:"q",q:"Зачем handler + notify вместо простого рестарта в конце?",a:["Красивее","Сервис перезапускается ТОЛЬКО если конфиг реально изменился","Быстрее пишется","Обязательно по синтаксису"],c:1,why:"Иначе каждый прогон дёргает прод без необходимости. Это и есть идемпотентность на практике."}]}],
 boss:{t:"Аудит инфраструктуры",intro:"Новый проект: всё создано руками, паролей никто не помнит. Наводи порядок.",
  ch:[
  {t:"q",q:"С чего начнёшь перевод ручной инфраструктуры в код?",a:["Всё снести и создать заново","Описать текущее состояние и импортировать в state, потом рефакторить","Написать документацию","Ничего не трогать"],c:1,why:"Импорт без даунтайма, потом постепенный рефакторинг в модули. Пересоздание прода — не вариант."},
  {t:"q",q:"Terraform state лежит в git и содержит пароль БД. Проблема?",a:["Нет","Да: state хранит значения в открытом виде — переносим в защищённый remote backend и ротируем секрет","Только если репозиторий публичный","Достаточно .gitignore"],c:1,why:"State — чувствительный артефакт. Remote backend с шифрованием и ограниченным доступом, плюс ротация утёкшего."},
  {t:"q",q:"Как разделить окружения prod и staging в Terraform?",a:["Одним state и переменными","Отдельные state/workspace и разные каталоги конфигураций","Одним файлом с if","Разными аккаунтами git"],c:1,why:"Изоляция state = ошибка в стейдже не роняет прод. Общий код выносится в модули."},
  {t:"q",q:"Ansible-плейбук при каждом запуске рестартует nginx, даже если ничего не менялось. Что чинить?",a:["Ничего","Использовать handlers + notify и декларативные модули вместо command/shell","Запускать реже","Отключить nginx"],c:1,why:"command/shell по умолчанию не идемпотентны — им нужен creates/when, иначе changed каждый раз."},
  {t:"q",q:"Что ты добавишь в CI для Terraform?",a:["Ничего","fmt, validate, план в PR и apply только после ревью/аппрува","Только apply","Ручной запуск"],c:1,why:"Инфраструктурный PR ревьюят по diff'у плана. Автоапплай без ревью на проде — способ потерять кластер."}]}},

{id:"k8s",n:"Kubernetes",ic:"⎈",tag:"Оркестрация, где живут middle-инженеры",
 desc:"Кластер сам держит нужное состояние. Твоя задача — правильно его описать и уметь чинить.",
 miss:[
 {id:"k1",t:"Из чего состоит кластер",goal:"Не путать Pod, Deployment и Service",
  cards:[
   {h:"Control plane и ноды",b:"<ul><li><b>API server</b> — единственная точка входа, всё идёт через него.</li><li><b>etcd</b> — база состояния кластера (её бэкапят!).</li><li><b>scheduler</b> — решает, на какую ноду поставить под.</li><li><b>controller manager</b> — приводит реальность к желаемому состоянию.</li><li>На каждой ноде: <b>kubelet</b> (запускает контейнеры) и <b>kube-proxy</b> (сеть).</li></ul><p>Ключевая идея: <b>reconciliation loop</b>. Ты объявил «нужно 3 реплики» — контроллер бесконечно сверяет и чинит.</p>"},
   {h:"Объекты, которые используешь каждый день",b:"<ul><li><b>Pod</b> — минимальная единица, один или несколько контейнеров с общей сетью. Смертен.</li><li><b>ReplicaSet</b> — держит N подов.</li><li><b>Deployment</b> — управляет ReplicaSet, даёт rolling update и откат.</li><li><b>Service</b> — стабильный адрес и балансировка к подам по лейблам.</li><li><b>Ingress</b> — HTTP-маршрутизация снаружи по доменам/путям.</li><li><b>ConfigMap / Secret</b> — конфиги и чувствительные данные.</li><li><b>StatefulSet</b> — для БД и всего, чему нужны стабильные имена и диски.</li><li><b>DaemonSet</b> — по одному поду на каждую ноду (агенты логов, мониторинг).</li></ul>"}],
  ch:[
   {t:"q",q:"Под упал и не вернулся. Что должно было его пересоздать?",a:["kubelet сам по себе","Deployment → ReplicaSet держит нужное число реплик","Ingress","etcd"],c:1,why:"Голый Pod никто не воскрешает. Поэтому в проде создают Deployment, а не Pod."},
   {t:"q",q:"Зачем нужен Service, если у пода есть IP?",a:["Для красоты","IP пода меняется при пересоздании; Service даёт стабильное DNS-имя и балансировку по лейблам","Service ускоряет сеть","Это одно и то же"],c:1,why:"Связь идёт через selector по лейблам. Типичная ошибка — несовпадение лейблов, и Service никуда не ведёт."},
   {t:"q",q:"Нужно по одному агенту сбора логов на КАЖДОЙ ноде. Какой объект?",a:["Deployment","DaemonSet","StatefulSet","Job"],c:1,why:"DaemonSet — ровно по поду на ноду, автоматически и на новых нодах тоже."},
   {t:"q",q:"Разница Deployment и StatefulSet?",a:["Нет разницы","StatefulSet даёт стабильные имена подов и персистентные тома — для БД и кворумных систем","StatefulSet быстрее","Deployment только для БД"],c:1,why:"Postgres/Kafka/Elasticsearch — StatefulSet. Stateless-приложения — Deployment."}]},
 {id:"k2",t:"Манифесты и kubectl",goal:"Писать YAML и читать состояние кластера",
  cards:[
   {h:"Deployment целиком",b:"<pre>apiVersion: apps/v1\nkind: Deployment\nmetadata:\n  name: api\nspec:\n  replicas: 3\n  selector:\n    matchLabels: { app: api }\n  template:\n    metadata:\n      labels: { app: api }\n    spec:\n      containers:\n        - name: api\n          image: registry/api:1a2b3c4\n          ports: [{ containerPort: 8080 }]\n          resources:\n            requests: { cpu: 100m, memory: 128Mi }\n            limits:   { cpu: 500m, memory: 512Mi }\n          readinessProbe:\n            httpGet: { path: /health, port: 8080 }</pre>"},
   {h:"Команды выживания",b:"<pre>kubectl get pods -n prod\nkubectl describe pod api-xxx     <span class='c'># события — главное при отладке</span>\nkubectl logs -f api-xxx\nkubectl logs api-xxx --previous  <span class='c'># логи упавшего контейнера</span>\nkubectl exec -it api-xxx -- sh\nkubectl apply -f deploy.yaml\nkubectl rollout status deploy/api\nkubectl rollout undo deploy/api  <span class='c'># откат</span>\nkubectl get events --sort-by=.lastTimestamp</pre>"},
   {h:"requests и limits",b:"<p><b>requests</b> — сколько гарантированно резервируется; по ним <b>scheduler</b> размещает под.</p><p><b>limits</b> — потолок. Превысил память → <b>OOMKilled</b>. Превысил CPU → троттлинг (не убийство).</p><p>Без requests планировщик работает вслепую, и ноды переполняются.</p>"}],
  ch:[
   {t:"c",q:"Посмотри подробности и события пода api-7f9 (главный инструмент отладки).",ans:["kubectl describe pod api-7f9","k describe pod api-7f9","kubectl describe pods api-7f9"],hint:"kubectl describe ...",why:"Раздел Events внизу вывода объясняет 90% проблем: ImagePullBackOff, Insufficient cpu, FailedMount."},
   {t:"c",q:"Откати деплоймент api на предыдущую ревизию.",ans:["kubectl rollout undo deploy/api","kubectl rollout undo deployment/api","kubectl rollout undo deployment api"],hint:"rollout undo",why:"Deployment хранит историю ревизий. Откат — одна команда, и это главный аргумент в пользу декларативности."},
   {t:"q",q:"Под в статусе <code>OOMKilled</code>. Что произошло?",a:["Нет образа","Контейнер превысил memory limit и был убит ядром","Нет места на диске","Ошибка сети"],c:1,why:"Либо поднять limit, либо чинить утечку. CPU-limit, в отличие от памяти, приводит к троттлингу, а не к убийству."},
   {t:"q",q:"Под в <code>ImagePullBackOff</code>. Первая проверка?",a:["Перезапустить кластер","Имя/тег образа и доступ к registry (imagePullSecrets)","Увеличить память","Сменить ноду"],c:1,why:"Обычно опечатка в теге или нет секрета для приватного registry. Всё видно в describe → Events."}]},
 {id:"k3",t:"Конфиги, сеть, доступ",goal:"Довести трафик до пода и не хранить пароли в YAML",
  cards:[
   {h:"ConfigMap и Secret",b:"<pre>envFrom:\n  - configMapRef: { name: app-config }\n  - secretRef:    { name: app-secrets }</pre><p><b>Важно:</b> Secret в Kubernetes по умолчанию всего лишь base64, не шифрование. Нужны: шифрование etcd at rest, RBAC, и для git — sealed-secrets / external-secrets / Vault.</p>"},
   {h:"Как трафик доходит",b:"<pre>Пользователь → DNS → Ingress Controller (nginx/traefik)\n  → Service (ClusterIP) → Pod</pre><p>Типы Service: <b>ClusterIP</b> (внутри), <b>NodePort</b> (порт на ноде), <b>LoadBalancer</b> (внешний балансировщик облака).</p>"},
   {h:"Probes: три штуки",b:"<ul><li><b>readiness</b> — готов ли принимать трафик. Не готов → Service его исключает.</li><li><b>liveness</b> — жив ли. Нет → контейнер перезапускается.</li><li><b>startup</b> — для медленно стартующих, чтобы liveness не убил раньше времени.</li></ul><p>Ошибка новичка: liveness с коротким таймаутом на тяжёлом приложении — бесконечный рестарт-луп.</p>"}],
  ch:[
   {t:"q",q:"Приложение стартует 40 секунд. Какая probe спасёт от рестарт-лупа?",a:["liveness с коротким периодом","startupProbe (и корректная readiness)","Никакая","Убрать все probes"],c:1,why:"startupProbe откладывает liveness до успешного старта. Readiness при этом держит трафик до готовности."},
   {t:"q",q:"Secret в Kubernetes — это шифрование?",a:["Да, AES","Нет, по умолчанию base64; нужны шифрование etcd, RBAC и внешний менеджер секретов","Да, RSA","Секретов в k8s нет"],c:1,why:"Частый вопрос-ловушка на собеседовании. Правильный ответ показывает зрелость в безопасности."},
   {t:"q",q:"Нужно раздать трафик на два домена внутрь кластера по HTTPS. Что используешь?",a:["NodePort на каждый","Ingress + Ingress Controller (+ cert-manager для TLS)","Только ClusterIP","DaemonSet"],c:1,why:"Ingress — правила маршрутизации; Controller — то, что их исполняет. Без контроллера Ingress не делает ничего."},
   {t:"q",q:"Service создан, но трафик не идёт в поды. Куда смотришь первым делом?",a:["На версию kubectl","На совпадение selector Service и labels подов, и на endpoints","На CPU","На DNS провайдера"],c:1,why:"kubectl get endpoints — если пусто, значит селектор не находит поды. Ошибка №1 у новичков."}]},
 {id:"k4",t:"Эксплуатация кластера",goal:"Масштабирование, обновления, надёжность",
  cards:[
   {h:"Масштабирование",b:"<p><b>HPA</b> — горизонтально по метрикам (CPU, память, кастомные).</p><p><b>Cluster Autoscaler</b> — добавляет ноды, когда поды не влезают.</p><pre>kubectl scale deploy/api --replicas=5\nkubectl autoscale deploy/api --min=2 --max=10 --cpu-percent=70</pre><p>HPA работает только если у подов заданы resources.requests.</p>"},
   {h:"Надёжность",b:"<ul><li><b>PodDisruptionBudget</b> — не дать выселить слишком много подов при обслуживании нод.</li><li><b>affinity / topologySpreadConstraints</b> — размазать реплики по зонам и нодам.</li><li><b>taints / tolerations</b> — зарезервировать ноды под особые нагрузки.</li><li><b>Helm</b> — пакетирование манифестов с values для сред; <b>ArgoCD</b> — GitOps: кластер синхронизируется с git-репозиторием.</li></ul>"}],
  ch:[
   {t:"c",q:"Увеличь число реплик деплоймента api до 5.",ans:["kubectl scale deploy/api --replicas=5","kubectl scale deployment/api --replicas=5","kubectl scale deployment api --replicas=5"],hint:"kubectl scale",why:"Быстро для инцидента, но в GitOps итог всё равно надо зафиксировать в манифесте, иначе следующая синхронизация откатит."},
   {t:"q",q:"Что такое GitOps?",a:["Git-хостинг","Желаемое состояние кластера хранится в git, агент (ArgoCD/Flux) непрерывно приводит кластер к нему","Способ ветвления","CI-система"],c:1,why:"Плюсы: аудит, откат через git revert, отсутствие ручных kubectl apply на проде."},
   {t:"q",q:"Зачем PodDisruptionBudget?",a:["Ограничить бюджет","Гарантировать минимум доступных подов при плановых выселениях (drain, обновление нод)","Ограничить CPU","Настроить сеть"],c:1,why:"Без PDB обновление нод может одновременно выселить все реплики и уронить сервис."},
   {t:"q",q:"HPA не масштабирует поды. Частая причина?",a:["Мало нод","Не заданы resources.requests / нет metrics-server","Старый kubectl","Нет Ingress"],c:1,why:"HPA считает утилизацию относительно requests. Нет requests — нечего считать."}]}],
 boss:{t:"Кластер деградирует",intro:"Половина подов рестартует, клиенты видят 502. Пять решений.",
  ch:[
  {t:"q",q:"Поды в CrashLoopBackOff. Твой первый шаг?",a:["Удалить деплоймент","kubectl logs --previous и kubectl describe — понять причину падения","Перезагрузить ноды","Увеличить реплики"],c:1,why:"--previous показывает логи предыдущего, упавшего контейнера. Без этого причина не видна."},
  {t:"q",q:"Часть подов Pending. Что смотришь?",a:["Логи приложения","describe pod → Events: недостаточно ресурсов, taints, нет PV","Ingress","Сертификаты"],c:1,why:"Pending — проблема планирования, а не приложения. Обычно не хватает CPU/памяти или нет подходящей ноды."},
  {t:"q",q:"После деплоя 502 у пользователей. Причина, скорее всего?",a:["DNS","Нет readinessProbe — трафик пошёл в неготовые поды","Мало реплик","Старый образ"],c:1,why:"Readiness + rolling update с maxUnavailable=0 = деплой без ошибок для пользователя."},
  {t:"c",q:"Останови катящийся неудачный релиз и верни предыдущую версию api.",ans:["kubectl rollout undo deploy/api","kubectl rollout undo deployment/api","kubectl rollout undo deployment api"],hint:"rollout undo",why:"Сначала стабилизировать, потом разбираться. Это правило инцидент-менеджмента."},
  {t:"q",q:"Как ограничить, чтобы одно приложение не съело ресурсы всего неймспейса?",a:["Просить разработчиков","ResourceQuota и LimitRange на неймспейс + requests/limits в подах","Отдельный кластер всегда","Никак"],c:1,why:"Квоты — граница ответственности между командами в общем кластере."}]}},

{id:"obs",n:"Мониторинг и надёжность",ic:"◉",tag:"Узнать о проблеме раньше клиента",
 desc:"Метрики, логи, трейсы, алерты — и культура разбора инцидентов.",
 miss:[
 {id:"o1",t:"Три столпа наблюдаемости",goal:"Понимать, чем метрика отличается от лога",
  cards:[
   {h:"Метрики, логи, трейсы",b:"<ul><li><b>Метрики</b> — числа во времени (rps, latency, errors, CPU). Дёшевы, отвечают «что-то не так и когда».</li><li><b>Логи</b> — события с деталями. Отвечают «что именно произошло».</li><li><b>Трейсы</b> — путь одного запроса через сервисы. Отвечают «где именно тормозит».</li></ul><p>Стек по умолчанию: Prometheus + Grafana (метрики), Loki или ELK (логи), Jaeger/Tempo + OpenTelemetry (трейсы).</p>"},
   {h:"Что мерить: RED и USE",b:"<p><b>RED</b> для сервисов: <b>R</b>ate (запросов/сек), <b>E</b>rrors (доля ошибок), <b>D</b>uration (латентность).</p><p><b>USE</b> для ресурсов: <b>U</b>tilization, <b>S</b>aturation, <b>E</b>rrors.</p><p>И четыре «золотых сигнала» Google SRE: latency, traffic, errors, saturation.</p>"},
   {h:"Перцентили, а не среднее",b:"<p>Среднее время ответа врёт. Если 95% запросов по 50 мс, а 5% по 10 секундам, среднее покажет ~550 мс — и никто не поймёт, что каждый двадцатый клиент страдает.</p><p>Смотри <b>p50 / p95 / p99</b>. SLO формулируют именно в перцентилях.</p>"}],
  ch:[
   {t:"q",q:"Нужно понять, на каком из 6 микросервисов теряется время в медленном запросе. Что используешь?",a:["Метрики","Логи","Распределённые трейсы","df -h"],c:2,why:"Трейс показывает span'ы по каждому сервису. Метрики скажут «медленно», трейс — «где именно»."},
   {t:"q",q:"Почему p99 важнее среднего времени ответа?",a:["Красивее график","Среднее прячет хвост: страдающее меньшинство пользователей не видно","p99 считается быстрее","Так принято"],c:1,why:"Хвостовые задержки бьют по самым активным пользователям. SLO пишут по перцентилям."},
   {t:"q",q:"Что означает RED в мониторинге сервиса?",a:["Red-Error-Debug","Rate, Errors, Duration","Reliability, Efficiency, Delivery","Regression Every Deploy"],c:1,why:"RED — минимальный набор дашборда для любого HTTP-сервиса. USE — для железа и ресурсов."}]},
 {id:"o2",t:"Prometheus и алерты",goal:"Настроить оповещения, которые не хочется отключить",
  cards:[
   {h:"Модель Prometheus",b:"<p>Prometheus сам <b>ходит и забирает</b> метрики (pull) с эндпоинта <code>/metrics</code>. Типы: counter (только растёт), gauge (скачет), histogram (распределение).</p><pre>rate(http_requests_total{status=~\"5..\"}[5m])\n/ rate(http_requests_total[5m]) > 0.05\n<span class='c'># доля 5xx больше 5% за 5 минут</span></pre><p><code>rate()</code> обязателен для counter — сырое значение растёт вечно и само по себе бессмысленно.</p>"},
   {h:"Алерты, которым верят",b:"<ul><li>Алерт должен быть <b>actionable</b>: если по нему нечего делать — это не алерт, а график.</li><li>Алертить по <b>симптомам для пользователя</b> (ошибки, латентность), а не по «CPU 80%».</li><li><code>for: 5m</code> — не будить из-за секундного всплеска.</li><li>Alert fatigue — главный враг: когда алертов много, их перестают читать, и настоящий инцидент теряется.</li></ul>"}],
  ch:[
   {t:"q",q:"Prometheus использует push или pull модель сбора?",a:["Push от приложений","Pull: сам скрейпит /metrics по расписанию","Оба всегда","Через syslog"],c:1,why:"Pull. Для коротких задач есть Pushgateway — но это исключение, а не норма."},
   {t:"q",q:"Какой алерт полезнее для дежурного?",a:["CPU > 80% пять минут","Доля 5xx > 5% в течение 5 минут","Диск заполнен на 60%","Перезапустился под"],c:1,why:"Симптом, который чувствует пользователь. Высокий CPU может быть нормой при штатной нагрузке."},
   {t:"q",q:"Зачем в PromQL функция rate() для counter?",a:["Ускоряет запрос","Counter монотонно растёт; rate даёт скорость изменения в секунду","Округляет","Фильтрует лейблы"],c:1,why:"И rate корректно обрабатывает перезапуск (сброс счётчика). Без rate график бесполезен."},
   {t:"q",q:"Команда отключила уведомления, потому что «алертов слишком много». Как чинить?",a:["Заставить читать","Убрать неактионабельные алерты, поднять пороги, добавить for и группировку — лечить alert fatigue","Добавить ещё алертов","Уволить дежурного"],c:1,why:"Качество важнее количества: каждый алерт — обещание, что по нему есть что сделать прямо сейчас."}]},
 {id:"o3",t:"SLI, SLO и инциденты",goal:"Говорить на языке бизнеса и надёжности",
  cards:[
   {h:"SLI / SLO / SLA / error budget",b:"<ul><li><b>SLI</b> — измеряемый показатель (доля успешных запросов).</li><li><b>SLO</b> — твоя внутренняя цель (99,9% за 30 дней).</li><li><b>SLA</b> — контракт с клиентом и деньги за нарушение.</li><li><b>Error budget</b> — разрешённое количество плохого. 99,9% = ~43 минуты в месяц. Бюджет потрачен → останавливаем фичи, чиним надёжность.</li></ul>"},
   {h:"Инцидент: роли и постмортем",b:"<p>Порядок: <b>обнаружили → стабилизировали → нашли причину → починили → написали постмортем</b>. Сначала вернуть сервис, потом расследовать.</p><p>Постмортем — <b>blameless</b>: ищем недостатки системы, а не виноватого. Итог — список конкретных задач с ответственными.</p><p><b>MTTR</b> (среднее время восстановления) важнее MTBF: сбои будут всегда, вопрос — как быстро ты возвращаешься.</p>"}],
  ch:[
   {t:"q",q:"SLO 99,9% в месяц. Сколько это примерно даунтайма?",a:["43 минуты","4 часа","7 часов","5 секунд"],c:0,why:"99,9% ≈ 43 мин/мес, 99,99% ≈ 4,3 мин, 99% ≈ 7,2 часа. Цифры полезно помнить наизусть."},
   {t:"q",q:"Error budget исчерпан в середине месяца. Что предлагает практика SRE?",a:["Игнорировать","Заморозить рискованные релизы и вложиться в надёжность","Понизить SLO","Уволить дежурного"],c:1,why:"Бюджет ошибок — объективный арбитр между скоростью фич и стабильностью."},
   {t:"q",q:"Что первое во время инцидента: найти причину или восстановить сервис?",a:["Найти причину","Восстановить сервис, потом расследовать","Написать постмортем","Сообщить в соцсетях"],c:1,why:"Mitigate first. Улики собираются параллельно: скриншоты графиков, логи, таймлайн."},
   {t:"q",q:"Что такое blameless postmortem?",a:["Разбор без указания виновных, фокус на дефектах системы и процессов","Разбор без документа","Отчёт для клиента","Собрание руководителей"],c:0,why:"Культура без обвинений даёт честные данные. Если наказывают — люди скрывают ошибки, и система не улучшается."}]}],
 boss:{t:"Ночной инцидент",intro:"Алерт: доля 5xx 12%. Ты — incident commander.",
  ch:[
  {t:"q",q:"Первые 5 минут инцидента. Что делаешь?",a:["Ищу первопричину в коде","Подтверждаю масштаб по дашборду, объявляю инцидент, стабилизирую (откат/скейл)","Пишу постмортем","Жду утра"],c:1,why:"Оценка влияния → коммуникация → митигация. Расследование — после стабилизации."},
  {t:"q",q:"5xx начались через 3 минуты после деплоя. Гипотеза номер один?",a:["Атака","Новый релиз — откатываем и проверяем, ушли ли ошибки","Проблема провайдера","Сломался DNS"],c:1,why:"Корреляция по времени с изменением — самая частая причина инцидентов. Первый вопрос всегда: «что менялось?»"},
  {t:"q",q:"Какую метрику покажешь бизнесу как «влияние на клиента»?",a:["CPU нод","Долю неуспешных запросов и рост p95 латентности за период инцидента","Число подов","Размер логов"],c:1,why:"Бизнес понимает «столько-то процентов пользователей не смогли оформить заказ», а не утилизацию CPU."},
  {t:"q",q:"Что обязательно попадёт в постмортем?",a:["Имя виноватого","Таймлайн, влияние, первопричина, что помешало заметить раньше, конкретные action items с владельцами","Только причина","Извинения"],c:1,why:"Отдельный ценный пункт — «почему не заметили раньше»: он улучшает мониторинг, а не только код."},
  {t:"q",q:"Как снизить MTTR на будущее?",a:["Больше алертов","Раннеры для отката одной кнопкой, runbook'и, тренировки инцидентов, хорошие дашборды","Меньше деплоев","Ничего"],c:1,why:"Быстрое восстановление — тренируемый навык и инфраструктура, а не героизм дежурного."}]}},

{id:"cloudsec",n:"Облако, безопасность, собеседование",ic:"⛨",tag:"Финишная прямая",
 desc:"Облачная модель, базовая безопасность и подготовка к интервью на middle.",
 miss:[
 {id:"s1",t:"Облако по-инженерному",goal:"Понимать модель ответственности и стоимость",
  cards:[
   {h:"IaaS / PaaS / SaaS и общая ответственность",b:"<p><b>IaaS</b> — тебе дают ВМ и сеть, всё остальное твоё. <b>PaaS</b> — управляемая БД, managed Kubernetes: провайдер держит платформу. <b>SaaS</b> — готовый продукт.</p><p><b>Shared responsibility:</b> облако отвечает за безопасность <i>самого</i> облака (железо, гипервизор), ты — за безопасность <i>в</i> облаке (доступы, настройки, данные, патчи ОС в IaaS).</p>"},
   {h:"Сеть и деньги",b:"<ul><li><b>VPC</b>: приватные подсети для приложений и БД, публичные — только для балансировщиков. БД никогда не смотрит в интернет.</li><li>Security groups — фаервол на уровне ресурса; принцип наименьших привилегий.</li><li><b>FinOps</b>: теги на ресурсы, автоудаление неиспользуемых дисков и снапшотов, spot/preemptible для стейджинга и CI, автоскейлинг вниз ночью.</li></ul>"}],
  ch:[
   {t:"q",q:"Managed Kubernetes у облачного провайдера — за что отвечаешь ты?",a:["Ни за что","За control plane","За рабочие нагрузки, конфигурацию, доступы и данные; провайдер — за control plane","За железо"],c:2,why:"Модель разделяемой ответственности — типичный вопрос собеседования на middle."},
   {t:"q",q:"Где должна находиться production-БД в VPC?",a:["В публичной подсети с публичным IP","В приватной подсети без публичного адреса, доступ через security group и bastion/туннель","На том же хосте, что и балансировщик","В интернете с паролем"],c:1,why:"Публичный IP у БД — прямая дорога к утечке. Доступ — только изнутри сети или через SSH-туннель."},
   {t:"q",q:"Счёт за облако вырос вдвое. С чего начнёшь?",a:["Отключить прод","Разметить ресурсы тегами и найти крупнейшие статьи: неиспользуемые диски, снапшоты, трафик, переразмеренные ноды","Сменить провайдера","Уменьшить логи"],c:1,why:"Сначала видимость (теги + отчёты), потом действия. Обычно 80% экономии дают 3-4 находки."}]},
 {id:"s2",t:"Безопасность в потоке работы",goal:"Не стать причиной утечки",
  cards:[
   {h:"Практики, которые от тебя ждут",b:"<ul><li><b>Секреты</b> — только в менеджере (Vault, облачный secrets manager, sealed-secrets). Никогда в git, образах и переменных Dockerfile.</li><li><b>Наименьшие привилегии</b> — отдельные роли для CI, для человека, для сервиса. Никакого общего admin-ключа.</li><li><b>Ротация</b> ключей и коротко живущие токены (OIDC вместо статических ключей в CI).</li><li><b>Сканирование</b>: образов (trivy), зависимостей (dependabot), кода на секреты (gitleaks).</li><li><b>Патчи и базовые образы</b> — регулярное обновление, а не «работает, не трогай».</li></ul>"},
   {h:"Контейнерная гигиена",b:"<ul><li>non-root пользователь, read-only файловая система, drop всех capabilities.</li><li>Минимальная база (alpine/distroless) — меньше пакетов, меньше CVE.</li><li>В Kubernetes: NetworkPolicy (по умолчанию сеть плоская — все ходят ко всем!), RBAC вместо cluster-admin всем подряд.</li></ul>"}],
  ch:[
   {t:"q",q:"Как CI должен получать доступ к облаку без статических ключей?",a:["Ключ в переменной навсегда","OIDC/federated-идентичность с короткоживущими токенами","Общий admin-ключ","Пароль в коде"],c:1,why:"Статический ключ утекает и живёт вечно. OIDC-федерация — современный стандарт для GitHub Actions/GitLab CI."},
   {t:"q",q:"В Kubernetes по умолчанию любой под может обратиться к любому другому. Чем ограничить?",a:["Ingress","NetworkPolicy","ResourceQuota","PodDisruptionBudget"],c:1,why:"NetworkPolicy — сегментация внутри кластера. Требует поддерживающего CNI (Calico, Cilium)."},
   {t:"q",q:"Обнаружен критичный CVE в базовом образе, который используют 20 сервисов. Действия?",a:["Игнорировать","Обновить базовый образ централизованно, пересобрать и выкатить, проверить сканером","Отключить сканер","Переписать приложение"],c:1,why:"Отсюда и практика общего базового образа: одно исправление закрывает весь парк."}]},
 {id:"s3",t:"Подготовка к собеседованию",goal:"Уметь рассказать, а не только сделать",
  cards:[
   {h:"Структура ответа STAR",b:"<p><b>S</b>ituation — контекст. <b>T</b>ask — что требовалось. <b>A</b>ction — что сделал именно ты. <b>R</b>esult — измеримый итог.</p><p>«Пайплайн собирался 40 минут (S/T). Я закэшировал зависимости, распараллелил тесты и перевёл сборку на multi-stage (A). Стало 9 минут, деплоев в день стало втрое больше (R)».</p><p>Цифры важнее прилагательных. Всегда добавляй результат в числах.</p>"},
   {h:"Что спрашивают на middle DevOps",b:"<ul><li>Linux: диагностика, права, процессы, диск, сеть.</li><li>Сети: путь запроса, 502 vs 504, DNS, TLS.</li><li>Docker: слои, multi-stage, отличие от ВМ, безопасность.</li><li>Kubernetes: объекты, probes, ресурсы, отладка пода, откат.</li><li>CI/CD: устройство пайплайна, стратегии деплоя, секреты.</li><li>IaC: state, идемпотентность, plan/apply.</li><li>Мониторинг: RED, перцентили, алерты, SLO.</li><li>Поведенческое: инцидент, конфликт с разработчиками, самая дорогая ошибка.</li></ul>"},
   {h:"Твой козырь — пет-проект",b:"<p>К собеседованию собери один сквозной проект и умей рассказать по нему всё: приложение → Dockerfile (multi-stage) → GitHub Actions → registry → Terraform для инфраструктуры → Kubernetes-манифесты или compose → Prometheus + Grafana → README с архитектурной схемой.</p><p>Это закрывает половину вопросов интервью: ты отвечаешь примерами из своего кода, а не пересказом статей.</p>"}],
  ch:[
   {t:"q",q:"«Расскажите о своей самой большой ошибке» — что хочет услышать интервьюер?",a:["Что ошибок не было","Конкретную ошибку, как её обнаружили, как чинили и что изменили в системе, чтобы не повторилась","Ошибку коллеги","Что виновата компания"],c:1,why:"Оценивают зрелость и способность к системным выводам. Ответ «ошибок не было» читается как отсутствие опыта или честности."},
   {t:"q",q:"Как правильно закончить ответ по STAR?",a:["Извинением","Измеримым результатом: время сборки, доступность, стоимость, число инцидентов","Шуткой","Перечислением технологий"],c:1,why:"Цифры делают историю проверяемой и запоминающейся."},
   {t:"q",q:"Не знаешь ответа на технический вопрос. Лучшая стратегия?",a:["Выдумать","Сказать, что не работал с этим, объяснить, как стал бы разбираться, и провести аналогию с известным","Промолчать","Сменить тему"],c:1,why:"Честность + ход мыслей ценятся выше зазубренного ответа. Выдумка вскрывается следующим уточняющим вопросом."}]}],
 boss:{t:"Финальное собеседование: Middle DevOps",intro:"Технический раунд. Восемь вопросов из всех областей. Проходной балл — 7 из 8.",hp:2,
  ch:[
  {t:"q",q:"Опишите путь HTTP-запроса от браузера до вашего приложения в Kubernetes.",a:["Браузер → приложение","DNS → LB/Ingress Controller → Service → Pod, с TLS-терминацией на входе","Браузер → etcd → Pod","Через kubelet напрямую"],c:1,why:"Умение развернуть цепочку и назвать место, где может сломаться, — половина технического интервью."},
  {t:"q",q:"Под перезапускается каждые 30 секунд. План диагностики?",a:["Увеличить реплики","logs --previous → describe (Events) → проверить probes, limits (OOMKilled), зависимости","Перезагрузить ноду","Удалить неймспейс"],c:1,why:"Ценят структуру диагностики, а не угадывание."},
  {t:"q",q:"Чем контейнер отличается от ВМ — коротко и точно.",a:["Контейнер меньше","Контейнер — изолированный процесс на ядре хоста (namespaces + cgroups); ВМ несёт своё ядро и ОС","Контейнер быстрее грузится","Разницы нет"],c:1,why:"Формулировка через namespaces/cgroups сразу выдаёт понимание, а не заученность."},
  {t:"q",q:"Как обеспечить деплой без даунтайма?",a:["Деплоить ночью","Rolling update с readiness-пробами, maxUnavailable=0, обратносовместимые миграции и план отката","Останавливать сервис","Больше реплик"],c:1,why:"Полный ответ включает и БД-миграции — про них забывают, и это отличает middle от junior."},
  {t:"q",q:"Где хранить секреты приложения в проде?",a:["В git","В secrets manager/Vault с ротацией, доставка в рантайме, доступ по ролям","В Dockerfile","В переменных образа"],c:1,why:"И упомянуть, что k8s Secret — base64, а не шифрование."},
  {t:"q",q:"Terraform: зачем remote state и блокировка?",a:["Для скорости","Общее состояние для команды, защита от параллельного apply, безопасное хранение чувствительных данных","Требование провайдера","Для бэкапа"],c:1,why:"State — сердце Terraform. Вопрос про него звучит почти всегда."},
  {t:"q",q:"Какие метрики положишь на дашборд нового сервиса?",a:["CPU и память","RED: rate, errors, duration (p50/p95/p99) + сатурация ресурсов и бизнес-метрика","Только логи","Число деплоев"],c:1,why:"Начинать с пользовательских симптомов, а потом идти к ресурсам — признак зрелого подхода."},
  {t:"q",q:"Разработчики просят прямой доступ к проду. Твоя позиция?",a:["Дать admin всем","Предложить безопасный путь: read-only доступ к логам/метрикам, ограниченный RBAC, аудит, self-service через пайплайн","Отказать без объяснений","Игнорировать"],c:1,why:"Проверяют софт-скиллы: DevOps — про сотрудничество и снятие блокеров, а не про охрану ворот."}]}},

{id:"zabbix",n:"Zabbix",ic:"⚑",tag:"Классический мониторинг конкретным инструментом",
 desc:"Server, Agent, Items, Triggers, Templates — от установки до боевого дежурства.",
 miss:[],
 boss:{t:"Дежурство: тишина в Zabbix",intro:"Полночь. В Zabbix ни одного алерта уже сутки, хотя сервис явно тормозит. Проверь себя на понимание архитектуры и диагностики.",hp:3,
  ch:[
  {t:"q",q:"В Zabbix ни одного триггера не сработало сутки, хотя сервис деградирует. Первое, что проверяешь?",a:["Перезагрузить Zabbix Server","Доходят ли новые значения до item\'ов (Latest data) и не в статусе ли они Not supported / Unreachable","Удалить все триггеры и создать заново","Сменить пароль администратора"],c:1,why:"Если данные не доходят — триггеры физически не с чем сравнивать. Сначала данные, потом логика триггера."},
  {t:"q",q:"Как агент по умолчанию передаёт данные серверу?",a:["Всегда сам отправляет (push)","Сервер сам опрашивает агента (pull) по заданному интервалу — если не включён active-режим","Через SNMP всегда","Через syslog"],c:1,why:"Passive-агент ждёт опроса сервером. Active-агент сам приходит и спрашивает список items — это меняет модель нагрузки и файрвола."},
  {t:"q",q:"Item в статусе Not supported. Куда смотреть?",a:["В Dashboard","В ошибку самого item\'а на странице Latest data и в лог агента","В Reports","В Maps"],c:1,why:"Not supported означает, что агент/сервер не смог получить значение — обычно неверный ключ, нет прав или скрипт упал."},
  {t:"q",q:"Зачем нужен Zabbix Proxy в распределённой сети филиалов?",a:["Для красоты в интерфейсе","Собирает данные локально в филиале и одной пачкой отправляет на сервер — экономит канал и переживает разрыв связи","Заменяет Zabbix Server","Нужен только для SNMP"],c:1,why:"Proxy буферизует данные при потере связи с сервером и снижает число прямых соединений через WAN."},
  {t:"q",q:"Триггер дребезжит: срабатывает и гаснет каждые 30 секунд около порога. Что настроить?",a:["Удалить триггер","Гистерезис (разные пороги для входа и выхода из проблемы) и/или усреднение через avg() за окно времени","Увеличить severity","Отключить уведомления"],c:1,why:"Без гистерезиса значение, колеблющееся вокруг порога, даёт бесконечные PROBLEM/OK. avg(item,5m) сглаживает шум."},
  {t:"q",q:"Как быстро проверить конкретный item на конкретном агенте вручную, не дожидаясь опроса сервера?",a:["Только через веб-интерфейс","zabbix_get -s <хост> -k <ключ> с сервера, или zabbix_agentd -t <ключ> прямо на агенте","Перезапустить сервер","Посмотреть в /var/log/syslog"],c:1,why:"zabbix_get — основной инструмент диагностики: подключается к агенту напрямую и показывает, что он реально возвращает."}]}},

{id:"prometheus",n:"Prometheus",ic:"🔥",tag:"Метрики как код: pull, PromQL, экосистема",
 desc:"Архитектура, PromQL вглубь, экспортёры, service discovery, Alertmanager, федерация.",
 miss:[],
 boss:{t:"Дежурство: Prometheus молчит",intro:"Дашборд Grafana третий час пустой. Алертов нет — но нет и уверенности, что их не должно быть. Проверь себя на понимание внутренностей Prometheus.",hp:3,
  ch:[
  {t:"q",q:"На дашборде Grafana графики оборвались час назад. Первое, что проверяешь?",a:["Перезапустить Grafana","Targets в Prometheus (Status → Targets): не ушли ли цели в состояние DOWN","Пересоздать дашборд","Увеличить retention"],c:1,why:"Grafana лишь рисует то, что успел собрать Prometheus. Если targets DOWN — данных физически нет, дело не в дашборде."},
  {t:"q",q:"Запрос job:http_requests:rate5m возвращает пусто, хотя сырая метрика http_requests_total есть. Что вероятнее?",a:["Опечатка в имени job","Recording rule с этим именем не настроена или не успела посчитаться — это не автоматическое имя, а результат конкретного правила","Prometheus сломан","Нужен restart"],c:1,why:"Recording rule нужно явно объявить в файле правил — по одному наличию сырой метрики агрегат сам не появится."},
  {t:"q",q:"Алерт должен был сработать 10 минут назад, но тишина. rate() метрики на графике явно выше порога. Куда смотреть?",a:["В саму метрику ещё раз","В Alertmanager: не заблокирован ли алерт inhibition/silence, и в правило: не слишком ли большой for","Перезапустить Prometheus","Увеличить порог"],c:1,why:"Alertmanager может молчать не из-за отсутствия проблемы, а из-за активного silence или inhibition правила — это первое, что проверяют при «алерт не пришёл, хотя должен был»."},
  {t:"q",q:"Метрика содержит лейбл с ID пользователя, memory Prometheus растёт бесконтрольно. Что произошло?",a:["Утечка памяти в коде Prometheus","Взрыв кардинальности: каждый уникальный набор лейблов — отдельный ряд в памяти","Диск переполнен","Слишком частый scrape_interval"],c:1,why:"Лейблы с неограниченным числом значений (ID, URL с параметрами) — главная причина деградации Prometheus на практике."},
  {t:"q",q:"Один Prometheus не справляется с числом целей в большой инфраструктуре из нескольких дата-центров. Архитектурное решение?",a:["Увеличить память до бесконечности","Федерация или per-DC Prometheus с центральным сборщиком агрегатов (federation/remote_write) — не единый монолит на всё","Уменьшить scrape_interval","Отключить часть таргетов"],c:1,why:"Prometheus по дизайну — не кластерная система из коробки. Масштабируют горизонтально через федерацию, sharding по job'ам или remote_write в централизованное хранилище."},
  {t:"q",q:"Нужно быстро проверить с сервера, что реально отдаёт эндпоинт /metrics конкретного приложения, не открывая Grafana.",a:["Только через веб-интерфейс Prometheus","curl эндпоинта /metrics напрямую — увидеть сырой текстовый формат экспозиции","Перезапустить приложение","Посмотреть в Alertmanager"],c:1,why:"curl http://host:port/metrics — самый быстрый способ убедиться, что приложение вообще отдаёт метрики в правильном формате, минуя весь стек Prometheus."}]}},

{id:"grafana",n:"Grafana",ic:"📊",tag:"Дашборды, переменные, алертинг поверх любых данных",
 desc:"Источники данных, дашборды, переменные, алертинг в Grafana, права доступа.",
 miss:[],
 boss:{t:"Дежурство: дашборд врёт",intro:"Дашборд показывает зелёные графики, но пользователи жалуются на ошибки. Проверь себя на понимание того, как Grafana превращает данные в картинку — и где она может соврать.",hp:3,
  ch:[
  {t:"q",q:"Дашборд показывает ровную линию без ошибок, но в логах и у пользователей — сбои. Что проверить первым?",a:["Перезагрузить браузер","Сам запрос панели (Edit → Query Inspector): не сузило ли выражение или неверный datasource показывающиеся данные","Пересоздать дашборд с нуля","Обновить Grafana"],c:1,why:"Query Inspector показывает реальный запрос и ответ источника данных — часто панель просто смотрит не туда: не тот datasource, не та переменная в фильтре."},
  {t:"q",q:"Переменная $environment должна фильтровать все панели дашборда по окружению, но часть панелей её игнорирует.",a:["Grafana сломана","В этих панелях запрос не использует переменную явно ($environment в фильтре выражения) — переменная не подставляется в панель автоматически","Нужно пересоздать переменную","Панели закэшированы"],c:1,why:"Переменная работает только там, где явно вставлена в текст запроса. Забытая на одной панели — типичная причина «часть графиков не фильтруется»."},
  {t:"q",q:"Алерт в Grafana молчит, хотя на графике видно явное превышение порога уже 20 минут.",a:["Alerting отключён глобально","Проверить состояние правила (Alert rules → State/Health) и evaluation interval/pending period — правило могло не успеть перейти из Pending в Firing","Перезапустить datasource","Увеличить порог"],c:1,why:"Grafana alerting, как и Prometheus, использует pending period (аналог for): условие должно продержаться заданное время, прежде чем алерт станет Firing."},
  {t:"q",q:"У новой сотрудницы из поддержки должен быть доступ только на просмотр дашбордов, без права их редактировать или трогать источники данных.",a:["Выдать роль Admin, потом попросить не трогать лишнего","Роль Viewer на уровне организации или папки с нужными дашбордами","Создать отдельный аккаунт с паролем от Editor","Общий логин на всю поддержку"],c:1,why:"Grafana разделяет роли Viewer/Editor/Admin — Viewer физически не может изменить панель или источник данных, а не просто «просят не трогать»."},
  {t:"q",q:"Дашборд с 40 панелями на 5-секундном автообновлении заметно тормозит браузер и грузит источник данных.",a:["Так и должно быть, дашборды тяжёлые","Увеличить интервал автообновления и/или интервал агрегации по панелям — 5 секунд разумны для инцидента, но не для постоянного дашборда","Уменьшить число панелей до одной","Отключить темы оформления"],c:1,why:"Слишком частое автообновление на большом дашборде создаёт постоянную нагрузку на источник данных — тот же принцип, что с scrape_interval в Prometheus."},
  {t:"q",q:"Дашборд для нового сервиса нужно сделать за 10 минут, показатели похожи на уже существующие 5 сервисов.",a:["Копировать JSON дашборда вручную под каждый сервис","Одна панель с переменной, подставляемой в имя сервиса/job — один дашборд обслуживает все сервисы через выбор в выпадающем списке","Написать с нуля","Экспортировать в PDF и редактировать"],c:1,why:"Переменные — основной инструмент переиспользования дашбордов: один шаблон вместо копии на каждый сервис, который придётся поддерживать отдельно."}]}},

{id:"terraform",n:"Terraform: глубокое погружение",ic:"⌬",tag:"Провайдеры, модули и state на практике",
 desc:"Дальше базовой теории IaC: провайдеры вглубь, модули на практике, workspaces, импорт реальной инфраструктуры, дрейф, продвинутый CI.",
 miss:[],
 boss:{t:"Дежурство: state не сходится с реальностью",intro:"Plan показывает 40 изменений там, где менялся только тег. Проверь себя на глубоком понимании Terraform.",hp:3,
  ch:[
  {t:"q",q:"terraform plan на боевом проекте внезапно показывает 40 изменений вместо ожидаемого одного. Первое действие?",a:["Сразу apply, разберёмся по факту","Прочитать план построчно, найти общий признак (например, версия провайдера обновилась и поменяла поведение атрибута по умолчанию) прежде чем что-либо применять","Удалить state и начать заново","Откатить код на предыдущий коммит вслепую"],c:1,why:"Массовые неожиданные изменения почти всегда имеют одну системную причину — часто обновление провайдера. apply вслепую при таком плане может пересоздать половину инфраструктуры."},
  {t:"q",q:"Модуль публикуется для использования другими командами. Как зафиксировать, какие версии модуля безопасно принимать без ручной проверки каждого изменения?",a:["Не фиксировать, брать всегда latest","source с версией через ?ref=v2.3.0 (или version= для registry) и семантическое версионирование самого модуля","Копировать код модуля к себе","Заблокировать доступ всем, кроме автора"],c:1,why:"Без версионирования источника модуля любое обновление у автора модуля молча прилетает во все проекты, использующие его — риск без предупреждения."},
  {t:"q",q:"Нужно управлять окружениями (dev/stage/prod) с одинаковой структурой ресурсов, но раздельным state, без копирования .tf-файлов.",a:["Три копии одинаковых .tf-файлов в разных папках","terraform workspace (или отдельные backend-конфигурации на общий код) с переменными, различающими окружения","Один state на все окружения с тегами","Хранить всё в одной ветке git с ручным переключением"],c:1,why:"Workspaces дают один и тот же код с разным state per environment — но для сильно различающихся окружений отдельные каталоги (envs/) часто нагляднее и безопаснее."},
  {t:"q",q:"В облаке вручную создали VPC полгода назад, теперь всю инфраструктуру переводят в Terraform. С чего начинать перенос именно этого ресурса?",a:["Удалить VPC и создать новый через apply","terraform import (или import-блок) — привязать существующий VPC к адресу в коде, затем добиться, чтобы plan показывал отсутствие изменений","Скопировать ID в комментарий кода","Игнорировать, оставить как есть навсегда"],c:1,why:"Импорт без даунтайма привязывает существующий ресурс к state. Критерий успешного переноса — plan без diff: код точно описывает то, что уже создано."},
  {t:"q",q:"Провайдер только что выпустил мажорное обновление с breaking changes в нескольких ресурсах. Как обновиться безопасно на большом проекте?",a:["Сразу поднять до последней версии на проде","Сначала на некритичном окружении: обновить version constraint, прогнать plan, изучить diff и changelog провайдера, только потом раскатывать дальше","Игнорировать обновления совсем","Обновлять только .terraform.lock.hcl без изменения кода"],c:1,why:"Мажорное обновление провайдера — то же самое, что обновление любой критичной зависимости: сначала на менее рискованном окружении, с полным просмотром diff."},
  {t:"q",q:"В pipeline CI plan для prod автоматически применяется сразу после успешного прохождения, без паузы на ревью человеком.",a:["Это правильно, экономит время","Нужен ручной аппрув (approval gate) перед apply в prod: сохранённый план публикуется, ревьюер смотрит diff, только потом apply — так делает подавляющее большинство зрелых пайплайнов","Апрув нужен только для destroy","Автоматизация должна применяться абсолютно ко всему без исключений"],c:1,why:"Автоматический apply без ревью на проде — прямой путь к катастрофе от одной опечатки в PR. Ручной гейт перед прод-apply — стандартная защита в зрелых командах."}]}},

{id:"python",n:"Python для DevOps",ic:"🐍",tag:"Автоматизация, которая не помещается в bash",
 desc:"Синтаксис по минимуму нужного, файлы/JSON/YAML, subprocess, requests, argparse, свой exporter для Prometheus.",
 miss:[],
 boss:{t:"Дежурство: скрипт молчит на проде",intro:"Скрипт автоматизации не падает, но и не делает то, что должен — молча. Проверь себя на понимание питона для инфраструктурных задач.",hp:3,
  ch:[
  {t:"q",q:"Скрипт вызывает внешнюю команду через subprocess и продолжает выполняться, даже если команда реально упала с ошибкой.",a:["subprocess не умеет обрабатывать ошибки","Не проверяется код возврата — нужен check=True в subprocess.run() или ручная проверка returncode","Нужно использовать os.system вместо subprocess","Питон не видит код возврата shell-команд"],c:1,why:"Без check=True subprocess.run молча продолжает выполнение при ненулевом коде возврата — та же логика, что set -e в bash, только не включена по умолчанию."},
  {t:"q",q:"Скрипт читает пароль из переменной окружения и логирует весь конфиг целиком для отладки — включая пароль.",a:["Так и нужно делать для отладки","Нельзя логировать секреты целиком: маскировать чувствительные поля перед печатью или не логировать конфиг целиком вовсе","Пароли в переменных окружения не считаются секретами","Логи всё равно никто не читает"],c:1,why:"Тот же принцип, что и в любом другом месте инфраструктуры: секрет, попавший в лог, считается скомпрометированным — независимо от языка, на котором написан скрипт."},
  {t:"q",q:"Скрипт-exporter для Prometheus отдаёт метрики, но при каждом обращении Prometheus видит другое значение counter — то больше, то меньше предыдущего.",a:["Это нормальное поведение counter","Counter не должен уменьшаться никогда — если значение может падать, это gauge, а не counter, тип метрики выбран неверно","Нужно перезапускать exporter чаще","Prometheus сам исправит некорректные данные"],c:1,why:"counter по определению монотонно растёт и может обнулиться только при рестарте процесса. Падающее и растущее значение — это gauge, использование неверного типа метрики ломает rate() и алерты на этой метрике."},
  {t:"q",q:"Скрипт использует requests.get(url) к внутреннему API без таймаута, и раз в несколько недель весь пайплайн автоматизации зависает намертво.",a:["requests сам разрывает соединение через разумное время","По умолчанию таймаута нет вовсе — нужно явно указывать timeout=, иначе зависший сервер на другом конце подвесит скрипт бесконечно","Нужно использовать urllib вместо requests","Проблема в сети, не в коде"],c:1,why:"requests без timeout ждёт ответа неограниченно долго. Отсутствие таймаута — частая причина зависших CI-джобов и cron-задач, которые выглядят как «сервер просто иногда тупит»."},
  {t:"q",q:"Скрипт парсит YAML-конфиг через yaml.load() без указания загрузчика, и код-ревью это заблокировал.",a:["Придирка ревьюера, разницы нет","yaml.load() без safe_loader может выполнить произвольный код из вредоносного YAML — нужен yaml.safe_load()","load медленнее safe_load","load устарел и просто выдаёт warning"],c:1,why:"yaml.load с дефолтным loader'ом умеет десериализовать произвольные Python-объекты из YAML — это RCE-уязвимость на непроверенном вводе. safe_load ограничивается простыми типами данных."},
  {t:"q",q:"Скрипт автоматизации деплоя запускается без аргументов и делает деструктивное действие по умолчанию (удаляет старые релизы), если забыли явно передать флаг --keep-releases.",a:["Это нормальный дизайн CLI","Опасные операции не должны быть поведением по умолчанию — argparse должен требовать явного флага для деструктивного действия, а безопасное действие быть значением по умолчанию","argparse не поддерживает такую защиту","Нужно просто добавить документацию"],c:1,why:"Тот же принцип safe-by-default, что и в остальном DevOps: опасное действие требует явного согласия, а не срабатывает молча при обычном запуске без параметров."}]}}
];

const ROADMAP=[

 {n:"09",t:"Облако и безопасность",when:"недели 26–30",b:"VPC, IAM, managed-сервисы, секрет-менеджмент, сканирование, наименьшие привилегии, FinOps. Критерий: инфраструктура без публичных БД и статических ключей."},
 {n:"10",t:"Портфолио и собеседование",when:"недели 30–34",b:"<ul class='tight'><li>Один сквозной пет-проект: код → Docker → CI/CD → IaC → k8s → мониторинг → README со схемой.</li><li>Резюме по результатам («ускорил сборку с 40 до 9 минут»), а не по списку технологий.</li><li>30 отрепетированных ответов, включая поведенческие. 10 тренировочных собеседований — первые 3 будут провальными, это часть плана.</li></ul>"}

const W=id=>WORLDS.find(w=>w.id===id);
W("linux").miss.push(
{id:"l5",t:"systemd: сервисы навсегда",goal:"Сделать так, чтобы приложение поднималось само",
 cards:[
 {h:"Юнит-файл",b:"<pre>[Unit]\nDescription=Shop API\nAfter=network.target postgresql.service\nRequires=postgresql.service\n\n[Service]\nUser=app\nWorkingDirectory=/opt/app\nExecStart=/opt/app/bin/api --port 8080\nRestart=on-failure\nRestartSec=5\nEnvironmentFile=/etc/app/env\n\n[Install]\nWantedBy=multi-user.target</pre><p>После правки — <code>systemctl daemon-reload</code>, иначе systemd не увидит изменений.</p>"},
 {h:"start vs enable",b:"<p><code>start</code> — запустить сейчас. <code>enable</code> — запускать при загрузке. Это <b>разные вещи</b>, и забытый <code>enable</code> — классическая причина «после ребута всё исчезло».</p><pre>systemctl enable --now api   <span class='c'># и включить, и запустить</span>\nsystemctl is-enabled api\njournalctl -u api -f --since \"10 min ago\"</pre>"}],
 ch:[
 {t:"q",q:"Сервер перезагрузили — приложение не поднялось, хотя вчера работало. Что забыли?",a:["systemctl start","systemctl enable","daemon-reload","chmod"],c:1,why:"enable создаёт симлинк в multi-user.target.wants. Без него сервис не стартует при загрузке."},
 {t:"c",q:"Перечитай изменённые юнит-файлы systemd.",ans:["systemctl daemon-reload","sudo systemctl daemon-reload"],hint:"daemon-...",why:"systemd кэширует юниты в памяти. Без daemon-reload правки просто не применятся, и ты будешь искать несуществующий баг."},
 {t:"q",q:"Что делает <code>Restart=on-failure</code>?",a:["Перезапускает всегда","Перезапускает только при ненулевом коде выхода","Запрещает перезапуск","Перезапускает раз в сутки"],c:1,why:"always перезапускает даже после штатной остановки, on-failure — только после падения. Плюс RestartSec, чтобы не устроить шторм перезапусков."},
 {t:"q",q:"Где смотреть логи сервиса, который пишет в stdout?",a:["/var/log/syslog вручную","journalctl -u имя","cat /dev/stdout","нигде"],c:1,why:"systemd собирает stdout/stderr в журнал. journalctl -u api -f — живой просмотр, --since сужает окно."},
 {t:"f",q:"Допиши директиву, которая гарантирует запуск API только после базы.",pre:"[Unit]\nDescription=Shop API\n___=postgresql.service",ans:["requires","after"],hint:"жёсткая зависимость",why:"Requires= — жёсткая зависимость, After= — только порядок запуска. На практике нужны обе строки."}]},
{id:"l6",t:"Планировщик и фоновые задачи",goal:"Автоматизировать рутину по расписанию",
 cards:[
 {h:"cron",b:"<pre>crontab -e     <span class='c'># редактировать задания пользователя</span>\ncrontab -l\n\n<span class='c'># мин час день месяц день_недели</span>\n0 3 * * *   /opt/scripts/backup.sh\n*/5 * * * * /opt/scripts/check.sh >> /var/log/check.log 2>&amp;1</pre><p>Главная ловушка: у cron <b>минимальное окружение</b> — нет твоего PATH и переменных. Пиши абсолютные пути и подгружай env явно.</p>"},
 {h:"systemd timer — современная замена",b:"<pre># backup.timer\n[Timer]\nOnCalendar=*-*-* 03:00:00\nPersistent=true</pre><p>Плюсы перед cron: логи в journalctl, зависимости, <code>Persistent=true</code> догоняет пропущенный запуск после выключения машины.</p>"}],
 ch:[
 {t:"q",q:"Что означает <code>*/5 * * * *</code>?",a:["Каждые 5 часов","Каждые 5 минут","Раз в 5 дней","В 5:00"],c:1,why:"Первое поле — минуты. */5 = каждые пять минут. Порядок полей: мин, час, день месяца, месяц, день недели."},
 {t:"q",q:"Скрипт работает руками, но молча не работает из cron. Первая гипотеза?",a:["Cron сломан","Другое окружение: PATH и переменные не те, нужны абсолютные пути","Нет прав root","Диск полон"],c:1,why:"И вторая гипотеза — не перенаправлен вывод, поэтому ошибку никто не видит. Всегда добавляй >> log 2>&1."},
 {t:"q",q:"Чем systemd timer лучше cron для продакшена?",a:["Ничем","Логи в journalctl, зависимости от других юнитов и догон пропущенных запусков","Быстрее","Проще синтаксис"],c:1,why:"Плюс timer можно запустить вручную как обычный сервис и посмотреть результат — с cron так не получится."},
 {t:"q",q:"Бэкап по cron «работает» полгода. Что обязательно проверить?",a:["Размер лога","Что бэкап реально восстанавливается — тестовое восстановление","Версию cron","Права на скрипт"],c:1,why:"Непроверенный бэкап — это не бэкап. Восстановление тестируют по расписанию, а не в день аварии."}]}
);
W("net").miss.push(
{id:"n5",t:"Firewall и доступы",goal:"Закрыть всё лишнее и не отрезать себя",
 cards:[
 {h:"Принцип",b:"<p>По умолчанию — <b>запрещено всё входящее</b>, разрешено только нужное. Открытый наружу порт БД — самая частая причина взлома небольших проектов.</p><pre>ufw default deny incoming\nufw allow 22/tcp\nufw allow 80,443/tcp\nufw enable\nufw status numbered</pre>"},
 {h:"Как не отрезать себе руки",b:"<p>Сначала разреши SSH, потом включай фаервол. Если работаешь удалённо — держи вторую открытую сессию, пока не убедишься, что новое правило не выкинуло тебя.</p><p>В облаке фаервол обычно двухслойный: security group у провайдера + локальный. Проверяй оба, когда «порт открыт, но не отвечает».</p>"}],
 ch:[
 {t:"q",q:"Правильная политика по умолчанию для входящего трафика?",a:["allow","deny","reject всё, включая 22","зависит"],c:1,why:"deny incoming + точечные разрешения. Обратный подход («закроем плохое») не масштабируется."},
 {t:"q",q:"Порт 5432 открыт в security group на 0.0.0.0/0. Насколько это плохо?",a:["Нормально, есть пароль","Критично: БД доступна всему интернету, её найдут сканеры за часы","Не важно","Только если нет TLS"],c:1,why:"Публичные БД сканируют массово. Доступ — только из приватной сети или через туннель."},
 {t:"c",q:"Проверь, слушает ли что-то порт 5432 и какой процесс.",ans:["ss -tulpn | grep 5432","ss -tulpn|grep 5432","netstat -tulpn | grep 5432","ss -tulpn | grep postgres"],hint:"ss + пайп в grep",why:"Смотри ещё и адрес: 127.0.0.1:5432 — только локально (хорошо), 0.0.0.0:5432 — на всех интерфейсах (опасно)."},
 {t:"q",q:"Порт открыт в ufw, приложение слушает, но снаружи не подключиться. Что проверить в облаке?",a:["Только DNS","Security group / сетевой ACL провайдера — второй слой фильтрации","Версию ядра","Права на файл"],c:1,why:"Два фаервола — две точки отказа. Проверяй оба слоя и маршрут (traceroute/nc)."}]},
{id:"n6",t:"Балансировка и заголовки",goal:"Понять, что видит приложение за прокси",
 cards:[
 {h:"X-Forwarded-For и Host",b:"<p>За прокси приложение видит IP <b>балансировщика</b>, а не клиента. Реальный адрес приходит в заголовках:</p><pre>proxy_set_header Host              $host;\nproxy_set_header X-Real-IP         $remote_addr;\nproxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;\nproxy_set_header X-Forwarded-Proto $scheme;</pre><p>Забыл <code>Host</code> — приложение строит неправильные ссылки и редиректы. Забыл <code>X-Forwarded-Proto</code> — получишь бесконечный редирект http↔https.</p>"},
 {h:"Алгоритмы и здоровье",b:"<ul><li><b>round-robin</b> — по кругу (по умолчанию).</li><li><b>least_conn</b> — тому, у кого меньше активных соединений.</li><li><b>ip_hash</b> / sticky — привязка клиента к бэкенду (нужно для сессий в памяти).</li></ul><p>Балансировщик должен проверять здоровье бэкендов и выводить больные из ротации, иначе он честно раздаёт трафик в мёртвый узел.</p>"}],
 ch:[
 {t:"q",q:"В логах приложения у всех запросов один и тот же IP. Почему?",a:["Атака с одного адреса","Это IP балансировщика; реальный клиент — в X-Forwarded-For","Ошибка приложения","Проблема DNS"],c:1,why:"Нужно и передать заголовок в прокси, и научить приложение ему доверять (trusted proxies) — иначе подделают."},
 {t:"q",q:"Бесконечный редирект после включения HTTPS на балансировщике. Причина?",a:["Плохой сертификат","Приложение не знает, что снаружи https — не передан X-Forwarded-Proto","DNS","Кэш браузера"],c:1,why:"Приложение видит http и редиректит на https, балансировщик снова отдаёт http внутрь. Петля."},
 {t:"q",q:"Сессии пользователей рвутся при балансировке на 3 сервера. Быстрое и правильное решения?",a:["Только ip_hash навсегда","Быстро — sticky-сессии; правильно — хранить сессии в Redis/БД, сделав приложение stateless","Один сервер","Отключить балансировку"],c:1,why:"Stateless-приложение масштабируется горизонтально без ограничений. Sticky — костыль на переходный период."},
 {t:"q",q:"Зачем балансировщику healthcheck бэкендов?",a:["Для статистики","Чтобы не отправлять трафик в неработающий узел","Для логов","Для сертификатов"],c:1,why:"Без проверки здоровья часть пользователей стабильно получает ошибки — ровно 1/N трафика."}]}
);
W("git").miss.push(
{id:"g4",t:"Версии, теги и релизы",goal:"Связать код с тем, что реально работает на проде",
 cards:[
 {h:"Semver и теги",b:"<pre>v2.4.1\n│ │ └── patch: исправление, обратно совместимо\n│ └──── minor: новая функция, совместимо\n└────── major: ломающее изменение</pre><pre>git tag -a v2.4.1 -m \"релиз\"\ngit push origin v2.4.1</pre><p>Аннотированный тег (<code>-a</code>) хранит автора и дату — по нему пайплайн запускает прод-деплой.</p>"},
 {h:"Связь тега и артефакта",b:"<p>Образ тегируется хешем коммита: <code>registry/app:1a2b3c4</code>. Тогда по работающему контейнеру ты за секунду находишь точный код. <code>latest</code> такой связи не даёт — и расследование инцидента превращается в гадание.</p>"}],
 ch:[
 {t:"q",q:"Изменили формат ответа API, старые клиенты сломаются. Какую часть версии поднимаем?",a:["patch","minor","major","никакую"],c:2,why:"Ломающее изменение = major. Это контракт с потребителями твоего API."},
 {t:"c",q:"Создай аннотированный тег v1.0.0 с сообщением «первый релиз».",ans:['git tag -a v1.0.0 -m первый релиз','git tag -a v1.0.0 -m "первый релиз"',"git tag -a v1.0.0"],hint:"git tag -a ... -m ...",why:"Затем git push origin v1.0.0 — теги не уезжают обычным git push."},
 {t:"q",q:"Как быстро понять, какой код работает в контейнере на проде?",a:["Спросить разработчика","По тегу образа = хеш коммита","Открыть логи","Никак"],c:1,why:"Неизменяемые теги — основа воспроизводимости. Ещё лучше — вшить версию и git-sha в /health-эндпоинт."},
 {t:"q",q:"Что такое CHANGELOG и откуда он берётся у зрелой команды?",a:["Пишется вручную перед релизом","Генерируется автоматически из conventional commits","Не нужен","Из логов CI"],c:1,why:"feat/fix/BREAKING CHANGE → автоматический changelog и версия. Дисциплина коммитов окупается."}]}
);

/* =====================================================================
   ДОПОЛНЕНИЕ ПО ПРОГРАММЕ «DevOps: Junior» (Stepik)
   Закрываем темы, которые есть в модулях курсов, но отсутствовали у нас

W("linux").miss.push(
{id:"l7",t:"Пакеты, пользователи, sudo",goal:"Управлять системой, а не только смотреть на неё",
 cards:[
 {h:"Пакетные менеджеры",b:"<pre>apt update &amp;&amp; apt upgrade      <span class='c'># Debian/Ubuntu</span>\napt install -y nginx\napt list --installed | grep nginx\napt remove nginx / apt purge nginx\n\ndnf install nginx               <span class='c'># RHEL/Fedora/Rocky</span>\napk add nginx                   <span class='c'># Alpine (внутри контейнеров)</span></pre><p>Различие семейств важно: на собеседовании спрашивают «а если RHEL?». Ответ: <code>dnf/yum</code>, конфиги в тех же местах, но SELinux включён по умолчанию.</p>"},
 {h:"Пользователи и права",b:"<pre>adduser deploy\nusermod -aG sudo deploy         <span class='c'># добавить в группу, -a обязателен!</span>\nsu - deploy\nsudo -u app whoami\ngroups deploy\nid deploy</pre><p><code>usermod -G</code> без <code>-a</code> <b>заменяет</b> все группы пользователя — классический способ отобрать у себя sudo. Всегда <code>-aG</code>.</p>"},
 {h:"Сервисные пользователи",b:"<p>Приложение не должно работать от root. Создают отдельного пользователя без домашней папки и без shell:</p><pre>useradd -r -s /usr/sbin/nologin app</pre><p>Тот же принцип в контейнерах (<code>USER node</code>) и в Kubernetes (<code>securityContext.runAsNonRoot</code>). Это одна идея на трёх уровнях."}],
 ch:[
 {t:"c",q:"Установи nginx на Ubuntu без вопросов подтверждения.",ans:["apt install -y nginx","sudo apt install -y nginx","apt-get install -y nginx","sudo apt-get install -y nginx"],hint:"apt install + флаг «да на всё»",why:"Перед этим apt update — иначе поставится версия из устаревшего индекса или пакет вообще не найдётся."},
 {t:"q",q:"Что делает <code>usermod -aG docker deploy</code>?",a:["Заменяет группы пользователя на docker","Добавляет пользователя в группу docker, сохраняя остальные","Удаляет из группы","Создаёт пользователя"],c:1,why:"Без -a список групп перезапишется. И отдельно: группа docker = фактически root на хосте, давать её надо осознанно."},
 {t:"q",q:"Зачем сервисному пользователю <code>-s /usr/sbin/nologin</code>?",a:["Для скорости","Чтобы под этим аккаунтом нельзя было зайти интерактивно — сузить поверхность атаки","Так короче","Обязательно для systemd"],c:1,why:"Если приложение скомпрометируют, атакующий не получит рабочую оболочку. Тот же принцип, что USER в Dockerfile."},
 {t:"q",q:"Разница между <code>apt remove</code> и <code>apt purge</code>?",a:["Никакой","purge удаляет ещё и конфигурационные файлы","remove быстрее","purge только для ядра"],c:1,why:"После remove конфиги остаются в /etc — иногда это спасает, иногда мешает переустановке «начисто»."}]}
);

/* ===== ПЛАН, ПЕРЕСОБРАННЫЙ ПО ПРОГРАММЕ «DevOps: Junior» ===== */
ROADMAP.length=0;
ROADMAP.push(
{n:"00",t:"Подготовка окружения",when:"1–3 дня",
 b:"<ul class='tight'><li>Linux под рукой: WSL2 на Windows, VirtualBox с Ubuntu Server или (лучше всего) VPS за ~200 ₽/мес — это настоящий сервер, на нём и шрамы настоящие.</li><li>Docker Desktop или docker engine, аккаунт GitHub, VS Code, терминал.</li><li>Ритм: <b>20–40 минут в день без пропусков</b>. Стрик в игре — про это.</li></ul>"},
{n:"01",t:"DevOps как профессия",when:"первая неделя",
 b:"<p>Зачем всё это: жизненный цикл ПО, зоны ответственности, что такое доставка и почему «работает у меня» — не аргумент. Короткий блок, но без него дальше учишь команды без смысла.</p><p class='muted' style='font-size:13.5px'>В игре: вступительные карточки миров и мир «Терминал и Linux».</p>"},
{n:"02",t:"Linux",when:"недели 1–3",
 b:"<p>По модулям курса: файловая система и навигация, права, владельцы и специальные биты, ссылки и архивы, vim, перенаправление потоков, grep/sed/awk, bash-скрипты, пакетные менеджеры и пользователи, процессы (состояния, сигналы, приоритеты, load average, cgroups), systemd и планировщики, сеть и SSH, логирование и logrotate, диски, монтирование и LVM, безопасность и резервное копирование.</p><p><b>Критерий готовности:</b> чинишь «сервис не поднялся» и «кончилось место» без гугла на базовых шагах.</p><p class='muted' style='font-size:13.5px'>В игре: мир 1 — 14 миссий + 2 лаборатории (диск заполнен, сервис не стартует). Самый большой блок: это фундамент, на который ложится всё остальное.</p>"},
{n:"03",t:"Git",when:"недели 2–4, параллельно",
 b:"<p>По модулям курса: настройка (config, SSH-ключи), три зоны, ветки, fast-forward и 3-way merge, разрешение конфликтов, удалённые репозитории, переписывание истории (amend, rebase -i, cherry-pick), спасение (reflog, bisect, blame), работа в команде и PR-процесс, теги и semver, хуки, подмодули, LFS, worktree.</p><p><b>Критерий:</b> спокойно откатываешь плохой коммит в общей ветке и объясняешь, почему не force push.</p><p class='muted' style='font-size:13.5px'>В игре: мир 3 — 7 миссий + 2 лаборатории (утечка секрета, поиск сломавшего коммита через bisect).</p>"},
{n:"04",t:"Docker",when:"недели 4–8",
 b:"<p>По модулям курса: контейнеризация vs виртуализация, архитектура и сущности, ключевые команды, работа внутри контейнера, логи, образы и Dockerfile, продвинутые инструкции, best practices, сети, тома, Compose, registry, healthcheck и BuildKit, обзор оркестрации.</p><p><b>Критерий:</b> свой образ меньше 100 МБ через multi-stage, стек из трёх сервисов в compose, данные переживают пересоздание.</p><p class='muted' style='font-size:13.5px'>В игре: мир 4 — 6 миссий + 2 лаборатории (рестарт-петля, ревью Dockerfile на 1.8 ГБ).</p>"},
{n:"05",t:"CI/CD: GitLab CI и GitHub Actions",when:"недели 8–11",
 b:"<p>По модулям курса: что такое CI/CD, структура .gitlab-ci.yml, jobs и stages, rules, needs и dependencies, manual и approval, переменные и защищённые секреты, artifacts, cache и reports, Docker executor и сборка образов (socket / DinD / kaniko), Container Registry, environments и стратегии деплоя, шаблоны и include, дебаг пайплайнов. Плюс GitHub Actions как второй распространённый формат.</p><p><b>Критерий:</b> push в main сам собирает образ, публикует его и выкатывает; прод — по кнопке; откат отработан.</p><p class='muted' style='font-size:13.5px'>В игре: мир 5 — 8 миссий + лаборатория «красный пайплайн».</p>"},
{n:"06",t:"Kubernetes",when:"недели 11–19",
 b:"<p>По модулям курса: архитектура кластера, локальное окружение (minikube/kind/k3s), контексты и namespace, Pod → ReplicaSet → Deployment → Service, ConfigMap и Secret, хранилища и StatefulSet, сетевая модель и Ingress, ресурсы и масштабирование (requests/limits, HPA), жизненный цикл (init-контейнеры, Job/CronJob, graceful shutdown), мониторинг и отладка, безопасность (RBAC, securityContext, NetworkPolicy), Helm и GitOps.</p><p><b>Критерий:</b> приложение развёрнуто в своём кластере с ингрессом, пробами, лимитами, автоскейлом и рабочим откатом.</p><p class='muted' style='font-size:13.5px'>В игре: мир 7 — 9 миссий + 2 лаборатории (CrashLoopBackOff, Service без endpoints). Самый длинный блок — так и должно быть.</p>"},
{n:"07",t:"Ansible",when:"недели 19–21",
 b:"<p>Инвентарь, плейбуки, модули и идемпотентность, шаблоны Jinja2, роли, handlers, ansible-vault, сухой прогон <code>--check</code>.</p><p><b>Критерий:</b> одним плейбуком приводишь чистый сервер в рабочее состояние, повторный запуск ничего не меняет.</p><p class='muted' style='font-size:13.5px'>В игре: мир 6, миссия «Ansible».</p>"},
{n:"07b",t:"Python для автоматизации",when:"параллельно с недели 15",
 b:"<p>Необязательный, но сильно облегчающий жизнь блок: синтаксис по минимуму нужного, файлы и pathlib, JSON/YAML (и почему <code>yaml.safe_load</code>, а не <code>yaml.load</code>), subprocess с <code>check</code>/<code>timeout</code>, requests к внутренним API, argparse для собственных CLI-утилит, logging вместо print, свой exporter для Prometheus как сквозной пример.</p><p><b>Критерий:</b> написал скрипт автоматизации (например, чистка старых образов или свой health-check), которым реально пользуешься, а не просто прочитал синтаксис.</p><p class='muted' style='font-size:13.5px'>В игре: мир «Python для DevOps» — 8 миссий + босс. Bash — для однострочников и пайплайнов, Python — когда логика перестаёт помещаться в одну строку.</p>"},
{n:"—",t:"Дальше начинается middle",when:"",
 b:"<p>Всё выше — это уверенный <b>junior</b> и содержание программы курсов. Следующие пять блоков программа не покрывает, но без них на middle не берут: именно про них спрашивают в конце собеседования, когда базовые вопросы закончились.</p>"},
{n:"08",t:"Сети, nginx, TLS",when:"недели 21–24",
 b:"<p>Путь HTTP-запроса целиком, DNS и типы записей, TCP и TLS, коды ответов (502 vs 504), nginx как reverse proxy, заголовки за прокси, SSH и туннели, firewall.</p><p><b>Критерий:</b> развернул сайт на своём домене с валидным HTTPS и умеешь диагностировать разрыв на любом участке цепочки.</p><p class='muted' style='font-size:13.5px'>В игре: мир 2 — 6 миссий + 2 лаборатории (502 Bad Gateway, истёкший сертификат).</p>"},
{n:"09",t:"Terraform и IaC",when:"недели 24–27",
 b:"<p>Декларативность и идемпотентность, провайдеры, цикл init/plan/apply, state и блокировки, ForceNew-атрибуты, модули, разделение окружений, terraform в CI.</p><p><b>Критерий:</b> одной командой поднимаешь всю инфраструктуру с нуля и так же сносишь; state лежит в защищённом бэкенде.</p><p class='muted' style='font-size:13.5px'>В игре: мир 6 — 4 миссии + лаборатория «terraform хочет удалить прод».</p>"},
{n:"09b",t:"Terraform: глубокое погружение",when:"недели 27–29, по желанию",
 b:"<p>Для тех, кто хочет закрыть Terraform не «на уровне junior», а по-настоящему: провайдеры вглубь (alias, версии, breaking changes), модули на практике (registry vs git ref, композиция, <code>terraform test</code>), workspaces и структура окружений, импорт реальной инфраструктуры (<code>import</code>-блок, <code>-generate-config-out</code>), Terraform в продвинутом CI/CD (Atlantis, approval gate, <code>prevent_destroy</code>).</p><p><b>Критерий:</b> уверенно импортируешь руками созданный ресурс в state и добиваешься <code>plan</code> без изменений; знаешь, чем grafana workspace отличается от отдельного каталога окружения.</p><p class='muted' style='font-size:13.5px'>В игре: мир «Terraform: глубокое погружение» — 5 миссий + босс. Не дублирует базовый мир IaC, а идёт дальше него.</p>"},
{n:"10",t:"Мониторинг и SRE",when:"недели 27–30",
 b:"<p>Метрики, логи, трейсы; Prometheus и PromQL, Grafana, Loki; RED и USE, перцентили; алерты, которым верят; SLI/SLO и error budget; дежурство, runbook и постмортемы.</p><p><b>Критерий:</b> у пет-проекта есть дашборд, работающий алерт и написанный runbook.</p><p class='muted' style='font-size:13.5px'>В игре: мир 8 — 5 миссий + лаборатория «ночной алерт 5xx».</p>"},
{n:"10b",t:"Zabbix: классический мониторинг",when:"недели 30–31, по желанию",
 b:"<p>Многие компании до сих пор держат Zabbix параллельно или вместо Prometheus — особенно там, где мониторят не только приложения, но и сетевое оборудование, ИБП, принтеры. Архитектура (Server/Agent/Proxy), items и триггеры, гистерезис и trigger dependency, шаблоны и Low-Level Discovery, действия и эскалации.</p><p><b>Критерий:</b> понимаешь разницу между Zabbix и Prometheus не на уровне «оба для мониторинга», а по архитектуре (push/pull, где хранится состояние, как эскалируются уведомления) — это регулярный вопрос на собеседовании в компаниях с гетерогенной инфраструктурой.</p><p class='muted' style='font-size:13.5px'>В игре: мир «Zabbix» — 6 миссий + босс.</p>"},
{n:"10c",t:"Prometheus и Grafana в деталях",when:"недели 31–33, по желанию",
 b:"<p>Углублённая практика поверх базового мира «Мониторинг»: PromQL с нуля до p95 (агрегация, histogram_quantile, топ-N), экспортёры и инструментирование своего приложения, service discovery и relabeling, recording rules, Alertmanager (route, silence, inhibition), пределы масштабирования Prometheus (federation, remote_write). Отдельно — Grafana: переменные и каскадные фильтры, алертинг поверх любого источника, права доступа и provisioning, дашборд, который не создаёт ложного спокойствия (перцентили вместо среднего, аннотации деплоев).</p><p><b>Критерий:</b> пишешь PromQL-запрос с нуля, а не копируешь из документации; можешь объяснить, почему alert молчит, хотя должен был сработать.</p><p class='muted' style='font-size:13.5px'>В игре: миры «Prometheus» (6 миссий + босс) и «Grafana» (5 миссий + босс).</p>"},
{n:"11",t:"Облако, безопасность, бэкапы",when:"недели 30–33",
 b:"<p>IaaS/PaaS/SaaS и разделяемая ответственность, VPC и приватные подсети, IAM и наименьшие привилегии, секрет-менеджмент и OIDC вместо статических ключей, сканирование образов и зависимостей, FinOps, бэкапы, RPO/RTO и тестовое восстановление.</p><p><b>Критерий:</b> в твоей инфраструктуре нет публичных БД, статических ключей и непроверенных бэкапов.</p><p class='muted' style='font-size:13.5px'>В игре: мир 9 — 4 миссии.</p>"},
{n:"12",t:"Портфолио и собеседование",when:"недели 33–36",
 b:"<ul class='tight'><li><b>Один сквозной пет-проект</b> (аналог итоговых проектов курсов, но общий): приложение → multi-stage Dockerfile → CI/CD → registry → Terraform → Kubernetes с мониторингом → README со схемой архитектуры.</li><li>Резюме по результатам («ускорил сборку с 40 до 9 минут»), а не по списку технологий.</li><li>30 отрепетированных ответов вслух, включая поведенческие; 10 тренировочных собеседований — первые три будут провальными, это часть плана.</li></ul><p class='muted' style='font-size:13.5px'>В игре: мир 9, миссия «Подготовка к собеседованию» + финальный босс из 8 вопросов.</p>"}
);

{id:"l8",t:"Vim: выжить и отредактировать",goal:"Править конфиг на сервере, где нет твоего редактора",
 cards:[
 {h:"Два режима — вся суть",b:"<p>Vim открывается в <b>командном</b> режиме: буквы — это команды, а не текст. Чтобы печатать, надо войти в режим вставки.</p><pre>i        <span class='c'># вставка перед курсором</span>\na        <span class='c'># вставка после курсора</span>\no        <span class='c'># новая строка ниже и вставка</span>\nEsc      <span class='c'># вернуться в командный режим</span></pre><div class='analogy'><b>Аналогия:</b> это как боевой режим и режим строительства в игре. Нажал не ту кнопку не в том режиме — построил дом вместо выстрела.</div>"},
 {h:"Выйти и сохранить",b:"<pre>:w       <span class='c'># сохранить</span>\n:q       <span class='c'># выйти</span>\n:wq      <span class='c'># сохранить и выйти</span>\n:q!      <span class='c'># выйти без сохранения (когда всё испортил)</span>\n:w !sudo tee %   <span class='c'># сохранить файл, открытый без sudo</span></pre><p>Последняя строка спасала на проде тысячи людей: открыл <code>/etc/nginx/nginx.conf</code> без sudo, всё поправил, а записать не можешь.</p>"},
 {h:"Минимум для работы",b:"<pre>/слово   <span class='c'># поиск, n — следующее совпадение</span>\ndd       <span class='c'># удалить строку</span>\nyy / p   <span class='c'># копировать строку / вставить</span>\nu        <span class='c'># отменить, Ctrl+r — вернуть</span>\ngg / G   <span class='c'># в начало / в конец файла</span>\n:set nu  <span class='c'># номера строк</span>\n:%s/old/new/g   <span class='c'># замена по всему файлу</span></pre><p>Этого хватает на 95% серверных задач. Nano проще, но его нет в минимальных образах и на многих серверах — а vi есть везде.</p>"}],
