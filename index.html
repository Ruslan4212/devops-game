{id:"l1",t:"Первый вход на сервер",goal:"Ориентироваться в чужой системе вслепую",
 cards:[
 {h:"Терминал — это диалог, а не магия",b:"<p>Ты пишешь команду — система отвечает. Формат почти всегда один:</p><pre><span class='k'>команда</span> -флаги аргумент</pre><p><code>ls -la /etc</code>: команда <code>ls</code>, флаги <code>-l</code> и <code>-a</code> (склеены), аргумент — каталог.</p><p>Флаги бывают короткие (<code>-l</code>) и длинные (<code>--all</code>). Короткие склеиваются: <code>-la</code> = <code>-l -a</code>. Если флаг требует значение, оно идёт следом: <code>tail -n 50</code>.</p><div class='analogy'><b>Аналогия:</b> флаги — настройки матча перед стартом, аргумент — карта, на которой играешь.</div>"},
 {h:"Три команды, с которых начинается любая смена",b:"<pre>pwd            <span class='c'># где я сейчас (print working directory)</span>\nls -la         <span class='c'># что здесь лежит: l=подробно, a=включая скрытые</span>\ncd /var/log    <span class='c'># перейти в каталог</span></pre><p>Формы <code>cd</code>, которые надо помнить:</p><div class='tw'><table><tr><th>команда</th><th>куда</th></tr><tr><td><code>cd ..</code></td><td>на уровень вверх</td></tr><tr><td><code>cd ~</code> или просто <code>cd</code></td><td>в домашний каталог</td></tr><tr><td><code>cd -</code></td><td>назад, где был до этого</td></tr><tr><td><code>cd /</code></td><td>в корень системы</td></tr></table></div>"},
 {h:"Абсолютный и относительный путь",b:"<p><b>Абсолютный</b> начинается со слэша и не зависит от того, где ты стоишь: <code>/var/log/nginx/error.log</code>.</p><p><b>Относительный</b> отсчитывается от текущего каталога: <code>nginx/error.log</code>, <code>../etc/hosts</code>.</p><ul><li><code>.</code> — текущий каталог</li><li><code>..</code> — родительский</li><li><code>~</code> — домашний каталог пользователя</li></ul><p><b>Правило безопасности:</b> в скриптах и в командах, которые что-то удаляют или перезаписывают, всегда пиши абсолютные пути. Относительный путь плюс неверный текущий каталог — классический способ снести не то.</p>"},
 {h:"Карта чужой системы",b:"<div class='tw'><table><tr><th>каталог</th><th>что там</th></tr><tr><td><code>/etc</code></td><td>конфигурации всех сервисов. Первое место, куда идёшь настраивать</td></tr><tr><td><code>/var/log</code></td><td>логи. Первое место при аварии</td></tr><tr><td><code>/var/lib</code></td><td>данные сервисов: базы, docker, пакеты</td></tr><tr><td><code>/home/имя</code></td><td>файлы пользователя</td></tr><tr><td><code>/root</code></td><td>домашний каталог root (не в /home!)</td></tr><tr><td><code>/opt</code></td><td>стороннее ПО, часто сюда кладут приложения</td></tr><tr><td><code>/tmp</code></td><td>временные файлы, чистятся при перезагрузке</td></tr><tr><td><code>/usr/bin</code>, <code>/usr/local/bin</code></td><td>сами программы</td></tr><tr><td><code>/proc</code>, <code>/sys</code></td><td>виртуальные ФС ядра: живое состояние системы</td></tr></table></div>"},
 {h:"Как читать вывод ls -la",b:"<pre>drwxr-xr-x  2 root  root   4096 фев 12 09:14 nginx\n-rw-r--r--  1 app   app   84213 фев 12 09:41 app.log\n│└──┬──┘    │  │     │      │        │          │\n│   │       │  │     │      │        │          └ имя\n│   │       │  │     │      │        └ дата изменения\n│   │       │  │     │      └ размер в байтах\n│   │       │  │     └ группа\n│   │       │  └ владелец\n│   │       └ число ссылок\n│   └ права доступа\n└ тип: d каталог, - обычный файл, l символическая ссылка</pre><p>Первый символ — самый информативный. Увидел <code>l</code> — перед тобой ссылка, и настоящий файл лежит в другом месте.</p>"},
 {h:"Когда не знаешь команду",b:"<pre>man ls          <span class='c'># полное руководство (q — выход, /слово — поиск)</span>\nls --help       <span class='c'># краткая справка, работает почти везде</span>\nwhich nginx     <span class='c'># где лежит бинарник</span>\ntype cd         <span class='c'># что это: программа, встроенная команда, алиас</span></pre><p><code>--help</code> быстрее <code>man</code> и работает в контейнерах, где man обычно не установлен.</p>"}],
 ch:[
 {t:"c",d:1,q:"Ты подключился по SSH и не понимаешь, в каком каталоге оказался. Спроси систему.",ans:["pwd"],hint:"print working directory",why:"pwd — твой компас и первая команда на незнакомом сервере."},
 {t:"c",d:2,q:"Покажи всё содержимое текущего каталога: подробно и включая скрытые файлы.",ans:["ls -la","ls -al","ls -a -l","ls -l -a"],hint:"два флага: подробно + all",why:"Скрытые файлы начинаются с точки (.env, .git, .ssh). Без -a ты их не увидишь и потеряешь час на поиск «пропавшего» конфига."},
 {t:"q",d:2,q:"Строка вывода начинается с символа <code>l</code>. Что это за файл?",a:["Каталог","Символическая ссылка — настоящий файл лежит в другом месте","Файл только для чтения","Лог-файл"],c:1,why:"Первый символ — тип: d каталог, - обычный файл, l ссылка. Не поняв этого, легко править ссылку вместо оригинала."},
 {t:"q",d:3,q:"Ты в <code>/var/log/nginx</code> и хочешь открыть <code>/etc/hosts</code>. Какой путь короче и надёжнее?",a:["<code>../../../etc/hosts</code> — относительный","<code>/etc/hosts</code> — абсолютный","<code>~/etc/hosts</code>","<code>./etc/hosts</code>"],c:1,why:"Абсолютный путь не зависит от текущего каталога. Правило: всё, что читает или изменяет системные файлы, пишем абсолютными путями."},
 {t:"o",d:4,q:"Тебя пустили на незнакомый сервер и сказали «разберись, что тут вообще происходит». Расставь первые шаги в разумном порядке.",items:["pwd — понять, где я оказался","ls -la — увидеть содержимое, включая скрытое","cd /etc — посмотреть, какие сервисы настроены","cd /var/log — заглянуть в логи этих сервисов"],why:"Сначала точка отсчёта, потом окружение, потом конфигурации, потом их следы в логах. Обратный порядок заставляет гадать."},
 {t:"q",d:5,q:"<b>Инцидент.</b> Коллега просит: «зайди на сервер и удали старые файлы в каталоге релиза». Ты подключаешься, набираешь <code>rm -rf releases/old</code> — и получаешь «No such file or directory». Что делать?",a:["Повторить команду с sudo","Проверить <code>pwd</code>: ты не в том каталоге, откуда отсчитывается относительный путь","Добавить флаг -f","Перезагрузить сервер"],c:1,why:"Относительный путь считается от текущего каталога. Здесь ошибка спасла: та же команда из другого места могла удалить чужие данные. Поэтому в удаляющих командах — абсолютный путь и проверка через ls перед rm."}]},

{id:"l2",t:"Чтение логов",goal:"Найти нужное в сотнях мегабайт текста",
 cards:[
 {h:"Файл не обязательно открывать целиком",b:"<pre>cat file.log       <span class='c'># вывалить весь файл в терминал</span>\nless file.log      <span class='c'># листать: q выход, /слово поиск, G в конец</span>\nhead -20 file.log  <span class='c'># первые 20 строк</span>\ntail -50 file.log  <span class='c'># последние 50 строк</span>\ntail -f app.log    <span class='c'># следить в реальном времени</span></pre><p><code>cat</code> на файле в гигабайт залипнет и завалит терминал. На больших файлах — <code>less</code>, <code>head</code>, <code>tail</code>.</p><p><code>tail -f</code> — самая частая команда дежурного: смотришь лог живьём, пока коллега воспроизводит баг. <code>tail -F</code> надёжнее: переживает ротацию, когда файл пересоздали.</p>"},
 {h:"grep — поисковик по тексту",b:"<div class='tw'><table><tr><th>флаг</th><th>что делает</th></tr><tr><td><code>-i</code></td><td>без учёта регистра</td></tr><tr><td><code>-c</code></td><td>сколько строк совпало (не совпадений!)</td></tr><tr><td><code>-n</code></td><td>показать номера строк</td></tr><tr><td><code>-v</code></td><td>инвертировать: строки БЕЗ совпадения</td></tr><tr><td><code>-r</code></td><td>рекурсивно по каталогу</td></tr><tr><td><code>-A5</code> / <code>-B5</code> / <code>-C5</code></td><td>5 строк после / до / вокруг</td></tr></table></div><pre>grep -c ERROR app.log\ngrep -C5 \"connection refused\" app.log\ngrep -rn timeout /etc/nginx/</pre>"},
 {h:"Контекст важнее самой ошибки",b:"<p>Строка <code>ERROR: connection refused</code> сама по себе не говорит ничего. Ценность — в том, что было <b>до</b> неё (какой запрос, к чему подключались) и <b>после</b> (упало приложение или повторило попытку).</p><p>Поэтому <code>grep -C5</code> в разборе инцидента полезнее голого <code>grep</code>: ты сразу видишь сцену целиком, а не отдельный крик.</p>"},
 {h:"Пайп: конвейер из простых команд",b:"<p>Символ <code>|</code> отдаёт вывод одной команды на вход другой. Так из примитивов собираются точные ответы.</p><pre>cat access.log | grep \" 500 \" | wc -l\n<span class='c'># сколько всего было пятисоток</span>\n\ngrep ERROR app.log | tail -20\n<span class='c'># двадцать последних ошибок</span></pre><p><code>wc -l</code> считает строки. Пара <code>grep ... | wc -l</code> эквивалентна <code>grep -c</code>.</p><div class='analogy'><b>Аналогия:</b> это крафт. Каждая команда — простой ингредиент, пайп — верстак.</div>"},
 {h:"Сузить по времени",b:"<p>В инциденте важен не весь лог, а окно вокруг события. Способы сузить:</p><pre>grep \"09:4\" app.log            <span class='c'># всё за 09:40–09:49</span>\ngrep \"2025-02-12 09:4\" app.log <span class='c'># точнее, с датой</span>\ntail -2000 app.log | grep ERROR <span class='c'># только свежий хвост</span></pre><p>Сначала сузь окно, потом фильтруй по слову. Обратный порядок заставит систему перечитать гигабайты."},
 {h:"Где искать, если логов нет там, где ждёшь",b:"<ul><li><code>/var/log/syslog</code> или <code>/var/log/messages</code> — общий системный журнал</li><li><code>/var/log/nginx/{access,error}.log</code> — веб-сервер</li><li><code>journalctl -u имя</code> — журнал systemd-сервиса (о нём отдельная миссия)</li><li>внутри контейнера приложение обычно пишет в stdout, а не в файл</li></ul>"}],
 ch:[
 {t:"c",d:1,q:"Покажи последние 50 строк файла /var/log/syslog.",ans:["tail -n 50 /var/log/syslog","tail -50 /var/log/syslog"],hint:"tail -n число",why:"tail -n N — стандарт разбора. Начинать чтение лога стоит с конца: свежие события внизу."},
 {t:"c",d:2,q:"Посчитай, в скольких строках файла app.log встречается слово ERROR.",ans:["grep -c error app.log","grep -c ERROR app.log","grep -ci error app.log","grep -c \"ERROR\" app.log"],hint:"у grep есть флаг count",why:"grep -c считает строки с совпадением. Эквивалент через пайп: grep ERROR app.log | wc -l."},
 {t:"c",d:3,q:"Нужно понять, что происходило вокруг каждой ошибки: покажи 5 строк до и после каждого вхождения «connection refused» в app.log.",ans:["grep -c5 connection refused app.log","grep -C5 \"connection refused\" app.log","grep -C 5 \"connection refused\" app.log","grep -c 5 connection refused app.log"],hint:"флаг контекста -C и кавычки вокруг фразы из двух слов",why:"Без кавычек grep примет «refused» за имя файла. -C5 = -A5 -B5: сцена целиком вместо отдельной строки."},
 {t:"q",d:4,q:"Лог приложения — 4 ГБ. Инцидент был в 09:41. Какой порядок действий наименее затратный и самый точный?",a:["<code>cat app.log | grep ERROR</code> — прочитать весь файл и отфильтровать","Сначала сузить окно (<code>grep \"09:4\" app.log</code> или <code>tail -5000</code>), потом искать ошибки внутри окна","Открыть файл в редакторе и листать","<code>grep -r ERROR /var/log</code> по всему каталогу"],c:1,why:"Сначала окно, потом фильтр. Иначе система перечитывает гигабайты ради строк, которые заведомо вне интересующего времени."},
 {t:"q",d:4,q:"Нужны все строки лога, где НЕТ слова INFO — чтобы убрать шум. Какой флаг grep?",a:["<code>-i</code>","<code>-v</code>","<code>-c</code>","<code>-n</code>"],c:1,why:"-v инвертирует условие. Приём «убрать заведомо неинтересное» часто эффективнее, чем угадывать, что искать: grep -v INFO app.log | tail -100."},
 {t:"q",d:5,q:"<b>Инцидент.</b> Клиенты жалуются на ошибки оформления заказа. Ты открыл <code>tail -f /var/log/app/app.log</code> и видишь поток INFO-строк, ошибок нет. Коллега говорит: «а у меня в браузере ошибка прямо сейчас». Что вероятнее всего происходит?",a:["Логи отключены","Ты смотришь не тот лог: ошибка может быть в error.log nginx или в логе другого сервиса цепочки","Приложение зависло","Диск переполнен"],c:1,why:"Запрос проходит через несколько компонентов, и каждый пишет свой лог. Тактика: смотреть логи с обоих концов цепочки — веб-сервера и приложения — и сопоставлять по времени."}]},

{id:"l3",t:"Права доступа",goal:"Понять, почему Permission denied — и починить правильно",
 cards:[
 {h:"Три роли и три права",b:"<pre>-rw-r--r--  1 deploy www-data  app.conf\n ^^^ ^^^ ^^^\n  │   │   └── остальные (others): r--\n  │   └────── группа (group):     r--\n  └────────── владелец (user):    rw-</pre><p>Права: <b>r</b> чтение, <b>w</b> запись, <b>x</b> выполнение. Система проверяет их по порядку: ты владелец? применяются права владельца. Нет — состоишь в группе? права группы. Нет — права остальных.</p><p><b>Важное следствие:</b> если владельцу запрещено, а остальным разрешено — владелец всё равно не получит доступ. Проверка останавливается на первом подходящем правиле.</p>"},
 {h:"Цифры: r=4, w=2, x=1",b:"<p>Складываешь нужные права и получаешь цифру для каждой роли.</p><div class='tw'><table><tr><th>цифра</th><th>права</th><th>типично для</th></tr><tr><td>7</td><td>rwx</td><td>каталоги, куда пишем</td></tr><tr><td>6</td><td>rw-</td><td>обычные файлы владельца</td></tr><tr><td>5</td><td>r-x</td><td>чтение и вход в каталог</td></tr><tr><td>4</td><td>r--</td><td>только чтение</td></tr><tr><td>0</td><td>---</td><td>полный запрет</td></tr></table></div><pre>chmod 644 app.conf   <span class='c'># владелец пишет, остальные читают</span>\nchmod 755 script.sh  <span class='c'># исполняемый скрипт</span>\nchmod 600 id_rsa     <span class='c'># только владелец, иначе ssh откажется</span>\nchmod 700 ~/.ssh     <span class='c'># каталог ключей</span></pre>"},
 {h:"Права на каталог значат другое",b:"<div class='tw'><table><tr><th>право</th><th>на файле</th><th>на каталоге</th></tr><tr><td>r</td><td>прочитать содержимое</td><td>увидеть список имён</td></tr><tr><td>w</td><td>изменить содержимое</td><td>создавать и удалять файлы внутри</td></tr><tr><td>x</td><td>запустить</td><td>войти в каталог и обратиться к файлу по имени</td></tr></table></div><p>Отсюда неочевидное: чтобы прочитать <code>/opt/app/config.yml</code>, нужен <b>x</b> на всех каталогах пути — <code>/opt</code>, <code>/opt/app</code> — и <b>r</b> на самом файле. Права правильные, а доступа нет — проверяй весь путь, а не только файл.</p>"},
 {h:"Владелец и группа",b:"<pre>chown deploy:deploy app.conf     <span class='c'># сменить владельца и группу</span>\nchown -R app:app /opt/app        <span class='c'># рекурсивно по каталогу</span>\nchgrp www-data app.conf          <span class='c'># только группу</span>\nid deploy                        <span class='c'># в каких группах пользователь</span></pre><p>Типичная схема на веб-сервере: файлы принадлежат <code>deploy</code>, группа — <code>www-data</code>, права <code>640</code>. Деплой пишет, nginx читает, посторонние не видят ничего.</p>"},
 {h:"Как чинить Permission denied правильно",b:"<p>Порядок мысли: <b>кто</b> обращается → <b>к чему</b> → <b>каких прав не хватает</b>.</p><pre>ls -la /opt/app/config.yml   <span class='c'># чьё и с какими правами</span>\nid app                       <span class='c'># от кого работает сервис</span>\nnamei -l /opt/app/config.yml <span class='c'># права на каждом шаге пути</span></pre><p><b>Никогда не лечи это через <code>chmod 777</code>.</b> Это открывает файл на запись всему миру и превращает локальную проблему в дыру в безопасности. Правильный ответ почти всегда — сменить владельца или добавить пользователя в нужную группу.</p>"}],
 ch:[
 {t:"q",d:1,q:"<code>chmod 600 id_rsa</code> — что это значит?",a:["Читать и писать может только владелец","Все могут читать","Файл стал исполняемым","Сменился владелец"],c:0,why:"6 = rw для владельца, 0 и 0 — ничего группе и остальным. SSH откажется использовать приватный ключ с более широкими правами."},
 {t:"c",d:2,q:"Сделай скрипт deploy.sh исполняемым: владелец — полный доступ, остальные читают и выполняют.",ans:["chmod 755 deploy.sh","sudo chmod 755 deploy.sh"],hint:"rwx для владельца, r-x для остальных — сложи цифры",why:"7=rwx, 5=r-x. Это стандартные права исполняемого файла. 777 добавило бы всем право записи — так делать нельзя."},
 {t:"q",d:3,q:"У файла <code>/opt/app/secret.yml</code> права <code>644</code> и владелец <code>app</code>. Сервис работает от пользователя <code>app</code>, но получает Permission denied. Что проверить в первую очередь?",a:["Права самого файла ещё раз","Права <b>x</b> на каталогах пути: /opt и /opt/app","Свободное место","Версию ядра"],c:1,why:"Чтобы обратиться к файлу по пути, нужен бит x на каждом каталоге. Права на файл могут быть идеальными, а вход в каталог закрыт — команда namei -l показывает весь путь целиком."},
 {t:"q",d:4,q:"Коллега «починил» доступ командой <code>chmod -R 777 /var/www</code>. Что с этим не так и как правильно?",a:["Всё нормально, доступ появился","Любой пользователь системы теперь может изменить файлы сайта; правильно — сменить владельца (chown) и выставить 640/750","Надо было 666","Надо было добавить sudo"],c:1,why:"777 = запись для всех, включая скомпрометированные процессы. Это классическая находка аудита. Лечение доступа — через владельца и группу, а не через раздачу прав всему миру."},
 {t:"o",d:4,q:"Сервис не может прочитать конфиг. Расставь диагностику по порядку.",items:["ls -la на файл — узнать владельца и права","id имя_сервисного_пользователя — понять, кто обращается","namei -l путь — проверить права на всех каталогах пути","chown или добавление в группу — точечно выдать доступ"],why:"Сначала факты (кто, к чему, что мешает), потом минимальное вмешательство. Изменение прав без этих трёх шагов — угадывание."},
 {t:"q",d:5,q:"<b>Инцидент.</b> После деплоя сайт отдаёт 403. В логе nginx: <code>open() \"/var/www/app/index.html\" failed (13: Permission denied)</code>. <code>ls -la</code> показывает: файл принадлежит <code>deploy:deploy</code>, права <code>640</code>. Nginx работает от <code>www-data</code>. Что сделать?",a:["chmod 777 на весь каталог","Сменить группу файлов на www-data (<code>chown -R deploy:www-data /var/www/app</code>) — тогда 640 даст nginx чтение","Запустить nginx от root","Удалить и залить файлы заново"],c:1,why:"Права 640 = чтение для группы. Осталось сделать группой владельца ту, в которой состоит nginx. Это минимальное изменение, закрывающее ровно проблему — и типовая схема прав на веб-сервере."}]},

{id:"l4",t:"Процессы и ресурсы",goal:"Узнать, кто съел процессор, память и диск",
 cards:[
 {h:"Что такое процесс",b:"<p>Процесс — запущенная программа со своим <b>PID</b> (номером), владельцем, потреблением ресурсов и родителем. Дерево процессов растёт от PID 1 (systemd), который усыновляет всех осиротевших.</p><pre>ps aux | grep nginx      <span class='c'># найти процесс по имени</span>\nps -ef --forest          <span class='c'># дерево родитель-потомок</span>\npgrep -a nginx           <span class='c'># короче, сразу PID и команда</span>\ntop / htop               <span class='c'># живой монитор</span></pre><p>В выводе <code>ps aux</code> колонки: пользователь, PID, %CPU, %MEM, команда. Именно команда (с аргументами) обычно и подсказывает, что это за процесс и кто его запустил.</p>"},
 {h:"Сигналы: как правильно останавливать",b:"<div class='tw'><table><tr><th>сигнал</th><th>номер</th><th>смысл</th></tr><tr><td>SIGTERM</td><td>15</td><td>«заверши работу» — по умолчанию у kill, процесс может закрыть файлы и соединения</td></tr><tr><td>SIGKILL</td><td>9</td><td>убить немедленно, перехватить невозможно — данные могут остаться битыми</td></tr><tr><td>SIGHUP</td><td>1</td><td>у демонов обычно «перечитай конфиг»</td></tr><tr><td>SIGINT</td><td>2</td><td>то же, что Ctrl+C</td></tr></table></div><pre>kill 4210      <span class='c'># SIGTERM, вежливо</span>\nkill -9 4210   <span class='c'># SIGKILL, последнее средство</span>\nkill -1 711    <span class='c'># перечитать конфигурацию</span></pre><p>Правило: сначала обычный <code>kill</code>, подождать несколько секунд, и только потом <code>-9</code>."},
 {h:"Память: что значат цифры",b:"<pre>free -h\n              total    used    free   buff/cache   available\nMem:           3.8Gi   1.2Gi   0.4Gi        2.2Gi       2.4Gi</pre><p><b>Главная ловушка новичка:</b> малое значение <code>free</code> — это норма, а не проблема. Linux забивает свободную память дисковым кэшем (<code>buff/cache</code>) и мгновенно отдаёт её приложениям, когда нужно.</p><p>Смотреть надо на <b>available</b> — сколько реально доступно программам. Тревога начинается, когда available близко к нулю и растёт использование swap.</p>"},
 {h:"Диск: df против du",b:"<pre>df -h              <span class='c'># сколько занято на разделах (спрашивает файловую систему)</span>\ndu -sh /var/*      <span class='c'># сколько весят каталоги (обходит файлы)</span>\ndu -sh /var/* | sort -h | tail   <span class='c'># самые тяжёлые в конце</span></pre><p>Эти команды считают по-разному, и расхождение — само по себе диагноз: если <code>df</code> показывает переполнение, а <code>du</code> не находит объём, значит какой-то процесс держит открытым уже удалённый файл. Место вернётся только после перезапуска этого процесса.</p><pre>lsof | grep deleted   <span class='c'># найти такие файлы</span></pre>"},
 {h:"Нагрузка: load average",b:"<pre>uptime\n load average: 2.31, 1.84, 1.02\n                 1м    5м    15м</pre><p>Это среднее число процессов, которые выполняются или ждут (в том числе диск). Сравнивать надо <b>с количеством ядер</b>: LA 4.0 на четырёх ядрах — полная загрузка, на одном — перегрузка вчетверо.</p><p>Первое число больше остальных — нагрузка растёт. Меньше — спадает. Высокий LA при низком %CPU означает ожидание: диск, сеть или зависшее сетевое хранилище.</p>"}],
 ch:[
 {t:"c",d:1,q:"Посмотри занятость разделов в человекочитаемом виде.",ans:["df -h","df -h /","df --human-readable"],hint:"disk free + human",why:"df -h — первая команда при алерте на диск. Дальше du ищет виновника."},
 {t:"c",d:2,q:"Найди все процессы nginx в списке процессов.",ans:["ps aux | grep nginx","ps -ef | grep nginx","pgrep -a nginx","pgrep nginx"],hint:"ps aux и пайп в grep",why:"ps aux | grep — рабочая лошадка. Смотри на колонку с командой: она показывает аргументы запуска и часто объясняет, что это за процесс."},
 {t:"q",d:3,q:"<code>free -h</code> показывает free всего 0.4 ГБ из 3.8 ГБ. Сервер в опасности?",a:["Да, срочно нужен перезапуск","Нет: Linux занимает свободную память кэшем; смотреть надо на колонку available","Да, нужно больше памяти","Зависит от времени суток"],c:1,why:"Кэш освобождается автоматически по требованию. Настоящий признак нехватки — низкий available вместе с ростом swap."},
 {t:"q",d:4,q:"Load average 8.0 на 8-ядерном сервере, при этом %CPU процессов невысокий. Что это скорее всего?",a:["Нормальная полная загрузка процессора","Процессы ждут ввода-вывода: медленный диск, сеть или зависшее хранилище","Утечка памяти","Ошибка в uptime"],c:1,why:"LA учитывает и ожидание ввода-вывода. Расхождение «высокий LA — низкий CPU» указывает на диск или сеть, а не на вычисления."},
 {t:"q",d:4,q:"Сервис не отвечает. Что применить: <code>kill</code> или сразу <code>kill -9</code>?",a:["Сразу -9, так быстрее","Сначала обычный kill (SIGTERM) — дать закрыть файлы и соединения, и только если не помогло, -9","kill вообще опасен","Только перезагрузка сервера"],c:1,why:"SIGKILL нельзя перехватить: процесс не сбросит буферы на диск и не закроет соединения. Риск битых данных ради нескольких секунд."},
 {t:"q",d:5,q:"<b>Инцидент.</b> Алерт: раздел <code>/var</code> заполнен на 100%. Ты запускаешь <code>du -sh /var/*</code> — сумма получается около 6 ГБ при размере раздела 20 ГБ. <code>df -h</code> при этом упорно показывает 100%. Что происходит и что делать?",a:["du врёт, надо доверять df и купить диск","Какой-то процесс держит открытым удалённый файл: найти через <code>lsof | grep deleted</code> и перезапустить этот сервис","Файловая система повреждена, нужен fsck","Надо запустить du от root"],c:1,why:"Ядро не освобождает блоки, пока процесс держит дескриптор удалённого файла. Именно расхождение df и du — точный признак этой ситуации. Перезапуск сервиса возвращает место мгновенно."}]},

{id:"l5",t:"Bash-скрипты",goal:"Автоматизировать то, что делал руками",
 cards:[
 {h:"Скелет скрипта, который не навредит",b:"<pre>#!/bin/bash\nset -euo pipefail\n\nAPP_DIR=\"/opt/app\"\n\nif [ ! -d \"$APP_DIR\" ]; then\n  echo \"нет каталога $APP_DIR\" &gt;&amp;2\n  exit 1\nfi\n\nfor f in \"$APP_DIR\"/*.log; do\n  echo \"обрабатываю $f\"\ndone</pre><p>Первая строка (<b>shebang</b>) говорит системе, чем исполнять файл. Без неё скрипт запустится оболочкой по умолчанию, и синтаксис bash может не сработать.</p>"},
 {h:"set -euo pipefail: три слова, отличающие инженера",b:"<div class='tw'><table><tr><th>флаг</th><th>что делает</th><th>от чего спасает</th></tr><tr><td><code>-e</code></td><td>выход при первой ошибке</td><td>скрипт продолжает работу после провала и делает не то</td></tr><tr><td><code>-u</code></td><td>ошибка при обращении к необъявленной переменной</td><td><code>rm -rf $DIR/</code> при пустой DIR превращается в <code>rm -rf /</code></td></tr><tr><td><code>-o pipefail</code></td><td>ошибка внутри пайпа не теряется</td><td><code>false | echo ok</code> без него считается успехом</td></tr></table></div>"},
 {h:"Код возврата — язык автоматизации",b:"<p>Каждая команда возвращает число: <b>0</b> — успех, <b>не ноль</b> — ошибка. Посмотреть последний: <code>echo $?</code>.</p><p>На этом стоит всё: CI считает шаг упавшим по ненулевому коду, Docker HEALTHCHECK — тем же способом, systemd решает, перезапускать ли сервис.</p><pre>curl -fsS http://localhost/health || exit 1\n<span class='c'># || выполняется только при ненулевом коде</span>\n\nmkdir -p /opt/app &amp;&amp; cd /opt/app\n<span class='c'># &amp;&amp; выполняется только при успехе</span></pre><p>Полезные коды: <b>126</b> — файл найден, но не исполняемый; <b>127</b> — команда не найдена; <b>130</b> — прервано по Ctrl+C.</p>"},
 {h:"Кавычки: главный источник багов",b:"<pre>DIR=\"/opt/my app\"\nrm -rf $DIR      <span class='c'># ОПАСНО: две цели — /opt/my и app</span>\nrm -rf \"$DIR\"    <span class='c'># верно: один аргумент</span></pre><p>Правило простое: <b>всегда заключай переменные в двойные кавычки</b>, кроме случаев, когда осознанно нужен разбор на слова. Пробелы в путях и пустые значения — самая частая причина того, что деплой-скрипт удаляет не то.</p>"},
 {h:"Условия и проверки",b:"<pre>[ -f \"$F\" ]    <span class='c'># обычный файл существует</span>\n[ -d \"$D\" ]    <span class='c'># каталог существует</span>\n[ -z \"$V\" ]    <span class='c'># переменная пустая</span>\n[ -n \"$V\" ]    <span class='c'># непустая</span>\n[ \"$A\" = \"$B\" ]  <span class='c'># строки равны</span></pre><pre>test -n \"$TOKEN\" || { echo \"нет токена\" &gt;&amp;2; exit 1; }</pre><p>Проверка обязательных переменных в начале скрипта экономит часы: скрипт падает сразу и с внятным сообщением, а не на середине с непонятной ошибкой.</p>"},
 {h:"Куда писать сообщения",b:"<p>У процесса два выходных потока: <b>stdout</b> (обычный вывод) и <b>stderr</b> (ошибки). Сообщения об ошибках пиши в stderr: <code>echo \"беда\" &gt;&amp;2</code>.</p><p>Тогда полезный вывод скрипта можно направить в файл или следующую команду, а ошибки останутся видны человеку.</p>"}],
 ch:[
 {t:"c",d:1,q:"Как узнать код возврата последней выполненной команды?",ans:["echo $?","echo \"$?\"","$?"],hint:"специальная переменная",why:"$? — 0 успех, не ноль ошибка. Именно это читают CI, systemd и healthcheck."},
 {t:"f",d:2,q:"Допиши строку, которая заставит скрипт падать при первой ошибке, ругаться на необъявленные переменные и ловить ошибки внутри пайпов.",pre:"#!/bin/bash\n___",ans:["set -euo pipefail","set -eou pipefail","set -euo pipefail;"],hint:"set -e + -u + -o pipefail одной строкой",why:"Без -e скрипт весело продолжит выполняться после провала — и удалит не то, что нужно."},
 {t:"q",d:3,q:"Что произойдёт при выполнении <code>curl -fsS http://localhost/health || exit 1</code>?",a:["Скрипт всегда завершится","Если curl вернул ненулевой код, скрипт выйдет с ошибкой; при успехе продолжит","Выведет health на экран","Перезапустит сервис"],c:1,why:"|| срабатывает только при ненулевом коде. Готовый паттерн проверки здоровья для CI, Docker и скриптов деплоя."},
 {t:"q",d:4,q:"В скрипте есть строка <code>rm -rf $BUILD_DIR/*</code>, а переменная <code>BUILD_DIR</code> из-за опечатки оказалась пустой. Что произойдёт и что предотвратило бы это?",a:["Ничего, скрипт просто пропустит строку","Команда превратится в <code>rm -rf /*</code>; спасли бы <code>set -u</code> и кавычки вокруг переменной","Будет синтаксическая ошибка","Удалится только текущий каталог"],c:1,why:"Пустая переменная просто исчезает из команды. set -u прерывает скрипт на необъявленной переменной — это буквально защита от катастрофы."},
 {t:"q",d:4,q:"Скрипт в CI завершился с кодом 126. Что это значит?",a:["Команда не найдена","Файл найден, но не является исполняемым — нет бита x","Нехватка памяти","Прервано пользователем"],c:1,why:"126 — не исполняемый, 127 — не найден. Знание этих двух чисел экономит часы отладки пайплайнов: лечится chmod +x и коммитом бита выполнения в git."},
 {t:"q",d:5,q:"<b>Инцидент.</b> Ночной скрипт бэкапа отработал «успешно» (в логе нет ошибок), но архива нет. В коде: <code>tar czf /backup/db.tar.gz /var/lib/db | gzip &gt; /backup/db.gz</code>, без <code>set</code>-флагов. Почему провал остался незамеченным?",a:["tar не умеет писать в /backup","Код возврата пайпа — это код последней команды: tar мог упасть, но gzip отработал успешно, и скрипт счёл всё нормальным","Не хватило места","Скрипт запускался не от root"],c:1,why:"Ровно от этого спасает set -o pipefail: он делает пайп неуспешным, если упало любое звено. И отдельный урок: успех бэкапа проверяется наличием и восстановлением архива, а не отсутствием строк в логе."}]}
);
W("linux").miss.push(

{id:"l6",t:"systemd: сервисы навсегда",goal:"Сделать так, чтобы приложение поднималось само",
 cards:[
 {h:"Юнит-файл целиком",b:"<pre>[Unit]\nDescription=Shop API\nAfter=network.target postgresql.service\nRequires=postgresql.service\n\n[Service]\nType=simple\nUser=app\nWorkingDirectory=/opt/app\nEnvironmentFile=/etc/app/env\nExecStart=/opt/app/bin/api --port 8080\nRestart=on-failure\nRestartSec=5\n\n[Install]\nWantedBy=multi-user.target</pre><p>Три секции: <b>[Unit]</b> — описание и зависимости, <b>[Service]</b> — как запускать, <b>[Install]</b> — куда цеплять при включении автозапуска.</p><p>Файлы своих сервисов кладут в <code>/etc/systemd/system/имя.service</code>.</p>"},
 {h:"After и Requires — разные вещи",b:"<div class='tw'><table><tr><th>директива</th><th>смысл</th></tr><tr><td><code>After=</code></td><td>только порядок запуска: стартовать после указанного юнита</td></tr><tr><td><code>Requires=</code></td><td>жёсткая зависимость: если тот юнит не поднялся или упал — наш тоже останавливается</td></tr><tr><td><code>Wants=</code></td><td>мягкая: попытаться запустить, но не падать, если не вышло</td></tr></table></div><p>Частая ошибка: указан только <code>Requires</code> без <code>After</code>. Тогда systemd запустит оба юнита одновременно, и приложение всё равно не найдёт базу. На практике нужны обе строки.</p>"},
 {h:"start против enable",b:"<pre>systemctl start api      <span class='c'># запустить прямо сейчас</span>\nsystemctl enable api     <span class='c'># запускать при загрузке системы</span>\nsystemctl enable --now api   <span class='c'># и то, и другое</span>\nsystemctl is-enabled api\nsystemctl is-active api</pre><p>Это <b>разные операции</b>. Классика: всё работало неделю, сервер перезагрузили — сервис не поднялся, потому что забыли <code>enable</code>.</p>"},
 {h:"Restart и как не устроить шторм",b:"<div class='tw'><table><tr><th>значение</th><th>когда перезапускать</th></tr><tr><td><code>no</code></td><td>никогда (по умолчанию)</td></tr><tr><td><code>on-failure</code></td><td>только при ненулевом коде выхода — обычный выбор для сервисов</td></tr><tr><td><code>always</code></td><td>всегда, даже после штатной остановки</td></tr></table></div><p><code>RestartSec=5</code> — пауза между попытками. Без неё падающий сервис перезапускается сотни раз в минуту и забивает журнал. Ограничить можно через <code>StartLimitBurst</code> и <code>StartLimitIntervalSec</code>.</p>"},
 {h:"Диагностика и главная ловушка",b:"<pre>systemctl status api          <span class='c'># состояние + последние строки лога</span>\njournalctl -u api -f          <span class='c'># живой журнал сервиса</span>\njournalctl -u api --since \"10 min ago\"\nsystemctl daemon-reload       <span class='c'># перечитать изменённые юниты</span>\nsystemctl reload nginx        <span class='c'># сервис перечитает конфиг без разрыва соединений</span></pre><p><b>Ловушка:</b> systemd держит юниты в памяти. Поправил файл и сделал <code>restart</code> — изменения не применятся. Сначала <code>daemon-reload</code>, потом <code>restart</code>. Иначе будешь искать несуществующий баг.</p>"}],
 ch:[
 {t:"c",d:1,q:"Посмотри состояние сервиса nginx.",ans:["systemctl status nginx","sudo systemctl status nginx"],hint:"systemctl + подкоманда",why:"status показывает состояние, PID, память и последние строки журнала — самый информативный первый шаг."},
 {t:"q",d:2,q:"Сервер перезагрузили — приложение не поднялось, хотя вчера работало. Что забыли?",a:["systemctl start","systemctl enable","daemon-reload","chmod"],c:1,why:"enable создаёт симлинк в multi-user.target.wants. Без него сервис работает только до первой перезагрузки."},
 {t:"c",d:2,q:"Ты изменил файл /etc/systemd/system/api.service. Какой командой заставить systemd перечитать юниты?",ans:["systemctl daemon-reload","sudo systemctl daemon-reload"],hint:"daemon-...",why:"Без daemon-reload systemd продолжит использовать старую версию юнита из памяти, и правки просто не применятся."},
 {t:"q",d:3,q:"В юните указано <code>Requires=postgresql.service</code>, но приложение всё равно падает с «connection refused» при старте системы. Чего не хватает?",a:["Restart=always","<code>After=postgresql.service</code> — Requires задаёт зависимость, но не порядок запуска","EnvironmentFile","User="],c:1,why:"Requires и After решают разные задачи. Без After systemd стартует оба юнита параллельно, и приложение успевает обратиться к ещё не готовой базе."},
 {t:"q",d:4,q:"Сервис падает из-за ошибки в конфиге, а в юните стоит <code>Restart=always</code> без <code>RestartSec</code>. Что будет с сервером?",a:["Ничего страшного, сервис просто не работает","Бесконечный шторм перезапусков: нагрузка на диск и журнал, который быстро съест место","systemd сам остановит попытки навсегда","Сервер перезагрузится"],c:1,why:"Поэтому Restart=on-failure + RestartSec=5 + лимит попыток. Перезапуск должен давать время починить причину, а не маскировать её."},
 {t:"q",d:5,q:"<b>Инцидент.</b> Ты поправил <code>ExecStart</code> в юните, выполнил <code>systemctl restart api</code> — сервис поднялся, но работает по-старому. В <code>systemctl status api</code> видна прежняя команда запуска. Что произошло?",a:["Нужен перезапуск сервера","Юнит не перечитан: сначала <code>systemctl daemon-reload</code>, затем restart","Файл сохранён не в тот каталог","Сервис запущен от другого пользователя"],c:1,why:"status показывает то, что systemd держит в памяти — это и есть подсказка. Порядок всегда один: правка файла → daemon-reload → restart → проверка status."}]},

{id:"l7",t:"Планировщик задач",goal:"Автоматизировать рутину по расписанию",
 cards:[
 {h:"cron: пять полей",b:"<pre>crontab -e     <span class='c'># редактировать задания текущего пользователя</span>\ncrontab -l     <span class='c'># посмотреть</span>\n\n<span class='c'># мин  час  день_месяца  месяц  день_недели  команда</span>\n0    3    *    *    *   /opt/scripts/backup.sh\n*/5  *    *    *    *   /opt/scripts/check.sh\n30   2    *    *    1   /opt/scripts/weekly.sh   <span class='c'># по понедельникам</span></pre><p><code>*</code> — любое значение, <code>*/5</code> — каждые пять единиц этого поля. Первое поле — минуты, поэтому <code>*/5 * * * *</code> означает «каждые пять минут», а не «каждые пять часов».</p>"},
 {h:"Почему скрипт работает руками и молчит из cron",b:"<p>Три причины, в порядке частоты:</p><ol><li><b>Другое окружение.</b> У cron минимальный <code>PATH</code> и нет твоих переменных. Лечение: абсолютные пути ко всем командам и явная подгрузка env.</li><li><b>Вывод никуда не идёт.</b> Ошибку никто не видит. Лечение: <code>&gt;&gt; /var/log/job.log 2&gt;&amp;1</code> в конце строки.</li><li><b>Нет прав или бита выполнения</b> у скрипта.</li></ol><pre>*/5 * * * * /opt/scripts/check.sh &gt;&gt; /var/log/check.log 2&gt;&amp;1</pre>"},
 {h:"systemd timer — современная замена",b:"<pre># /etc/systemd/system/backup.timer\n[Timer]\nOnCalendar=*-*-* 03:00:00\nPersistent=true\nRandomizedDelaySec=300\n\n[Install]\nWantedBy=timers.target</pre><p>Рядом лежит <code>backup.service</code> с самой командой. Преимущества перед cron:</p><ul><li>логи в <code>journalctl -u backup</code>, а не «куда перенаправил»</li><li><code>Persistent=true</code> догоняет пропущенный запуск, если машина была выключена</li><li>можно запустить вручную как обычный сервис и посмотреть результат</li><li>зависимости от других юнитов</li></ul><pre>systemctl list-timers   <span class='c'># когда что сработает</span></pre>"},
 {h:"Идемпотентность и блокировки",b:"<p>Задача по расписанию должна выдерживать <b>повторный и параллельный запуск</b>. Если прошлый запуск ещё идёт, новый может испортить данные.</p><pre>flock -n /var/lock/backup.lock /opt/scripts/backup.sh || exit 0</pre><p><code>flock -n</code> тихо выходит, если блокировка занята. Для systemd-таймеров ту же роль играет тип сервиса: второй экземпляр просто не стартует.</p>"}],
 ch:[
 {t:"q",d:1,q:"Что означает запись <code>*/5 * * * *</code>?",a:["Каждые 5 часов","Каждые 5 минут","Раз в 5 дней","В 5:00 ежедневно"],c:1,why:"Первое поле — минуты. Порядок полей: минуты, часы, день месяца, месяц, день недели."},
 {t:"c",d:2,q:"Открой редактор заданий cron для текущего пользователя.",ans:["crontab -e"],hint:"crontab + флаг edit",why:"crontab -l покажет содержимое без редактирования. Задания хранятся отдельно у каждого пользователя."},
 {t:"q",d:3,q:"Скрипт отлично работает руками, но из cron молча ничего не делает. Первая гипотеза?",a:["cron сломан","Другое окружение: нет привычного PATH и переменных — нужны абсолютные пути","Не хватает памяти","Файл повреждён"],c:1,why:"И сразу вторая проблема: без перенаправления вывода ошибку никто не увидит. Добавь >> log 2>&1 и прочитай, что там на самом деле."},
 {t:"f",d:3,q:"Допиши хвост строки crontab, чтобы и обычный вывод, и ошибки писались в /var/log/check.log.",pre:"*/5 * * * * /opt/scripts/check.sh ___",ans:[">> /var/log/check.log 2>&1",">>/var/log/check.log 2>&1"],hint:"дописать в файл + привязать stderr к stdout",why:"Порядок обязателен: сначала перенаправление вывода, потом 2>&1. Иначе ошибки уйдут не туда."},
 {t:"q",d:4,q:"Чем systemd timer лучше cron для продакшена?",a:["Работает быстрее","Логи в journalctl, зависимости от других юнитов, догон пропущенных запусков и ручной запуск для проверки","Проще синтаксис","Не требует root"],c:1,why:"Плюс таймер можно выполнить как обычный сервис и сразу увидеть результат — с cron приходится ждать расписания или копировать команду руками."},
 {t:"q",d:5,q:"<b>Инцидент.</b> Ночной бэкап по cron идёт дольше обычного из-за роста базы. В 03:00 запускается следующий экземпляр поверх незавершённого, они пишут в один архив — файл повреждён, и это обнаружили только при попытке восстановления. Что нужно было заложить?",a:["Запускать реже","Блокировку (<code>flock -n</code>) и проверку успешности с тестовым восстановлением","Больше памяти","Запускать от root"],c:1,why:"Два урока сразу: параллельный запуск должен быть невозможен технически, и «задание отработало» не равно «бэкап пригоден» — это проверяется только восстановлением."}]},

{id:"l8",t:"Пакеты, пользователи, sudo",goal:"Управлять системой, а не только смотреть на неё",
 cards:[
 {h:"Пакетные менеджеры",b:"<pre>apt update                  <span class='c'># обновить индекс пакетов</span>\napt upgrade                 <span class='c'># обновить установленное</span>\napt install -y nginx\napt remove nginx            <span class='c'># удалить, конфиги остаются</span>\napt purge nginx             <span class='c'># удалить вместе с конфигами</span>\napt list --installed | grep nginx</pre><div class='tw'><table><tr><th>семейство</th><th>менеджер</th><th>где встретишь</th></tr><tr><td>Debian / Ubuntu</td><td><code>apt</code>, <code>dpkg</code></td><td>чаще всего на серверах</td></tr><tr><td>RHEL / Rocky / Fedora</td><td><code>dnf</code>, <code>yum</code>, <code>rpm</code></td><td>корпоративные среды, SELinux включён</td></tr><tr><td>Alpine</td><td><code>apk</code></td><td>внутри контейнеров</td></tr></table></div><p><b>Всегда <code>apt update</code> перед install:</b> без него ставится версия из устаревшего индекса или пакет «не находится».</p>"},
 {h:"Пользователи и группы",b:"<pre>adduser deploy               <span class='c'># создать с домашним каталогом</span>\nusermod -aG sudo deploy      <span class='c'># добавить в группу</span>\ngroups deploy                <span class='c'># в каких группах состоит</span>\nid deploy                    <span class='c'># uid, gid и все группы</span>\nsu - deploy                  <span class='c'># переключиться на пользователя</span></pre><p><b>Флаг <code>-a</code> обязателен.</b> <code>usermod -G sudo deploy</code> без <code>-a</code> <i>заменяет</i> весь список групп пользователя на указанный — так люди отбирают у себя доступ и остаются заперты снаружи.</p>"},
 {h:"sudo и принцип наименьших привилегий",b:"<pre>sudo systemctl restart nginx   <span class='c'># одна команда от root</span>\nsudo -u app whoami             <span class='c'># от имени конкретного пользователя</span>\nvisudo                         <span class='c'># безопасно править /etc/sudoers</span></pre><p>В <code>/etc/sudoers.d/</code> можно выдать точечные права:</p><pre>deploy ALL=(ALL) NOPASSWD: /bin/systemctl restart api</pre><p>Это позволяет деплой-скрипту перезапускать один сервис, не получая root на всё. Правь sudoers только через <code>visudo</code>: он проверяет синтаксис и не даст сохранить файл, который заблокирует sudo для всех.</p>"},
 {h:"Сервисные пользователи",b:"<p>Приложение не должно работать от root. Создают отдельного пользователя без домашнего каталога и без оболочки:</p><pre>useradd -r -s /usr/sbin/nologin app</pre><p><code>-r</code> — системный пользователь, <code>-s /usr/sbin/nologin</code> — под этим аккаунтом нельзя войти интерактивно. Если приложение скомпрометируют, атакующий не получит рабочую оболочку.</p><p>Та же идея на других уровнях: <code>USER node</code> в Dockerfile, <code>runAsNonRoot: true</code> в Kubernetes. Один принцип, три реализации.</p>"},
 {h:"Опасная группа docker",b:"<p>Членство в группе <code>docker</code> равносильно правам root на хосте: пользователь может запустить контейнер, примонтировав в него корень системы. Это не уязвимость, а свойство архитектуры — но выдавать эту группу нужно так же осознанно, как sudo.</p>"}],
 ch:[
 {t:"c",d:1,q:"Установи nginx на Ubuntu без вопросов подтверждения.",ans:["apt install -y nginx","sudo apt install -y nginx","apt-get install -y nginx","sudo apt-get install -y nginx"],hint:"apt install + флаг «да на всё»",why:"Перед этим нужен apt update, иначе индекс пакетов может быть устаревшим."},
 {t:"q",d:2,q:"Чем <code>apt remove</code> отличается от <code>apt purge</code>?",a:["Ничем","purge удаляет ещё и конфигурационные файлы из /etc","remove быстрее","purge только для ядра"],c:1,why:"После remove конфиги остаются: иногда это спасает при переустановке, иногда мешает поставить «начисто»."},
 {t:"c",d:2,q:"Добавь пользователя deploy в группу docker, сохранив его остальные группы.",ans:["usermod -aG docker deploy","sudo usermod -aG docker deploy"],hint:"два флага: append + group",why:"Без -a список групп будет перезаписан. И помни: группа docker фактически равна root на хосте."},
 {t:"q",d:3,q:"Зачем сервисному пользователю задают оболочку <code>/usr/sbin/nologin</code>?",a:["Так короче","Чтобы под этим аккаунтом нельзя было войти интерактивно — сужается поверхность атаки","Это ускоряет запуск","Требование systemd"],c:1,why:"Скомпрометировав приложение, атакующий не получает рабочий shell. Тот же смысл у USER в Dockerfile и runAsNonRoot в Kubernetes."},
 {t:"q",d:4,q:"Деплой-скрипту нужно перезапускать один сервис. Какой вариант правильный?",a:["Дать пользователю полный sudo без пароля","Точечное правило в /etc/sudoers.d: NOPASSWD только на <code>systemctl restart api</code>","Запускать скрипт от root","Сделать бинарник systemctl SUID"],c:1,why:"Наименьшие привилегии: ровно одна разрешённая команда вместо root на всё. Править sudoers — через visudo, он проверяет синтаксис."},
 {t:"q",d:5,q:"<b>Инцидент.</b> Коллега выполнил <code>usermod -G docker deploy</code> на боевом сервере и вышел из сессии. Теперь <code>deploy</code> не может выполнить ни одной команды через sudo, а других учёток с доступом нет. Что произошло и как это предотвратить в будущем?",a:["Сломался sudo, нужна переустановка","Без флага -a список групп заменился: deploy выпал из sudo. Спасение — консоль провайдера или single-user режим; профилактика — всегда -aG и вторая открытая SSH-сессия при изменении доступов","Истёк пароль","Группа docker несовместима с sudo"],c:1,why:"Правило дежурного: при любых изменениях доступа, фаервола или SSH держи вторую активную сессию открытой, пока не убедился, что новая конфигурация работает."}]},

{id:"l9",t:"Vim: выжить и отредактировать",goal:"Править конфиг на сервере, где нет твоего редактора",
 cards:[
 {h:"Два режима — вся суть",b:"<p>Vim открывается в <b>командном</b> режиме: буквы — это команды, а не текст. Чтобы печатать, нужно перейти в режим вставки.</p><pre>i     <span class='c'># вставка перед курсором</span>\na     <span class='c'># вставка после курсора</span>\no     <span class='c'># новая строка ниже и вставка</span>\nEsc   <span class='c'># вернуться в командный режим</span></pre><div class='analogy'><b>Аналогия:</b> боевой режим и режим строительства. Нажал не ту кнопку не в том режиме — построил дом вместо выстрела.</div>"},
 {h:"Выйти, сохранить, не потерять",b:"<pre>:w     <span class='c'># сохранить</span>\n:q     <span class='c'># выйти</span>\n:wq    <span class='c'># сохранить и выйти</span>\n:q!    <span class='c'># выйти, отбросив изменения</span></pre><p>Все эти команды набираются в командном режиме — если не работает, сначала <code>Esc</code>.</p><p><b>Приём, который спасал тысячи людей:</b> открыл системный конфиг без sudo, всё отредактировал, а записать не можешь.</p><pre>:w !sudo tee %</pre><p><code>%</code> — текущий файл. Команда передаёт содержимое в tee, запущенный от root. На будущее лучше сразу <code>sudoedit файл</code>.</p>"},
 {h:"Минимум для реальной работы",b:"<pre>/слово    <span class='c'># поиск вперёд, n — следующее, N — предыдущее</span>\ndd        <span class='c'># удалить строку</span>\nyy  p     <span class='c'># копировать строку / вставить ниже</span>\nu         <span class='c'># отменить, Ctrl+r — вернуть</span>\ngg  G     <span class='c'># в начало / в конец файла</span>\n:15       <span class='c'># перейти к строке 15</span>\n:set nu   <span class='c'># показать номера строк</span></pre><p>Номера строк критичны при отладке: <code>nginx -t</code> сообщает об ошибке в строке 42 — с <code>:set nu</code> ты попадаешь туда мгновенно.</p>"},
 {h:"Замена по файлу",b:"<pre>:%s/8080/3000/g     <span class='c'># все вхождения во всём файле</span>\n:%s/8080/3000/gc    <span class='c'># с подтверждением каждой замены</span>\n:5,20s/old/new/g    <span class='c'># только в строках 5–20</span></pre><p><code>%</code> — весь файл, <code>g</code> — все вхождения в строке, <code>c</code> — спрашивать подтверждение. Синтаксис совпадает с <code>sed</code> — это родственники.</p>"},
 {h:"Nano и когда чем пользоваться",b:"<p><code>nano</code> проще: печатаешь сразу, подсказки внизу экрана, <code>Ctrl+O</code> сохранить, <code>Ctrl+X</code> выйти. Но его часто нет в минимальных образах и на голых серверах, а <code>vi</code> есть практически везде.</p><p>Практический вывод: для повседневной правки — что удобнее, но базовый набор vim знать обязательно, иначе однажды окажешься в контейнере наедине с непонятным экраном.</p>"}],
 ch:[
 {t:"q",d:1,q:"Открыл vim, нажимаешь буквы — ничего не печатается. Что происходит?",a:["Клавиатура не работает","Ты в командном режиме — нажми i для вставки","Файл только для чтения","Vim завис"],c:1,why:"Первое потрясение каждого новичка. Esc возвращает в командный режим, i — в режим вставки."},
 {t:"c",d:2,q:"Сохранить файл и выйти из vim одной командой.",ans:[":wq",":x","zz",":wq!"],hint:"начинается с двоеточия",why:":wq — записать и выйти, :q! — выйти без сохранения. Обе спасают в разных ситуациях."},
 {t:"q",d:3,q:"<code>nginx -t</code> сообщает об ошибке в строке 42. Что включить в vim, чтобы быстро туда попасть?",a:["<code>:set nu</code> и затем <code>:42</code>","<code>:w</code>","<code>dd</code>","<code>:q!</code>"],c:0,why:"Номера строк плюс переход по номеру превращают отладку конфигов из пролистывания в одно действие."},
 {t:"c",d:3,q:"Замени во всём открытом файле все вхождения 8080 на 3000.",ans:[":%s/8080/3000/g"],hint:"% весь файл, g все вхождения в строке",why:"Без g заменится только первое вхождение в каждой строке. Добавь c, чтобы подтверждать каждую замену вручную."},
 {t:"q",d:4,q:"Ты открыл <code>/etc/nginx/nginx.conf</code> без sudo, внёс двадцать правок, и <code>:w</code> отвечает «Read-only». Как сохранить, не теряя работу?",a:["Переписать всё заново под sudo","<code>:w !sudo tee %</code> — записать текущий файл через sudo","<code>chmod 777</code> на файл","Скопировать текст мышью"],c:1,why:"Классический приём. На будущее — sudoedit: он открывает временную копию и подставляет её обратно с нужными правами."},
 {t:"q",d:5,q:"<b>Инцидент.</b> Ты правил конфиг nginx в vim на проде, случайно нажал несколько клавиш в командном режиме и не понимаешь, что изменилось. Файл ещё не сохранён. Самое безопасное действие?",a:["Сохранить и посмотреть, что получится","<code>:q!</code> — выйти без сохранения и начать заново с рабочего файла","Нажать dd, чтобы удалить лишнее","Перезапустить nginx"],c:1,why:"Пока не было :w, файл на диске цел. Выйти без сохранения — самый дешёвый откат. Сохранять «чтобы посмотреть» на проде нельзя: nginx -t проверит синтаксис, но не смысл случайных правок."}]},

{id:"l10",t:"Текстовые потоки: sed, awk, пайпы",goal:"Обрабатывать логи и вывод, не открывая редактор",
 cards:[
 {h:"Три потока и перенаправление",b:"<p>У каждого процесса три потока: <b>0</b> stdin (вход), <b>1</b> stdout (вывод), <b>2</b> stderr (ошибки).</p><pre>cmd &gt; out.log         <span class='c'># stdout в файл, перезапись</span>\ncmd &gt;&gt; out.log        <span class='c'># дописать в конец</span>\ncmd 2&gt; err.log        <span class='c'># только ошибки</span>\ncmd &gt; all.log 2&gt;&amp;1    <span class='c'># оба потока в один файл</span>\ncmd 2&gt;/dev/null       <span class='c'># выбросить ошибки</span>\ncmd &lt; input.txt       <span class='c'># подать файл на вход</span></pre><p><b>Порядок критичен.</b> <code>&gt; file 2&gt;&amp;1</code> — верно: сначала stdout уходит в файл, потом stderr привязывается туда же. <code>2&gt;&amp;1 &gt; file</code> — ошибки останутся в терминале, потому что привязка произошла до перенаправления.</p>"},
 {h:"sed — потоковый редактор",b:"<pre>sed 's/old/new/' f          <span class='c'># первое вхождение в каждой строке</span>\nsed 's/old/new/g' f         <span class='c'># все вхождения</span>\nsed -n '10,20p' f           <span class='c'># напечатать только строки 10–20</span>\nsed '/^#/d' f               <span class='c'># удалить строки-комментарии</span>\nsed -i.bak 's/8080/3000/g' app.conf  <span class='c'># правка на месте с бэкапом</span></pre><p><code>-i</code> изменяет файл, <code>-i.bak</code> дополнительно сохраняет оригинал как <code>app.conf.bak</code>. На проде сначала прогоняй без <code>-i</code> и смотри вывод — иначе узнаешь, что такое паника.</p>"},
 {h:"awk — работа по колонкам",b:"<pre>awk '{print $1}' access.log            <span class='c'># первая колонка (IP)</span>\nawk '{print $1, $9}' access.log       <span class='c'># несколько колонок</span>\nawk '$9 == 500 {print $7}' access.log <span class='c'># URL, где код ответа 500</span>\nawk '{sum+=$10} END {print sum}' f    <span class='c'># сумма колонки</span></pre><p><code>$1</code>, <code>$2</code> — колонки, разделённые пробелами; <code>$0</code> — вся строка. Условие перед блоком фильтрует строки.</p>"},
 {h:"Классический однострочник",b:"<pre>awk '{print $1}' access.log | sort | uniq -c | sort -rn | head</pre><p>Разбор по шагам:</p><ol><li><code>awk</code> достаёт колонку с IP</li><li><code>sort</code> группирует одинаковые рядом</li><li><code>uniq -c</code> схлопывает и считает</li><li><code>sort -rn</code> сортирует по числу, по убыванию</li><li><code>head</code> оставляет первую десятку</li></ol><p><b>Почему sort обязателен:</b> <code>uniq</code> схлопывает только <i>соседние</i> одинаковые строки. Без предварительной сортировки счётчики будут неверными, и ты этого не заметишь.</p>"},
 {h:"Остальной инструментарий",b:"<pre>sort -h        <span class='c'># сортировка «человеческих» размеров: 5K, 2M, 1G</span>\nsort -rn       <span class='c'># по числу, по убыванию</span>\ncut -d: -f1 /etc/passwd   <span class='c'># колонка по разделителю</span>\ntr -d ' '      <span class='c'># удалить символы</span>\ndiff a.conf b.conf        <span class='c'># чем отличаются два файла</span>\nxargs          <span class='c'># превратить список в аргументы команды</span></pre><p><code>diff</code> незаменим при разборе «на стейдже работает, на проде нет»: сравнил конфиги — увидел причину.</p>"}],
 ch:[
 {t:"c",d:1,q:"Запиши обычный вывод скрипта ./deploy.sh в файл deploy.log, перезаписав его.",ans:["./deploy.sh > deploy.log",".\/deploy.sh >deploy.log"],hint:"один символ перенаправления",why:"> перезаписывает, >> дописывает. Перепутал — потерял историю запусков."},
 {t:"c",d:2,q:"Запиши и обычный вывод, и ошибки скрипта ./deploy.sh в файл deploy.log.",ans:["./deploy.sh > deploy.log 2>&1","./deploy.sh >deploy.log 2>&1","./deploy.sh &> deploy.log"],hint:"сначала перенаправить stdout, потом привязать stderr",why:"2>&1 копирует текущее назначение stdout. Поставишь раньше — ошибки останутся в терминале."},
 {t:"c",d:3,q:"Замени во всём файле app.conf порт 8080 на 3000 прямо в файле.",ans:["sed -i s/8080/3000/g app.conf","sed -i 's/8080/3000/g' app.conf","sed -i.bak 's/8080/3000/g' app.conf"],hint:"sed -i 's/…/…/g' файл",why:"Без g заменится только первое вхождение в строке. Привыкай к -i.bak: бэкап ничего не стоит."},
 {t:"q",d:4,q:"Что делает <code>awk '{print $1}' access.log | sort | uniq -c | sort -rn | head</code>?",a:["Сортирует лог по алфавиту","Показывает десять IP-адресов с наибольшим числом запросов","Удаляет повторяющиеся строки","Считает размер файла"],c:1,why:"Колонка → сортировка → подсчёт повторов → сортировка по числу → верхушка. Самый используемый однострочник при разборе трафика."},
 {t:"q",d:4,q:"Почему в этой цепочке перед <code>uniq -c</code> обязателен <code>sort</code>?",a:["Для красоты вывода","uniq схлопывает только соседние одинаковые строки — без сортировки счётчики будут неверными","sort ускоряет uniq","Так требует POSIX"],c:1,why:"Коварство в том, что команда отработает без ошибки и выдаст правдоподобные, но неправильные числа."},
 {t:"q",d:5,q:"<b>Инцидент.</b> Сайт лёг под нагрузкой. Нужно за минуту понять, это реальные пользователи или один источник забивает канал. Какая последовательность даст ответ быстрее всего?",a:["Открыть access.log в редакторе и листать","<code>tail -50000 access.log | awk '{print $1}' | sort | uniq -c | sort -rn | head</code> — топ IP за свежий хвост лога","<code>grep 200 access.log | wc -l</code>","Перезапустить nginx и посмотреть"],c:1,why:"Сначала сужаем окно (tail), потом считаем частоты. Если один-два адреса дают львиную долю запросов — это не наплыв клиентов, и лечится ограничением на уровне nginx или фаервола."}]}
);
