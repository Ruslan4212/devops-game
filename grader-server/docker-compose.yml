services:
  grader:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:8089:8089" # наружу — только через Caddy, не напрямую
    environment:
      # достаточно одного ключа: сервер берёт первый заданный, бесплатные идут первыми
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - GROQ_MODEL=${GROQ_MODEL:-llama-3.3-70b-versatile}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-2.0-flash}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - OPENROUTER_MODEL=${OPENROUTER_MODEL:-meta-llama/llama-3.3-70b-instruct:free}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - ANTHROPIC_MODEL=${ANTHROPIC_MODEL:-claude-haiku-4-5-20251001}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS}
