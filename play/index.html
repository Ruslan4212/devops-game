Для этого есть команда  ping . Она посылает крошечный пакет-«эй, ты тут?»
и ждёт ответа. Как эхо: крикнул — услышал отклик.`},{kind:"watch",run:"ping example.com",note:`Каждая строка  64 байт от ... время=12.4 мс  — это один вернувшийся отклик.

Внизу итог:  2 отправлено, 2 получено, 0% потерь . Значит связь есть и она стабильна.
Если бы писало «100% потерь» — пакеты не доходят вообще.`},{kind:"type",text:"Проверь сам. Набери:  ping example.com",cmd:"ping example.com"},{kind:"say",text:`Порядок проверки, который стоит запомнить — снизу вверх, от простого к сложному:

  1) dig   — имя вообще превращается в адрес?
  2) ping  — до машины доходят пакеты?
  3) curl  — а сама программа на ней отвечает?

Так ты быстро понимаешь, на каком уровне обрыв, и не чинишь наугад.`},{kind:"quiz",text:"ping показал «100% потерь». Что это значит?",options:["Пакеты до машины не доходят","Сайт работает нормально","Пароль неверный"],answer:0,explain:"Нет откликов — связи с машиной нет, дальше проверять веб-сервер бессмысленно."}]},{id:"4.3",act:4,title:"Порты — номера квартир",xp:20,intro:"IP — это дом, порт — квартира в нём. Программы сидят по портам.",steps:[{kind:"say",text:`На одной машине работают десятки программ: веб-сервер, база, почта.
IP-адрес у них общий — он один на всю машину. Как их различить?

Придумали порты. Если IP — это дом, то порт — номер квартиры в нём.`},{kind:"say",text:`Порт — просто число. Некоторые числа закреплены за привычными службами:

  22   — SSH (удалённый вход в терминал)
  80   — HTTP (обычный сайт)
  443  — HTTPS (сайт с шифрованием, замочек в браузере)

Главное правило: один порт на машине может занимать только одна программа.
Именно из-за этого в Акте 2 nginx не мог стартовать — порт 80 уже был занят.`},{kind:"say",text:`Посмотреть, кто какие порты занял — команда  ss  с флагами  -ltn :

  -l  listening — только те, кто ждёт входящие соединения
  -t  tcp       — только обычные сетевые соединения
  -n  numeric   — показывать числа, не подставлять имена`},{kind:"watch",run:"ss -ltn",note:`Столбец  Local Address:Port  — на каком порту программа слушает.
Столбец  Process  — кто именно это.

Сейчас занят только порт 22 — это sshd, служба удалённого входа.`},{kind:"type",text:"Посмотри сам. Набери:  ss -ltn",cmd:"ss -ltn"},{kind:"quiz",text:"Зачем нужны порты, если у машины уже есть IP-адрес?",options:["Чтобы на одной машине различать разные программы","Чтобы ускорить соединение","Чтобы шифровать данные"],answer:0,explain:"IP приводит к нужной машине, порт — к нужной программе на ней."}]},{id:"4.4",act:4,title:"Постучаться в сайт: curl",xp:20,intro:"curl отправляет запрос и показывает, что ответил сервер.",steps:[{kind:"say",text:`Адрес есть, машина отвечает, порт известен. Последний шаг — спросить саму программу.

Команда  curl  делает то же, что браузер: отправляет запрос и получает ответ.
Только без картинок — чистый текст. Идеально, чтобы проверять из терминала.`},{kind:"watch",run:"curl https://example.com",note:"Вернулось содержимое страницы. Ровно то, что браузер потом нарисовал бы красиво."},{kind:"say",text:`Часто содержимое не нужно — важно только, ОТВЕТИЛ ли сервер и как.

Для этого флаг  -I  (большая буква i): показать только заголовки ответа.
Самое важное там — код ответа, трёхзначное число.`},{kind:"watch",run:"curl -I https://example.com",note:`Первая строка:  HTTP/1.1 200 OK

200 — это код ответа. Его смысл всегда читается по первой цифре:

  2xx — всё хорошо (200 OK)
  3xx — переехало на другой адрес
  4xx — ошибка на стороне клиента (404 — страницы нет)
  5xx — ошибка на стороне сервера (502, 503 — сервер сломался)

Запомни только первую цифру — этого хватает в 90% случаев.`},{kind:"type",text:"Проверь заголовки сам. Набери:  curl -I https://example.com",cmd:"curl -I https://example.com"},{kind:"quiz",text:"Сервер ответил кодом 503. Чья это проблема?",options:["Сервера — 5xx означает ошибку на его стороне","Клиента — он неправильно ввёл адрес","Это успех"],answer:0,explain:"Первая цифра 5 — проблема на сервере. 4xx было бы про клиента."}]},{id:"4.5",act:4,title:"Файрвол: охранник на входе",xp:20,intro:"Файрвол решает, какие порты открыты снаружи.",setup:t=>{t.firewall={22:!0,80:!0}},steps:[{kind:"say",text:`Программа может прекрасно работать и слушать свой порт — а снаружи всё равно не достучаться.

Потому что перед машиной стоит охранник — файрвол (firewall, «огненная стена»).
Он смотрит на каждое входящее соединение и решает: пропустить или молча выбросить.`},{kind:"say",text:`Зачем он нужен: чтобы наружу торчало только то, что действительно должно.
База данных, например, обычно не должна быть доступна из интернета вообще.

Простой файрвол в Linux — программа  ufw . Управление требует  sudo .`},{kind:"watch",run:"sudo ufw status",note:`Список правил: какие порты разрешены (ALLOW).
Сейчас открыты 22 (вход по SSH) и 80 (обычный сайт). Порта 443 в списке нет.`},{kind:"say",text:`Открыть порт:  sudo ufw allow НОМЕР
Закрыть:       sudo ufw deny НОМЕР

Откроем 443 — тот самый порт для сайтов с шифрованием.`},{kind:"watch",run:"sudo ufw allow 443",note:"Правило добавлено — порт 443 теперь пропускается."},{kind:"type",text:"Посмотри правила сам. Набери:  sudo ufw status",cmd:"sudo ufw status"},{kind:"quiz",text:"Программа слушает порт, но снаружи не отвечает. Одна из частых причин —",options:["Файрвол не пропускает этот порт","У программы нет имени","Кончилась память"],answer:0,explain:"Классика: служба работает, а охранник на входе её трафик не пускает."}]},{id:"4.6",act:4,title:"Инцидент: сервис недоступен ⚡",xp:45,intro:"Разбираем по слоям: DNS → сеть → сервис → файрвол.",setup:t=>{t.firewall={22:!0,80:!0}},steps:[{kind:"say",text:`Жалоба: «api.shop.local не отвечает, всё сломалось».

Не бросайся чинить наугад. Идём по слоям снизу вверх — так ты за минуту
сузишь поиск с «где-то что-то» до конкретной причины:

  1) DNS      — имя превращается в адрес?
  2) сеть     — пакеты доходят?
  3) сервис   — программа отвечает?
  4) файрвол  — а её вообще пускают снаружи?`},{kind:"do",text:"Шаг 1. Проверь, что имя  api.shop.local  превращается в адрес.",check:v(/^dig\b.*api\.shop\.local/),answer:"dig api.shop.local",hint:"Команда  dig  и имя  api.shop.local"},{kind:"say",text:`Ответ получен, адрес есть — 10.0.0.21. Значит DNS в порядке, слой 1 исключаем.

Идём дальше: попробуем реально постучаться в сервис.`},{kind:"do",text:"Шаг 2. Попробуй обратиться к сервису:  curl https://api.shop.local",check:tt(/^curl\b.*api\.shop\.local/),answer:"curl https://api.shop.local",hint:"Команда  curl  и адрес  https://api.shop.local"},{kind:"say",text:`Смотри внимательно на ошибку — она очень говорящая:

  Connection timed out  (истекло время ожидания)

Это НЕ то же самое, что «Connection refused» (соединение отвергнуто). Разница огромная:

  refused   — до машины дошли, но никто не слушает порт. Служба не запущена.
  timed out — ответа нет вообще, пакеты будто в пустоту. Так ведёт себя файрвол:
              он не отвечает «нет», он просто молча выбрасывает пакет.

Значит подозреваем охранника на входе.`},{kind:"do",text:"Шаг 3. Посмотри правила файрвола.",check:v(/^sudo\s+ufw\s+status/),answer:"sudo ufw status",hint:"sudo ufw status"},{kind:"say",text:`В списке есть 22 и 80. А порта  443  нет — а именно он нужен для https.

Причина найдена: файрвол не пропускает трафик на 443.`},{kind:"do",text:"Шаг 4. Открой порт 443.",check:t=>t.firewall[443]===!0,answer:"sudo ufw allow 443",hint:"sudo ufw allow  и номер порта  443"},{kind:"do",text:"Шаг 5. Убедись, что теперь сервис отвечает.",check:t=>t.log.some(e=>/curl.*api\.shop\.local/.test(e.cmd)&&e.code===0),answer:"curl https://api.shop.local",hint:"Повтори тот же curl:  curl https://api.shop.local"},{kind:"say",text:`Инцидент закрыт. Обрати внимание: ни одной строчки кода мы не тронули —
проблема была в сети, а не в программе.

Главное из этого акта: разбирать по слоям и читать текст ошибки.
«timed out» и «refused» — это две разные причины и два разных решения.`},{kind:"quiz",text:"curl вернул «Connection refused». Что это скорее всего значит?",options:["До машины дошли, но программа на этом порту не запущена","Файрвол выбросил пакет","Имя не резолвится"],answer:0,explain:"refused — машина ответила «тут никого нет». Файрвол ведёт себя иначе: молчит, и получается timed out."}]}];function W(t){O(t,"/home/devops/app"),R(t,"/home/devops/app/index.js",`console.log('магазин запущен');

  отчёт.docx
  отчёт_v2.docx
  отчёт_финал.docx
  отчёт_финал_правки.docx
  отчёт_финал_правки_ЭТОТ.docx

И никто уже не помнит, чем они отличаются и какой из них рабочий.`},{kind:"say",text:`С кодом эта проблема ещё злее. Добавь сюда, что над ним работают пять человек одновременно.

Нужен инструмент, который умеет три вещи:

  1) хранить всю историю изменений — кто, что и когда поменял
  2) откатывать назад, если сломали
  3) сливать правки нескольких людей без потерь`},{kind:"say",text:`Такой инструмент называется система контроля версий. Самая распространённая —  Git .

Он не хранит пять копий файла. Он хранит ИЗМЕНЕНИЯ:
«в этот момент в такой-то строке было так, стало эдак».

Поэтому можно вернуться в любую точку истории — как перемотать плёнку назад.`},{kind:"say",text:`Зачем это тебе как DevOps.

В Git хранится не только код приложения. Там же лежат настройки серверов,
описания инфраструктуры и пайплайны — всё то, чем ты займёшься в следующих актах.

Git — это единый источник правды и точка отката для всего.`},{kind:"quiz",text:"Что Git хранит на самом деле?",options:["Историю изменений — можно вернуться в любую точку","Пять копий каждого файла с разными именами","Только последнюю версию файла"],answer:0,explain:"Git запоминает, что именно поменялось. Поэтому история занимает мало места и можно откатиться назад."}]},{id:"5.2",act:5,title:"Создать репозиторий: git init",xp:15,intro:"Репозиторий — папка, за которой Git начал следить.",setup:W,steps:[{kind:"say",text:`Git следит не за всем компьютером, а за конкретными папками.

Что произошло: внутри папки появилась скрытая папка  .git  — там Git будет хранить
всю историю. Твои файлы при этом не изменились ни на байт.`},{kind:"watch",run:"ls -a",note:`Флаг  -a  показывает скрытые файлы (те, чьё имя начинается с точки).

Представь, что ты собираешь посылку:

  1) Вещи лежат по комнате   — файл изменён, но Git его не берёт
  2) Ты сложил их в коробку  — файл добавлен в «индекс», готов к отправке
  3) Ты заклеил и отправил   — сделан коммит, изменения записаны в историю`},{kind:"say",text:`Названия по-английски:

  1) working directory — рабочая папка
  2) staging area / index — «коробка», куда складывают перед отправкой
  3) repository — история

Зачем нужна коробка посередине? Чтобы ты САМ решал, что попадёт в эту отправку,
а что подождёт следующей. Поменял десять файлов — можешь отправить только три.`},{kind:"say",text:`Команда, которая показывает, кто где находится —  git status .

Это самая частая команда в Git. Не помнишь, что происходит — набери status.
Он не только показывает состояние, но и подсказывает, что делать дальше.`},{kind:"watch",run:"git status",note:`Читаем ответ:

  На ветке main          — где мы находимся (про ветки будет дальше)
  Неотслеживаемые файлы  — Git видит эти файлы, но пока не следит за ними.
                           Они «лежат по комнате», в коробку не сложены.

И внизу сам Git подсказывает: используйте git add.`},{kind:"type",text:"Спроси состояние сам. Набери:  git status",cmd:"git status"},{kind:"quiz",text:"Зачем в Git есть промежуточная «коробка» (индекс)?",options:["Чтобы самому выбирать, какие изменения попадут в коммит","Чтобы файлы загружались быстрее","Это техническая мелочь, её можно игнорировать"],answer:0,explain:"Поменял много — отправь только то, что относится к одной задаче. Так история остаётся понятной."}]},{id:"5.4",act:5,title:"Сложить в коробку: git add",xp:20,intro:"git add переносит файл в индекс — готовит к коммиту.",setup:t=>{W(t),O(t,"/home/devops/app/.git"),t.git={branch:"main",branches:["main"],staged:[],commits:[],remote:null,pushed:0}},steps:[{kind:"say",text:`Команда  git add  кладёт файл в коробку (индекс).

Два способа:

  git add index.js   — положить один конкретный файл
  git add .          — положить всё, что есть в текущей папке

  Изменения, которые будут закоммичены:  новый файл: index.js

он остался лежать по комнате.`},{kind:"watch",run:"git add .",note:"Теперь положили всё остальное одной командой."},{kind:"watch",run:"git status",note:"Оба файла в коробке. Раздела «неотслеживаемые» больше нет — всё готово к отправке."},{kind:"type",text:"Сложи всё в коробку сам. Набери:  git add .",cmd:"git add ."},{kind:"quiz",text:"Что делает  git add . ?",options:["Кладёт в индекс все файлы текущей папки, готовя их к коммиту","Сразу сохраняет изменения в историю","Отправляет файлы на сервер"],answer:0,explain:"add только готовит. Записывает в историю следующая команда — commit."}]},{id:"5.5",act:5,title:"Запечатать: git commit",xp:25,intro:"Коммит — точка в истории, куда можно вернуться.",setup:t=>{W(t),O(t,"/home/devops/app/.git"),t.git={branch:"main",branches:["main"],staged:["index.js","README.md"],commits:[],remote:null,pushed:0}},steps:[{kind:"say",text:`Коробка собрана. Теперь запечатаем её и запишем в историю — это называется «коммит».

Коммит — это сохранённая точка. Как сохранение в игре: всегда можно вернуться сюда.`},{kind:"say",text:`Команда:

  git commit -m "описание того, что сделал"

Разбор:

  commit  — запечатать
  -m      — от message, «сообщение». Без этого флага Git откроет редактор и запутает.
  "..."   — текст в кавычках: что именно ты поменял`},{kind:"say",text:`Про сообщение. Оно кажется формальностью — но именно его будут читать
через полгода, когда что-то сломается и надо понять, где.

  Плохо:  "фикс", "тест", "ещё правки", "ааа"
  Хорошо: "добавил корзину", "починил падение при пустом заказе"

  [main a1b2c3d] первый коммит

и неповторимый. Такой сервер страшно трогать и невозможно воспроизвести.`},{kind:"say",text:`Решение: переносить не только код, а СРАЗУ ВСЁ окружение целиком.
Одной запечатанной коробкой, которая везде разворачивается одинаково.

Такая коробка называется КОНТЕЙНЕР. Инструмент для работы с ними —  Docker .`},{kind:"quiz",text:"В чём корень проблемы «у меня работает, а на сервере нет»?",options:["Переносят только код, а окружение на машинах разное","Сервер всегда медленнее ноутбука","Код написан с ошибками"],answer:0,explain:"Разные версии языка, библиотек и системных пакетов. Контейнер переносит окружение вместе с кодом."}]},{id:"6.2",act:6,title:"Что такое контейнер",xp:20,intro:"Контейнер — изолированная коробка с приложением и всем, что ему нужно.",steps:[{kind:"say",text:`Контейнер — это запущенная программа, упакованная вместе со всем своим окружением
и отделённая от остальной системы.

Аналогия из жизни: морской контейнер. Внутри может быть что угодно — бананы, станки, мебель.
Снаружи это одинаковая железная коробка стандартного размера.

Поэтому любой порт и любое судно умеют с ней работать, не разбираясь в содержимом.`},{kind:"say",text:`То же с программным контейнером. Внутри — Python, Java или Node, неважно.
Снаружи Docker работает со всеми одинаково: запустить, остановить, посмотреть логи.

Что даёт изоляция:

  • у контейнера своя файловая система — он не видит твои файлы
  • свои процессы — он не видит чужие программы
  • свои библиотеки — можно держать рядом Node 16 и Node 20, они не подерутся`},{kind:"say",text:`Частый вопрос: чем это отличается от виртуальной машины?

  Виртуальная машина: внутри целая вторая операционная система со своим ядром.
                      Весит гигабайты, стартует минуту.

  Контейнер:          использует ядро операционной системы хозяина.
                      Весит десятки мегабайт, стартует за секунду.

Грубо: ВМ — это отдельный дом со своим фундаментом. Контейнер — квартира
в общем доме: стены свои, а фундамент и коммуникации общие.`},{kind:"say",text:`Именно поэтому контейнеров на одной машине можно запустить сотни, а виртуалок — единицы.

И именно поэтому в Акте 9 (Kubernetes) мы будем гонять десятки копий приложения:
с контейнерами это дёшево.`},{kind:"quiz",text:"Чем контейнер принципиально отличается от виртуальной машины?",options:["Использует ядро операционной системы хозяина, поэтому лёгкий и быстрый","Внутри него полноценная вторая операционная система","Ничем, это разные названия одного и того же"],answer:0,explain:"ВМ тащит своё ядро и весит гигабайты. Контейнер переиспользует ядро хозяина — отсюда скорость и лёгкость."}]},{id:"6.3",act:6,title:"Образ и контейнер: рецепт и блюдо",xp:20,intro:"Образ — неизменяемый шаблон. Контейнер — его запущенный экземпляр.",steps:[{kind:"say",text:`Два слова, которые новички путают чаще всего: ОБРАЗ и КОНТЕЙНЕР.

Разница простая:

  Образ (image)         — рецепт в книге. Лежит, не меняется, сам ничего не делает.
  Контейнер (container) — блюдо, приготовленное по рецепту. Живёт, работает, потом исчезает.`},{kind:"say",text:`Из одного рецепта можно приготовить сколько угодно блюд.

Из одного образа можно запустить сколько угодно контейнеров — они будут одинаковые.
Именно так масштабируют нагрузку: нужно больше мощности — запускают ещё контейнеры
из того же образа.`},{kind:"say",text:`Ещё одно важное свойство образа: он состоит из СЛОЁВ.

Каждый шаг сборки добавляет свой слой поверх предыдущего:

  слой 1: базовая система (Node 20)
  слой 2: скопированные файлы проекта
  слой 3: установленные библиотеки

Слои не меняются. Если пересобрать образ и первый слой не поменялся —
Docker переиспользует его, а не скачивает заново. Поэтому вторая сборка быстрая.`},{kind:"say",text:`И последнее про образ: он неизменяем (immutable).

Нельзя «поправить образ». Можно только собрать новый.
Это не ограничение, а гарантия: если у тебя и на сервере один и тот же образ —
внутри у вас гарантированно одно и то же. Никаких сюрпризов.`},{kind:"quiz",text:"Ты запустил три контейнера из одного образа. Что верно?",options:["Все три одинаковые внутри, образ при этом не изменился","Образ разделился на три части","Так делать нельзя — из образа можно запустить только один контейнер"],answer:0,explain:"Образ — неизменяемый шаблон. Из него запускают сколько угодно одинаковых контейнеров."}]},{id:"6.4",act:6,title:"Dockerfile: строка FROM",xp:20,intro:"Dockerfile — рецепт образа. Первая строка говорит, с чего начать.",setup:V,steps:[{kind:"say",text:`Чтобы собрать свой образ, нужен рецепт. Рецепт пишут в файл с именем  Dockerfile
(именно так, с большой буквы и без расширения).

Внутри — список инструкций, по одной на строку. Docker выполняет их сверху вниз.`},{kind:"say",text:`Первая инструкция всегда  FROM  — «начать с».

  FROM node:20-alpine

Это значит: возьми готовый образ node версии 20 как основу, а дальше я допишу своё.

Ты почти никогда не собираешь образ с нуля. Всегда берёшь готовый базовый —
с нужным языком внутри — и добавляешь туда свой код.`},{kind:"say",text:`Разберём запись  node:20-alpine  по частям:

  node    — имя образа (в нём уже установлен Node.js)
  :20     — тег, то есть версия. Двоеточие отделяет имя от версии.
  -alpine — вариант на очень лёгкой системе Alpine Linux

Про alpine стоит запомнить: обычный образ node весит ~1 ГБ, alpine-вариант ~50 МБ.
Меньше образ — быстрее выкатка и меньше места, где может прятаться уязвимость.`},{kind:"say",text:`Важно про теги. Есть тег  latest  («последний») — так вот, его в проде не используют.

Сегодня latest это версия 20, завтра — 21, и твоя сборка внезапно ломается.
Всегда указывай конкретную версию:  node:20-alpine , а не  node:latest .`},{kind:"quiz",text:"Почему в проде не пишут  FROM node:latest ?",options:["latest со временем меняется и сборка может внезапно сломаться","latest весит слишком много","latest — платный образ"],answer:0,explain:"Нужна воспроизводимость: одна и та же строка должна давать один и тот же образ и через год."}]},{id:"6.5",act:6,title:"Dockerfile: WORKDIR и COPY",xp:20,intro:"Выбираем папку внутри образа и кладём туда свой код.",setup:V,steps:[{kind:"say",text:`Основа взята. Теперь надо положить внутрь свой код. Две инструкции:

  WORKDIR /app   — «перейди в папку /app внутри образа»
  COPY . .       — «скопируй файлы снаружи внутрь»`},{kind:"say",text:`WORKDIR — это как команда  cd , только внутри будущего образа.

Если папки  /app  не существует — Docker создаст её сам.
Все следующие инструкции будут выполняться уже из неё.

Зачем: чтобы код лежал в предсказуемом месте, а не был раскидан по корню.`},{kind:"say",text:`COPY принимает два аргумента: откуда и куда.

  COPY . .
       ↑ ↑
       │ └── куда: текущая папка ВНУТРИ образа (то есть /app из WORKDIR)
       └──── откуда: текущая папка СНАРУЖИ, где лежит Dockerfile

Две точки выглядят загадочно, но это просто «всё отсюда — вот туда».`},{kind:"say",text:`Кстати, помнишь  .gitignore  из Акта 5? У Docker есть такой же файл —  .dockerignore

Он нужен ровно за тем же: не тащить внутрь образа мусор и секреты.
Без него  COPY . .  затащит и папку node_modules, и файл .env с паролями.`},{kind:"quiz",text:"Что делает инструкция  WORKDIR /app ?",options:["Переходит в папку /app внутри образа, создавая её при необходимости","Копирует файлы в папку /app","Удаляет папку /app"],answer:0,explain:"WORKDIR — это cd внутри образа. Копирование — отдельная инструкция COPY."}]},{id:"6.6",act:6,title:"Dockerfile: CMD и пишем файл целиком",xp:25,intro:"CMD говорит, что запускать, когда контейнер стартует.",setup:t=>{V(t),t.templates={"/home/devops/app/Dockerfile":`# ЗАДАЧА: напиши рецепт образа. Нужны четыре строки.
# Сотри эти комментарии и впиши:
#
#   FROM node:20-alpine
#   WORKDIR /app
#   COPY . .
#   CMD ["node", "index.js"]
`}},steps:[{kind:"say",text:`Осталась последняя обязательная инструкция —  CMD .

Она отвечает на вопрос: «что запустить, когда контейнер включится?»

Без неё образ соберётся, но контейнер сразу завершится — ему нечего делать.`},{kind:"say",text:`Пишется так:

  CMD ["node", "index.js"]

Обрати внимание на форму записи: квадратные скобки, а внутри каждое слово
в отдельных двойных кавычках через запятую.

Читается: «запусти программу node и передай ей аргумент index.js».
То же самое, что набрать в терминале  node index.js .`},{kind:"say",text:`Соберём весь рецепт вместе. Четыре строки:

  FROM node:20-alpine       ← с чего начать
  WORKDIR /app              ← в какой папке работать
  COPY . .                  ← что положить внутрь
  CMD ["node", "index.js"]   ← что запускать

Этой структуры хватает для большинства простых приложений.`},{kind:"do",text:`Задача: напиши Dockerfile. Набери в терминале:
edit Dockerfile
В редакторе будет подсказка — сотри её и впиши четыре настоящие строки. Сохрани.`,check:t=>w("/home/devops/app/Dockerfile",/^\s*FROM\s+\S+/mi)(t)&&w("/home/devops/app/Dockerfile",/^\s*CMD\s+/mi)(t),answer:et,editFile:"/home/devops/app/Dockerfile",hint:`Открой  edit Dockerfile  и впиши ровно это:
FROM node:20-alpine
WORKDIR /app
COPY . .
CMD ["node","index.js"]`},{kind:"quiz",text:"Что произойдёт, если в Dockerfile нет инструкции CMD?",options:["Контейнер не будет знать, что запускать, и сразу завершится","Образ вообще не соберётся никогда","Ничего, CMD не обязательна"],answer:0,explain:"Контейнер существует, пока внутри работает программа. Не задал программу — нечему работать."}]},{id:"6.7",act:6,title:"Собрать образ: docker build",xp:25,intro:"build читает рецепт и создаёт образ.",setup:jt,steps:[{kind:"say",text:`Рецепт написан. Готовим по нему образ — команда  docker build .

  docker build -t shop:1.0 .

Разберём по частям, тут есть неочевидное.`},{kind:"say",text:`  -t shop:1.0

  -t     — от tag, «дай имя». Без имени образ будет безымянным и неудобным.
  shop   — имя образа
  :1.0   — версия, через двоеточие. Та же логика, что у node:20-alpine.

Версию ставят всегда. Через месяц будет shop:1.1, shop:2.0 — и можно вернуться назад.`},{kind:"say",text:`  .   ← вот эта точка в самом конце

Это САМАЯ частая ошибка новичков — её забывают, и команда падает.

Точка означает «контекст сборки»: папка, откуда Docker берёт файлы и Dockerfile.
Точка = текущая папка, та же самая точка, что ты знаешь из Акта 1.`},{kind:"watch",run:"docker build -t shop:1.0 .",note:`Смотри на вывод — Docker честно рассказывает, что делает:

  Step 1/4 : FROM node:20-alpine   ← взял основу
  Step 2/4 : WORKDIR /app          ← перешёл в папку
  Step 3/4 : COPY . .              ← скопировал файлы
  Step 4/4 : CMD [...]             ← записал команду запуска

Каждый шаг — это один слой. В конце:  Successfully tagged shop:1.0 .`},{kind:"type",text:`Собери образ сам. Набери:  docker build -t shop:1.0 .
(не забудь точку в конце!)`,cmd:"docker build -t shop:1.0 ."},{kind:"quiz",text:"Что означает точка в конце команды  docker build -t shop:1.0 . ?",options:["Папку, откуда брать Dockerfile и файлы проекта","Это опечатка, точка не нужна","Конец команды, как в предложении"],answer:0,explain:"Точка — контекст сборки, текущая папка. Забыть её — самая частая ошибка при первой сборке."}]},{id:"6.8",act:6,title:"Что получилось: docker images",xp:15,intro:"Список собранных образов на машине.",setup:q,steps:[{kind:"say",text:"Образ собран и лежит на твоей машине. Посмотреть все образы — команда  docker images ."},{kind:"watch",run:"docker images",note:`Видим наш  shop:1.0  и количество слоёв.

В настоящем Docker тут ещё колонка с размером — на неё стоит поглядывать.
Образ на 1 ГБ будет качаться на каждый сервер при каждой выкатке.`},{kind:"type",text:"Посмотри список образов. Набери:  docker images",cmd:"docker images"},{kind:"say",text:`Практический совет про слои и скорость сборки.

Docker переиспользует слои, которые не изменились. Но если поменялся слой №2 —
все слои НИЖЕ него пересобираются заново.

Поэтому опытные инженеры кладут редко меняющееся вверх (установка библиотек),
а часто меняющееся вниз (свой код). Тогда обычная пересборка занимает секунды.`},{kind:"quiz",text:"Почему стоит следить за размером образа?",options:["Он качается на каждый сервер при каждой выкатке — большой образ замедляет всё","Docker берёт деньги за размер","Размер ни на что не влияет"],answer:0,explain:"Меньше образ — быстрее деплой и меньше поверхность для уязвимостей."}]},{id:"6.9",act:6,title:"Первый запуск: docker run",xp:20,intro:"run превращает образ в работающий контейнер.",setup:q,steps:[{kind:"say",text:`Рецепт готов — приготовим блюдо. Команда  docker run  берёт образ и запускает контейнер.

Самая простая форма:

  docker run shop:1.0`},{kind:"watch",run:"docker run shop:1.0",note:`Docker ответил длинной строкой из букв и цифр — это идентификатор нового контейнера.

Контейнер создан и запущен из нашего образа.`},{kind:"say",text:`Важно понимать, что произошло:

  образ  shop:1.0    остался на месте, неизменным
  контейнер          создался новый, из этого образа

Запусти команду ещё раз — получишь ВТОРОЙ контейнер, независимый от первого.
Образ при этом по-прежнему один.`},{kind:"type",text:"Запусти контейнер сам. Набери:  docker run shop:1.0",cmd:"docker run shop:1.0"},{kind:"quiz",text:"Ты дважды выполнил  docker run shop:1.0 . Что получилось?",options:["Два независимых контейнера из одного образа","Один контейнер, второй запуск ничего не сделал","Два образа"],answer:0,explain:"Каждый run создаёт новый контейнер. Образ остаётся один и не меняется."}]},{id:"6.10",act:6,title:"Фоновый режим и имя контейнера",xp:20,intro:"Флаги -d и --name делают контейнер удобным в работе.",setup:q,steps:[{kind:"say",text:`У команды run есть два флага, без которых на практике не обходятся.

Первый:  -d  (от detached, «отсоединённый»).

Без него терминал «залипает» на контейнере: ты видишь его вывод и не можешь
набирать команды, пока не остановишь. С  -d  контейнер уходит в фон,
а терминал сразу свободен.`},{kind:"say",text:`Второй флаг:  --name

Без него Docker придумает контейнеру случайное имя вроде  nervous_hawking .
Смешно ровно один раз. Потом ты будешь копировать эти имена, чтобы посмотреть логи.

  --name web

Дал понятное имя — и дальше работаешь с ним:  docker logs web ,  docker stop web .`},{kind:"watch",run:"docker run -d --name web shop:1.0",note:"Запустили в фоне под именем  web . Терминал сразу свободен для следующих команд."},{kind:"type",text:"Запусти с именем сам. Набери:  docker run -d --name web shop:1.0",cmd:"docker run -d --name web shop:1.0"},{kind:"quiz",text:"Зачем нужен флаг  -d  у  docker run ?",options:["Контейнер уходит в фон и не занимает твой терминал","Контейнер запускается быстрее","Контейнер удаляется после остановки"],answer:0,explain:"-d = detached. Без него терминал будет занят выводом контейнера."}]},{id:"6.11",act:6,title:"Порты: пробрасываем наружу",xp:25,intro:"Контейнер изолирован. Чтобы достучаться — нужен проброс порта.",setup:q,steps:[{kind:"say",text:`Помнишь, контейнер изолирован? Это касается и сети.

Внутри контейнера приложение слушает порт 80. Но снаружи, с твоей машины,
туда не достучаться — контейнер как закрытая коробка.

Нужно проделать в коробке «окошко». Это называется проброс порта.`},{kind:"say",text:`Делается флагом  -p  (от publish, «опубликовать»):

  -p 8080:80

Два числа через двоеточие. Порядок КРИТИЧЕН, и его постоянно путают:

  8080  — порт на ТВОЕЙ машине (хост), снаружи
    80  — порт ВНУТРИ контейнера

Запомни направление: СНАРУЖИ:ВНУТРИ. Слева то, куда стучишься ты.`},{kind:"say",text:`Зачем вообще разные номера? Потому что снаружи порт может быть занят.

Внутри каждого контейнера своё изолированное пространство — там хоть десять
приложений на порту 80. А на твоей машине порт 80 один, и его может занимать nginx.

Поэтому: внутри 80, а наружу выставляем свободный 8080.`},{kind:"watch",run:"docker run -d -p 8080:80 --name web shop:1.0",note:`Запустили с окошком: обращение на 8080 твоей машины попадёт на 80 внутри контейнера.

Собираем флаги вместе:  -d  в фон,  -p  окошко,  --name  понятное имя.`},{kind:"type",text:`Запусти с пробросом порта. Набери:
docker run -d -p 8080:80 --name web shop:1.0`,cmd:"docker run -d -p 8080:80 --name web shop:1.0"},{kind:"quiz",text:"Что означает  -p 3000:80 ?",options:["Обращения на порт 3000 твоей машины идут на порт 80 внутри контейнера","Обращения на порт 80 идут на порт 3000 внутри контейнера","Контейнер займёт оба порта на твоей машине"],answer:0,explain:"Формат СНАРУЖИ:ВНУТРИ. Слева — куда стучишься ты, справа — где слушает приложение."}]},{id:"6.12",act:6,title:"Проверяем, что работает",xp:20,intro:"docker ps показывает запущенные контейнеры, curl проверяет ответ.",setup:U,steps:[{kind:"say",text:`Контейнер запущен в фоне. Проверим, что он действительно живой.

<body>
<div class="top">
  <div class="logo"><i></i>TERMINAL OPS ACADEMY</div>
  <div class="xpwrap">
    <div class="r"><span id="rankTxt">Стажёр</span><span id="xpTxt">0 XP</span></div>
    <div class="xpbar"><i id="xpFill"></i></div>
  </div>
  <div class="rankchip" id="progChip">0 / 23 заданий</div>
  <div class="sp">
    <button class="tbtn" id="howBtn">как играть</button>
    <button class="tbtn" id="resetBtn">сброс</button>
  </div>
</div>

<div class="wrap">
  <div class="col rail-col"><div class="card scroll rail" id="rail"></div></div>
  <div class="col term-col">
    <div class="term">
      <div class="termbar"><span class="dots"><s></s><s></s><s></s></span><span>bash</span></div>
      <div class="out" id="out"></div>
      <form class="inline" id="cmdForm" autocomplete="off">
        <span class="p" id="prompt">$</span>
        <input id="cmd" autocomplete="off" autocapitalize="off" spellcheck="false"
               placeholder="набери команду и нажми Enter (help — список команд)">
      </form>
    </div>
  </div>
  <div class="col brief-col"><div class="card scroll brief" id="brief"></div></div>
</div>

<div class="ov hide" id="edOv">
  <div class="sheet">
    <header><span>редактор</span><span class="fn" id="edName">file</span></header>
    <div class="body"><textarea id="edText" spellcheck="false"></textarea></div>
    <footer>
      <span class="tip">Ctrl+S — сохранить</span>
      <button class="sec" id="edCancel">отмена</button>
      <button class="prim" id="edSave">Сохранить</button>
    </footer>
  </div>
</div>

<div class="ov hide" id="modOv"><div class="modal" id="modBody"></div></div>
<div class="toast" id="toast"></div>

</body>
</html>
