Это как почтовый адрес: по нему данные находят нужную машину.

  example.com.  300  IN  A  93.184.216.34

Это первое, что проверяют при «сайт не открывается»: а имя вообще превращается в адрес?

Для этого есть команда  ping . Она посылает крошечный пакет-«эй, ты тут?»
и ждёт ответа. Как эхо: крикнул — услышал отклик.`},{kind:"watch",run:"ping example.com",note:`Каждая строка  64 байт от ... время=12.4 мс  — это один вернувшийся отклик.

Внизу итог:  2 отправлено, 2 получено, 0% потерь . Значит связь есть и она стабильна.
Если бы писало «100% потерь» — пакеты не доходят вообще.`},{kind:"type",text:"Проверь сам. Набери:  ping example.com",cmd:"ping example.com"},{kind:"say",text:`Порядок проверки, который стоит запомнить — снизу вверх, от простого к сложному:

  1) dig   — имя вообще превращается в адрес?
  2) ping  — до машины доходят пакеты?
  3) curl  — а сама программа на ней отвечает?

Так ты быстро понимаешь, на каком уровне обрыв, и не чинишь наугад.`},{kind:"quiz",text:"ping показал «100% потерь». Что это значит?",options:["Пакеты до машины не доходят","Сайт работает нормально","Пароль неверный"],answer:0,explain:"Нет откликов — связи с машиной нет, дальше проверять веб-сервер бессмысленно."}]},{id:"4.3",act:4,title:"Порты — номера квартир",xp:20,intro:"IP — это дом, порт — квартира в нём. Программы сидят по портам.",steps:[{kind:"say",text:`На одной машине работают десятки программ: веб-сервер, база, почта.

Придумали порты. Если IP — это дом, то порт — номер квартиры в нём.`},{kind:"say",text:`Порт — просто число. Некоторые числа закреплены за привычными службами:

  22   — SSH (удалённый вход в терминал)
  80   — HTTP (обычный сайт)
  443  — HTTPS (сайт с шифрованием, замочек в браузере)

Главное правило: один порт на машине может занимать только одна программа.
Именно из-за этого в Акте 2 nginx не мог стартовать — порт 80 уже был занят.`},{kind:"say",text:`Посмотреть, кто какие порты занял — команда  ss  с флагами  -ltn :

  -t  tcp       — только обычные сетевые соединения
  -n  numeric   — показывать числа, не подставлять имена`},{kind:"watch",run:"ss -ltn",note:`Столбец  Local Address:Port  — на каком порту программа слушает.
Столбец  Process  — кто именно это.

Сейчас занят только порт 22 — это sshd, служба удалённого входа.`},{kind:"type",text:"Посмотри сам. Набери:  ss -ltn",cmd:"ss -ltn"},{kind:"quiz",text:"Зачем нужны порты, если у машины уже есть IP-адрес?",options:["Чтобы на одной машине различать разные программы","Чтобы ускорить соединение","Чтобы шифровать данные"],answer:0,explain:"IP приводит к нужной машине, порт — к нужной программе на ней."}]},{id:"4.4",act:4,title:"Постучаться в сайт: curl",xp:20,intro:"curl отправляет запрос и показывает, что ответил сервер.",steps:[{kind:"say",text:`Адрес есть, машина отвечает, порт известен. Последний шаг — спросить саму программу.

Команда  curl  делает то же, что браузер: отправляет запрос и получает ответ.
Только без картинок — чистый текст. Идеально, чтобы проверять из терминала.`},{kind:"watch",run:"curl https://example.com",note:"Вернулось содержимое страницы. Ровно то, что браузер потом нарисовал бы красиво."},{kind:"say",text:`Часто содержимое не нужно — важно только, ОТВЕТИЛ ли сервер и как.

Для этого флаг  -I  (большая буква i): показать только заголовки ответа.
Самое важное там — код ответа, трёхзначное число.`},{kind:"watch",run:"curl -I https://example.com",note:`Первая строка:  HTTP/1.1 200 OK

200 — это код ответа. Его смысл всегда читается по первой цифре:

  2xx — всё хорошо (200 OK)
  3xx — переехало на другой адрес
  4xx — ошибка на стороне клиента (404 — страницы нет)
  5xx — ошибка на стороне сервера (502, 503 — сервер сломался)

Потому что перед машиной стоит охранник — файрвол (firewall, «огненная стена»).
Он смотрит на каждое входящее соединение и решает: пропустить или молча выбросить.`},{kind:"say",text:`Зачем он нужен: чтобы наружу торчало только то, что действительно должно.
База данных, например, обычно не должна быть доступна из интернета вообще.

Простой файрвол в Linux — программа  ufw . Управление требует  sudo .`},{kind:"watch",run:"sudo ufw status",note:`Список правил: какие порты разрешены (ALLOW).
Сейчас открыты 22 (вход по SSH) и 80 (обычный сайт). Порта 443 в списке нет.`},{kind:"say",text:`Открыть порт:  sudo ufw allow НОМЕР
Закрыть:       sudo ufw deny НОМЕР

Откроем 443 — тот самый порт для сайтов с шифрованием.`},{kind:"watch",run:"sudo ufw allow 443",note:"Правило добавлено — порт 443 теперь пропускается."},{kind:"type",text:"Посмотри правила сам. Набери:  sudo ufw status",cmd:"sudo ufw status"},{kind:"quiz",text:"Программа слушает порт, но снаружи не отвечает. Одна из частых причин —",options:["Файрвол не пропускает этот порт","У программы нет имени","Кончилась память"],answer:0,explain:"Классика: служба работает, а охранник на входе её трафик не пускает."}]},{id:"4.6",act:4,title:"Инцидент: сервис недоступен ⚡",xp:45,intro:"Разбираем по слоям: DNS → сеть → сервис → файрвол.",setup:e=>{e.firewall={22:!0,80:!0}},steps:[{kind:"say",text:`Жалоба: «api.shop.local не отвечает, всё сломалось».

Не бросайся чинить наугад. Идём по слоям снизу вверх — так ты за минуту
сузишь поиск с «где-то что-то» до конкретной причины:

  1) DNS      — имя превращается в адрес?
  2) сеть     — пакеты доходят?
  3) сервис   — программа отвечает?
  4) файрвол  — а её вообще пускают снаружи?`},{kind:"do",text:"Шаг 1. Проверь, что имя  api.shop.local  превращается в адрес.",check:se(/^dig\b.*api\.shop\.local/),answer:"dig api.shop.local",hint:"Команда  dig  и имя  api.shop.local"},{kind:"say",text:`Ответ получен, адрес есть — 10.0.0.21. Значит DNS в порядке, слой 1 исключаем.

  Connection timed out  (истекло время ожидания)

Это НЕ то же самое, что «Connection refused» (соединение отвергнуто). Разница огромная:

  refused   — до машины дошли, но никто не слушает порт. Служба не запущена.
  timed out — ответа нет вообще, пакеты будто в пустоту. Так ведёт себя файрвол:
              он не отвечает «нет», он просто молча выбрасывает пакет.

Главное из этого акта: разбирать по слоям и читать текст ошибки.
«timed out» и «refused» — это две разные причины и два разных решения.`},{kind:"quiz",text:"curl вернул «Connection refused». Что это скорее всего значит?",options:["До машины дошли, но программа на этом порту не запущена","Файрвол выбросил пакет","Имя не резолвится"],answer:0,explain:"refused — машина ответила «тут никого нет». Файрвол ведёт себя иначе: молчит, и получается timed out."}]}];function Fe(e){de(e,"/home/devops/app"),te(e,"/home/devops/app/index.js",`console.log('магазин запущен');

Нужен инструмент, который умеет три вещи:

  1) хранить всю историю изменений — кто, что и когда поменял
  2) откатывать назад, если сломали
  3) сливать правки нескольких людей без потерь`},{kind:"say",text:`Такой инструмент называется система контроля версий. Самая распространённая —  Git .

Он не хранит пять копий файла. Он хранит ИЗМЕНЕНИЯ:
«в этот момент в такой-то строке было так, стало эдак».

Поэтому можно вернуться в любую точку истории — как перемотать плёнку назад.`},{kind:"say",text:`Зачем это тебе как DevOps.

В Git хранится не только код приложения. Там же лежат настройки серверов,

  1) Вещи лежат по комнате   — файл изменён, но Git его не берёт
  2) Ты сложил их в коробку  — файл добавлен в «индекс», готов к отправке
  3) Ты заклеил и отправил   — сделан коммит, изменения записаны в историю`},{kind:"say",text:`Названия по-английски:

  1) working directory — рабочая папка
  2) staging area / index — «коробка», куда складывают перед отправкой
  3) repository — история

Зачем нужна коробка посередине? Чтобы ты САМ решал, что попадёт в эту отправку,

Это самая частая команда в Git. Не помнишь, что происходит — набери status.
Он не только показывает состояние, но и подсказывает, что делать дальше.`},{kind:"watch",run:"git status",note:`Читаем ответ:

  На ветке main          — где мы находимся (про ветки будет дальше)
  Неотслеживаемые файлы  — Git видит эти файлы, но пока не следит за ними.
                           Они «лежат по комнате», в коробку не сложены.

  git add .          — положить всё, что есть в текущей папке

.env

Но представь: ты неделю делаешь большую новую функцию. Она наполовину готова

Если вы работаете в одной линии — вы мешаете друг другу.`},{kind:"say",text:`Решение — ветки (branch, «ветвь»).

Представь дерево. Есть главный ствол — его обычно называют  main .

а потом «прирастить» её обратно к стволу.`},{kind:"say",text:`Что это даёт:

  • твоя недоделка не ломает прод — она живёт в своей ветке
  • несколько человек работают параллельно и не мешают друг другу
  • готовую ветку можно проверить и только потом вливать

Главное правило команды: в  main  напрямую не коммитят. Всегда через ветку.`},{kind:"watch",run:"git branch",note:`Список веток. Сейчас она одна —  main , и звёздочка  *  показывает,

console.log('корзина готова');`},{kind:"do",text:"Шаг 2. Положи изменения в коробку.",check:e=>!!e.git&&(e.git.staged.length>0||e.git.commits.length>1),answer:"git add .",hint:"git add  и точка:  git add ."},{kind:"do",text:"Шаг 3. Сделай коммит с понятным описанием.",check:e=>!!e.git&&e.git.commits.length>1,answer:'git commit -m "добавил корзину"',hint:'git commit -m  и текст в кавычках:  git commit -m "добавил корзину"'},{kind:"say",text:`Работа сохранена — но только в ветке  feature-cart .

Это делается в два шага, и порядок важен:

  1) перейти В ТУ ветку, КУДА вливаем (обычно main)
  2) выполнить  git merge имя-ветки-откуда

Частая ошибка новичка — сделать merge, стоя не в той ветке. Запомни направление:
«прихожу туда, куда вливаю, и втягиваю к себе».`},{kind:"watch",run:"git switch main",note:"Вернулись в главную ветку. Обрати внимание: без  -c  — потому что main уже существует."},{kind:"watch",run:"git merge feature-cart",note:`«Fast-forward — ветка feature-cart влита в main».

Fast-forward («перемотка вперёд») означает, что в main ничего не менялось,
пока ты работал, — поэтому Git просто передвинул указатель вперёд. Самый простой случай.`},{kind:"say",text:`А если бы main тоже менялся, пока ты работал?

Тогда Git сам объединил бы обе линии изменений. А если бы вы с коллегой правили
ОДНУ И ТУ ЖЕ строку — Git остановился бы и сказал: «конфликт, разберись сам».

Конфликт — это не поломка. Это Git честно говорит: «я не знаю, чей вариант правильный».`},{kind:"type",text:"Вернись в главную ветку. Набери:  git switch main",cmd:"git switch main"},{kind:"do",text:"Задача: влей ветку  feature-cart  в main.",check:e=>!!e.git&&(e.git.merged||[]).includes("feature-cart"),answer:"git merge feature-cart",hint:"git merge  и имя ветки:  git merge feature-cart"},{kind:"quiz",text:"В какой ветке надо находиться, чтобы влить feature-cart в main?",options:["В main — вливают всегда «к себе»","В feature-cart","Без разницы"],answer:0,explain:"Сначала перейди туда, куда вливаешь, потом merge источника."}]},{id:"5.12",act:5,title:"Удалённый репозиторий",xp:20,intro:"Пока всё лежит только на твоём компьютере. Это опасно.",setup:we,steps:[{kind:"say",text:`Одна неприятная правда: всё, что мы делали, лежит только на твоём компьютере.

Сломался диск — пропало всё вместе с историей. И коллеги твой код не видят.`},{kind:"say",text:`Поэтому есть «удалённый репозиторий» (remote) — копия на сервере.
Сервисы, где их держат: GitHub, GitLab, Bitbucket.

Схема простая:

  твой компьютер  ←→  сервер  ←→  компьютер коллеги

Все синхронизируются через сервер посередине.`},{kind:"say",text:`Привязать свой репозиторий к серверу:

  git remote add origin АДРЕС

  remote add — «добавить удалённый»
  origin     — имя-псевдоним для этого адреса. Так его называют по традиции,
               чтобы потом писать короткое «origin» вместо длинной ссылки.`},{kind:"watch",run:"git remote add origin git@github.com:shop/api.git",note:"Молча привязали. Теперь Git знает, куда отправлять."},{kind:"watch",run:"git remote",note:"Проверка: показывает имя  origin  и адрес, который за ним стоит."},{kind:"type",text:"Привяжи сервер сам. Набери:  git remote add origin git@github.com:shop/api.git",cmd:"git remote add origin git@github.com:shop/api.git"},{kind:"quiz",text:"Что такое  origin  в Git?",options:["Имя-псевдоним для адреса удалённого репозитория","Название главной ветки","Команда для создания коммита"],answer:0,explain:"Это просто короткое имя вместо длинного адреса сервера. Традиционное, но не обязательное."}]},{id:"5.13",act:5,title:"Отправить на сервер: git push",xp:20,intro:"push отправляет твои коммиты в удалённый репозиторий.",setup:e=>{we(e),e.git.remote="git@github.com:shop/api.git"},steps:[{kind:"say",text:`Сервер привязан. Отправить туда свои коммиты — команда  git push  («толкнуть»).

Обратная команда —  git pull  («притянуть»): забрать с сервера то, что залили коллеги.
Пара push/pull и есть вся синхронизация.`},{kind:"watch",run:"git push",note:`Коммиты уехали на сервер. Теперь они есть не только у тебя:
диск можно сломать, код не пропадёт, и коллеги его увидят.`},{kind:"type",text:"Отправь свою работу. Набери:  git push",cmd:"git push"},{kind:"say",text:`Как это выглядит в реальной команде — цикл целиком:

  1) git switch -c feature-x   создал ветку под задачу
  2) поработал, git add, git commit
  3) git push                  отправил ветку на сервер
  4) на сайте открыл Pull Request — «прошу влить мою ветку»
  5) коллега посмотрел код, одобрил
  6) ветку влили в main

Шаг 4-5 называется «код-ревью». Именно поэтому в main не коммитят напрямую:
чужой взгляд ловит ошибки до того, как они попадут в прод.`},{kind:"say",text:`И самое главное для тебя как DevOps:

Именно момент  git push  запускает робота-сборщика — пайплайн.
Он соберёт проект, прогонит тесты и выкатит его. Этим займёмся в Акте 7.`},{kind:"quiz",text:"Чем отличаются  git push  и  git pull ?",options:["push отправляет твои изменения на сервер, pull забирает чужие оттуда","Это одно и то же","push сохраняет локально, pull удаляет"],answer:0,explain:"Толкнуть от себя — push. Притянуть к себе — pull."}]},{id:"5.14",act:5,title:"Проверка: полный цикл сам",xp:35,intro:"Пять шагов подряд, всё уже знакомо. Подсказки появятся сами.",setup:e=>{Fe(e),e.git=null},steps:[{kind:"say",text:`Финал Акта 5. Пройди полный цикл работы с Git самостоятельно.

Всё это ты уже делал по отдельности. Ошибёшься — появится подсказка,
ещё раз — готовый ответ. Провалить нельзя.`},{kind:"do",text:"Шаг 1. Преврати папку проекта в репозиторий.",check:e=>!!e.git,answer:"git init",hint:"Команда из урока 5.2:  git init"},{kind:"do",text:"Шаг 2. Положи все файлы в индекс (коробку).",check:e=>!!e.git&&(e.git.staged.length>0||e.git.commits.length>0),answer:"git add .",hint:"git add  и точка"},{kind:"do",text:"Шаг 3. Сделай коммит с понятным сообщением.",check:e=>!!e.git&&e.git.commits.length>0,answer:'git commit -m "начало проекта"',hint:"git commit -m  и текст в кавычках"},{kind:"do",text:"Шаг 4. Создай ветку  feature-search  и перейди в неё.",check:e=>e.git?.branch==="feature-search",answer:"git switch -c feature-search",hint:"git switch -c  и имя ветки"},{kind:"do",text:"Шаг 5. Посмотри историю коммитов.",check:se(/^git\s+log/),answer:"git log",hint:"git log"},{kind:"say",text:`Акт 5 пройден. Что ты теперь умеешь:

  • создавать репозиторий и понимать три состояния файла
  • add → commit — основной цикл сохранения работы
  • читать историю и писать понятные сообщения
  • работать в ветках и вливать их обратно
  • держать секреты вне репозитория (.gitignore)
  • отправлять код на сервер

Дальше — Docker: как упаковать приложение так, чтобы оно одинаково работало
и у тебя, и на сервере.`}]}],ht=`FROM node:20-alpine
WORKDIR /app
COPY . .
CMD ["node","index.js"]

`),e.cwd="/home/devops/app"}function Nt(e){tt(e),te(e,"/home/devops/app/Dockerfile",ht)}function Ne(e){Nt(e),e.docker.images.push({tag:"shop:1.0",layers:4})}function Ze(e){Ne(e),e.docker.containers.push({name:"web",image:"shop:1.0",state:"running",hostPort:8080,cPort:80,logs:["Starting server on :80","listening"]})}const Di=[{id:"6.1",act:6,title:"Проблема «у меня работает»",xp:15,intro:"Классическая беда: на твоём компьютере всё идёт, на сервере — нет.",steps:[{kind:"say",text:`Ситуация, которую видел каждый разработчик.

Ты написал программу. У тебя на компьютере она прекрасно работает.
Отправляешь на сервер — падает.

Ты говоришь: «Но у меня работает!». И ты не врёшь. Просто у вас разные компьютеры.`},{kind:"say",text:`Почему так выходит. Программе для работы нужно окружение:

  • нужная версия языка (у тебя Node 20, на сервере Node 16)
  • набор библиотек нужных версий
  • системные пакеты, шрифты, настройки

Ты переносишь только свой код. А всё окружение остаётся у тебя на компьютере.`},{kind:"say",text:`Раньше это решали инструкцией: «поставьте на сервер вот это, эту версию, эти пакеты».

Работало плохо. Инструкции устаревали, шаги пропускали, на разных серверах
получалось по-разному. Появился термин «снежинка» — сервер, настроенный вручную
и неповторимый. Такой сервер страшно трогать и невозможно воспроизвести.`},{kind:"say",text:`Решение: переносить не только код, а СРАЗУ ВСЁ окружение целиком.
Одной запечатанной коробкой, которая везде разворачивается одинаково.

Такая коробка называется КОНТЕЙНЕР. Инструмент для работы с ними —  Docker .`},{kind:"quiz",text:"В чём корень проблемы «у меня работает, а на сервере нет»?",options:["Переносят только код, а окружение на машинах разное","Сервер всегда медленнее ноутбука","Код написан с ошибками"],answer:0,explain:"Разные версии языка, библиотек и системных пакетов. Контейнер переносит окружение вместе с кодом."}]},{id:"6.2",act:6,title:"Что такое контейнер",xp:20,intro:"Контейнер — изолированная коробка с приложением и всем, что ему нужно.",steps:[{kind:"say",text:`Контейнер — это запущенная программа, упакованная вместе со всем своим окружением
и отделённая от остальной системы.

Аналогия из жизни: морской контейнер. Внутри может быть что угодно — бананы, станки, мебель.
Снаружи это одинаковая железная коробка стандартного размера.

Поэтому любой порт и любое судно умеют с ней работать, не разбираясь в содержимом.`},{kind:"say",text:`То же с программным контейнером. Внутри — Python, Java или Node, неважно.
Снаружи Docker работает со всеми одинаково: запустить, остановить, посмотреть логи.

Что даёт изоляция:

  • у контейнера своя файловая система — он не видит твои файлы
  • свои процессы — он не видит чужие программы
  • свои библиотеки — можно держать рядом Node 16 и Node 20, они не подерутся`},{kind:"say",text:`Частый вопрос: чем это отличается от виртуальной машины?

  Виртуальная машина: внутри целая вторая операционная система со своим ядром.
                      Весит гигабайты, стартует минуту.

  Контейнер:          использует ядро операционной системы хозяина.
                      Весит десятки мегабайт, стартует за секунду.

Грубо: ВМ — это отдельный дом со своим фундаментом. Контейнер — квартира
в общем доме: стены свои, а фундамент и коммуникации общие.`},{kind:"say",text:`Именно поэтому контейнеров на одной машине можно запустить сотни, а виртуалок — единицы.

И именно поэтому в Акте 9 (Kubernetes) мы будем гонять десятки копий приложения:
с контейнерами это дёшево.`},{kind:"quiz",text:"Чем контейнер принципиально отличается от виртуальной машины?",options:["Использует ядро операционной системы хозяина, поэтому лёгкий и быстрый","Внутри него полноценная вторая операционная система","Ничем, это разные названия одного и того же"],answer:0,explain:"ВМ тащит своё ядро и весит гигабайты. Контейнер переиспользует ядро хозяина — отсюда скорость и лёгкость."}]},{id:"6.3",act:6,title:"Образ и контейнер: рецепт и блюдо",xp:20,intro:"Образ — неизменяемый шаблон. Контейнер — его запущенный экземпляр.",steps:[{kind:"say",text:`Два слова, которые новички путают чаще всего: ОБРАЗ и КОНТЕЙНЕР.

Разница простая:

  Образ (image)         — рецепт в книге. Лежит, не меняется, сам ничего не делает.
  Контейнер (container) — блюдо, приготовленное по рецепту. Живёт, работает, потом исчезает.`},{kind:"say",text:`Из одного рецепта можно приготовить сколько угодно блюд.

Из одного образа можно запустить сколько угодно контейнеров — они будут одинаковые.
Именно так масштабируют нагрузку: нужно больше мощности — запускают ещё контейнеры
из того же образа.`},{kind:"say",text:`Ещё одно важное свойство образа: он состоит из СЛОЁВ.

Каждый шаг сборки добавляет свой слой поверх предыдущего:

  слой 1: базовая система (Node 20)
  слой 2: скопированные файлы проекта
  слой 3: установленные библиотеки

Слои не меняются. Если пересобрать образ и первый слой не поменялся —
Docker переиспользует его, а не скачивает заново. Поэтому вторая сборка быстрая.`},{kind:"say",text:`И последнее про образ: он неизменяем (immutable).

Нельзя «поправить образ». Можно только собрать новый.
Это не ограничение, а гарантия: если у тебя и на сервере один и тот же образ —
внутри у вас гарантированно одно и то же. Никаких сюрпризов.`},{kind:"quiz",text:"Ты запустил три контейнера из одного образа. Что верно?",options:["Все три одинаковые внутри, образ при этом не изменился","Образ разделился на три части","Так делать нельзя — из образа можно запустить только один контейнер"],answer:0,explain:"Образ — неизменяемый шаблон. Из него запускают сколько угодно одинаковых контейнеров."}]},{id:"6.4",act:6,title:"Dockerfile: строка FROM",xp:20,intro:"Dockerfile — рецепт образа. Первая строка говорит, с чего начать.",setup:tt,steps:[{kind:"say",text:`Чтобы собрать свой образ, нужен рецепт. Рецепт пишут в файл с именем  Dockerfile
(именно так, с большой буквы и без расширения).

Внутри — список инструкций, по одной на строку. Docker выполняет их сверху вниз.`},{kind:"say",text:`Первая инструкция всегда  FROM  — «начать с».

  FROM node:20-alpine

Это значит: возьми готовый образ node версии 20 как основу, а дальше я допишу своё.

Ты почти никогда не собираешь образ с нуля. Всегда берёшь готовый базовый —
с нужным языком внутри — и добавляешь туда свой код.`},{kind:"say",text:`Разберём запись  node:20-alpine  по частям:

  node    — имя образа (в нём уже установлен Node.js)
  :20     — тег, то есть версия. Двоеточие отделяет имя от версии.
  -alpine — вариант на очень лёгкой системе Alpine Linux

Про alpine стоит запомнить: обычный образ node весит ~1 ГБ, alpine-вариант ~50 МБ.
Меньше образ — быстрее выкатка и меньше места, где может прятаться уязвимость.`},{kind:"say",text:`Важно про теги. Есть тег  latest  («последний») — так вот, его в проде не используют.

Сегодня latest это версия 20, завтра — 21, и твоя сборка внезапно ломается.
Всегда указывай конкретную версию:  node:20-alpine , а не  node:latest .`},{kind:"quiz",text:"Почему в проде не пишут  FROM node:latest ?",options:["latest со временем меняется и сборка может внезапно сломаться","latest весит слишком много","latest — платный образ"],answer:0,explain:"Нужна воспроизводимость: одна и та же строка должна давать один и тот же образ и через год."}]},{id:"6.5",act:6,title:"Dockerfile: WORKDIR и COPY",xp:20,intro:"Выбираем папку внутри образа и кладём туда свой код.",setup:tt,steps:[{kind:"say",text:`Основа взята. Теперь надо положить внутрь свой код. Две инструкции:

  WORKDIR /app   — «перейди в папку /app внутри образа»
  COPY . .       — «скопируй файлы снаружи внутрь»`},{kind:"say",text:`WORKDIR — это как команда  cd , только внутри будущего образа.

Если папки  /app  не существует — Docker создаст её сам.
Все следующие инструкции будут выполняться уже из неё.

Зачем: чтобы код лежал в предсказуемом месте, а не был раскидан по корню.`},{kind:"say",text:`COPY принимает два аргумента: откуда и куда.

  COPY . .
       ↑ ↑
       │ └── куда: текущая папка ВНУТРИ образа (то есть /app из WORKDIR)
       └──── откуда: текущая папка СНАРУЖИ, где лежит Dockerfile

Две точки выглядят загадочно, но это просто «всё отсюда — вот туда».`},{kind:"say",text:`Кстати, помнишь  .gitignore  из Акта 5? У Docker есть такой же файл —  .dockerignore

Он нужен ровно за тем же: не тащить внутрь образа мусор и секреты.
Без него  COPY . .  затащит и папку node_modules, и файл .env с паролями.`},{kind:"quiz",text:"Что делает инструкция  WORKDIR /app ?",options:["Переходит в папку /app внутри образа, создавая её при необходимости","Копирует файлы в папку /app","Удаляет папку /app"],answer:0,explain:"WORKDIR — это cd внутри образа. Копирование — отдельная инструкция COPY."}]},{id:"6.6",act:6,title:"Dockerfile: CMD и пишем файл целиком",xp:25,intro:"CMD говорит, что запускать, когда контейнер стартует.",setup:e=>{tt(e),e.templates={"/home/devops/app/Dockerfile":`# ЗАДАЧА: напиши рецепт образа. Нужны четыре строки.
# Сотри эти комментарии и впиши:
#
#   FROM node:20-alpine
#   WORKDIR /app
#   COPY . .
#   CMD ["node", "index.js"]
`}},steps:[{kind:"say",text:`Осталась последняя обязательная инструкция —  CMD .

Она отвечает на вопрос: «что запустить, когда контейнер включится?»

Без неё образ соберётся, но контейнер сразу завершится — ему нечего делать.`},{kind:"say",text:`Пишется так:

  CMD ["node", "index.js"]

Обрати внимание на форму записи: квадратные скобки, а внутри каждое слово
в отдельных двойных кавычках через запятую.

Читается: «запусти программу node и передай ей аргумент index.js».
То же самое, что набрать в терминале  node index.js .`},{kind:"say",text:`Соберём весь рецепт вместе. Четыре строки:

  FROM node:20-alpine       ← с чего начать
  WORKDIR /app              ← в какой папке работать
  COPY . .                  ← что положить внутрь
  CMD ["node", "index.js"]   ← что запускать

Этой структуры хватает для большинства простых приложений.`},{kind:"do",text:`Задача: напиши Dockerfile. Набери в терминале:
edit Dockerfile
В редакторе будет подсказка — сотри её и впиши четыре настоящие строки. Сохрани.`,check:e=>Q("/home/devops/app/Dockerfile",/^\s*FROM\s+\S+/im)(e)&&Q("/home/devops/app/Dockerfile",/^\s*CMD\s+/im)(e),answer:ht,editFile:"/home/devops/app/Dockerfile",hint:`Открой  edit Dockerfile  и впиши ровно это:
FROM node:20-alpine
WORKDIR /app
COPY . .
CMD ["node","index.js"]`},{kind:"quiz",text:"Что произойдёт, если в Dockerfile нет инструкции CMD?",options:["Контейнер не будет знать, что запускать, и сразу завершится","Образ вообще не соберётся никогда","Ничего, CMD не обязательна"],answer:0,explain:"Контейнер существует, пока внутри работает программа. Не задал программу — нечему работать."}]},{id:"6.7",act:6,title:"Собрать образ: docker build",xp:25,intro:"build читает рецепт и создаёт образ.",setup:Nt,steps:[{kind:"say",text:`Рецепт написан. Готовим по нему образ — команда  docker build .

  docker build -t shop:1.0 .

Разберём по частям, тут есть неочевидное.`},{kind:"say",text:`  -t shop:1.0

  -t     — от tag, «дай имя». Без имени образ будет безымянным и неудобным.
  shop   — имя образа
  :1.0   — версия, через двоеточие. Та же логика, что у node:20-alpine.

Версию ставят всегда. Через месяц будет shop:1.1, shop:2.0 — и можно вернуться назад.`},{kind:"say",text:`  .   ← вот эта точка в самом конце

Это САМАЯ частая ошибка новичков — её забывают, и команда падает.

Точка означает «контекст сборки»: папка, откуда Docker берёт файлы и Dockerfile.
Точка = текущая папка, та же самая точка, что ты знаешь из Акта 1.`},{kind:"watch",run:"docker build -t shop:1.0 .",note:`Смотри на вывод — Docker честно рассказывает, что делает:

  Step 1/4 : FROM node:20-alpine   ← взял основу
  Step 2/4 : WORKDIR /app          ← перешёл в папку
  Step 3/4 : COPY . .              ← скопировал файлы
  Step 4/4 : CMD [...]             ← записал команду запуска

Каждый шаг — это один слой. В конце:  Successfully tagged shop:1.0 .`},{kind:"type",text:`Собери образ сам. Набери:  docker build -t shop:1.0 .
(не забудь точку в конце!)`,cmd:"docker build -t shop:1.0 ."},{kind:"quiz",text:"Что означает точка в конце команды  docker build -t shop:1.0 . ?",options:["Папку, откуда брать Dockerfile и файлы проекта","Это опечатка, точка не нужна","Конец команды, как в предложении"],answer:0,explain:"Точка — контекст сборки, текущая папка. Забыть её — самая частая ошибка при первой сборке."}]},{id:"6.8",act:6,title:"Что получилось: docker images",xp:15,intro:"Список собранных образов на машине.",setup:Ne,steps:[{kind:"say",text:"Образ собран и лежит на твоей машине. Посмотреть все образы — команда  docker images ."},{kind:"watch",run:"docker images",note:`Видим наш  shop:1.0  и количество слоёв.

В настоящем Docker тут ещё колонка с размером — на неё стоит поглядывать.
Образ на 1 ГБ будет качаться на каждый сервер при каждой выкатке.`},{kind:"type",text:"Посмотри список образов. Набери:  docker images",cmd:"docker images"},{kind:"say",text:`Практический совет про слои и скорость сборки.

Docker переиспользует слои, которые не изменились. Но если поменялся слой №2 —
все слои НИЖЕ него пересобираются заново.

Поэтому опытные инженеры кладут редко меняющееся вверх (установка библиотек),
а часто меняющееся вниз (свой код). Тогда обычная пересборка занимает секунды.`},{kind:"quiz",text:"Почему стоит следить за размером образа?",options:["Он качается на каждый сервер при каждой выкатке — большой образ замедляет всё","Docker берёт деньги за размер","Размер ни на что не влияет"],answer:0,explain:"Меньше образ — быстрее деплой и меньше поверхность для уязвимостей."}]},{id:"6.9",act:6,title:"Первый запуск: docker run",xp:20,intro:"run превращает образ в работающий контейнер.",setup:Ne,steps:[{kind:"say",text:`Рецепт готов — приготовим блюдо. Команда  docker run  берёт образ и запускает контейнер.

Самая простая форма:

  docker run shop:1.0`},{kind:"watch",run:"docker run shop:1.0",note:`Docker ответил длинной строкой из букв и цифр — это идентификатор нового контейнера.

Контейнер создан и запущен из нашего образа.`},{kind:"say",text:`Важно понимать, что произошло:

  образ  shop:1.0    остался на месте, неизменным
  контейнер          создался новый, из этого образа

Запусти команду ещё раз — получишь ВТОРОЙ контейнер, независимый от первого.
Образ при этом по-прежнему один.`},{kind:"type",text:"Запусти контейнер сам. Набери:  docker run shop:1.0",cmd:"docker run shop:1.0"},{kind:"quiz",text:"Ты дважды выполнил  docker run shop:1.0 . Что получилось?",options:["Два независимых контейнера из одного образа","Один контейнер, второй запуск ничего не сделал","Два образа"],answer:0,explain:"Каждый run создаёт новый контейнер. Образ остаётся один и не меняется."}]},{id:"6.10",act:6,title:"Фоновый режим и имя контейнера",xp:20,intro:"Флаги -d и --name делают контейнер удобным в работе.",setup:Ne,steps:[{kind:"say",text:`У команды run есть два флага, без которых на практике не обходятся.

Первый:  -d  (от detached, «отсоединённый»).

Без него терминал «залипает» на контейнере: ты видишь его вывод и не можешь
набирать команды, пока не остановишь. С  -d  контейнер уходит в фон,
а терминал сразу свободен.`},{kind:"say",text:`Второй флаг:  --name

Без него Docker придумает контейнеру случайное имя вроде  nervous_hawking .
Смешно ровно один раз. Потом ты будешь копировать эти имена, чтобы посмотреть логи.

  --name web

Дал понятное имя — и дальше работаешь с ним:  docker logs web ,  docker stop web .`},{kind:"watch",run:"docker run -d --name web shop:1.0",note:"Запустили в фоне под именем  web . Терминал сразу свободен для следующих команд."},{kind:"type",text:"Запусти с именем сам. Набери:  docker run -d --name web shop:1.0",cmd:"docker run -d --name web shop:1.0"},{kind:"quiz",text:"Зачем нужен флаг  -d  у  docker run ?",options:["Контейнер уходит в фон и не занимает твой терминал","Контейнер запускается быстрее","Контейнер удаляется после остановки"],answer:0,explain:"-d = detached. Без него терминал будет занят выводом контейнера."}]},{id:"6.11",act:6,title:"Порты: пробрасываем наружу",xp:25,intro:"Контейнер изолирован. Чтобы достучаться — нужен проброс порта.",setup:Ne,steps:[{kind:"say",text:`Помнишь, контейнер изолирован? Это касается и сети.

Внутри контейнера приложение слушает порт 80. Но снаружи, с твоей машины,
туда не достучаться — контейнер как закрытая коробка.

  8080  — порт на ТВОЕЙ машине (хост), снаружи
    80  — порт ВНУТРИ контейнера

приложений на порту 80. А на твоей машине порт 80 один, и его может занимать nginx.

Разработчик у себя на машине собирал программу, копировал файлы на сервер по FTP,
перезапускал сервис руками. Каждый раз чуть по-разному. Забыл прогнать тесты —

Две буквы CI = Continuous Integration («непрерывная интеграция»):
на каждый твой  git push  робот сам собирает проект и прогоняет тесты.

CD = Continuous Delivery/Deployment: если тесты зелёные — робот сам выкатывает
новую версию на сервер.`},{kind:"say",text:`Что это даёт на практике:

  • баг ловится через минуты после коммита, а не через неделю от пользователя
  • выкатка — это один  git push , а не 20 ручных шагов по памяти
  • любой в команде может выкатить — процесс записан, а не в голове у одного человека

Ты как DevOps будешь именно строить и чинить этих роботов.`},{kind:"quiz",text:"Что делает CI (Continuous Integration)?",options:["На каждый push сам собирает проект и прогоняет тесты","Хранит резервные копии базы данных","Ускоряет интернет на сервере"],answer:0,explain:"CI ловит поломки сразу после коммита. CD — следующий шаг: автоматическая выкатка зелёной версии."}]},{id:"7.2",act:7,title:"Пайплайн — это конвейер",xp:20,intro:"Робот делает работу по этапам: сборка → тесты → деплой.",steps:[{kind:"say",text:`Работа робота называется «пайплайн» (pipeline, «трубопровод», «конвейер»).

Это последовательность этапов. Классический набор:

  1) checkout  — забрать свежий код из репозитория
  2) install   — поставить зависимости (библиотеки)
  3) test      — прогнать тесты
  4) build     — собрать (например, Docker-образ из Акта 6)
  5) deploy    — выкатить на сервер`},{kind:"say",text:`Главное правило конвейера: этапы идут по порядку, и следующий начинается
только если предыдущий прошёл успешно.

Упали тесты на этапе 3 — этапы 4 и 5 НЕ выполняются. Сломанный код не уедет
на сервер физически. Это и есть страховка.`},{kind:"say",text:`Что запускает пайплайн — называется «триггер» (trigger, «спусковой крючок»).

## Что произошло
Выкатили shop:3.0-beta. Поды не стартовали (CrashLoopBackOff), сервис начал отдавать 5xx.

## Влияние
18 минут, около 30% запросов завершались ошибкой. Затронуло оформление заказов.

## Причина
В новом манифесте не задали переменную окружения DB_URL — приложение падало при старте.

## Действия
1. Проверка обязательных переменных манифеста в CI.
2. Канареечный деплой вместо полного выката.
3. Алерт на pods_ready < replicas.
`,Ti=`# Runbook: алерт HighErrorRate

## Когда срабатывает
error_rate выше 1% дольше 5 минут.

## Что проверить
1. alerts — какие ещё алерты горят рядом.
2. metrics — величина error_rate и latency_p99.
3. Был ли выкат за последние 30 минут (история деплоев).

## Как митигировать
Если ошибки начались сразу после выката — kubectl rollout undo deployment/api.
Дождаться kubectl rollout status, затем проверить metrics и alerts.

Если откат не помог за 15 минут — эскалация на дежурного тимлида.

Инженеры по очереди берут «смену»: неделю ты — тот человек, которому
прилетит уведомление, если ночью что-то сломается.

Уведомление приходит на телефон (исторически — на «пейджер», отсюда
английское  page  — «дёрнуть дежурного»).`},{kind:"say",text:`Зачем это устроено именно так:

  • сервис должен работать всегда, а люди — нет
  • ответственность конкретная: в каждый момент есть ОДИН дежурный,
    а не «кто-нибудь посмотрит»
  • нагрузка честно делится по очереди, а не висит на одном человеке`},{kind:"say",text:`Дежурному нужно уметь три вещи, и мы их разберём в этом акте:

  1) быстро понять, что происходит — метрики и алерты
  2) остановить боль пользователей — митигация

Писать сложный код ночью НЕ нужно — это почти всегда ошибка.`},{kind:"quiz",text:"Зачем в командах делают ротацию дежурства (on-call)?",options:["Чтобы в любой момент был один конкретный ответственный за прод, и нагрузка делилась по очереди","Чтобы новички быстрее увольнялись","Чтобы никто не спал по ночам"],answer:0,explain:"Дежурство — про конкретную ответственность и честное распределение, а не про героизм."}]},{id:"10.2",act:10,title:"Четыре золотых сигнала",xp:20,intro:"Чтобы понять здоровье сервиса, смотрят на четыре числа.",setup:e=>{Qe(e)},steps:[{kind:"say",text:`У любого сервиса есть сотни метрик, но у дежурного нет времени смотреть все.
Есть короткий список — «четыре золотых сигнала» (Google SRE):

  • Задержка (latency)      — за сколько отвечает сервис
  • Трафик (traffic)        — сколько запросов в секунду
  • Ошибки (errors)         — какая доля запросов падает
  • Насыщение (saturation)  — насколько загружены ресурсы (CPU, память, диск)`},{kind:"say",text:`Смотрят обычно не среднее, а «хвост» — например  p99 задержки : время, в которое
укладываются 99% запросов. Среднее может быть отличным, а каждый сотый
пользователь ждёт 10 секунд — вот это и ловит p99.

В симуляторе метрики показывает команда  metrics .`},{kind:"watch",run:"metrics",note:`Разбор строк:
  http_requests_total — всего запросов (трафик)
  error_rate 32.1%    — доля ошибок; норма здесь 0.01%, сейчас катастрофа
  latency_p99_ms 4200 — 99-й перцентиль задержки; норма 180
  pods_ready 0/4      — насыщение/здоровье: ни один под не готов

Три сигнала из четырёх в красной зоне — сервис лежит.`},{kind:"type",text:"Посмотри метрики сам. Набери:  metrics",cmd:"metrics"},{kind:"quiz",text:"Почему дежурные смотрят на  p99  задержки, а не на среднюю?",options:["Среднее прячет редкие очень медленные ответы, а p99 их показывает","p99 считается быстрее","Средняя задержка вообще не бывает полезной"],answer:0,explain:"p99 — «худшее, что видит почти каждый». Хвост задержек и есть боль пользователей."}]},{id:"10.3",act:10,title:"Алерты и пороги",xp:20,intro:"Алерт — это метрика, которая вышла за порог и разбудила человека.",setup:e=>{Qe(e)},steps:[{kind:"say",text:`Никто не сидит и не смотрит в графики круглосуточно. Вместо этого настраивают
алерты: правило вида «если error_rate выше 1% дольше 5 минут — разбуди дежурного».

У алерта есть важность (severity):
  critical — будит немедленно, даже в 4 утра (сервис лежит, деньги теряются)
  warning  — можно посмотреть в рабочее время (тревожный тренд, но не пожар)`},{kind:"watch",run:"alerts",note:`Сейчас горят два:
  🔴 HighErrorRate [critical] — вот из-за этого пришёл page
  🔴 LatencyP99High [warning] — следствие того же сбоя

В описании критичного уже есть зацепка: «началось через 2 минуты после выката
shop:3.0-beta». Часто первопричина видна прямо в тексте алерта.`},{kind:"type",text:"Посмотри активные алерты. Набери:  alerts",cmd:"alerts"},{kind:"say",text:`Обратная сторона — «усталость от алертов» (alert fatigue). Если алертов сотня
и половина ложные, дежурный перестаёт на них реагировать и пропустит настоящий.

Поэтому хороший алерт: срабатывает на боль ПОЛЬЗОВАТЕЛЯ (а не на «CPU 80%»),
редкий, и на него всегда есть что сделать. Шумные алерты чинят или удаляют.`},{kind:"quiz",text:"Чем плох сервис, где горит сто алертов в день?",options:["Дежурный перестаёт им доверять и пропустит настоящий инцидент","Сервер тратит слишком много трафика на уведомления","Ничем, чем больше алертов — тем лучше видно систему"],answer:0,explain:"Alert fatigue: шум глушит сигнал. Алерт должен значить «человек, сделай что-то сейчас»."}]},{id:"10.4",act:10,title:"SLI, SLO и бюджет ошибок",xp:20,intro:"Насколько надёжным сервис ДОЛЖЕН быть — это заранее согласованное число.",steps:[{kind:"say",text:`«Сервис должен работать хорошо» — не инженерная формулировка. Её превращают
в числа:

  SLI (индикатор) — что именно меряем. Например: доля успешных запросов.
  SLO (цель)      — какое значение SLI считаем достаточным. Например: 99.9%
                    успешных запросов за 30 дней.`},{kind:"say",text:`Из SLO вытекает «бюджет ошибок» (error budget).

Если цель 99.9% — значит 0.1% запросов можно провалить «легально». Это и есть
бюджет: за 30 дней примерно 43 минуты полной недоступности.

  • бюджет не исчерпан → можно смелее катить новые фичи
  • бюджет проеден инцидентами → останавливают релизы и занимаются надёжностью`},{kind:"say",text:`Зачем это нужно: убирает вечный спор «разработка хочет фичи, эксплуатация хочет
стабильность». Есть общее число. Пока бюджет цел — катим. Кончился — чиним.

100% надёжности как цель не ставят: это бесконечно дорого и всё равно недостижимо
(сеть, провайдеры, железо ломаются вне твоего контроля).`},{kind:"quiz",text:"Что такое «бюджет ошибок» (error budget)?",options:["Допустимая доля сбоев, вытекающая из SLO; пока не исчерпана — можно катить новое","Деньги, заложенные на устранение багов","Количество разработчиков, которых можно уволить за инциденты"],answer:0,explain:"SLO 99.9% → 0.1% бюджет на сбои. Кончился бюджет — приоритет смещается на надёжность."}]},{id:"10.5",act:10,title:"Цикл реакции на инцидент",xp:20,intro:"Пять шагов, одинаковых для любого инцидента. Главное правило — в начале.",steps:[{kind:"say",text:`Пришёл page. Что делать — по шагам, всегда одинаково:

  1) Обнаружить  — прочитать алерт: что горит, с какого времени
  2) Оценить     — metrics: насколько плохо, сколько пользователей задето
  3) Митигировать — остановить боль (откат, перезапуск, переключение трафика)
  4) Проверить   — метрики и алерты вернулись в норму?
  5) Разобрать   — постмортем: почему случилось и как не повторить`},{kind:"say",text:`ГЛАВНОЕ ПРАВИЛО ДЕЖУРНОГО:

  Сначала останови боль, потом ищи причину.

Если 5xx полезли сразу после выката — не надо ночью читать код и искать баг.
Откатись на прошлую рабочую версию (митигация за минуту), убедись, что полегчало,
и только утром на свежую голову разбирайся, что там сломалось.`},{kind:"say",text:`Почему именно так:

  • каждая минута инцидента — это потерянные пользователи и деньги
  • ночью, под стрессом, ты пишешь плохой код и делаешь только хуже
  • откат почти всегда безопаснее, чем «быстрый фикс» вслепую

Диагностику (логи, describe) делают ДО отката — чтобы сохранить улики, —
но она не должна задерживать митигацию больше чем на пару минут.`},{kind:"quiz",text:"Ночью после выката полезли 5xx. Что делать первым?",options:["Быстро снять симптомы (логи), откатить релиз, убедиться что полегчало — разбор потом","Открыть код новой версии и искать баг, пока не найдёшь","Подождать до утра — вдруг само пройдёт"],answer:0,explain:"Сначала боль, потом причина. Откат — быстрая и безопасная митигация; постмортем — уже спокойно."}]},{id:"10.6",act:10,title:"Инцидент: 5xx после релиза ⚡",xp:45,intro:"Полный прогон цикла: от алерта до подтверждённой митигации.",setup:e=>{Qe(e)},steps:[{kind:"say",text:`3:12 ночи, пришёл page  HighErrorRate . Идём по циклу: обнаружить → оценить →
снять симптом → митигировать → проверить.`},{kind:"do",text:"Шаг 1. Обнаружить: посмотри, какие алерты горят.",check:se(/^alerts\b/),answer:"alerts",hint:"Команда  alerts"},{kind:"do",text:"Шаг 2. Оценить масштаб: посмотри метрики.",check:se(/^metrics\b/),answer:"metrics",hint:"Команда  metrics"},{kind:"say",text:`error_rate 32%, p99 4200ms, pods_ready 0/4. Алерт связал это с выкатом
shop:3.0-beta две минуты назад. Прежде чем откатывать — быстро зафиксируем
симптом, чтобы утром было что разбирать.`},{kind:"do",text:"Шаг 3. Посмотри состояние подов.",check:se(/^kubectl\s+get\s+pods?\b/),answer:"kubectl get pods",hint:"Команда  kubectl get pods"},{kind:"do",text:"Шаг 4. Сними симптом в лог: прочитай логи любого пода.",check:se(/^kubectl\s+logs\b/),answer:"kubectl logs api-x",hint:"Команда  kubectl logs  и имя пода (подойдёт  api-x )"},{kind:"say",text:`В логах  FATAL: DB_URL не задана . Причина понятна, но чинить манифест ночью
мы НЕ будем — это работа на утро. Сейчас — откат на ту версию, что работала.`},{kind:"do",text:"Шаг 5. Митигируй: откатись на предыдущую версию.",check:e=>!!e.k8s&&e.k8s.deploys.every(p=>!p.crash),answer:"kubectl rollout undo deployment/api",hint:"Команда  kubectl rollout undo deployment/api"},{kind:"do",text:"Шаг 6. Дождись завершения выката отката.",check:se(/^kubectl\s+rollout\s+status\b/),answer:"kubectl rollout status deployment/api",hint:"Команда  kubectl rollout status deployment/api"},{kind:"do",text:"Шаг 7. Проверь метрики — error_rate должен вернуться к норме.",check:se(/^metrics\b/),answer:"metrics",hint:"Команда  metrics"},{kind:"do",text:"Шаг 8. Убедись, что алерты погасли.",check:e=>e.alerts.length===0,answer:"alerts",hint:"Команда  alerts  — активных алертов быть не должно"},{kind:"say",text:`Боль остановлена за минуты, никто не писал код ночью. Инцидент НЕ закрыт —
осталось написать постмортем. Это следующий урок.`}]},{id:"10.7",act:10,title:"Постмортем без обвинений",xp:30,intro:"Инцидент не закрыт, пока не написан разбор. Разбирают систему, а не людей.",setup:e=>{e.cwd="/home/devops",e.templates={"/home/devops/postmortem.md":`# Постмортем: рост 5xx после релиза

## Что произошло
(коротко: выкатили версию, пошли ошибки)

## Влияние

## Причина
(что именно сломалось)

## Действия
(что сделать, чтобы не повторилось)
`}},steps:[{kind:"say",text:`Постмортем (postmortem) — письменный разбор инцидента. Он  blameless :
«без вины». Разбирают, почему СИСТЕМА позволила сбою случиться и почему его
не поймали раньше — а не «кто виноват».

Если за инциденты наказывают людей, инженеры начинают их скрывать —
и организация перестаёт учиться на сбоях.`},{kind:"say",text:`Обязательные разделы:

  Что произошло — факты и таймлайн: во сколько выкат, во сколько алерт, во сколько откат
  Влияние       — сколько минут, какая доля запросов, что почувствовал пользователь
  Причина       — техническая первопричина (здесь: не задали DB_URL в манифесте)
  Действия      — конкретные задачи с ответственными, чтобы это не повторилось`},{kind:"say",text:`Хорошие «Действия» — проверяемые и адресные:

  ✗ «быть внимательнее при выкате»
  ✓ «добавить в CI проверку, что все обязательные переменные окружения заданы»
  ✓ «включить канареечный деплой: сначала 1 под, потом остальные»`},{kind:"do",text:`Задача: напиши постмортем. Набери:
edit postmortem.md
Заполни все четыре раздела своими словами (замени текст в скобках). Сохрани.`,check:e=>Q("/home/devops/postmortem.md",/##\s*Что произошло\s*\n+(?!\()\S/)(e)&&Q("/home/devops/postmortem.md",/##\s*Влияние\s*\n+(?!\()\S/)(e)&&Q("/home/devops/postmortem.md",/##\s*Причина\s*\n+(?!\()\S/)(e)&&Q("/home/devops/postmortem.md",/##\s*Действия\s*\n+(?!\()\S/)(e),answer:Et,editFile:"/home/devops/postmortem.md",hint:`Открой  edit postmortem.md  и под каждым заголовком напиши по 1–2 предложения
вместо подсказки в скобках. Пример готового разбора есть в теории акта.`},{kind:"quiz",text:"Почему постмортем делают «без вины» (blameless)?",options:["Иначе люди будут скрывать инциденты, и команда перестанет на них учиться","Чтобы не тратить время на поиск виноватого — его и так все знают","Так требует трудовой кодекс"],answer:0,explain:"Цель — исправить систему, а не наказать человека. Наказание убивает честность отчётов."}]},{id:"10.8",act:10,title:"Runbook",xp:25,intro:"На известный алерт план действий пишут заранее, а не сочиняют в 4 утра.",setup:e=>{e.cwd="/home/devops",e.templates={"/home/devops/runbook.md":`# Runbook: алерт HighErrorRate

## Когда срабатывает
(условие алерта)

## Что проверить
(команды по шагам)

## Как митигировать
(конкретное действие)

## Кого звать
(когда эскалировать и на кого)
`}},steps:[{kind:"say",text:`Runbook («сборник процедур») — короткая инструкция на конкретный алерт:
что это значит, что проверить, как починить, когда звать помощь.

Идея: в момент инцидента дежурный не думает «а что вообще делать», он
открывает runbook по названию алерта и идёт по пунктам.`},{kind:"say",text:`Хороший runbook:

  • привязан к одному алерту (ссылка на runbook прямо в тексте алерта)
  • состоит из команд, которые можно выполнить не думая
  • говорит, когда СТОП и эскалация («если за 15 минут не помогло — звони X»)
  • обновляется после каждого инцидента, где чего-то не хватило`},{kind:"do",text:`Задача: напиши runbook для  HighErrorRate . Набери:
edit runbook.md
Заполни все четыре раздела (замени текст в скобках). Сохрани.`,check:e=>Q("/home/devops/runbook.md",/##\s*Когда срабатывает\s*\n+(?!\()\S/)(e)&&Q("/home/devops/runbook.md",/##\s*Что проверить\s*\n+(?!\()\S/)(e)&&Q("/home/devops/runbook.md",/##\s*Как митигировать\s*\n+(?!\()\S/)(e)&&Q("/home/devops/runbook.md",/##\s*Кого звать\s*\n+(?!\()\S/)(e),answer:Ti,editFile:"/home/devops/runbook.md",hint:`Открой  edit runbook.md . В «Что проверить» перечисли  alerts ,  metrics ,
историю выката; в «Как митигировать» —  kubectl rollout undo . Образец — в теории.`},{kind:"quiz",text:"Зачем писать runbook заранее, если дежурный и так разберётся?",options:["В 4 утра под стрессом человек соображает хуже; готовый список шагов ускоряет и снижает ошибки","Runbook нужен только для отчётности перед начальством","Чтобы дежурному вообще не пришлось просыпаться"],answer:0,explain:"Runbook переносит мышление на спокойное время. В инцидент дежурный исполняет, а не изобретает."}]},{id:"10.9",act:10,title:"Эскалация и коммуникация",xp:20,intro:"Молча героически чинить в одиночку — плохо. Зови людей и говори статус.",steps:[{kind:"say",text:`Дежурный — не одиночка. Если за ~15 минут митигация не помогла, или масштаб
больше, чем ты можешь потянуть, — эскалируй: подними следующего по цепочке
(старшего дежурного, тимлида, дежурного соседней команды).

Разбудить человека в 4 утра — это нормально. Провалить SLO, потому что
постеснялся позвонить, — не нормально.`},{kind:"say",text:`В крупном инциденте роли разделяют:

  Incident Commander — координирует, принимает решения, НЕ лезет в консоль сам
  Operations         — тот, кто реально выполняет команды
  Communications     — пишет статус-апдейты наружу (поддержке, руководству)

Пока людей мало — все роли на дежурном, но как только пришли помощники,
их надо явно раздать: «ты командир, я руками, ты пишешь в канал».`},{kind:"say",text:`Статус-апдейты — каждые 15–30 минут, даже если новостей нет:

,"ls -l  в домашней папке","cat /etc/hostname"],answer:0,explain:"top/htop — живая картина нагрузки. Дальше — df (диск), free (память), journalctl (логи)."}]),Ii=ke(2,"Права доступа и процессы",[{d:1,text:"Что делает  chmod ?",options:["Меняет права доступа к файлу","Меняет владельца файла","Меняет имя файла"],answer:0,explain:"chmod — change mode (права). Владельца меняет chown."},{d:2,text:"В правах  rwxr-x---  — что может делать «группа» (средняя тройка  r-x )?",options:["Читать и выполнять, но не изменять","Всё","Ничего"],answer:0,explain:"r — читать, w — писать, x — выполнять. r-x = чтение + выполнение, без записи."},{d:3,text:"ps  показывает процесс со статусом  Z  (zombie). Что это?",options:["Процесс завершился, но родитель ещё не забрал его код возврата","Процесс завис и грузит CPU","Вредоносный процесс"],answer:0,explain:"Зомби не потребляет ресурсы; исчезает, когда родитель сделает wait(). Много зомби — баг в родителе."},{d:4,text:"Процесс с  PID 4210  завис. Как попросить его завершиться корректно?",options:["kill 4210","kill -9 4210 сразу","rm 4210"],answer:0,explain:"kill (сигнал TERM) — вежливая просьба завершиться. kill -9 (KILL) — крайняя мера, без уборки за собой."},{d:5,text:"Скрипт не запускается: «Permission denied», хотя файл на месте и путь верный. Права  rw-r--r-- . Что не так?",options:["Нет бита выполнения — нужен  chmod +x script.sh","Файл принадлежит root","Скрипт написан с ошибкой"],answer:0,explain:"Чтобы файл исполнялся, нужен бит x. chmod +x добавляет его."},{d:6,text:"Сервис  web  в состоянии  failed . Правильный порядок разбора?",options:["systemctl status web → journalctl -u web → починить конфиг → systemctl restart web","systemctl restart web несколько раз подряд","kill все процессы web и перезагрузить сервер"],answer:0,explain:"Сначала статус и журнал (там причина), потом точечная правка, потом рестарт."},{d:7,text:"Сервис с  Restart=always  и сломанным конфигом: перезапусков 900+, журнал распух, диск заполняется. Первое действие?",options:["Остановить сервис ( systemctl stop ), чтобы прекратить шторм, потом чинить конфиг","Добавить ещё места на диск","Увеличить RestartSec"],answer:0,explain:"Сначала останови шторм (stop), иначе диск кончится. Потом конфиг и ограничитель StartLimitBurst."}]),Hi=ke(3,"Bash-скрипты",[{d:1,text:"С чего принято начинать bash-скрипт?",options:["#!/bin/bash — шебанг, указывает интерпретатор","// bash","import bash"],answer:0,explain:"Шебанг в первой строке говорит системе, чем исполнять файл."},{d:2,text:"Как обратиться к первому аргументу скрипта?",options:["$1","$arg1","%1"],answer:0,explain:"$1, $2, ... — позиционные аргументы. $0 — имя самого скрипта, $# — их количество."},{d:3,text:"Скрипт вывел  exit code 1 . Что это значит?",options:["Скрипт завершился с ошибкой (0 — успех, не 0 — ошибка)","Выполнена 1 команда","Всё хорошо"],answer:0,explain:"Код возврата 0 — успех. Любое ненулевое — какая-то ошибка. Проверяется через $?."},{d:4,text:"Нужно, чтобы скрипт останавливался на первой же ошибке. Что добавить в начало?",options:["set -e","set +e","stop on error"],answer:0,explain:"set -e — выход при первой неуспешной команде. Часто добавляют set -euo pipefail."},{d:5,text:"В скрипте  rm -rf $DIR/  — почему это опасно?",options:["Если $DIR пустая, получится  rm -rf /  — сотрёт корень. Нужны кавычки и проверка","rm -rf вообще нельзя использовать","Надо писать RM большими буквами"],answer:0,explain:'Всегда: "${DIR:?переменная пуста}" и кавычки вокруг переменных. Пустая переменная — классическая катастрофа.'},{d:6,text:"Скрипт бэкапа должен: 1) создать архив, 2) проверить что архив создан, 3) удалить старые. Что важно между шагами?",options:["Проверять код возврата каждого шага и не удалять старьё, если архив не создался","Выполнять всё в одну строку через  ;","Запускать три раза для надёжности"],answer:0,explain:"Идемпотентность и проверки: удаление старых бэкапов только после успешного нового."},{d:7,text:"Ночной крон-скрипт «молча» перестал делать бэкапы неделю назад. Как расследовать в первую очередь?",options:["Посмотреть логи крона/скрипта и его exit code — скрипт наверняка падал, но никто не смотрел","Переписать скрипт с нуля","Отключить крон"],answer:0,explain:"«Тихий» сбой = нет мониторинга результата. Логи + код возврата + алерт на отсутствие свежего бэкапа."}]),Fi=ke(4,"Сети",[{d:1,text:"Что делает DNS?",options:["Превращает доменное имя в IP-адрес","Шифрует трафик","Раздаёт пароли"],answer:0,explain:"DNS — телефонная книга интернета: example.com → 93.184.216.34."},{d:2,text:"Команда  curl -I https://site  — что запрашивает флаг  -I ?",options:["Только заголовки ответа, без тела","Игнорировать ошибки","Инкогнито-режим"],answer:0,explain:"-I (HEAD) — быстро посмотреть статус и заголовки, не качая страницу."},{d:3,text:"curl  вернул  HTTP/1.1 502 Bad Gateway . Кто, скорее всего, виноват?",options:["Прокси/балансировщик получил плохой ответ от приложения за ним (или оно лежит)","У тебя нет интернета","Неправильный пароль"],answer:0,explain:"502 — шлюз не смог получить валидный ответ от апстрима. Смотри бэкенд-сервис."},{d:4,text:"Хочешь проверить, слушает ли кто-то порт 8080 на этом сервере. Команда?",options:["ss -ltnp | grep 8080","ping 8080","curl 8080"],answer:0,explain:"ss (или netstat) показывает слушающие сокеты. l — listening, t — tcp, n — числа, p — процесс."},{d:5,text:"«Сайт не открывается». ping домена идёт, а  curl https://домен  висит и отваливается по таймауту. Где проблема?",options:["DNS и сеть до хоста живы; не отвечает сам сервис на 443 (или файрвол режет порт)","Проблема в DNS","Кабель не воткнут"],answer:0,explain:"ping (ICMP) прошёл → маршрут есть. Висит именно TCP на 443 → сервис/файрвол, а не имя."},{d:6,text:"Диагностика «не работает связь с API» по слоям — правильный порядок?",options:["DNS резолвится? → хост пингуется? → порт открыт (ss/telnet)? → приложение отвечает (curl)?","curl → перезагрузить сервер → написать в поддержку","Сразу менять код приложения"],answer:0,explain:"Снизу вверх по OSI: имя → маршрут → порт → приложение. Так находишь слой, где рвётся."},{d:7,text:"После деплоя половина запросов к сервису падает с таймаутом, половина — ок. Первая гипотеза?",options:["Один из подов/бэкендов за балансировщиком нездоров, а трафик всё равно на него идёт","Весь интернет сломался","DNS отдаёт неправильный адрес всем"],answer:0,explain:"«Ровно половина» пахнет одним из N бэкендов. Проверь health-check и выведи больной инстанс из ротации."}]),Ni=ke(5,"Git",[{d:1,text:"Что такое коммит?",options:["Сохранённый снимок изменений с сообщением","Ветка","Удалённый сервер"],answer:0,explain:"Коммит фиксирует состояние файлов + автора + сообщение + ссылку на родителя."},{d:2,text:"Команда  git status  показывает…",options:["Что изменено, что в индексе, на какой ты ветке","Историю коммитов","Список веток на сервере"],answer:0,explain:"status — текущее состояние рабочей копии. История — git log."},{d:3,text:"git push  выдаёт  rejected (non-fast-forward) . Что это значит?",options:["На сервере есть коммиты, которых нет у тебя — сначала  git pull","У тебя нет прав","Ветка не существует"],answer:0,explain:"Твоя ветка отстала. Забери чужие изменения (pull/rebase), реши конфликты, потом push."},{d:4,text:"Начинаешь новую фичу. Правильное первое действие?",options:["git checkout -b feature/…  — отдельная ветка от main","Коммитить прямо в main","git reset --hard"],answer:0,explain:"Фича = своя ветка + PR. main остаётся стабильным и релизопригодным."},{d:5,text:"Ты закоммитил в main файл  .env  с паролём базы. Что действительно решает проблему?",options:["Считать пароль скомпрометированным и сменить его; убрать файл из истории и добавить в .gitignore","Просто  git rm .env  следующим коммитом","Сделать репозиторий приватным"],answer:0,explain:"Секрет в истории git = утёкший секрет. Ротация обязательна; удаление из истории — уже вторично."},{d:6,text:"В файле после  git merge  появились  <<<<<<< , =======, >>>>>>> . Что делать?",options:["Это конфликт: вручную выбрать нужный код, убрать маркеры, git add файл, завершить merge","Удалить файл целиком","git push --force"],answer:0,explain:"Маркеры конфликта разделяют твою и чужую версии. Редактируешь руками → add → commit."},{d:7,text:"Коллега сделал  git push --force  в общую ветку  main , и у всех сломалась история. Как команде выходить?",options:["Найти у кого-то целый локальный main, восстановить его на сервере; договориться запретить force-push в main","Каждому сделать reset --hard на текущий сломанный main","Удалить репозиторий и создать заново"],answer:0,explain:"force-push в общую ветку — почти всегда авария. Защита ветки в настройках репозитория предотвращает это."}]),Wi=ke(6,"Docker",[{d:1,text:"Чем образ (image) отличается от контейнера (container)?",options:["Образ — неизменный шаблон; контейнер — запущенный из него экземпляр","Это синонимы","Контейнер больше по размеру, чем образ"],answer:0,explain:"Образ как класс, контейнер как объект. Из одного образа — сколько угодно контейнеров."},{d:2,text:"Что делает  docker ps ?",options:["Показывает запущенные контейнеры","Скачивает образ","Собирает образ"],answer:0,explain:"docker ps — запущенные; docker ps -a — включая остановленные."},{d:3,text:"docker ps -a  показывает контейнер со статусом  Exited (137) . О чём говорит 137?",options:["Контейнер убит сигналом KILL (128+9) — часто из-за нехватки памяти (OOM)","Успешное завершение","Контейнер ещё работает"],answer:0,explain:"137 = 128 + 9 (SIGKILL). Проверь docker logs и лимиты памяти."},{d:4,text:"Нужно запустить nginx и пробросить порт 8080 хоста на 80 контейнера. Команда?",options:["docker run -p 8080:80 nginx","docker run -p 80:8080 nginx","docker run nginx --port 8080"],answer:0,explain:"-p ХОСТ:КОНТЕЙНЕР. Снаружи стучимся на 8080, внутри nginx слушает 80."},{d:5,text:"Образ приложения весит 1.2 ГБ. Главная причина и лечение?",options:["База типа  ubuntu  + сборочные инструменты в финальном образе; лечится slim/alpine и multi-stage build","Слишком длинное имя образа","Не хватает флага --compress"],answer:0,explain:"Multi-stage: собираем в одном слое, в финальный копируем только артефакт. Плюс .dockerignore."},{d:6,text:"Контейнер падает сразу после старта. Порядок разбора?",options:["docker logs КОНТЕЙНЕР → понять ошибку → поправить Dockerfile/переменные → пересобрать и перезапустить","docker restart в цикле","Удалить Docker и поставить заново"],answer:0,explain:"Логи контейнера — первое. Обычно не хватает переменной окружения или файла конфигурации."},{d:7,text:"Прод-инцидент: свежий образ  app:latest  на части серверов старый, на части новый — поведение плавает. Причина?",options:["Тег  latest  не версионирует; серверы скачали образ в разное время. Нужны неизменяемые теги (app:1.4.2)","Docker сломан","Надо чаще перезапускать контейнеры"],answer:0,explain:"latest — движущаяся цель. В проде только фиксированные теги/дайджесты, иначе воспроизводимости нет."}]),ji=ke(7,"CI/CD",[{d:1,text:"Что такое CI (continuous integration)?",options:["Автоматический прогон сборки и тестов на каждое изменение в репозитории","Ручной деплой раз в месяц","Система хранения секретов"],answer:0,explain:"CI ловит поломки рано: каждый push → сборка + тесты автоматически."},{d:2,text:"Где в CI-пайплайне хранят пароли и токены?",options:["В секретах CI (secrets), подставляются в переменные окружения на время job","Прямо в YAML пайплайна","В README"],answer:0,explain:"Секрет в коде = утёкший секрет. Только защищённое хранилище секретов CI."},{d:3,text:"Пайплайн красный, в логе:  npm test  →  1 failing . Что произошло?",options:["Упал тест — сборку дальше не пускают, надо чинить код или тест","Проблема с сетью","Кончилось место"],answer:0,explain:"Красный тест блокирует пайплайн намеренно — чтобы сломанный код не поехал дальше."},{d:4,text:"Хочешь, чтобы workflow запускался на каждый push. Что задаёт триггер?",options:["Секция  on: push  в файле workflow","Кнопка в интерфейсе каждый раз","cron раз в час"],answer:0,explain:"on: определяет события. on: push — на любой push; on: pull_request — на PR."},{d:5,text:"Тесты «иногда падают, иногда нет» без изменений кода. Как правильно?",options:["Это flaky-тест: найти причину нестабильности и починить/изолировать, не перезапускать вслепую","Ставить  retry: 5  на все тесты","Удалить эти тесты"],answer:0,explain:"Флэки-тесты убивают доверие к CI. Их чинят или карантинят с заведённой задачей, а не маскируют ретраями."},{d:6,text:"Правильный конвейер от коммита до прода:",options:["push → сборка → тесты → артефакт → деплой на staging → проверка → деплой на prod","push → сразу деплой на prod → потом тесты","тесты локально → архив по почте → ручная заливка на prod"],answer:0,explain:"Каждый шаг — ворота. На prod попадает только то, что прошло все предыдущие."},{d:7,text:"После автодеплоя на prod полезли ошибки. Пайплайн зелёный. Первое действие дежурного?",options:["Откатить релиз (rollback / предыдущий артефакт), убедиться что полегчало, потом разбираться почему тесты не поймали","Срочно писать hotfix прямо на проде","Ждать, вдруг само пройдёт"],answer:0,explain:"Сначала останови боль — откат. Зелёный пайплайн ≠ рабочий релиз; пробел в тестах закрывают потом."}]),$i=ke(8,"Terraform и инфраструктура как код",[{d:1,text:"Что такое «инфраструктура как код»?",options:["Серверы, сети, диски описаны файлами в git, а не настроены кликами в панели","Код приложения на сервере","Способ ускорить сайт"],answer:0,explain:"IaC делает инфраструктуру воспроизводимой и отслеживаемой, как обычный код."},{d:2,text:"Что делает  terraform plan ?",options:["Показывает, что изменится, ничего при этом не применяя (сухой прогон)","Создаёт всю инфраструктуру","Удаляет state"],answer:0,explain:"plan — предпросмотр. Реально меняет только apply."},{d:3,text:"В выводе plan строка  - aws_db_instance.main . Что означает знак минус?",options:["Ресурс будет УДАЛЁН","Ресурс будет создан","Ресурс не изменится"],answer:0,explain:"+ создать, ~ изменить, - удалить. Строки с минусом читай особенно внимательно."},{d:4,text:"Значение  prod  повторяется в конфиге 30 раз. Как правильно?",options:['Вынести в  variable "env"  и использовать  var.env',"Найти-заменить каждый раз вручную","Скопировать файл и держать две версии"],answer:0,explain:"Переменная — одно место правды. Плюс -var env=staging для другого окружения."},{d:5,text:"Коллега предлагает хранить  terraform.tfstate  просто в git рядом с кодом. Почему плохо?",options:["В state лежат секреты в открытом виде, и нет блокировки — двое сделают apply одновременно","git не умеет хранить .tfstate","Это слишком медленно"],answer:0,explain:"state → удалённый бэкенд (S3/GCS) с шифрованием и локом. В git — никогда."},{d:6,text:"Как команде безопасно применять изменения Terraform?",options:["plan автоматически в PR на ревью → после merge CI делает apply; на prod — ручной approval","Каждый делает apply со своего ноутбука","apply по расписанию раз в неделю без ревью"],answer:0,explain:"Инфраструктурные изменения проходят ревью как код. Человек видит plan до применения."},{d:7,text:"plan неожиданно хочет удалить  local_file.database , который нужен. Что делать?",options:["НЕ применять; понять, почему ресурс исчез из .tf (случайно убрали при merge?), вернуть блок, перепроверить plan","Применить — Terraform знает лучше","Удалить state и начать заново"],answer:0,explain:"«Нет в .tf» = «удалить». Строку с минусом всегда объясняешь до apply. Защита — lifecycle prevent_destroy."}]),Ui=ke(9,"Kubernetes",[{d:1,text:"Что такое Pod?",options:["Минимальная единица Kubernetes — обёртка вокруг (обычно) одного контейнера","Физический сервер","Файл конфигурации"],answer:0,explain:"Kubernetes управляет подами, а не контейнерами напрямую. Под эфемерен."},{d:2,text:"За что отвечает Deployment?",options:["Держать заданное число подов, пересоздавать упавшие, катить и откатывать версии","Хранить секреты","Раздавать внешние IP"],answer:0,explain:"Deployment — про количество и обновление подов. Доступ по стабильному адресу — Service."},{d:3,text:"kubectl get pods  показывает под в статусе  CrashLoopBackOff , RESTARTS 8. Что это?",options:["Контейнер стартует и сразу падает; Kubernetes перезапускает с растущей паузой","Под успешно работает","Под ждёт свободного узла"],answer:0,explain:"Причина — в  kubectl logs . Часто: нет переменной окружения, битый образ, недоступна база."},{d:4,text:"Нагрузка выросла, нужно 6 копий вместо 3 прямо сейчас. Команда?",options:["kubectl scale deployment/api --replicas=6","kubectl restart api 6","kubectl get pods --all"],answer:0,explain:"scale меняет живой кластер. Но потом верни число и в манифест — иначе apply откатит к старому."},{d:5,text:"Ты сделал  kubectl scale ... --replicas=6 , затем  kubectl apply -f deploy.yaml  (там replicas: 3). Сколько подов останется?",options:["3 — apply привёл кластер к состоянию из файла","6 — scale приоритетнее","9 — суммируется"],answer:0,explain:"apply декларативен: файл — источник правды. Ручной scale он перетирает."},{d:6,text:"Выкатили новую версию образа, поды в CrashLoopBackOff. Диагностика по шагам?",options:["kubectl get pods → kubectl logs ПОД → kubectl describe pod ПОД → починить манифест → kubectl apply","kubectl delete deployment и создать заново","перезагрузить все узлы кластера"],answer:0,explain:"Статус → логи (там причина) → события (describe) → правка → apply. Или быстрый  rollout undo ."},{d:7,text:"3 часа ночи, весь Deployment в CrashLoopBackOff после релиза, сервис лежит. Первое действие?",options:["kubectl rollout undo deployment/api  — вернуться на рабочую версию, потом спокойно разбираться","Ночью переписать манифест и приложение","Ждать до утра"],answer:0,explain:"Сначала митигация: откат. Чинить манифест «форвардом» — работа на утро, не под давлением."}]),zi=ke(10,"Дежурство и надёжность",[{d:1,text:"Что такое дежурство (on-call)?",options:["Инженеры по очереди отвечают за прод: тебе приходит page, если что-то сломалось","Ночная смена в офисе","Собрание раз в неделю"],answer:0,explain:"В каждый момент есть один конкретный ответственный, нагрузка делится ротацией."},{d:2,text:"Чем  critical -алерт отличается от  warning ?",options:["critical будит немедленно (сервис лежит), warning — задача на рабочее время","Ничем, просто цвет","warning важнее critical"],answer:0,explain:"Severity задаёт срочность реакции. Warning без влияния на пользователя ждёт утра."},{d:3,text:"metrics  показывает  error_rate 32%, latency_p99 4200ms, pods_ready 0/4 . Что это значит?",options:["Сервис фактически лежит — три сигнала из четырёх в красной зоне","Всё в норме","Небольшая деградация"],answer:0,explain:"Золотые сигналы: latency, traffic, errors, saturation. Здесь — авария."},{d:4,text:"Что такое «бюджет ошибок» (error budget)?",options:["Допустимая доля сбоев из SLO; пока не исчерпан — можно катить фичи, исчерпан — стоп-релизы","Деньги на исправление багов","Лимит числа инцидентов на инженера"],answer:0,explain:"SLO 99.9% → 0.1% бюджет (~43 мин/мес). Общее число вместо спора «фичи против стабильности»."},{d:5,text:"Митигация не помогает уже 15 минут, инцидент растёт. Что делает зрелый дежурный?",options:["Эскалирует — поднимает следующего по цепочке, не геройствует молча","Продолжает в одиночку, чтобы никого не будить","Закрывает алерт и идёт спать"],answer:0,explain:"Своевременная эскалация — норма, а не слабость. Плюс статус-апдейты каждые 15–30 минут."},{d:6,text:"Полный цикл реакции на инцидент — по порядку:",options:["обнаружить (alerts) → оценить (metrics) → митигировать → проверить → разобрать (постмортем)","разобрать причину → написать код → задеплоить → закрыть алерт","перезагрузить сервер → подождать → эскалировать"],answer:0,explain:"Главное правило: сначала останови боль, потом ищи причину. Постмортем — blameless."},{d:7,text:"3:12 ночи, page  HighErrorRate . В логах пода  FATAL: DB_URL не задана , релиз был 2 минуты назад. Первое действие?",options:["Быстро зафиксировать симптом (logs) и откатить релиз ( rollout undo ); правку манифеста и постмортем — на утро","Сесть чинить манифест и выкатывать форвардом прямо   <body>
    <div class="top">
      <div class="logo"><i></i>TERMINAL OPS ACADEMY</div>
      <div class="xpwrap">
        <div class="r"><span id="rankTxt">Стажёр</span><span id="xpTxt">0 XP</span></div>
        <div class="xpbar"><i id="xpFill"></i></div>
      </div>
      <div class="rankchip" id="progChip">0 / 23 заданий</div>
      <div class="sp">
        <button class="tbtn" id="howBtn">как играть</button>
        <button class="tbtn" id="resetBtn">сброс</button>
      </div>
    </div>

    <div class="wrap">
      <div class="col rail-col"><div class="card scroll rail" id="rail"></div></div>
      <div class="col term-col">
        <div class="term">
          <div class="termbar">
            <span class="dots"><s></s><s></s><s></s></span><span>bash</span>
          </div>
          <div class="out" id="out"></div>
          <form class="inline" id="cmdForm" autocomplete="off">
            <span class="p" id="prompt">$</span>
            <input
              id="cmd"
              autocomplete="off"
              autocapitalize="off"
              spellcheck="false"
              placeholder="набери команду и нажми Enter (help — список команд)"
            />
          </form>
        </div>
      </div>
      <div class="col brief-col"><div class="card scroll brief" id="brief"></div></div>
    </div>

    <div class="ov hide" id="edOv">
      <div class="sheet">
        <header><span>редактор</span><span class="fn" id="edName">file</span></header>
        <div class="body"><textarea id="edText" spellcheck="false"></textarea></div>
        <footer>
          <span class="tip">Ctrl+S — сохранить</span>
          <button class="sec" id="edCancel">отмена</button>
          <button class="prim" id="edSave">Сохранить</button>
        </footer>
      </div>
    </div>

    <div class="ov hide" id="modOv"><div class="modal" id="modBody"></div></div>
    <div class="toast" id="toast"></div>

  </body>
</html>
