name: CI (vite-rewrite)

on:
  push:
    branches: [vite-rewrite, main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: Линт, типы, тесты, сборка
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run build:single
      - name: npm audit (не блокирует)
        run: npm audit --omit=dev || true
