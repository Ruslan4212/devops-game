name: Deploy

on:
  push:
    branches: [main]

# GitHub Pages для этого репозитория настроен на деплой напрямую из ветки main (root) —
# см. Settings → Pages. Реальный деплой делает сам GitHub при пуше в main, эта задача
# только гарантирует, что commit в main содержит АКТУАЛЬНЫЙ index.html, собранный из
# p*.txt — на случай, если кто-то запушил изменения в исходники, забыв прогнать build.sh.
jobs:
  ensure-build-fresh:
    name: Пересобрать index.html, если исходники разошлись со сборкой
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: bash build.sh
        run: bash build.sh
      - name: Закоммитить index.html, если сборка изменилась
        run: |
          if git diff --quiet -- index.html; then
            echo "index.html уже актуален, коммитить нечего"
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add index.html
            git commit -m "chore: пересобрать index.html из p*.txt [skip ci]"
            git push
          fi
