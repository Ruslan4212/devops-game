name: Deploy

# GitHub Pages настроен на публикацию напрямую из ветки main
# (Settings → Pages → Deploy from a branch → main /root), поэтому сам деплой
# делает GitHub при пуше в main. Эта задача ничего не публикует и не коммитит —
# она только проверяет, что закоммиченные сборки не разошлись с исходниками:
#
#   index.html      — старая версия, собирается из p*.txt скриптом build.sh
#   next/index.html — переписанная версия, берётся из ветки vite-rewrite (play/index.html)
#
# Если проверка падает — пересобери и закоммить файлы вручную.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Проверить, что сборки в репозитории актуальны
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: index.html собран из актуальных p*.txt
        run: |
          bash build.sh
          if ! git diff --quiet -- index.html; then
            echo "::error::index.html отстал от p*.txt — выполни bash build.sh и закоммить результат"
            exit 1
          fi

      - name: next/index.html совпадает с веткой vite-rewrite
        run: |
          git fetch origin vite-rewrite --depth=1
          git show origin/vite-rewrite:play/index.html > /tmp/next.html
          if ! diff -q /tmp/next.html next/index.html >/dev/null; then
            echo "::error::next/index.html отстал от ветки vite-rewrite — обнови его из play/index.html и закоммить"
            exit 1
          fi
