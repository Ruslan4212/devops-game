name: Deploy

# GitHub Pages настроен на публикацию напрямую из ветки main
# (Settings → Pages → Deploy from a branch → main /root), поэтому сам деплой
# делает GitHub при пуше в main. Эта задача ничего не публикует и не коммитит —
# она только проверяет, что закоммиченные сборки не разошлись с исходниками:
#
#   index.html      — старая версия, собирается из p*.txt скриптом build.sh
#   next/index.html — версия vite-rewrite/play/index.html с проектным разделом из next/projects.js
#
# Если проверка падает — пересобери и закоммить файлы вручную.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Проверить, что сборки в репозитории актуальны
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: index.html собран из актуальных p*.txt
        run: |
          bash build.sh
          if ! git diff --quiet -- index.html; then
            echo "::error::index.html отстал от p*.txt — выполни bash build.sh и закоммить результат"
            exit 1
          fi

      - name: next/index.html собран из vite-rewrite и проектного раздела
        run: |
          git fetch origin vite-rewrite --depth=1
          git show origin/vite-rewrite:play/index.html > /tmp/next-base.html
          cp /tmp/next-base.html next/index.html
          npm run patch:next-projects
          if ! git diff --quiet -- next/index.html; then
            echo "::error::next/index.html не соответствует ветке vite-rewrite и проектному патчеру — выполни npm run patch:next-projects и закоммить результат"
            exit 1
          fi
