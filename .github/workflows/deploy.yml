name: Deploy

# GitHub Pages настроен на публикацию напрямую из ветки main (Settings → Pages →
# Deploy from a branch → main /root). Сам деплой делает GitHub при пуше в main,
# эта задача только следит, чтобы закоммиченные файлы были актуальны:
#   index.html      — пересобирается из p*.txt скриптом build.sh (старая версия, корень сайта);
#   next/index.html — одностраничный билд переписанной версии из ветки vite-rewrite (адрес /next/).

# Запускается и на пуш в vite-rewrite: тогда обновится только next/index.html,
# чтобы переписанная версия на сайте не отставала от ветки.
on:
  push:
    branches: [main, vite-rewrite]
  workflow_dispatch:

jobs:
  refresh:
    name: Обновить index.html и next/index.html, если они разошлись с исходниками
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # всегда работаем с main, даже если запуск пришёл с ветки vite-rewrite
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: bash build.sh
        run: bash build.sh

      - name: Забрать билд переписанной версии из ветки vite-rewrite
        run: |
          mkdir -p next
          git fetch origin vite-rewrite --depth=1
          git show origin/vite-rewrite:play/index.html > next/index.html

      - name: Закоммитить, если сборка изменилась
        run: |
          if git diff --quiet -- index.html next/index.html; then
            echo "index.html и next/index.html уже актуальны"
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add index.html next/index.html
            git commit -m "chore: обновить сборки (index.html из p*.txt, next/ из vite-rewrite) [skip ci]"
            git push
          fi
