name: Deploy

# Собирает index.html из p*.txt скриптом build.sh и публикует его на GitHub Pages
# через GitHub Actions (Settings → Pages → Source: GitHub Actions).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: bash build.sh
        run: bash build.sh
      - name: Собрать статику для публикации
        run: |
          mkdir -p _site
          cp index.html manifest.json sw.js icon.svg _site/
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
